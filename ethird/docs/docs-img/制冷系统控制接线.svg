<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="780" height="420" fill="#ffffff"/>
  <text x="24" y="32" font-size="18" font-weight="bold" fill="#20303f">制冷系统温度控制接线示意</text>

  <!-- 交流电源 -->
  <rect x="30" y="70" width="130" height="116" rx="6" fill="#eef4fb" stroke="#2d3436" stroke-width="2"/>
  <text x="95" y="108" font-size="13" fill="#20303f" text-anchor="middle">单相交流电源</text>
  <text x="95" y="130" font-size="12" fill="#556" text-anchor="middle">AC 220V / 50Hz</text>
  <text x="95" y="152" font-size="12" fill="#556" text-anchor="middle">（右侧电源面板）</text>
  <circle cx="160" cy="100" r="6" fill="#e04040" stroke="#7a2020"/>
  <circle cx="160" cy="156" r="6" fill="#111" stroke="#555"/>
  <text x="150" y="94" font-size="13" fill="#c0392b" text-anchor="end" font-weight="bold">L</text>
  <text x="150" y="176" font-size="13" fill="#20303f" text-anchor="end" font-weight="bold">N</text>

  <!-- 温度继电器 -->
  <rect x="250" y="250" width="210" height="112" rx="6" fill="#f3fbf3" stroke="#0c7b08" stroke-width="2"/>
  <text x="355" y="286" font-size="13" fill="#20303f" text-anchor="middle">温度继电器</text>
  <text x="355" y="306" font-size="12" fill="#556" text-anchor="middle">WTZK-50-C</text>
  <circle cx="460" cy="284" r="6" fill="#e04040" stroke="#7a2020"/>
  <circle cx="460" cy="330" r="6" fill="#111" stroke="#555"/>
  <text x="450" y="288" font-size="13" fill="#c0392b" text-anchor="end" font-weight="bold">NO</text>
  <text x="450" y="334" font-size="13" fill="#20303f" text-anchor="end" font-weight="bold">COM</text>

  <!-- 制冷系统 -->
  <rect x="580" y="60" width="170" height="250" rx="6" fill="#f7f7f2" stroke="#333" stroke-width="2"/>
  <text x="665" y="96" font-size="13" fill="#20303f" text-anchor="middle">制冷系统</text>
  <text x="665" y="116" font-size="12" fill="#556" text-anchor="middle">压缩机 / 蒸发器 / 冷凝器</text>
  <circle cx="580" cy="130" r="6" fill="#e04040" stroke="#7a2020"/>
  <circle cx="580" cy="170" r="6" fill="#111" stroke="#555"/>
  <circle cx="580" cy="240" r="6" fill="#e04040" stroke="#7a2020"/>
  <circle cx="580" cy="280" r="6" fill="#111" stroke="#555"/>
  <text x="590" y="134" font-size="12" fill="#c0392b">电源 L</text>
  <text x="590" y="174" font-size="12" fill="#20303f">电源 N</text>
  <text x="590" y="244" font-size="12" fill="#c0392b">控制 l</text>
  <text x="590" y="284" font-size="12" fill="#20303f">控制 r</text>

  <!-- 电源接线（AC → 制冷系统） -->
  <polyline points="160,100 380,100 380,130 580,130" fill="none" stroke="#e04040" stroke-width="3.5" stroke-linecap="round"/>
  <polyline points="160,156 440,156 440,170 580,170" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 控制接线（温度继电器 → 制冷系统） -->
  <polyline points="460,284 520,284 520,240 580,240" fill="none" stroke="#e04040" stroke-width="3.5" stroke-linecap="round"/>
  <polyline points="460,330 550,330 550,280 580,280" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 说明 -->
  <text x="30" y="392" font-size="13" fill="#20303f">① 交流电源 L/N → 制冷系统电源接口：接通后液晶屏点亮、压缩机才能起动。</text>
  <text x="30" y="412" font-size="13" fill="#20303f">② 温度继电器 NO/COM → 制冷系统控制端（模式转 REMOTE）：温度高于上限 NO 闭合→制冷，低于下限 NO 断开→停机。</text>
</svg>
