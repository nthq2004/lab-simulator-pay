<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e74c3c"/>
    </marker>
    <marker id="arrowK" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2d3436">项目一：测量三相绕组电阻（数字万用表 RES200 档）</text>

  <!-- ── 左侧：测量 U 相电阻 ── -->
  <g fill="#e74c3c" stroke="#c0392b" stroke-width="1.5">
    <circle cx="110" cy="110" r="12"/><circle cx="110" cy="320" r="12"/>
    <circle cx="250" cy="110" r="12"/><circle cx="250" cy="320" r="12"/>
    <circle cx="390" cy="110" r="12"/><circle cx="390" cy="320" r="12"/>
  </g>
  <g font-size="15" fill="#2d3436" text-anchor="middle">
    <text x="110" y="92">U1</text><text x="110" y="350">U2</text>
    <text x="250" y="92">V1</text><text x="250" y="350">V2</text>
    <text x="390" y="92">W1</text><text x="390" y="350">W2</text>
  </g>
  <!-- 三相绕组锯齿 -->
  <g stroke="#2d3436" stroke-width="2.5" fill="none">
    <path d="M110,122 L104,140 L116,158 L104,176 L116,194 L104,212 L116,230 L104,248 L116,266 L104,284 L116,302 L110,308"/>
    <path d="M250,122 L244,140 L256,158 L244,176 L256,194 L244,212 L256,230 L244,248 L256,266 L244,284 L256,302 L250,308"/>
    <path d="M390,122 L384,140 L396,158 L384,176 L396,194 L384,212 L396,230 L384,248 L396,266 L384,284 L396,302 L390,308"/>
  </g>
  <!-- 万用表 -->
  <rect x="60" y="372" width="150" height="62" rx="8" fill="#dff0f8" stroke="#2980b9" stroke-width="2"/>
  <text x="135" y="400" text-anchor="middle" font-size="16" font-weight="bold" fill="#2980b9">数字万用表</text>
  <text x="135" y="422" text-anchor="middle" font-size="13" fill="#2d3436">档位 RES200</text>
  <!-- 红表笔：V 插孔 → U1 -->
  <line x1="85" y1="372" x2="110" y2="122" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowR)"/>
  <text x="30" y="185" font-size="13" fill="#e74c3c" transform="rotate(-16 30 185)">红表笔(V)→U1</text>
  <!-- 黑表笔：COM 插孔 → U2 -->
  <line x1="185" y1="372" x2="110" y2="308" stroke="#333" stroke-width="3" marker-end="url(#arrowK)"/>
  <text x="196" y="372" font-size="13" fill="#333">黑表笔(COM)→U2</text>
  <!-- 读数标注 -->
  <text x="250" y="400" font-size="15" fill="#27ae60" font-weight="bold">LCD 显示 ≈ 2.5Ω</text>
  <text x="250" y="423" font-size="13" fill="#555">三相绕组电阻平衡，V、W 相依次测量</text>

  <!-- ── 右侧：Y 接法 ── -->
  <text x="620" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d3436">Y 星形接法（尾端短接）</text>
  <g fill="#e74c3c" stroke="#c0392b" stroke-width="1.5">
    <circle cx="560" cy="120" r="9"/><circle cx="680" cy="120" r="9"/>
    <circle cx="560" cy="225" r="9"/><circle cx="680" cy="225" r="9"/>
  </g>
  <g font-size="13" fill="#2d3436" text-anchor="middle">
    <text x="560" y="105">U1</text><text x="680" y="105">W1</text>
    <text x="560" y="245">U2</text><text x="680" y="245">W2</text>
  </g>
  <g stroke="#2d3436" stroke-width="2" fill="none">
    <path d="M560,129 L556,144 L564,159 L556,174 L564,189 L556,204 L560,216"/>
    <path d="M680,129 L676,144 L684,159 L676,174 L684,189 L676,204 L680,216"/>
  </g>
  <text x="620" y="172" text-anchor="middle" font-size="13" fill="#2d3436">V 相</text>
  <line x1="560" y1="225" x2="620" y2="258" stroke="#2d3436" stroke-width="2"/>
  <line x1="620" y1="120" x2="620" y2="258" stroke="#2d3436" stroke-width="2"/>
  <line x1="680" y1="225" x2="620" y2="258" stroke="#2d3436" stroke-width="2"/>
  <circle cx="620" cy="258" r="6" fill="#f39c12" stroke="#e67e22"/>
  <text x="642" y="263" font-size="13" fill="#e67e22">星点（U2·V2·W2 短接）</text>

  <!-- ── 右侧下方：Δ 接法 ── -->
  <text x="620" y="318" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d3436">Δ 三角形接法（首尾相接）</text>
  <!-- 三角形三顶点 -->
  <circle cx="490" cy="352" r="9" fill="#e74c3c" stroke="#c0392b"/>
  <circle cx="610" cy="436" r="9" fill="#e74c3c" stroke="#c0392b"/>
  <circle cx="730" cy="352" r="9" fill="#e74c3c" stroke="#c0392b"/>
  <!-- 三条边（绕组） -->
  <g stroke="#2d3436" stroke-width="2.5" fill="none">
    <path d="M490,361 L462,378 L478,394 L452,410 L730,352"/>
    <path d="M612,427 L600,408 L618,392 L606,374 L618,358 L604,342 L612,345"/>
    <path d="M490,343 L522,328 L508,312 L538,296 L538,318 L536,362 L538,336"/>
  </g>
  <g font-size="13" fill="#2d3436" text-anchor="middle">
    <text x="490" y="330">U1·W2</text>
    <text x="610" y="460">V1·U2</text>
    <text x="730" y="330">W1·V2</text>
  </g>
  <text x="610" y="305" font-size="12" fill="#8e8e8e" text-anchor="middle">三边绕组首尾相接成闭环</text>
</svg>