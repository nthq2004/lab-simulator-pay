<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" font-family="Microsoft YaHei, sans-serif">
  <rect width="1000" height="670" fill="#ffffff"/>

  <!-- ═══ 电压-时间曲线 ═══ -->
  <text x="30" y="34" font-size="16" font-weight="bold" fill="#1a202c">应急汇流排电压 - 时间曲线（一次完整的失电 - 转电 - 恢复过程）</text>

  <!-- 坐标轴 -->
  <line x1="90" y1="300" x2="950" y2="300" stroke="#4a5568" stroke-width="2"/>
  <line x1="90" y1="70" x2="90" y2="300" stroke="#4a5568" stroke-width="2"/>
  <g fill="#718096" font-size="12" text-anchor="end">
    <text x="84" y="104">400V</text>
    <text x="84" y="204">200V</text>
    <text x="84" y="304">0V</text>
  </g>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="90" y1="100" x2="950" y2="100"/>
    <line x1="90" y1="200" x2="950" y2="200"/>
  </g>

  <!-- 事件虚线 -->
  <g stroke="#cbd5e0" stroke-width="1.2" stroke-dasharray="5 4">
    <line x1="150" y1="70" x2="150" y2="300"/>
    <line x1="470" y1="70" x2="470" y2="300"/>
    <line x1="680" y1="70" x2="680" y2="300"/>
    <line x1="820" y1="70" x2="820" y2="300"/>
    <line x1="890" y1="70" x2="890" y2="300"/>
  </g>
  <!-- 时间刻度 -->
  <g fill="#718096" font-size="12" text-anchor="middle">
    <text x="150" y="320">t₀ 失电</text>
    <text x="470" y="320">t₀+18s 应急投入</text>
    <text x="680" y="320">主电恢复</text>
    <text x="820" y="320">+8s 联络合</text>
    <text x="898" y="338">+13s 停机</text>
  </g>

  <!-- 电压曲线：应急供电段（橙） -->
  <polyline points="90,100 150,100 150,300 470,300 470,100 820,100"
            fill="none" stroke="#c05621" stroke-width="3.5"/>
  <!-- 电压曲线：主电网供电段（绿） -->
  <polyline points="820,100 950,100" fill="none" stroke="#276749" stroke-width="3.5"/>

  <!-- 曲线标注 -->
  <text x="560" y="90" fill="#c05621" font-size="12" font-weight="bold">应急发电机供电 400V</text>
  <text x="300" y="286" fill="#c05621" font-size="12">失电空窗期（约 18s，应急汇流排无电）</text>
  <text x="885" y="90" fill="#276749" font-size="12" font-weight="bold" text-anchor="middle">主电网供电</text>
  <text x="680" y="120" fill="#276749" font-size="11.5" text-anchor="middle">联络合闸后转由主电网供电</text>

  <!-- ═══ 效能指标表 ═══ -->
  <text x="30" y="382" font-size="16" font-weight="bold" fill="#1a202c">应急供电效能指标（仿真测试记录）</text>
  <g>
    <rect x="30" y="400" width="940" height="42" fill="#edf2f7" stroke="#a0aec0"/>
    <rect x="30" y="442" width="940" height="38" fill="#ffffff" stroke="#cbd5e0"/>
    <rect x="30" y="480" width="940" height="38" fill="#f7fafc" stroke="#cbd5e0"/>
    <rect x="30" y="518" width="940" height="38" fill="#ffffff" stroke="#cbd5e0"/>
    <rect x="30" y="556" width="940" height="38" fill="#f7fafc" stroke="#cbd5e0"/>
    <rect x="30" y="594" width="940" height="38" fill="#ffffff" stroke="#cbd5e0"/>
    <g font-weight="bold" fill="#2d3748">
      <text x="48" y="426">效能指标</text>
      <text x="380" y="426">技术要求</text>
      <text x="640" y="426">仿真实测</text>
      <text x="830" y="426">结论</text>
    </g>
    <g fill="#2d3748">
      <text x="48" y="466">主电失电后联络开关分闸</text>
      <text x="380" y="466">立即断开（防非同期）</text>
      <text x="640" y="466">t₀ 时刻动作</text>
      <text x="830" y="466" fill="#276749">合格</text>

      <text x="48" y="504">应急发电机自动起动</text>
      <text x="380" y="504">≤ 10s</text>
      <text x="640" y="504">约 10s</text>
      <text x="830" y="504" fill="#276749">合格</text>

      <text x="48" y="542">应急主开关自动合闸</text>
      <text x="380" y="542">≤ 18s</text>
      <text x="640" y="542">约 18s</text>
      <text x="830" y="542" fill="#276749">合格</text>

      <text x="48" y="580">应急母线电压 / 频率</text>
      <text x="380" y="580">400V±5% / 50Hz±2%</text>
      <text x="640" y="580">约 400V / 50Hz</text>
      <text x="830" y="580" fill="#276749">合格</text>

      <text x="48" y="618">应急负载供电</text>
      <text x="380" y="618">三盏应急灯点亮</text>
      <text x="640" y="618">el1 ~ el3 全亮</text>
      <text x="830" y="618" fill="#276749">合格</text>
    </g>
  </g>
</svg>
