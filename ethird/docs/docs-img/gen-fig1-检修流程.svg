<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="980" height="760" fill="#fbfcfe"/>
  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f3b57">图4  高压发电机检修流程</text>

  <defs>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3b6ea5"/>
    </marker>
  </defs>

  <g font-size="14">
    <rect x="250" y="60" width="480" height="58" rx="10" fill="#eef4fb" stroke="#3b6ea5" stroke-width="2"/>
    <text x="490" y="84" text-anchor="middle" font-weight="bold" fill="#1f3b57">① 自动接线 → 遥控面板置【自动】</text>
    <text x="490" y="105" text-anchor="middle" font-size="11.5" fill="#3b6ea5">电网无电：延时 3s 自动起动 1# 机组 → 延时 5s 自动合闸供电</text>

    <rect x="250" y="148" width="480" height="58" rx="10" fill="#eef4fb" stroke="#3b6ea5" stroke-width="2"/>
    <text x="490" y="172" text-anchor="middle" font-weight="bold" fill="#1f3b57">② 遥控面板切【手动】，分断真空断路器</text>
    <text x="490" y="193" text-anchor="middle" font-size="11.5" fill="#3b6ea5">发电机与电网解列，转入就地控制</text>

    <rect x="250" y="236" width="480" height="58" rx="10" fill="#fff6e5" stroke="#d98e00" stroke-width="2"/>
    <text x="490" y="260" text-anchor="middle" font-weight="bold" fill="#a8670a">③ 切换励磁回路 OFF（灭磁）→ 切【本地】→ 停机</text>
    <text x="490" y="281" text-anchor="middle" font-size="11.5" fill="#a8670a">灭磁平滑衰减，电压归零后停原动机</text>

    <rect x="250" y="324" width="480" height="58" rx="10" fill="#eef7f0" stroke="#2e8b57" stroke-width="2"/>
    <text x="490" y="348" text-anchor="middle" font-weight="bold" fill="#1e6b3a">④ 验电：验电端依次靠近发电机出线 U/V/W</text>
    <text x="490" y="369" text-anchor="middle" font-size="11.5" fill="#2e8b57">接地端可靠接地，逐相验电确认无电（不报警）</text>

    <rect x="250" y="412" width="480" height="58" rx="10" fill="#eef7f0" stroke="#2e8b57" stroke-width="2"/>
    <text x="490" y="436" text-anchor="middle" font-weight="bold" fill="#1e6b3a">⑤ 手车摇至【试验位】→ 解锁电磁锁 → 摇柄 5 次合接地开关</text>
    <text x="490" y="457" text-anchor="middle" font-size="11.5" fill="#2e8b57">三相出线可靠接地，泄放残余电荷</text>

    <rect x="250" y="500" width="480" height="58" rx="10" fill="#f7f8fa" stroke="#9aa3ad" stroke-width="2"/>
    <text x="490" y="524" text-anchor="middle" font-weight="bold" fill="#4a5560">⑥ 检修作业</text>
    <text x="490" y="545" text-anchor="middle" font-size="11.5" fill="#7f8c8d">挂牌、装设遮栏、专人监护，检查绕组/励磁/冷却/二次回路</text>

    <rect x="250" y="588" width="480" height="58" rx="10" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
    <text x="490" y="612" text-anchor="middle" font-weight="bold" fill="#1e6b3a">⑦ 恢复：拆接地/夹板 → 拆接地开关 → 摇试验位 → 工作位</text>
    <text x="490" y="633" text-anchor="middle" font-size="11.5" fill="#2e8b57">恢复二次回路，送电前测量绝缘并空载试运行</text>
  </g>

  <g stroke="#3b6ea5" stroke-width="2.5" fill="none" marker-end="url(#ag)">
    <line x1="490" y1="118" x2="490" y2="146"/>
    <line x1="490" y1="206" x2="490" y2="234"/>
    <line x1="490" y1="294" x2="490" y2="322"/>
    <line x1="490" y1="382" x2="490" y2="410"/>
    <line x1="490" y1="470" x2="490" y2="498"/>
    <line x1="490" y1="558" x2="490" y2="586"/>
  </g>

  <!-- 右侧安全提示 -->
  <g>
    <rect x="748" y="236" width="210" height="58" rx="8" fill="#fdecea" stroke="#c0392b"/>
    <text x="853" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#a93226">停机即灭磁</text>
    <text x="853" y="278" text-anchor="middle" font-size="10.5" fill="#c0392b">励磁开关 OFF 或灭磁继电器动作</text>

    <rect x="748" y="324" width="210" height="58" rx="8" fill="#fdecea" stroke="#c0392b"/>
    <text x="853" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#a93226">验电三要素</text>
    <text x="853" y="366" text-anchor="middle" font-size="10.5" fill="#c0392b">先自检、戴绝缘手套、逐相验电</text>

    <rect x="748" y="412" width="210" height="58" rx="8" fill="#fdecea" stroke="#c0392b"/>
    <text x="853" y="434" text-anchor="middle" font-size="12" font-weight="bold" fill="#a93226">保护有效性</text>
    <text x="853" y="454" text-anchor="middle" font-size="10.5" fill="#c0392b">微机保护仅在主开关闭合时有效</text>
  </g>

  <text x="30" y="620" font-size="12.5" fill="#4a5560" font-weight="bold">停电·验电·放电·接地</text>
  <text x="30" y="640" font-size="12.5" fill="#4a5560" font-weight="bold">缺一不可</text>
</svg>
