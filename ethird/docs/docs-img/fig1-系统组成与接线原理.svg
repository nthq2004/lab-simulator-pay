<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="940" height="360" fill="#fbfcfe"/>
  <text x="470" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2d3d">图1 铅酸蓄电池充放电系统组成与接线原理</text>

  <!-- 交流电源 -->
  <rect x="55" y="70" width="155" height="110" rx="10" fill="#e8eaed" stroke="#7a8899" stroke-width="2"/>
  <text x="132" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">交流电源</text>
  <text x="132" y="130" text-anchor="middle" font-size="13" fill="#555566">AC 220V / 50Hz</text>
  <text x="132" y="152" text-anchor="middle" font-size="12" fill="#888">电源开关</text>
  <circle cx="210" cy="105" r="6" fill="#c0392b"/>
  <circle cx="210" cy="160" r="6" fill="#222"/>
  <text x="222" y="100" font-size="11" fill="#888">P</text>
  <text x="222" y="168" font-size="11" fill="#888">N</text>

  <!-- 充放电板 -->
  <rect x="285" y="60" width="235" height="215" rx="12" fill="#eef1f5" stroke="#5b6b7c" stroke-width="2"/>
  <text x="402" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">充放电板 CH1</text>
  <rect x="305" y="102" width="85" height="34" rx="4" fill="#0e1218"/>
  <text x="347" y="126" text-anchor="middle" font-size="14" fill="#7fdbff">27.0 V</text>
  <rect x="410" y="102" width="85" height="34" rx="4" fill="#0e1218"/>
  <text x="452" y="126" text-anchor="middle" font-size="14" fill="#7fdbff">5.00 A</text>
  <circle cx="315" cy="170" r="8" fill="#40e060"/>
  <text x="332" y="175" font-size="12" fill="#555566">交流指示灯</text>
  <text x="402" y="205" text-anchor="middle" font-size="12" fill="#555566">浮充 27V / 均充 28.8V</text>
  <text x="402" y="228" text-anchor="middle" font-size="12" fill="#555566">仪表切换：I路 / 关 / II路</text>
  <text x="402" y="251" text-anchor="middle" font-size="12" fill="#555566">CH1 电流调节旋钮</text>
  <circle cx="285" cy="105" r="5" fill="#c0392b"/>
  <circle cx="285" cy="160" r="5" fill="#222"/>
  <line x1="210" y1="105" x2="285" y2="105" stroke="#c0392b" stroke-width="3"/>
  <line x1="210" y1="160" x2="285" y2="160" stroke="#222" stroke-width="3"/>

  <!-- 输出母线 -->
  <line x1="520" y1="110" x2="900" y2="110" stroke="#c0392b" stroke-width="3"/>
  <line x1="520" y1="260" x2="900" y2="260" stroke="#222" stroke-width="3"/>
  <circle cx="520" cy="110" r="5" fill="#c0392b"/>
  <circle cx="520" cy="260" r="5" fill="#222"/>
  <text x="905" y="106" font-size="12" fill="#c0392b">CH1+</text>
  <text x="905" y="266" font-size="12" fill="#222">CH1−</text>

  <!-- 蓄电池支路 -->
  <line x1="600" y1="110" x2="600" y2="150" stroke="#c0392b" stroke-width="3"/>
  <rect x="540" y="150" width="120" height="85" rx="6" fill="#e6ecf2" stroke="#3a5a7a" stroke-width="2"/>
  <line x1="540" y1="192" x2="660" y2="192" stroke="#3a5a7a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="600" y="176" text-anchor="middle" font-size="12" fill="#2c3e50">1# 蓄电池 12V</text>
  <text x="600" y="216" text-anchor="middle" font-size="12" fill="#2c3e50">2# 蓄电池 12V</text>
  <text x="547" y="167" font-size="14" fill="#c0392b" font-weight="bold">+</text>
  <text x="648" y="230" font-size="14" fill="#222" font-weight="bold">−</text>
  <line x1="600" y1="235" x2="600" y2="260" stroke="#222" stroke-width="3"/>
  <text x="612" y="146" font-size="12" fill="#888">串联 24V</text>

  <!-- 负载支路 -->
  <line x1="800" y1="110" x2="800" y2="148" stroke="#c0392b" stroke-width="3"/>
  <rect x="772" y="148" width="56" height="34" rx="5" fill="#dfe6e9" stroke="#2d3436" stroke-width="2"/>
  <text x="800" y="170" text-anchor="middle" font-size="12" fill="#2c3e50">开关</text>
  <line x1="800" y1="182" x2="800" y2="198" stroke="#555566" stroke-width="3"/>
  <rect x="770" y="198" width="60" height="34" rx="4" fill="#babd8f" stroke="#5b6b7c" stroke-width="1.5"/>
  <text x="800" y="220" text-anchor="middle" font-size="12" fill="#333">20 Ω</text>
  <line x1="800" y1="232" x2="800" y2="260" stroke="#222" stroke-width="3"/>
  <text x="812" y="146" font-size="12" fill="#888">负载支路</text>
  <text x="812" y="256" font-size="12" fill="#c0392b">放电 I≈1.2A</text>

  <text x="470" y="322" text-anchor="middle" font-size="12" fill="#667788">蓄电池组与负载支路并联在充放电板 CH1 输出端；充电时接通 CH1，放电时断开交流、合上负荷开关</text>
</svg>
