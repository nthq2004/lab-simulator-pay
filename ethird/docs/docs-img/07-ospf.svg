<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2a33">图 7　OSPF：链路状态泛洪 + SPF 最短路径计算</text>

  <!-- 三台设备 -->
  <rect x="70" y="90" width="180" height="80" rx="12" fill="#e8f1fb" stroke="#1395eb" stroke-width="2"/>
  <text x="160" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b5c94">L3SW1</text>
  <text x="160" y="146" text-anchor="middle" font-size="11" fill="#2b6f9c">Router-ID 1.1.1.1</text>

  <rect x="360" y="90" width="180" height="80" rx="12" fill="#e8f1fb" stroke="#1395eb" stroke-width="2"/>
  <text x="450" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b5c94">R1</text>
  <text x="450" y="146" text-anchor="middle" font-size="11" fill="#2b6f9c">Router-ID 2.2.2.2</text>

  <rect x="650" y="90" width="180" height="80" rx="12" fill="#e8f1fb" stroke="#1395eb" stroke-width="2"/>
  <text x="740" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b5c94">R2</text>
  <text x="740" y="146" text-anchor="middle" font-size="11" fill="#2b6f9c">Router-ID 3.3.3.3</text>

  <line x1="250" y1="130" x2="360" y2="130" stroke="#7a8b99" stroke-width="2"/>
  <line x1="540" y1="130" x2="650" y2="130" stroke="#7a8b99" stroke-width="2"/>
  <text x="305" y="120" text-anchor="middle" font-size="11" fill="#5b6b7a">cost=1</text>
  <text x="595" y="120" text-anchor="middle" font-size="11" fill="#5b6b7a">cost=1</text>

  <!-- 邻居 -->
  <text x="450" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#33424f">① 建立邻居（Hello）→ 形成邻接关系 Full（display ospf peer）</text>
  <g font-size="11" fill="#2b6f9c">
    <text x="450" y="226" text-anchor="middle">Neighbor ID　2.2.2.2　State Full　Interface Vlanif100</text>
  </g>

  <!-- 泛洪 -->
  <text x="450" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#33424f">② 泛洪链路状态（LSA）→ 每台设备得到一致的链路状态数据库</text>
  <rect x="200" y="282" width="500" height="70" rx="10" fill="#f7f9fb" stroke="#4a5a68"/>
  <text x="450" y="308" text-anchor="middle" font-size="12" fill="#33424f">LSDB：L3SW1 ↔ R1（cost 1）　R1 ↔ R2（cost 1）　R2 直连 203.0.113.0/24</text>
  <text x="450" y="332" text-anchor="middle" font-size="12" fill="#5b6b7a">每台设备都知道整个区域的拓扑，而不是邻居的“道听途说”。</text>

  <!-- SPF -->
  <text x="450" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#33424f">③ 各自运行 SPF（Dijkstra）计算到各网段的最短路径</text>
  <g>
    <line x1="314" y1="420" x2="436" y2="420" stroke="#1fa97a" stroke-width="3"/>
    <line x1="464" y1="420" x2="616" y2="420" stroke="#1fa97a" stroke-width="3"/>
    <circle cx="300" cy="420" r="14" fill="#dff3ec" stroke="#1fa97a" stroke-width="2"/>
    <circle cx="450" cy="420" r="14" fill="#dff3ec" stroke="#1fa97a" stroke-width="2"/>
    <circle cx="630" cy="420" r="14" fill="#dff3ec" stroke="#1fa97a" stroke-width="2"/>
    <text x="450" y="458" text-anchor="middle" font-size="12" fill="#0d7a56">L3SW1 → 203.0.113.0/24：cost = 1 + 1 = 2，下一跳 10.10.10.2</text>
  </g>

  <text x="450" y="502" text-anchor="middle" font-size="12" fill="#5b6b7a">OSPF 管理距离（Pre）为 10，优于 RIP 的 100；支持中大型网络、收敛更快。</text>
  <text x="450" y="526" text-anchor="middle" font-size="12" fill="#5b6b7a">常用命令：ospf 1 router-id &lt;id&gt; → area 0 → network &lt;网段&gt; &lt;反掩码&gt;；display ospf peer / display ip routing-table protocol ospf</text>
</svg>
