<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Microsoft YaHei, sans-serif">
  <rect width="760" height="340" fill="#fbfcfe"/>
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f3b57">图 3  功率因数测量与电容补偿</text>

  <!-- ═══ 主回路连线 ═══ -->
  <g stroke="#3b6ea5" stroke-width="3" fill="none">
    <!-- AC L → 功率计 -->
    <line x1="100" y1="110" x2="140" y2="110"/>
    <!-- 功率计 → 负载 -->
    <line x1="260" y1="110" x2="340" y2="110"/>
    <!-- 负载 → 中性线 -->
    <path d="M480 110 L620 110 L620 260"/>
    <!-- AC N → 中性线 -->
    <line x1="70" y1="140" x2="70" y2="260"/>
    <!-- 中性线 -->
    <line x1="70" y1="260" x2="620" y2="260"/>
  </g>

  <!-- ═══ AC 电源 ═══ -->
  <rect x="40" y="80" width="60" height="60" rx="8" fill="#eef4fb" stroke="#3b6ea5" stroke-width="2"/>
  <text x="70" y="108" text-anchor="middle" font-size="13" fill="#1f3b57">AC</text>
  <text x="70" y="128" text-anchor="middle" font-size="12" fill="#5b6b7c">220V</text>
  <text x="106" y="102" font-size="11" fill="#c0392b" font-weight="bold">L</text>
  <text x="70" y="278" text-anchor="middle" font-size="11" fill="#3b6ea5" font-weight="bold">N</text>

  <!-- ═══ 功率计 ═══ -->
  <rect x="140" y="80" width="120" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="200" y="106" text-anchor="middle" font-size="14" fill="#0d47a1">功率计</text>
  <text x="200" y="126" text-anchor="middle" font-size="11.5" fill="#1565c0">I+ 串入 · U 并联</text>

  <!-- ═══ 负载 ═══ -->
  <rect x="340" y="80" width="140" height="60" rx="8" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="410" y="106" text-anchor="middle" font-size="14" fill="#1e6b3a">镇流器 + 灯管</text>
  <text x="410" y="126" text-anchor="middle" font-size="11.5" fill="#2e8b57">（感性负载）</text>

  <!-- ═══ 补偿电容（并联于负载两端） ═══ -->
  <g stroke="#c62828" stroke-width="3" fill="none">
    <line x1="340" y1="110" x2="340" y2="175"/>
    <line x1="320" y1="175" x2="360" y2="175"/>
    <line x1="320" y1="191" x2="360" y2="191"/>
    <line x1="340" y1="191" x2="340" y2="260"/>
  </g>
  <circle cx="340" cy="110" r="4.5" fill="#c62828"/>
  <circle cx="340" cy="260" r="4.5" fill="#c62828"/>
  <text x="382" y="180" font-size="14" fill="#c62828" font-weight="bold">C = 5μF</text>
  <text x="382" y="199" font-size="12" fill="#c62828">并联补偿（并接于负载两端）</text>

  <!-- ═══ 对比表 ═══ -->
  <g font-size="13">
    <rect x="80" y="280" width="280" height="40" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
    <text x="220" y="305" text-anchor="middle" fill="#f57f17">补偿前：PF ≈ 0.4~0.6（感性）</text>
    <rect x="400" y="280" width="280" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="540" y="305" text-anchor="middle" fill="#1b5e20">补偿后：I 下降，PF 明显提高</text>
  </g>
</svg>
