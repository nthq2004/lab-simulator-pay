<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>

  <defs>
    <marker id="rArr" markerWidth="9" markerHeight="9" refX="3" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L6,4.5 L0,9 z" fill="#5f6368"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#37474f">逆功率模拟：减小 cosφ 使有功反向</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="180" x2="820" y2="180" stroke="#90a4ae" stroke-width="1.5"/>
  <line x1="100" y1="60" x2="100" y2="300" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="828" y="184" font-size="11" fill="#90a4ae">ωt</text>

  <!-- 电压 u 波形（相位 0°） -->
  <path d="M120 180 L202 123 L285 100 L367 123 L450 180 L532 237 L615 260 L697 237 L780 180"
        fill="none" stroke="#1a73e8" stroke-width="2.5"/>
  <text x="285" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a73e8">u（线电压）</text>

  <!-- 电流 i 波形（滞后 100°） -->
  <path d="M120 259 L202 245 L285 194 L367 134 L450 101 L532 114 L615 166 L697 226 L780 259"
        fill="none" stroke="#c5221f" stroke-width="2.5"/>
  <text x="450" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#c5221f">i（二次电流）</text>

  <!-- 相位差标注 -->
  <line x1="285" y1="325" x2="450" y2="325" stroke="#5f6368" stroke-width="1.5"
        marker-start="url(#rArr)" marker-end="url(#rArr)"/>
  <text x="367" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#5f6368">Δφ = 100°</text>

  <!-- 公式与结论 -->
  <rect x="80" y="366" width="740" height="56" rx="10" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.8"/>
  <text x="450" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#8430ce">P = U · I · cosφ　｜　φ = 100° → cosφ = −0.17 &lt; 0 → 有功功率为负（逆功率）</text>
  <text x="450" y="411" text-anchor="middle" font-size="11" fill="#5f6368">脱扣器检测到 P 低于 −10%·Pr 并延时 8s → 逆功率脱扣</text>
</svg>
