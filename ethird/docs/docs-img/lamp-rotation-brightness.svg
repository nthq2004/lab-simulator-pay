<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="800" height="430" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a252f">旋转法三灯亮度随相位差的变化（熄灭点与最亮点相差 180°）</text>

  <!-- 坐标轴 -->
  <line x1="40" y1="60" x2="40" y2="340" stroke="#1a252f" stroke-width="1.5"/>
  <line x1="40" y1="340" x2="760" y2="340" stroke="#1a252f" stroke-width="1.5"/>
  <text x="22" y="205" font-size="12" fill="#555" transform="rotate(-90 22 205)" text-anchor="middle">灯亮度</text>
  <text x="770" y="345" font-size="12" fill="#555">Δφ</text>
  <text x="30" y="66" font-size="11" fill="#555" text-anchor="end">亮</text>
  <text x="30" y="344" font-size="11" fill="#555" text-anchor="end">灭</text>

  <!-- 竖直网格与刻度 -->
  <g stroke="#dde5ec" stroke-width="1" stroke-dasharray="4 4">
    <line x1="160" y1="60" x2="160" y2="340"/>
    <line x1="280" y1="60" x2="280" y2="340"/>
    <line x1="400" y1="60" x2="400" y2="340"/>
    <line x1="520" y1="60" x2="520" y2="340"/>
    <line x1="640" y1="60" x2="640" y2="340"/>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="40" y="360">0°</text>
    <text x="160" y="360">60°</text>
    <text x="280" y="360">120°</text>
    <text x="400" y="360">180°</text>
    <text x="520" y="360">240°</text>
    <text x="640" y="360">300°</text>
    <text x="760" y="360">360°</text>
  </g>

  <!-- 合闸时机标注（0°） -->
  <line x1="40" y1="60" x2="40" y2="340" stroke="#e74c3c" stroke-width="2" opacity="0.35"/>
  <text x="46" y="52" font-size="12" font-weight="bold" fill="#e74c3c">0°：可合闸</text>

  <!-- 灯1（12点，红）：谷0 → 峰180 → 谷360 -->
  <polyline points="40,340 400,60 760,340" fill="none" stroke="#d33" stroke-width="3"/>
  <!-- 灯2（4点，绿）：0→0.67 谷120 峰300 →0.67 -->
  <polyline points="40,152.4 280,340 640,60 760,152.4" fill="none" stroke="#2e9e4f" stroke-width="3"/>
  <!-- 灯3（8点，蓝）：0→0.67 峰60 →0.67 谷240 →0.67 -->
  <polyline points="40,152.4 160,60 280,152.4 520,340 760,152.4" fill="none" stroke="#1565c0" stroke-width="3"/>

  <!-- 峰谷关键点 -->
  <g fill="#ffffff" stroke-width="2.5">
    <circle cx="400" cy="60" r="5" stroke="#d33"/>
    <circle cx="280" cy="340" r="5" stroke="#2e9e4f"/>
    <circle cx="640" cy="60" r="5" stroke="#2e9e4f"/>
    <circle cx="160" cy="60" r="5" stroke="#1565c0"/>
    <circle cx="520" cy="340" r="5" stroke="#1565c0"/>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="400" y="48" fill="#d33" font-weight="bold">灯1 最亮</text>
    <text x="280" y="330" fill="#2e9e4f" font-weight="bold">灯2 灭</text>
    <text x="640" y="48" fill="#2e9e4f" font-weight="bold">灯2 最亮</text>
    <text x="160" y="48" fill="#1565c0" font-weight="bold">灯3 最亮</text>
    <text x="520" y="330" fill="#1565c0" font-weight="bold">灯3 灭</text>
  </g>

  <!-- 图例 -->
  <g font-size="13" font-weight="bold">
    <rect x="560" y="70" width="190" height="86" rx="6" fill="#f7fafc" stroke="#cdd8e0"/>
    <line x1="572" y1="90" x2="604" y2="90" stroke="#d33" stroke-width="3"/>
    <text x="612" y="95" fill="#1a252f">灯1（12点，直连A）</text>
    <line x1="572" y1="118" x2="604" y2="118" stroke="#2e9e4f" stroke-width="3"/>
    <text x="612" y="123" fill="#1a252f">灯2（4点，接L2—C）</text>
    <line x1="572" y1="146" x2="604" y2="146" stroke="#1565c0" stroke-width="3"/>
    <text x="612" y="151" fill="#1a252f">灯3（8点，接L3—B）</text>
  </g>

  <!-- 底部说明 -->
  <text x="400" y="404" text-anchor="middle" font-size="13" fill="#555">正频差（待并机快）：熄灭点按 灯1(0°)→灯2(120°)→灯3(240°) 顺时针旋转；负频差反向旋转</text>
</svg>
