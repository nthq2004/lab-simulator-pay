<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="840" height="400" fill="#ffffff"/>
  <text x="420" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2a33">图 4　同一网段判断：用掩码算出网络地址再比较</text>

  <rect x="40" y="52" width="760" height="150" rx="10" fill="#f1fbf1" stroke="#9ad39a"/>
  <text x="60" y="80" font-size="14" font-weight="bold" fill="#2f8f43">例 1：同一网段（可以二层互通）</text>
  <g font-family="Consolas, monospace" font-size="15" fill="#1f2a33">
    <text x="60" y="112">PC1  192.168.1.2   AND 255.255.255.0  →  网络地址 192.168.1.0</text>
    <text x="60" y="144">PC2  192.168.1.3   AND 255.255.255.0  →  网络地址 192.168.1.0</text>
  </g>
  <text x="60" y="180" font-size="14" fill="#2f8f43">网络地址相同 → 同一网段，PC1 与 PC2 可直接通信（经交换机转发）。</text>

  <rect x="40" y="220" width="760" height="150" rx="10" fill="#fdeeee" stroke="#e7a3a3"/>
  <text x="60" y="248" font-size="14" font-weight="bold" fill="#c0392b">例 2：不同网段（需要路由器）</text>
  <g font-family="Consolas, monospace" font-size="15" fill="#1f2a33">
    <text x="60" y="280">PC1  192.168.1.2   AND 255.255.255.0  →  网络地址 192.168.1.0</text>
    <text x="60" y="312">PC3  192.168.2.2   AND 255.255.255.0  →  网络地址 192.168.2.0</text>
  </g>
  <text x="60" y="348" font-size="14" fill="#c0392b">网络地址不同 → 不同网段，必须经默认网关（路由器）转发才能互通。</text>
</svg>
