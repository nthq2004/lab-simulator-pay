<svg width="760" height="360" viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#fcfcfc" stroke="#ccc" stroke-width="1" rx="8"/>
  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">图1 抱闸（失电）状态</text>

  <!-- 转轴 -->
  <line x1="15" y1="180" x2="745" y2="180" stroke="#666" stroke-width="10" stroke-linecap="round"/>
  <text x="700" y="166" font-size="12" fill="#444">转轴</text>

  <!-- 磁轭 E 形铁心 -->
  <rect x="40" y="70"  width="30" height="220" fill="#b9c4d4" stroke="#5a6a84" stroke-width="2"/>   <!-- 左竖梁 -->
  <rect x="40" y="70"  width="130" height="40"  fill="#c2cddd" stroke="#5a6a84" stroke-width="2"/>  <!-- 上横梁 -->
  <rect x="40" y="250" width="130" height="40"  fill="#c2cddd" stroke="#5a6a84" stroke-width="2"/>  <!-- 下横梁 -->
  <rect x="130" y="150" width="40" height="60"  fill="#c2cddd" stroke="#5a6a84" stroke-width="2"/>  <!-- 中柱 -->
  <text x="90" y="330" text-anchor="middle" font-size="13" fill="#3c4a63">磁轭（E形静铁心）</text>

  <!-- 线圈 -->
  <rect x="95" y="118" width="36" height="124" fill="#f5a623" stroke="#b96b00" stroke-width="2" rx="4"/>
  <line x1="101" y1="132" x2="125" y2="132" stroke="#b96b00" stroke-width="2"/>
  <line x1="101" y1="146" x2="125" y2="146" stroke="#b96b00" stroke-width="2"/>
  <line x1="101" y1="160" x2="125" y2="160" stroke="#b96b00" stroke-width="2"/>
  <line x1="101" y1="174" x2="125" y2="174" stroke="#b96b00" stroke-width="2"/>
  <line x1="101" y1="188" x2="125" y2="188" stroke="#b96b00" stroke-width="2"/>
  <line x1="101" y1="202" x2="125" y2="202" stroke="#b96b00" stroke-width="2"/>
  <line x1="101" y1="216" x2="125" y2="216" stroke="#b96b00" stroke-width="2"/>
  <text x="113" y="336" text-anchor="middle" font-size="13" fill="#8a5200">线圈</text>

  <!-- 复位弹簧（上、下，自然伸长） -->
  <path d="M175 52 q 10 -8 20 0 t 20 0 t 20 0" stroke="#2e7d32" stroke-width="3" fill="none"/>
  <path d="M175 62 q 10 -8 20 0 t 20 0 t 20 0" stroke="#2e7d32" stroke-width="3" fill="none"/>
  <path d="M175 312 q 10 8 20 0 t 20 0 t 20 0" stroke="#2e7d32" stroke-width="3" fill="none"/>
  <path d="M175 302 q 10 8 20 0 t 20 0 t 20 0" stroke="#2e7d32" stroke-width="3" fill="none"/>
  <text x="380" y="52" text-anchor="middle" font-size="12" fill="#2e7d32">复位弹簧（自然伸长）</text>
  <text x="380" y="334" text-anchor="middle" font-size="12" fill="#2e7d32">复位弹簧（自然伸长）</text>

  <!-- 衔铁 -->
  <rect x="230" y="100" width="60" height="160" fill="#e8e8e8" stroke="#555" stroke-width="2"/>
  <text x="260" y="340" text-anchor="middle" font-size="13" fill="#444">衔铁</text>

  <!-- 摩擦片 -->
  <rect x="290" y="112" width="16" height="136" fill="#a33" stroke="#5c1010" stroke-width="1.5" rx="2"/>
  <text x="298" y="348" text-anchor="middle" font-size="12" fill="#8a2020">摩擦片</text>

  <!-- 制动盘 -->
  <rect x="306" y="70" width="20" height="220" fill="#7ba7d0" stroke="#2a5a86" stroke-width="2"/>
  <circle cx="316" cy="180" r="10" fill="#fff" stroke="#2a5a86" stroke-width="2"/>
  <text x="316" y="60" text-anchor="middle" font-size="13" fill="#2a5a86">制动盘</text>

  <!-- 固定压板 -->
  <rect x="340" y="70" width="36" height="220" fill="#9a9a9a" stroke="#555" stroke-width="2"/>
  <text x="358" y="340" text-anchor="middle" font-size="12" fill="#555">固定压板</text>

  <!-- 工作气隙标注 -->
  <line x1="170" y1="176" x2="230" y2="176" stroke="#d32f2f" stroke-width="2.5" marker-start="url(#arrowL)" marker-end="url(#arrowR)"/>
  <line x1="170" y1="205" x2="230" y2="205" stroke="#d32f2f" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="200" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#d32f2f">工作气隙 δ</text>

  <defs>
    <marker id="arrowL" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M9 0 L0 4.5 L9 9 z" fill="#d32f2f"/></marker>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#d32f2f"/></marker>
  </defs>

  <!-- 运动方向 -->
  <text x="278" y="96" font-size="12" font-weight="bold" fill="#2e7d32">← 压力</text>
</svg>