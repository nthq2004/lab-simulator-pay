<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="820" height="540" fill="#ffffff"/>
  <text x="24" y="32" font-size="18" font-weight="bold" fill="#20303f">压力继电器（YT1226）结构原理示意图</text>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/></marker>
  </defs>

  <!-- 气压输入口 -->
  <rect x="40" y="420" width="170" height="64" rx="8" fill="#eef6fb" stroke="#2c3e50" stroke-width="2"/>
  <text x="125" y="448" font-size="14" text-anchor="middle" fill="#20303f">气压输入口 i</text>
  <text x="125" y="470" font-size="12" text-anchor="middle" fill="#60707f">被测压力（MPa）</text>

  <line x1="125" y1="420" x2="125" y2="354" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 波纹管 -->
  <rect x="40" y="288" width="170" height="64" rx="8" fill="#eaf5ff" stroke="#1565c0" stroke-width="2"/>
  <text x="125" y="316" font-size="14" text-anchor="middle" fill="#0d47a1">波纹管</text>
  <text x="125" y="338" font-size="12" text-anchor="middle" fill="#60707f">压力 → 位移</text>

  <line x1="210" y1="320" x2="300" y2="320" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 杠杆 -->
  <rect x="300" y="286" width="180" height="70" rx="8" fill="#f3f6f9" stroke="#2c3e50" stroke-width="2"/>
  <text x="390" y="316" font-size="14" text-anchor="middle" fill="#20303f">传动杠杆（支点）</text>
  <text x="390" y="338" font-size="12" text-anchor="middle" fill="#60707f">比较气压力矩与弹簧力矩</text>
  <path d="M390 372 l -14 18 h 28 z" fill="#2c3e50"/>

  <!-- 给定值调节 -->
  <rect x="300" y="116" width="180" height="70" rx="8" fill="#fdf3e7" stroke="#b87333" stroke-width="2"/>
  <text x="390" y="146" font-size="14" text-anchor="middle" fill="#8b5a2b">给定值调节螺钉</text>
  <text x="390" y="168" font-size="12" text-anchor="middle" fill="#60707f">给定弹簧 → 整定动作下限</text>
  <line x1="390" y1="186" x2="390" y2="284" stroke="#b87333" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 幅差调节 -->
  <rect x="300" y="420" width="180" height="70" rx="8" fill="#eafaf0" stroke="#1f9d55" stroke-width="2"/>
  <text x="390" y="450" font-size="14" text-anchor="middle" fill="#1f7a44">幅差调节螺钉</text>
  <text x="390" y="472" font-size="12" text-anchor="middle" fill="#60707f">幅差弹簧 → 整定上、下限之差</text>
  <line x1="390" y1="420" x2="390" y2="374" stroke="#1f9d55" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 触点系统 -->
  <line x1="480" y1="320" x2="566" y2="320" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="570" y="238" width="212" height="166" rx="8" fill="#fff7f7" stroke="#c0392b" stroke-width="2"/>
  <text x="676" y="264" font-size="14" text-anchor="middle" fill="#c0392b">触点系统（单刀双掷）</text>
  <text x="600" y="300" font-size="13" fill="#1f7a44" font-weight="bold">NC</text>
  <text x="600" y="332" font-size="13" fill="#b0b6ba" font-weight="bold">NO</text>
  <text x="600" y="364" font-size="13" fill="#20303f" font-weight="bold">COM</text>
  <line x1="636" y1="295" x2="748" y2="295" stroke="#1f9d55" stroke-width="3"/>
  <line x1="636" y1="327" x2="748" y2="327" stroke="#b0b6ba" stroke-width="2.5"/>
  <line x1="636" y1="359" x2="748" y2="359" stroke="#2c3e50" stroke-width="2.5"/>
  <text x="676" y="390" font-size="12" text-anchor="middle" fill="#60707f">低压励磁：NC–COM 闭合（起动）</text>

  <text x="24" y="520" font-size="12" fill="#8a97a3">注：接线端自上而下为 NC、NO、COM。低压时继电器励磁、NC–COM 闭合；高压时释放、NO–COM 闭合。</text>
</svg>
