<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="aR3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e74c3c"/>
    </marker>
    <marker id="aK3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2d3436">项目三：交流感应法测量同名端（三次测量）</text>

  <!-- ── 交流电源 ── -->
  <rect x="30" y="130" width="150" height="120" rx="10" fill="#eaf2f8" stroke="#2980b9" stroke-width="2"/>
  <text x="105" y="172" text-anchor="middle" font-size="18" font-weight="bold" fill="#2471a3">交流电源</text>
  <text x="105" y="198" text-anchor="middle" font-size="14" fill="#2d3436">AC 12V / 50Hz</text>
  <text x="105" y="220" text-anchor="middle" font-size="13" fill="#555">L→U1、N→U2（接通）</text>
  <line x1="62" y1="250" x2="62" y2="282" stroke="#e74c3c" stroke-width="3"/>
  <text x="50" y="298" font-size="15" font-weight="bold" fill="#e74c3c">L</text>
  <line x1="148" y1="250" x2="148" y2="282" stroke="#333" stroke-width="3"/>
  <text x="140" y="298" font-size="15" font-weight="bold" fill="#333">N</text>
  <path d="M180,170 Q192,156 204,170 Q216,184 228,170 Q240,156 252,170" stroke="#2471a3" stroke-width="2.5" fill="none"/>

  <!-- 三相绕组（U 通电，V/W 感应） -->
  <circle cx="300" cy="100" r="12" fill="#e74c3c" stroke="#c0392b"/>
  <circle cx="300" cy="300" r="12" fill="#e74c3c" stroke="#c0392b"/>
  <circle cx="480" cy="100" r="12" fill="#e74c3c" stroke="#c0392b"/>
  <circle cx="480" cy="300" r="12" fill="#e74c3c" stroke="#c0392b"/>
  <circle cx="660" cy="100" r="12" fill="#e74c3c" stroke="#c0392b"/>
  <circle cx="660" cy="300" r="12" fill="#e74c3c" stroke="#c0392b"/>
  <g font-size="15" fill="#2d3436" text-anchor="middle">
    <text x="300" y="84">U1</text><text x="300" y="330">U2</text>
    <text x="480" y="84">V1</text><text x="480" y="330">V2</text>
    <text x="660" y="84">W1</text><text x="660" y="330">W2</text>
  </g>
  <g stroke="#2d3436" stroke-width="2.5" fill="none">
    <path d="M300,112 L292,130 L308,148 L292,166 L308,184 L292,202 L308,220 L292,238 L308,256 L292,274 L308,288 L300,288"/>
    <path d="M480,112 L472,130 L488,148 L472,166 L488,184 L472,202 L488,220 L472,238 L488,256 L472,274 L488,288 L480,288"/>
    <path d="M660,112 L652,130 L668,148 L652,166 L668,184 L652,202 L668,220 L652,238 L668,256 L652,274 L668,288 L660,288"/>
  </g>

  <!-- 电源线 -->
  <line x1="62" y1="295" x2="300" y2="295" stroke="#e74c3c" stroke-width="3"/>
  <line x1="148" y1="295" x2="300" y2="295" stroke="#333" stroke-width="3"/>

  <!-- V1-W1 短接（反向串联） -->
  <line x1="480" y1="100" x2="660" y2="100" stroke="#8e44ad" stroke-width="5"/>
  <rect x="498" y="78" width="150" height="20" rx="4" fill="#f5eef8"/>
  <text x="573" y="92" text-anchor="middle" font-size="13" fill="#8e44ad" font-weight="bold">短接 V1-W1（反向串联）</text>

  <!-- 万用表与三次测量 -->
  <rect x="400" y="360" width="190" height="66" rx="8" fill="#dff0f8" stroke="#2980b9" stroke-width="2"/>
  <text x="495" y="388" text-anchor="middle" font-size="15" font-weight="bold" fill="#2980b9">数字万用表</text>
  <text x="495" y="410" text-anchor="middle" font-size="13" fill="#2d3436">档位 ACV200</text>

  <!-- 第1次：V 相 V1-V2（红实线/黑实线） -->
  <line x1="418" y1="360" x2="480" y2="112" stroke="#e74c3c" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aR3)"/>
  <line x1="566" y1="366" x2="480" y2="288" stroke="#333" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aK3)"/>
  <text x="330" y="368" font-size="13" fill="#c0392b" font-weight="bold">第 1 次：V 相（V1-V2）≈5.6V</text>

  <!-- 第2次：W 相 W1-W2（绿虚线） -->
  <line x1="420" y1="372" x2="660" y2="112" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#aR3)"/>
  <line x1="584" y1="368" x2="660" y2="288" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#aK3)"/>
  <text x="344" y="392" font-size="13" fill="#1e8449" font-weight="bold">第 2 次：W 相（W1-W2）≈5.6V</text>

  <!-- 第3次：开口 V2-W2（橙色点线） -->
  <line x1="440" y1="414" x2="480" y2="300" stroke="#f39c12" stroke-width="2.5" stroke-dasharray="2 3" marker-end="url(#aR3)"/>
  <line x1="556" y1="418" x2="660" y2="300" stroke="#f39c12" stroke-width="2.5" stroke-dasharray="2 3" marker-end="url(#aK3)"/>
  <text x="344" y="416" font-size="13" fill="#d68910" font-weight="bold">第 3 次：开口（V2-W2）≈0V</text>

  <text x="410" y="452" text-anchor="middle" font-size="14" fill="#1e8449" font-weight="bold">结论：V、W 两相感应电压相位相反、相互抵消 → 开口电压 ≈ 0V</text>
</svg>