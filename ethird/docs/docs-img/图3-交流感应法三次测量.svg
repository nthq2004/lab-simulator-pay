<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="aR3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e74c3c"/>
    </marker>
    <marker id="aK3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2d3436">项目三：交流感应法测量同名端（V1-W1 短接，三次测量）</text>

  <!-- ═══ 交流电源 ═══ -->
  <rect x="50" y="180" width="150" height="100" rx="10" fill="#eaf2f8" stroke="#2980b9" stroke-width="2"/>
  <text x="125" y="212" text-anchor="middle" font-size="16" font-weight="bold" fill="#2471a3">交流电源</text>
  <text x="125" y="236" text-anchor="middle" font-size="13" fill="#2d3436">AC 12V / 50Hz</text>
  <text x="125" y="262" text-anchor="middle" font-size="11" fill="#555">L→U1、N→U2</text>

  <!-- L 线 → U1 -->
  <path d="M85,180 L85,110 L330,110 L330,126" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#aR3)"/>
  <text x="72" y="164" text-anchor="end" font-size="14" font-weight="bold" fill="#e74c3c">L</text>
  <!-- N 线 → U2 -->
  <path d="M165,280 L165,340 L317,340" stroke="#333" stroke-width="3" fill="none" marker-end="url(#aK3)"/>
  <text x="152" y="330" text-anchor="end" font-size="14" font-weight="bold" fill="#333">N</text>

  <!-- ═══ 三相绕组 ═══ -->
  <g fill="#e74c3c" stroke="#c0392b" stroke-width="1.5">
    <circle cx="330" cy="140" r="10"/><circle cx="330" cy="340" r="10"/>
    <circle cx="500" cy="140" r="10"/><circle cx="500" cy="340" r="10"/>
    <circle cx="670" cy="140" r="10"/><circle cx="670" cy="340" r="10"/>
  </g>
  <g font-size="13.5" fill="#2d3436" text-anchor="middle">
    <text x="330" y="120">U1</text><text x="330" y="366">U2</text>
    <text x="500" y="120">V1</text><text x="500" y="366">V2</text>
    <text x="670" y="120">W1</text><text x="670" y="366">W2</text>
  </g>
  <g stroke="#2d3436" stroke-width="2.5" fill="none">
    <path d="M330,150 L324,166 L336,180 L324,194 L336,208 L324,222 L336,236 L324,250 L336,264 L324,278 L336,292 L324,306 L336,318 L330,330"/>
    <path d="M500,150 L494,166 L506,180 L494,194 L506,208 L494,222 L506,236 L494,250 L506,264 L494,278 L506,292 L494,306 L506,318 L500,330"/>
    <path d="M670,150 L664,166 L676,180 L664,194 L676,208 L664,222 L676,236 L664,250 L676,264 L664,278 L676,292 L664,306 L676,318 L670,330"/>
  </g>
  <text x="362" y="246" font-size="12" fill="#2d3436">U 相（通电）</text>
  <text x="532" y="246" font-size="12" fill="#2d3436">V 相</text>
  <text x="702" y="246" font-size="12" fill="#2d3436">W 相</text>

  <!-- V1-W1 短接 -->
  <line x1="510" y1="140" x2="660" y2="140" stroke="#8e44ad" stroke-width="5"/>
  <rect x="520" y="86" width="140" height="22" rx="4" fill="#f5eef8" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="590" y="101" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8e44ad">短接 V1-W1</text>
  <text x="590" y="122" text-anchor="middle" font-size="10.5" fill="#8e44ad">（反向串联）</text>

  <!-- ═══ 万用表与第 1 次测量 ═══ -->
  <rect x="420" y="440" width="190" height="84" rx="8" fill="#dff0f8" stroke="#2980b9" stroke-width="2"/>
  <text x="515" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="#2980b9">数字万用表</text>
  <text x="515" y="488" text-anchor="middle" font-size="12" fill="#2d3436">档位 ACV200</text>
  <text x="515" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">读数 ≈ 5.6 V</text>
  <!-- 红表笔 → V1 -->
  <path d="M470,436 L470,140 L487,140" stroke="#e74c3c" stroke-width="2.5" fill="none" marker-end="url(#aR3)"/>
  <text x="462" y="430" text-anchor="end" font-size="11.5" font-weight="bold" fill="#c0392b">第 1 次测量</text>
  <text x="462" y="446" text-anchor="end" font-size="10.5" fill="#555">红→V1、黑→V2</text>
  <!-- 黑表笔 → V2 -->
  <path d="M560,436 L560,340 L513,340" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#aK3)"/>

  <!-- ═══ 右侧：三次测量读数卡 ═══ -->
  <text x="815" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d3436">三次测量读数</text>
  <rect x="700" y="100" width="230" height="84" rx="8" fill="#fdf2f2" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="716" y="124" font-size="13" font-weight="bold" fill="#e74c3c">①</text>
  <text x="815" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d3436">第 1 次：V 相</text>
  <text x="815" y="148" text-anchor="middle" font-size="10.5" fill="#888">红→V1、黑→V2</text>
  <text x="815" y="172" text-anchor="middle" font-size="16" font-weight="bold" fill="#e74c3c">≈ 5.6 V</text>

  <rect x="700" y="196" width="230" height="84" rx="8" fill="#f0faf4" stroke="#27ae60" stroke-width="1.5"/>
  <text x="716" y="220" font-size="13" font-weight="bold" fill="#27ae60">②</text>
  <text x="815" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d3436">第 2 次：W 相</text>
  <text x="815" y="244" text-anchor="middle" font-size="10.5" fill="#888">红→W1、黑→W2</text>
  <text x="815" y="268" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60">≈ 5.6 V</text>

  <rect x="700" y="292" width="230" height="84" rx="8" fill="#fef9ef" stroke="#f39c12" stroke-width="1.5"/>
  <text x="716" y="316" font-size="13" font-weight="bold" fill="#f39c12">③</text>
  <text x="815" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d3436">第 3 次：开口电压</text>
  <text x="815" y="340" text-anchor="middle" font-size="10.5" fill="#888">红→V2、黑→W2</text>
  <text x="815" y="364" text-anchor="middle" font-size="16" font-weight="bold" fill="#f39c12">≈ 0 V</text>

  <rect x="700" y="400" width="230" height="110" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
  <text x="815" y="424" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e8449">结论</text>
  <text x="815" y="448" text-anchor="middle" font-size="11.5" fill="#2d3436">V、W 两相感应电压</text>
  <text x="815" y="468" text-anchor="middle" font-size="11.5" fill="#2d3436">相位相反、相互抵消</text>
  <text x="815" y="492" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e8449">→ 开口电压 V2-W2 ≈ 0V</text>
</svg>
