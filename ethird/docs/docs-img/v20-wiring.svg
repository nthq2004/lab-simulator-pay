<svg width="1060" height="720" viewBox="0 0 1060 720" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="1060" height="720" fill="#fcfcfc" stroke="#ccc" stroke-width="1" rx="8"/>
  <text x="530" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">图2  典型控制电路接线总图</text>

  <!-- 三相电源 -->
  <rect x="40" y="150" width="150" height="150" fill="#e3e9ef" stroke="#1a252f" stroke-width="2" rx="6"/>
  <text x="115" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a252f">三相电源</text>
  <text x="115" y="198" text-anchor="middle" font-size="12" fill="#444">3AC 380V</text>
  <g font-size="11" fill="#333">
    <circle cx="70" cy="250" r="5" fill="#e03030"/><text x="82" y="254">U</text>
    <circle cx="120" cy="250" r="5" fill="#20a030"/><text x="132" y="254">V</text>
    <circle cx="170" cy="250" r="5" fill="#2050e0"/><text x="182" y="254">W</text>
  </g>

  <!-- V20 -->
  <rect x="380" y="80" width="300" height="500" fill="#4a525a" stroke="#2b3238" stroke-width="2" rx="10"/>
  <rect x="398" y="94" width="110" height="20" fill="#009999" rx="3"/>
  <text x="453" y="109" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">SIEMENS</text>
  <text x="540" y="109" font-size="13" font-weight="bold" fill="#e8ecef">SINAMICS V20</text>
  <!-- 顶部进线端子 -->
  <g font-size="11" fill="#eef3f7" text-anchor="middle">
    <rect x="404" y="122" width="42" height="20" fill="#9aa1a8" rx="3"/><text x="425" y="137">L1</text>
    <rect x="458" y="122" width="42" height="20" fill="#9aa1a8" rx="3"/><text x="479" y="137">L2</text>
    <rect x="512" y="122" width="42" height="20" fill="#9aa1a8" rx="3"/><text x="533" y="137">L3</text>
  </g>
  <!-- 面板 -->
  <rect x="404" y="170" width="252" height="150" fill="#23282d" rx="6"/>
  <rect x="420" y="186" width="150" height="60" fill="#0f2e14" stroke="#0a1a0a" rx="3"/>
  <text x="495" y="224" text-anchor="middle" font-size="24" font-weight="bold" font-family="monospace" fill="#8ef08e">40.00</text>
  <text x="560" y="252" font-size="11" fill="#8ef08e">Hz</text>
  <g font-size="14" text-anchor="middle">
    <rect x="430" y="256" width="46" height="40" fill="#1f9d55" rx="4"/><text x="453" y="282" fill="#fff">I</text>
    <rect x="486" y="256" width="46" height="40" fill="#d84438" rx="4"/><text x="509" y="282" fill="#fff">O</text>
    <rect x="542" y="256" width="46" height="40" fill="#c3c8ce" rx="4"/><text x="565" y="282" fill="#333">M</text>
    <rect x="598" y="256" width="46" height="40" fill="#c3c8ce" rx="4"/><text x="621" y="282" fill="#333">OK</text>
  </g>
  <!-- 控制端子 -->
  <rect x="404" y="340" width="252" height="150" fill="#1b2024" rx="6"/>
  <g font-size="10" fill="#dbe2e8" text-anchor="middle">
    <rect x="416" y="356" width="38" height="18" fill="#8a929a" rx="2"/><text x="435" y="370">10V</text>
    <rect x="462" y="356" width="38" height="18" fill="#8a929a" rx="2"/><text x="481" y="370">AI1</text>
    <rect x="508" y="356" width="38" height="18" fill="#8a929a" rx="2"/><text x="527" y="370">0V</text>
    <rect x="560" y="356" width="38" height="18" fill="#8a929a" rx="2"/><text x="579" y="370">DI1</text>
    <rect x="606" y="356" width="38" height="18" fill="#8a929a" rx="2"/><text x="625" y="370">DI2</text>
    <rect x="560" y="396" width="38" height="18" fill="#8a929a" rx="2"/><text x="579" y="410">DIC</text>
  </g>
  <!-- 底部输出端子 -->
  <g font-size="11" fill="#eef3f7" text-anchor="middle">
    <rect x="410" y="522" width="42" height="20" fill="#9aa1a8" rx="3"/><text x="431" y="537" fill="#ff6060">U</text>
    <rect x="470" y="522" width="42" height="20" fill="#9aa1a8" rx="3"/><text x="491" y="537" fill="#7cff9c">V</text>
    <rect x="530" y="522" width="42" height="20" fill="#9aa1a8" rx="3"/><text x="551" y="537" fill="#9cc0ff">W</text>
    <rect x="590" y="522" width="42" height="20" fill="#9aa1a8" rx="3"/><text x="611" y="537" fill="#d0e070">PE</text>
  </g>

  <!-- 主回路连线 -->
  <line x1="70" y1="250" x2="425" y2="132" stroke="#e03030" stroke-width="3"/>
  <line x1="120" y1="250" x2="479" y2="132" stroke="#20a030" stroke-width="3"/>
  <line x1="170" y1="250" x2="533" y2="132" stroke="#2050e0" stroke-width="3"/>

  <!-- 电动机 -->
  <rect x="800" y="220" width="200" height="170" fill="#35527f" stroke="#22384f" stroke-width="2" rx="10"/>
  <circle cx="900" cy="305" r="52" fill="#5b82b7" stroke="#2c4470" stroke-width="2"/>
  <text x="900" y="311" text-anchor="middle" font-size="13" font-weight="bold" fill="#eef3f7">M1</text>
  <text x="900" y="380" text-anchor="middle" font-size="12" fill="#1c2c4c" font-weight="bold">三相异步电动机</text>
  <g font-size="11" fill="#eef3f7" text-anchor="middle">
    <circle cx="836" cy="236" r="5" fill="#e03030"/>
    <circle cx="872" cy="236" r="5" fill="#20a030"/>
    <circle cx="908" cy="236" r="5" fill="#2050e0"/>
    <text x="836" y="224">U</text><text x="872" y="224">V</text><text x="908" y="224">W</text>
  </g>
  <line x1="431" y1="532" x2="836" y2="240" stroke="#e03030" stroke-width="3"/>
  <line x1="491" y1="532" x2="872" y2="240" stroke="#20a030" stroke-width="3"/>
  <line x1="551" y1="532" x2="908" y2="240" stroke="#2050e0" stroke-width="3"/>
  <!-- PE -->
  <line x1="611" y1="532" x2="760" y2="560" stroke="#7a8a2a" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="690" y="580" font-size="11" fill="#5a6a1a">PE 保护接地</text>

  <!-- 外部24V电位端子 -->
  <rect x="120" y="380" width="120" height="46" fill="#f0e2c0" stroke="#c9a227" rx="6"/>
  <circle cx="150" cy="403" r="9" fill="#e8b339" stroke="#8f7318" stroke-width="2"/>
  <text x="196" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#b26a00">+24V</text>
  <text x="180" y="446" text-anchor="middle" font-size="10" fill="#555">外部控制电源</text>

  <!-- 开关 SA1 / SA2 -->
  <g>
    <line x1="240" y1="403" x2="290" y2="403" stroke="#e67e22" stroke-width="3"/>
    <rect x="290" y="386" width="86" height="34" fill="#fff" stroke="#888" rx="6"/>
    <text x="333" y="408" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">SA1 启停</text>
    <line x1="376" y1="403" x2="579" y2="403" stroke="#e67e22" stroke-width="3"/>
    <text x="470" y="394" text-anchor="middle" font-size="10" fill="#a05500">→ DI1</text>

    <line x1="120" y1="500" x2="120" y2="620" stroke="#e67e22" stroke-width="3"/>
    <line x1="120" y1="620" x2="290" y2="620" stroke="#e67e22" stroke-width="3"/>
    <rect x="290" y="603" width="86" height="34" fill="#fff" stroke="#888" rx="6"/>
    <text x="333" y="625" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">SA2 正反转</text>
    <line x1="376" y1="620" x2="625" y2="620" stroke="#e67e22" stroke-width="3"/>
    <line x1="625" y1="620" x2="625" y2="410" stroke="#e67e22" stroke-width="3"/>
    <text x="470" y="612" text-anchor="middle" font-size="10" fill="#a05500">→ DI2</text>
  </g>

  <!-- DIC → 0V -->
  <line x1="579" y1="410" x2="527" y2="410" stroke="#333" stroke-width="2.5"/>
  <text x="553" y="426" text-anchor="middle" font-size="10" fill="#333">DIC→0V</text>

  <!-- 电位器 -->
  <g>
    <rect x="120" y="150" width="0" height="0"/>
    <rect x="180" y="270" width="150" height="34" fill="#e8e8e8" stroke="#555" rx="4"/>
    <text x="255" y="292" text-anchor="middle" font-size="12" fill="#333">电位器 RP</text>
    <line x1="435" y1="366" x2="255" y2="304" stroke="#8e44ad" stroke-width="2.5"/>
    <text x="330" y="352" font-size="10" fill="#6c3483">+10V→左</text>
    <line x1="527" y1="366" x2="330" y2="270" stroke="#8e44ad" stroke-width="2.5"/>
    <text x="440" y="300" font-size="10" fill="#6c3483">0V→右</text>
    <line x1="481" y1="366" x2="255" y2="304" stroke="#16a085" stroke-width="2.5"/>
    <text x="360" y="330" font-size="10" fill="#0e6655">滑臂→AI1</text>
  </g>

  <!-- 图注 -->
  <text x="60" y="690" font-size="12" fill="#555">说明：三相电源 U/V/W → L1/L2/L3；V20 的 U/V/W → 电动机；PE 互联。SA1 启停接 DI1，SA2 换向接 DI2（24V 经开关到 DI 端），DIC 接 0V；电位器左端 +10V、右端 0V、滑臂接 AI1。</text>
</svg>
