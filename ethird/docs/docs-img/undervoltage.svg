<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>

  <defs>
    <marker id="uArr" markerWidth="9" markerHeight="9" refX="3" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L6,4.5 L0,9 z" fill="#5f6368"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#37474f">欠压保护模拟：降低线电压触发延时脱扣</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="320" x2="840" y2="320" stroke="#90a4ae" stroke-width="1.5"/>
  <line x1="80" y1="70" x2="80" y2="320" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="848" y="324" font-size="11" fill="#90a4ae">t</text>
  <text x="60" y="80" text-anchor="end" font-size="11" fill="#90a4ae">U</text>

  <!-- 欠压整定阈值 300V -->
  <line x1="90" y1="170" x2="830" y2="170" stroke="#e65100" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="836" y="164" text-anchor="end" font-size="10.5" fill="#e65100">整定阈值 300 V（75%Un）</text>

  <!-- 400V 运行平台 -->
  <path d="M110 110 L300 110" fill="none" stroke="#188038" stroke-width="3.5"/>
  <text x="205" y="100" text-anchor="middle" font-size="11.5" fill="#188038">U = 400 V 正常运行</text>

  <!-- 降至 280V -->
  <path d="M300 110 L300 182" fill="none" stroke="#c5221f" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M300 182 L580 182" fill="none" stroke="#c5221f" stroke-width="3.5"/>
  <text x="430" y="204" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#c5221f">U = 280 V（低于整定阈值）</text>

  <!-- 脱扣点 -->
  <circle cx="580" cy="182" r="5" fill="#c5221f"/>
  <path d="M580 182 L640 182" fill="none" stroke="#c5221f" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="648" y="186" font-size="11.5" fill="#c5221f">电子脱扣器动作</text>
  <text x="648" y="204" font-size="11.5" fill="#c5221f">→ 主开关 qf1 跳闸</text>

  <!-- 延时动作标注 -->
  <line x1="300" y1="250" x2="580" y2="250" stroke="#5f6368" stroke-width="1.5"
        marker-start="url(#uArr)" marker-end="url(#uArr)"/>
  <line x1="300" y1="246" x2="300" y2="258" stroke="#5f6368" stroke-width="1"/>
  <line x1="580" y1="246" x2="580" y2="258" stroke="#5f6368" stroke-width="1"/>
  <text x="440" y="272" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5f6368">动作延时 t = 3 s</text>

  <!-- 测试仪测量说明 -->
  <text x="110" y="306" font-size="11" fill="#5f6368">调"线电压"旋钮即自动启动欠压保护时间测量：主开关闭合期间计时，跳闸断开瞬间停表并显示跳闸时间。</text>
</svg>
