<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="780" height="430" fill="#fbfcfe"/>
  <text x="390" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2d3d">图6 蓄电池组端电压、电解液比重随 SOC 的变化</text>

  <!-- 网格 -->
  <g stroke="#e3e8ee" stroke-width="1">
    <line x1="90" y1="271" x2="660" y2="271"/>
    <line x1="90" y1="212" x2="660" y2="212"/>
    <line x1="90" y1="153" x2="660" y2="153"/>
    <line x1="90" y1="94"  x2="660" y2="94"/>
    <line x1="232" y1="70" x2="232" y2="330"/>
    <line x1="375" y1="70" x2="375" y2="330"/>
    <line x1="518" y1="70" x2="518" y2="330"/>
  </g>

  <!-- 坐标轴 -->
  <line x1="90" y1="330" x2="670" y2="330" stroke="#5b6b7c" stroke-width="2"/>
  <line x1="90" y1="70" x2="90" y2="330" stroke="#5b6b7c" stroke-width="2"/>
  <line x1="660" y1="70" x2="660" y2="330" stroke="#5b6b7c" stroke-width="2"/>

  <!-- 左轴：电压 -->
  <g font-size="12" fill="#c0392b" text-anchor="end">
    <text x="84" y="334">21.0</text>
    <text x="84" y="275">22.0</text>
    <text x="84" y="216">23.0</text>
    <text x="84" y="157">24.0</text>
    <text x="84" y="98">25.0</text>
  </g>
  <text x="30" y="200" font-size="13" fill="#c0392b" transform="rotate(-90 30 200)">组端电压 U / V</text>

  <!-- 右轴：比重 -->
  <g font-size="12" fill="#2e7d32" text-anchor="start">
    <text x="666" y="334">1.15</text>
    <text x="666" y="276">1.19</text>
    <text x="666" y="218">1.23</text>
    <text x="666" y="160">1.27</text>
    <text x="666" y="102">1.30</text>
  </g>
  <text x="748" y="200" font-size="13" fill="#2e7d32" transform="rotate(90 748 200)">电解液比重 SG</text>

  <!-- x 轴刻度 -->
  <g font-size="12" fill="#555566" text-anchor="middle">
    <text x="90" y="350">0</text>
    <text x="232" y="350">0.25</text>
    <text x="375" y="350">0.50</text>
    <text x="518" y="350">0.75</text>
    <text x="660" y="350">1.0</text>
  </g>
  <text x="375" y="372" text-anchor="middle" font-size="13" fill="#555566">荷电状态 SOC</text>

  <!-- 电压曲线 -->
  <polyline points="90,330 147,280 232,224 375,181 518,139 603,103 660,82"
            fill="none" stroke="#c0392b" stroke-width="3"/>
  <!-- 比重曲线 -->
  <polyline points="90,330 147,304 232,265 375,200 518,135 603,96 660,70"
            fill="none" stroke="#2e7d32" stroke-width="3" stroke-dasharray="8 4"/>

  <!-- 亏电点 -->
  <circle cx="94" cy="319" r="5" fill="#c0392b"/>
  <circle cx="94" cy="325" r="5" fill="#2e7d32"/>
  <rect x="98" y="272" width="182" height="40" rx="4" fill="#ffffff" opacity="0.85"/>
  <text x="104" y="288" font-size="12" fill="#333">亏电 SOC≈0.02</text>
  <text x="104" y="304" font-size="12" fill="#666">U≈21.2V，SG≈1.15</text>

  <!-- 满电点 -->
  <circle cx="656" cy="85" r="5" fill="#c0392b"/>
  <circle cx="656" cy="73" r="5" fill="#2e7d32"/>
  <rect x="516" y="100" width="150" height="40" rx="4" fill="#ffffff" opacity="0.85"/>
  <text x="522" y="116" font-size="12" fill="#333">满电 SOC≈0.99</text>
  <text x="522" y="132" font-size="12" fill="#666">U≈25.2V，SG≈1.30</text>

  <!-- 图例 -->
  <line x1="120" y1="400" x2="160" y2="400" stroke="#c0392b" stroke-width="3"/>
  <text x="166" y="404" font-size="12" fill="#555566">组端电压 U</text>
  <line x1="270" y1="400" x2="310" y2="400" stroke="#2e7d32" stroke-width="3" stroke-dasharray="8 4"/>
  <text x="316" y="404" font-size="12" fill="#555566">电解液比重 SG</text>
  <text x="470" y="404" font-size="12" fill="#888">判定：SG≤1.19 亏电；SG≥1.28 满电</text>
</svg>
