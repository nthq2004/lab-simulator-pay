<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="820" height="520" fill="#ffffff"/>
  <text x="24" y="32" font-size="18" font-weight="bold" fill="#20303f">压力继电器控制压缩机启停——组成与接线示意</text>
  <defs>
    <marker id="gasA" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="ctlA" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>

  <!-- 空气瓶 -->
  <rect x="60" y="90" width="130" height="110" rx="10" fill="#eaf5ff" stroke="#1565c0" stroke-width="2"/>
  <text x="125" y="138" font-size="14" text-anchor="middle" fill="#0d47a1">空气瓶</text>
  <text x="125" y="162" font-size="12" text-anchor="middle" fill="#60707f">储气 / 0.35 MPa</text>

  <!-- 三通接头 -->
  <circle cx="300" cy="135" r="26" fill="#f3f6f9" stroke="#2c3e50" stroke-width="2"/>
  <text x="300" y="140" font-size="12" text-anchor="middle" fill="#20303f">三通</text>

  <!-- 压力表 -->
  <rect x="470" y="70" width="130" height="100" rx="10" fill="#eafaf0" stroke="#1f9d55" stroke-width="2"/>
  <text x="535" y="112" font-size="14" text-anchor="middle" fill="#1f7a44">压力表</text>
  <text x="535" y="136" font-size="12" text-anchor="middle" fill="#60707f">显示瓶压</text>

  <!-- 压力开关 -->
  <rect x="280" y="320" width="200" height="120" rx="10" fill="#fff7f7" stroke="#c0392b" stroke-width="2"/>
  <text x="380" y="350" font-size="14" text-anchor="middle" fill="#c0392b">压力开关</text>
  <text x="300" y="380" font-size="12" fill="#1f7a44" font-weight="bold">NC</text>
  <text x="300" y="404" font-size="12" fill="#b0b6ba" font-weight="bold">NO</text>
  <text x="300" y="428" font-size="12" fill="#20303f" font-weight="bold">COM</text>

  <!-- 空气压缩机 -->
  <rect x="580" y="320" width="200" height="120" rx="10" fill="#f7f8fa" stroke="#2c3e50" stroke-width="2"/>
  <text x="680" y="352" font-size="14" text-anchor="middle" fill="#20303f">空气压缩机</text>
  <text x="680" y="376" font-size="12" text-anchor="middle" fill="#60707f">LOCAL / REMOTE</text>
  <text x="600" y="404" font-size="12" fill="#c0392b" font-weight="bold">L</text>
  <text x="748" y="404" font-size="12" fill="#c0392b" font-weight="bold">R</text>

  <!-- 气路（蓝） -->
  <line x1="190" y1="145" x2="274" y2="140" stroke="#1565c0" stroke-width="3" marker-end="url(#gasA)"/>
  <line x1="326" y1="130" x2="470" y2="118" stroke="#1565c0" stroke-width="3" marker-end="url(#gasA)"/>
  <polyline points="300,161 300,320" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#gasA)"/>
  <polyline points="680,320 680,250 125,250 125,200" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#gasA)"/>
  <text x="150" y="242" font-size="12" fill="#1565c0">压缩机排气 → 空气瓶</text>

  <!-- 控制电路（红虚线） -->
  <polyline points="480,378 560,378 560,398 580,398" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#ctlA)"/>
  <line x1="480" y1="424" x2="580" y2="424" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#ctlA)"/>

  <!-- 图例 -->
  <line x1="60" y1="486" x2="104" y2="486" stroke="#1565c0" stroke-width="3"/>
  <text x="112" y="490" font-size="12" fill="#20303f">压缩空气管路</text>
  <line x1="240" y1="486" x2="284" y2="486" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="292" y="490" font-size="12" fill="#20303f">控制电路</text>
  <text x="430" y="490" font-size="12" fill="#8a97a3">低压 NC 闭合 → 压缩机起动；高压 NC 断开 → 停机</text>
</svg>
