<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2d3436"/>
    </marker>
  </defs>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2d3436">船舶低压电力系统与绝缘监测装置组成</text>

  <!-- ── 三相汇流排 ── -->
  <line x1="120" y1="140" x2="880" y2="140" stroke="#2471a3" stroke-width="8" stroke-linecap="round"/>
  <text x="500" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a5276">三相汇流排　AC 400V / 50Hz（中性点不接地 IT 系统）</text>

  <!-- ── 同步发电机 + 主开关 ── -->
  <circle cx="120" cy="320" r="44" fill="#eafaf1" stroke="#1e8449" stroke-width="2.5"/>
  <text x="120" y="328" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e8449">G</text>
  <text x="120" y="264" text-anchor="middle" font-size="12" fill="#2d3436">同步发电机</text>
  <text x="120" y="388" text-anchor="middle" font-size="11" fill="#555">400V · 50kW · 50Hz</text>
  <line x1="120" y1="276" x2="120" y2="252" stroke="#2d3436" stroke-width="2.5"/>
  <rect x="98" y="210" width="44" height="42" rx="4" fill="#fff" stroke="#2d3436" stroke-width="2"/>
  <line x1="108" y1="244" x2="132" y2="216" stroke="#c0392b" stroke-width="3"/>
  <text x="152" y="234" font-size="13" font-weight="bold" fill="#c0392b">QF</text>
  <text x="152" y="250" font-size="11" fill="#555">主开关</text>
  <line x1="120" y1="210" x2="120" y2="140" stroke="#2d3436" stroke-width="2.5"/>

  <!-- ── 低压配电箱 ── -->
  <rect x="180" y="175" width="470" height="300" rx="10" fill="none" stroke="#9aa7bd" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="415" y="198" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a6a84">低压配电箱（三路负载）</text>

  <!-- 支路1：三相感应电机 -->
  <line x1="260" y1="140" x2="260" y2="204" stroke="#2d3436" stroke-width="2.5"/>
  <rect x="238" y="204" width="44" height="36" rx="4" fill="#fff" stroke="#2d3436" stroke-width="2"/>
  <line x1="248" y1="234" x2="272" y2="210" stroke="#c0392b" stroke-width="2.5"/>
  <text x="300" y="222" font-size="12" font-weight="bold" fill="#2d3436">QF1</text>
  <line x1="260" y1="240" x2="260" y2="284" stroke="#2d3436" stroke-width="2.5"/>
  <circle cx="260" cy="320" r="36" fill="#eaf2f8" stroke="#2471a3" stroke-width="2.5"/>
  <text x="260" y="330" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a5276">M</text>
  <text x="260" y="380" text-anchor="middle" font-size="12" fill="#2d3436">三相感应电机</text>
  <text x="260" y="400" text-anchor="middle" font-size="11" fill="#777">动力负载</text>

  <!-- 支路2：照明灯具 -->
  <line x1="430" y1="140" x2="430" y2="204" stroke="#2d3436" stroke-width="2.5"/>
  <rect x="408" y="204" width="44" height="36" rx="4" fill="#fff" stroke="#2d3436" stroke-width="2"/>
  <line x1="418" y1="234" x2="442" y2="210" stroke="#c0392b" stroke-width="2.5"/>
  <text x="470" y="222" font-size="12" font-weight="bold" fill="#2d3436">QF2</text>
  <line x1="430" y1="240" x2="430" y2="272" stroke="#2d3436" stroke-width="2.5"/>
  <circle cx="404" cy="300" r="14" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <circle cx="430" cy="286" r="14" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <circle cx="456" cy="300" r="14" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="430" y="356" text-anchor="middle" font-size="12" fill="#2d3436">照明灯具</text>
  <text x="430" y="376" text-anchor="middle" font-size="11" fill="#777">照明负载</text>

  <!-- 支路3：三相可调负载 -->
  <line x1="600" y1="140" x2="600" y2="204" stroke="#2d3436" stroke-width="2.5"/>
  <rect x="578" y="204" width="44" height="36" rx="4" fill="#fff" stroke="#2d3436" stroke-width="2"/>
  <line x1="588" y1="234" x2="612" y2="210" stroke="#c0392b" stroke-width="2.5"/>
  <text x="640" y="222" font-size="12" font-weight="bold" fill="#2d3436">QF3</text>
  <line x1="600" y1="240" x2="600" y2="272" stroke="#2d3436" stroke-width="2.5"/>
  <rect x="550" y="272" width="100" height="60" rx="6" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="600" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#d35400">三相可调</text>
  <text x="600" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#d35400">负载</text>
  <text x="600" y="356" text-anchor="middle" font-size="11" fill="#777">突加/突卸试验用</text>

  <!-- ── 绝缘监测环节（并联于汇流排与船体地之间） ── -->
  <line x1="760" y1="140" x2="760" y2="230" stroke="#5f6368" stroke-width="2.5"/>
  <text x="770" y="190" font-size="11.5" fill="#5f6368">并联接入</text>

  <rect x="670" y="230" width="180" height="66" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="760" y="256" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a4d8f">绝缘监视仪</text>
  <text x="760" y="278" text-anchor="middle" font-size="11" fill="#555">连续、定量监测绝缘电阻</text>
  <line x1="760" y1="296" x2="760" y2="336" stroke="#5f6368" stroke-width="2.5"/>

  <rect x="670" y="336" width="180" height="66" rx="8" fill="#fef9e7" stroke="#d4ac0d" stroke-width="2"/>
  <text x="760" y="362" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7d6608">三灯绝缘指示灯</text>
  <text x="760" y="384" text-anchor="middle" font-size="11" fill="#555">（地气灯）判断故障相</text>
  <line x1="760" y1="402" x2="760" y2="540" stroke="#5f6368" stroke-width="2.5"/>

  <!-- ── 船体地（公共参考电位） ── -->
  <line x1="100" y1="540" x2="900" y2="540" stroke="#8a94a6" stroke-width="6" stroke-linecap="round"/>
  <line x1="730" y1="554" x2="790" y2="554" stroke="#8a94a6" stroke-width="3"/>
  <line x1="742" y1="566" x2="778" y2="566" stroke="#8a94a6" stroke-width="3"/>
  <line x1="752" y1="578" x2="768" y2="578" stroke="#8a94a6" stroke-width="3"/>
  <text x="500" y="576" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a6a84">船体地（公共参考电位）</text>

  <!-- ── 说明 ── -->
  <rect x="60" y="420" width="560" height="80" rx="10" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/>
  <text x="80" y="446" font-size="12.5" font-weight="bold" fill="#202124">系统特点</text>
  <text x="80" y="468" font-size="11.5" fill="#37474f">中性点不接地（IT 系统），负载不接地；绝缘故障初期电流很小、不易察觉，</text>
  <text x="80" y="488" font-size="11.5" fill="#37474f">故必须由地气灯（判相）与绝缘监视仪（定量报警）共同监测。</text>
</svg>
