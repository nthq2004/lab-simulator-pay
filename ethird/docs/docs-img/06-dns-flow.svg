<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="840" height="380" fill="#ffffff"/>
  <text x="420" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2a33">图 6　DNS：把域名翻译成 IP 地址</text>

  <rect x="60" y="70" width="170" height="64" rx="8" fill="#37474f"/>
  <text x="145" y="98" text-anchor="middle" font-size="14" fill="#fff">PC（客户端）</text>
  <text x="145" y="118" text-anchor="middle" font-size="11" fill="#b0bec5">DNS 已配 192.168.1.1</text>

  <rect x="560" y="70" width="210" height="64" rx="8" fill="#2c6ea8"/>
  <text x="665" y="98" text-anchor="middle" font-size="14" fill="#fff">DNS 服务器</text>
  <text x="665" y="118" text-anchor="middle" font-size="11" fill="#d6e9fb">维护“域名 ↔ IP”对照表</text>

  <line x1="230" y1="90" x2="560" y2="90" stroke="#2c6ea8" stroke-width="2.5"/>
  <polygon points="560,90 548,84 548,96" fill="#2c6ea8"/>
  <text x="395" y="82" text-anchor="middle" font-size="13" fill="#2c6ea8">① 询问：www.school.com 的 IP 是多少？</text>

  <line x1="560" y1="118" x2="230" y2="118" stroke="#2f8f43" stroke-width="2.5"/>
  <polygon points="230,118 242,112 242,124" fill="#2f8f43"/>
  <text x="395" y="140" text-anchor="middle" font-size="13" fill="#2f8f43">② 应答：它的 IP 是 192.168.2.2</text>

  <rect x="60" y="190" width="720" height="150" rx="10" fill="#f7f9fb" stroke="#cfd8dc"/>
  <text x="80" y="218" font-size="14" font-weight="bold" fill="#1f2a33">要点</text>
  <text x="80" y="246" font-size="13" fill="#333">• 人记域名（如 www.school.com）容易，机器寻址用 IP 地址，DNS 负责两者之间的转换。</text>
  <text x="80" y="274" font-size="13" fill="#333">• PC 上必须配置“DNS 服务器地址”，通常填网关地址或运营商/公共 DNS（如 114.114.114.114）。</text>
  <text x="80" y="302" font-size="13" fill="#333">• ping 一个域名时，PC 会先向 DNS 服务器查询，拿到 IP 后再发送 ICMP 报文。</text>
  <text x="80" y="330" font-size="13" fill="#333">• 本仿真中用 ping &lt;域名的 IP&gt; 即可验证；配置正确的 DNS 是访问互联网域名服务的前提。</text>
</svg>
