<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="820" height="480" fill="#ffffff"/>
  <text x="24" y="32" font-size="18" font-weight="bold" fill="#20303f">压力继电器双位（通断）控制特性</text>

  <!-- 坐标轴 -->
  <line x1="90" y1="60" x2="90" y2="410" stroke="#2c3e50" stroke-width="2"/>
  <line x1="90" y1="410" x2="770" y2="410" stroke="#2c3e50" stroke-width="2"/>
  <text x="46" y="60" font-size="14" fill="#20303f">p</text>
  <text x="40" y="80" font-size="12" fill="#60707f">MPa</text>
  <text x="742" y="436" font-size="13" fill="#20303f">t</text>

  <!-- 上限 / 下限 -->
  <line x1="100" y1="150" x2="760" y2="150" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="7 5"/>
  <line x1="100" y1="320" x2="760" y2="320" stroke="#1565c0" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="106" y="142" font-size="13" fill="#c0392b">动作上限 highSet（压缩机停）</text>
  <text x="106" y="340" font-size="13" fill="#1565c0">动作下限 lowSet（压缩机起）</text>

  <!-- 幅差标注 -->
  <line x1="742" y1="150" x2="742" y2="320" stroke="#1f9d55" stroke-width="2"/>
  <path d="M742 150 l -5 9 h10 z" fill="#1f9d55"/>
  <path d="M742 320 l -5 -9 h10 z" fill="#1f9d55"/>
  <text x="752" y="240" font-size="14" fill="#1f7a44" font-weight="bold">幅差</text>

  <!-- 压力变化曲线（锯齿波） -->
  <polyline points="120,320 250,150 400,320 550,150 700,320"
            fill="none" stroke="#0d47a1" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 阶段标注 -->
  <text x="150" y="250" font-size="12" fill="#60707f">升压</text>
  <text x="168" y="286" font-size="12" fill="#1f7a44">压缩机运行</text>
  <text x="300" y="250" font-size="12" fill="#60707f">降压</text>
  <text x="308" y="268" font-size="12" fill="#c0392b">压缩机停止</text>

  <text x="24" y="466" font-size="12" fill="#8a97a3">说明：瓶压低于动作下限时压力开关励磁、NC 闭合，压缩机起动充气；高于动作上限时释放、NC 断开，压缩机停机。上下限之差即幅差。</text>
</svg>
