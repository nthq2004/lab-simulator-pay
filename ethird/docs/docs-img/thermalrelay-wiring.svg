<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 490" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="660" height="490" fill="#ffffff"/>
  <text x="330" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a252f">图 3  热继电器过载保护实验接线示意</text>

  <!-- ===== 三相电源 ===== -->
  <rect x="24" y="140" width="122" height="130" rx="8" fill="#e3e9ef" stroke="#1a252f" stroke-width="2"/>
  <text x="85" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a252f">三相电源</text>
  <text x="85" y="188" text-anchor="middle" font-size="10.5" fill="#556">相电压可调</text>
  <text x="85" y="205" text-anchor="middle" font-size="10.5" fill="#556">50 Hz · 正序</text>
  <text x="60" y="248" font-size="10.5" fill="#556">U / V / W</text>
  <circle cx="146" cy="172" r="7" fill="#c0392b" stroke="#7a1a12" stroke-width="1.2"/>
  <circle cx="146" cy="204" r="7" fill="#20a030" stroke="#137a20" stroke-width="1.2"/>
  <circle cx="146" cy="236" r="7" fill="#2050e0" stroke="#103aa0" stroke-width="1.2"/>

  <!-- ===== 热继电器 ===== -->
  <rect x="256" y="92" width="176" height="234" rx="8" fill="#f2efe8" stroke="#c8b8a0" stroke-width="2"/>
  <text x="344" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a2a">热继电器 FR</text>
  <!-- 内部旋钮 -->
  <circle cx="316" cy="220" r="30" fill="#e8e2d6" stroke="#505870" stroke-width="2"/>
  <line x1="316" y1="220" x2="316" y2="198" stroke="#e03030" stroke-width="2.6" stroke-linecap="round"/>
  <text x="316" y="270" text-anchor="middle" font-size="10.5" fill="#7a2a20">整定 10 A</text>
  <rect x="372" y="176" width="46" height="88" rx="4" fill="#fbfbf3" stroke="#ddd"/>
  <text x="395" y="200" text-anchor="middle" font-size="10" fill="#8a5a30">95-96</text>
  <text x="395" y="216" text-anchor="middle" font-size="10" fill="#8a5a30">NC</text>
  <text x="395" y="240" text-anchor="middle" font-size="10" fill="#1a5080">97-98</text>
  <text x="395" y="256" text-anchor="middle" font-size="10" fill="#1a5080">NO</text>

  <!-- 进线端 L1/L2/L3 -->
  <circle cx="290" cy="80" r="7" fill="#d4aa52" stroke="#6a5a28" stroke-width="1.2"/>
  <circle cx="344" cy="80" r="7" fill="#d4aa52" stroke="#6a5a28" stroke-width="1.2"/>
  <circle cx="398" cy="80" r="7" fill="#d4aa52" stroke="#6a5a28" stroke-width="1.2"/>
  <text x="290" y="68" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c0392b">L1</text>
  <text x="344" y="68" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#20a030">L2</text>
  <text x="398" y="68" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2050e0">L3</text>
  <!-- 出线端 T1/T2/T3 -->
  <circle cx="290" cy="338" r="7" fill="#d4aa52" stroke="#6a5a28" stroke-width="1.2"/>
  <circle cx="344" cy="338" r="7" fill="#d4aa52" stroke="#6a5a28" stroke-width="1.2"/>
  <circle cx="398" cy="338" r="7" fill="#d4aa52" stroke="#6a5a28" stroke-width="1.2"/>
  <text x="278" y="362" text-anchor="end" font-size="10.5" font-weight="bold" fill="#c0392b">T1</text>
  <text x="332" y="362" text-anchor="end" font-size="10.5" font-weight="bold" fill="#20a030">T2</text>
  <text x="386" y="362" text-anchor="end" font-size="10.5" font-weight="bold" fill="#2050e0">T3</text>
  <!-- NC 端子 95/96 -->
  <circle cx="446" cy="196" r="7" fill="#8a5a30" stroke="#5a3a18" stroke-width="1.2"/>
  <circle cx="446" cy="228" r="7" fill="#e06020" stroke="#a04010" stroke-width="1.2"/>
  <text x="462" y="200" font-size="10" fill="#8a5a30">95</text>
  <text x="462" y="232" font-size="10" fill="#e06020">96</text>

  <!-- ===== 主电路连线 ===== -->
  <g fill="none" stroke-width="2.4">
    <polyline points="153,172 210,172 210,64 290,64 290,80" stroke="#c0392b"/>
    <polyline points="153,204 230,204 230,74 344,74 344,80" stroke="#20a030"/>
    <polyline points="153,236 250,236 250,84 398,84 398,80" stroke="#2050e0"/>
    <polyline points="290,345 290,392" stroke="#c0392b"/>
    <polyline points="344,345 344,392" stroke="#20a030"/>
    <polyline points="398,345 398,392" stroke="#2050e0"/>
  </g>

  <!-- ===== 负载电阻（星形） ===== -->
  <g>
    <rect x="281" y="392" width="18" height="46" fill="#f0ece3" stroke="#8a7a5a" stroke-width="1.6"/>
    <rect x="335" y="392" width="18" height="46" fill="#f0ece3" stroke="#8a7a5a" stroke-width="1.6"/>
    <rect x="389" y="392" width="18" height="46" fill="#f0ece3" stroke="#8a7a5a" stroke-width="1.6"/>
    <text x="308" y="420" font-size="11" fill="#555">R1</text>
    <text x="362" y="420" font-size="11" fill="#555">R2</text>
    <text x="416" y="420" font-size="11" fill="#555">R3</text>
  </g>
  <g fill="none" stroke-width="2.4">
    <polyline points="290,438 290,462 344,462" stroke="#c0392b"/>
    <polyline points="398,438 398,462 344,462" stroke="#2050e0"/>
    <polyline points="344,438 344,462" stroke="#20a030"/>
  </g>
  <circle cx="344" cy="462" r="4.5" fill="#333"/>
  <text x="344" y="482" text-anchor="middle" font-size="10.5" fill="#555">星形连接公共点（10 Ω × 3）</text>

  <!-- ===== 万用表测 NC（流程②） ===== -->
  <rect x="500" y="150" width="140" height="96" rx="8" fill="#eef7ee" stroke="#2f6f3f" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="570" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f6f3f">万用表（200Ω）</text>
  <text x="570" y="196" text-anchor="middle" font-size="10.5" fill="#2f6f3f">红表笔 V · 黑表笔 COM</text>
  <text x="570" y="216" text-anchor="middle" font-size="10.5" fill="#888">流程②：测热元件 / NC 触头</text>
  <text x="570" y="234" text-anchor="middle" font-size="10.5" fill="#888">跳闸后显示 O.L</text>
  <g fill="none" stroke-width="1.8" stroke-dasharray="5 4">
    <path d="M500 186 Q480 186 470 196 L453 196" stroke="#c0392b"/>
    <path d="M500 210 Q478 210 466 228 L453 228" stroke="#333"/>
  </g>
</svg>
