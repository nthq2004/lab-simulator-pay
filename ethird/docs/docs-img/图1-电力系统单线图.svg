<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2d3436"/>
    </marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2d3436">船舶主配电装置单线图（单母线 400V / 50Hz）</text>

  <!-- ── 汇流排（母线） ── -->
  <line x1="120" y1="130" x2="840" y2="130" stroke="#2471a3" stroke-width="9" stroke-linecap="round"/>
  <text x="480" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a5276">三相汇流排　AC 400V / 50Hz</text>

  <!-- ── 1# 发电机组（左） ── -->
  <circle cx="160" cy="330" r="42" fill="#eafaf1" stroke="#1e8449" stroke-width="2.5"/>
  <text x="160" y="318" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e8449">G</text>
  <text x="160" y="342" text-anchor="middle" font-size="14" fill="#1e8449">1#</text>
  <text x="160" y="286" text-anchor="middle" font-size="13" fill="#2d3436">1#同步发电机</text>
  <text x="160" y="392" text-anchor="middle" font-size="12" fill="#555">400V·80kW·cosφ0.8·50Hz</text>
  <!-- G1 → QF1 导线 -->
  <line x1="160" y1="372" x2="160" y2="418" stroke="#2d3436" stroke-width="2.5"/>
  <rect x="130" y="418" width="60" height="34" rx="4" fill="#fff" stroke="#2d3436" stroke-width="2"/>
  <line x1="166" y1="438" x2="196" y2="438" stroke="#c0392b" stroke-width="3"/>
  <line x1="196" y1="430" x2="204" y2="448" stroke="#c0392b" stroke-width="3"/>
  <text x="160" y="472" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">QF1</text>
  <text x="160" y="490" text-anchor="middle" font-size="11" fill="#555">框架式空气断路器</text>
  <line x1="160" y1="452" x2="160" y2="502" stroke="#2d3436" stroke-width="2.5"/>
  <!-- 上母线 -->
  <line x1="160" y1="502" x2="160" y2="130" stroke="#2d3436" stroke-width="2.5"/>

  <!-- ── 2# 发电机组（右） ── -->
  <circle cx="800" cy="330" r="42" fill="#fdebd0" stroke="#e67e22" stroke-width="2.5"/>
  <text x="800" y="318" text-anchor="middle" font-size="20" font-weight="bold" fill="#d35400">G</text>
  <text x="800" y="342" text-anchor="middle" font-size="14" fill="#d35400">2#</text>
  <text x="800" y="286" text-anchor="middle" font-size="13" fill="#2d3436">2#同步发电机</text>
  <text x="800" y="392" text-anchor="middle" font-size="12" fill="#555">400V·80kW·cosφ0.8·50Hz</text>
  <line x1="800" y1="372" x2="800" y2="418" stroke="#2d3436" stroke-width="2.5"/>
  <rect x="770" y="418" width="60" height="34" rx="4" fill="#fff" stroke="#2d3436" stroke-width="2"/>
  <line x1="806" y1="438" x2="836" y2="438" stroke="#c0392b" stroke-width="3"/>
  <line x1="836" y1="430" x2="844" y2="448" stroke="#c0392b" stroke-width="3"/>
  <text x="800" y="472" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">QF2</text>
  <text x="800" y="490" text-anchor="middle" font-size="11" fill="#555">框架式空气断路器</text>
  <line x1="800" y1="452" x2="800" y2="502" stroke="#2d3436" stroke-width="2.5"/>
  <line x1="800" y1="502" x2="800" y2="130" stroke="#2d3436" stroke-width="2.5"/>

  <!-- ── 馈线：照明 ── -->
  <line x1="250" y1="130" x2="250" y2="180" stroke="#2d3436" stroke-width="2.5"/>
  <rect x="228" y="180" width="44" height="28" rx="4" fill="#fff" stroke="#2d3436" stroke-width="2"/>
  <line x1="252" y1="194" x2="264" y2="194" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="264" y1="188" x2="270" y2="202" stroke="#c0392b" stroke-width="2.5"/>
  <text x="250" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d3436">QF3</text>
  <line x1="250" y1="208" x2="250" y2="250" stroke="#2d3436" stroke-width="2.5"/>
  <!-- 照明灯组 -->
  <circle cx="238" cy="258" r="9" stroke="#f39c12" stroke-width="2" fill="#fef9e7"/>
  <line x1="238" y1="249" x2="238" y2="258" stroke="#f39c12" stroke-width="2"/>
  <circle cx="262" cy="258" r="9" stroke="#f39c12" stroke-width="2" fill="#fef9e7"/>
  <circle cx="250" cy="284" r="9" stroke="#f39c12" stroke-width="2" fill="#fef9e7"/>
  <line x1="250" y1="275" x2="250" y2="284" stroke="#f39c12" stroke-width="2"/>
  <text x="250" y="312" text-anchor="middle" font-size="12" fill="#555">照明馈线</text>

  <!-- ── 馈线：三相可调负载 ── -->
  <line x1="420" y1="130" x2="420" y2="180" stroke="#2d3436" stroke-width="2.5"/>
  <rect x="398" y="180" width="44" height="28" rx="4" fill="#fff" stroke="#2d3436" stroke-width="2"/>
  <line x1="422" y1="194" x2="434" y2="194" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="434" y1="188" x2="440" y2="202" stroke="#c0392b" stroke-width="2.5"/>
  <text x="420" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d3436">QF4</text>
  <line x1="420" y1="208" x2="420" y2="250" stroke="#2d3436" stroke-width="2.5"/>
  <rect x="390" y="250" width="60" height="40" rx="6" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="420" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#d35400">可调负载</text>
  <text x="420" y="292" text-anchor="middle" font-size="11" fill="#555">三相20kW</text>
  <line x1="420" y1="290" x2="420" y2="330" stroke="#2d3436" stroke-width="2.5"/>
  <text x="420" y="352" text-anchor="middle" font-size="12" fill="#555">动力馈线（突加负载试验）</text>

  <!-- ── 同步回路（虚线） ── -->
  <!-- 电压采样：汇流排 -->
  <path d="M340,130 L340,170 L610,170" stroke="#2980b9" stroke-width="2" fill="none" stroke-dasharray="7 4"/>
  <path d="M575,170 L575,232" stroke="#2980b9" stroke-width="2" fill="none" stroke-dasharray="7 4"/>
  <text x="360" y="160" font-size="12" fill="#2980b9">运行侧电压（汇流排）</text>
  <!-- 待并侧电压：1#机与2#机经选择开关 -->
  <path d="M160,472 L120,472 L120,560" stroke="#1e8449" stroke-width="2" fill="none" stroke-dasharray="7 4"/>
  <path d="M800,472 L840,472 L840,560" stroke="#e67e22" stroke-width="2" fill="none" stroke-dasharray="7 4"/>
  <path d="M120,560 L840,560" stroke="#555" stroke-width="2" fill="none" stroke-dasharray="7 4"/>
  <path d="M480,560 L480,508" stroke="#555" stroke-width="2" fill="none" stroke-dasharray="7 4"/>
  <circle cx="480" cy="496" r="8" fill="#fff" stroke="#2d3436" stroke-width="2"/>
  <text x="480" y="474" text-anchor="middle" font-size="12" fill="#2d3436">○</text>
  <!-- 选择开关 -->
  <rect x="440" y="430" width="80" height="56" rx="8" fill="#f8f9f9" stroke="#2d3436" stroke-width="2"/>
  <text x="480" y="452" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d3436">选择开关</text>
  <text x="480" y="470" text-anchor="middle" font-size="11" fill="#555">OFF/1/2/3</text>
  <!-- 同步表 -->
  <circle cx="480" cy="232" r="34" fill="#fef9e7" stroke="#d4ac0d" stroke-width="2.5"/>
  <line x1="480" y1="232" x2="466" y2="206" stroke="#c0392b" stroke-width="3"/>
  <circle cx="480" cy="232" r="4" fill="#2d3436"/>
  <text x="480" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#7d6608">同步表</text>
  <text x="480" y="292" text-anchor="middle" font-size="11" fill="#555">待并侧电压（经选择开关：1→1#机、2→2#机）</text>

  <!-- ── 控制回路说明 ── -->
  <rect x="640" y="420" width="290" height="120" rx="10" fill="#eaf2f8" stroke="#2471a3" stroke-width="1.5"/>
  <text x="785" y="446" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a5276">控制与保护（24V DC）</text>
  <g font-size="11.5" fill="#2d3436">
    <text x="656" y="468">• 合闸线圈：遥控合闸（储能释放）</text>
    <text x="656" y="488">• 失压脱扣器：控制电源失电自动分闸</text>
    <text x="656" y="508">• 分励脱扣器：并车/频差/逆功率保护输出</text>
    <text x="656" y="528">• 逆功率保护：≥8kW 持续 5s → QF2 跳闸</text>
  </g>
</svg>