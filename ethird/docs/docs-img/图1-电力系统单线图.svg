<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2d3436"/>
    </marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2d3436">船舶主配电装置单线图（单母线 400V / 50Hz）</text>

  <!-- ── 汇流排（母线） ── -->
  <line x1="100" y1="130" x2="860" y2="130" stroke="#2471a3" stroke-width="9" stroke-linecap="round"/>
  <text x="480" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a5276">三相汇流排　AC 400V / 50Hz</text>

  <!-- ── 1# 发电机组（左） ── -->
  <line x1="150" y1="130" x2="150" y2="264" stroke="#2d3436" stroke-width="2.5"/>
  <rect x="120" y="264" width="60" height="36" rx="4" fill="#fff" stroke="#2d3436" stroke-width="2"/>
  <line x1="132" y1="294" x2="168" y2="270" stroke="#c0392b" stroke-width="3"/>
  <text x="188" y="278" font-size="14" font-weight="bold" fill="#c0392b">QF1</text>
  <text x="188" y="294" font-size="11" fill="#555">1#主开关</text>
  <line x1="150" y1="300" x2="150" y2="338" stroke="#2d3436" stroke-width="2.5"/>
  <circle cx="150" cy="380" r="42" fill="#eafaf1" stroke="#1e8449" stroke-width="2.5"/>
  <text x="150" y="376" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e8449">G</text>
  <text x="150" y="396" text-anchor="middle" font-size="13" fill="#1e8449">1#</text>
  <text x="200" y="370" font-size="11.5" fill="#555">1#同步发电机</text>
  <text x="200" y="386" font-size="11" fill="#555">400V · 80kW</text>
  <text x="200" y="402" font-size="11" fill="#555">cosφ0.8 · 50Hz</text>

  <!-- ── 2# 发电机组（右） ── -->
  <line x1="810" y1="130" x2="810" y2="264" stroke="#2d3436" stroke-width="2.5"/>
  <rect x="780" y="264" width="60" height="36" rx="4" fill="#fff" stroke="#2d3436" stroke-width="2"/>
  <line x1="792" y1="294" x2="828" y2="270" stroke="#c0392b" stroke-width="3"/>
  <text x="732" y="278" text-anchor="end" font-size="14" font-weight="bold" fill="#c0392b">QF2</text>
  <text x="732" y="294" text-anchor="end" font-size="11" fill="#555">2#主开关</text>
  <line x1="810" y1="300" x2="810" y2="338" stroke="#2d3436" stroke-width="2.5"/>
  <circle cx="810" cy="380" r="42" fill="#fdebd0" stroke="#e67e22" stroke-width="2.5"/>
  <text x="810" y="376" text-anchor="middle" font-size="20" font-weight="bold" fill="#d35400">G</text>
  <text x="810" y="396" text-anchor="middle" font-size="13" fill="#d35400">2#</text>
  <text x="760" y="370" text-anchor="end" font-size="11.5" fill="#555">2#同步发电机</text>
  <text x="760" y="386" text-anchor="end" font-size="11" fill="#555">400V · 80kW</text>
  <text x="760" y="402" text-anchor="end" font-size="11" fill="#555">cosφ0.8 · 50Hz</text>

  <!-- ── 馈线：照明 ── -->
  <line x1="280" y1="130" x2="280" y2="180" stroke="#2d3436" stroke-width="2.5"/>
  <rect x="258" y="180" width="44" height="30" rx="4" fill="#fff" stroke="#2d3436" stroke-width="2"/>
  <line x1="268" y1="204" x2="292" y2="186" stroke="#c0392b" stroke-width="2.5"/>
  <text x="310" y="200" font-size="13" font-weight="bold" fill="#2d3436">QF3</text>
  <line x1="280" y1="210" x2="280" y2="240" stroke="#2d3436" stroke-width="2.5"/>
  <circle cx="266" cy="248" r="9" stroke="#f39c12" stroke-width="2" fill="#fef9e7"/>
  <circle cx="294" cy="248" r="9" stroke="#f39c12" stroke-width="2" fill="#fef9e7"/>
  <circle cx="280" cy="274" r="9" stroke="#f39c12" stroke-width="2" fill="#fef9e7"/>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#555">照明馈线</text>

  <!-- ── 馈线：三相可调负载 ── -->
  <line x1="560" y1="130" x2="560" y2="180" stroke="#2d3436" stroke-width="2.5"/>
  <rect x="538" y="180" width="44" height="30" rx="4" fill="#fff" stroke="#2d3436" stroke-width="2"/>
  <line x1="548" y1="204" x2="572" y2="186" stroke="#c0392b" stroke-width="2.5"/>
  <text x="590" y="200" font-size="13" font-weight="bold" fill="#2d3436">QF4</text>
  <line x1="560" y1="210" x2="560" y2="240" stroke="#2d3436" stroke-width="2.5"/>
  <rect x="514" y="240" width="92" height="48" rx="6" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="560" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#d35400">可调负载</text>
  <text x="560" y="278" text-anchor="middle" font-size="11" fill="#555">三相 20kW</text>
  <text x="560" y="310" text-anchor="middle" font-size="12" fill="#555">动力馈线（突加负载试验）</text>

  <!-- ── 同步表：运行侧电压采样（母线直引） ── -->
  <path d="M420,130 L420,270" stroke="#2980b9" stroke-width="2" fill="none" stroke-dasharray="7 4" marker-end="url(#arr)"/>
  <text x="430" y="200" font-size="12" fill="#2980b9">运行侧电压（汇流排）</text>

  <!-- 同步表 -->
  <circle cx="420" cy="310" r="40" fill="#fef9e7" stroke="#d4ac0d" stroke-width="2.5"/>
  <line x1="420" y1="310" x2="404" y2="284" stroke="#c0392b" stroke-width="3"/>
  <circle cx="420" cy="310" r="4" fill="#2d3436"/>
  <text x="420" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#7d6608">同步表</text>

  <!-- ── 选择开关 ── -->
  <path d="M420,350 L420,440" stroke="#1e8449" stroke-width="2" fill="none" stroke-dasharray="7 4" marker-end="url(#arr)"/>
  <text x="430" y="400" font-size="12" fill="#1e8449">待并侧电压</text>
  <rect x="360" y="440" width="120" height="70" rx="8" fill="#f8f9f9" stroke="#2d3436" stroke-width="2"/>
  <text x="420" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d3436">同步表选择开关</text>
  <text x="420" y="481" text-anchor="middle" font-size="11.5" fill="#555">OFF / 1 / 2 / 3</text>
  <text x="420" y="498" text-anchor="middle" font-size="11" fill="#555">1档→G1　2档→G2</text>

  <!-- 待并侧采样：1# 机 -->
  <path d="M150,422 L150,455 L360,455" stroke="#1e8449" stroke-width="2" fill="none" stroke-dasharray="7 4"/>
  <text x="250" y="448" text-anchor="middle" font-size="11" fill="#1e8449">1# 机电压</text>
  <!-- 待并侧采样：2# 机 -->
  <path d="M810,422 L810,495 L360,495" stroke="#e67e22" stroke-width="2" fill="none" stroke-dasharray="7 4"/>
  <text x="620" y="488" text-anchor="middle" font-size="11" fill="#e67e22">2# 机电压</text>

  <!-- ── 控制回路说明 ── -->
  <rect x="560" y="560" width="370" height="104" rx="10" fill="#eaf2f8" stroke="#2471a3" stroke-width="1.5"/>
  <text x="745" y="582" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a5276">控制与保护（24V DC）</text>
  <g font-size="11.5" fill="#2d3436">
    <text x="576" y="602">• 合闸线圈：遥控合闸（储能释放）</text>
    <text x="576" y="620">• 失压脱扣器：控制电源失电自动分闸</text>
    <text x="576" y="638">• 分励脱扣器：并车/频差/逆功率保护输出</text>
    <text x="576" y="656">• 逆功率保护：≥8kW 持续 5s → QF 跳闸</text>
  </g>

  <!-- ── 图例 ── -->
  <g font-size="11" fill="#555">
    <text x="60" y="582">图例：</text>
    <line x1="100" y1="578" x2="140" y2="578" stroke="#2d3436" stroke-width="2.5"/>
    <text x="146" y="582">主回路</text>
    <line x1="100" y1="600" x2="140" y2="600" stroke="#2980b9" stroke-width="2" stroke-dasharray="7 4"/>
    <text x="146" y="604">同步采样回路</text>
    <rect x="100" y="622" width="40" height="22" fill="#fff" stroke="#2d3436" stroke-width="2"/>
    <line x1="108" y1="640" x2="132" y2="626" stroke="#c0392b" stroke-width="3"/>
    <text x="146" y="640">框架式空气断路器（合）</text>
  </g>
</svg>
