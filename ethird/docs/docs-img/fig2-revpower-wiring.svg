<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="awO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#b5451d"/>
    </marker>
    <marker id="awB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#1a6bd6"/>
    </marker>
    <marker id="awR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#a02020"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="500" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a2a4a">逆功率继电器与发电机输出的连接接线图</text>
  <text x="500" y="53" text-anchor="middle" font-size="13" fill="#666">发电机经断路器并网运行，电流取自发电机出口 CT、电压取自母线 TV，出口触点作用于跳闸与信号</text>
  <line x1="40" y1="66" x2="960" y2="66" stroke="#c9d6e8" stroke-width="2"/>

  <!-- ═══ 母线（三相） ═══ -->
  <line x1="60" y1="100" x2="430" y2="100" stroke="#333" stroke-width="2.6"/>
  <line x1="60" y1="114" x2="430" y2="114" stroke="#333" stroke-width="2.6"/>
  <line x1="60" y1="128" x2="430" y2="128" stroke="#333" stroke-width="2.6"/>
  <text x="440" y="104" font-size="11" fill="#666">A相</text>
  <text x="440" y="118" font-size="11" fill="#666">B相</text>
  <text x="440" y="132" font-size="11" fill="#666">C相</text>
  <text x="245" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4d8f">母线（电网 / 系统）</text>

  <!-- ═══ 主回路：母线A → QF → CT → 发电机 ═══ -->
  <line x1="150" y1="100" x2="150" y2="130" stroke="#333" stroke-width="2.2"/>
  <rect x="118" y="130" width="64" height="54" rx="8" fill="#fff" stroke="#555" stroke-width="1.8"/>
  <text x="150" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">QF</text>
  <text x="150" y="170" text-anchor="middle" font-size="9.5" fill="#666">并网断路器</text>
  <text x="196" y="146" font-size="10" fill="#555">跳闸线圈 YT（QF 内）</text>
  <line x1="182" y1="142" x2="210" y2="142" stroke="#888" stroke-width="1.2" stroke-dasharray="3,3"/>

  <line x1="150" y1="184" x2="150" y2="210" stroke="#333" stroke-width="2.2"/>
  <rect x="116" y="210" width="68" height="60" rx="8" fill="#eaf4fb" stroke="#3a7bd5" stroke-width="1.6"/>
  <text x="150" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a4d8f">CT</text>
  <text x="150" y="252" text-anchor="middle" font-size="9.5" fill="#666">电流互感器</text>
  <text x="150" y="266" text-anchor="middle" font-size="9" fill="#666">（发电机出口）</text>
  <line x1="150" y1="270" x2="150" y2="294" stroke="#333" stroke-width="2.2"/>

  <!-- 发电机 -->
  <circle cx="150" cy="350" r="56" fill="#f2f7f2" stroke="#2f6b3d" stroke-width="2.4"/>
  <text x="150" y="348" text-anchor="middle" font-size="24" font-weight="bold" fill="#2f6b3d">G</text>
  <text x="150" y="370" text-anchor="middle" font-size="11" fill="#333">发电机</text>
  <text x="150" y="386" text-anchor="middle" font-size="10" fill="#666">（原动机驱动）</text>
  <text x="150" y="436" text-anchor="middle" font-size="10.5" fill="#888">（B、C 相回路对称，图中略）</text>
  <!-- 中性点接地 -->
  <line x1="118" y1="378" x2="85" y2="415" stroke="#2f6b3d" stroke-width="1.6"/>
  <line x1="73" y1="415" x2="97" y2="415" stroke="#2f6b3d" stroke-width="2"/>
  <line x1="77" y1="421" x2="93" y2="421" stroke="#2f6b3d" stroke-width="2"/>
  <line x1="81" y1="427" x2="89" y2="427" stroke="#2f6b3d" stroke-width="2"/>
  <text x="66" y="444" font-size="10.5" fill="#2f6b3d">中性点</text>

  <!-- ═══ TV 电压互感器（母线侧） ═══ -->
  <line x1="390" y1="100" x2="390" y2="150" stroke="#333" stroke-width="1.8"/>
  <rect x="360" y="150" width="80" height="54" rx="8" fill="#fdf3e3" stroke="#d98a2b" stroke-width="1.6"/>
  <text x="400" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5a1a">TV</text>
  <text x="400" y="190" text-anchor="middle" font-size="9.5" fill="#666">电压互感器</text>
  <text x="398" y="128" font-size="10" fill="#666">一次并联于母线</text>
  <!-- TV 二次端子 -->
  <circle cx="443" cy="216" r="3" fill="#1a6bd6"/>
  <text x="452" y="220" font-size="10.5" fill="#1a6bd6">a（A相电压）</text>
  <circle cx="443" cy="232" r="3" fill="#1a6bd6"/>
  <text x="452" y="236" font-size="10.5" fill="#555">n（中性线）</text>

  <!-- ═══ 逆功率继电器 KRP ═══ -->
  <rect x="560" y="230" width="210" height="250" rx="10" fill="#f6f0fc" stroke="#8e5bc0" stroke-width="2"/>
  <text x="665" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a2d8a">逆功率继电器 KRP</text>
  <line x1="572" y1="268" x2="758" y2="268" stroke="#8e5bc0" stroke-width="1"/>
  <text x="665" y="288" text-anchor="middle" font-size="10.5" fill="#555">相敏测量 → 逆功率判别 → 延时 → 出口</text>
  <!-- 左侧输入端子 -->
  <circle cx="554" cy="320" r="3.5" fill="#b5451d"/>
  <text x="544" y="324" text-anchor="end" font-size="11" fill="#b5451d">I1（电流进）</text>
  <circle cx="554" cy="360" r="3.5" fill="#b5451d"/>
  <text x="544" y="364" text-anchor="end" font-size="11" fill="#b5451d">I2（电流出）</text>
  <circle cx="554" cy="420" r="3.5" fill="#1a6bd6"/>
  <text x="544" y="424" text-anchor="end" font-size="11" fill="#1a6bd6">U1（电压进）</text>
  <circle cx="554" cy="460" r="3.5" fill="#1a6bd6"/>
  <text x="544" y="464" text-anchor="end" font-size="11" fill="#1a6bd6">U2（电压回）</text>
  <!-- 右侧出口端子 -->
  <circle cx="766" cy="300" r="3.5" fill="#a02020"/>
  <text x="758" y="292" text-anchor="end" font-size="11" fill="#a02020">NO 跳闸出口</text>
  <circle cx="766" cy="360" r="3.5" fill="#2b6cb0"/>
  <text x="758" y="352" text-anchor="end" font-size="11" fill="#2b6cb0">NO 信号出口</text>

  <!-- CT 二次接线 -->
  <circle cx="186" cy="224" r="3" fill="#b5451d"/>
  <text x="178" y="220" text-anchor="end" font-size="10.5" fill="#b5451d">s1</text>
  <circle cx="186" cy="256" r="3" fill="#b5451d"/>
  <text x="178" y="252" text-anchor="end" font-size="10.5" fill="#b5451d">s2</text>
  <path d="M186,224 L300,224 L300,317" stroke="#b5451d" stroke-width="1.8" fill="none" marker-end="url(#awO)"/>
  <path d="M186,256 L320,256 L320,357" stroke="#b5451d" stroke-width="1.8" fill="none" marker-end="url(#awO)"/>
  <text x="245" y="214" text-anchor="middle" font-size="10.5" fill="#b5451d">CT 二次（电流回路，注意极性）</text>

  <!-- TV 二次接线 -->
  <path d="M443,216 L500,216 L500,417" stroke="#1a6bd6" stroke-width="1.8" fill="none" marker-end="url(#awB)"/>
  <path d="M443,232 L520,232 L520,457" stroke="#1a6bd6" stroke-width="1.8" fill="none" marker-end="url(#awB)"/>
  <text x="471" y="208" text-anchor="middle" font-size="10.5" fill="#1a6bd6">TV 二次（电压回路）</text>

  <!-- ═══ 直流操作电源 ═══ -->
  <line x1="860" y1="120" x2="860" y2="480" stroke="#c0392b" stroke-width="2.4"/>
  <line x1="960" y1="120" x2="960" y2="620" stroke="#7f8c8d" stroke-width="2.4"/>
  <text x="860" y="110" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#c0392b">+KM</text>
  <text x="960" y="110" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#666">−KM</text>
  <text x="910" y="136" text-anchor="middle" font-size="10" fill="#888">直流操作电源（110/220V）</text>

  <!-- ═══ 跳闸回路：KRP-NO → KM 线圈 → −KM ═══ -->
  <path d="M860,300 L769,300" stroke="#a02020" stroke-width="1.8" fill="none"/>
  <circle cx="860" cy="300" r="3" fill="#a02020"/>
  <path d="M766,300 L790,300 L790,404" stroke="#a02020" stroke-width="1.8" fill="none" marker-end="url(#awR)"/>
  <rect x="740" y="408" width="100" height="48" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="790" y="428" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">KM</text>
  <text x="790" y="446" text-anchor="middle" font-size="9.5" fill="#666">中间继电器</text>
  <path d="M820,456 L820,560 L958,560" stroke="#a02020" stroke-width="1.8" fill="none" marker-end="url(#awR)"/>
  <text x="880" y="552" text-anchor="middle" font-size="10" fill="#a02020">KM 线圈回路</text>

  <!-- ═══ 跳闸执行：+KM → KM触点 → YT → QF辅助 → −KM ═══ -->
  <path d="M860,470 L818,470" stroke="#333" stroke-width="1.8" fill="none"/>
  <circle cx="860" cy="470" r="3" fill="#333"/>
  <circle cx="814" cy="470" r="3" fill="#333"/>
  <circle cx="786" cy="470" r="3" fill="#333"/>
  <line x1="789" y1="464" x2="811" y2="456" stroke="#333" stroke-width="2"/>
  <text x="800" y="450" text-anchor="middle" font-size="10" fill="#c0392b">KM 常开触点</text>
  <path d="M782,470 L660,470 L660,499" stroke="#333" stroke-width="1.8" fill="none" marker-end="url(#aw)"/>
  <rect x="620" y="503" width="80" height="48" rx="6" fill="#fdeaea" stroke="#cc4444" stroke-width="1.6"/>
  <text x="660" y="523" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a02020">YT</text>
  <text x="660" y="541" text-anchor="middle" font-size="9.5" fill="#666">跳闸线圈</text>
  <path d="M660,551 L660,600 L826,600" stroke="#333" stroke-width="1.8" fill="none"/>
  <circle cx="830" cy="600" r="3" fill="#333"/>
  <circle cx="862" cy="600" r="3" fill="#333"/>
  <line x1="835" y1="594" x2="857" y2="586" stroke="#333" stroke-width="2"/>
  <path d="M866,600 L958,600" stroke="#333" stroke-width="1.8" fill="none" marker-end="url(#aw)"/>
  <text x="846" y="578" text-anchor="middle" font-size="10" fill="#555">QF 辅助常开触点</text>
  <text x="740" y="590" text-anchor="end" font-size="10" fill="#555">跳闸回路：</text>

  <!-- ═══ 信号回路：KRP-NO → 光字牌 → −KM ═══ -->
  <path d="M766,360 L852,360 Q860,348 868,360 L876,360" stroke="#2b6cb0" stroke-width="1.8" fill="none"/>
  <rect x="878" y="338" width="76" height="44" rx="6" fill="#e8f0fe" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="916" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4d8f">HS</text>
  <text x="916" y="374" text-anchor="middle" font-size="9.5" fill="#555">光字牌</text>
  <path d="M954,360 L958,360" stroke="#2b6cb0" stroke-width="1.8" fill="none" marker-end="url(#awB)"/>
  <text x="800" y="384" text-anchor="middle" font-size="10" fill="#2b6cb0">信号回路（"逆功率动作"告警）</text>

  <!-- ═══ 底部说明 ═══ -->
  <text x="500" y="666" text-anchor="middle" font-size="12" fill="#555">注：CT 二次极性须与 TV 二次电压相位正确配合，否则功率方向判别反向，功能测试时必须校验极性。</text>
  <text x="500" y="692" text-anchor="middle" font-size="12" fill="#555">发电机失磁 / 失原动力时向系统倒送有功 → 逆功率继电器动作 → KM 得电 → YT 跳闸解列，光字牌告警。</text>
</svg>
