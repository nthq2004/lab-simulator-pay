<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a5568"/>
    </marker>
    <marker id="arwG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#276749"/>
    </marker>
  </defs>
  <rect width="1040" height="640" fill="#ffffff"/>

  <text x="520" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a202c">主电网与应急电网关系图</text>

  <!-- ── 主电网区域 ── -->
  <rect x="20" y="50" width="600" height="240" rx="12" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="36" y="80" font-size="16" font-weight="bold" fill="#2b6cb0">主电网（正常电源）</text>

  <g text-anchor="middle">
    <rect x="45" y="120" width="130" height="76" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="110" y="152" font-weight="bold" fill="#1a202c">1#同步发电机</text>
    <text x="110" y="174" font-size="12" fill="#4a5568">80kW · 400V · 50Hz</text>

    <rect x="205" y="120" width="90" height="76" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="250" y="152" font-weight="bold" fill="#1a202c">主开关</text>
    <text x="250" y="174" font-size="12" fill="#4a5568">qf1</text>

    <rect x="325" y="120" width="100" height="76" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="375" y="152" font-weight="bold" fill="#1a202c">主汇流排</text>
    <text x="375" y="174" font-size="12" fill="#4a5568">bus1</text>

    <rect x="455" y="120" width="145" height="76" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="527" y="147" font-weight="bold" fill="#1a202c">低压配电箱</text>
    <text x="527" y="169" font-size="12" fill="#4a5568">pdb1（sw1/sw2/sw3）</text>
  </g>
  <text x="36" y="248" font-size="13" fill="#4a5568">正常时联络开关闭合，由主电网经「主汇流排 → 配电箱 → 联络开关」向应急汇流排供电；</text>
  <text x="36" y="270" font-size="13" fill="#4a5568">主电网失电时联络开关立即断开，转由应急发电机独立供电。</text>

  <!-- 主回路连线 -->
  <g stroke="#4a5568" stroke-width="2.5" marker-end="url(#arw)" fill="none">
    <line x1="175" y1="158" x2="203" y2="158"/>
    <line x1="295" y1="158" x2="323" y2="158"/>
    <line x1="425" y1="158" x2="453" y2="158"/>
    <line x1="600" y1="158" x2="626" y2="158"/>
    <line x1="696" y1="158" x2="714" y2="158"/>
  </g>

  <!-- ── 联络开关（桥接于两网之间） ── -->
  <rect x="628" y="122" width="68" height="72" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="2.5"/>
  <text x="662" y="152" text-anchor="middle" font-weight="bold" fill="#276749">联络开关</text>
  <text x="662" y="174" text-anchor="middle" font-size="12" fill="#276749">tie1</text>

  <!-- ── 应急电网区域 ── -->
  <rect x="700" y="50" width="320" height="560" rx="12" fill="#fff5eb" stroke="#c05621" stroke-width="2"/>
  <text x="716" y="80" font-size="16" font-weight="bold" fill="#c05621">应急电网（应急电源）</text>

  <g text-anchor="middle">
    <rect x="716" y="120" width="130" height="76" rx="8" fill="#ffffff" stroke="#c05621" stroke-width="2"/>
    <text x="781" y="152" font-weight="bold" fill="#1a202c">应急汇流排</text>
    <text x="781" y="174" font-size="12" fill="#4a5568">bus2</text>

    <rect x="716" y="300" width="130" height="76" rx="8" fill="#ffffff" stroke="#c05621" stroke-width="2"/>
    <text x="781" y="330" font-weight="bold" font-size="13" fill="#1a202c">应急发电机主开关</text>
    <text x="781" y="352" font-size="12" fill="#4a5568">eqf1</text>

    <rect x="716" y="460" width="150" height="80" rx="8" fill="#ffffff" stroke="#c05621" stroke-width="2"/>
    <text x="791" y="490" font-weight="bold" fill="#1a202c">应急发电机组</text>
    <text x="791" y="512" font-size="12" fill="#4a5568">50kW · 400V · 50Hz</text>

    <rect x="880" y="120" width="120" height="36" rx="6" fill="#fffbe6" stroke="#b7791f" stroke-width="1.5"/>
    <text x="940" y="143" font-size="12.5" fill="#7b5800">应急灯 el1</text>
    <rect x="880" y="166" width="120" height="36" rx="6" fill="#fffbe6" stroke="#b7791f" stroke-width="1.5"/>
    <text x="940" y="189" font-size="12.5" fill="#7b5800">应急灯 el2</text>
    <rect x="880" y="212" width="120" height="36" rx="6" fill="#fffbe6" stroke="#b7791f" stroke-width="1.5"/>
    <text x="940" y="235" font-size="12.5" fill="#7b5800">应急灯 el3</text>
  </g>
  <!-- 应急灯供电线 -->
  <g stroke="#b7791f" stroke-width="2" marker-end="url(#arw)" fill="none">
    <line x1="846" y1="150" x2="878" y2="138"/>
    <line x1="846" y1="158" x2="878" y2="184"/>
    <line x1="846" y1="166" x2="878" y2="230"/>
  </g>
  <!-- 机组 → eqf1 → 汇流排 -->
  <g stroke="#c05621" stroke-width="2.5" marker-end="url(#arw)" fill="none">
    <line x1="781" y1="458" x2="781" y2="378"/>
    <line x1="781" y1="298" x2="781" y2="198"/>
  </g>

  <!-- ── 应急配电板及其控制线 ── -->
  <rect x="300" y="440" width="200" height="100" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="2"/>
  <text x="400" y="472" text-anchor="middle" font-weight="bold" fill="#276749">应急配电板 ep1</text>
  <text x="400" y="494" text-anchor="middle" font-size="12" fill="#276749">检测 · 控制模式 · 联络模式</text>
  <text x="400" y="514" text-anchor="middle" font-size="12" fill="#276749">自动控制逻辑</text>

  <g stroke="#276749" stroke-width="2" stroke-dasharray="7 5" fill="none">
    <!-- 控制联络开关 -->
    <path d="M400 440 L400 400 L660 400 L660 196" marker-end="url(#arwG)"/>
    <!-- 控制应急主开关 -->
    <path d="M500 440 L905 440 L905 338 L850 338" marker-end="url(#arwG)"/>
    <!-- 控制应急机组 -->
    <path d="M500 500 L714 500" marker-end="url(#arwG)"/>
  </g>
  <text x="672" y="394" font-size="11.5" fill="#276749">控制 tie1</text>
  <text x="800" y="452" font-size="11.5" fill="#276749">控制 eqf1</text>
  <text x="700" y="516" font-size="11.5" fill="#276749">控制机组起停</text>

  <!-- det 检测线（取自主配电箱 sw3 出口） -->
  <g stroke="#2b6cb0" stroke-width="2" stroke-dasharray="7 5" fill="none">
    <path d="M470 196 L470 210 L200 210 L200 600 L400 600 L400 542" marker-end="url(#arw)"/>
  </g>
  <text x="212" y="590" font-size="11.5" fill="#2b6cb0">检测端口 det ← 配电箱 sw3 出口</text>

  <!-- ── 说明 ── -->
  <rect x="20" y="600" width="600" height="30" rx="6" fill="#f8f9fa" stroke="#dadce0" stroke-width="1"/>
  <text x="320" y="620" text-anchor="middle" font-size="12" fill="#5a6a84">记忆要点：主电有电→联络合、应急停；主电失电→联络分、应急投；主电恢复→应急退、联络合。</text>
</svg>
