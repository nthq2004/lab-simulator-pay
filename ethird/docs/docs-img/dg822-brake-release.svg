<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="bL" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M9,0 L0,4.5 L9,9 Z" fill="#1565c0"/>
    </marker>
    <marker id="bR" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1565c0"/>
    </marker>
    <marker id="bF" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c62828"/>
    </marker>
    <marker id="bS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">图2 松闸（通电）状态</text>

  <!-- 磁轭与压板刚性连接杆 -->
  <line x1="170" y1="68" x2="342" y2="68" stroke="#8a94a6" stroke-width="4"/>
  <line x1="170" y1="68" x2="170" y2="80" stroke="#8a94a6" stroke-width="4"/>
  <line x1="342" y1="68" x2="342" y2="80" stroke="#8a94a6" stroke-width="4"/>
  <text x="256" y="58" text-anchor="middle" font-size="11" fill="#8a94a6">刚性连接</text>

  <!-- 转轴（剖面横穿） -->
  <line x1="15" y1="200" x2="745" y2="200" stroke="#666" stroke-width="10" stroke-linecap="round"/>

  <!-- 磁轭（E 形静铁心） -->
  <rect x="40" y="80"  width="30" height="240" fill="#b9c4d4" stroke="#5a6a84" stroke-width="2"/>
  <rect x="40" y="80"  width="130" height="50"  fill="#c2cddd" stroke="#5a6a84" stroke-width="2"/>
  <rect x="40" y="270" width="130" height="50"  fill="#c2cddd" stroke="#5a6a84" stroke-width="2"/>
  <rect x="130" y="155" width="40" height="90"  fill="#c2cddd" stroke="#5a6a84" stroke-width="2"/>

  <!-- 线圈（通电） -->
  <rect x="134" y="160" width="32" height="80" fill="#ff9800" stroke="#b96b00" stroke-width="2" rx="4"/>
  <line x1="139" y1="172" x2="161" y2="172" stroke="#fff" stroke-width="1.5"/>
  <line x1="139" y1="184" x2="161" y2="184" stroke="#fff" stroke-width="1.5"/>
  <line x1="139" y1="196" x2="161" y2="196" stroke="#fff" stroke-width="1.5"/>
  <line x1="139" y1="208" x2="161" y2="208" stroke="#fff" stroke-width="1.5"/>
  <line x1="139" y1="220" x2="161" y2="220" stroke="#fff" stroke-width="1.5"/>
  <line x1="139" y1="232" x2="161" y2="232" stroke="#fff" stroke-width="1.5"/>
  <line x1="134" y1="180" x2="110" y2="180" stroke="#b96b00" stroke-width="2"/>
  <line x1="134" y1="220" x2="110" y2="220" stroke="#b96b00" stroke-width="2"/>
  <text x="106" y="176" text-anchor="end" font-size="10.5" fill="#8a5200">A1</text>
  <text x="106" y="216" text-anchor="end" font-size="10.5" fill="#8a5200">A2</text>
  <text x="106" y="258" text-anchor="end" font-size="10.5" fill="#c62828" font-weight="bold">（DC24V）</text>

  <!-- 电磁吸力箭头（极面 → 衔铁） -->
  <line x1="176" y1="240" x2="190" y2="240" stroke="#c62828" stroke-width="3" marker-end="url(#bF)"/>
  <text x="180" y="258" text-anchor="middle" font-size="10" font-weight="bold" fill="#c62828">电磁</text>
  <text x="180" y="272" text-anchor="middle" font-size="10" font-weight="bold" fill="#c62828">吸力</text>

  <!-- 复位弹簧 ×2（压缩：波距变小） -->
  <path d="M170,115 L174,111 L178,119 L182,111 L186,119 L190,115" stroke="#2e7d32" stroke-width="2.5" fill="none"/>
  <path d="M170,285 L174,289 L178,281 L182,289 L186,281 L190,285" stroke="#2e7d32" stroke-width="2.5" fill="none"/>
  <text x="180" y="94" text-anchor="middle" font-size="11.5" fill="#2e7d32">复位弹簧（压缩）</text>

  <!-- 衔铁 + 摩擦片（吸合位置：左移贴近极面） -->
  <rect x="190" y="110" width="60" height="180" fill="#e8e8e8" stroke="#555" stroke-width="2"/>
  <rect x="250" y="122" width="14" height="156" fill="#b03030" stroke="#5c1010" stroke-width="1.5" rx="2"/>
  <text x="220" y="178" text-anchor="middle" font-size="12.5" fill="#444">衔铁</text>
  <text x="220" y="196" text-anchor="middle" font-size="10.5" fill="#777">（吸合左移）</text>

  <!-- 制动盘 -->
  <rect x="304" y="80" width="20" height="240" fill="#7ba7d0" stroke="#2a5a86" stroke-width="2"/>
  <circle cx="314" cy="200" r="9" fill="#fff" stroke="#2a5a86" stroke-width="2"/>

  <!-- 固定压板 -->
  <rect x="324" y="80" width="36" height="240" fill="#9a9a9a" stroke="#555" stroke-width="2"/>

  <!-- 吸合缝标注 -->
  <line x1="171" y1="148" x2="189" y2="148" stroke="#1565c0" stroke-width="2" marker-end="url(#bS)"/>
  <text x="180" y="136" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1565c0">吸合</text>

  <!-- 释放间隙标注（摩擦片 ↔ 制动盘） -->
  <line x1="266" y1="140" x2="302" y2="140" stroke="#1565c0" stroke-width="2.5" marker-start="url(#bL)" marker-end="url(#bR)"/>
  <text x="284" y="158" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">释放间隙</text>
  <text x="284" y="174" text-anchor="middle" font-size="10" fill="#1565c0">≈ δ</text>

  <!-- 制动盘 / 压板标注 -->
  <text x="314" y="48" text-anchor="middle" font-size="12" fill="#2a5a86">制动盘</text>

  <!-- 转轴状态：自由旋转 -->
  <path d="M645,182 A50,42 0 0 1 730,182" stroke="#1565c0" stroke-width="2.5" fill="none" marker-end="url(#bS)"/>
  <text x="688" y="152" text-anchor="middle" font-size="12" fill="#444">转轴（可自由旋转）</text>
  <text x="688" y="228" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e8449">✓ 转速稳定不衰减</text>

  <!-- 底部组件名称 -->
  <text x="90" y="352" text-anchor="middle" font-size="12" fill="#3c4a63">磁轭（E形静铁心）</text>
  <line x1="150" y1="242" x2="150" y2="336" stroke="#8a5200" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="150" y="368" text-anchor="middle" font-size="12" fill="#8a5200">线圈（通电）</text>
  <line x1="257" y1="282" x2="257" y2="336" stroke="#8a2020" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="257" y="352" text-anchor="middle" font-size="12" fill="#8a2020">摩擦片（分离）</text>
  <line x1="342" y1="322" x2="372" y2="338" stroke="#555" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="377" y="352" text-anchor="middle" font-size="12" fill="#555">固定压板</text>

  <!-- 右侧动作链说明 -->
  <rect x="420" y="80" width="320" height="180" rx="10" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/>
  <text x="580" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a5276">松闸动作链（通电 DC24V）</text>
  <g font-size="12.5" fill="#2d3436">
    <text x="436" y="136">① 线圈通电产生电磁吸力</text>
    <text x="436" y="162">② 衔铁被吸向铁心极面（压缩弹簧）</text>
    <text x="436" y="188">③ 摩擦片离开制动盘（出现释放间隙）</text>
    <text x="436" y="214">④ 制动盘与转轴恢复自由</text>
    <text x="436" y="240">→ 可自由旋转、转速稳定不衰减</text>
  </g>

  <!-- 接线提示 -->
  <rect x="420" y="280" width="320" height="80" rx="10" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/>
  <text x="580" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#7d6608">仿真接线（流程②）</text>
  <text x="580" y="332" text-anchor="middle" font-size="12" fill="#555">直流电源 + → 线圈 A1，直流电源 − → 线圈 A2，</text>
  <text x="580" y="352" text-anchor="middle" font-size="12" fill="#555">接通 DC24V 观察松闸动作。</text>
</svg>
