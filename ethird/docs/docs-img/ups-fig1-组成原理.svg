<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="980" height="600" fill="#fbfcfe"/>
  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f3b57">图1  UPS 组成与主回路原理</text>

  <!-- 主回路连线（先画线，后画块，块覆盖线） -->
  <g stroke="#3b6ea5" stroke-width="3" fill="none">
    <line x1="170" y1="200" x2="200" y2="200"/>
    <line x1="280" y1="200" x2="310" y2="200"/>
    <line x1="430" y1="200" x2="490" y2="200"/>
    <line x1="610" y1="200" x2="640" y2="200"/>
    <line x1="730" y1="200" x2="775" y2="200"/>
    <line x1="855" y1="200" x2="895" y2="200"/>
    <!-- DC 母线 → 电池开关 -->
    <line x1="460" y1="200" x2="460" y2="300"/>
    <!-- 旁路支路 -->
    <line x1="190" y1="200" x2="190" y2="95"/>
    <line x1="190" y1="95" x2="330" y2="95"/>
    <line x1="450" y1="95" x2="685" y2="95"/>
    <line x1="685" y1="95" x2="685" y2="172"/>
    <!-- 输出分支 -->
    <line x1="895" y1="200" x2="895" y2="180"/>
    <line x1="895" y1="200" x2="895" y2="270"/>
  </g>

  <!-- 节点 -->
  <g fill="#3b6ea5">
    <circle cx="190" cy="200" r="6"/>
    <circle cx="460" cy="200" r="6"/>
    <circle cx="895" cy="200" r="6"/>
  </g>

  <!-- 市电输入 -->
  <rect x="30" y="160" width="140" height="80" rx="8" fill="#eef4fb" stroke="#3b6ea5" stroke-width="2"/>
  <text x="100" y="194" text-anchor="middle" font-size="15" fill="#1f3b57">市电输入</text>
  <text x="100" y="216" text-anchor="middle" font-size="12" fill="#5b6b7c">AC 220V / 50Hz</text>
  <text x="34" y="152" font-size="11" fill="#888">← 输入 L(in_p)</text>
  <text x="30" y="258" font-size="11" fill="#888">← 输入 N(in_n)</text>

  <!-- 输入开关 -->
  <rect x="200" y="175" width="80" height="50" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="240" y="205" text-anchor="middle" font-size="13" fill="#c0392b">输入开关</text>
  <text x="240" y="166" text-anchor="middle" font-size="11" fill="#888">SW-in</text>

  <!-- 整流器 -->
  <rect x="310" y="160" width="120" height="80" rx="8" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="370" y="194" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e6b3a">整流器</text>
  <text x="370" y="218" text-anchor="middle" font-size="12" fill="#2e8b57">AC → DC</text>

  <!-- 逆变器 -->
  <rect x="490" y="160" width="120" height="80" rx="8" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="550" y="194" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e6b3a">逆变器</text>
  <text x="550" y="218" text-anchor="middle" font-size="12" fill="#2e8b57">DC → AC</text>

  <!-- 静态开关 -->
  <rect x="640" y="168" width="90" height="64" rx="8" fill="#fff" stroke="#8e44ad" stroke-width="2"/>
  <text x="685" y="196" text-anchor="middle" font-size="13" fill="#6c3483">静态开关</text>
  <text x="685" y="216" text-anchor="middle" font-size="11" fill="#8e44ad">SPDT</text>

  <!-- 输出开关 -->
  <rect x="775" y="175" width="80" height="50" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="815" y="205" text-anchor="middle" font-size="13" fill="#c0392b">输出开关</text>
  <text x="815" y="166" text-anchor="middle" font-size="11" fill="#888">SW-out</text>

  <!-- 旁路开关 -->
  <rect x="330" y="73" width="120" height="44" rx="6" fill="#eef4fb" stroke="#3b6ea5" stroke-width="2"/>
  <text x="390" y="100" text-anchor="middle" font-size="13" fill="#1f3b57">旁路开关</text>

  <!-- 电池开关 -->
  <rect x="390" y="300" width="140" height="44" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="460" y="327" text-anchor="middle" font-size="13" fill="#c0392b">储能电池开关</text>
  <line x1="460" y1="344" x2="460" y2="368" stroke="#3b6ea5" stroke-width="3"/>
  <!-- 储能电池 -->
  <rect x="390" y="368" width="140" height="82" rx="8" fill="#fff6e5" stroke="#d98e00" stroke-width="2"/>
  <text x="460" y="402" text-anchor="middle" font-size="15" font-weight="bold" fill="#a8670a">蓄电池组</text>
  <text x="460" y="424" text-anchor="middle" font-size="12" fill="#a8670a">DC 216V</text>
  <text x="460" y="442" text-anchor="middle" font-size="11" fill="#b8860b">DC ⇄ 储能</text>

  <!-- 负载 -->
  <rect x="850" y="140" width="110" height="56" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="905" y="164" text-anchor="middle" font-size="13" fill="#a93226">负载 1</text>
  <text x="905" y="184" text-anchor="middle" font-size="11" fill="#a93226">out1_p/n</text>
  <rect x="850" y="244" width="110" height="56" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="905" y="268" text-anchor="middle" font-size="13" fill="#a93226">负载 2</text>
  <text x="905" y="288" text-anchor="middle" font-size="11" fill="#a93226">out2_p/n</text>

  <!-- DC 母线标注 -->
  <text x="466" y="150" font-size="12" fill="#3b6ea5">直流母线 DC-BUS</text>

  <!-- 控制器 -->
  <rect x="250" y="500" width="480" height="72" rx="8" fill="#f2f4f8" stroke="#7f8c8d" stroke-width="2"/>
  <text x="490" y="528" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a5560">控制器 / 显示屏（LCD + LINE / BATTERY / BYPASS / FAULT 指示灯）</text>
  <text x="490" y="552" text-anchor="middle" font-size="12" fill="#7f8c8d">检测输入电压、电池 SOC、负载率，自动切换工作模式并驱动静态开关</text>
  <g stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
    <line x1="370" y1="500" x2="370" y2="240"/>
    <line x1="550" y1="500" x2="550" y2="240"/>
    <line x1="685" y1="500" x2="685" y2="232"/>
    <line x1="460" y1="500" x2="460" y2="450"/>
    <line x1="240" y1="500" x2="240" y2="225"/>
  </g>

  <!-- 图例 -->
  <text x="30" y="586" font-size="12" fill="#5b6b7c">绿色：整流 / 逆变功率变换环节　　橙色：储能电池　　蓝色：主供电与旁路支路　　紫色：静态开关</text>
</svg>
