<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" font-family="'Microsoft YaHei',SimHei,sans-serif">
  <defs>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2b8a3e"/>
    </marker>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c92a2a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="420" fill="#fbfbfb" stroke="#ccc"/>
  <text x="490" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">可抽拉式主开关三个工作位置</text>

  <!-- 连接位 -->
  <g>
    <rect x="30" y="100" width="280" height="190" rx="12" fill="#e8f7ec" stroke="#2b8a3e" stroke-width="2.5"/>
    <text x="170" y="135" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b8a3e">① 连接位 Connected</text>
    <text x="170" y="168" text-anchor="middle" font-size="13" fill="#333">• 主回路触头与汇流排/发电机母排可靠接通</text>
    <text x="170" y="196" text-anchor="middle" font-size="13" fill="#333">• 控制回路通电</text>
    <text x="170" y="224" text-anchor="middle" font-size="13" fill="#333">• 主开关正常投入运行</text>
    <text x="170" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b8a3e">工作位（正常）</text>
  </g>

  <!-- 测试位 -->
  <g>
    <rect x="355" y="100" width="280" height="190" rx="12" fill="#fff8e1" stroke="#b8860b" stroke-width="2.5"/>
    <text x="495" y="135" text-anchor="middle" font-size="17" font-weight="bold" fill="#b8860b">② 测试位 Test</text>
    <text x="495" y="168" text-anchor="middle" font-size="13" fill="#333">• 主回路触头与母排脱离（不带电）</text>
    <text x="495" y="196" text-anchor="middle" font-size="13" fill="#333">• 控制回路保持通电</text>
    <text x="495" y="224" text-anchor="middle" font-size="13" fill="#333">• 可进行分合闸试验/机构与保护校验</text>
    <text x="495" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#b8860b">试验</text>
  </g>

  <!-- 脱开位 -->
  <g>
    <rect x="680" y="100" width="280" height="190" rx="12" fill="#fdecec" stroke="#c92a2a" stroke-width="2.5"/>
    <text x="820" y="135" text-anchor="middle" font-size="17" font-weight="bold" fill="#c92a2a">③ 脱开位 Disconnected</text>
    <text x="820" y="168" text-anchor="middle" font-size="13" fill="#333">• 主回路与控制回路全部断开</text>
    <text x="820" y="196" text-anchor="middle" font-size="13" fill="#333">• 主开关完全不带电</text>
    <text x="820" y="224" text-anchor="middle" font-size="13" fill="#333">• 可抽出检修、更换触头</text>
    <text x="820" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#c92a2a">检修位</text>
  </g>

  <!-- 箭头 -->
  <g font-size="13">
    <!-- 连接→测试 -->
    <line x1="318" y1="180" x2="348" y2="180" stroke="#2b8a3e" stroke-width="3" marker-end="url(#arrowG)"/>
    <text x="333" y="170" text-anchor="middle" fill="#2b8a3e">摇入</text>
    <!-- 测试→脱开 -->
    <line x1="643" y1="180" x2="673" y2="180" stroke="#2b8a3e" stroke-width="3" marker-end="url(#arrowG)"/>
    <text x="658" y="170" text-anchor="middle" fill="#2b8a3e">摇出</text>
    <!-- 脱开→测试 返回 -->
    <path d="M810,300 L810,330 L495,330 L495,300" fill="none" stroke="#c92a2a" stroke-width="3" marker-end="url(#arrowR)"/>
    <path d="M490,300 L490,330 L170,330 L170,300" fill="none" stroke="#c92a2a" stroke-width="3" marker-end="url(#arrowR)"/>
    <text x="652" y="352" text-anchor="middle" fill="#c92a2a">逆时针摇回测试位再摇回连接位</text>
  </g>

  <text x="490" y="392" text-anchor="middle" font-size="12" fill="#666">注：位置切换用操作手柄插入工作位圆盘，顺时针摇入、逆时针摇出，逐档切换（每档摇 3 次）</text>
</svg>
