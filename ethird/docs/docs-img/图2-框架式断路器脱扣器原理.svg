<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2d3436"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2d3436">船用框架式空气断路器（主开关）操作与脱扣机构原理</text>

  <!-- ═══ 触头系统（合闸状态） ═══ -->
  <rect x="356" y="108" width="56" height="18" rx="3" fill="#aab7b8" stroke="#61686a" stroke-width="1.5"/>
  <text x="384" y="98" text-anchor="middle" font-size="12.5" fill="#555">静触头</text>
  <line x1="480" y1="250" x2="402" y2="136" stroke="#2d3436" stroke-width="4"/>
  <rect x="388" y="126" width="28" height="16" rx="3" fill="#7f8c8d" stroke="#555" stroke-width="1.5"/>
  <text x="330" y="152" text-anchor="end" font-size="12.5" fill="#555">动触头</text>

  <!-- 主轴 -->
  <circle cx="480" cy="250" r="11" fill="#2d3436"/>
  <text x="452" y="278" text-anchor="end" font-size="12.5" fill="#2d3436">主轴</text>

  <!-- 合闸锁扣 -->
  <rect x="505" y="236" width="58" height="34" rx="5" fill="#eaf2f8" stroke="#2980b9" stroke-width="2"/>
  <text x="534" y="258" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2471a3">合闸锁扣</text>
  <line x1="505" y1="248" x2="489" y2="244" stroke="#2980b9" stroke-width="3"/>

  <!-- 合闸弹簧（储能） -->
  <path d="M480,262 L470,274 L490,286 L470,298 L490,310 L470,322 L490,334 L480,344" stroke="#2980b9" stroke-width="2.5" fill="none"/>
  <line x1="466" y1="344" x2="494" y2="344" stroke="#2980b9" stroke-width="2.5"/>
  <text x="480" y="366" text-anchor="middle" font-size="12.5" fill="#2980b9">合闸弹簧（储能）</text>

  <!-- 分闸弹簧 -->
  <path d="M492,244 L508,247 L521,226 L537,229 L550,208 L566,211 L572,192" stroke="#16a085" stroke-width="2.5" fill="none"/>
  <circle cx="572" cy="192" r="4" fill="#16a085"/>
  <text x="584" y="190" font-size="12.5" fill="#16a085">分闸弹簧</text>

  <!-- ═══ 合闸回路 ═══ -->
  <line x1="480" y1="430" x2="480" y2="352" stroke="#2d3436" stroke-width="3" marker-end="url(#arr)"/>
  <text x="492" y="402" font-size="12" fill="#2d3436">顶杆</text>
  <rect x="410" y="430" width="140" height="58" rx="8" fill="#d6eaf8" stroke="#2471a3" stroke-width="2"/>
  <text x="480" y="454" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a5276">合闸线圈</text>
  <text x="480" y="474" text-anchor="middle" font-size="11" fill="#555">遥控合闸（24V 通电吸合）</text>
  <text x="480" y="414" text-anchor="middle" font-size="11.5" fill="#1a5276">通电吸合 → 顶杆解锁 → 弹簧释放</text>

  <!-- ═══ 三个脱扣器 ═══ -->
  <text x="795" y="182" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#922b21">分闸脱扣（"或"逻辑）</text>
  <rect x="690" y="200" width="210" height="54" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/>
  <text x="795" y="222" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#922b21">分励脱扣器</text>
  <text x="795" y="242" text-anchor="middle" font-size="10.5" fill="#555">通电即脱扣（遥控分闸/保护输出）</text>
  <rect x="690" y="266" width="210" height="54" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="795" y="288" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b9770e">失压(欠压)脱扣器</text>
  <text x="795" y="308" text-anchor="middle" font-size="10.5" fill="#555">电压低于 35%Ue 脱扣（失电自保）</text>
  <rect x="690" y="332" width="210" height="54" rx="6" fill="#e8f8f5" stroke="#1e8449" stroke-width="2"/>
  <text x="795" y="354" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#145a32">过流脱扣器</text>
  <text x="795" y="374" text-anchor="middle" font-size="10.5" fill="#555">过载/短路时动作</text>

  <!-- 三路汇合 -->
  <line x1="690" y1="227" x2="660" y2="227" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="690" y1="293" x2="660" y2="293" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="690" y1="359" x2="660" y2="359" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="660" y1="227" x2="660" y2="359" stroke="#c0392b" stroke-width="2.5"/>

  <!-- 脱扣杆 -->
  <path d="M660,359 L610,359 L610,254 L566,254" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#arrR)"/>
  <text x="600" y="342" text-anchor="end" font-size="12" fill="#c0392b">脱扣杆</text>

  <!-- ═══ 底部说明 ═══ -->
  <rect x="60" y="540" width="840" height="72" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="568" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e8449">合闸：合闸线圈通电 → 顶杆解锁 → 储能弹簧释放 → 主轴转动 → 触头闭合并由合闸锁扣保持</text>
  <text x="480" y="594" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#c0392b">分闸：任一脱扣器动作（"或"逻辑）→ 脱扣杆打开锁扣 → 分闸弹簧使触头断开</text>
</svg>
