<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2d3436"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2d3436">船用框架式空气断路器（主开关）操作与脱扣机构原理</text>

  <!-- ── 主触头 ── -->
  <rect x="80" y="70" width="120" height="60" rx="6" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="140" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#d35400">主触头</text>
  <text x="140" y="124" text-anchor="middle" font-size="12" fill="#555">静触头 / 动触头</text>

  <!-- 主轴 -->
  <line x1="120" y1="130" x2="120" y2="258" stroke="#2d3436" stroke-width="4"/>
  <line x1="200" y1="130" x2="200" y2="258" stroke="#2d3436" stroke-width="4"/>
  <circle cx="120" cy="258" r="6" fill="#2d3436"/>
  <circle cx="200" cy="258" r="6" fill="#2d3436"/>
  <text x="160" y="276" text-anchor="middle" font-size="13" fill="#2d3436">主触头主轴</text>

  <!-- 储能弹簧（合闸弹簧） -->
  <path d="M382,120 L366,138 L398,156 L366,174 L398,192 L366,210 L398,228 L382,246" stroke="#2980b9" stroke-width="2.5" fill="none"/>
  <line x1="382" y1="120" x2="382" y2="96" stroke="#2980b9" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="432" y="140" font-size="13" fill="#2980b9">储能弹簧（合闸弹簧）</text>
  <text x="432" y="158" font-size="12" fill="#555">弹簧储能后经主轴释放 → 触头合闸</text>

  <!-- 合闸锁扣 -->
  <rect x="520" y="150" width="90" height="54" rx="6" fill="#eaf2f8" stroke="#2980b9" stroke-width="2"/>
  <text x="565" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#2471a3">合闸锁扣</text>
  <text x="565" y="196" text-anchor="middle" font-size="11" fill="#555">保持触头闭合</text>
  <!-- 锁扣杠 -->
  <line x1="200" y1="150" x2="520" y2="160" stroke="#2d3436" stroke-width="3"/>
  <rect x="470" y="150" width="34" height="10" rx="2" fill="#aab7b8"/>
  <text x="330" y="195" text-anchor="middle" font-size="12" fill="#555">合闸连杆（锁存）</text>

  <!-- 合闸线圈 -->
  <rect x="80" y="330" width="150" height="72" rx="8" fill="#d6eaf8" stroke="#2471a3" stroke-width="2"/>
  <text x="155" y="360" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a5276">合闸线圈</text>
  <text x="155" y="382" text-anchor="middle" font-size="12" fill="#555">遥控合闸（24V 通电吸合）</text>
  <line x1="56" y1="366" x2="20" y2="366" stroke="#2471a3" stroke-width="2.5"/>
  <text x="20" y="386" font-size="12" fill="#2471a3">合闸控制回路</text>
  <line x1="120" y1="330" x2="120" y2="300" stroke="#2d3436" stroke-width="3"/>
  <path d="M120,300 L136,288 L136,268 L120,256" stroke="#2d3436" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <text x="108" y="300" text-anchor="end" font-size="12" fill="#2d3436">顶杆推动</text>
  <line x1="200" y1="330" x2="200" y2="300" stroke="#2d3436" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- ── 三个脱扣器 ── -->
  <g transform="translate(640,0)">
    <!-- 分励脱扣器 -->
    <rect x="0" y="150" width="110" height="58" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/>
    <text x="55" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#922b21">分励脱扣器</text>
    <text x="55" y="194" text-anchor="middle" font-size="11" fill="#555">通电即脱扣</text>
    <!-- 失压脱扣器 -->
    <rect x="0" y="240" width="110" height="68" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
    <text x="55" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#b9770e">失压(欠压)脱扣器</text>
    <text x="55" y="284" text-anchor="middle" font-size="11" fill="#555">电压低于35%Ue脱扣</text>
    <text x="55" y="300" text-anchor="middle" font-size="11" fill="#555">(电网失电自保)</text>
    <!-- 过流脱扣器 -->
    <rect x="0" y="340" width="110" height="58" rx="6" fill="#e8f8f5" stroke="#1e8449" stroke-width="2"/>
    <text x="55" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#145a32">过流脱扣器</text>
    <text x="55" y="384" text-anchor="middle" font-size="11" fill="#555">过载/短路时动作</text>
  </g>

  <!-- 脱扣杆：三路并联作用于锁扣 -->
  <line x1="640" y1="179" x2="690" y2="179" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="690" y1="179" x2="690" y2="274" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="610" y1="274" x2="748" y2="274" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="690" y1="274" x2="690" y2="369" stroke="#c0392b" stroke-width="2.5"/>
  <path d="M600,274 L570,274 L570,177 L556,177" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#arrR)"/>
  <text x="556" y="168" text-anchor="end" font-size="12" fill="#c0392b">脱扣杆</text>

  <!-- 分闸弹簧 -->
  <path d="M86,420 L100,438 L72,456 L100,474 L72,492 L100,510"/>

  <!-- 底部说明 -->
  <rect x="60" y="460" width="780" height="44" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
  <text x="450" y="478" text-anchor="middle" font-size="13" fill="#1e8449" font-weight="bold">合闸：储能弹簧释放 → 触头闭合并由合闸锁扣保持　|　分闸：任一脱扣器动作 → 脱扣杆开锁 → 分闸弹簧使触头断开</text>
  <text x="450" y="498" text-anchor="middle" font-size="12" fill="#555">分励脱扣器（遥控分闸/保护联锁）、失压脱扣器（电网失电自保）、过流脱扣器（过载短路保护）三者“或”逻辑触发脱扣</text>
</svg>