<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="680" height="460" fill="#ffffff"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#20303f">交流接触器电磁机构（线圈通电吸合原理）</text>

  <!-- 静铁芯（E 形：磁轭 + 三条铁心腿） -->
  <g stroke="#2b3142" stroke-width="1.2">
    <rect x="70" y="70" width="26" height="300" fill="#5a6070"/>
    <rect x="96" y="70" width="170" height="26" fill="#6a7080"/>
    <rect x="96" y="207" width="170" height="26" fill="#6a7080"/>
    <rect x="96" y="344" width="170" height="26" fill="#6a7080"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1">
    <line x1="96" y1="79" x2="266" y2="79"/><line x1="96" y1="87" x2="266" y2="87"/>
    <line x1="96" y1="216" x2="266" y2="216"/><line x1="96" y1="224" x2="266" y2="224"/>
    <line x1="96" y1="353" x2="266" y2="353"/><line x1="96" y1="361" x2="266" y2="361"/>
  </g>

  <!-- 线圈（绕在中柱上） -->
  <rect x="110" y="178" width="140" height="84" rx="5" fill="#c8962011" stroke="#8a6a20" stroke-width="1.4"/>
  <g stroke="#c89620" stroke-width="2.4" fill="none">
    <path d="M122 186 v68"/><path d="M136 186 v68"/><path d="M150 186 v68"/><path d="M164 186 v68"/>
    <path d="M178 186 v68"/><path d="M192 186 v68"/><path d="M206 186 v68"/><path d="M220 186 v68"/><path d="M234 186 v68"/>
  </g>

  <!-- 线圈引出 A1 / A2 -->
  <circle cx="50" cy="140" r="6" fill="#e04040" stroke="#7a2020"/>
  <circle cx="50" cy="330" r="6" fill="#4080e0" stroke="#20407a"/>
  <path d="M50 140 H110 V186" fill="none" stroke="#e04040" stroke-width="3" stroke-linecap="round"/>
  <path d="M50 330 H100 V254 H110" fill="none" stroke="#4080e0" stroke-width="3" stroke-linecap="round"/>
  <text x="24" y="134" font-size="13" fill="#c0392b" font-weight="bold">A1</text>
  <text x="24" y="352" font-size="13" fill="#2470c0" font-weight="bold">A2</text>

  <!-- 动衔铁 -->
  <rect x="290" y="74" width="28" height="292" fill="#606878" stroke="#2b3142" stroke-width="1.2"/>
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1">
    <line x1="296" y1="80" x2="296" y2="360"/><line x1="306" y1="80" x2="306" y2="360"/><line x1="314" y1="80" x2="314" y2="360"/>
  </g>

  <!-- 气隙 -->
  <line x1="266" y1="100" x2="290" y2="100" stroke="#c0392b" stroke-width="1.6" marker-start="url(#arrS)" marker-end="url(#arrE)"/>
  <text x="278" y="120" font-size="12" fill="#c0392b" text-anchor="middle">气隙</text>

  <!-- 反作用弹簧（上、下） -->
  <g stroke="#6090a8" stroke-width="3" fill="none" stroke-linejoin="round">
    <polyline points="318,92 330,86 342,98 354,86 366,98 378,86 390,98 402,86 414,92"/>
    <polyline points="318,348 330,342 342,354 354,342 366,354 378,342 390,354 402,342 414,348"/>
  </g>
  <rect x="414" y="74" width="18" height="36" fill="#a8b0bc" stroke="#5a6070" stroke-width="1.2"/>
  <rect x="414" y="330" width="18" height="36" fill="#a8b0bc" stroke="#5a6070" stroke-width="1.2"/>

  <!-- 电磁吸力（向左）/ 弹簧反力（向右） -->
  <line x1="352" y1="185" x2="300" y2="185" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrR)"/>
  <text x="358" y="181" font-size="13" fill="#e74c3c">F 电磁（吸合）</text>
  <line x1="352" y1="270" x2="412" y2="270" stroke="#e07b39" stroke-width="3" marker-end="url(#arrO)"/>
  <text x="358" y="292" font-size="13" fill="#e07b39">F 弹簧（复位）</text>

  <!-- 可动轴（带走右侧触头） -->
  <line x1="318" y1="220" x2="470" y2="220" stroke="#2b6cb0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrB2)"/>
  <text x="330" y="240" font-size="12" fill="#2b6cb0">可动轴 → 触头系统</text>

  <!-- 标注 -->
  <g font-size="13" fill="#20303f">
    <line x1="150" y1="178" x2="150" y2="128" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="150" y="118" text-anchor="middle">① 电磁线圈</text>

    <line x1="58" y1="400" x2="58" y2="66" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="42" y="418">② 静铁芯（E 形铁心）</text>

    <line x1="304" y1="74" x2="304" y2="56" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="304" y="48" text-anchor="middle">③ 动衔铁</text>
  </g>
  <g>
    <line x1="470" y1="70" x2="366" y2="88" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="476" y="74" font-size="13" fill="#20303f">④ 反作用弹簧</text>
  </g>

  <defs>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e74c3c"/></marker>
    <marker id="arrB2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2b6cb0"/></marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e07b39"/></marker>
    <marker id="arrS" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#c0392b"/></marker>
    <marker id="arrE" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker>
  </defs>
</svg>
