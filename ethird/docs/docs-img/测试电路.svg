<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Microsoft YaHei,SimHei,sans-serif">
  <rect width="900" height="600" fill="#f7f9fc"/>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a3a5c">塑壳式断路器测试电路</text>

  <!-- ── 三相电源 ── -->
  <rect x="30" y="200" width="150" height="120" rx="8" fill="#eef2f7" stroke="#8a929c" stroke-width="2"/>
  <text x="105" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#33475b">三相电源</text>
  <text x="105" y="252" text-anchor="middle" font-size="13" fill="#1f6fb2">240V / 50Hz</text>
  <text x="105" y="274" text-anchor="middle" font-size="12" fill="#7a8290">正序 U-V-W</text>
  <circle cx="180" cy="220" r="6" fill="#e03030"/><text x="188" y="216" font-size="12" fill="#e03030">U</text>
  <circle cx="180" cy="255" r="6" fill="#20a030"/><text x="188" y="251" font-size="12" fill="#20a030">V</text>
  <circle cx="180" cy="290" r="6" fill="#2050e0"/><text x="188" y="286" font-size="12" fill="#2050e0">W</text>

  <!-- ── 塑壳式断路器 ── -->
  <rect x="320" y="90" width="240" height="260" rx="8" fill="#ffffff" stroke="#8a929c" stroke-width="2"/>
  <text x="440" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a3a5c">塑壳式断路器 QF</text>
  <text x="440" y="140" text-anchor="middle" font-size="12" fill="#7a8290">In = 100A　三极 + 分励线圈</text>
  <text x="440" y="240" text-anchor="middle" font-size="12" fill="#5a6a7a">触头 / 传动轴</text>
  <text x="440" y="260" text-anchor="middle" font-size="12" fill="#5a6a7a">电磁·热·分励脱扣器</text>
  <text x="440" y="280" text-anchor="middle" font-size="12" fill="#5a6a7a">（见内部结构图）</text>
  <circle cx="360" cy="90" r="6" fill="#e03030"/><text x="370" y="80" font-size="12" fill="#e03030">L1</text>
  <circle cx="420" cy="90" r="6" fill="#20a030"/><text x="430" y="80" font-size="12" fill="#20a030">L2</text>
  <circle cx="480" cy="90" r="6" fill="#2050e0"/><text x="490" y="80" font-size="12" fill="#2050e0">L3</text>
  <circle cx="360" cy="350" r="6" fill="#e03030"/><text x="370" y="370" font-size="12" fill="#e03030">T1</text>
  <circle cx="420" cy="350" r="6" fill="#20a030"/><text x="430" y="370" font-size="12" fill="#20a030">T2</text>
  <circle cx="480" cy="350" r="6" fill="#2050e0"/><text x="490" y="370" font-size="12" fill="#2050e0">T3</text>
  <circle cx="560" cy="200" r="6" fill="#6a5a28"/><text x="568" y="196" font-size="12" fill="#6a3828">fla</text>
  <circle cx="560" cy="260" r="6" fill="#6a5a28"/><text x="568" y="256" font-size="12" fill="#6a3828">flb</text>

  <!-- ── 三相可调负载（角形 Δ） ── -->
  <rect x="690" y="150" width="190" height="180" rx="8" fill="#ffffff" stroke="#8a929c" stroke-width="2"/>
  <text x="785" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">三相可调负载</text>
  <text x="785" y="200" text-anchor="middle" font-size="12" fill="#7a8290">Δ 接（无中性点）</text>
  <text x="785" y="224" text-anchor="middle" font-size="12" fill="#1f6fb2">cosφ = 1</text>
  <text x="785" y="248" text-anchor="middle" font-size="12" fill="#7a8290">初始 69kW → 100A</text>
  <text x="785" y="274" text-anchor="middle" font-size="12" fill="#c0392b">过载 90kW</text>
  <text x="785" y="294" text-anchor="middle" font-size="12" fill="#c0392b">短路 350kW</text>
  <text x="785" y="318" text-anchor="middle" font-size="11" fill="#7a8290">含【加载】【卸载】</text>
  <circle cx="690" cy="190" r="6" fill="#e03030"/><text x="700" y="186" font-size="12" fill="#e03030">L1</text>
  <circle cx="690" cy="225" r="6" fill="#20a030"/><text x="700" y="221" font-size="12" fill="#20a030">L2</text>
  <circle cx="690" cy="260" r="6" fill="#2050e0"/><text x="700" y="256" font-size="12" fill="#2050e0">L3</text>

  <!-- ── 24V 直流电源 + 常开按钮 ── -->
  <rect x="330" y="470" width="140" height="90" rx="8" fill="#eef2f7" stroke="#8a929c" stroke-width="2"/>
  <text x="400" y="500" text-anchor="middle" font-size="14" font-weight="bold" fill="#33475b">DC 24V</text>
  <text x="400" y="522" text-anchor="middle" font-size="12" fill="#7a8290">分励脱扣电源</text>
  <circle cx="470" cy="490" r="6" fill="#e03030"/><text x="478" y="486" font-size="12" fill="#e03030">+</text>
  <circle cx="470" cy="540" r="6" fill="#2050e0"/><text x="478" y="536" font-size="12" fill="#2050e0">−</text>
  <rect x="560" y="480" width="90" height="70" rx="8" fill="#ffffff" stroke="#8a929c" stroke-width="2"/>
  <text x="605" y="512" text-anchor="middle" font-size="14" font-weight="bold" fill="#33475b">SB</text>
  <text x="605" y="532" text-anchor="middle" font-size="11" fill="#7a8290">常开按钮</text>
  <circle cx="560" cy="500" r="6" fill="#5a6068"/><text x="540" y="496" font-size="11" fill="#5a6068">1</text>
  <circle cx="650" cy="500" r="6" fill="#5a6068"/><text x="658" y="496" font-size="11" fill="#5a6068">2</text>

  <!-- ── 接线（正交走线）── -->
  <g stroke-width="2.5" fill="none" stroke-linejoin="round">
    <!-- 电源 → 断路器（从断路器上方绕行） -->
    <polyline points="180,220 245,220 245,66 360,66 360,90" stroke="#e03030"/>
    <polyline points="180,255 265,255 265,52 420,52 420,90" stroke="#20a030"/>
    <polyline points="180,290 285,290 285,38 480,38 480,90" stroke="#2050e0"/>
    <!-- 断路器 → 负载（从断路器下方绕行） -->
    <polyline points="360,350 360,410 645,410 645,190 690,190" stroke="#e03030"/>
    <polyline points="420,350 420,424 660,424 660,225 690,225" stroke="#20a030"/>
    <polyline points="480,350 480,438 675,438 675,260 690,260" stroke="#2050e0"/>
    <!-- 24V → SB → 分励线圈 -->
    <polyline points="470,490 560,500" stroke="#c0392b"/>
    <polyline points="650,500 680,500 680,200 560,200" stroke="#c0392b"/>
    <polyline points="560,260 684,260 684,455 470,455 470,540" stroke="#2b6fd0"/>
  </g>

  <text x="450" y="584" text-anchor="middle" font-size="12" fill="#7a8290">主回路 6 根（电源→断路器→负载）；控制回路 3 根（24V→SB→分励线圈 fla/flb），共 9 根</text>
</svg>
