<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="aR2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e74c3c"/>
    </marker>
    <marker id="aK2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="aD" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8e44ad"/>
    </marker>
  </defs>

  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2d3436">项目二：通电感应法检测同名端</text>

  <!-- ═══ 直流电源 ═══ -->
  <rect x="60" y="190" width="160" height="110" rx="10" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="140" y="226" text-anchor="middle" font-size="17" font-weight="bold" fill="#d35400">直流电源</text>
  <text x="140" y="252" text-anchor="middle" font-size="14" fill="#2d3436">DC 12V</text>
  <text x="140" y="280" text-anchor="middle" font-size="11.5" fill="#555">U1 接正、U2 接负</text>

  <!-- 正极回路（经开关 → U1） -->
  <line x1="100" y1="190" x2="100" y2="120" stroke="#e74c3c" stroke-width="3"/>
  <text x="88" y="216" text-anchor="end" font-size="15" font-weight="bold" fill="#e74c3c">+</text>
  <line x1="100" y1="120" x2="178" y2="120" stroke="#e74c3c" stroke-width="3"/>
  <!-- 电源开关 -->
  <circle cx="186" cy="120" r="4" fill="#555"/>
  <line x1="190" y1="116" x2="262" y2="94" stroke="#555" stroke-width="2.5"/>
  <circle cx="268" cy="120" r="4" fill="#555"/>
  <text x="226" y="82" text-anchor="middle" font-size="12" fill="#555">电源开关（通/断操作）</text>
  <line x1="276" y1="120" x2="400" y2="120" stroke="#e74c3c" stroke-width="3"/>
  <line x1="400" y1="120" x2="400" y2="126" stroke="#e74c3c" stroke-width="3" marker-end="url(#aR2)"/>
  <text x="250" y="108" text-anchor="middle" font-size="10.5" fill="#e74c3c">电流方向 →</text>

  <!-- 负极回路（→ U2） -->
  <line x1="180" y1="300" x2="180" y2="340" stroke="#333" stroke-width="3"/>
  <text x="168" y="330" text-anchor="end" font-size="15" font-weight="bold" fill="#333">−</text>
  <line x1="180" y1="340" x2="385" y2="340" stroke="#333" stroke-width="3" marker-end="url(#aK2)"/>

  <!-- ═══ U 相绕组（通电） ═══ -->
  <circle cx="400" cy="140" r="11" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="400" cy="340" r="11" fill="#333" stroke="#555" stroke-width="1.5"/>
  <text x="424" y="144" font-size="14" font-weight="bold" fill="#e74c3c">U1（+）</text>
  <text x="424" y="345" font-size="14" font-weight="bold" fill="#333">U2（−）</text>
  <path d="M400,151 L394,168 L406,182 L394,196 L406,210 L394,224 L406,238 L394,252 L406,266 L394,280 L406,294 L394,308 L400,329" stroke="#2d3436" stroke-width="2.5" fill="none"/>
  <text x="430" y="246" font-size="12.5" fill="#2d3436">U 相绕组</text>
  <text x="430" y="264" font-size="11" fill="#555">（励磁绕组）</text>

  <!-- ═══ 互感耦合示意 ═══ -->
  <path d="M452,214 Q500,182 548,214" stroke="#8e44ad" stroke-width="2" fill="none" marker-end="url(#aD)"/>
  <path d="M548,246 Q500,278 452,246" stroke="#8e44ad" stroke-width="2" fill="none" marker-end="url(#aD)"/>
  <text x="500" y="236" text-anchor="middle" font-size="12" fill="#8e44ad">互感 M</text>

  <!-- ═══ V 相绕组（感应） ═══ -->
  <circle cx="620" cy="140" r="11" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="620" cy="340" r="11" fill="#333" stroke="#555" stroke-width="1.5"/>
  <text x="648" y="144" font-size="14" font-weight="bold" fill="#e74c3c">V1</text>
  <text x="648" y="345" font-size="14" font-weight="bold" fill="#333">V2</text>
  <path d="M620,151 L614,168 L626,182 L614,196 L626,210 L614,224 L626,238 L614,252 L626,266 L614,280 L626,294 L614,308 L620,329" stroke="#2d3436" stroke-width="2.5" fill="none"/>
  <text x="650" y="246" font-size="12.5" fill="#2d3436">V 相绕组</text>
  <text x="650" y="264" font-size="11" fill="#555">（感应绕组）</text>

  <!-- ═══ MF47 指针万用表 ═══ -->
  <rect x="760" y="190" width="170" height="140" rx="10" fill="#fdf2e9" stroke="#c0392b" stroke-width="2"/>
  <text x="845" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">MF47 指针万用表</text>
  <text x="845" y="234" text-anchor="middle" font-size="11.5" fill="#2d3436">直流电压档 DCV10</text>
  <circle cx="845" cy="284" r="30" fill="#fff" stroke="#333" stroke-width="2"/>
  <g stroke="#999" stroke-width="1">
    <line x1="845" y1="284" x2="845" y2="260"/>
    <line x1="845" y1="284" x2="870" y2="274"/>
    <line x1="845" y1="284" x2="820" y2="274"/>
  </g>
  <line x1="845" y1="284" x2="821" y2="266" stroke="#e74c3c" stroke-width="2.5"/>
  <circle cx="845" cy="284" r="3.5" fill="#333"/>
  <text x="845" y="324" text-anchor="middle" font-size="10.5" fill="#c0392b">接通瞬间：反向偏转</text>
  <!-- 表笔 -->
  <path d="M800,186 L800,140 L634,140" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#aR2)"/>
  <text x="716" y="130" text-anchor="middle" font-size="12" fill="#e74c3c">红表笔(V)→V1</text>
  <path d="M760,300 L700,300 L700,340 L634,340" stroke="#333" stroke-width="3" fill="none" marker-end="url(#aK2)"/>
  <text x="666" y="364" text-anchor="middle" font-size="12" fill="#333">黑表笔(COM)→V2</text>

  <!-- ═══ 底部现象说明 ═══ -->
  <rect x="60" y="460" width="840" height="84" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="490" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e8449">接通瞬间：U 相电流增大 → V 相感应出反向电压 → 指针反向偏转 ⇒ U1 与 V1 为同名端</text>
  <text x="480" y="518" text-anchor="middle" font-size="12.5" fill="#555">断开瞬间：U 相电流减小 → V 相感应出正向电压 → 指针正向偏转</text>
</svg>
