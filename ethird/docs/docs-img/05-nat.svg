<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2a33">图 5　出口路由器的 NAT（easy-ip）与默认路由</text>

  <!-- 内网 -->
  <rect x="60" y="90" width="200" height="70" rx="8" fill="#eaf7ee" stroke="#34a853" stroke-width="2"/>
  <text x="160" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e6b34">内网主机 PC1</text>
  <text x="160" y="140" text-anchor="middle" font-size="12" fill="#3a7d4e">192.168.10.10（私网）</text>

  <!-- 出口路由器 -->
  <rect x="330" y="80" width="240" height="300" rx="14" fill="#f0ebfb" stroke="#7e57c2" stroke-width="3"/>
  <text x="450" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b3fa0">出口路由器 R1</text>
  <rect x="355" y="128" width="190" height="46" rx="6" fill="#ffffff" stroke="#7e57c2"/>
  <text x="450" y="148" text-anchor="middle" font-size="12" fill="#5b3fa0">GE0/0/0　inside</text>
  <text x="450" y="166" text-anchor="middle" font-size="11" fill="#6a55a8">10.10.10.2/30</text>
  <rect x="355" y="188" width="190" height="46" rx="6" fill="#ffffff" stroke="#7e57c2"/>
  <text x="450" y="208" text-anchor="middle" font-size="12" fill="#5b3fa0">GE0/0/1　outside</text>
  <text x="450" y="226" text-anchor="middle" font-size="11" fill="#6a55a8">100.64.0.1/30</text>
  <rect x="355" y="252" width="190" height="34" rx="6" fill="#dff3ec" stroke="#1fa97a"/>
  <text x="450" y="274" text-anchor="middle" font-size="12" fill="#0d7a56">NAT：私网复用 outside 地址</text>
  <text x="450" y="312" text-anchor="middle" font-size="12" fill="#5b3fa0">默认路由：0.0.0.0/0 → 100.64.0.2</text>
  <text x="450" y="336" text-anchor="middle" font-size="11" fill="#6a55a8">L3SW1 默认路由：0.0.0.0/0 → 10.10.10.2</text>
  <text x="450" y="360" text-anchor="middle" font-size="11" fill="#6a55a8">R1 回程静态路由：192.168.x.0 → 10.10.10.1</text>

  <!-- 互联网 -->
  <rect x="640" y="120" width="200" height="70" rx="8" fill="#f0ebfb" stroke="#7e57c2" stroke-width="2"/>
  <text x="740" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b3fa0">互联网 / 服务器</text>
  <text x="740" y="170" text-anchor="middle" font-size="12" fill="#6a55a8">203.0.113.10（公网）</text>

  <line x1="260" y1="125" x2="330" y2="150" stroke="#34a853" stroke-width="2"/>
  <line x1="570" y1="210" x2="640" y2="160" stroke="#7e57c2" stroke-width="2"/>

  <!-- NAT 表 -->
  <rect x="150" y="404" width="600" height="86" rx="10" fill="#f7f9fb" stroke="#4a5a68"/>
  <text x="450" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#33424f">NAT 会话表（display nat session）</text>
  <text x="450" y="452" text-anchor="middle" font-size="12" fill="#33424f">192.168.10.10:40010　→　100.64.0.1:1024　　目的 203.0.113.10</text>
  <text x="450" y="476" text-anchor="middle" font-size="11" fill="#5b6b7a">私网地址被转换为出口接口的公网地址，对外只看到 100.64.0.1，实现多个内网主机共享上网。</text>

  <text x="450" y="384" text-anchor="middle" font-size="12" fill="#5b6b7a">默认路由让内网流量“兜底”指向出口；NAT 负责地址转换。</text>
</svg>
