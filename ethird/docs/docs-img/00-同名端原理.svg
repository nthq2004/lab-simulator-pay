<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect width="880" height="420" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1c3d5a">同名端与感应电压极性</text>

  <!-- 左：同名端定义 -->
  <rect x="50" y="60" width="360" height="320" rx="8" fill="#f7fbff" stroke="#9cc3e6"/>
  <text x="230" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c5c9c">① 什么是同名端</text>

  <rect x="120" y="120" width="30" height="150" fill="#8898a8" stroke="#485060"/>
  <rect x="180" y="120" width="30" height="150" fill="#8898a8" stroke="#485060"/>
  <path d="M100 150 h20 M100 180 h20 M100 210 h20" stroke="#c07030" stroke-width="3.5"/>
  <path d="M210 158 h20 M210 188 h20 M210 218 h20" stroke="#3080b0" stroke-width="3.5"/>
  <circle cx="100" cy="150" r="5" fill="#e41c1c"/>
  <text x="96" y="140" text-anchor="end" font-size="12" fill="#c07030" font-weight="bold">P1（红）</text>
  <circle cx="230" cy="158" r="5" fill="#e41c1c"/>
  <text x="240" y="152" font-size="12" fill="#20a060" font-weight="bold">S1（红）</text>

  <text x="230" y="300" text-anchor="middle" font-size="12.5" fill="#333">当原边电流从 P1 流入时，</text>
  <text x="230" y="322" text-anchor="middle" font-size="12.5" fill="#333">副边感应电流从 S1 流出的端，</text>
  <text x="230" y="344" text-anchor="middle" font-size="12.5" fill="#c0392b" font-weight="bold">即与 P1 互为同名端。</text>

  <!-- 右：两种接法的电压 -->
  <rect x="470" y="60" width="360" height="320" rx="8" fill="#fffaf5" stroke="#e6c29c"/>
  <text x="650" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#95591c">② 短接不同端子时的电压</text>

  <text x="490" y="126" font-size="13" font-weight="bold" fill="#333">情形 A：短接同名端对（P2—S2）</text>
  <text x="490" y="150" font-size="13" fill="#333">U(P1—S1) = |U1 − U2|</text>
  <rect x="490" y="162" width="320" height="70" rx="5" fill="#e8f7ee" stroke="#63b581"/>
  <text x="502" y="184" font-size="13" fill="#1f6b3c">本实验：24 − 6 = 18 V</text>
  <text x="502" y="208" font-size="13" fill="#1f6b3c" font-weight="bold">⇒ P1 与 S1 是同名端</text>

  <text x="490" y="262" font-size="13" font-weight="bold" fill="#333">情形 B：短接异名端（P2—S1）</text>
  <text x="490" y="286" font-size="13" fill="#333">U(P1—S2) = U1 + U2</text>
  <rect x="490" y="298" width="320" height="60" rx="5" fill="#fdeaea" stroke="#d98c8c"/>
  <text x="502" y="320" font-size="13" fill="#932a2a">若测得 24 + 6 = 30 V</text>
  <text x="502" y="344" font-size="13" fill="#932a2a" font-weight="bold">⇒ 所测两端为异名端</text>

  <text x="440" y="404" text-anchor="middle" font-size="12.5" fill="#777">图 1  同名端定义与交流法“相加 / 相减”判据</text>
</svg>
