<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Microsoft YaHei, sans-serif">
  <rect width="760" height="420" fill="#fbfcfe"/>
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f3b57">图 1  日光灯电路组成与接线</text>

  <!-- ═══ 主回路连线 ═══ -->
  <g stroke="#3b6ea5" stroke-width="3" fill="none">
    <!-- L → 开关 -->
    <line x1="90" y1="140" x2="153" y2="140"/>
    <!-- 开关 → 镇流器 -->
    <line x1="217" y1="140" x2="270" y2="140"/>
    <!-- 镇流器 → 灯管 right_b -->
    <path d="M380 140 L680 140 L680 223 L647 223"/>
    <!-- 灯管 left_b → 中性线 N -->
    <path d="M435 223 L410 223 L410 340"/>
    <!-- 灯管 left_a → 启辉器左 -->
    <path d="M435 197 L395 197 L395 288 L503 288"/>
    <!-- 灯管 right_a → 启辉器右 -->
    <path d="M645 197 L665 197 L665 288 L557 288"/>
    <!-- 中性线 -->
    <line x1="60" y1="340" x2="450" y2="340"/>
  </g>

  <!-- ═══ AC 电源 ═══ -->
  <rect x="30" y="100" width="60" height="80" rx="8" fill="#eef4fb" stroke="#3b6ea5" stroke-width="2"/>
  <text x="60" y="135" text-anchor="middle" font-size="13" fill="#1f3b57">AC</text>
  <text x="60" y="155" text-anchor="middle" font-size="12" fill="#5b6b7c">220V</text>
  <text x="96" y="132" font-size="12" fill="#c0392b" font-weight="bold">L</text>
  <text x="60" y="360" text-anchor="middle" font-size="12" fill="#3b6ea5" font-weight="bold">N</text>
  <line x1="60" y1="180" x2="60" y2="340" stroke="#3b6ea5" stroke-width="3"/>

  <!-- ═══ 开关 ═══ -->
  <circle cx="155" cy="140" r="5" fill="#3b6ea5"/>
  <circle cx="215" cy="140" r="5" fill="#3b6ea5"/>
  <line x1="155" y1="140" x2="212" y2="118" stroke="#c0392b" stroke-width="3"/>
  <text x="185" y="110" text-anchor="middle" font-size="13" fill="#c0392b">开关</text>

  <!-- ═══ 镇流器 ═══ -->
  <rect x="270" y="115" width="110" height="50" rx="8" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="325" y="145" text-anchor="middle" font-size="15" fill="#1e6b3a">镇流器</text>
  <text x="325" y="108" text-anchor="middle" font-size="11" fill="#888">电感 L</text>

  <!-- ═══ 灯管 ═══ -->
  <rect x="450" y="185" width="180" height="50" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/>
  <text x="540" y="203" text-anchor="middle" font-size="15" fill="#f57f17">灯管</text>
  <!-- 左端引脚线 -->
  <line x1="435" y1="197" x2="450" y2="197" stroke="#3b6ea5" stroke-width="2.5"/>
  <line x1="435" y1="223" x2="450" y2="223" stroke="#3b6ea5" stroke-width="2.5"/>
  <!-- 右端引脚线 -->
  <line x1="630" y1="197" x2="645" y2="197" stroke="#3b6ea5" stroke-width="2.5"/>
  <line x1="630" y1="223" x2="645" y2="223" stroke="#3b6ea5" stroke-width="2.5"/>
  <!-- 左灯丝 -->
  <path d="M455 197 L465 210 L455 223" stroke="#e67e22" stroke-width="3" fill="none"/>
  <!-- 右灯丝 -->
  <path d="M625 197 L615 210 L625 223" stroke="#e67e22" stroke-width="3" fill="none"/>
  <!-- 放电通道虚线 -->
  <line x1="468" y1="215" x2="612" y2="215" stroke="#f9a825" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- 引脚标注 -->
  <text x="428" y="193" text-anchor="end" font-size="11" fill="#3b6ea5">left_a</text>
  <text x="428" y="232" text-anchor="end" font-size="11" fill="#3b6ea5">left_b</text>
  <text x="652" y="193" font-size="11" fill="#3b6ea5">right_a</text>
  <text x="652" y="232" font-size="11" fill="#3b6ea5">right_b</text>

  <!-- ═══ 启辉器（跨接 left_a 与 right_a） ═══ -->
  <rect x="505" y="270" width="50" height="36" rx="18" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="530" y="293" text-anchor="middle" font-size="12" fill="#1565c0">启辉器</text>
  <circle cx="505" cy="288" r="4" fill="#1565c0"/>
  <circle cx="555" cy="288" r="4" fill="#1565c0"/>

  <!-- ═══ 连接节点 ═══ -->
  <g fill="#3b6ea5">
    <circle cx="435" cy="197" r="4.5"/>
    <circle cx="435" cy="223" r="4.5"/>
    <circle cx="645" cy="197" r="4.5"/>
    <circle cx="645" cy="223" r="4.5"/>
    <circle cx="410" cy="340" r="4.5"/>
  </g>

  <!-- ═══ 连接关系标注 ═══ -->
  <text x="380" y="385" text-anchor="middle" font-size="14" fill="#1f3b57" font-weight="bold">AC 220V → 开关 → 镇流器 → 灯管 right_b</text>
  <text x="380" y="408" text-anchor="middle" font-size="13" fill="#5b6b7c">right_a → 启辉器 → left_a　｜　left_b → 中性线 N</text>
</svg>
