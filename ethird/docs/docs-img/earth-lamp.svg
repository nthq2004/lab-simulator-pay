<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect x="0" y="0" width="920" height="560" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#202124">三灯绝缘指示灯（地气灯）工作原理</text>

  <!-- 三相母线 -->
  <line x1="150" y1="70" x2="150" y2="200" stroke="#c0392b" stroke-width="3"/>
  <line x1="230" y1="70" x2="230" y2="200" stroke="#d4a017" stroke-width="3"/>
  <line x1="310" y1="70" x2="310" y2="200" stroke="#2471a3" stroke-width="3"/>
  <text x="150" y="62" text-anchor="middle" font-size="12" fill="#c0392b">L1</text>
  <text x="230" y="62" text-anchor="middle" font-size="12" fill="#d4a017">L2</text>
  <text x="310" y="62" text-anchor="middle" font-size="12" fill="#2471a3">L3</text>
  <text x="60" y="130" font-size="12" fill="#5f6368">三相</text>
  <text x="60" y="150" font-size="12" fill="#5f6368">电源</text>

  <!-- 三只灯 -->
  <circle cx="150" cy="240" r="24" fill="#fff8e1" stroke="#b26a00" stroke-width="2.5"/>
  <circle cx="230" cy="240" r="24" fill="#fff8e1" stroke="#b26a00" stroke-width="2.5"/>
  <circle cx="310" cy="240" r="24" fill="#fff8e1" stroke="#b26a00" stroke-width="2.5"/>
  <text x="150" y="246" text-anchor="middle" font-size="11" fill="#b26a00">HL1</text>
  <text x="230" y="246" text-anchor="middle" font-size="11" fill="#b26a00">HL2</text>
  <text x="310" y="246" text-anchor="middle" font-size="11" fill="#b26a00">HL3</text>
  <line x1="150" y1="200" x2="150" y2="216" stroke="#c0392b" stroke-width="3"/>
  <line x1="230" y1="200" x2="230" y2="216" stroke="#d4a017" stroke-width="3"/>
  <line x1="310" y1="200" x2="310" y2="216" stroke="#2471a3" stroke-width="3"/>

  <!-- 星形连接 -->
  <path d="M150 264 L150 300 L230 300 L230 264" fill="none" stroke="#5f6368" stroke-width="2.5"/>
  <path d="M310 264 L310 300 L230 300" fill="none" stroke="#5f6368" stroke-width="2.5"/>
  <circle cx="230" cy="300" r="4" fill="#5f6368"/>
  <text x="250" y="304" font-size="12" fill="#5f6368">星点 N</text>

  <!-- 试验按钮（常开） -->
  <line x1="230" y1="300" x2="230" y2="330" stroke="#5f6368" stroke-width="2.5"/>
  <circle cx="230" cy="334" r="4" fill="#5f6368"/>
  <line x1="230" y1="338" x2="214" y2="374" stroke="#c0392b" stroke-width="3"/>
  <circle cx="230" cy="386" r="4" fill="#5f6368"/>
  <line x1="230" y1="386" x2="230" y2="410" stroke="#5f6368" stroke-width="2.5"/>
  <text x="270" y="352" font-size="12" fill="#c0392b">SB 试验按钮（常开）</text>

  <!-- 接地 -->
  <line x1="230" y1="410" x2="230" y2="428" stroke="#5f6368" stroke-width="3"/>
  <line x1="200" y1="428" x2="260" y2="428" stroke="#5f6368" stroke-width="3"/>
  <line x1="210" y1="440" x2="250" y2="440" stroke="#5f6368" stroke-width="3"/>
  <line x1="221" y1="452" x2="239" y2="452" stroke="#5f6368" stroke-width="3"/>
  <text x="230" y="478" text-anchor="middle" font-size="12" fill="#5f6368">船体地</text>

  <!-- 原理说明 -->
  <line x1="400" y1="70" x2="400" y2="500" stroke="#dadce0" stroke-width="1.5" stroke-dasharray="6 5"/>

  <text x="430" y="80" font-size="15" font-weight="bold" fill="#202124">工作原理</text>
  <text x="430" y="108" font-size="12.5" fill="#37474f">三只同规格指示灯接成星形，星点经</text>
  <text x="430" y="130" font-size="12.5" fill="#37474f">常开试验按钮 SB 接船体地。按下 SB</text>
  <text x="430" y="152" font-size="12.5" fill="#37474f">后，三灯经星点与大地构成回路。</text>

  <!-- 三种状态 -->
  <rect x="430" y="176" width="450" height="70" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="446" y="200" font-size="12.5" font-weight="bold" fill="#188038">① 三相绝缘均良好</text>
  <text x="446" y="223" font-size="11.5" fill="#188038">三相对地阻抗对称，星点接近地电位，三灯承受电压相近、亮度相同。</text>

  <rect x="430" y="256" width="450" height="70" rx="8" fill="#fef7e0" stroke="#b26a00" stroke-width="1.5"/>
  <text x="446" y="280" font-size="12.5" font-weight="bold" fill="#b26a00">② 某相绝缘下降（如 0.05MΩ）</text>
  <text x="446" y="303" font-size="11.5" fill="#b26a00">该相对地电阻变小、分压降低，对应灯变暗，其余两灯略亮。</text>

  <rect x="430" y="336" width="450" height="70" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.5"/>
  <text x="446" y="360" font-size="12.5" font-weight="bold" fill="#8430ce">③ 某相直接接地（Rx = 0）</text>
  <text x="446" y="383" font-size="11.5" fill="#8430ce">该相灯两端无电压而完全熄灭，其余两灯承受线电压而变亮。</text>

  <rect x="430" y="420" width="450" height="80" rx="8" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/>
  <text x="446" y="444" font-size="12.5" font-weight="bold" fill="#202124">判据</text>
  <text x="446" y="467" font-size="11.5" fill="#37474f">灯最暗（或熄灭）的那一相，即为对地绝缘下降或接地的故障相。</text>
  <text x="446" y="489" font-size="11.5" fill="#37474f">地气灯只能判断故障「相」，不能给出绝缘电阻的具体数值。</text>
</svg>
