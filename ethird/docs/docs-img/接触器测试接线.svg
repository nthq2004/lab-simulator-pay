<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="800" height="420" fill="#ffffff"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#20303f">接触器励磁回路与万用表检测接线</text>

  <!-- 交流电源 -->
  <rect x="40" y="70" width="120" height="100" rx="6" fill="#dfe6e9" stroke="#2d3436" stroke-width="2"/>
  <text x="100" y="105" font-size="14" text-anchor="middle" fill="#20303f">交流电源</text>
  <text x="100" y="128" font-size="13" text-anchor="middle" fill="#c0392b">AC 220V</text>
  <circle cx="160" cy="100" r="5" fill="#e04040"/><text x="150" y="92" font-size="12" fill="#c0392b">L</text>
  <circle cx="160" cy="145" r="5" fill="#333"/><text x="150" y="166" font-size="12" fill="#20303f">N</text>

  <!-- 开关 -->
  <circle cx="240" cy="100" r="5" fill="#333"/>
  <circle cx="300" cy="100" r="5" fill="#333"/>
  <line x1="240" y1="100" x2="292" y2="76" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
  <text x="270" y="122" font-size="13" text-anchor="middle" fill="#20303f">开关</text>

  <!-- 接触器线圈 -->
  <rect x="420" y="60" width="180" height="120" rx="6" fill="#eef2f8" stroke="#5a6070" stroke-width="2"/>
  <text x="510" y="92" font-size="14" text-anchor="middle" fill="#20303f">接触器线圈</text>
  <text x="510" y="116" font-size="13" text-anchor="middle" fill="#20303f">A1 — A2</text>
  <text x="510" y="140" font-size="12" text-anchor="middle" fill="#8a6a20">（中柱绕组）</text>
  <circle cx="420" cy="100" r="5" fill="#e04040"/><text x="398" y="92" font-size="12" fill="#c0392b">A1</text>
  <circle cx="420" cy="150" r="5" fill="#4080e0"/><text x="398" y="170" font-size="12" fill="#2470c0">A2</text>

  <!-- 励磁回路连线 -->
  <path d="M160 100 H240" stroke="#333" stroke-width="2.5" fill="none"/>
  <path d="M300 100 H420" stroke="#333" stroke-width="2.5" fill="none"/>
  <path d="M160 145 H380 V150 H420" stroke="#333" stroke-width="2.5" fill="none"/>

  <!-- 万用表（表笔接口在右侧） -->
  <rect x="380" y="250" width="200" height="120" rx="6" fill="#f5f6f0" stroke="#5a6070" stroke-width="2"/>
  <text x="480" y="286" font-size="14" text-anchor="middle" fill="#20303f">数字万用表</text>
  <text x="480" y="308" font-size="12" text-anchor="middle" fill="#c0392b">电阻档（2kΩ）</text>
  <circle cx="580" cy="290" r="5" fill="#e04040"/><text x="560" y="282" font-size="12" fill="#c0392b">V</text>
  <circle cx="580" cy="330" r="5" fill="#333"/><text x="540" y="352" font-size="12" fill="#20303f">COM</text>

  <!-- 被测触点 L1-T1 -->
  <circle cx="680" cy="290" r="5" fill="#333"/><text x="660" y="282" font-size="12" fill="#20303f">L1</text>
  <circle cx="680" cy="340" r="5" fill="#333"/><text x="660" y="360" font-size="12" fill="#20303f">T1</text>
  <line x1="680" y1="295" x2="680" y2="318" stroke="#9aa4b2" stroke-width="2"/>
  <line x1="680" y1="334" x2="680" y2="322" stroke="#27ae60" stroke-width="3.5" stroke-linecap="round"/>
  <text x="700" y="318" font-size="12" fill="#20303f">被测触头</text>

  <!-- 检测回路连线 -->
  <path d="M580 290 H680" stroke="#e04040" stroke-width="2.5" fill="none"/>
  <path d="M580 330 H640 V340 H680" stroke="#333" stroke-width="2.5" fill="none"/>

  <!-- 说明 -->
  <text x="40" y="250" font-size="13" fill="#20303f">1. 励磁回路：交流 L → 开关 → 线圈 A1；N → 线圈 A2。</text>
  <text x="40" y="276" font-size="13" fill="#20303f">2. 检测：万用表 V／COM 跨接被测两端，可改接：</text>
  <text x="60" y="300" font-size="13" fill="#c0392b">线圈 A1-A2（测线圈电阻）</text>
  <text x="60" y="322" font-size="13" fill="#c0392b">主触头 L1-T1　辅助常开 13-14</text>
  <text x="60" y="344" font-size="13" fill="#c0392b">辅助常闭 31-32</text>
  <text x="40" y="374" font-size="13" fill="#8a5a00">测电阻前必须先断开开关并关闭交流电源。</text>
</svg>
