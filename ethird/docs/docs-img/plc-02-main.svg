<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="720" height="560" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2a33">图 2　主电路接线（AC 380V）</text>

  <!-- 电源 -->
  <rect x="180" y="60" width="360" height="54" rx="8" fill="#fdf6ec" stroke="#e0a458" stroke-width="2"/>
  <text x="360" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#a86a1a">三相电源（单线图符号）</text>
  <text x="360" y="103" text-anchor="middle" font-size="12" fill="#8a6a3a">U / V / W　相电压 220V，线电压 ≈ 381V</text>
  <g font-size="13" text-anchor="middle" fill="#a86a1a">
    <text x="270" y="140">U</text><text x="360" y="140">V</text><text x="450" y="140">W</text>
  </g>

  <!-- KM1 -->
  <rect x="180" y="160" width="360" height="58" rx="8" fill="#ffffff" stroke="#c98a3a" stroke-width="2"/>
  <text x="216" y="196" font-size="14" font-weight="bold" fill="#7a4a10">KM1</text>
  <text x="384" y="196" text-anchor="middle" font-size="13" fill="#7a4a10">接触器主触头（三对常开）</text>
  <!-- FR -->
  <rect x="180" y="250" width="360" height="58" rx="8" fill="#ffffff" stroke="#c98a3a" stroke-width="2"/>
  <text x="216" y="286" font-size="14" font-weight="bold" fill="#7a4a10">FR</text>
  <text x="384" y="286" text-anchor="middle" font-size="13" fill="#7a4a10">热继电器发热元件</text>

  <!-- 电机 -->
  <rect x="220" y="350" width="280" height="120" rx="10" fill="#eef4fb" stroke="#3f7fbf" stroke-width="2"/>
  <text x="360" y="398" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d5185">M1　三相异步电动机</text>
  <text x="360" y="422" text-anchor="middle" font-size="12" fill="#4a5b6b">5.0 kW　380V　1440 r/min</text>
  <text x="360" y="444" text-anchor="middle" font-size="12" fill="#4a5b6b">接线：U / V / W / PE</text>

  <!-- 连线 -->
  <g stroke="#c98a3a" stroke-width="3" fill="none">
    <line x1="270" y1="114" x2="270" y2="160"/>
    <line x1="360" y1="114" x2="360" y2="160"/>
    <line x1="450" y1="114" x2="450" y2="160"/>
    <line x1="270" y1="218" x2="270" y2="250"/>
    <line x1="360" y1="218" x2="360" y2="250"/>
    <line x1="450" y1="218" x2="450" y2="250"/>
    <line x1="270" y1="308" x2="270" y2="350"/>
    <line x1="360" y1="308" x2="360" y2="350"/>
    <line x1="450" y1="308" x2="450" y2="350"/>
  </g>
  <!-- PE -->
  <g stroke="#2e9e4f" stroke-width="3" fill="none">
    <line x1="500" y1="410" x2="580" y2="410"/>
    <line x1="580" y1="410" x2="580" y2="440"/>
  </g>
  <g stroke="#2e9e4f" stroke-width="3" fill="none">
    <line x1="566" y1="440" x2="594" y2="440"/>
    <line x1="572" y1="448" x2="588" y2="448"/>
    <line x1="578" y1="456" x2="582" y2="456"/>
  </g>
  <text x="600" y="408" font-size="12" fill="#1e6b34">PE（保护接地）</text>

  <text x="360" y="508" text-anchor="middle" font-size="12.5" fill="#5b6b7a">顺序：三相电源 → KM1 主触头 → FR 发热元件 → 电动机；PE 单独接地</text>
  <text x="360" y="532" text-anchor="middle" font-size="12.5" fill="#5b6b7a">KM1 主触头由 PLC 输出 Q0.0 驱动线圈吸合，实现电机的起停控制</text>
</svg>
