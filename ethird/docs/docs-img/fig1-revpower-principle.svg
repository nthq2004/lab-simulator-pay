<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="520" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a2a4a">逆功率继电器组成原理图（机电型 / 整流型）</text>
  <text x="520" y="56" text-anchor="middle" font-size="13" fill="#666">电流回路取发电机出口 TA 二次电流，电压回路取母线 TV 二次电压，由相敏回路判别功率方向</text>
  <line x1="40" y1="68" x2="1000" y2="68" stroke="#c9d6e8" stroke-width="2"/>

  <!-- ═══ 输入回路 ═══ -->
  <text x="90" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a7bd5">输入回路</text>
  <rect x="30" y="130" width="120" height="60" rx="8" fill="#eaf4fb" stroke="#3a7bd5" stroke-width="1.6"/>
  <text x="90" y="156" text-anchor="middle" font-size="13">TA 二次电流</text>
  <text x="90" y="176" text-anchor="middle" font-size="11.5" fill="#555">（I 回路）</text>
  <rect x="30" y="230" width="120" height="60" rx="8" fill="#fdf3e3" stroke="#d98a2b" stroke-width="1.6"/>
  <text x="90" y="256" text-anchor="middle" font-size="13">TV 二次电压</text>
  <text x="90" y="276" text-anchor="middle" font-size="11.5" fill="#555">（U 回路）</text>

  <!-- ═══ 变换回路 ═══ -->
  <text x="255" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a9d5c">变换回路</text>
  <rect x="190" y="130" width="130" height="60" rx="8" fill="#eefaf0" stroke="#4a9d5c" stroke-width="1.6"/>
  <text x="255" y="156" text-anchor="middle" font-size="13">电流变换器</text>
  <text x="255" y="176" text-anchor="middle" font-size="10.5" fill="#555">（隔离 / 变比）</text>
  <rect x="190" y="230" width="130" height="60" rx="8" fill="#eefaf0" stroke="#4a9d5c" stroke-width="1.6"/>
  <text x="255" y="256" text-anchor="middle" font-size="13">电压变换器</text>
  <text x="255" y="276" text-anchor="middle" font-size="10.5" fill="#555">（隔离 / 变比）</text>
  <line x1="150" y1="160" x2="188" y2="160" stroke="#333" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="150" y1="260" x2="188" y2="260" stroke="#333" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- ═══ 相敏功率测量 ═══ -->
  <text x="470" y="118" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8e5bc0">测量与判别回路</text>
  <rect x="380" y="130" width="180" height="160" rx="9" fill="#f6effc" stroke="#8e5bc0" stroke-width="1.6"/>
  <text x="470" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a2d8a">相敏功率测量回路</text>
  <text x="470" y="200" text-anchor="middle" font-size="13.5" fill="#333">P = √3·U·I·cos φ</text>
  <text x="470" y="226" text-anchor="middle" font-size="11.5" fill="#555">（相敏整流比相）</text>
  <text x="470" y="250" text-anchor="middle" font-size="11.5" fill="#555">判别功率大小与方向</text>
  <text x="470" y="272" text-anchor="middle" font-size="10.5" fill="#888">输出正比于有功分量的直流信号</text>

  <!-- 变换器 → 相敏 -->
  <path d="M320,160 L350,160 L350,182 L378,182" stroke="#333" stroke-width="1.8" fill="none" marker-end="url(#arw)"/>
  <path d="M320,260 L350,260 L350,238 L378,238" stroke="#333" stroke-width="1.8" fill="none" marker-end="url(#arw)"/>

  <!-- ═══ 逆功率判别 ═══ -->
  <rect x="620" y="160" width="140" height="100" rx="9" fill="#fdeaea" stroke="#cc4444" stroke-width="1.6"/>
  <text x="690" y="192" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a02020">逆功率判别</text>
  <text x="690" y="218" text-anchor="middle" font-size="12.5">P ≦ −Pset</text>
  <text x="690" y="240" text-anchor="middle" font-size="10.5" fill="#666">（倒送有功超整定）</text>
  <line x1="560" y1="210" x2="618" y2="210" stroke="#333" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- ═══ 定时限延时 ═══ -->
  <rect x="820" y="100" width="160" height="60" rx="8" fill="#eefaf0" stroke="#4a9d5c" stroke-width="1.6"/>
  <text x="900" y="126" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f6b3d">定时限延时 t</text>
  <text x="900" y="146" text-anchor="middle" font-size="11" fill="#555">（0.5 ~ 10 s 可调）</text>
  <path d="M760,190 L790,190 L790,130 L818,130" stroke="#333" stroke-width="1.8" fill="none" marker-end="url(#arw)"/>

  <!-- ═══ 出口继电器 ═══ -->
  <rect x="820" y="190" width="160" height="60" rx="8" fill="#eefaf0" stroke="#4a9d5c" stroke-width="1.6"/>
  <text x="900" y="216" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f6b3d">出口继电器</text>
  <text x="900" y="236" text-anchor="middle" font-size="11" fill="#555">（执行跳闸 / 信号）</text>
  <line x1="900" y1="160" x2="900" y2="188" stroke="#333" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- ═══ 出口触点 ═══ -->
  <rect x="820" y="280" width="160" height="110" rx="9" fill="#e8f0fe" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="900" y="306" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a4d8f">出口触点</text>
  <text x="900" y="330" text-anchor="middle" font-size="11.5">NO 闭合 → 跳闸</text>
  <text x="900" y="350" text-anchor="middle" font-size="11.5">NC 断开 → 闭锁</text>
  <text x="900" y="370" text-anchor="middle" font-size="11.5">信号 → 告警灯</text>
  <line x1="900" y1="250" x2="900" y2="278" stroke="#333" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- ═══ 前面板 ═══ -->
  <rect x="30" y="420" width="980" height="180" rx="12" fill="#fbfbfb" stroke="#999" stroke-width="1.8"/>
  <text x="520" y="446" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">前面板示意（实际装置）</text>

  <!-- 功率整定旋钮 -->
  <rect x="60" y="458" width="200" height="128" rx="8" fill="#fff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="160" y="480" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">功率整定 Pset</text>
  <circle cx="160" cy="520" r="28" fill="#e8e8e8" stroke="#888" stroke-width="3"/>
  <line x1="160" y1="520" x2="160" y2="498" stroke="#c0392b" stroke-width="3"/>
  <circle cx="160" cy="520" r="5" fill="#fff" stroke="#666"/>
  <text x="160" y="568" text-anchor="middle" font-size="11" fill="#555">（%Pn，如 8%）</text>

  <!-- 延时整定旋钮 -->
  <rect x="290" y="458" width="200" height="128" rx="8" fill="#fff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="390" y="480" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">延时整定 t</text>
  <circle cx="390" cy="520" r="28" fill="#e8e8e8" stroke="#888" stroke-width="3"/>
  <line x1="390" y1="520" x2="390" y2="498" stroke="#c0392b" stroke-width="3"/>
  <circle cx="390" cy="520" r="5" fill="#fff" stroke="#666"/>
  <text x="390" y="568" text-anchor="middle" font-size="11" fill="#555">（s，如 10 s）</text>

  <!-- 状态指示灯 -->
  <rect x="520" y="458" width="190" height="128" rx="8" fill="#fff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="615" y="480" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">状态指示</text>
  <circle cx="585" cy="520" r="16" fill="#52c86a" stroke="#2f8f46" stroke-width="2"/>
  <circle cx="645" cy="520" r="16" fill="#e8503a" stroke="#b52614" stroke-width="2"/>
  <text x="585" y="562" text-anchor="middle" font-size="11" fill="#555">电源</text>
  <text x="645" y="562" text-anchor="middle" font-size="11" fill="#555">动作</text>

  <!-- 试验 / 复位按钮 -->
  <rect x="740" y="458" width="240" height="128" rx="8" fill="#fff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="860" y="480" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">面板操作</text>
  <rect x="762" y="492" width="196" height="38" rx="6" fill="#fff" stroke="#888" stroke-width="1.4"/>
  <text x="860" y="516" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">试验（模拟逆功率）</text>
  <rect x="762" y="538" width="196" height="38" rx="6" fill="#fff" stroke="#888" stroke-width="1.4"/>
  <text x="860" y="562" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">复位（故障消除复归）</text>

  <!-- 底注 -->
  <text x="520" y="626" text-anchor="middle" font-size="12" fill="#555">输入：TA 二次电流（发电机出口）＋ TV 二次电压（母线）　|　输出：NO 触点跳闸、NC 触点闭锁、信号触点告警</text>
</svg>
