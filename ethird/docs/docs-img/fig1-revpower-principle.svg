<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="'Microsoft YaHei', SimHei, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arw2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#1a6bd6"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="470" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a2a4a">逆功率继电器组成原理图（机电型 / 整流型）</text>
  <text x="470" y="56" text-anchor="middle" font-size="13" fill="#666">电流回路取发电机出口 TA 二次电流，电压回路取母线 TV 二次电压，由相敏回路判别功率方向</text>
  <line x1="40" y1="68" x2="900" y2="68" stroke="#c9d6e8" stroke-width="2"/>

  <!-- ═══════════ 输入回路 ═══════════ -->
  <text x="90" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a7bd5">输入回路</text>
  <rect x="30" y="118" width="120" height="50" rx="8" fill="#eaf4fb" stroke="#3a7bd5" stroke-width="1.6"/>
  <text x="90" y="142" text-anchor="middle" font-size="13">TA 二次电流</text>
  <text x="90" y="159" text-anchor="middle" font-size="11.5" fill="#555">（I 回路）</text>
  <rect x="30" y="196" width="120" height="50" rx="8" fill="#fdf3e3" stroke="#d98a2b" stroke-width="1.6"/>
  <text x="90" y="220" text-anchor="middle" font-size="13">TV 二次电压</text>
  <text x="90" y="237" text-anchor="middle" font-size="11.5" fill="#555">（U 回路）</text>

  <!-- ═══════════ 变换回路 ═══════════ -->
  <rect x="182" y="118" width="106" height="50" rx="8" fill="#eefaf0" stroke="#4a9d5c" stroke-width="1.6"/>
  <text x="235" y="142" text-anchor="middle" font-size="13">电流变换器</text>
  <text x="235" y="159" text-anchor="middle" font-size="10.5" fill="#555">（隔离 / 变比）</text>
  <rect x="182" y="196" width="106" height="50" rx="8" fill="#eefaf0" stroke="#4a9d5c" stroke-width="1.6"/>
  <text x="235" y="220" text-anchor="middle" font-size="13">电压变换器</text>
  <text x="235" y="237" text-anchor="middle" font-size="10.5" fill="#555">（隔离 / 变比）</text>
  <line x1="150" y1="143" x2="182" y2="143" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="150" y1="221" x2="182" y2="221" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ═══════════ 相敏功率测量 ═══════════ -->
  <text x="395" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e5bc0">测量与判别回路</text>
  <rect x="322" y="118" width="150" height="100" rx="9" fill="#f6effc" stroke="#8e5bc0" stroke-width="1.6"/>
  <text x="397" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a2d8a">相敏功率测量回路</text>
  <text x="397" y="166" text-anchor="middle" font-size="13" fill="#333">P = U·I·cos φ</text>
  <text x="397" y="186" text-anchor="middle" font-size="11.5" fill="#555">（三相取 √3 系数）</text>
  <text x="397" y="205" text-anchor="middle" font-size="11.5" fill="#555">判别功率大小与方向</text>

  <!-- ═══════════ 逆功率判别 ═══════════ -->
  <rect x="504" y="118" width="128" height="100" rx="9" fill="#fdeaea" stroke="#cc4444" stroke-width="1.6"/>
  <text x="568" y="140" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a02020">逆功率判别</text>
  <text x="568" y="162" text-anchor="middle" font-size="12">P ≦ -Pset</text>
  <text x="568" y="180" text-anchor="middle" font-size="10.5" fill="#666">（吸收有功超整定）</text>
  <text x="568" y="198" text-anchor="middle" font-size="10.5" fill="#666">长期倒送 → 保护</text>

  <!-- ═══════════ 延时回路 ═══════════ -->
  <rect x="664" y="128" width="118" height="52" rx="8" fill="#eefaf0" stroke="#4a9d5c" stroke-width="1.6"/>
  <text x="723" y="152" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f6b3d">定时限延时 t</text>
  <text x="723" y="170" text-anchor="middle" font-size="11" fill="#555">（0.5 ~ 10 s 可调）</text>

  <!-- ═══════════ 出口回路 ═══════════ -->
  <rect x="664" y="206" width="118" height="52" rx="8" fill="#eefaf0" stroke="#4a9d5c" stroke-width="1.6"/>
  <text x="723" y="230" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f6b3d">出口继电器</text>
  <text x="723" y="248" text-anchor="middle" font-size="11" fill="#555">（执行跳闸/信号）</text>

  <!-- 出口触点输出 -->
  <rect x="814" y="128" width="100" height="130" rx="9" fill="#e8f0fe" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="864" y="152" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a4d8f">出口触点</text>
  <text x="864" y="176" text-anchor="middle" font-size="11.5">NO 闭合：跳闸</text>
  <text x="864" y="194" text-anchor="middle" font-size="11.5">NC 断开：闭锁</text>
  <text x="864" y="214" text-anchor="middle" font-size="11.5">信号：点亮告警</text>
  <text x="864" y="246" text-anchor="middle" font-size="10.5" fill="#666">输出至二次回路</text>

  <!-- 信号流连线 -->
  <line x1="288" y1="143" x2="322" y2="143" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="288" y1="221" x2="322" y2="221" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="472" y1="168" x2="504" y2="168" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M568 218 L568 240 L723 240 L723 262" stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
  <path d="M600 218 L600 230 L600 262" stroke="#333" stroke-width="1.6" fill="none"/>
  <line x1="632" y1="158" x2="664" y2="158" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="782" y1="192" x2="814" y2="192" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M723 258 L723 268 L730 268" stroke="#999" stroke-width="1.2" fill="none" stroke-dasharray="4,3"/>
  <line x1="832" y1="218" x2="838" y2="252" stroke="#999" stroke-width="1.2" fill="none" stroke-dasharray="4,3"/>

  <!-- 延时旁注 -->
  <text x="568" y="262" text-anchor="middle" font-size="11" fill="#888">判别成立后，经延时 t 触发出口（防误动）</text>

  <!-- ═══════════ 前面板纵向连接说明 ═══════════ -->
  <path d="M150 143 L30 143 L30 240 L30 372" stroke="#1a6bd6" stroke-width="1.4" fill="none" stroke-dasharray="5,4" opacity="0.7"/>
  <text x="60" y="330" font-size="11" fill="#1a6bd6">TA / TV 二次回路接线端子</text>

  <!-- ═══════════ 前面板 ═══════════ -->
  <rect x="140" y="352" width="660" height="216" rx="12" fill="#fbfbfb" stroke="#999" stroke-width="1.8"/>
  <text x="470" y="378" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">前面板示意（实际装置）</text>

  <!-- 整定旋钮 1 -->
  <rect x="182" y="392" width="150" height="116" rx="8" fill="#fff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="257" y="414" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">功率整定 Pset</text>
  <circle cx="257" cy="452" r="30" fill="#e8e8e8" stroke="#888" stroke-width="3"/>
  <line x1="257" y1="452" x2="257" y2="428" stroke="#c0392b" stroke-width="3"/>
  <circle cx="257" cy="452" r="5" fill="#fff" stroke="#666"/>
  <text x="257" y="498" text-anchor="middle" font-size="11" fill="#555">（%Pn，如 8%）</text>

  <!-- 整定旋钮 2 -->
  <rect x="357" y="392" width="150" height="116" rx="8" fill="#fff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="432" y="414" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">延时整定 t</text>
  <circle cx="432" cy="452" r="30" fill="#e8e8e8" stroke="#888" stroke-width="3"/>
  <line x1="432" y1="452" x2="432" y2="428" stroke="#c0392b" stroke-width="3"/>
  <circle cx="432" cy="452" r="5" fill="#fff" stroke="#666"/>
  <text x="432" y="498" text-anchor="middle" font-size="11" fill="#555">（s，如 10 s）</text>

  <!-- 指示灯 -->
  <rect x="532" y="392" width="130" height="116" rx="8" fill="#fff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="597" y="414" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">状态指示</text>
  <circle cx="568" cy="452" r="15" fill="#52c86a" stroke="#2f8f46" stroke-width="2"/>
  <circle cx="626" cy="452" r="15" fill="#e8503a" stroke="#b52614" stroke-width="2"/>
  <text x="568" y="486" text-anchor="middle" font-size="11" fill="#555">电源</text>
  <text x="626" y="486" text-anchor="middle" font-size="11" fill="#555">动作</text>
  <text x="597" y="502" text-anchor="middle" font-size="10" fill="#888">（逆功率跳闸）</text>

  <!-- 按钮 -->
  <rect x="687" y="392" width="88" height="52" rx="6" fill="#fff" stroke="#888" stroke-width="1.4"/>
  <text x="731" y="422" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">试验</text>
  <text x="731" y="438" text-anchor="middle" font-size="9.5" fill="#888">模拟逆功率</text>
  <rect x="687" y="456" width="88" height="52" rx="6" fill="#fff" stroke="#888" stroke-width="1.4"/>
  <text x="731" y="486" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">复位</text>
  <text x="731" y="502" text-anchor="middle" font-size="9.5" fill="#888">故障消除后复归</text>

  <!-- 面板-框图联系虚线 -->
  <path d="M723 330 L723 392" stroke="#999" stroke-width="1.3" fill="none" stroke-dasharray="4,3"/>
  <path d="M864 330 L864 420 L840 420 L840 408" stroke="#999" stroke-width="1.3" fill="none" stroke-dasharray="4,3"/>
  <text x="878" y="436" font-size="10.5" fill="#888">整定与复归</text>

  <!-- 底部说明 -->
  <text x="470" y="602" text-anchor="middle" font-size="12" fill="#555">输入：TA 二次电流（发电机出口）、TV 二次电压（母线）　|　输出：NO 触点跳闸回路、NC 触点闭锁、信号触点告警</text>
</svg>