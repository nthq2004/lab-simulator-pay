<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="'Microsoft YaHei','Arial',sans-serif" font-size="14">
  <marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 z" fill="#4a5568"/>
  </marker>
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="40" y="34" font-size="16" font-weight="bold" fill="#2b6cb0">相序指示灯与相序转换开关</text>

  <!-- 进线 -->
  <text x="40" y="78" font-size="14" font-weight="bold" fill="#2d3748">岸电进线</text>
  <line x1="40" y1="100" x2="210" y2="100" stroke="#e03030" stroke-width="4"/>
  <line x1="40" y1="130" x2="210" y2="130" stroke="#20a030" stroke-width="4"/>
  <line x1="40" y1="160" x2="210" y2="160" stroke="#2050e0" stroke-width="4"/>
  <text x="216" y="105" font-size="12" fill="#4a5568">L1</text>
  <text x="216" y="135" font-size="12" fill="#4a5568">L2</text>
  <text x="216" y="165" font-size="12" fill="#4a5568">L3</text>

  <!-- 相序转换开关 -->
  <rect x="250" y="66" width="230" height="150" rx="10" fill="#fff5eb" stroke="#c05621" stroke-width="2.5"/>
  <text x="365" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#9c4221">相序转换开关</text>
  <rect x="266" y="100" width="198" height="32" rx="6" fill="#ffffff" stroke="#dd6b20"/>
  <text x="365" y="121" text-anchor="middle" font-size="12">相序1：L1→L1，L2→L2，L3→L3（直通）</text>
  <rect x="266" y="137" width="198" height="32" rx="6" fill="#edf2f7" stroke="#718096"/>
  <text x="365" y="158" text-anchor="middle" font-size="12" fill="#4a5568">OFF：三极全部断开</text>
  <rect x="266" y="174" width="198" height="32" rx="6" fill="#ffffff" stroke="#dd6b20"/>
  <text x="365" y="195" text-anchor="middle" font-size="12">相序2：L2 与 L3 对调（换相）</text>

  <!-- 输出 -->
  <text x="540" y="78" font-size="14" font-weight="bold" fill="#2d3748">岸电箱输出</text>
  <g stroke="#4a5568" stroke-width="2.4" fill="none" marker-end="url(#ar2)">
    <line x1="480" y1="100" x2="600" y2="100"/>
    <line x1="480" y1="130" x2="600" y2="130"/>
    <line x1="480" y1="160" x2="600" y2="160"/>
  </g>
  <text x="606" y="105" font-size="12" fill="#4a5568">t1</text>
  <text x="606" y="135" font-size="12" fill="#4a5568">t2</text>
  <text x="606" y="165" font-size="12" fill="#4a5568">t3</text>

  <!-- 指示灯 -->
  <g text-anchor="middle">
    <circle cx="720" cy="100" r="17" fill="#f7fafc" stroke="#4a5568" stroke-width="2"/>
    <text x="720" y="132" font-size="12" fill="#2d3748">电源灯（白）</text>
    <text x="720" y="148" font-size="11" fill="#718096">进线有电即亮</text>

    <circle cx="820" cy="100" r="17" fill="#c6f6d5" stroke="#276749" stroke-width="2"/>
    <text x="820" y="132" font-size="12" fill="#276749">正序灯（绿）</text>
    <text x="820" y="148" font-size="11" fill="#718096">输出正序亮绿</text>

    <circle cx="920" cy="100" r="17" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
    <text x="920" y="132" font-size="12" fill="#c53030">负序灯（红）</text>
    <text x="920" y="148" font-size="11" fill="#718096">输出负序亮红</text>
  </g>
  <text x="720" y="196" text-anchor="middle" font-size="12" fill="#4a5568">相序开关位于 OFF 或进线无电时，正/负序灯均熄灭</text>

  <!-- 判定式 -->
  <rect x="250" y="222" width="710" height="44" rx="8" fill="#f0f5ff" stroke="#5a67d8"/>
  <text x="605" y="250" text-anchor="middle" font-size="14" fill="#3c366b">输出相序 = 进线相序 <tspan font-weight="bold">异或</tspan> 相序2（换相档）；相序1 档输出与进线相同</text>

  <!-- 真值表 -->
  <text x="40" y="304" font-size="15" font-weight="bold" fill="#2d3748">相序指示灯真值表</text>
  <g font-size="13">
    <rect x="40" y="318" width="880" height="160" rx="8" fill="#ffffff" stroke="#a0aec0"/>
    <!-- 表头 -->
    <rect x="40" y="318" width="880" height="34" rx="8" fill="#edf2f7"/>
    <line x1="40" y1="352" x2="920" y2="352" stroke="#a0aec0"/>
    <text x="150" y="341" text-anchor="middle" font-weight="bold">进线相序</text>
    <text x="330" y="341" text-anchor="middle" font-weight="bold">相序开关档位</text>
    <text x="510" y="341" text-anchor="middle" font-weight="bold">输出相序</text>
    <text x="660" y="341" text-anchor="middle" font-weight="bold">电源灯</text>
    <text x="780" y="341" text-anchor="middle" font-weight="bold">正序灯</text>
    <text x="885" y="341" text-anchor="middle" font-weight="bold">负序灯</text>
    <!-- 列线 -->
    <line x1="240" y1="318" x2="240" y2="478" stroke="#e2e8f0"/>
    <line x1="420" y1="318" x2="420" y2="478" stroke="#e2e8f0"/>
    <line x1="600" y1="318" x2="600" y2="478" stroke="#e2e8f0"/>
    <line x1="720" y1="318" x2="720" y2="478" stroke="#e2e8f0"/>
    <line x1="840" y1="318" x2="840" y2="478" stroke="#e2e8f0"/>
    <!-- 行 -->
    <g fill="#2d3748">
      <text x="140" y="376">正序（UVW）</text><text x="330" y="376" text-anchor="middle">相序1（直通）</text><text x="510" y="376" text-anchor="middle">正序</text><text x="660" y="376" text-anchor="middle">亮</text><text x="780" y="376" text-anchor="middle" fill="#2f855a">亮绿</text><text x="885" y="376" text-anchor="middle" fill="#a0aec0">灭</text>
      <text x="140" y="402">正序（UVW）</text><text x="330" y="402" text-anchor="middle">相序2（换相）</text><text x="510" y="402" text-anchor="middle">负序</text><text x="660" y="402" text-anchor="middle">亮</text><text x="780" y="402" text-anchor="middle" fill="#a0aec0">灭</text><text x="885" y="402" text-anchor="middle" fill="#c53030">亮红</text>
      <text x="140" y="428">负序（UWV）</text><text x="330" y="428" text-anchor="middle">相序1（直通）</text><text x="510" y="428" text-anchor="middle">负序</text><text x="660" y="428" text-anchor="middle">亮</text><text x="780" y="428" text-anchor="middle" fill="#a0aec0">灭</text><text x="885" y="428" text-anchor="middle" fill="#c53030">亮红</text>
      <text x="140" y="454">负序（UWV）</text><text x="330" y="454" text-anchor="middle">相序2（换相）</text><text x="510" y="454" text-anchor="middle">正序</text><text x="660" y="454" text-anchor="middle">亮</text><text x="780" y="454" text-anchor="middle" fill="#2f855a">亮绿</text><text x="885" y="454" text-anchor="middle" fill="#a0aec0">灭</text>
    </g>
  </g>
  <text x="40" y="500" font-size="12" fill="#718096">注：进线无电或相序开关在 OFF 档时，三灯中仅"电源灯"随进线通断，正/负序灯全部熄灭。</text>
</svg>
