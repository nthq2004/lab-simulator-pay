<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="540" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2a33">图 6　RIP：以「跳数」为度量的距离向量路由</text>

  <!-- 路由器 -->
  <rect x="70" y="120" width="200" height="90" rx="12" fill="#e8f1fb" stroke="#1395eb" stroke-width="2"/>
  <text x="170" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b5c94">L3SW1</text>
  <text x="170" y="174" text-anchor="middle" font-size="12" fill="#2b6f9c">直连：192.168.10.0/24</text>
  <text x="170" y="194" text-anchor="middle" font-size="12" fill="#2b6f9c">　　　192.168.20.0/24</text>

  <rect x="350" y="120" width="200" height="90" rx="12" fill="#e8f1fb" stroke="#1395eb" stroke-width="2"/>
  <text x="450" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b5c94">R1 出口路由器</text>
  <text x="450" y="174" text-anchor="middle" font-size="12" fill="#2b6f9c">直连：10.10.10.0/30</text>
  <text x="450" y="194" text-anchor="middle" font-size="12" fill="#2b6f9c">　　　100.64.0.0/30</text>

  <rect x="630" y="120" width="200" height="90" rx="12" fill="#e8f1fb" stroke="#1395eb" stroke-width="2"/>
  <text x="730" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b5c94">R2 互联网路由器</text>
  <text x="730" y="174" text-anchor="middle" font-size="12" fill="#2b6f9c">直连：100.64.0.0/30</text>
  <text x="730" y="194" text-anchor="middle" font-size="12" fill="#2b6f9c">　　　203.0.113.0/24</text>

  <line x1="270" y1="165" x2="350" y2="165" stroke="#7a8b99" stroke-width="2"/>
  <line x1="550" y1="165" x2="630" y2="165" stroke="#7a8b99" stroke-width="2"/>

  <!-- 广播通告 -->
  <path d="M730 214 C 730 250, 450 250, 450 214" stroke="#e67e22" stroke-width="2" fill="none" marker-end="url(#m2)"/>
  <text x="590" y="272" text-anchor="middle" font-size="12" fill="#c07a2e">R2 每 30 秒向邻居通告自己的直连网段</text>
  <path d="M350 214 C 350 300, 170 300, 170 214" stroke="#e67e22" stroke-width="2" fill="none" marker-end="url(#m2)"/>
  <text x="200" y="330" text-anchor="middle" font-size="12" fill="#c07a2e">R1 收到后加 1 跳再通告给 L3SW1</text>

  <defs>
    <marker id="m2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e67e22"/>
    </marker>
  </defs>

  <!-- 学习结果 -->
  <rect x="120" y="352" width="660" height="150" rx="10" fill="#f7f9fb" stroke="#4a5a68"/>
  <text x="450" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#33424f">L3SW1 学到的 RIP 路由（display ip routing-table protocol rip）</text>
  <text x="160" y="406" font-size="12" fill="#33424f">Destination/Mask</text>
  <text x="330" y="406" font-size="12" fill="#33424f">Proto</text>
  <text x="410" y="406" font-size="12" fill="#33424f">Metric</text>
  <text x="490" y="406" font-size="12" fill="#33424f">NextHop</text>
  <text x="640" y="406" font-size="12" fill="#33424f">Interface</text>
  <line x1="150" y1="414" x2="750" y2="414" stroke="#c8d2da"/>
  <text x="160" y="438" font-size="12" fill="#0d7a56">100.64.0.0/30</text>
  <text x="330" y="438" font-size="12" fill="#c07a2e">RIP</text>
  <text x="410" y="438" font-size="12" fill="#33424f">1</text>
  <text x="490" y="438" font-size="12" fill="#33424f">10.10.10.2</text>
  <text x="640" y="438" font-size="12" fill="#33424f">Vlanif100</text>
  <text x="160" y="464" font-size="12" fill="#0d7a56">203.0.113.0/24</text>
  <text x="330" y="464" font-size="12" fill="#c07a2e">RIP</text>
  <text x="410" y="464" font-size="12" fill="#33424f">2</text>
  <text x="490" y="464" font-size="12" fill="#33424f">10.10.10.2</text>
  <text x="640" y="464" font-size="12" fill="#33424f">Vlanif100</text>
  <text x="450" y="492" text-anchor="middle" font-size="11" fill="#5b6b7a">跳数越小越优；最大 15 跳，16 跳表示不可达。管理距离（Pre）为 100。</text>
</svg>
