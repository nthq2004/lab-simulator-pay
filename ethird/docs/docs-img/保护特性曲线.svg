<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Microsoft YaHei,SimHei,sans-serif">
  <rect width="900" height="540" fill="#f7f9fc"/>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a3a5c">塑壳式断路器保护特性（反时限 + 短路瞬时）</text>

  <!-- 瞬时脱扣区（I ≥ 5×In） -->
  <rect x="569" y="60" width="211" height="400" fill="#fdecea"/>
  <text x="674" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">短路瞬时脱扣区（≥5×In）</text>

  <!-- 网格 -->
  <g stroke="#d5dbe3" stroke-width="1">
    <line x1="80" y1="60" x2="780" y2="60"/><line x1="80" y1="160" x2="780" y2="160"/>
    <line x1="80" y1="260" x2="780" y2="260"/><line x1="80" y1="360" x2="780" y2="360"/>
    <line x1="80" y1="460" x2="780" y2="460"/>
    <line x1="135" y1="60" x2="135" y2="460"/><line x1="291" y1="60" x2="291" y2="460"/>
    <line x1="569" y1="60" x2="569" y2="460"/><line x1="780" y1="60" x2="780" y2="460"/>
  </g>
  <!-- 坐标轴 -->
  <line x1="80" y1="460" x2="790" y2="460" stroke="#33475b" stroke-width="2"/>
  <line x1="80" y1="52" x2="80" y2="460" stroke="#33475b" stroke-width="2"/>

  <!-- 轴标注 -->
  <g font-size="12" fill="#33475b">
    <text x="784" y="478">I/In（对数）</text>
    <text x="14" y="52">t/s</text>
    <text x="80" y="478" text-anchor="middle">1</text>
    <text x="135" y="478" text-anchor="middle">1.2</text>
    <text x="291" y="478" text-anchor="middle">2</text>
    <text x="569" y="478" text-anchor="middle">5</text>
    <text x="780" y="478" text-anchor="middle">10</text>
    <text x="70" y="64" text-anchor="end">100</text>
    <text x="70" y="164" text-anchor="end">10</text>
    <text x="70" y="264" text-anchor="end">1</text>
    <text x="70" y="364" text-anchor="end">0.1</text>
    <text x="70" y="464" text-anchor="end">0.01</text>
  </g>

  <!-- 反时限曲线 -->
  <polyline fill="none" stroke="#1f6fb2" stroke-width="3.5"
    points="135.4,129.9 159.8,156.5 182.3,181.2 203.3,204.1 222.9,225.5 241.3,245.7 258.7,264.7 275.1,282.7 290.7,299.8 358.6,331.5 414.0,357.5 460.9,379.2 501.4,398.2 537.2,415.0 569.3,429.9"/>

  <!-- 三个整定点 -->
  <circle cx="135.4" cy="129.9" r="6" fill="#e67e22" stroke="#a05a10" stroke-width="2"/>
  <circle cx="290.7" cy="299.8" r="6" fill="#e67e22" stroke="#a05a10" stroke-width="2"/>
  <circle cx="569.3" cy="429.9" r="6" fill="#c0392b" stroke="#7a1a12" stroke-width="2"/>

  <g font-size="13" font-weight="bold">
    <text x="150" y="126" fill="#a05a10">1.2×In → 约 20s（过载起始）</text>
    <text x="305" y="296" fill="#a05a10">2×In → 约 0.4s</text>
    <text x="470" y="446" fill="#c0392b">≥5×In → 瞬时（电磁脱扣）</text>
  </g>

  <text x="450" y="516" text-anchor="middle" font-size="12" fill="#7a8290">额定电流 In = 100A；1.2~5 倍之间按对数-对数反时限动作，5 倍以上由电磁脱扣器瞬时动作</text>
</svg>
