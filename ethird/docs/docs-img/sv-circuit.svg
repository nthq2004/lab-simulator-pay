<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="sans-serif" font-size="14">
  <rect width="640" height="420" fill="#f6f8f9"/>
  <g stroke="#222" stroke-width="2" fill="none">
    <!-- 主回路：+24V → 电磁阀线圈 → 三极管集电极 -->
    <line x1="110" y1="60" x2="110" y2="110"/>
    <rect x="90" y="110" width="40" height="26" fill="#fff"/>
    <line x1="110" y1="136" x2="110" y2="190"/>
    <line x1="110" y1="190" x2="372" y2="190"/>
    <line x1="372" y1="190" x2="372" y2="225"/>
    <!-- 三极管 Q1（NPN） -->
    <circle cx="360" cy="250" r="34" fill="#fff"/>
    <line x1="350" y1="232" x2="350" y2="268" stroke-width="3"/>
    <line x1="350" y1="242" x2="372" y2="225"/>
    <line x1="350" y1="258" x2="372" y2="272"/>
    <!-- 发射极 → 接地 -->
    <line x1="372" y1="272" x2="372" y2="380"/>
    <line x1="347" y1="380" x2="397" y2="380"/>
    <line x1="354" y1="387" x2="390" y2="387"/>
    <line x1="361" y1="394" x2="383" y2="394"/>
    <!-- 控制回路：+3V → SB → RL → 三极管基极 -->
    <line x1="118" y1="330" x2="150" y2="330"/>
    <line x1="150" y1="330" x2="188" y2="316"/>
    <circle cx="192" cy="330" r="3" fill="#222" stroke="none"/>
    <line x1="192" y1="330" x2="230" y2="330"/>
    <rect x="230" y="322" width="70" height="16" fill="#d8cf9f"/>
    <line x1="300" y1="330" x2="310" y2="330"/>
    <line x1="310" y1="330" x2="310" y2="250"/>
    <line x1="310" y1="250" x2="350" y2="250"/>
    <!-- 电磁阀符号（虚线联动，上下为管路口） -->
    <line x1="130" y1="123" x2="163" y2="123" stroke="#888" stroke-dasharray="4 3"/>
    <polygon points="165,95 215,95 190,123"/>
    <polygon points="190,123 215,151 165,151"/>
    <line x1="190" y1="95" x2="190" y2="74"/>
    <line x1="190" y1="151" x2="190" y2="172"/>
  </g>
  <!-- NPN 发射极箭头 -->
  <polygon points="366,268 375,273 372,262" fill="#222"/>
  <!-- 电位端子 -->
  <g fill="#e8b339" stroke="#333" stroke-width="2">
    <circle cx="110" cy="52" r="8"/>
    <circle cx="110" cy="330" r="8"/>
  </g>
  <g font-weight="bold" fill="#8a5a00">
    <text x="124" y="57">+24V</text>
    <text x="124" y="335">+3V</text>
  </g>
  <g fill="#555">
    <text x="56" y="128">SV</text>
    <text x="118" y="160" font-size="12">500Ω</text>
    <text x="198" y="82" font-size="12">上管路口</text>
    <text x="198" y="176" font-size="12">下管路口</text>
    <text x="390" y="243">Q1</text>
    <text x="232" y="356">RL 1kΩ</text>
    <text x="150" y="308">SB</text>
    <text x="404" y="385">GND</text>
  </g>
</svg>
