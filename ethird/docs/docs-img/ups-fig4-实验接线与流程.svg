<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1120" height="780" fill="#fbfcfe"/>
  <text x="560" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f3b57">图4  UPS 实验接线与操作流程</text>

  <defs>
    <marker id="w" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/></marker>
    <marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3b6ea5"/></marker>
  </defs>

  <!-- ===== 接线图 ===== -->
  <rect x="20" y="52" width="1080" height="400" rx="10" fill="#f8fafc" stroke="#d5dbe2" stroke-width="1.5"/>
  <text x="40" y="80" font-size="15" font-weight="bold" fill="#1f3b57">主电网与 UPS 接线（自动接线接通主回路，UPS 电源输入由学生手动连接）</text>

  <!-- 同步发电机 -->
  <rect x="40" y="170" width="170" height="100" rx="10" fill="#eef4fb" stroke="#3b6ea5" stroke-width="2"/>
  <text x="125" y="210" text-anchor="middle" font-size="15" fill="#1f3b57">同步发电机</text>
  <text x="125" y="234" text-anchor="middle" font-size="11" fill="#5b6b7c">AC 400V / 50Hz</text>
  <text x="125" y="254" text-anchor="middle" font-size="11" fill="#5b6b7c">（默认遥控模式）</text>

  <!-- 主开关 -->
  <rect x="270" y="170" width="150" height="100" rx="10" fill="#fff" stroke="#3b6ea5" stroke-width="2"/>
  <text x="345" y="205" text-anchor="middle" font-size="15" fill="#1f3b57">主开关 QF1</text>
  <text x="345" y="228" text-anchor="middle" font-size="11" fill="#5b6b7c">失压脱扣 / 储能</text>
  <text x="345" y="248" text-anchor="middle" font-size="11" fill="#5b6b7c">遥控合闸 / 分闸</text>

  <!-- 汇流排 -->
  <rect x="480" y="160" width="100" height="120" rx="10" fill="#eef4fb" stroke="#3b6ea5" stroke-width="2"/>
  <text x="530" y="212" text-anchor="middle" font-size="15" fill="#1f3b57">汇流排</text>
  <text x="530" y="234" text-anchor="middle" font-size="11" fill="#5b6b7c">三相母线</text>

  <!-- UPS -->
  <rect x="700" y="140" width="240" height="190" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2.5"/>
  <text x="820" y="176" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e6b3a">UPS 不间断电源</text>
  <text x="820" y="202" text-anchor="middle" font-size="12" fill="#2e8b57">额定 2000W　输入 AC220V</text>
  <line x1="720" y1="216" x2="920" y2="216" stroke="#9cc9ac" stroke-width="1"/>
  <text x="820" y="242" text-anchor="middle" font-size="12" fill="#1e6b3a">整流器 · 逆变器 · 静态开关</text>
  <text x="820" y="266" text-anchor="middle" font-size="12" fill="#1e6b3a">蓄电池组（216V）· 旁路开关</text>
  <text x="820" y="294" text-anchor="middle" font-size="12" fill="#a8670a">输入开关 / 电池开关 / 输出开关 / 负载开关</text>
  <text x="820" y="316" text-anchor="middle" font-size="11" fill="#8e44ad">LCD + LINE / BATTERY / BYPASS / FAULT 指示灯</text>

  <!-- 接地 -->
  <rect x="700" y="380" width="150" height="52" rx="8" fill="#f2f4f8" stroke="#7f8c8d" stroke-width="2"/>
  <text x="775" y="412" text-anchor="middle" font-size="13" fill="#4a5560">保护接地</text>

  <!-- 负载 -->
  <rect x="985" y="150" width="110" height="62" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="1040" y="178" text-anchor="middle" font-size="13" fill="#a93226">负载灯 1</text>
  <text x="1040" y="197" text-anchor="middle" font-size="10" fill="#a93226">≈1000W</text>
  <rect x="985" y="265" width="110" height="62" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="1040" y="293" text-anchor="middle" font-size="13" fill="#a93226">负载灯 2</text>
  <text x="1040" y="312" text-anchor="middle" font-size="10" fill="#a93226">≈2000W</text>

  <!-- 控制电源 -->
  <rect x="270" y="60" width="150" height="56" rx="8" fill="#f2f4f8" stroke="#7f8c8d" stroke-width="2"/>
  <text x="345" y="84" text-anchor="middle" font-size="12" fill="#4a5560">DC24V 控制电源</text>
  <text x="345" y="103" text-anchor="middle" font-size="10" fill="#7f8c8d">脱扣 / 储能 / 控制</text>

  <!-- 遥控面板 -->
  <rect x="40" y="360" width="180" height="86" rx="10" fill="#eef4fb" stroke="#3b6ea5" stroke-width="2"/>
  <text x="130" y="392" text-anchor="middle" font-size="14" fill="#1f3b57">发电机组遥控面板</text>
  <text x="130" y="414" text-anchor="middle" font-size="11" fill="#5b6b7c">起动 / 停止 / 合闸 / 分闸 / 调速</text>

  <!-- 连线 -->
  <g stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#w)">
    <line x1="210" y1="200" x2="268" y2="200"/>
    <line x1="210" y1="220" x2="268" y2="220"/>
    <line x1="210" y1="240" x2="268" y2="240"/>
    <line x1="420" y1="200" x2="478" y2="200"/>
    <line x1="420" y1="220" x2="478" y2="220"/>
    <line x1="420" y1="240" x2="478" y2="240"/>
  </g>
  <text x="220" y="185" font-size="10" fill="#c0392b">U V W</text>
  <text x="430" y="185" font-size="10" fill="#c0392b">L1 L2 L3</text>

  <!-- 汇流排 -> UPS 输入 L -->
  <path d="M580 200 L700 200" stroke="#c0392b" stroke-width="3.5" fill="none" marker-end="url(#w)"/>
  <text x="586" y="190" font-size="11.5" fill="#c0392b">汇流排第 5 接口 A 相 → 输入 L (in_p)</text>
  <text x="586" y="216" font-size="10" fill="#a93226">（不纳入自动接线，需手动连接）</text>

  <!-- 接地 -> UPS 输入 N -->
  <path d="M775 380 L775 332" stroke="#c0392b" stroke-width="3.5" fill="none" marker-end="url(#w)"/>
  <text x="782" y="360" font-size="11.5" fill="#c0392b">输入 N (in_n) 接地</text>

  <!-- UPS 输出 -> 负载 -->
  <g stroke="#c0392b" stroke-width="3.5" fill="none" marker-end="url(#w)">
    <line x1="940" y1="181" x2="983" y2="181"/>
    <line x1="940" y1="296" x2="983" y2="296"/>
  </g>
  <text x="944" y="172" font-size="10" fill="#c0392b">out1</text>
  <text x="944" y="288" font-size="10" fill="#c0392b">out2</text>

  <!-- DC24 / 遥控 控制虚线 -->
  <g stroke="#3b6ea5" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#c)">
    <line x1="345" y1="116" x2="345" y2="168"/>
    <path d="M220 403 L345 403 L345 272"/>
  </g>
  <text x="352" y="140" font-size="10" fill="#3b6ea5">控制电源</text>
  <text x="228" y="420" font-size="10" fill="#3b6ea5">遥控命令</text>

  <!-- ===== 操作流程 ===== -->
  <rect x="20" y="470" width="1080" height="290" rx="10" fill="#f8fafc" stroke="#d5dbe2" stroke-width="1.5"/>
  <text x="40" y="498" font-size="15" font-weight="bold" fill="#1f3b57">实验流程（对应仿真"2. UPS起动与模式切换"9 个步骤）</text>

  <g font-size="11.5" text-anchor="middle">
    <g>
      <rect x="34" y="520" width="108" height="96" rx="8" fill="#eef4fb" stroke="#3b6ea5" stroke-width="1.5"/>
      <circle cx="54" cy="542" r="12" fill="#3b6ea5"/><text x="54" y="547" fill="#fff" font-size="13">1</text>
      <text x="88" y="547" fill="#1f3b57">自动接线</text>
      <text x="88" y="570" fill="#5b6b7c">接通主电网</text>
      <text x="88" y="590" fill="#5b6b7c">UPS 输入除外</text>
    </g>
    <g>
      <rect x="154" y="520" width="108" height="96" rx="8" fill="#e8f6ec" stroke="#2e8b57" stroke-width="1.5"/>
      <circle cx="174" cy="542" r="12" fill="#2e8b57"/><text x="174" y="547" fill="#fff" font-size="13">2</text>
      <text x="208" y="547" fill="#1e6b3a">UPS 接线</text>
      <text x="208" y="570" fill="#5b6b7c">L 接 A 相</text>
      <text x="208" y="590" fill="#5b6b7c">N 接地</text>
    </g>
    <g>
      <rect x="274" y="520" width="108" height="96" rx="8" fill="#e8f6ec" stroke="#2e8b57" stroke-width="1.5"/>
      <circle cx="294" cy="542" r="12" fill="#2e8b57"/><text x="294" y="547" fill="#fff" font-size="13">3</text>
      <text x="328" y="547" fill="#1e6b3a">起动/合闸</text>
      <text x="328" y="570" fill="#5b6b7c">遥控起动发电机</text>
      <text x="328" y="590" fill="#5b6b7c">储能后合闸主开关</text>
    </g>
    <g>
      <rect x="394" y="520" width="108" height="96" rx="8" fill="#e8f6ec" stroke="#2e8b57" stroke-width="1.5"/>
      <circle cx="414" cy="542" r="12" fill="#2e8b57"/><text x="414" y="547" fill="#fff" font-size="13">4</text>
      <text x="448" y="547" fill="#1e6b3a">合电池/输出</text>
      <text x="448" y="570" fill="#5b6b7c">电池开关</text>
      <text x="448" y="590" fill="#5b6b7c">输出开关</text>
    </g>
    <g>
      <rect x="514" y="520" width="108" height="96" rx="8" fill="#fff6e5" stroke="#d98e00" stroke-width="1.5"/>
      <circle cx="534" cy="542" r="12" fill="#d98e00"/><text x="534" y="547" fill="#fff" font-size="13">5</text>
      <text x="568" y="547" fill="#a8670a">长按 ON</text>
      <text x="568" y="570" fill="#5b6b7c">旁通→自检</text>
      <text x="568" y="590" fill="#5b6b7c">→在线 LINE</text>
    </g>
    <g>
      <rect x="634" y="520" width="108" height="96" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
      <circle cx="654" cy="542" r="12" fill="#c0392b"/><text x="654" y="547" fill="#fff" font-size="13">6</text>
      <text x="688" y="547" fill="#a93226">切断交流</text>
      <text x="688" y="570" fill="#5b6b7c">转电池模式</text>
      <text x="688" y="590" fill="#5b6b7c">负载不断电</text>
    </g>
    <g>
      <rect x="754" y="520" width="108" height="96" rx="8" fill="#eef4fb" stroke="#3b6ea5" stroke-width="1.5"/>
      <circle cx="774" cy="542" r="12" fill="#3b6ea5"/><text x="774" y="547" fill="#fff" font-size="13">7</text>
      <text x="808" y="547" fill="#1f3b57">恢复交流</text>
      <text x="808" y="570" fill="#5b6b7c">自动返回</text>
      <text x="808" y="590" fill="#5b6b7c">在线 LINE</text>
    </g>
    <g>
      <rect x="874" y="520" width="108" height="96" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
      <circle cx="894" cy="542" r="12" fill="#c0392b"/><text x="894" y="547" fill="#fff" font-size="13">8</text>
      <text x="928" y="547" fill="#a93226">双路负载</text>
      <text x="928" y="570" fill="#5b6b7c">约3000W 过载</text>
      <text x="928" y="590" fill="#5b6b7c">转旁路 BYPASS</text>
    </g>
    <g>
      <rect x="994" y="520" width="100" height="96" rx="8" fill="#f2f4f8" stroke="#7f8c8d" stroke-width="1.5"/>
      <circle cx="1014" cy="542" r="12" fill="#7f8c8d"/><text x="1014" y="547" fill="#fff" font-size="13">9</text>
      <text x="1044" y="547" fill="#4a5560">知识测试</text>
      <text x="1044" y="574" fill="#5b6b7c">工作模式</text>
    </g>
  </g>
  <g stroke="#9aa5b1" stroke-width="2" fill="none" marker-end="url(#c)">
    <line x1="142" y1="568" x2="153" y2="568"/>
    <line x1="262" y1="568" x2="273" y2="568"/>
    <line x1="382" y1="568" x2="393" y2="568"/>
    <line x1="502" y1="568" x2="513" y2="568"/>
    <line x1="622" y1="568" x2="633" y2="568"/>
    <line x1="742" y1="568" x2="753" y2="568"/>
    <line x1="862" y1="568" x2="873" y2="568"/>
    <line x1="982" y1="568" x2="993" y2="568"/>
  </g>
</svg>
