<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="980" height="620" fill="#fbfcfe"/>
  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f3b57">图3  UPS 工作模式与切换条件</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3b6ea5"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d98e00"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/></marker>
  </defs>

  <!-- OFF -->
  <rect x="70" y="110" width="160" height="70" rx="12" fill="#f2f4f8" stroke="#7f8c8d" stroke-width="2"/>
  <text x="150" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a5560">关机 OFF</text>
  <text x="150" y="168" text-anchor="middle" font-size="11" fill="#7f8c8d">指示灯全灭</text>

  <!-- BYPASS -->
  <rect x="400" y="110" width="180" height="70" rx="12" fill="#eef4fb" stroke="#3b6ea5" stroke-width="2"/>
  <text x="490" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3b57">旁路模式 BYPASS</text>
  <text x="490" y="168" text-anchor="middle" font-size="11" fill="#3b6ea5">BYPASS 灯亮</text>

  <!-- NORMAL -->
  <rect x="740" y="110" width="180" height="70" rx="12" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="830" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e6b3a">在线模式 LINE</text>
  <text x="830" y="168" text-anchor="middle" font-size="11" fill="#2e8b57">LINE 灯亮</text>

  <!-- BATTERY -->
  <rect x="740" y="330" width="180" height="70" rx="12" fill="#fff6e5" stroke="#d98e00" stroke-width="2"/>
  <text x="830" y="366" text-anchor="middle" font-size="16" font-weight="bold" fill="#a8670a">电池模式 BATTERY</text>
  <text x="830" y="388" text-anchor="middle" font-size="11" fill="#a8670a">BATTERY 灯亮</text>

  <!-- FAULT -->
  <rect x="400" y="330" width="180" height="70" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="490" y="366" text-anchor="middle" font-size="16" font-weight="bold" fill="#a93226">故障 FAULT</text>
  <text x="490" y="388" text-anchor="middle" font-size="11" fill="#c0392b">FAULT 灯亮，无输出</text>

  <!-- 连线 -->
  <g stroke="#3b6ea5" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <!-- 关机 -> 旁路 -->
    <line x1="230" y1="135" x2="398" y2="135"/>
    <!-- 旁路 -> 在线 -->
    <line x1="580" y1="130" x2="738" y2="130"/>
    <!-- 在线 -> 旁路（过载/故障） -->
    <path d="M740 160 C 660 160, 640 175, 580 165" marker-end="url(#a)"/>
    <!-- 旁路 -> 故障（输入消失且无电池？此处为输入恢复 f: fault->bypass） -->
  </g>
  <g stroke="#d98e00" stroke-width="2.5" fill="none" marker-end="url(#ao)">
    <!-- 在线 -> 电池 -->
    <line x1="800" y1="180" x2="800" y2="328"/>
    <!-- 电池 -> 在线 -->
    <line x1="860" y1="330" x2="860" y2="182"/>
  </g>
  <g stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#ar)">
    <!-- 电池 -> 故障 -->
    <line x1="740" y1="365" x2="582" y2="365"/>
    <!-- 故障 -> 旁路 -->
    <path d="M490 330 C 490 270, 490 240, 490 182" marker-end="url(#ar)"/>
  </g>

  <!-- 标签 -->
  <g font-size="12.5" fill="#4a5560">
    <text x="238" y="126">长按 ON 起动</text>
    <text x="600" y="121">整流/逆变自检完成（约17s）</text>
    <text x="596" y="192" fill="#1f3b57">过载&gt;105%持续2s 或故障</text>
    <text x="806" y="256" fill="#a8670a">输入失电（&lt;150V）</text>
    <text x="868" y="256" fill="#a8670a">输入恢复</text>
    <text x="600" y="358" fill="#c0392b">无输入且电池耗尽（SOC=0）</text>
    <text x="500" y="250" fill="#c0392b">输入恢复 → 旁路供电</text>
    <text x="150" y="230" fill="#4a5560">长按 OFF（关机时序）</text>
    <text x="150" y="248" font-size="11" fill="#7f8c8d">（任一模态均可关机）</text>
  </g>

  <!-- 关机返回线 -->
  <g stroke="#7f8c8d" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#a)">
    <path d="M650 400 C 300 480, 150 320, 150 182"/>
  </g>

  <!-- 说明 -->
  <rect x="70" y="470" width="850" height="120" rx="10" fill="#f7f9fc" stroke="#d5dbe2" stroke-width="1.5"/>
  <text x="90" y="498" font-size="14" font-weight="bold" fill="#1f3b57">切换要点</text>
  <text x="90" y="524" font-size="13" fill="#4a5560">· 起动过程：长按 ON → 先经旁路供电（约10s）→ 整流器、逆变器依次自检 → 转入在线（LINE），全程输出不中断。</text>
  <text x="90" y="548" font-size="13" fill="#4a5560">· 在线⇄电池：市电失电转电池（BATTERY），市电恢复自动返回在线；两种模式均由逆变器供电，负载不断电。</text>
  <text x="90" y="572" font-size="13" fill="#4a5560">· 过载保护：负载率&gt;105% 持续约 2s，UPS 转入旁路（BYPASS），市电经旁路直通供电，保护逆变器。</text>
</svg>
