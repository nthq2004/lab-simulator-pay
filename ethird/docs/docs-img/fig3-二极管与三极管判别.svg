<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect x="0" y="0" width="980" height="660" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2d3d">图3  二极管与三极管引脚的万用表判别</text>

  <!-- ========== (a) 二极管 ========== -->
  <rect x="30" y="58" width="450" height="574" rx="10" fill="#fbfcfe" stroke="#bcd4ea"/>
  <text x="255" y="88" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2d3d">（a）二极管：判别正、负极</text>

  <!-- 符号 -->
  <g transform="translate(105,140)" stroke="#22313f" stroke-width="3" fill="none">
    <line x1="0" y1="0" x2="55" y2="0"/><line x1="105" y1="0" x2="160" y2="0"/>
    <path d="M55 -26 L55 26 L105 0 Z" fill="#eef3f8"/>
    <line x1="105" y1="-26" x2="105" y2="26"/>
  </g>
  <text x="145" y="120" text-anchor="middle" font-size="13" fill="#666">阳极 A（正）</text>
  <text x="245" y="120" text-anchor="middle" font-size="13" fill="#666">阴极 K（负）</text>

  <!-- 正向 -->
  <g>
    <text x="60" y="205" font-size="14" font-weight="bold" fill="#2d862d">① 黑笔→阳极，红笔→阴极：正向导通（阻值小）</text>
    <line x1="70" y1="250" x2="170" y2="250" stroke="#111" stroke-width="5" stroke-linecap="round"/>
    <line x1="250" y1="250" x2="350" y2="250" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
    <rect x="170" y="230" width="80" height="40" fill="#eef3f8" stroke="#22313f" stroke-width="3"/>
    <text x="115" y="278" text-anchor="middle" font-size="12" fill="#111">黑(COM)</text>
    <text x="305" y="278" text-anchor="middle" font-size="12" fill="#c0392b">红(VΩ)</text>
  </g>

  <!-- 反向 -->
  <g>
    <text x="60" y="340" font-size="14" font-weight="bold" fill="#a00">② 红笔→阳极，黑笔→阴极：反向截止（∞）</text>
    <line x1="70" y1="385" x2="170" y2="385" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
    <line x1="250" y1="385" x2="350" y2="385" stroke="#111" stroke-width="5" stroke-linecap="round"/>
    <rect x="170" y="365" width="80" height="40" fill="#eef3f8" stroke="#22313f" stroke-width="3"/>
    <text x="115" y="413" text-anchor="middle" font-size="12" fill="#c0392b">红(VΩ)</text>
    <text x="305" y="413" text-anchor="middle" font-size="12" fill="#111">黑(COM)</text>
  </g>

  <text x="255" y="490" text-anchor="middle" font-size="14" fill="#1f2d3d">结论：阻值小的一次，黑表笔（表内电池正极）所接为阳极（正极），</text>
  <text x="255" y="514" text-anchor="middle" font-size="14" fill="#1f2d3d">红表笔所接为阴极（负极）。</text>
  <text x="255" y="560" text-anchor="middle" font-size="13" fill="#888">硅二极管正向压降约 0.6～0.7V，可用数字表二极管档直接读出。</text>

  <!-- ========== (b) 三极管 ========== -->
  <rect x="500" y="58" width="450" height="574" rx="10" fill="#fbfcfe" stroke="#bcd4ea"/>
  <text x="725" y="88" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2d3d">（b）三极管：判别基极、类型与 C/E</text>

  <!-- TO-92 示意图 -->
  <g>
    <path d="M690 130 Q725 118 760 130 L760 178 L690 178 Z" fill="#2a2a2a" stroke="#555"/>
    <line x1="650" y1="178" x2="650" y2="228" stroke="#aab3bb" stroke-width="5"/>
    <line x1="725" y1="178" x2="725" y2="228" stroke="#aab3bb" stroke-width="5"/>
    <line x1="800" y1="178" x2="800" y2="228" stroke="#aab3bb" stroke-width="5"/>
    <text x="650" y="252" text-anchor="middle" font-size="13" fill="#333">左端</text>
    <text x="725" y="252" text-anchor="middle" font-size="13" fill="#333">中端</text>
    <text x="800" y="252" text-anchor="middle" font-size="13" fill="#333">右端</text>
  </g>

  <text x="725" y="300" text-anchor="middle" font-size="14" fill="#1f2d3d">① 黑笔接中端，红笔分别接左端、右端：</text>
  <text x="725" y="324" text-anchor="middle" font-size="14" fill="#2d862d">两次阻值都小 → 中端是基极，且为 NPN 型</text>

  <text x="725" y="372" text-anchor="middle" font-size="14" fill="#1f2d3d">② 判别集电极 C / 发射极 E（黑笔接基极）：</text>
  <text x="725" y="396" text-anchor="middle" font-size="13" fill="#333">黑笔接基极并与某一极短接、红笔接另一极，</text>
  <text x="725" y="418" text-anchor="middle" font-size="13" fill="#2d862d">指针偏转较大（阻值较小）时，黑笔所接为集电极 C，</text>
  <text x="725" y="440" text-anchor="middle" font-size="13" fill="#2d862d">另一极为发射极 E。</text>

  <text x="725" y="500" text-anchor="middle" font-size="13" fill="#888">三极管可看作两个背靠背的 PN 结（B-E、B-C）：</text>
  <text x="725" y="522" text-anchor="middle" font-size="13" fill="#888">黑笔接基极时两结均正向导通者为 NPN，反之为 PNP。</text>
  <text x="725" y="560" text-anchor="middle" font-size="13" fill="#888">门极/基极是公共端，集电极与发射极之间不可简单互换。</text>
</svg>
