<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Microsoft YaHei, sans-serif" font-size="14">
  <defs>
    <marker id="ar1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a5568"/>
    </marker>
    <marker id="ar1b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#c05621"/>
    </marker>
    <marker id="ar1g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#2f855a"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a202c">岸电接入系统组成图</text>

  <!-- 分栏标题 -->
  <text x="40" y="62" font-size="15" font-weight="bold" fill="#2b6cb0">船电侧</text>
  <line x1="40" y1="72" x2="330" y2="72" stroke="#2b6cb0" stroke-width="2"/>
  <text x="660" y="62" font-size="15" font-weight="bold" fill="#c05621">岸电侧</text>
  <line x1="660" y1="72" x2="960" y2="72" stroke="#c05621" stroke-width="2"/>

  <!-- 船电侧 -->
  <g text-anchor="middle">
    <rect x="40" y="90" width="270" height="58" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="175" y="114" font-weight="bold">1# 同步发电机 gen1</text>
    <text x="175" y="136" font-size="12" fill="#4a5568">80kW / 400V / 50Hz</text>

    <rect x="40" y="182" width="270" height="58" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="175" y="206" font-weight="bold">船电主开关 qf1</text>
    <text x="175" y="228" font-size="11.5" fill="#4a5568">含失压脱扣线圈 + 常闭辅助触头</text>

    <rect x="40" y="420" width="270" height="56" rx="8" fill="#f0f5ff" stroke="#5a67d8" stroke-width="2"/>
    <text x="175" y="444" font-weight="bold">发电机组遥控面板 genpanel</text>
    <text x="175" y="464" font-size="12" fill="#4a5568">起动 / 停止 / 合闸 / 分闸 / 调速</text>
  </g>

  <!-- 汇流排 -->
  <rect x="370" y="90" width="26" height="300" rx="5" fill="#f6e05e" stroke="#975a16" stroke-width="2"/>
  <text x="383" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#744210">汇流排 bus1</text>

  <!-- 负载 -->
  <g text-anchor="middle">
    <rect x="440" y="90" width="180" height="70" rx="8" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
    <text x="530" y="116" font-weight="bold">照明负载</text>
    <text x="530" y="138" font-size="12" fill="#4a5568">bl1 / bl2 / bl3（星形接法）</text>
  </g>

  <!-- 岸电侧 -->
  <g text-anchor="middle">
    <rect x="660" y="90" width="300" height="56" rx="8" fill="#fff5eb" stroke="#c05621" stroke-width="2"/>
    <text x="810" y="114" font-weight="bold">岸电输入三相电源 shore_in</text>
    <text x="810" y="136" font-size="12" fill="#4a5568">U / V / W / N　220V · 50Hz</text>

    <rect x="660" y="160" width="300" height="78" rx="8" fill="#fff5eb" stroke="#c05621" stroke-width="2"/>
    <text x="810" y="184" font-weight="bold">岸电箱 shorebox1</text>
    <text x="810" y="204" font-size="12" fill="#4a5568">相序指示灯 · 相序转换开关</text>
    <text x="810" y="224" font-size="12" fill="#4a5568">出口空气开关 · 液晶显示</text>

    <rect x="660" y="252" width="300" height="56" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
    <text x="810" y="276" font-weight="bold">负序继电器 neg1</text>
    <text x="810" y="296" font-size="12" fill="#4a5568">监测输出相序 · 常闭触点串入互锁回路</text>

    <rect x="660" y="322" width="300" height="56" rx="8" fill="#fff5eb" stroke="#c05621" stroke-width="2"/>
    <text x="810" y="346" font-weight="bold">岸电主开关 pdb1</text>
    <text x="810" y="366" font-size="11.5" fill="#4a5568">含失压脱扣线圈 + 常闭辅助触头</text>
  </g>

  <!-- 船电主回路连线 -->
  <g stroke="#4a5568" stroke-width="2.2" fill="none" marker-end="url(#ar1)">
    <line x1="175" y1="148" x2="175" y2="180"/>
    <line x1="310" y1="211" x2="368" y2="211"/>
    <line x1="396" y1="125" x2="438" y2="125"/>
  </g>

  <!-- 岸电回路连线 -->
  <g stroke="#c05621" stroke-width="2.4" fill="none" marker-end="url(#ar1b)">
    <line x1="810" y1="146" x2="810" y2="158"/>
    <line x1="810" y1="238" x2="810" y2="250"/>
    <line x1="810" y1="308" x2="810" y2="320"/>
    <line x1="810" y1="378" x2="810" y2="440"/>
    <line x1="810" y1="440" x2="383" y2="440"/>
    <line x1="383" y1="440" x2="383" y2="392"/>
  </g>

  <!-- 控制回路：遥控面板 -> 主开关 -->
  <g stroke="#2f855a" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ar1g)">
    <line x1="175" y1="418" x2="175" y2="242"/>
  </g>
  <text x="192" y="332" font-size="12" fill="#2f855a">遥控：起动 / 停止 / 合闸 / 分闸</text>

  <!-- 互锁说明 -->
  <rect x="40" y="500" width="920" height="96" rx="8" fill="#fff0f0" stroke="#c53030" stroke-width="1.8"/>
  <text x="58" y="524" font-size="13" font-weight="bold" fill="#c53030">电气互锁：</text>
  <text x="58" y="546" font-size="12" fill="#9b2c2c">qf1 与 pdb1 的失压脱扣线圈，分别由对方的常闭辅助触头供电；任一台合闸到位即切断对方线圈电源，两电源只能一台供电。</text>
  <text x="58" y="568" font-size="12" fill="#9b2c2c">岸电主开关 pdb1 的失压线圈还串入负序继电器常闭触点：岸电相序异常时自动闭锁，禁止投入。</text>
  <text x="58" y="588" font-size="12" fill="#9b2c2c">岸电中性线 N 接船体接线柱，使岸电中性点与船体（船电中性点）等电位，构成回路参考点并提供绝缘故障电流通路。</text>
</svg>
