<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="840" height="420" fill="#ffffff"/>
  <text x="420" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2a33">图 7　ping 原理：ICMP 请求 / 应答与 TTL</text>

  <rect x="50" y="70" width="150" height="60" rx="8" fill="#37474f"/>
  <text x="125" y="96" text-anchor="middle" font-size="14" fill="#fff">PC1</text>
  <text x="125" y="116" text-anchor="middle" font-size="11" fill="#b0bec5">192.168.1.2</text>

  <rect x="345" y="70" width="150" height="60" rx="8" fill="#3a4550"/>
  <text x="420" y="96" text-anchor="middle" font-size="14" fill="#fff">R1 路由器</text>
  <text x="420" y="116" text-anchor="middle" font-size="11" fill="#b0bec5">TTL 减 1</text>

  <rect x="640" y="70" width="150" height="60" rx="8" fill="#37474f"/>
  <text x="715" y="96" text-anchor="middle" font-size="14" fill="#fff">PC3</text>
  <text x="715" y="116" text-anchor="middle" font-size="11" fill="#b0bec5">192.168.2.2</text>

  <line x1="200" y1="88" x2="345" y2="88" stroke="#2c6ea8" stroke-width="2.5"/>
  <polygon points="345,88 333,82 333,94" fill="#2c6ea8"/>
  <text x="272" y="80" text-anchor="middle" font-size="12" fill="#2c6ea8">Echo 请求 TTL=128</text>

  <line x1="495" y1="88" x2="640" y2="88" stroke="#2c6ea8" stroke-width="2.5"/>
  <polygon points="640,88 628,82 628,94" fill="#2c6ea8"/>
  <text x="567" y="80" text-anchor="middle" font-size="12" fill="#2c6ea8">TTL=127</text>

  <line x1="640" y1="118" x2="495" y2="118" stroke="#2f8f43" stroke-width="2.5"/>
  <polygon points="495,118 507,112 507,124" fill="#2f8f43"/>
  <text x="567" y="136" text-anchor="middle" font-size="12" fill="#2f8f43">Echo 应答</text>

  <line x1="345" y1="118" x2="200" y2="118" stroke="#2f8f43" stroke-width="2.5"/>
  <polygon points="200,118 212,112 212,124" fill="#2f8f43"/>
  <text x="272" y="136" text-anchor="middle" font-size="12" fill="#2f8f43">应答返回</text>

  <rect x="50" y="170" width="740" height="230" rx="10" fill="#f7f9fb" stroke="#cfd8dc"/>
  <text x="70" y="198" font-size="14" font-weight="bold" fill="#1f2a33">结果解读</text>
  <text x="70" y="226" font-size="13" fill="#333">• 收到“来自 … 的回复: 字节=32 时间=1ms TTL=127”，说明链路通、对端可达。</text>
  <text x="70" y="254" font-size="13" fill="#333">• TTL（生存时间）每经过一台路由器减 1，可用来判断数据经过了多少跳：初始 128，收到 127 即经过 1 台路由器。</text>
  <text x="70" y="282" font-size="13" fill="#333">• 显示“请求超时”：同网段但物理不通（线没接好、VLAN 不同、对端未开机等）。</text>
  <text x="70" y="310" font-size="13" fill="#333">• 显示“无法访问目标主机”或“传输失败”：不同网段却没有正确配置网关，或路由器没有可达路由。</text>
  <text x="70" y="338" font-size="13" fill="#333">• 统计信息中的“丢失率”反映丢包情况，正常应为 0% 丢失。</text>
  <text x="70" y="366" font-size="13" fill="#333">• 命令：ping 192.168.2.2　或　ping -n 2 192.168.2.2（指定发送 2 个包）。</text>
</svg>
