<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect width="880" height="560" fill="#f7f9fb"/>

  <text x="440" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1c3d5a">干式电力变压器铭牌参数解读</text>

  <!-- 铭牌主体 -->
  <rect x="60" y="60" width="360" height="440" rx="6" fill="#cfd3d6" stroke="#6b7076" stroke-width="2"/>
  <text x="240" y="92" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">干式电力变压器</text>
  <line x1="80" y1="102" x2="400" y2="102" stroke="#7a8086" stroke-width="1.5"/>

  <!-- 铭牌字段 -->
  <g font-size="13" fill="#2b2f33">
    <text x="80" y="128">产品型号    SCB9-1600/10</text>
    <text x="80" y="152">额定容量    1600 kVA</text>
    <text x="80" y="176">额定电压    10000±2×2.5% / 400 V</text>
    <text x="80" y="200">额定频率    50 Hz</text>
    <text x="80" y="224">绝缘等级    F</text>
    <text x="80" y="248">相数        3</text>
    <text x="80" y="272">联结组标号  Dyn11</text>
    <text x="80" y="296">使用条件    户内式</text>
    <text x="80" y="320">冷却方法    AN</text>
    <text x="80" y="344">总重        4320 kg</text>
    <text x="80" y="368">绝缘水平    LI 75 AC 35</text>
  </g>

  <!-- 高亮框 -->
  <rect x="70" y="142" width="215" height="20" fill="#ffe9a8" opacity="0.85"/>
  <rect x="70" y="214" width="108" height="20" fill="#b7e4c7" opacity="0.9"/>
  <rect x="70" y="262" width="150" height="20" fill="#bcd9f5" opacity="0.9"/>
  <rect x="70" y="310" width="108" height="20" fill="#f5c6c6" opacity="0.9"/>

  <!-- 引导线与说明 -->
  <g stroke="#c0392b" stroke-width="1.6" fill="none">
    <path d="M285 152 H 500"/>
    <path d="M178 224 H 500"/>
    <path d="M220 272 H 500"/>
    <path d="M178 320 H 500"/>
  </g>

  <g font-size="13.5" fill="#333">
    <rect x="500" y="130" width="330" height="46" rx="4" fill="#fff8e1" stroke="#e0c56a"/>
    <text x="510" y="149" font-weight="bold" fill="#8a6d00">额定容量 1600 kVA</text>
    <text x="510" y="168">额定视在功率，绕组长期安全运行的容量上限</text>

    <rect x="500" y="202" width="330" height="46" rx="4" fill="#e8f7ee" stroke="#63b581"/>
    <text x="510" y="221" font-weight="bold" fill="#1f6b3c">绝缘等级 F</text>
    <text x="510" y="240">最高允许工作温度 155 ℃（A=105 / E=120 / B=130 / F=155 / H=180）</text>

    <rect x="500" y="274" width="330" height="46" rx="4" fill="#e8f1fb" stroke="#5a8fd0"/>
    <text x="510" y="293" font-weight="bold" fill="#22527f">联结组标号 Dyn11</text>
    <text x="510" y="312">D=原边三角形，yn=副边星形带中性线，11=副边线电压滞后原边 330°</text>

    <rect x="500" y="346" width="330" height="46" rx="4" fill="#fdeaea" stroke="#d98c8c"/>
    <text x="510" y="365" font-weight="bold" fill="#932a2a">冷却方法 AN</text>
    <text x="510" y="384">A=空气，N=自然循环（自然风冷）；若为 AF 则加装风机强迫风冷</text>
  </g>

  <text x="440" y="534" text-anchor="middle" font-size="12.5" fill="#777">图 2  铭牌关键参数含义（黄色/绿色/蓝色/红色高亮为本文重点）</text>
</svg>
