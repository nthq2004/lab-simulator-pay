<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="gL" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M9,0 L0,4.5 L9,9 Z" fill="#d32f2f"/>
    </marker>
    <marker id="gR" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d32f2f"/>
    </marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">图3 塞尺（Feeler Gauge）示意图</text>

  <!-- ═══ 左区：塞尺本体 ═══ -->
  <!-- 扇形塞尺片（7 片，厚度按比例粗细） -->
  <g stroke-linecap="round">
    <line x1="280" y1="292" x2="115" y2="197" stroke="#8a99ad" stroke-width="3"/>
    <line x1="280" y1="292" x2="146" y2="158" stroke="#8a99ad" stroke-width="4"/>
    <line x1="280" y1="292" x2="185" y2="128" stroke="#2050b0" stroke-width="5"/>
    <line x1="280" y1="292" x2="231" y2="109" stroke="#8a99ad" stroke-width="5"/>
    <line x1="280" y1="292" x2="280" y2="102" stroke="#8a99ad" stroke-width="6"/>
    <line x1="280" y1="292" x2="329" y2="109" stroke="#8a99ad" stroke-width="7"/>
    <line x1="280" y1="292" x2="375" y2="128" stroke="#8a99ad" stroke-width="8"/>
  </g>
  <!-- 枢轴 -->
  <circle cx="280" cy="292" r="11" fill="#777" stroke="#444" stroke-width="2"/>
  <!-- 厚度标注 -->
  <g font-size="12" fill="#444" text-anchor="middle">
    <text x="103" y="187">0.3</text>
    <text x="133" y="148">0.5</text>
    <text x="178" y="116" font-size="13.5" font-weight="bold" fill="#2050b0">0.6（选中）</text>
    <text x="229" y="98">0.8</text>
    <text x="280" y="90">1.0</text>
    <text x="335" y="98">1.2</text>
    <text x="388" y="116">1.5</text>
  </g>
  <text x="455" y="112" font-size="11" fill="#888">（单位 mm，</text>
  <text x="455" y="128" font-size="11" fill="#888">粗细≈厚度比例）</text>

  <!-- 手柄 -->
  <rect x="160" y="296" width="240" height="64" rx="10" fill="#5d6a7e" stroke="#37424f" stroke-width="2"/>
  <text x="308" y="332" text-anchor="middle" font-size="11" fill="#d7dde5">手柄</text>
  <!-- 结果屏 -->
  <rect x="175" y="308" width="112" height="40" rx="6" fill="#1f2937" stroke="#0f1720" stroke-width="1.5"/>
  <text x="231" y="332" text-anchor="middle" font-size="10.5" fill="#7cff7c" font-family="monospace">— 测量结果 —</text>
  <!-- 测量按钮 -->
  <rect x="330" y="308" width="52" height="40" rx="8" fill="#e74c3c" stroke="#a03020" stroke-width="2"/>
  <text x="356" y="333" text-anchor="middle" font-size="12" fill="#fff">测量</text>

  <!-- ═══ 右区：测量原理演示 ═══ -->
  <!-- 演示1：顺利插入 -->
  <text x="636" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e8449">① 片厚 &lt; 气隙 → 顺利插入</text>
  <line x1="578" y1="96" x2="634" y2="96" stroke="#d32f2f" stroke-width="2" marker-start="url(#gL)" marker-end="url(#gR)"/>
  <text x="606" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d32f2f">气隙 δ</text>
  <rect x="560" y="108" width="16" height="80" fill="#b9c4d4" stroke="#5a6a84" stroke-width="1.8"/>
  <rect x="636" y="108" width="44" height="80" fill="#e8e8e8" stroke="#555" stroke-width="1.8"/>
  <rect x="546" y="143" width="90" height="10" fill="#2050b0" stroke="#10285c" stroke-width="1.5" rx="2"/>
  <text x="574" y="130" text-anchor="middle" font-size="10" fill="#3c4a63">极面</text>
  <text x="658" y="130" text-anchor="middle" font-size="10" fill="#555">衔铁</text>
  <text x="606" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e8449">✅ 顺利插入 → 气隙 &gt; 片厚</text>

  <!-- 演示2：卡阻 -->
  <text x="636" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">② 片厚 ≥ 气隙 → 卡阻</text>
  <line x1="578" y1="276" x2="634" y2="276" stroke="#d32f2f" stroke-width="2" marker-start="url(#gL)" marker-end="url(#gR)"/>
  <text x="606" y="268" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d32f2f">气隙 δ</text>
  <rect x="560" y="288" width="16" height="80" fill="#b9c4d4" stroke="#5a6a84" stroke-width="1.8"/>
  <rect x="636" y="288" width="44" height="80" fill="#e8e8e8" stroke="#555" stroke-width="1.8"/>
  <rect x="546" y="323" width="52" height="10" fill="#c0392b" stroke="#7b2820" stroke-width="1.5" rx="2"/>
  <line x1="598" y1="318" x2="598" y2="338" stroke="#c0392b" stroke-width="2"/>
  <text x="574" y="310" text-anchor="middle" font-size="10" fill="#3c4a63">极面</text>
  <text x="658" y="310" text-anchor="middle" font-size="10" fill="#555">衔铁</text>
  <text x="606" y="392" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c0392b">❌ 卡阻 → 气隙 ≤ 片厚</text>

  <!-- 底部：测量判据 -->
  <rect x="30" y="378" width="400" height="40" rx="8" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/>
  <text x="230" y="394" text-anchor="middle" font-size="11.5" fill="#7d6608">从小到大逐片试插，寻找"插入 / 卡阻"边界：</text>
  <text x="230" y="412" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7d6608">能插入的最大厚度 ≤ 气隙 &lt; 不能插入的最小厚度</text>
</svg>
