<svg width="760" height="420" viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#fcfcfc" stroke="#ccc" stroke-width="1" rx="8"/>
  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">图3 塞尺示意图</text>

  <!-- 枢轴 -->
  <circle cx="300" cy="320" r="12" fill="#777" stroke="#444" stroke-width="2"/>

  <!-- 扇形塞尺片（7片，从枢轴向上展开） -->
  <g stroke-width="7" stroke-linecap="round">
    <line x1="300" y1="320" x2="180" y2="150" stroke="#9aa7bd"/>
    <line x1="300" y1="320" x2="230" y2="120" stroke="#9aa7bd"/>
    <line x1="300" y1="320" x2="300" y2="100" stroke="#2050b0" stroke-width="9"/>
    <line x1="300" y1="320" x2="370" y2="120" stroke="#9aa7bd"/>
    <line x1="300" y1="320" x2="420" y2="150" stroke="#9aa7bd"/>
    <line x1="300" y1="320" x2="460" y2="200" stroke="#9aa7bd"/>
    <line x1="300" y1="320" x2="485" y2="262" stroke="#9aa7bd"/>
  </g>

  <!-- 标签 -->
  <text x="160" y="240" text-anchor="middle" font-size="12" fill="#444">0.3</text>
  <text x="215" y="200" text-anchor="middle" font-size="12" fill="#444">0.5</text>
  <text x="285" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#2050b0">0.6（选中）</text>
  <text x="375" y="200" text-anchor="middle" font-size="12" fill="#444">0.8</text>
  <text x="428" y="236" text-anchor="middle" font-size="12" fill="#444">1.0</text>
  <text x="468" y="280" text-anchor="middle" font-size="12" fill="#444">1.2</text>
  <text x="497" y="330" text-anchor="middle" font-size="12" fill="#444">1.5</text>

  <!-- 手柄 -->
  <rect x="185" y="318" width="230" height="66" fill="#5d6a7e" stroke="#37424f" stroke-width="2" rx="10"/>
  <text x="300" y="356" text-anchor="middle" font-size="14" fill="#fff">塞尺手柄</text>

  <!-- 测量按钮 -->
  <rect x="352" y="330" width="52" height="42" fill="#e74c3c" stroke="#a03020" stroke-width="2" rx="8"/>
  <text x="378" y="356" text-anchor="middle" font-size="12" fill="#fff">测量</text>

  <!-- 结果区 -->
  <rect x="198" y="330" width="140" height="42" fill="#1f2937" stroke="#0f1720" stroke-width="1.5" rx="8"/>
  <text x="268" y="356" text-anchor="middle" font-size="11" fill="#7cff7c" font-family="monospace">— 测量结果 —</text>

  <!-- 插入演示：塞尺片插入气隙 -->
  <g transform="translate(560,0)">
    <rect x="0" y="180" width="30" height="80" fill="#b9c4d4" stroke="#5a6a84" stroke-width="2"/>
    <rect x="0" y="252" width="30" height="80" fill="#b9c4d4" stroke="#5a6a84" stroke-width="2"/>
    <rect x="24" y="180" width="60" height="160" fill="#e8e8e8" stroke="#555" stroke-width="2"/>
    <rect x="80" y="192" width="16" height="136" fill="#a33" stroke="#5c1010" stroke-width="1.5"/>
    <rect x="92" y="180" width="14" height="160" fill="#7ba7d0" stroke="#2a5a86" stroke-width="2"/>
    <rect x="122" y="180" width="26" height="160" fill="#9a9a9a" stroke="#555" stroke-width="2"/>

    <!-- 塞尺片从上方插入气隙 -->
    <rect x="76" y="110" width="14" height="100" fill="#2050b0" stroke="#10285c" stroke-width="2" rx="2"/>
    <path d="M-8 92 h30 l -7 -14 h -16 z" fill="#2050b0"/>
    <text x="83" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">δ</text>

    <line x1="76" y1="258" x2="76" y2="330" stroke="#d32f2f" stroke-width="2"/>
    <line x1="92" y1="258" x2="92" y2="330" stroke="#d32f2f" stroke-width="2"/>
    <text x="84" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#d32f2f">气隙 δ</text>

    <text x="83" y="380" text-anchor="middle" font-size="13" fill="#333">塞尺片<b style="font-weight:bold">厚度 &lt; 气隙</b> → 顺利插入</text>
  </g>
</svg>