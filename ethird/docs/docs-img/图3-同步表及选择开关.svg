<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 560" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2d3436"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2980b9"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1e8449"/>
    </marker>
    <marker id="arrC" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#16a085"/>
    </marker>
  </defs>

  <text x="575" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2d3436">同步表与同步表选择开关</text>

  <!-- ═══ 汇流排（运行系统） ═══ -->
  <line x1="120" y1="140" x2="400" y2="140" stroke="#2471a3" stroke-width="8" stroke-linecap="round"/>
  <text x="260" y="122" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a5276">三相汇流排（运行系统）AC 400V</text>

  <!-- 运行侧线圈接线 -->
  <path d="M260,140 L260,280 L468,280" stroke="#2980b9" stroke-width="2.5" fill="none" stroke-dasharray="8 5" marker-end="url(#arrB)"/>
  <rect x="470" y="274" width="10" height="12" fill="#2980b9"/>
  <text x="272" y="222" font-size="12.5" fill="#2980b9">运行侧线圈</text>
  <text x="272" y="240" font-size="11" fill="#555">（接汇流排电压）</text>

  <!-- ═══ 同步表表盘 ═══ -->
  <circle cx="605" cy="280" r="130" fill="#ffffff" stroke="#2d3436" stroke-width="2.5"/>
  <circle cx="605" cy="280" r="118" fill="none" stroke="#e2d9bd" stroke-width="1"/>
  <!-- 12 点同步刻度 -->
  <line x1="605" y1="150" x2="605" y2="180" stroke="#2d3436" stroke-width="2.5"/>
  <text x="605" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">同步（12点）</text>
  <!-- 快 / 慢 方向弧 -->
  <path d="M710,172 A150,150 0 0 1 746,229" stroke="#16a085" stroke-width="2.5" fill="none" marker-end="url(#arrC)"/>
  <text x="770" y="184" font-size="15" font-weight="bold" fill="#16a085">快</text>
  <path d="M500,172 A150,150 0 0 0 464,229" stroke="#16a085" stroke-width="2.5" fill="none" marker-end="url(#arrC)"/>
  <text x="424" y="184" text-anchor="end" font-size="15" font-weight="bold" fill="#16a085">慢</text>
  <!-- 11 点位标记 -->
  <circle cx="540" cy="167" r="11" fill="none" stroke="#e67e22" stroke-width="2.5"/>
  <text x="522" y="146" text-anchor="end" font-size="12" fill="#e67e22">11 点位</text>
  <text x="522" y="162" text-anchor="end" font-size="10.5" fill="#e67e22">（合闸操作点）</text>
  <!-- 指针（指向 11 点附近） -->
  <line x1="605" y1="280" x2="548" y2="174" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="605" cy="280" r="8" fill="#2d3436"/>
  <!-- 表盘内说明 -->
  <text x="605" y="376" text-anchor="middle" font-size="11.5" fill="#555">指针停于 12 点 ＝ 两电压同相位</text>
  <text x="605" y="394" text-anchor="middle" font-size="11.5" fill="#555">指针转向/转速 ＝ 频差方向/大小</text>

  <!-- ═══ 待并侧：G1 / G2 经选择开关 ═══ -->
  <circle cx="850" cy="220" r="34" fill="#eafaf1" stroke="#1e8449" stroke-width="2.5"/>
  <text x="850" y="227" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e8449">G1</text>
  <text x="850" y="170" text-anchor="middle" font-size="12" fill="#555">1#发电机</text>
  <circle cx="950" cy="220" r="34" fill="#fdebd0" stroke="#e67e22" stroke-width="2.5"/>
  <text x="950" y="227" text-anchor="middle" font-size="16" font-weight="bold" fill="#d35400">G2</text>
  <text x="950" y="170" text-anchor="middle" font-size="12" fill="#555">2#发电机</text>

  <!-- 选择开关 -->
  <rect x="810" y="380" width="160" height="110" rx="10" fill="#f8f9f9" stroke="#2d3436" stroke-width="2"/>
  <text x="890" y="404" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d3436">同步表选择开关</text>
  <text x="890" y="426" text-anchor="middle" font-size="11.5" fill="#555">OFF / 1 / 2 / 3</text>
  <text x="890" y="446" text-anchor="middle" font-size="10.5" fill="#555">1 档→G1　2 档→G2</text>
  <text x="890" y="464" text-anchor="middle" font-size="10.5" fill="#555">OFF 断开　3 档备用</text>
  <circle cx="850" cy="380" r="4" fill="#2d3436"/>
  <circle cx="950" cy="380" r="4" fill="#2d3436"/>
  <circle cx="810" cy="435" r="4" fill="#1e8449"/>
  <!-- 开关输出 → 待并侧线圈 -->
  <path d="M810,435 L780,435 L780,290 L741,290" stroke="#1e8449" stroke-width="2.5" fill="none" stroke-dasharray="8 5" marker-end="url(#arrG)"/>
  <rect x="733" y="284" width="10" height="12" fill="#1e8449"/>
  <text x="788" y="330" font-size="12.5" fill="#1e8449">待并侧线圈</text>
  <text x="788" y="348" font-size="11" fill="#555">（经选择开关）</text>

  <!-- G1 / G2 引线 -->
  <line x1="850" y1="254" x2="850" y2="380" stroke="#1e8449" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="862" y="310" font-size="11" fill="#1e8449">1 档</text>
  <line x1="950" y1="254" x2="950" y2="380" stroke="#e67e22" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="962" y="310" font-size="11" fill="#e67e22">2 档</text>

  <!-- ═══ 底部说明 ═══ -->
  <rect x="60" y="506" width="1030" height="40" rx="8" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/>
  <text x="575" y="531" text-anchor="middle" font-size="12.5" fill="#7d6608">指针位置＝相位差（停于12点即同步）　|　指针转向＝频差方向（待并偏高→"快"）　|　指针在 11 点位附近合闸，补偿断路器动作时间</text>
</svg>
