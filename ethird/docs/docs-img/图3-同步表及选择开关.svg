<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 540" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2d3436"/>
    </marker>
  </defs>

  <text x="575" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2d3436">同步表与同步表选择开关</text>

  <!-- ── 左：同步表表盘 ── -->
  <rect x="60" y="70" width="330" height="330" rx="14" fill="#fef9e7" stroke="#d4ac0d" stroke-width="2"/>
  <text x="225" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#7d6608">同步表（同步指示器）</text>
  <circle cx="225" cy="210" r="128" fill="#ffffff" stroke="#2d3436" stroke-width="2.5"/>
  <!-- 刻度与方向 -->
  <g stroke="#2d3436" stroke-width="1.5">
    <line x1="225" y1="82" x2="225" y2="110"/>
    <line x1="225" y1="310" x2="225" y2="338"/>
    <line x1="97" y1="210" x2="125" y2="210"/>
    <line x1="325" y1="210" x2="353" y2="210"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#2d3436">
    <text x="225" y="72" font-weight="bold" fill="#c0392b">同步（12点）</text>
    <text x="165" y="140">慢</text>
    <text x="285" y="140">快</text>
    <text x="370" y="216">快</text>
    <text x="80" y="216">慢</text>
    <text x="225" y="372">相位差 0°，指针停在同步点</text>
    <text x="225" y="390">频差使指针按“快/慢”方向匀速转动</text>
  </g>
  <!-- 11 点位标记（并车操作点） -->
  <circle cx="140" cy="146" r="10" fill="none" stroke="#e67e22" stroke-width="2"/>
  <text x="140" y="120" text-anchor="middle" font-size="12" fill="#e67e22">11 点位（+）</text>
  <!-- 指针 -->
  <line x1="225" y1="210" x2="148" y2="150" stroke="#c0392b" stroke-width="4"/>
  <circle cx="225" cy="210" r="8" fill="#2d3436"/>
  <!-- 两个电压线圈示意 -->
  <text x="225" y="416" text-anchor="middle" font-size="12" fill="#555">运行侧线圈：汇流排电压　　待并侧线圈：所选发电机电压</text>

  <!-- ── 右：电压源与本机侧 ── -->
  <g transform="translate(470,0)">
    <!-- 汇流排 -->
    <rect x="120" y="70" width="200" height="40" rx="6" fill="#d6eaf8" stroke="#2471a3" stroke-width="2"/>
    <text x="220" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a5276">三相汇流排（运行系统）</text>
    <!-- 1#机 -->
    <circle cx="60" cy="210" r="30" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
    <text x="60" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e8449">G1</text>
    <text x="60" y="258" text-anchor="middle" font-size="12" fill="#555">1#发电机</text>
    <!-- 2#机 -->
    <circle cx="330" cy="210" r="30" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
    <text x="330" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#d35400">G2</text>
    <text x="330" y="258" text-anchor="middle" font-size="12" fill="#555">2#发电机</text>

    <!-- 选择开关 -->
    <rect x="150" y="300" width="140" height="150" rx="10" fill="#f8f9f9" stroke="#2d3436" stroke-width="2"/>
    <text x="220" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d3436">选择开关</text>
    <g font-size="12" text-anchor="middle" fill="#2d3436">
      <rect x="246" y="336" width="36" height="70" rx="4" fill="#fff" stroke="#2d3436"/>
      <text x="264" y="352">OFF</text>
      <text x="264" y="372">1</text>
      <text x="264" y="392">2</text>
      <text x="264" y="412">3</text>
    </g>
    <!-- 触点连接 -->
    <line x1="120" y1="382" x2="246" y2="382" stroke="#2d3436" stroke-width="2"/>
    <line x1="330" y1="240" x2="330" y2="382" stroke="#2d3436" stroke-width="2"/>
    <line x1="330" y1="382" x2="282" y2="382" stroke="#2d3436" stroke-width="2"/>
    <text x="196" y="402" text-anchor="middle" font-size="11" fill="#555">1档→G1　2档→G2</text>
    <text x="196" y="418" text-anchor="middle" font-size="11" fill="#555">OFF 断开　3 档备用</text>

    <!-- 同步表接线 -->
    <path d="M220,90 L220,150 L330,150 L330,190" stroke="#2471a3" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
    <text x="352" y="160" font-size="12" fill="#2471a3">运行侧电压</text>
    <path d="M60,240 L60,382 L150,382" stroke="#1e8449" stroke-width="2.5"/>
    <path d="M330,240 L330,382 L282,382" stroke="#e67e22" stroke-width="2.5"/>
    <text x="96" y="420" font-size="12" fill="#1e8449">1#机电压(经选择开关)</text>
    <text x="180" y="438" font-size="12" fill="#e67e22">2#机电压</text>

    <!-- 接线规则说明 -->
    <rect x="430" y="90" width="200" height="300" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
    <text x="530" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e8449">使用规则</text>
    <g font-size="12" fill="#2d3436">
      <text x="446" y="146">① 待并机频率偏高：指针顺时针</text>
      <text x="446" y="168">　（“快”方向）转动；偏低则逆向；</text>
      <text x="446" y="192">② 转速＝频差大小：频差越大转越快；</text>
      <text x="446" y="216">③ 指针位置＝相位差：停于 12 点即</text>
      <text x="446" y="238">　同相位；</text>
      <text x="446" y="262">④ 指针在 11 点位置附近按下“合闸”，</text>
      <text x="446" y="284">　弥补断路器动作时间，实现准同步</text>
      <text x="446" y="306">　并车（相位差接近 0）；</text>
      <text x="446" y="330">⑤ 同步条件：电压、频率、相位接近</text>
      <text x="446" y="352">　一致才允许合闸，否则联锁/保护动作。</text>
    </g>
  </g>
</svg>