<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect width="880" height="520" fill="#ffffff"/>

  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1c3d5a">直流法验证同名端（原边接 24V 直流、副边接直流电压表）</text>

  <!-- 直流电源 -->
  <g>
    <rect x="70" y="150" width="140" height="150" rx="8" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2.5"/>
    <text x="140" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">DC 24V</text>
    <circle cx="140" cy="235" r="16" fill="#bdc3c7" stroke="#7f8c8d"/>
    <text x="140" y="240" text-anchor="middle" font-size="11" fill="#333">ON</text>
    <text x="140" y="290" text-anchor="middle" font-size="12" fill="#666">电源开关（合/断）</text>
    <!-- 端子 -->
    <circle cx="210" cy="170" r="5" fill="#e41c1c"/>
    <circle cx="210" cy="285" r="5" fill="#1c4ce4"/>
  </g>

  <!-- 变压器 -->
  <rect x="350" y="110" width="210" height="210" rx="8" fill="#e8eaec" stroke="#b0b4b8" stroke-width="2"/>
  <!-- 闭合铁芯 -->
  <rect x="430" y="150" width="20" height="130" fill="#8898a8" stroke="#485060"/>
  <rect x="480" y="150" width="20" height="130" fill="#8898a8" stroke="#485060"/>
  <rect x="430" y="150" width="70" height="20" fill="#8898a8" stroke="#485060"/>
  <rect x="430" y="260" width="70" height="20" fill="#8898a8" stroke="#485060"/>
  <!-- 原边绕组 -->
  <line x1="395" y1="170" x2="395" y2="285" stroke="#c07030" stroke-width="1.5"/>
  <path d="M395 200 h35 M395 230 h35 M395 260 h35" stroke="#c07030" stroke-width="3"/>
  <!-- 副边绕组 -->
  <line x1="525" y1="180" x2="525" y2="270" stroke="#3080b0" stroke-width="1.5"/>
  <path d="M500 195 h25 M500 225 h25 M500 255 h25" stroke="#3080b0" stroke-width="3"/>
  <!-- 端子：红=P1/S1 同名端 -->
  <circle cx="395" cy="170" r="5" fill="#e41c1c"/>
  <circle cx="395" cy="285" r="5" fill="#1c4ce4"/>
  <circle cx="525" cy="180" r="5" fill="#e41c1c"/>
  <circle cx="525" cy="270" r="5" fill="#333"/>
  <text x="395" y="156" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">P1</text>
  <text x="395" y="303" text-anchor="middle" font-size="11" fill="#1c4ce4" font-weight="bold">P2</text>
  <text x="537" y="168" font-size="11" fill="#c0392b" font-weight="bold">S1</text>
  <text x="537" y="288" font-size="11" fill="#333" font-weight="bold">S2</text>
  <text x="460" y="345" text-anchor="middle" font-size="12" fill="#555">控制变压器</text>

  <!-- 原边接线（电源 → 绕组端子，直线直达） -->
  <path d="M210 170 H 395" stroke="#e41c1c" stroke-width="3" fill="none"/>
  <path d="M210 285 H 395" stroke="#1c4ce4" stroke-width="3" fill="none"/>
  <text x="300" y="162" text-anchor="middle" font-size="12" fill="#e41c1c">正极 → P1</text>
  <text x="300" y="277" text-anchor="middle" font-size="12" fill="#1c4ce4">负极 → P2</text>

  <!-- 副边接表（接线端对齐表笔端子） -->
  <path d="M525 180 H 575 V 300 H 600" stroke="#e41c1c" stroke-width="3" fill="none"/>
  <path d="M525 270 H 550 V 380 H 600" stroke="#222" stroke-width="3" fill="none"/>

  <!-- 指针万用表 -->
  <g>
    <rect x="600" y="270" width="170" height="180" rx="8" fill="#f4f4f0" stroke="#9aa0a6" stroke-width="2"/>
    <text x="685" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">指针万用表 DC 10V</text>
    <!-- 表盘 -->
    <path d="M637 360 A 48 48 0 0 1 733 360" fill="none" stroke="#bbb" stroke-width="2"/>
    <line x1="637" y1="352" x2="637" y2="368" stroke="#888" stroke-width="1.5"/>
    <line x1="685" y1="312" x2="685" y2="322" stroke="#888" stroke-width="1.5"/>
    <line x1="733" y1="352" x2="733" y2="368" stroke="#888" stroke-width="1.5"/>
    <!-- 正偏指针 -->
    <line x1="685" y1="360" x2="718" y2="327" stroke="#c0392b" stroke-width="3"/>
    <polygon points="724,321 716,326 720,318" fill="#c0392b"/>
    <circle cx="685" cy="360" r="4" fill="#333"/>
    <text x="700" y="308" font-size="11" fill="#c0392b">正偏</text>
    <text x="640" y="382" font-size="11" fill="#555">0</text>
    <text x="728" y="382" text-anchor="end" font-size="11" fill="#555">10</text>
    <!-- 表笔端子 -->
    <circle cx="600" cy="300" r="5" fill="#e41c1c"/>
    <circle cx="600" cy="380" r="5" fill="#222"/>
    <text x="610" y="304" font-size="11" fill="#e41c1c">VΩ</text>
    <text x="608" y="384" font-size="11" fill="#222">COM</text>
  </g>

  <!-- 原理说明 -->
  <rect x="70" y="380" width="480" height="110" rx="6" fill="#f0f7ff" stroke="#8fb8e0"/>
  <text x="84" y="404" font-size="14" font-weight="bold" fill="#1c5c9c">判断依据</text>
  <text x="84" y="428" font-size="13" fill="#333">① 合上电源瞬间：原边电流由 0 建立，磁通变化 → 副边感应出约 6V 电压；</text>
  <text x="84" y="450" font-size="13" fill="#333">② 若表针“正向偏转”，说明红表笔所接 S1 与电源正极所接 P1 为同名端；</text>
  <text x="84" y="472" font-size="13" fill="#333">③ 断开瞬间磁通塌缩，表针反向偏转一次，之后回零（直流下无持续感应电动势）。</text>

  <text x="440" y="508" text-anchor="middle" font-size="12.5" fill="#777">图 4  直流法接线与表针偏转方向</text>
</svg>
