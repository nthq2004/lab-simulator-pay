<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2a33">图 1　PLC 仿真系统总体组成</text>

  <!-- 主电路 -->
  <g>
    <rect x="40" y="70" width="880" height="96" rx="10" fill="#fdf6ec" stroke="#e0a458" stroke-width="2"/>
    <text x="58" y="94" font-size="14" font-weight="bold" fill="#a86a1a">主电路（AC 380V，强电）</text>
    <g font-size="14" text-anchor="middle">
      <rect x="70" y="110" width="120" height="42" rx="8" fill="#fff" stroke="#c98a3a" stroke-width="2"/>
      <text x="130" y="136" fill="#7a4a10">三相电源</text>
      <rect x="250" y="110" width="120" height="42" rx="8" fill="#fff" stroke="#c98a3a" stroke-width="2"/>
      <text x="310" y="136" fill="#7a4a10">KM1 主触头</text>
      <rect x="430" y="110" width="120" height="42" rx="8" fill="#fff" stroke="#c98a3a" stroke-width="2"/>
      <text x="490" y="136" fill="#7a4a10">FR 发热元件</text>
      <rect x="610" y="110" width="130" height="42" rx="8" fill="#fff" stroke="#c98a3a" stroke-width="2"/>
      <text x="675" y="136" fill="#7a4a10">三相异步电机</text>
      <rect x="800" y="110" width="100" height="42" rx="8" fill="#fff" stroke="#c98a3a" stroke-width="2"/>
      <text x="850" y="136" fill="#7a4a10">PE 接地</text>
    </g>
    <g stroke="#c98a3a" stroke-width="2.4" fill="none">
      <line x1="190" y1="131" x2="250" y2="131"/>
      <line x1="370" y1="131" x2="430" y2="131"/>
      <line x1="550" y1="131" x2="610" y2="131"/>
      <line x1="740" y1="131" x2="800" y2="131"/>
    </g>
    <text x="820" y="98" font-size="11" fill="#7a4a10">M1 PE</text>
  </g>

  <!-- SR40 与扩展模块 -->
  <g>
    <rect x="40" y="210" width="880" height="150" rx="10" fill="#eef4fb" stroke="#3f7fbf" stroke-width="2"/>
    <text x="58" y="234" font-size="14" font-weight="bold" fill="#1d5185">控制器（DC 24V，弱电）</text>

    <rect x="70" y="252" width="210" height="86" rx="8" fill="#fff" stroke="#3f7fbf" stroke-width="2"/>
    <text x="175" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d5185">CPU SR40</text>
    <text x="175" y="308" text-anchor="middle" font-size="12" fill="#4a5b6b">24DI / 16DO / 2AI / 1AO</text>
    <text x="175" y="327" text-anchor="middle" font-size="12" fill="#4a5b6b">IP 192.168.0.1　默认 STOP</text>

    <g font-size="12.5" text-anchor="middle">
      <rect x="330" y="252" width="120" height="86" rx="8" fill="#fff" stroke="#3f7fbf" stroke-width="1.6"/>
      <text x="390" y="278" font-weight="bold" fill="#1d5185">EM AI04</text>
      <text x="390" y="298" fill="#4a5b6b">4 路模拟量输入</text>
      <text x="390" y="318" fill="#1d5185">AIW0 ~ AIW6</text>

      <rect x="470" y="252" width="120" height="86" rx="8" fill="#fff" stroke="#3f7fbf" stroke-width="1.6"/>
      <text x="530" y="278" font-weight="bold" fill="#1d5185">EM AQ04</text>
      <text x="530" y="298" fill="#4a5b6b">4 路模拟量输出</text>
      <text x="530" y="318" fill="#1d5185">AQW0 ~ AQW6</text>

      <rect x="610" y="252" width="120" height="86" rx="8" fill="#fff" stroke="#3f7fbf" stroke-width="1.6"/>
      <text x="670" y="278" font-weight="bold" fill="#1d5185">EM DI08</text>
      <text x="670" y="298" fill="#4a5b6b">8 路开关量输入</text>
      <text x="670" y="318" fill="#1d5185">I3.0 ~ I3.7</text>

      <rect x="750" y="252" width="120" height="86" rx="8" fill="#fff" stroke="#3f7fbf" stroke-width="1.6"/>
      <text x="810" y="278" font-weight="bold" fill="#1d5185">EM DQ08</text>
      <text x="810" y="298" fill="#4a5b6b">8 路开关量输出</text>
      <text x="810" y="318" fill="#1d5185">Q2.0 ~ Q2.7</text>
    </g>
    <!-- 扩展总线 -->
    <g stroke="#3f7fbf" stroke-width="3" fill="none">
      <line x1="280" y1="295" x2="330" y2="295"/>
      <line x1="450" y1="295" x2="470" y2="295"/>
      <line x1="590" y1="295" x2="610" y2="295"/>
      <line x1="730" y1="295" x2="750" y2="295"/>
    </g>
    <text x="305" y="286" text-anchor="middle" font-size="11" fill="#1d5185">扩展</text>
  </g>

  <!-- 模拟量 4-20mA 回路 -->
  <g>
    <rect x="40" y="400" width="880" height="130" rx="10" fill="#eefaf1" stroke="#34a853" stroke-width="2"/>
    <text x="58" y="424" font-size="14" font-weight="bold" fill="#1e6b34">模拟量 4~20mA 回路（转速测量与显示）</text>
    <g font-size="13" text-anchor="middle">
      <rect x="70" y="444" width="150" height="60" rx="8" fill="#fff" stroke="#34a853" stroke-width="2"/>
      <text x="145" y="470" font-weight="bold" fill="#1e6b34">转速变送器</text>
      <text x="145" y="490" fill="#4a5b6b">0~2000 r/min</text>

      <rect x="300" y="444" width="150" height="60" rx="8" fill="#fff" stroke="#34a853" stroke-width="2"/>
      <text x="375" y="470" font-weight="bold" fill="#1e6b34">AI04（ch0）</text>
      <text x="375" y="490" fill="#4a5b6b">250Ω 采样</text>

      <rect x="530" y="444" width="150" height="60" rx="8" fill="#fff" stroke="#34a853" stroke-width="2"/>
      <text x="605" y="470" font-weight="bold" fill="#1e6b34">AQ04（ch0）</text>
      <text x="605" y="490" fill="#4a5b6b">电流源输出</text>

      <rect x="760" y="444" width="150" height="60" rx="8" fill="#fff" stroke="#34a853" stroke-width="2"/>
      <text x="835" y="470" font-weight="bold" fill="#1e6b34">数字转速表</text>
      <text x="835" y="490" fill="#4a5b6b">4~20mA 显示</text>
    </g>
    <g stroke="#34a853" stroke-width="2.6" fill="none">
      <line x1="220" y1="474" x2="300" y2="474"/>
      <line x1="450" y1="474" x2="530" y2="474"/>
      <line x1="680" y1="474" x2="760" y2="474"/>
    </g>
    <text x="260" y="466" text-anchor="middle" font-size="11" fill="#1e6b34">4~20mA</text>
    <text x="490" y="466" text-anchor="middle" font-size="11" fill="#1e6b34">AIW0</text>
    <text x="720" y="466" text-anchor="middle" font-size="11" fill="#1e6b34">4~20mA</text>
  </g>

  <!-- STEP7 上位机 -->
  <rect x="40" y="560" width="880" height="40" rx="8" fill="#f2f2f6" stroke="#8a8aa0" stroke-width="1.6"/>
  <text x="480" y="586" text-anchor="middle" font-size="13" fill="#4a4a60">STEP7 上位机（PC）—— 经以太网连接 CPU，用于程序编辑、上传 / 下载与在线监控</text>
</svg>
