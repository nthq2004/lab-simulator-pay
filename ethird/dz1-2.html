 PE 连接的作用`,mode:`quiz`,quizConfig:{question:`控制箱的箱体 PE 端子和柜门 PE 端子为何都要用黄绿软线接到 PE 端子排？`,options:[`箱体与柜门均为可接触的金属导电部分，须可靠接地，开门时柜门仍通过软线保持接地，防止人体触电`,`仅为了美观，与安全无关`,`让 PE 端子排承载负载电流`,`PE 软线只作电气指示，不参与保护`],answer:0,analysis:`凡人体易触及的金属外壳（箱体、柜门）都必须做保护接地。柜门是可开启的活动部件，若用硬导线可能随开合疲劳断裂，故采用柔性黄绿软线与 PE 端子排相连，保证在任何开合状态下柜门始终与接地系统等电位，一旦内部带电部件漏电即可经 PE 泄放、避免触电。`}},{msg:`第 7 步：请识别【电机 PE 端子】`,mode:`find`,target:`m-3d`,subTarget:`pe-terminal`,async act(){this.sys.showFloatingTip(`【电机 PE 端子】即电机机座上的黄绿色保护接地端子，经固定黄绿线接到控制箱 PE1，使三相电机外壳可靠接地。`,4500),await new Promise(e=>setTimeout(e,1300))},check(){return this.sys.lastClickedPartId===`m-3d/pe-terminal`}},{msg:`第 8 步：测试题——固定接地线（PE 线）`,mode:`quiz`,quizConfig:{question:`固定式（永久性）保护接地线 PE 的标准颜色标识是？其主要作用是？`,options:[`黄绿双色；将设备金属外壳与接地系统永久相连，漏电时起保护作用`,`蓝色；用于传输工作电流`,`红色；用于相线标识`,`黑色；仅作地线装饰标识`],answer:0,analysis:`按国家标准，保护接地线（PE）采用黄绿双色绝缘。它把设备金属外壳、箱体、柜门、母排可靠地接到保护接地系统，形成等电位连接；当设备绝缘损坏致外壳带电时，PE 线提供低阻抗泄放通路并形成足够的故障电流使保护装置动作切断电源，防止触电。`}},{msg:`第 9 步：请识别【临时接地线】`,mode:`find`,target:`lv-gnd-cable`,subTarget:`clamp-p1`,async act(){this.sys.showFloatingTip(`【临时接地线】即三相短路接地线（便携式）：检修停电时挂接，将三相短接并可靠接地，泄放残余电荷、防止突然来电。`,4500),await new Promise(e=>setTimeout(e,1300))},check(){return this.sys.lastClickedPartId===`lv-gnd-cable/clamp-p1`}},{msg:`第 10 步：测试题——临时接地线的作用`,mode:`quiz`,quizConfig:{question:`低压线路停电检修时挂接临时（三相短路）接地线的主要目的是？`,options:[`将停电设备及线路三相短接并接地，泄放残余电荷，防止突然来电危及检修人员`,`给设备提供工作电压`,`作为测量仪表使用`,`代替绝缘工具使用`],answer:0,analysis:`停电检修虽然断开了电源，但线路上仍可能残留感应电荷、静电或装置未断尽的电荷，且存在误送电（突然来电）的危险。三相短路接地线将三相导线短接并可靠接地，一旦任一相来电即形成接地短路，使保护装置跳闸或人员不触及高电位，从而保证安全。`}},{msg:`第 11 步：测试题——临时接地线的操作顺序`,mode:`quiz`,quizConfig:{question:`挂设临时接地线时，正确的操作顺序是？`,options:[`先接接地端，后挂导体端；拆除时顺序相反（先拆导体端，后拆接地端）`,`先挂导体端，后接接地端；拆除时先拆接地端`,`挂接与拆除均无顺序要求`,`只需挂导体端，无需接接地端`],answer:0,analysis:`挂设时先接接地端、后挂导体端，可保证接地线始终有可靠的接地参考，避免人体先触到尚未接地的导体而触电；拆除时顺序相反，先拆导体端再拆接地端，同样是为了保护操作人员安全。这是检修接地线的标准安全操作规程。`}}]}},us=[{Class:Ga,id:`multimeter`,x:500,y:100,visible:!1},{Class:Qa,id:`mf47-panel`,x:650,y:100,visible:!1},{Class:to,id:`osc`,x:50,y:50,visible:!1} <body>

<!-- Markdown 实验文档预览层 -->
<div id="docView" style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:99999;background:#1a2332;overflow-y:auto;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <!-- 顶部工具栏 -->
  <div style="position:sticky;top:0;z-index:10;background:#799484d9;backdrop-filter:blur(8px);padding:12px 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid rgba(255,255,255,0.1);">
    <button id="btnReturnToSim" style="background:#27ae60;color:#fff;border:none;padding:8px 20px;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s;">
      &#9654; 返回实验
    </button>
    <span style="color:rgba(255,255,255,0.6);font-size:14px;">实验文档预览</span>
  </div>
  <!-- 文档内容区 -->
  <div id="docContent" style="max-width:900px;margin:0 auto;padding:40px 32px 80px;line-height:1.8;">
    <p style="text-align:center;color:#7f8c8d;padding:60px 0;">加载实验文档中...</p>
  </div>
</div>

<script>
(function(){
  var docView = document.getElementById('docView');
  var btnReturn = document.getElementById('btnReturnToSim');
  var docContent = document.getElementById('docContent');

  // 返回实验：关闭文档层，显示仿真
  btnReturn.addEventListener('click', function(){
    docView.style.transition = 'opacity 0.3s';
    docView.style.opacity = '0';
    setTimeout(function(){
      docView.style.display = 'none';
      // 触发 resize 让 Konva 舞台适应容器尺寸
      window.dispatchEvent(new Event('resize'));
    }, 300);
  });

  // 加载文档
  async function loadDoc(){
    var title = document.title.trim();
    try {
      var resp = await fetch('docs/' + encodeURIComponent(title) + '.md');
      if(!resp.ok) throw new Error('not found');
      var md = await resp.text();
      // 修正图片路径：docs-img/ → docs/docs-img/
      md = md.replace(/]\(docs-img\//g, '](docs/docs-img/');
      // 解析 Markdown
      if(typeof marked !== 'undefined'){
        docContent.innerHTML = marked.parse(md);
      } else {
        docContent.textContent = md;
      }
      // 设置文档样式
      docContent.querySelectorAll('h1').forEach(function(h){ h.style.color='#fff'; h.style.borderBottom='2px solid #27ae60'; h.style.paddingBottom='12px'; h.style.marginTop='0'; });
      docContent.querySelectorAll('h2').forEach(function(h){ h.style.color='#ecf0f1'; h.style.borderBottom='1px solid #34495e'; h.style.paddingBottom='8px'; h.style.marginTop='32px'; });
      docContent.querySelectorAll('h3').forEach(function(h){ h.style.color='#bdc3c7'; h.style.marginTop='24px'; });
      docContent.querySelectorAll('p').forEach(function(p){ p.style.margin='12px 0'; p.style.color='#d0d0d0'; });
      docContent.querySelectorAll('img').forEach(function(img){ img.style.maxWidth='100%'; img.style.borderRadius='8px'; img.style.margin='16px 0'; img.style.boxShadow='0 2px 12px rgba(0,0,0,0.3)'; });
      docContent.querySelectorAll('strong').forEach(function(s){ s.style.color='#f39c12'; });
      docContent.querySelectorAll('em').forEach(function(e){ e.style.color='#2ecc71'; });
      docContent.querySelectorAll('code').forEach(function(c){ c.style.background='#2c3e50'; c.style.padding='2px 6px'; c.style.borderRadius='4px'; c.style.fontSize='13px'; });
      docContent.querySelectorAll('pre').forEach(function(pre){ pre.style.background='#2c3e50'; pre.style.padding='16px'; pre.style.borderRadius='8px'; pre.style.overflow='auto'; });
      docContent.querySelectorAll('table').forEach(function(t){ t.style.width='100%'; t.style.borderCollapse='collapse'; t.style.margin='16px 0'; });
      docContent.querySelectorAll('td, th').forEach(function(c){ c.style.border='1px solid #34495e'; c.style.padding='10px 14px'; c.style.textAlign='left'; });
      docContent.querySelectorAll('th').forEach(function(h){ h.style.background='#2c3e50'; h.style.color='#ecf0f1'; });
      docContent.querySelectorAll('ul, ol').forEach(function(l){ l.style.paddingLeft='24px'; l.style.margin='12px 0'; });
      docContent.querySelectorAll('li').forEach(function(li){ li.style.margin='6px 0'; });
      docContent.querySelectorAll('blockquote').forEach(function(b){ b.style.borderLeft='4px solid #27ae60'; b.style.padding='12px 20px'; b.style.background='rgba(39,174,96,0.1)'; b.style.borderRadius='0 8px 8px 0'; b.style.margin='16px 0'; b.style.color='#a0a0a0'; });
    } catch(e){
      // 文档不存在，直接进入仿真
      docView.style.display = 'none';
      console.log('[DocLoader] 文档不存在或加载失败，直接进入仿真:', e.message);
    }
  }

  loadDoc();
})();
</script>
