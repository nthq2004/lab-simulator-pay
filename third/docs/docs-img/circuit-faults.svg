<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
  <rect width="900" height="440" fill="#f7f9f8"/>
  <text x="450" y="28" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="bold" fill="#263238">两处端子接触不良故障的位置与现象</text>

  <!-- 控制回路简图 -->
  <g stroke="#37474f" stroke-width="2" fill="none">
    <path d="M70 110 L160 110"/>
    <path d="M70 110 L70 290 L150 290"/>
    <path d="M205 290 L340 290 L340 225"/>
    <path d="M270 110 L340 110 L340 170"/>
    <path d="M215 110 L215 70 L225 70"/>
    <path d="M258 70 L270 70 L270 110"/>
  </g>
  <!-- SB1（常闭） -->
  <line x1="160" y1="110" x2="215" y2="110" stroke="#37474f" stroke-width="2"/>
  <line x1="182" y1="110" x2="182" y2="96" stroke="#546e7a" stroke-width="1.4"/>
  <line x1="172" y1="96" x2="206" y2="96" stroke="#546e7a" stroke-width="1.4"/>
  <text x="176" y="134" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">SB1</text>
  <!-- SB2（常开） -->
  <line x1="215" y1="110" x2="262" y2="96" stroke="#37474f" stroke-width="2"/>
  <line x1="243" y1="110" x2="243" y2="126" stroke="#546e7a" stroke-width="1.4"/>
  <line x1="233" y1="126" x2="267" y2="126" stroke="#546e7a" stroke-width="1.4"/>
  <text x="243" y="144" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">SB2</text>
  <!-- KM1 常开（断开） -->
  <line x1="225" y1="70" x2="258" y2="56" stroke="#37474f" stroke-width="2"/>
  <text x="243" y="46" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">KM1 常开（自锁）</text>
  <!-- 线圈 -->
  <rect x="318" y="170" width="44" height="55" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.8"/>
  <text x="340" y="203" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#283593">KM1</text>
  <text x="368" y="203" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">线圈</text>
  <!-- FR 常闭（闭合：闸刀搭在两个端子上，上方带按钮式推杆） -->
  <line x1="150" y1="290" x2="168" y2="290" stroke="#37474f" stroke-width="2"/>
  <line x1="187" y1="290" x2="205" y2="290" stroke="#37474f" stroke-width="2"/>
  <line x1="168" y1="290" x2="187" y2="290" stroke="#37474f" stroke-width="2"/>
  <line x1="177.5" y1="290" x2="177.5" y2="277" stroke="#546e7a" stroke-width="1.4"/>
  <line x1="169" y1="277" x2="186" y2="277" stroke="#546e7a" stroke-width="1.4"/>
  <text x="178" y="308" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">FR 常闭</text>
  <text x="76" y="200" font-family="Microsoft YaHei, Arial" font-size="11" fill="#546e7a">TC 副边</text>

  <g fill="#37474f">
    <circle cx="160" cy="110" r="3"/><circle cx="215" cy="110" r="3"/><circle cx="270" cy="110" r="3"/>
    <circle cx="215" cy="70" r="3"/><circle cx="270" cy="70" r="3"/>
    <circle cx="150" cy="290" r="3"/><circle cx="205" cy="290" r="3"/>
  </g>

  <!-- 故障 1 标记：线圈 A1 端子（线圈上端） -->
  <circle cx="340" cy="170" r="16" fill="none" stroke="#e53935" stroke-width="2.4" stroke-dasharray="5 3"/>
  <g stroke="#e53935" stroke-width="3">
    <line x1="330" y1="160" x2="350" y2="180"/><line x1="350" y1="160" x2="330" y2="180"/>
  </g>
  <line x1="354" y1="162" x2="424" y2="128" stroke="#e53935" stroke-width="1.2"/>
  <text x="428" y="126" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="bold" fill="#c62828">故障 1：线圈 A1 端子接触不良</text>

  <!-- 故障 2 标记：KM1 常开 COM 端子（支路左端） -->
  <circle cx="215" cy="88" r="16" fill="none" stroke="#e53935" stroke-width="2.4" stroke-dasharray="5 3"/>
  <g stroke="#e53935" stroke-width="3">
    <line x1="205" y1="78" x2="225" y2="98"/><line x1="225" y1="78" x2="205" y2="98"/>
  </g>
  <line x1="230" y1="84" x2="424" y2="66" stroke="#e53935" stroke-width="1.2"/>
  <text x="428" y="64" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="bold" fill="#c62828">故障 2：KM1 常开 COM 端子接触不良</text>

  <!-- 右侧说明 -->
  <rect x="428" y="180" width="440" height="104" rx="6" fill="#ffffff" stroke="#ef9a9a" stroke-width="1.4"/>
  <text x="442" y="202" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="bold" fill="#c62828">故障 1 现象与排查</text>
  <text x="442" y="224" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">现象：按 SB2 接触器不吸合（或吸合即释放），线圈两端没有 220V。</text>
  <text x="442" y="244" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">排查：万用表 ACV 档测 A1—A2；测 A1 到 FR 端子是否断线或松动。</text>
  <text x="442" y="264" font-family="Microsoft YaHei, Arial" font-size="11" fill="#546e7a">处理：断电后紧固 A1 端子导线。</text>

  <rect x="428" y="296" width="440" height="104" rx="6" fill="#ffffff" stroke="#ef9a9a" stroke-width="1.4"/>
  <text x="442" y="318" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="bold" fill="#c62828">故障 2 现象与排查</text>
  <text x="442" y="340" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">现象：按 SB2 能起动；松开 SB2 立即停机 —— 自锁支路不通。</text>
  <text x="442" y="360" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">排查：断电后用 RES 档测 COM—NO 是否导通（按下接触器时应通）。</text>
  <text x="442" y="380" font-family="Microsoft YaHei, Arial" font-size="11" fill="#546e7a">处理：紧固 COM 端子导线，恢复自锁。</text>

  <text x="70" y="424" font-family="Microsoft YaHei, Arial" font-size="11" fill="#546e7a">两处故障都表现为“接触不良”：时通时断，可用万用表逐段测量电压/电阻定位。</text>
</svg>
