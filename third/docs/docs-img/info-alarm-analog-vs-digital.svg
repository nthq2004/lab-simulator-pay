<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <style>
      .tb { font-size:12.5px; font-weight:bold; fill:#1b3a4b; }
      .t  { font-size:10.5px; fill:#22303a; }
      .ts { font-size:10px; fill:#5b666d; }
      .hdr{ fill:#dfe5e8; stroke:#8b959c; stroke-width:1; }
      .colA{ fill:#f4f8fb; stroke:#c6d3dd; stroke-width:1; }
      .colB{ fill:#fbf7ef; stroke:#ddd0b4; stroke-width:1; }
      .grp{ fill:#f7f9fa; stroke:#a8b0b5; stroke-width:1.2; }
    </style>
  </defs>

  <text x="24" y="30" class="tb" font-size="17">图 4　模拟量报警与开关量报警的对照</text>

  <!-- 表头 -->
  <rect x="40" y="52" width="960" height="32" class="hdr"/>
  <text x="52" y="73" class="tb" font-size="11.5">项目</text>
  <text x="212" y="73" class="tb" font-size="11.5">模拟量报警（Analog）</text>
  <text x="632" y="73" class="tb" font-size="11.5">开关量报警（Digital）</text>

  <!-- 行 -->
  <rect x="40" y="84" width="160" height="52" class="hdr"/>
  <text x="52" y="115" class="t" font-weight="bold">信号</text>
  <rect x="200" y="84" width="420" height="52" class="colA"/>
  <text x="212" y="115" class="t">连续量：压力、温度、液位、流量</text>
  <rect x="620" y="84" width="380" height="52" class="colB"/>
  <text x="632" y="115" class="t">触点通断：压力／液位开关、跳闸触点</text>

  <rect x="40" y="136" width="160" height="52" class="hdr"/>
  <text x="52" y="167" class="t" font-weight="bold">Function</text>
  <rect x="200" y="136" width="420" height="52" class="colA"/>
  <text x="212" y="167" class="t">类型＋I＋方向，如 PIAL、TIAH</text>
  <rect x="620" y="136" width="380" height="52" class="colB"/>
  <text x="632" y="167" class="t">固定 XA（接受外来开关信号）</text>

  <rect x="40" y="188" width="160" height="52" class="hdr"/>
  <text x="52" y="219" class="t" font-weight="bold">Value</text>
  <rect x="200" y="188" width="420" height="52" class="colA"/>
  <text x="212" y="219" class="t">实测工程值，如 0.15 MPa</text>
  <rect x="620" y="188" width="380" height="52" class="colB"/>
  <text x="632" y="219" class="t">1＝触点动作（报警）　0＝正常</text>

  <rect x="40" y="240" width="160" height="52" class="hdr"/>
  <text x="52" y="271" class="t" font-weight="bold">设定值与死区</text>
  <rect x="200" y="240" width="420" height="52" class="colA"/>
  <text x="212" y="271" class="t">有：Limit、Deadband，可在参数界面改</text>
  <rect x="620" y="240" width="380" height="52" class="colB"/>
  <text x="632" y="271" class="t">无：动作值由现场开关本身整定</text>

  <rect x="40" y="292" width="160" height="52" class="hdr"/>
  <text x="52" y="323" class="t" font-weight="bold">参数界面项</text>
  <rect x="200" y="292" width="420" height="52" class="colA"/>
  <text x="212" y="323" class="t">Is Alarm、Is Inhibit、Limit、Deadband、Delay Time</text>
  <rect x="620" y="292" width="380" height="52" class="colB"/>
  <text x="632" y="323" class="t">Is Alarm、Is Inhibit、Delay Time 三项</text>

  <rect x="40" y="344" width="160" height="52" class="hdr"/>
  <text x="52" y="375" class="t" font-weight="bold">报警文字</text>
  <rect x="200" y="344" width="420" height="52" class="colA"/>
  <text x="212" y="375" class="t">HIGH／LOW；恢复显示 Returned(HIGH/LOW)</text>
  <rect x="620" y="344" width="380" height="52" class="colB"/>
  <text x="632" y="375" class="t">ALARM；恢复显示 Returned(ALARM)</text>

  <rect x="40" y="396" width="160" height="52" class="hdr"/>
  <text x="52" y="427" class="t" font-weight="bold">本仿真示教例</text>
  <rect x="200" y="396" width="420" height="52" class="colA"/>
  <text x="212" y="427" class="t">ME-LO-P：0.25 MPa、死区 0.02、延时 3 s</text>
  <rect x="620" y="396" width="380" height="52" class="colB"/>
  <text x="632" y="427" class="t">ME-LO-PUMP-F 延时 2 s；低压开关 1 s</text>

  <!-- 相同点 -->
  <rect x="40" y="464" width="960" height="76" class="grp" rx="5"/>
  <text x="56" y="486" class="tb">相同点（判读时不用区分类型）</text>
  <text x="56" y="508" class="t">未确认：闪＋鸣 → 按 确认 ACK：常亮、停响，报警条仍在 → 故障真正消失：才进入报警历史。</text>
  <text x="56" y="528" class="t">都可闭锁（Is Inhibit）、都可设延时（Delay Time）、都能在参数界面用 Acknowledge 单独确认。</text>
</svg>
