  <text x="34" y="306" font-size="10.5" fill="#ecf0f1">MOD:AUTO | 档位:100V|5V|5V | 时基:1x | RUNNING</text>

  <!-- 万用表 -->
  <rect x="588" y="64" width="118" height="188" rx="18" fill="#444" stroke="#00ced1" stroke-width="7"/>
  <rect x="608" y="84" width="78" height="54" rx="4" fill="#c5ccb7" stroke="#222" stroke-width="1.5"/>
  <text x="646" y="124" text-anchor="middle" font-size="21" font-weight="bold" fill="#222" font-family="monospace">5.04</text>
  <text x="676" y="132" font-size="10" fill="#222">V</text>
  <text x="647" y="162" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">DCV 20 档</text>
  <text x="647" y="180" text-anchor="middle" font-size="10" fill="#ffffff">红笔 → VΩ▶|</text>
  <text x="647" y="194" text-anchor="middle" font-size="10" fill="#ffffff">黑笔 → COM</text>
  <text x="647" y="218" text-anchor="middle" font-size="10.5" fill="#ffd54f">跨接负载 RL 两端</text>

  <rect x="726" y="64" width="234" height="252" rx="8" fill="#ffffff" stroke="#90a4ae" stroke-width="1.4"/>
  <text x="744" y="86" font-size="12.5" font-weight="bold" fill="#263238">四个测点</text>
  <line x1="744" y1="90" x2="942" y2="90" stroke="#cfd8dc"/>

  <circle cx="748" cy="100" r="7" fill="#f1c40f"/>
  <text x="762" y="104" font-size="12" font-weight="bold" fill="#263238">CH1</text>
  <text x="820" y="104" font-size="11" fill="#37474f">变压器原边 p1–p2</text>
  <text x="762" y="122" font-size="10.8" font-weight="bold" fill="#c62828">100 V/格</text>
  <text x="860" y="122" font-size="10.8" fill="#546e7a">220 V 正弦</text>
  <circle cx="748" cy="154" r="7" fill="#3498db"/>
  <text x="762" y="158" font-size="12" font-weight="bold" fill="#263238">CH2</text>
  <text x="820" y="158" font-size="11" fill="#37474f">变压器副边 s1–s2</text>
  <text x="762" y="176" font-size="10.8" font-weight="bold" fill="#c62828">5 V/格</text>
  <text x="860" y="176" font-size="10.8" fill="#546e7a">12 V 正弦</text>
  <circle cx="748" cy="208" r="7" fill="#e74c3c"/>
  <text x="762" y="212" font-size="12" font-weight="bold" fill="#263238">CH3</text>
  <text x="820" y="212" font-size="11" fill="#37474f">滤波电容 C1 两端</text>
  <text x="762" y="230" font-size="10.8" font-weight="bold" fill="#c62828">5 V/格</text>
  <text x="860" y="230" font-size="10.8" fill="#546e7a">≈17 V 直流</text>
  <circle cx="748" cy="262" r="7" fill="#00ced1"/>
  <text x="762" y="266" font-size="12" font-weight="bold" fill="#263238">万用表</text>
  <text x="820" y="266" font-size="11" fill="#37474f">负载 RL 两端</text>
  <text x="762" y="284" font-size="10.8" font-weight="bold" fill="#c62828">DCV 20 档</text>
  <text x="860" y="284" font-size="10.8" fill="#546e7a">5.04 V</text>

  <rect x="20" y="332" width="940" height="112" rx="8" fill="#ffffff" stroke="#90a4ae" stroke-width="1.4"/>
  <text x="38" y="356" font-size="12" font-weight="bold" fill="#263238">操作顺序</text>
  <text x="110" y="356" font-size="11.5" fill="#37474f">「选择仪表」勾选三路示波器 → 逐根接探头（CH1 原边、CH2 副边、CH3 电容）→ 按 CHx 档调档位 → 再用数字万用表 DCV 20 档跨接负载读数。</text>
  <text x="38" y="384" font-size="11.5" fill="#37474f"><tspan font-weight="bold" fill="#c62828">档位选大了</tspan>：波形挤成一条平线，看不出细节；<tspan font-weight="bold" fill="#c62828">档位选小了</tspan>：波形顶到边框被切掉，读不出峰值。</text>
  <text x="38" y="408" font-size="11.5" fill="#37474f">按「CHx 档」循环换档，让波形的峰约占 3~4 格最清楚；本工程演示时由程序自动采样峰值后自动挑档。</text>
  <text x="38" y="432" font-size="11.5" fill="#c62828">注意：示波器地夹一定要接在被测点的“公共端”（本电路为 GND），否则波形会叠加共模电压而失真。</text>
</svg>
