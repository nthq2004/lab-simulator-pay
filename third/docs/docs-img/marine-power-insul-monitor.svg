<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect width="960" height="380" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b3a5c">图 3  绝缘监视仪：由泄漏电流反算绝缘电阻，为什么读数会随绝缘下降而变小</text>

  <!-- 测量回路 -->
  <g>
    <text x="90" y="80" font-size="12" fill="#334">低频测量脉冲源 U</text>
    <!-- 电源符号 -->
    <circle cx="150" cy="125" r="18" fill="#eaf3fb" stroke="#2c6ea8" stroke-width="2"/>
    <text x="150" y="131" text-anchor="middle" font-size="13" fill="#1b3a5c">~</text>
    <text x="150" y="163" text-anchor="middle" font-size="10" fill="#667">U（内部注入）</text>

    <!-- 内部电阻 -->
    <rect x="250" y="112" width="86" height="26" rx="3" fill="#fdf7e6" stroke="#b58a22" stroke-width="1.6"/>
    <text x="293" y="130" text-anchor="middle" font-size="11" fill="#7a5a10">仪表内阻 R0</text>

    <!-- 被测绝缘 -->
    <rect x="420" y="112" width="110" height="26" rx="3" fill="#fff5f5" stroke="#c0392b" stroke-width="1.8"/>
    <text x="475" y="130" text-anchor="middle" font-size="11" fill="#8e2c20">被测绝缘电阻 Rx</text>

    <!-- 电流表 -->
    <circle cx="590" cy="125" r="16" fill="#f2f8ff" stroke="#2c6ea8" stroke-width="2"/>
    <text x="590" y="130" text-anchor="middle" font-size="11" fill="#1b3a5c">A</text>
    <text x="590" y="160" text-anchor="middle" font-size="10" fill="#667">泄漏电流 I</text>

    <line x1="168" y1="125" x2="250" y2="125" stroke="#333" stroke-width="1.6"/>
    <line x1="336" y1="125" x2="420" y2="125" stroke="#333" stroke-width="1.6"/>
    <line x1="530" y1="125" x2="574" y2="125" stroke="#333" stroke-width="1.6"/>
    <line x1="606" y1="125" x2="680" y2="125" stroke="#333" stroke-width="1.6"/>
    <line x1="680" y1="125" x2="680" y2="196" stroke="#333" stroke-width="1.6"/>

    <!-- 地 -->
    <line x1="640" y1="196" x2="720" y2="196" stroke="#444" stroke-width="2"/>
    <line x1="652" y1="204" x2="708" y2="204" stroke="#444" stroke-width="2"/>
    <line x1="664" y1="212" x2="696" y2="212" stroke="#444" stroke-width="2"/>
    <text x="732" y="201" font-size="10" fill="#444">船体地</text>

    <!-- 电网 -->
    <rect x="370" y="50" width="20" height="50" rx="3" fill="#f4fbf5" stroke="#3a8b4a" stroke-width="1.4"/>
    <line x1="380" y1="100" x2="380" y2="125" stroke="#3a8b4a" stroke-width="1.4"/>
    <circle cx="380" cy="125" r="3" fill="#3a8b4a"/>
    <text x="400" y="66" font-size="11" fill="#26622f">被监视的动力电网（三相，经耦合注入）</text>

    <line x1="150" y1="143" x2="150" y2="196" stroke="#333" stroke-width="1.6"/>
    <line x1="110" y1="196" x2="190" y2="196" stroke="#444" stroke-width="2"/>
    <line x1="122" y1="204" x2="178" y2="204" stroke="#444" stroke-width="2"/>
    <line x1="134" y1="212" x2="166" y2="212" stroke="#444" stroke-width="2"/>
    <text x="200" y="201" font-size="10" fill="#444">地</text>
  </g>

  <!-- 公式与结论 -->
  <g>
    <rect x="80" y="245" width="380" height="112" rx="6" fill="#f7f9fb" stroke="#2c6ea8" stroke-width="1.6"/>
    <text x="100" y="270" font-size="12" font-weight="bold" fill="#1b3a5c">测量原理</text>
    <text x="100" y="294" font-size="12" fill="#334">I = U / (R0 + Rx)</text>
    <text x="100" y="316" font-size="12" fill="#334">Rx = U / I − R0</text>
    <text x="100" y="340" font-size="11" fill="#667">仪表测得 I（已知 U、R0）即可换算出 Rx。</text>

    <rect x="490" y="245" width="390" height="112" rx="6" fill="#fffaf0" stroke="#b58a22" stroke-width="1.6"/>
    <text x="510" y="270" font-size="12" font-weight="bold" fill="#7a5a10">读数变化规律</text>
    <text x="510" y="294" font-size="12" fill="#334">绝缘下降 → Rx 变小 → I 变大 → 读数变小</text>
    <text x="510" y="316" font-size="12" fill="#334">绝缘良好 → Rx 很大 → I 很小 → 读数「∞」</text>
    <text x="510" y="340" font-size="11" fill="#8e2c20">读数低于阈值（0.1 MΩ）→ 声光报警</text>
  </g>

  <text x="480" y="374" text-anchor="middle" font-size="11" fill="#667">「注入脉冲」只为测量提供小信号，不向电网输送有功功率</text>
</svg>
