<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="Microsoft YaHei, Arial">
  <rect width="1000" height="460" fill="#f7f9f8"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">主开关的三个工作位（可抽拉式框架断路器）</text>

  <!-- 连接位 -->
  <g>
    <rect x="40" y="60" width="290" height="330" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
    <text x="185" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">连接位（Connected / 工作位）</text>
    <circle cx="185" cy="160" r="46" fill="#141414" stroke="#9aa0a0" stroke-width="2"/>
    <rect x="181" y="122" width="8" height="76" fill="#ffffff" rx="3"/>
    <circle cx="185" cy="160" r="4" fill="#ffffff"/>
    <text x="185" y="228" text-anchor="middle" font-size="12" fill="#546e7a">指示条竖直向上</text>
    <text x="60" y="262" font-size="12.5" fill="#37474f">主回路：与汇流排、发电机接通</text>
    <text x="60" y="286" font-size="12.5" fill="#37474f">控制回路：线圈全部通电</text>
    <text x="60" y="310" font-size="12.5" fill="#37474f">可储能、合闸、分闸、接受保护</text>
    <rect x="60" y="330" width="250" height="42" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="185" y="356" text-anchor="middle" font-size="12" fill="#1b5e20">正常送电运行的位置</text>
  </g>

  <!-- 试验位 -->
  <g>
    <rect x="355" y="60" width="290" height="330" rx="8" fill="#ffffff" stroke="#ef6c00" stroke-width="2"/>
    <text x="500" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">试验位（Test）</text>
    <circle cx="500" cy="160" r="46" fill="#141414" stroke="#9aa0a0" stroke-width="2"/>
    <rect x="496" y="122" width="8" height="76" fill="#ffffff" rx="3" transform="rotate(45 500 160)"/>
    <circle cx="500" cy="160" r="4" fill="#ffffff"/>
    <text x="500" y="228" text-anchor="middle" font-size="12" fill="#546e7a">指示条偏右 45°</text>
    <text x="375" y="262" font-size="12.5" fill="#37474f">主回路：与母排、发电机断开</text>
    <text x="375" y="286" font-size="12.5" fill="#37474f">控制回路：线圈仍通电</text>
    <text x="375" y="310" font-size="12.5" fill="#37474f">可做储能/合闸/分闸动作试验</text>
    <rect x="375" y="330" width="250" height="42" rx="6" fill="#fff3e0" stroke="#ef6c00"/>
    <text x="500" y="356" text-anchor="middle" font-size="12" fill="#e65100">不带电，试验机构与控制功能</text>
  </g>

  <!-- 断开位 -->
  <g>
    <rect x="670" y="60" width="290" height="330" rx="8" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
    <text x="815" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#b71c1c">断开位（Disconnected / 检修位）</text>
    <circle cx="815" cy="160" r="46" fill="#141414" stroke="#9aa0a0" stroke-width="2"/>
    <rect x="811" y="122" width="8" height="76" fill="#ffffff" rx="3" transform="rotate(90 815 160)"/>
    <circle cx="815" cy="160" r="4" fill="#ffffff"/>
    <text x="815" y="228" text-anchor="middle" font-size="12" fill="#546e7a">指示条水平</text>
    <text x="690" y="262" font-size="12.5" fill="#37474f">主回路：完全断开</text>
    <text x="690" y="286" font-size="12.5" fill="#37474f">控制回路：线圈全部断电</text>
    <text x="690" y="310" font-size="12.5" fill="#37474f">开关完全不带电，可抽出检修</text>
    <rect x="690" y="330" width="250" height="42" rx="6" fill="#ffebee" stroke="#c62828"/>
    <text x="815" y="356" text-anchor="middle" font-size="12" fill="#b71c1c">检修、更换触头的安全位置</text>
  </g>

  <text x="500" y="422" text-anchor="middle" font-size="13" fill="#37474f">手摇圆盘操作：<tspan font-weight="bold">点右半区顺时针</tspan>（连接 → 试验 → 断开），<tspan font-weight="bold">点左半区逆时针</tspan>（断开 → 试验 → 连接），每 3 次点击换一档，到端点不循环</text>
</svg>
