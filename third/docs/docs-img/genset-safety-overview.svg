<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="'Microsoft YaHei','Source Han Sans SC',sans-serif">
  <rect width="1120" height="500" fill="#ffffff"/>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f7d95"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f8fe0"/>
    </marker>
  </defs>

  <text x="560" y="30" font-size="17" font-weight="bold" fill="#1f2d3d" text-anchor="middle">船舶柴油发电机组（副机）安全保护系统组成</text>

  <!-- 机旁控制面板 -->
  <rect x="30" y="60" width="290" height="150" rx="6" fill="#22313f" stroke="#0e1a24" stroke-width="2"/>
  <text x="175" y="86" font-size="13" font-weight="bold" fill="#e8f2fb" text-anchor="middle">机旁控制面板 ENGINE CONTROL UNIT</text>
  <rect x="46" y="98" width="120" height="26" rx="3" fill="#0f2b3d" stroke="#3b5a70"/>
  <text x="106" y="116" font-size="11" fill="#8fd3ff" text-anchor="middle">运行 / 跳闸指示灯</text>
  <rect x="176" y="98" width="128" height="26" rx="3" fill="#0f2b3d" stroke="#3b5a70"/>
  <text x="240" y="116" font-size="11" fill="#8fd3ff" text-anchor="middle">BLOCK/LOCAL/REMOTE</text>
  <rect x="46" y="132" width="80" height="26" rx="3" fill="#1b6b2e" stroke="#0e4a1f"/>
  <text x="86" y="150" font-size="11" fill="#ffffff" text-anchor="middle">ENG.START</text>
  <rect x="132" y="132" width="80" height="26" rx="3" fill="#a12622" stroke="#6d1512"/>
  <text x="172" y="150" font-size="11" fill="#ffffff" text-anchor="middle">ENG.STOP</text>
  <rect x="218" y="132" width="86" height="26" rx="3" fill="#1e6fb8" stroke="#0b2b45"/>
  <text x="261" y="150" font-size="11" fill="#ffffff" text-anchor="middle">RESET</text>
  <text x="175" y="186" font-size="11" fill="#9fc0d8" text-anchor="middle">起动 / 停车 / 复位 / 灯测试</text>

  <!-- 柴油发电机组 -->
  <rect x="30" y="240" width="290" height="160" rx="6" fill="#f7f9fa" stroke="#c3ccd3" stroke-width="2"/>
  <text x="175" y="264" font-size="13" font-weight="bold" fill="#0b3d91" text-anchor="middle">柴油发电机组</text>
  <rect x="52" y="280" width="110" height="60" rx="4" fill="#2a5fa8" stroke="#173b6b" stroke-width="1.6"/>
  <text x="107" y="315" font-size="12" fill="#ffffff" text-anchor="middle">柴油机</text>
  <circle cx="228" cy="310" r="34" fill="#dde4e9" stroke="#4a5560" stroke-width="1.8"/>
  <text x="228" y="315" font-size="12" fill="#22313f" text-anchor="middle">发电机</text>
  <path d="M162 310 L194 310" fill="none" stroke="#7b8792" stroke-width="4"/>
  <text x="175" y="362" font-size="11" fill="#5a6b78" text-anchor="middle">盘车机构 · 闭锁手柄 · 压缩空气起动</text>
  <text x="175" y="382" font-size="11" fill="#5a6b78" text-anchor="middle">转速传感器 / PT / PT100</text>

  <!-- 安全保护模块 -->
  <rect x="360" y="60" width="330" height="240" rx="6" fill="#fdf6f5" stroke="#c0392b" stroke-width="2"/>
  <text x="525" y="86" font-size="13" font-weight="bold" fill="#8e1b1b" text-anchor="middle">安全保护模块 SAFETY MODULE</text>
  <rect x="378" y="98" width="294" height="52" rx="4" fill="#ffffff" stroke="#e0a3a0"/>
  <text x="392" y="118" font-size="12" font-weight="bold" fill="#8e1b1b">① 超速保护</text>
  <text x="392" y="137" font-size="11.5" fill="#33475b">1725 r/min（115 %）· 无延时立即跳闸</text>
  <rect x="378" y="158" width="294" height="52" rx="4" fill="#ffffff" stroke="#e0a3a0"/>
  <text x="392" y="178" font-size="12" font-weight="bold" fill="#8e1b1b">② 滑油低压保护</text>
  <text x="392" y="197" font-size="11.5" fill="#33475b">1.5 bar · 确认延时 4 s</text>
  <rect x="378" y="218" width="294" height="52" rx="4" fill="#ffffff" stroke="#e0a3a0"/>
  <text x="392" y="238" font-size="12" font-weight="bold" fill="#8e1b1b">③ 冷却水高温保护</text>
  <text x="392" y="257" font-size="11.5" fill="#33475b">95 ℃ · 确认延时 6 s</text>

  <!-- 停机执行链 -->
  <rect x="740" y="60" width="350" height="240" rx="6" fill="#eef4fa" stroke="#3b82c4" stroke-width="2"/>
  <text x="915" y="86" font-size="13" font-weight="bold" fill="#124a7a" text-anchor="middle">停机执行链 SHUTDOWN CHAIN</text>
  <rect x="766" y="100" width="130" height="46" rx="4" fill="#ffffff" stroke="#3b82c4"/>
  <text x="831" y="128" font-size="12" fill="#124a7a" text-anchor="middle">停机继电器</text>
  <rect x="936" y="100" width="130" height="46" rx="4" fill="#ffffff" stroke="#3b82c4"/>
  <text x="1001" y="128" font-size="12" fill="#124a7a" text-anchor="middle">停机电磁阀</text>
  <path d="M896 123 L930 123" fill="none" stroke="#3b82c4" stroke-width="2.4" marker-end="url(#a3)"/>
  <rect x="766" y="186" width="130" height="46" rx="4" fill="#ffffff" stroke="#3b82c4"/>
  <text x="831" y="214" font-size="12" fill="#124a7a" text-anchor="middle">燃油切断</text>
  <rect x="936" y="186" width="130" height="46" rx="4" fill="#ffffff" stroke="#3b82c4"/>
  <text x="1001" y="214" font-size="12" fill="#124a7a" text-anchor="middle">柴油机停车</text>
  <path d="M1001 146 L1001 180" fill="none" stroke="#3b82c4" stroke-width="2.4" marker-end="url(#a3)"/>
  <path d="M896 209 L930 209" fill="none" stroke="#3b82c4" stroke-width="2.4" marker-end="url(#a3)"/>
  <text x="915" y="262" font-size="11.5" fill="#5a6b78" text-anchor="middle">齿条拉到 0 位 → 断油 → 转速下降至 0</text>
  <text x="915" y="282" font-size="11.5" fill="#8e1b1b" text-anchor="middle">跳闸锁存，须先排除越限再按 RESET</text>

  <!-- 安保测试工具箱 -->
  <rect x="360" y="330" width="330" height="140" rx="6" fill="#f4f8fc" stroke="#5b9bd5" stroke-width="2"/>
  <text x="525" y="354" font-size="13" font-weight="bold" fill="#124a7a" text-anchor="middle">安保测试工具箱</text>
  <text x="525" y="378" font-size="11.5" fill="#33475b" text-anchor="middle">频率发生器（模拟转速）</text>
  <text x="525" y="398" font-size="11.5" fill="#33475b" text-anchor="middle">手动泵压模块（模拟油压）</text>
  <text x="525" y="418" font-size="11.5" fill="#33475b" text-anchor="middle">电阻箱 / 干式温度校验炉（模拟温度）</text>
  <text x="525" y="446" font-size="11" fill="#8a6c42" text-anchor="middle">向保护模块送入模拟信号，验证三路保护</text>

  <!-- 辅助系统 -->
  <rect x="740" y="330" width="350" height="140" rx="6" fill="#f7fbf7" stroke="#7ba77b" stroke-width="2"/>
  <text x="915" y="354" font-size="13" font-weight="bold" fill="#2f5d2f" text-anchor="middle">被保护对象 / 辅助系统</text>
  <text x="915" y="378" font-size="11.5" fill="#33475b" text-anchor="middle">滑油系统：滑油柜 · 机带泵 · 预润滑泵 · 滤器 · 冷却器</text>
  <text x="915" y="398" font-size="11.5" fill="#33475b" text-anchor="middle">高温淡水：机带泵 · 三通调温阀 · 冷却器</text>
  <text x="915" y="418" font-size="11.5" fill="#33475b" text-anchor="middle">低温淡水：空冷器 · 中央冷却器</text>
  <text x="915" y="438" font-size="11.5" fill="#33475b" text-anchor="middle">起动空气：空压机 · 空气瓶 · 起动空气阀</text>

  <!-- 箭头 -->
  <path d="M320 300 L342 300 L342 282 L356 282" fill="none" stroke="#5f7d95" stroke-width="2.2" marker-end="url(#a1)"/>
  <text x="336" y="272" font-size="10.5" fill="#5f7d95" text-anchor="middle">信号</text>
  <path d="M690 180 L736 180" fill="none" stroke="#5f7d95" stroke-width="2.2" marker-end="url(#a1)"/>
  <text x="713" y="170" font-size="10.5" fill="#5f7d95" text-anchor="middle">跳闸命令</text>
  <path d="M525 330 L525 306" fill="none" stroke="#2f8fe0" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a3)"/>
  <text x="560" y="322" font-size="10.5" fill="#2f8fe0" text-anchor="middle">模拟信号</text>
  <path d="M915 330 L915 316 L650 316 L650 304" fill="none" stroke="#5f7d95" stroke-width="2.2" marker-end="url(#a1)"/>
  <text x="800" y="309" font-size="10.5" fill="#5f7d95" text-anchor="middle">被监视（油压 / 水温 / 转速）</text>
</svg>
