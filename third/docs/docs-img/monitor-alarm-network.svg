<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="na" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4a5a66"/>
    </marker>
    <style>
      .z  { fill:#f7f9fa; stroke:#a8b0b5; stroke-width:1.2; }
      .box{ fill:#ffffff; stroke:#8b959c; stroke-width:1.3; }
      .t  { font-size:12.5px; fill:#22303a; }
      .tb { font-size:15px; font-weight:bold; fill:#1b3a4b; }
      .ts { font-size:11.5px; fill:#5b666d; }
      .can3 { stroke:#e01b1b; stroke-width:3.2; fill:none; }
      .eth  { stroke:#1e90ff; stroke-width:2.4; fill:none; }
      .can12{ stroke:#00a020; stroke-width:2.6; fill:none; }
      .can2 { stroke:#00a020; stroke-width:2.6; fill:none; stroke-dasharray:10 6; }
    </style>
  </defs>

  <text x="24" y="28" class="tb" font-size="17">图 4　K-Chief 600 现场总线型网络结构（上层以太网 ＋ 下层 CAN 现场总线）</text>

  <!-- 住舱 / 驾驶台 -->
  <rect x="24" y="44" width="1072" height="126" class="z" rx="6"/>
  <text x="36" y="66" class="tb">住舱</text>
  <text x="430" y="66" class="tb">驾驶台</text>

  <rect x="60" y="76" width="120" height="34" class="box" rx="3"/><text x="70" y="98" class="t">WCU 值班单元</text>
  <rect x="60" y="118" width="120" height="34" class="box" rx="3"/><text x="70" y="140" class="t">WCU 值班单元</text>
  <rect x="230" y="76" width="140" height="76" class="box" rx="3"/><text x="240" y="104" class="t">OS 操作站</text><text x="240" y="126" class="ts">住舱值班显示</text>

  <rect x="440" y="76" width="130" height="60" class="box" rx="3"/><text x="450" y="102" class="t">WBU</text><text x="450" y="122" class="ts">驾驶台值班单元</text>
  <rect x="600" y="76" width="140" height="76" class="box" rx="3"/><text x="610" y="104" class="t">OS 操作站</text><text x="610" y="126" class="ts">驾驶台</text>

  <!-- CAN Bus 3 -->
  <path class="can3" d="M60,168 L790,168"/>
  <text x="820" y="172" class="t" fill="#e01b1b">CAN Bus 3（值班召唤 / 延伸报警）</text>
  <path class="can3" d="M120,152 L120,168" /><path class="can3" d="M505,136 L505,168" /><path class="can3" d="M300,152 L300,168"/>
  <path class="can3" d="M670,152 L670,168"/>

  <!-- 集控室 -->
  <rect x="24" y="196" width="1072" height="150" class="z" rx="6"/>
  <text x="36" y="218" class="tb">集控室</text>

  <rect x="60" y="230" width="160" height="86" class="box" rx="3"/>
  <text x="70" y="254" class="t">OS / SGW（主）</text>
  <text x="70" y="276" class="ts">操作站 ＋ 网关</text>
  <text x="70" y="298" class="ts">直连 CAN Bus 1</text>

  <rect x="250" y="230" width="140" height="86" class="box" rx="3"/>
  <text x="260" y="254" class="t">OS / SGW（备）</text>
  <text x="260" y="276" class="ts">冗余操作站</text>
  <text x="260" y="298" class="ts">接 CAN Bus 2</text>

  <rect x="420" y="240" width="110" height="60" class="box" rx="3"/><text x="430" y="266" class="t">Printer</text><text x="430" y="286" class="ts">报警打印</text>
  <rect x="560" y="240" width="100" height="60" class="box" rx="3"/><text x="570" y="266" class="t">UPS</text><text x="570" y="286" class="ts">不间断电源</text>
  <rect x="690" y="230" width="170" height="86" class="box" rx="3"/>
  <text x="700" y="254" class="t">CAN Bus 3 段</text>
  <text x="700" y="276" class="ts">经 SGW 与值班召唤</text>
  <text x="700" y="298" class="ts">单元互联</text>

  <!-- Ethernet 1 / 2 -->
  <path class="eth" d="M140,316 L140,346 L700,346 L700,316"/>
  <text x="330" y="342" class="t" fill="#1565c0">Ethernet 1 / Ethernet 2（上层局域网：OS ↔ SGW ↔ Printer ↔ UPS）</text>
  <path class="eth" d="M300,196 L300,180" stroke-dasharray="8 5"/>
  <path class="eth" d="M140,196 L140,180" stroke-dasharray="8 5"/>

  <!-- 机舱 -->
  <rect x="24" y="368" width="1072" height="232" class="z" rx="6"/>
  <text x="36" y="390" class="tb">机舱（dPSC 分布式处理单元）</text>

  <!-- CAN Bus 1 / 2 -->
  <path class="can12" d="M90,414 L1040,414"/>
  <text x="60" y="410" class="t" fill="#007a18">CAN Bus 1（主用）</text>
  <path class="can2" d="M90,440 L1040,440"/>
  <text x="60" y="436" class="t" fill="#007a18">CAN Bus 2（备用冗余）</text>
  <path class="can12" d="M140,316 L140,414"/>
  <path class="can2" d="M300,316 L300,440" stroke-dasharray="10 6"/>

  <!-- 模块 -->
  <g>
    <rect x="90" y="470" width="130" height="66" class="box" rx="3"/>
    <text x="100" y="492" class="t">RDi-32</text><text x="100" y="512" class="ts">数字量输入 32 点</text><text x="100" y="528" class="ts">压力/液位开关等</text>
    <path class="can12" d="M155,462 L155,414"/>

    <rect x="240" y="470" width="130" height="66" class="box" rx="3"/>
    <text x="250" y="492" class="t">RDo-16</text><text x="250" y="512" class="ts">数字量输出 16 点</text><text x="250" y="528" class="ts">指示灯 / 继电器</text>
    <path class="can2" d="M305,462 L305,440" stroke-dasharray="10 6"/>

    <rect x="390" y="470" width="130" height="66" class="box" rx="3"/>
    <text x="400" y="492" class="t">RAi-16</text><text x="400" y="512" class="ts">模拟量输入 16 点</text><text x="400" y="528" class="ts">4~20 mA 压力等</text>
    <path class="can12" d="M455,462 L455,414"/>

    <rect x="540" y="470" width="130" height="66" class="box" rx="3"/>
    <text x="550" y="492" class="t">RAi-10tc</text><text x="550" y="512" class="ts">温度输入（热偶/热阻）</text><text x="550" y="528" class="ts">排气/缸套水温度</text>
    <path class="can2" d="M605,462 L605,440" stroke-dasharray="10 6"/>

    <rect x="690" y="470" width="130" height="66" class="box" rx="3"/>
    <text x="700" y="492" class="t">RAo-8</text><text x="700" y="512" class="ts">模拟量输出 8 点</text><text x="700" y="528" class="ts">调阀 / 变频给定</text>
    <path class="can12" d="M755,462 L755,414"/>

    <rect x="840" y="470" width="120" height="66" class="box" rx="3"/>
    <text x="850" y="492" class="t">RIO-C4</text><text x="850" y="512" class="ts">远程 I/O</text><text x="850" y="528" class="ts">综合采集</text>
    <path class="can2" d="M900,462 L900,440" stroke-dasharray="10 6"/>

    <rect x="980" y="470" width="100" height="66" class="box" rx="3"/>
    <text x="990" y="492" class="t">LOS</text><text x="990" y="512" class="ts">机旁操作站</text>
    <path class="can12" d="M1030,462 L1030,414"/>
  </g>

  <text x="40" y="566" class="t">① 机舱测点就近接入 dPSC 模块（模拟量/温度/开关量），经 CAN Bus 1（主）与 CAN Bus 2（备）冗余上传；</text>
  <text x="40" y="588" class="t">② 集控室主 OS/SGW 直连 CAN Bus 1、备 OS 接 CAN Bus 2，两级网络由 SGW 网关转换；</text>
  <text x="40" y="610" class="t">③ 住舱/驾驶台的 OS、WCU、WBU 通过 Ethernet 1/2 与 CAN Bus 3 互联，实现延伸报警与值班召唤。</text>
</svg>
