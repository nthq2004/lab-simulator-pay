<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="980" height="430" fill="#ffffff"/>
  <text x="490" y="28" font-size="17" font-weight="bold" fill="#1a252f" text-anchor="middle">图 2　纵联差动保护：出口短路与绕组内部短路的差别</text>

  <!-- ================= 左侧：出口短路 ================= -->
  <text x="245" y="62" font-size="13" font-weight="bold" fill="#2c3e50" text-anchor="middle">（a）发电机出口相间短路</text>

  <!-- 中性点 -->
  <line x1="90" y1="300" x2="400" y2="300" stroke="#34495e" stroke-width="2.4"/>
  <text x="70" y="304" font-size="10" fill="#34495e" text-anchor="end">N 中性点</text>

  <!-- 三相绕组（U/V/W 简化梯形） -->
  <path d="M110 300 L110 210 L170 190 L230 210 L230 300" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <text x="170" y="180" font-size="10" fill="#2c3e50" text-anchor="middle">定子绕组</text>

  <!-- 中性点侧 CT -->
  <circle cx="118" cy="300" r="9" fill="none" stroke="#8e44ad" stroke-width="1.6"/>
  <text x="118" y="330" font-size="10" fill="#8e44ad" text-anchor="middle">CT 入口</text>

  <!-- 机端 -->
  <line x1="230" y1="210" x2="400" y2="210" stroke="#2c3e50" stroke-width="2.4"/>
  <!-- 机端 CT -->
  <circle cx="300" cy="210" r="10" fill="none" stroke="#8e44ad" stroke-width="1.6"/>
  <text x="300" y="190" font-size="10" fill="#8e44ad" text-anchor="middle">CT 出口</text>

  <!-- 短路点 -->
  <line x1="360" y1="210" x2="360" y2="300" stroke="#c0392b" stroke-width="3"/>
  <text x="372" y="258" font-size="11" fill="#c0392b">短路点</text>

  <!-- 故障电流：同时穿过两只 CT -->
  <path d="M150 300 L150 250 M150 250 L340 250" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 3"/>
  <polygon points="340,250 330,245 330,255" fill="#c0392b"/>
  <text x="200" y="242" font-size="10" fill="#c0392b">故障电流同时穿过两只 CT</text>

  <!-- 结论 -->
  <rect x="60" y="348" width="380" height="62" rx="5" fill="#fef5f4" stroke="#c0392b" stroke-width="1.3"/>
  <text x="80" y="370" font-size="11" fill="#c0392b">I入口 ≈ I出口 → 差流 ≈ 0 → 差动保护不动</text>
  <text x="80" y="390" font-size="11" fill="#2c3e50">由机端相间短路（速断）保护瞬时跳闸</text>
  <text x="80" y="406" font-size="10" fill="#7f8c8d">差动保护只认"内部漏掉的电流"</text>

  <!-- 分隔线 -->
  <line x1="490" y1="52" x2="490" y2="410" stroke="#d5dbdb" stroke-width="1.2" stroke-dasharray="6 5"/>

  <!-- ================= 右侧：绕组中点短路 ================= -->
  <text x="735" y="62" font-size="13" font-weight="bold" fill="#2c3e50" text-anchor="middle">（b）两相绕组中点相间短路</text>

  <line x1="580" y1="300" x2="890" y2="300" stroke="#34495e" stroke-width="2.4"/>
  <text x="560" y="304" font-size="10" fill="#34495e" text-anchor="end">N 中性点</text>

  <path d="M600 300 L600 210 L660 190 L720 210 L720 300" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <text x="660" y="180" font-size="10" fill="#2c3e50" text-anchor="middle">定子绕组</text>

  <circle cx="608" cy="300" r="9" fill="none" stroke="#8e44ad" stroke-width="1.6"/>
  <text x="608" y="330" font-size="10" fill="#8e44ad" text-anchor="middle">CT 入口</text>

  <line x1="720" y1="210" x2="890" y2="210" stroke="#2c3e50" stroke-width="2.4"/>
  <circle cx="790" cy="210" r="10" fill="none" stroke="#8e44ad" stroke-width="1.6"/>
  <text x="790" y="190" font-size="10" fill="#8e44ad" text-anchor="middle">CT 出口</text>

  <!-- 中点短接（绕组内部环流） -->
  <circle cx="660" cy="255" r="4" fill="#c0392b"/>
  <circle cx="720" cy="255" r="4" fill="#c0392b"/>
  <path d="M660 255 L720 255" stroke="#c0392b" stroke-width="3" fill="none"/>
  <text x="690" y="244" font-size="10" fill="#c0392b" text-anchor="middle">绕组中点短接</text>

  <!-- 内部环流只经过入口侧 -->
  <path d="M668 262 C 690 292, 700 292, 714 262" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="760" y="278" font-size="10" fill="#e74c3c">环流只在绕组内部</text>
  <text x="760" y="292" font-size="10" fill="#e74c3c">出口 CT 测不到</text>

  <rect x="548" y="348" width="384" height="62" rx="5" fill="#fef5f4" stroke="#c0392b" stroke-width="1.3"/>
  <text x="568" y="370" font-size="11" fill="#c0392b">I入口 ≫ I出口 → 差流超定值 → 差动保护</text>
  <text x="568" y="390" font-size="11" fill="#2c3e50">0.2 s 确认后瞬时跳 qf1（本例入口 745.8 A、出口≈0）</text>
  <text x="568" y="406" font-size="10" fill="#7f8c8d">绕组内部故障只有差动保护能可靠切除</text>
</svg>
