<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="'Microsoft YaHei','Source Han Sans SC',sans-serif">
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="440" y="28" font-size="16" font-weight="bold" fill="#1f2d3d" text-anchor="middle">比例带 Fa25 与积分时间 Fa26 对调节过程的影响</text>

  <!-- 坐标轴 -->
  <path d="M80 340 L800 340" fill="none" stroke="#4a5b6b" stroke-width="1.8"/>
  <path d="M80 340 L80 70" fill="none" stroke="#4a5b6b" stroke-width="1.8"/>
  <text x="806" y="346" font-size="12" fill="#28455e" text-anchor="end">t</text>
  <text x="62" y="80" font-size="12" fill="#28455e" text-anchor="end">T</text>

  <!-- 设定值阶跃 -->
  <path d="M80 250 L180 250 L180 130 L800 130" fill="none" stroke="#8aa9c0" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="92" y="112" font-size="11" fill="#5b7f9e">设定值（Pr30 / Pr20 对应温度）</text>
  <text x="88" y="266" font-size="11" fill="#5b7f9e">初始油温</text>

  <!-- 曲线 A：比例带过大 -->
  <path d="M180 250 Q300 210 420 168 Q560 140 800 134" fill="none" stroke="#c98a5a" stroke-width="2.4"/>
  <g font-size="11">
    <path d="M552 228 L578 228" stroke="#c98a5a" stroke-width="2.6"/><text x="584" y="232" fill="#a8663a">① 比例带过大：慢、余差大</text>
    <path d="M552 254 L578 254" stroke="#3d8f66" stroke-width="2.6"/><text x="584" y="258" fill="#1f5c40">② 参数合适：快而平稳</text>
    <path d="M552 280 L578 280" stroke="#d9534f" stroke-width="2.6"/><text x="584" y="284" fill="#a13b39">③ 比例带过小：超调、振荡</text>
  </g>

  <!-- 曲线 B：合适 -->
  <path d="M180 250 Q260 170 340 140 Q420 128 800 130" fill="none" stroke="#3d8f66" stroke-width="2.6"/>

  <!-- 曲线 C：比例带过小 -->
  <path d="M180 250 Q225 110 300 120 Q360 132 400 108 Q450 84 500 132 Q540 160 600 122 Q650 100 700 131 Q740 148 800 130" fill="none" stroke="#d9534f" stroke-width="2.4"/>

  <!-- 说明块 -->
  <rect x="80" y="356" width="380" height="60" rx="5" fill="#f8fff9" stroke="#3d8f66" stroke-width="1.5"/>
  <text x="98" y="378" font-size="12" fill="#1f5c40">Fa25 比例带（℃）</text>
  <text x="98" y="398" font-size="11" fill="#4a6572">偏差达到 Fa25 时阀位走满 0→100 %；越小增益越大。</text>

  <rect x="480" y="356" width="380" height="60" rx="5" fill="#f6fbff" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="498" y="378" font-size="12" fill="#1b4f80">Fa26 积分时间（s）</text>
  <text x="498" y="398" font-size="11" fill="#4a6572">越大修正越慢；过小易振荡，过大余差消除慢。</text>

  <text x="80" y="60" font-size="11" fill="#7a8b99">工程整定顺序：先按经验值（蒸汽 Fa25 = 12 ℃、Fa26 = 40 s）投入，观察升温曲线，再小幅调整。</text>
</svg>
