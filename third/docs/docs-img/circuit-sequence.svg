<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
  <rect width="900" height="330" fill="#f7f9f8"/>
  <text x="450" y="28" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="bold" fill="#263238">操作步骤（单页工程，全部在一屏内完成）</text>

  <!-- 五个步骤 -->
  <g font-family="Microsoft YaHei, Arial">
    <rect x="30" y="60" width="150" height="86" rx="8" fill="#ffffff" stroke="#546e7a" stroke-width="1.8"/>
    <text x="105" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#263238">① 按图接线</text>
    <text x="105" y="112" text-anchor="middle" font-size="11" fill="#546e7a">主回路 14 根</text>
    <text x="105" y="130" text-anchor="middle" font-size="11" fill="#546e7a">控制回路 11 根</text>

    <rect x="196" y="60" width="150" height="86" rx="8" fill="#ffffff" stroke="#546e7a" stroke-width="1.8"/>
    <text x="271" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#263238">② 合上 QF</text>
    <text x="271" y="112" text-anchor="middle" font-size="11" fill="#546e7a">点击断路器触头</text>
    <text x="271" y="130" text-anchor="middle" font-size="11" fill="#546e7a">控制回路带电</text>

    <rect x="362" y="60" width="150" height="86" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.8"/>
    <text x="437" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">③ 按 SB2 起动</text>
    <text x="437" y="112" text-anchor="middle" font-size="11" fill="#546e7a">线圈得电、主触头闭合</text>
    <text x="437" y="130" text-anchor="middle" font-size="11" fill="#546e7a">常开触头自锁</text>

    <rect x="528" y="60" width="150" height="86" rx="8" fill="#ffffff" stroke="#c62828" stroke-width="1.8"/>
    <text x="603" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">④ 按 SB1 停止</text>
    <text x="603" y="112" text-anchor="middle" font-size="11" fill="#546e7a">线圈失电</text>
    <text x="603" y="130" text-anchor="middle" font-size="11" fill="#546e7a">触头全部复位</text>

    <rect x="694" y="60" width="150" height="86" rx="8" fill="#ffffff" stroke="#546e7a" stroke-width="1.8"/>
    <text x="769" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#263238">⑤ 断开 QF</text>
    <text x="769" y="112" text-anchor="middle" font-size="11" fill="#546e7a">再次点击手柄</text>
    <text x="769" y="130" text-anchor="middle" font-size="11" fill="#546e7a">主电路断电</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#90a4ae" stroke-width="2" fill="none">
    <path d="M182 103 L192 103"/><path d="M188 98 L193 103 L188 108" stroke-linejoin="round"/>
    <path d="M348 103 L358 103"/><path d="M354 98 L359 103 L354 108" stroke-linejoin="round"/>
    <path d="M514 103 L524 103"/><path d="M520 98 L525 103 L520 108" stroke-linejoin="round"/>
    <path d="M680 103 L690 103"/><path d="M686 98 L691 103 L686 108" stroke-linejoin="round"/>
  </g>

  <!-- 测量流程 -->
  <text x="30" y="186" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="bold" fill="#37474f">测量接触器线圈电压（ACV500 档）</text>
  <g font-family="Microsoft YaHei, Arial">
    <rect x="30" y="200" width="200" height="64" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <text x="130" y="226" text-anchor="middle" font-size="12" fill="#0d47a1">① 接线、合闸、按住 SB2</text>
    <text x="130" y="248" text-anchor="middle" font-size="11" fill="#546e7a">使线圈保持吸合</text>

    <rect x="250" y="200" width="200" height="64" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <text x="350" y="226" text-anchor="middle" font-size="12" fill="#0d47a1">② 选择仪表：数字万用表</text>
    <text x="350" y="248" text-anchor="middle" font-size="11" fill="#546e7a">工具栏「选择仪表」→ 勾选 → 关闭</text>

    <rect x="470" y="200" width="200" height="64" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <text x="570" y="226" text-anchor="middle" font-size="12" fill="#0d47a1">③ 红笔接 A2、黑笔接 A1</text>
    <text x="570" y="248" text-anchor="middle" font-size="11" fill="#546e7a">表笔线动画接上</text>

    <rect x="690" y="200" width="180" height="64" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="780" y="226" text-anchor="middle" font-size="12" fill="#1b5e20">④ 读数约 220V</text>
    <text x="780" y="248" text-anchor="middle" font-size="11" fill="#546e7a">读完松开 SB2</text>
  </g>
  <g stroke="#90a4ae" stroke-width="2" fill="none">
    <path d="M232 232 L246 232"/><path d="M242 227 L247 232 L242 237" stroke-linejoin="round"/>
    <path d="M452 232 L466 232"/><path d="M462 227 L467 232 L462 237" stroke-linejoin="round"/>
    <path d="M672 232 L686 232"/><path d="M682 227 L687 232 L682 237" stroke-linejoin="round"/>
  </g>

  <text x="30" y="300" font-family="Microsoft YaHei, Arial" font-size="11" fill="#546e7a">工具栏另有「自动接线」「起动系统」「5 点步进」（接线 → 合闸 → 起动 → 停止 → 分闸，每点一次前进一步）。</text>
</svg>
