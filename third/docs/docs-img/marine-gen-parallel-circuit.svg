<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b3a5c">图 1  船舶发电机组并车仿真——组成原理</text>

  <!-- 1# 机组 -->
  <g>
    <rect x="40" y="70" width="150" height="72" rx="8" fill="#eaf3fb" stroke="#2c6ea8" stroke-width="2"/>
    <text x="115" y="100" text-anchor="middle" font-size="15" fill="#1b3a5c">1# 同步发电机</text>
    <text x="115" y="122" text-anchor="middle" font-size="11" fill="#667">G1  80 kW / 400 V</text>
  </g>
  <g>
    <rect x="240" y="70" width="120" height="72" rx="8" fill="#f7f9fb" stroke="#2c6ea8" stroke-width="2"/>
    <text x="300" y="98" text-anchor="middle" font-size="14" fill="#1b3a5c">QF1 主开关</text>
    <text x="300" y="120" text-anchor="middle" font-size="11" fill="#667">框架式空气断路器</text>
  </g>

  <!-- 2# 机组 -->
  <g>
    <rect x="40" y="190" width="150" height="72" rx="8" fill="#eaf3fb" stroke="#2c6ea8" stroke-width="2"/>
    <text x="115" y="220" text-anchor="middle" font-size="15" fill="#1b3a5c">2# 同步发电机</text>
    <text x="115" y="242" text-anchor="middle" font-size="11" fill="#667">G2  80 kW / 400 V</text>
  </g>
  <g>
    <rect x="240" y="190" width="120" height="72" rx="8" fill="#f7f9fb" stroke="#2c6ea8" stroke-width="2"/>
    <text x="300" y="218" text-anchor="middle" font-size="14" fill="#1b3a5c">QF2 主开关</text>
    <text x="300" y="240" text-anchor="middle" font-size="11" fill="#667">框架式空气断路器</text>
  </g>

  <!-- 汇流排 -->
  <g>
    <rect x="430" y="100" width="110" height="132" rx="8" fill="#fff6e5" stroke="#c9861a" stroke-width="2"/>
    <text x="485" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5a00">汇流排</text>
    <text x="485" y="172" text-anchor="middle" font-size="12" fill="#8a5a00">BUS1  L1/L2/L3</text>
    <text x="485" y="196" text-anchor="middle" font-size="11" fill="#a8763a">380 V 50 Hz</text>
  </g>

  <!-- 馈出：照明 -->
  <g>
    <rect x="600" y="50" width="130" height="66" rx="8" fill="#f7f9fb" stroke="#2c6ea8" stroke-width="2"/>
    <text x="665" y="78" text-anchor="middle" font-size="13" fill="#1b3a5c">QF3 → 照明灯</text>
    <text x="665" y="98" text-anchor="middle" font-size="11" fill="#667">L1/L2/L3 各一盏</text>
  </g>
  <!-- 可调负载 -->
  <g>
    <rect x="600" y="140" width="130" height="66" rx="8" fill="#f7f9fb" stroke="#2c6ea8" stroke-width="2"/>
    <text x="665" y="168" text-anchor="middle" font-size="13" fill="#1b3a5c">三相可调负载</text>
    <text x="665" y="188" text-anchor="middle" font-size="11" fill="#667">20 kW（可加载/卸载）</text>
  </g>

  <!-- 同步表与选择开关 -->
  <g>
    <rect x="600" y="240" width="130" height="66" rx="8" fill="#eafaf1" stroke="#1d8a4e" stroke-width="2"/>
    <text x="665" y="268" text-anchor="middle" font-size="13" fill="#14683a">数字同步表 sync1</text>
    <text x="665" y="288" text-anchor="middle" font-size="11" fill="#2f7a52">Δf / Δφ / 24 个 LED</text>
  </g>
  <g>
    <rect x="420" y="270" width="140" height="66" rx="8" fill="#f4f0fb" stroke="#6b4fa8" stroke-width="2"/>
    <text x="490" y="298" text-anchor="middle" font-size="13" fill="#3f2b70">同步表选择开关</text>
    <text x="490" y="318" text-anchor="middle" font-size="11" fill="#5c4b86">OFF / 1 / 2 / 3</text>
  </g>

  <!-- 遥控面板 -->
  <g>
    <rect x="40" y="310" width="320" height="86" rx="8" fill="#eef6ff" stroke="#2c6ea8" stroke-width="2"/>
    <text x="200" y="338" text-anchor="middle" font-size="14" fill="#1b3a5c">发电机组遥控面板 genpanel / genpanel2</text>
    <text x="200" y="362" text-anchor="middle" font-size="11" fill="#667">起动 / 停止 · 调速旋钮 · 合闸 / 分闸 · LCD 显示</text>
    <text x="200" y="382" text-anchor="middle" font-size="11" fill="#667">DC 24 V 控制电源 · 合闸联锁（选择开关本机档位）</text>
  </g>

  <!-- 连线 -->
  <g stroke="#2c6ea8" stroke-width="2" fill="none">
    <line x1="190" y1="106" x2="240" y2="106"/>
    <line x1="190" y1="226" x2="240" y2="226"/>
    <line x1="360" y1="106" x2="430" y2="120"/>
    <line x1="360" y1="226" x2="430" y2="212"/>
    <line x1="540" y1="132" x2="600" y2="84"/>
    <line x1="540" y1="150" x2="600" y2="170"/>
    <line x1="540" y1="196" x2="600" y2="265"/>
    <line x1="600" y1="273" x2="560" y2="290"/>
  </g>
  <g stroke="#8a97a3" stroke-width="1.6" stroke-dasharray="6 5" fill="none">
    <line x1="420" y1="303" x2="396" y2="303"/>
    <line x1="396" y1="106" x2="396" y2="303"/>
    <line x1="396" y1="106" x2="364" y2="106"/>
    <line x1="396" y1="226" x2="364" y2="226"/>
  </g>
  <g fill="#8a97a3">
    <circle cx="364" cy="106" r="3.4"/>
    <circle cx="364" cy="226" r="3.4"/>
  </g>
  <text transform="translate(384,236) rotate(-90)" text-anchor="middle" font-size="10" fill="#5a6a75">待并机 A 相取样</text>

  <!-- 说明 -->
  <g>
    <rect x="40" y="412" width="880" height="42" rx="6" fill="#f7fbff" stroke="#b9cfe2" stroke-width="1"/>
    <text x="480" y="438" text-anchor="middle" font-size="12" fill="#334">
      两台机组各经一台主开关接入同一汇流排；同步表测「待并机 A 相」与「汇流排 A 相」的相位差，选择开关决定接入哪台机
    </text>
  </g>
</svg>
