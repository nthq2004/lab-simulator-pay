<svg xmlns="http://www.w3.org/2000/svg" width="980" height="590" viewBox="0 0 980 590" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2c6ea8"/>
    </marker>
    <marker id="ao" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#c08a24"/>
    </marker>
  </defs>
  <rect width="980" height="590" fill="#ffffff"/>
  <text x="490" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b3a5c">图 2  应急配电板的自动转换流程</text>

  <!-- ① 待机 -->
  <g>
    <rect x="40" y="60" width="230" height="70" rx="10" fill="#eaf3fb" stroke="#2c6ea8" stroke-width="2"/>
    <text x="155" y="87" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b3a5c">① 主电正常（待机）</text>
    <text x="155" y="111" text-anchor="middle" font-size="11" fill="#46688a">联络合闸 · 应急主开关分闸 · 应急机停机</text>
  </g>
  <!-- 箭头 ①→② -->
  <line x1="155" y1="132" x2="155" y2="166" stroke="#2c6ea8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="167" y="153" font-size="11" fill="#2c6ea8">主电失电 / 模式打「试验」</text>

  <!-- ② 联络断开 -->
  <g>
    <rect x="40" y="170" width="230" height="70" rx="10" fill="#fdf6ec" stroke="#c08a24" stroke-width="2"/>
    <text x="155" y="197" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5310">② 联络开关立即断开</text>
    <text x="155" y="221" text-anchor="middle" font-size="11" fill="#8a6d3b">应急汇流排失电，应急负载停电</text>
  </g>
  <!-- 箭头 ②→③ -->
  <line x1="155" y1="242" x2="155" y2="276" stroke="#c08a24" stroke-width="2" marker-end="url(#ao)"/>
  <text x="167" y="263" font-size="11" fill="#8a6d3b">延时 10 s</text>

  <!-- ③ 自动起动 -->
  <g>
    <rect x="40" y="280" width="230" height="70" rx="10" fill="#eef7f2" stroke="#2f8a4a" stroke-width="2"/>
    <text x="155" y="307" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f6b39">③ 自动起动应急发电机</text>
    <text x="155" y="331" text-anchor="middle" font-size="11" fill="#2f6040">控制方式须在「自动」位，经起动线发令</text>
  </g>
  <!-- 箭头 ③→④ -->
  <line x1="272" y1="315" x2="336" y2="315" stroke="#2f8a4a" stroke-width="2" marker-end="url(#ab)"/>
  <text x="44" y="374" font-size="11" fill="#2f6040">机组起动、建压至 400 V / 50 Hz</text>

  <!-- ④ 应急运行 -->
  <g>
    <rect x="340" y="170" width="270" height="180" rx="10" fill="#e6f5ec" stroke="#2f8a4a" stroke-width="2.5"/>
    <text x="475" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6b39">④ 应急运行</text>
    <text x="475" y="224" text-anchor="middle" font-size="11.5" fill="#2f6040">机组运行 8 s 后自动合上应急主开关</text>
    <text x="475" y="248" text-anchor="middle" font-size="11.5" fill="#2f6040">应急汇流排由应急发电机供电</text>
    <text x="475" y="272" text-anchor="middle" font-size="11.5" fill="#2f6040">应急灯重新点亮（改由应急电源供电）</text>
    <text x="475" y="296" text-anchor="middle" font-size="11.5" fill="#2f6040">合闸信号保持 2 s，确保主触头合到位</text>
    <text x="475" y="326" text-anchor="middle" font-size="10.5" fill="#667">配电板 LCD 显示「应急运行」</text>
  </g>

  <!-- 箭头 ④→⑤ -->
  <line x1="612" y1="205" x2="694" y2="205" stroke="#2c6ea8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="596" y="192" font-size="10.5" fill="#2c6ea8">主电恢复 / 转回正常</text>

  <!-- ⑤ 应急主开关分闸 -->
  <g>
    <rect x="700" y="170" width="240" height="70" rx="10" fill="#f7f9fb" stroke="#2c6ea8" stroke-width="2"/>
    <text x="820" y="197" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b3a5c">⑤ 应急主开关分闸（延时 3 s）</text>
    <text x="820" y="221" text-anchor="middle" font-size="11" fill="#46688a">先断应急电源，避免非同期并列</text>
  </g>
  <!-- 箭头 ⑤→⑥ -->
  <line x1="820" y1="242" x2="820" y2="276" stroke="#2c6ea8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="832" y="263" font-size="11" fill="#2c6ea8">约 5 s</text>

  <!-- ⑥ 联络合闸 -->
  <g>
    <rect x="700" y="280" width="240" height="70" rx="10" fill="#f7f9fb" stroke="#2c6ea8" stroke-width="2"/>
    <text x="820" y="307" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b3a5c">⑥ 联络开关自动合闸</text>
    <text x="820" y="331" text-anchor="middle" font-size="11" fill="#46688a">主电网恢复给应急负载供电</text>
  </g>

  <!-- ⑥ → ① 反馈（沿 ④ 下方绕回，避免穿越方框） -->
  <path d="M820,350 V395 H320 V96 H276" fill="none" stroke="#2c6ea8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ab)"/>
  <text x="334" y="88" font-size="11" fill="#2c6ea8">延时 13 s 后应急发电机自动停机，回到 ① 待机</text>

  <text x="490" y="452" text-anchor="middle" font-size="11" fill="#667">转换全过程无需人工干预；退出顺序必须「先断应急电源 → 再合主电联络 → 最后停应急机组」</text>
  <text x="490" y="480" text-anchor="middle" font-size="11" fill="#667">联络开关模式开关打在「试验」位即等效于「主电网失电」，可在不拉停主电网时做自动起动试验</text>
</svg>
