  <!-- 图例 -->
  <rect x="470" y="66" width="236" height="96" rx="5" fill="#ffffff" stroke="#d3dde5" stroke-width="1.2"/>
  <g font-size="11">
    <path d="M478 82 L504 82" stroke="#c98a5a" stroke-width="2.4"/><text x="510" y="86" fill="#a8663a">HFO G3（150 ℃ 达 12 cSt）</text>
    <path d="M478 106 L504 106" stroke="#2e6fa3" stroke-width="2.6"/><text x="510" y="110" fill="#2e6fa3">HFO G2（135 ℃ 达 12 cSt）</text>
    <path d="M478 130 L504 130" stroke="#8aa9c0" stroke-width="2.4"/><text x="510" y="134" fill="#5b7f9e">HFO G1（120 ℃ 达 12 cSt）</text>
    <path d="M478 154 L504 154" stroke="#3d8f66" stroke-width="2.4"/><text x="510" y="158" fill="#2f5d2f">DO 柴油（40 ℃ 约 10 cSt）</text>
  </g>

  <!-- Pr20 = 12 cSt 与 Pr30 的对应关系 -->
  <path d="M70 289 L690 289" fill="none" stroke="#d9534f" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="250" y="281" font-size="12" fill="#a13b39">Pr20 = 12 cSt（黏度设定值）</text>
  <path d="M520 350 L520 289" fill="none" stroke="#d9534f" stroke-width="1.6" stroke-dasharray="7 5"/>
  <circle cx="520" cy="289" r="5" fill="#d9534f"/>
  <text x="580" y="392" font-size="12" fill="#a13b39" text-anchor="middle">Pr30 = 135 ℃</text>
  <text x="580" y="410" font-size="10.5" fill="#7a8b99" text-anchor="middle">（G2 油达到 12 cSt 所需的温度）</text>

  <text x="70" y="392" font-size="11" fill="#4a6572">油温升高 → 黏度按指数下降；不同油品同一黏度所需温度不同</text>
  <text x="70" y="410" font-size="11" fill="#4a6572">→ 换油后必须重设 Pr30（或改 Pr24 油品等级）</text>
</svg>
