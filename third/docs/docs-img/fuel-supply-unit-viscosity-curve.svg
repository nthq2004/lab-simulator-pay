<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="'Microsoft YaHei','Source Han Sans SC',sans-serif">
  <rect width="720" height="430" fill="#ffffff"/>
  <text x="360" y="28" font-size="16" font-weight="bold" fill="#1f2d3d" text-anchor="middle">燃油黏度—温度特性曲线（ν = f(T)）</text>

  <!-- 坐标轴 -->
  <path d="M70 350 L690 350" fill="none" stroke="#4a5b6b" stroke-width="1.8"/>
  <path d="M70 350 L70 55" fill="none" stroke="#4a5b6b" stroke-width="1.8"/>
  <text x="632" y="342" font-size="12" fill="#28455e" text-anchor="end">T / ℃</text>
  <text x="46" y="52" font-size="11" fill="#28455e" text-anchor="end">ν / cSt</text>

  <!-- 刻度：x = 70 + 3.333·T，y = 379 − 7.5·ν -->
  <g font-size="11" fill="#4a6572">
    <text x="70" y="368" text-anchor="middle">0</text>
    <text x="203" y="368" text-anchor="middle">40</text>
    <text x="337" y="368" text-anchor="middle">80</text>
    <text x="470" y="368" text-anchor="middle">120</text>
    <text x="603" y="368" text-anchor="middle">160</text>
    <text x="64" y="308" text-anchor="end">10</text>
    <text x="64" y="233" text-anchor="end">20</text>
    <text x="64" y="158" text-anchor="end">30</text>
    <text x="64" y="83" text-anchor="end">40</text>
  </g>
  <g stroke="#e3e9ef" stroke-width="1">
    <path d="M70 304 L690 304"/>
    <path d="M70 229 L690 229"/>
    <path d="M70 154 L690 154"/>
    <path d="M70 79 L690 79"/>
  </g>

