<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Microsoft YaHei, Arial">
  <rect width="1000" height="470" fill="#f7f9f8"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">镍氢电池恒流充电回路的组成（AC 220 V → 100 mA / 50 mA）</text>

  <!-- 第一行：变压 → 整流 → 滤波 → 电池 → 三极管 -->
  <g>
    <rect x="40" y="70" width="120" height="64" rx="6" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
    <text x="100" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">交流电源</text>
    <text x="100" y="118" text-anchor="middle" font-size="11.5" fill="#546e7a">AC 220 V / 50 Hz</text>

    <rect x="190" y="70" width="130" height="64" rx="6" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
    <text x="255" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">控制变压器 T</text>
    <text x="255" y="118" text-anchor="middle" font-size="11.5" fill="#546e7a">220 V → 12 V</text>

    <rect x="350" y="70" width="130" height="64" rx="6" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
    <text x="415" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">半波整流 D1</text>
    <text x="415" y="118" text-anchor="middle" font-size="11.5" fill="#546e7a">单向导电</text>

    <rect x="510" y="70" width="140" height="64" rx="6" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
    <text x="580" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">滤波电容 C1</text>
    <text x="580" y="118" text-anchor="middle" font-size="11.5" fill="#546e7a">2200 µF → ≈15 V</text>

    <rect x="690" y="70" width="120" height="64" rx="6" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
    <text x="750" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">镍氢电池 BT</text>
    <text x="750" y="118" text-anchor="middle" font-size="11.5" fill="#546e7a">被充电对象</text>

    <rect x="850" y="70" width="110" height="64" rx="6" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
    <text x="905" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">三极管 Q1</text>
    <text x="905" y="118" text-anchor="middle" font-size="11.5" fill="#546e7a">恒流元件</text>

    <path d="M160 102 L186 102" stroke="#37474f" stroke-width="2" marker-end="url(#ar1)"/>
    <path d="M320 102 L346 102" stroke="#37474f" stroke-width="2" marker-end="url(#ar1)"/>
    <path d="M480 102 L506 102" stroke="#37474f" stroke-width="2" marker-end="url(#ar1)"/>
    <path d="M650 102 L686 102" stroke="#37474f" stroke-width="2" marker-end="url(#ar1)"/>
    <path d="M810 102 L846 102" stroke="#37474f" stroke-width="2" marker-end="url(#ar1)"/>
  </g>

  <!-- 第二行：稳压基准、发射极电阻、地 -->
  <g>
    <rect x="510" y="200" width="140" height="64" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="580" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">稳压基准 R1+DZ</text>
    <text x="580" y="248" text-anchor="middle" font-size="11.5" fill="#33691e">6.0 V</text>
    <path d="M580 134 L580 196" stroke="#2e7d32" stroke-width="2" marker-end="url(#ar2)"/>

    <rect x="660" y="200" width="190" height="64" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
    <text x="755" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">SA + 发射极电阻</text>
    <text x="755" y="248" text-anchor="middle" font-size="11" fill="#bf360c">R3 53 Ω（T1档）/ R4 106 Ω（T2档）</text>

    <rect x="880" y="200" width="80" height="64" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
    <text x="920" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">地 GND</text>

    <!-- 三极管 → 发射极电阻 -->
    <path d="M905 134 L905 176 L755 176 L755 196" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#ar1)"/>
    <!-- 发射极电阻 → 地 -->
    <path d="M850 232 L876 232" stroke="#37474f" stroke-width="2" marker-end="url(#ar1)"/>

    <!-- 基准 → 三极管基极（绿色虚线） -->
    <path d="M650 196 L846 126" stroke="#2e7d32" stroke-width="2" stroke-dasharray="7 4" fill="none" marker-end="url(#ar2)"/>
    <rect x="646" y="150" width="104" height="18" fill="#f7f9f8"/>
    <text x="652" y="164" font-size="11.5" font-weight="bold" fill="#2e7d32">Vb = 6 V → 基极</text>
  </g>

  <!-- 第三行：充电指示 -->
  <g>
    <rect x="660" y="312" width="190" height="64" rx="6" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
    <text x="755" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#880e4f">充电指示 R2 + LED</text>
    <text x="755" y="360" text-anchor="middle" font-size="11.5" fill="#ad1457">约 1.6 mA，有电流就亮</text>
    <path d="M755 264 L755 308" stroke="#c2185b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar3)"/>
    <text x="765" y="292" font-size="11.5" fill="#c2185b">与发射极并联</text>
  </g>

  <!-- 说明 -->
  <g>
    <text x="500" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#263238">充电电流由发射极电阻决定：I ≈ Ve / R，Ve ≈ 6 V − 0.7 V = 5.3 V</text>
    <text x="500" y="438" text-anchor="middle" font-size="12.5" fill="#37474f">R3 = 53 Ω → I ≈ 100 mA　　R4 = 106 Ω → I ≈ 50 mA　　电池电压升高只让 Uce 减小，电流基本不变</text>
  </g>

  <defs>
    <marker id="ar1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#37474f"/>
    </marker>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2e7d32"/>
    </marker>
    <marker id="ar3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c2185b"/>
    </marker>
  </defs>
</svg>
