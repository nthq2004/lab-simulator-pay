<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b3a5c">图 2  主开关的五项保护与整定值</text>

  <!-- 表头 -->
  <g font-size="13" font-weight="bold" fill="#ffffff">
    <rect x="30" y="52" width="150" height="38" fill="#2c6ea8"/>
    <text x="105" y="77" text-anchor="middle">保护功能</text>
    <rect x="180" y="52" width="330" height="38" fill="#3a7bb8"/>
    <text x="345" y="77" text-anchor="middle">判据（本工程仿真取值）</text>
    <rect x="510" y="52" width="150" height="38" fill="#3a7bb8"/>
    <text x="585" y="77" text-anchor="middle">动作时限</text>
    <rect x="660" y="52" width="270" height="38" fill="#2c6ea8"/>
    <text x="795" y="77" text-anchor="middle">动作结果</text>
  </g>

  <!-- 行 1：过载 -->
  <g font-size="12" fill="#334">
    <rect x="30" y="90" width="900" height="66" fill="#fdf7f0" stroke="#e0cdb4"/>
    <text x="105" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5a00">过载保护</text>
    <text x="105" y="140" text-anchor="middle" font-size="11" fill="#8a6a3a">发电机不停机</text>
    <text x="200" y="118" font-size="12">本机实际输出有功 &gt; 额定 × 120%（80 kW → 96 kW）</text>
    <text x="200" y="140" font-size="11" fill="#667">负载投得过多、单机带载超过额定能力</text>
    <text x="585" y="127" text-anchor="middle" font-size="13" fill="#b04a4a">15 s（反时限）</text>
    <text x="680" y="118" font-size="12">仅跳本机主开关；</text>
    <text x="680" y="140" font-size="12">发电机保持运行，可减载后合闸</text>
  </g>

  <!-- 行 2：欠压 -->
  <g font-size="12" fill="#334">
    <rect x="30" y="156" width="900" height="66" fill="#f4f8fd" stroke="#c6d8ea"/>
    <text x="105" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b3a5c">欠压保护</text>
    <text x="105" y="206" text-anchor="middle" font-size="11" fill="#4a6b8a">与失压联动</text>
    <text x="200" y="184" font-size="12">端子电压 &lt; 额定 × 85%（≈340 V）</text>
    <text x="200" y="206" font-size="11" fill="#667">AVR/励磁故障、原动机转速崩溃、母线失压</text>
    <text x="585" y="193" text-anchor="middle" font-size="13" fill="#b04a4a">2 s</text>
    <text x="680" y="184" font-size="12">跳本机主开关；</text>
    <text x="680" y="206" font-size="12">发电机可能仍在空转运行</text>
  </g>

  <!-- 行 3：短路 -->
  <g font-size="12" fill="#334">
    <rect x="30" y="222" width="900" height="66" fill="#fdf1f1" stroke="#e6c0c0"/>
    <text x="105" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#7d2b2b">短路保护</text>
    <text x="105" y="272" text-anchor="middle" font-size="11" fill="#8d4a4a">瞬时动作</text>
    <text x="200" y="250" font-size="12">汇流排干线存在短路（短路电流远超整定）</text>
    <text x="200" y="272" font-size="11" fill="#667">绝缘破损、进水、误操作、检修遗留导电物</text>
    <text x="585" y="259" text-anchor="middle" font-size="13" fill="#b04a4a">瞬时（&lt;1 s）</text>
    <text x="680" y="250" font-size="12">跳开全部主开关，全船失电；</text>
    <text x="680" y="272" font-size="12">故障未排除前合闸会再次跳闸</text>
  </g>

  <!-- 行 4：逆功率 -->
  <g font-size="12" fill="#334">
    <rect x="30" y="288" width="900" height="66" fill="#f6f2fb" stroke="#d6c8ea"/>
    <text x="105" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d2b63">逆功率保护</text>
    <text x="105" y="338" text-anchor="middle" font-size="11" fill="#5b4a80">并联运行专用</text>
    <text x="200" y="316" font-size="12">原动机故障被母线拖转，吸收有功 &gt; 8 kW</text>
    <text x="200" y="338" font-size="11" fill="#667">冷却水温高、滑油低压、超速导致原动机停机</text>
    <text x="585" y="325" text-anchor="middle" font-size="13" fill="#b04a4a">5 s</text>
    <text x="680" y="316" font-size="12">跳故障机主开关、解列；</text>
    <text x="680" y="338" font-size="12">其负载全部转移给其余机组</text>
  </g>

  <!-- 行 5：并车 -->
  <g font-size="12" fill="#334">
    <rect x="30" y="354" width="900" height="66" fill="#eef7ee" stroke="#c2dfc9"/>
    <text x="105" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d5c32">频差 / 非同期</text>
    <text x="105" y="404" text-anchor="middle" font-size="11" fill="#3a6b4a">合闸瞬间判定</text>
    <text x="200" y="382" font-size="12">频差 &gt; ±0.5 Hz，或相位差落在 60°~270°</text>
    <text x="200" y="404" font-size="11" fill="#667">未满足准同步条件就合闸（仅在母线带电时有意义）</text>
    <text x="585" y="391" text-anchor="middle" font-size="13" fill="#b04a4a">瞬时</text>
    <text x="680" y="382" font-size="12">全部主开关跳闸，发电机不停机；</text>
    <text x="680" y="404" font-size="12">重新调速、看相位后可再次并车</text>
  </g>

  <text x="30" y="452" font-size="12" fill="#556">说明：本工程的过载 / 欠压 / 短路由主开关内部的“简化保护”实现（未配电子脱扣器），</text>
  <text x="30" y="474" font-size="12" fill="#556">逆功率与频差保护与船用框架式断路器的实际功能一致；整定值均可在组件参数界面中查看、修改。</text>
  <text x="30" y="500" font-size="12" fill="#b04a4a">判据只认“母线带电”的并联工况：另一台机虽在运行但其主开关已跳闸时，合闸不再按并车条件判定。</text>
</svg>
