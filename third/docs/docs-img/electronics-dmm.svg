<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470">
  <rect width="920" height="470" fill="#f7f9f8"/>
  <text x="460" y="28" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="bold" fill="#263238">数字式万用表：档位、接线与读数</text>

  <!-- 左侧：表体示意 -->
  <g>
    <rect x="40" y="52" width="230" height="390" rx="18" fill="#2b3238" stroke="#0f1418" stroke-width="2"/>
    <rect x="60" y="72" width="190" height="86" rx="6" fill="#b9c9a8" stroke="#7d8b6e" stroke-width="1.5"/>
    <text x="155" y="128" text-anchor="middle" font-family="Consolas, Microsoft YaHei" font-size="34" font-weight="bold" fill="#1f2b1a">1.000</text>
    <text x="215" y="150" text-anchor="end" font-family="Microsoft YaHei" font-size="15" fill="#1f2b1a">kΩ</text>
    <circle cx="155" cy="248" r="58" fill="#171c20" stroke="#6b757c" stroke-width="2"/>
    <circle cx="155" cy="248" r="6" fill="#cfd8dc"/>
    <line x1="155" y1="248" x2="155" y2="200" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <text x="155" y="180" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" fill="#cfd8dc">OFF</text>
    <text x="215" y="252" font-family="Microsoft YaHei" font-size="10" fill="#cfd8dc">2kΩ</text>
    <text x="95" y="252" text-anchor="end" font-family="Microsoft YaHei" font-size="10" fill="#cfd8dc">200V</text>
    <text x="155" y="322" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" fill="#cfd8dc">uF</text>
    <!-- 插孔 -->
    <circle cx="88" cy="392" r="12" fill="#e53935"/>
    <circle cx="155" cy="392" r="12" fill="#212121" stroke="#90a4ae" stroke-width="1.5"/>
    <circle cx="222" cy="392" r="12" fill="#e53935"/>
    <text x="88" y="420" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" fill="#ffffff">mA</text>
    <text x="155" y="420" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" fill="#ffffff">COM</text>
    <text x="222" y="420" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" fill="#ffffff">VΩ</text>
  </g>

  <!-- 右侧：档位—接线—读数 对照表 -->
  <g font-family="Microsoft YaHei, Arial" font-size="12" font-weight="bold" fill="#ffffff">
    <rect x="300" y="52" width="180" height="28" rx="4" fill="#455a64"/>
    <text x="390" y="71" text-anchor="middle">被测对象</text>
    <rect x="488" y="52" width="140" height="28" rx="4" fill="#455a64"/>
    <text x="558" y="71" text-anchor="middle">档位</text>
    <rect x="636" y="52" width="252" height="28" rx="4" fill="#455a64"/>
    <text x="762" y="71" text-anchor="middle">表笔接法与读数</text>
  </g>

  <g font-family="Microsoft YaHei, Arial" font-size="11">
    <!-- 电阻 -->
    <rect x="300" y="88" width="180" height="58" rx="5" fill="#ffffff" stroke="#90a4ae" stroke-width="1.3"/>
    <text x="314" y="112" fill="#263238">电阻 R1（1000 Ω）</text>
    <text x="314" y="132" font-size="10" fill="#546e7a">先断开电源再测</text>
    <rect x="488" y="88" width="140" height="58" rx="5" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.3"/>
    <text x="558" y="122" text-anchor="middle" font-weight="bold" fill="#0d47a1">2kΩ 档</text>
    <rect x="636" y="88" width="252" height="58" rx="5" fill="#ffffff" stroke="#90a4ae" stroke-width="1.3"/>
    <text x="650" y="112" fill="#37474f">红笔、黑笔各接一端（电阻不分方向）</text>
    <text x="650" y="132" fill="#2e7d32">显示 1.000 kΩ</text>

    <!-- 电容 -->
    <rect x="300" y="154" width="180" height="58" rx="5" fill="#ffffff" stroke="#90a4ae" stroke-width="1.3"/>
    <text x="314" y="178" fill="#263238">电容 C1（100 μF）</text>
    <text x="314" y="198" font-size="10" fill="#546e7a">测前先短接放电</text>
    <rect x="488" y="154" width="140" height="58" rx="5" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.3"/>
    <text x="558" y="188" text-anchor="middle" font-weight="bold" fill="#0d47a1">uF 档</text>
    <rect x="636" y="154" width="252" height="58" rx="5" fill="#ffffff" stroke="#90a4ae" stroke-width="1.3"/>
    <text x="650" y="178" fill="#37474f">表笔跨接两引脚，读数随充电缓慢稳定</text>
    <text x="650" y="198" fill="#2e7d32">显示约 100 μF</text>

    <!-- 二极管 -->
    <rect x="300" y="220" width="180" height="58" rx="5" fill="#ffffff" stroke="#90a4ae" stroke-width="1.3"/>
    <text x="314" y="244" fill="#263238">二极管 D1</text>
    <text x="314" y="264" font-size="10" fill="#546e7a">重点看正/反向差异</text>
    <rect x="488" y="220" width="140" height="58" rx="5" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.3"/>
    <text x="558" y="254" text-anchor="middle" font-weight="bold" fill="#0d47a1">▶| 二极管档</text>
    <rect x="636" y="220" width="252" height="58" rx="5" fill="#ffffff" stroke="#90a4ae" stroke-width="1.3"/>
    <text x="650" y="244" fill="#37474f">红笔 A、黑笔 K → 0.68 V；对调 → O.L</text>
    <text x="650" y="264" fill="#2e7d32">有环端为 K，正向压降 0.68 V</text>

    <!-- 三极管 -->
    <rect x="300" y="286" width="180" height="58" rx="5" fill="#ffffff" stroke="#90a4ae" stroke-width="1.3"/>
    <text x="314" y="310" fill="#263238">三极管 T1（9013）</text>
    <text x="314" y="330" font-size="10" fill="#546e7a">判定 NPN 与管脚</text>
    <rect x="488" y="286" width="140" height="58" rx="5" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.3"/>
    <text x="558" y="320" text-anchor="middle" font-weight="bold" fill="#0d47a1">▶| 二极管档</text>
    <rect x="636" y="286" width="252" height="58" rx="5" fill="#ffffff" stroke="#90a4ae" stroke-width="1.3"/>
    <text x="650" y="310" fill="#37474f">红笔接 B，黑笔分别接 C、E：0.62 V / 0.70 V</text>
    <text x="650" y="330" fill="#2e7d32">B 为公共端 → NPN，脚序 E–B–C</text>

    <!-- 晶闸管 -->
    <rect x="300" y="352" width="180" height="58" rx="5" fill="#ffffff" stroke="#90a4ae" stroke-width="1.3"/>
    <text x="314" y="376" fill="#263238">晶闸管 SCR1（BT151）</text>
    <text x="314" y="396" font-size="10" fill="#546e7a">判定 A / G / K</text>
    <rect x="488" y="352" width="140" height="58" rx="5" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.3"/>
    <text x="558" y="386" text-anchor="middle" font-weight="bold" fill="#0d47a1">▶| 二极管档</text>
    <rect x="636" y="352" width="252" height="58" rx="5" fill="#ffffff" stroke="#90a4ae" stroke-width="1.3"/>
    <text x="650" y="376" fill="#37474f">G–K 单向导通（0.68 V），A–K 正反向均 O.L</text>
    <text x="650" y="396" fill="#2e7d32">A–K 不导通正是晶闸管的特征</text>
  </g>

  <text x="300" y="444" font-family="Microsoft YaHei, Arial" font-size="10.5" fill="#546e7a">
    提示：电阻 / 二极管 / 三极管 / 晶闸管均须在断电状态下测量；测完把旋钮拨回 OFF，防止电池耗尽
  </text>
</svg>
