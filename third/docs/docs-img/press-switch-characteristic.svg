<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <defs>
    <marker id="xa" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#2471a3"/>
    </marker>
    <marker id="xb" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#333"/>
    </marker>
    <marker id="xd" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#e67e22"/>
    </marker>
    <marker id="xu" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#8e44ad"/>
    </marker>
    <marker id="xl" markerWidth="7" markerHeight="7" refX="3.5" refY="0.5" orient="auto">
      <path d="M0,0 L7,0 L3.5,5 Z" fill="#566573"/>
    </marker>
    <marker id="xr" markerWidth="7" markerHeight="7" refX="3.5" refY="0.5" orient="auto">
      <path d="M7,0 L0,0 L3.5,5 Z" fill="#566573"/>
    </marker>
  </defs>
  <rect width="1000" height="470" fill="#fbfcfe"/>
  <text x="24" y="34" font-size="19" font-weight="bold" fill="#1a3a5c">图 2　给定值、幅差与双位（滞环）动作特性</text>

  <!-- 滞环区底色 -->
  <rect x="340" y="88" width="220" height="242" fill="#fdf6e3"/>
  <text x="450" y="206" font-size="11.5" fill="#7d6608" text-anchor="middle">滞环区（p₁ ~ p₂）</text>
  <text x="450" y="224" font-size="11" fill="#7d6608" text-anchor="middle">压力在此区间内</text>
  <text x="450" y="240" font-size="11" fill="#7d6608" text-anchor="middle">保持原有状态</text>

  <!-- 坐标轴 -->
  <line x1="90" y1="330" x2="726" y2="330" stroke="#333" stroke-width="2" marker-end="url(#xb)"/>
  <line x1="90" y1="330" x2="90" y2="86" stroke="#333" stroke-width="2" marker-end="url(#xb)"/>
  <text x="712" y="352" font-size="11.5" fill="#333" text-anchor="end">压力 p（MPa）</text>
  <text x="34" y="80" font-size="11.5" fill="#333">触点状态</text>
  <text x="82" y="144" font-size="11" fill="#1e8449" text-anchor="end">闭合</text>
  <text x="82" y="274" font-size="11" fill="#c0392b" text-anchor="end">断开</text>

  <!-- 状态水平线：闭合一直保持到上限 p₂（右侧 x=560），断开从下限 p₁（左侧 x=340）起 -->
  <line x1="100" y1="140" x2="552" y2="140" stroke="#2471a3" stroke-width="3" marker-end="url(#xa)"/>
  <line x1="348" y1="270" x2="716" y2="270" stroke="#2471a3" stroke-width="3" marker-end="url(#xa)"/>
  <text x="120" y="128" font-size="11" fill="#1a5276">升压：p &lt; p₂，NC 保持闭合</text>
  <text x="712" y="292" font-size="11" fill="#1a5276" text-anchor="end">降压：p &gt; p₁，NC 保持断开</text>

  <!-- 两次切换：升压先到达上限（右），降压先到达下限（左） -->
  <line x1="560" y1="144" x2="560" y2="264" stroke="#e67e22" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#xd)"/>
  <text x="570" y="206" font-size="11" fill="#b9770e">升压到上限：断开</text>
  <line x1="340" y1="266" x2="340" y2="148" stroke="#8e44ad" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#xu)"/>
  <text x="330" y="196" font-size="11" fill="#6c3483" text-anchor="end">降压到下限：闭合</text>

  <!-- 上下限标注：压力轴向右递增，故 p₁（小）在左、p₂（大）在右 -->
  <line x1="340" y1="88" x2="340" y2="330" stroke="#8e44ad" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
  <line x1="560" y1="88" x2="560" y2="330" stroke="#e67e22" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
  <text x="340" y="82" font-size="11.5" fill="#6c3483" text-anchor="middle">动作下限 p₁ = 0.12</text>
  <text x="560" y="82" font-size="11.5" fill="#b9770e" text-anchor="middle">动作上限 p₂ = 0.298</text>

  <!-- 幅差标注 -->
  <line x1="340" y1="366" x2="560" y2="366" stroke="#566573" stroke-width="1.5" marker-start="url(#xr)" marker-end="url(#xl)"/>
  <text x="450" y="388" font-size="11.5" fill="#2c3e50" text-anchor="middle">切换差（幅差）Δp = p₂ − p₁ = 0.178 MPa</text>

  <!-- 公式区 -->
  <rect x="742" y="86" width="238" height="300" rx="10" fill="#f4f9fb" stroke="#aab7b8" stroke-width="1.5"/>
  <text x="861" y="112" font-size="12.5" font-weight="bold" fill="#1a5276" text-anchor="middle">参数换算（YT1226）</text>
  <line x1="756" y1="124" x2="966" y2="124" stroke="#d5dbdb"/>
  <text x="756" y="148" font-size="11.5" fill="#2c3e50">给定值量程　0 ~ 0.2 MPa</text>
  <text x="756" y="170" font-size="11.5" fill="#2c3e50">幅差范围　　0.07 ~ 0.25 MPa</text>
  <text x="756" y="202" font-size="11.5" fill="#b9770e">p₁ = 0.2 × 给定值%</text>
  <text x="770" y="222" font-size="11" fill="#7f8c8d">60% → p₁ = 0.120 MPa</text>
  <text x="756" y="252" font-size="11.5" fill="#6c3483">Δp = 0.07 + 0.18 × 幅差%</text>
  <text x="770" y="272" font-size="11" fill="#7f8c8d">60%（第 6 格）→ Δp = 0.178</text>
  <text x="756" y="298" font-size="11.5" fill="#2c3e50">p₂ = p₁ + Δp = 0.298 MPa</text>
  <line x1="756" y1="312" x2="966" y2="312" stroke="#d5dbdb"/>
  <text x="756" y="334" font-size="11" fill="#566573">给定值螺钉每格 2%</text>
  <text x="756" y="352" font-size="11" fill="#566573">幅差螺钉每格 2%（0~10 格）</text>
  <text x="756" y="370" font-size="11" fill="#566573">点螺钉上半部/右半部 = 增大</text>
</svg>
