<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect width="1000" height="790" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b3a5c">图 1  船舶自动化电站系统组成（双机并联 + 自动化电站）</text>

  <!-- 汇流排 -->
  <rect x="100" y="150" width="820" height="18" rx="4" fill="#2c6ea8"/>
  <text x="500" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b3a5c">汇流排 BUS1（400 V / 50 Hz，8 口/相）</text>
  <text x="140" y="144" text-anchor="middle" font-size="11" fill="#46688a">第 1 口</text>
  <text x="300" y="144" text-anchor="middle" font-size="11" fill="#46688a">第 4 口</text>
  <text x="430" y="144" text-anchor="middle" font-size="11" fill="#46688a">第 5 口</text>
  <text x="560" y="144" text-anchor="middle" font-size="11" fill="#46688a">第 6 口</text>
  <text x="720" y="144" text-anchor="middle" font-size="11" fill="#46688a">第 7 口</text>
  <text x="880" y="144" text-anchor="middle" font-size="11" fill="#46688a">第 8 口</text>

  <!-- 1# 机组 -->
  <line x1="140" y1="300" x2="140" y2="168" stroke="#2c6ea8" stroke-width="3"/>
  <line x1="140" y1="470" x2="140" y2="410" stroke="#2c6ea8" stroke-width="3"/>
  <rect x="78" y="300" width="124" height="110" rx="8" fill="#eaf3fb" stroke="#2c6ea8" stroke-width="2"/>
  <text x="140" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b3a5c">1# 主开关</text>
  <text x="140" y="343" text-anchor="middle" font-size="11" fill="#46688a">qf1（框架式 ACB）</text>
  <text x="140" y="362" text-anchor="middle" font-size="10" fill="#46688a">储能 / 合闸 / 分励</text>
  <text x="140" y="379" text-anchor="middle" font-size="10" fill="#46688a">失压 / 辅助触头</text>
  <text x="140" y="396" text-anchor="middle" font-size="10" fill="#46688a">逆功率 / 过流保护</text>
  <rect x="60" y="470" width="160" height="94" rx="8" fill="#eaf3fb" stroke="#2c6ea8" stroke-width="2"/>
  <text x="140" y="496" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b3a5c">1# 同步发电机</text>
  <text x="140" y="516" text-anchor="middle" font-size="11" fill="#46688a">gen1</text>
  <text x="140" y="535" text-anchor="middle" font-size="10" fill="#46688a">80 kW / 400 V / 50 Hz</text>
  <text x="140" y="552" text-anchor="middle" font-size="10" fill="#46688a">AVR + 调速器</text>
  <rect x="50" y="646" width="180" height="58" rx="8" fill="#eef3ee" stroke="#4a7c59" stroke-width="2"/>
  <text x="140" y="669" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5c3c">1# 遥控面板 genpanel</text>
  <text x="140" y="689" text-anchor="middle" font-size="10" fill="#3f6b4c">起 / 停 · 合 / 分闸 · 调速</text>
  <line x1="140" y1="646" x2="140" y2="564" stroke="#4a7c59" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- 2# 机组 -->
  <line x1="720" y1="300" x2="720" y2="168" stroke="#2c6ea8" stroke-width="3"/>
  <line x1="720" y1="470" x2="720" y2="410" stroke="#2c6ea8" stroke-width="3"/>
  <rect x="658" y="300" width="124" height="110" rx="8" fill="#eaf3fb" stroke="#2c6ea8" stroke-width="2"/>
  <text x="720" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b3a5c">2# 主开关</text>
  <text x="720" y="343" text-anchor="middle" font-size="11" fill="#46688a">qf2（框架式 ACB）</text>
  <text x="720" y="362" text-anchor="middle" font-size="10" fill="#46688a">储能 / 合闸 / 分励</text>
  <text x="720" y="379" text-anchor="middle" font-size="10" fill="#46688a">失压 / 辅助触头</text>
  <text x="720" y="396" text-anchor="middle" font-size="10" fill="#46688a">逆功率 / 过流保护</text>
  <rect x="640" y="470" width="160" height="94" rx="8" fill="#eaf3fb" stroke="#2c6ea8" stroke-width="2"/>
  <text x="720" y="496" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b3a5c">2# 同步发电机</text>
  <text x="720" y="516" text-anchor="middle" font-size="11" fill="#46688a">gen2</text>
  <text x="720" y="535" text-anchor="middle" font-size="10" fill="#46688a">80 kW / 400 V / 50 Hz</text>
  <text x="720" y="552" text-anchor="middle" font-size="10" fill="#46688a">AVR + 调速器</text>
  <rect x="630" y="646" width="180" height="58" rx="8" fill="#eef3ee" stroke="#4a7c59" stroke-width="2"/>
  <text x="720" y="669" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5c3c">2# 遥控面板 genpanel2</text>
  <text x="720" y="689" text-anchor="middle" font-size="10" fill="#3f6b4c">起 / 停 · 合 / 分闸 · 调速</text>
  <line x1="720" y1="646" x2="720" y2="564" stroke="#4a7c59" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- 自动化电站 -->
  <rect x="420" y="596" width="160" height="92" rx="8" fill="#f4eef8" stroke="#7a4a9e" stroke-width="2"/>
  <text x="500" y="620" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b2f7a">自动化电站 auto_ctl</text>
  <text x="500" y="641" text-anchor="middle" font-size="10" fill="#6d4a86">手动 / 自动 · 备用顺序</text>
  <text x="500" y="659" text-anchor="middle" font-size="10" fill="#6d4a86">并车 / 解列判据</text>
  <text x="500" y="677" text-anchor="middle" font-size="10" fill="#6d4a86">失电起动 · 故障换机</text>
  <line x1="420" y1="675" x2="232" y2="675" stroke="#4a7c59" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="326" y="667" text-anchor="middle" font-size="10" fill="#3f6b4c">comm1（通信）</text>
  <line x1="580" y1="675" x2="628" y2="675" stroke="#4a7c59" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="604" y="667" text-anchor="middle" font-size="10" fill="#3f6b4c">comm2</text>
  <path d="M 470 596 L 300 596 L 300 168" fill="none" stroke="#7a4a9e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="306" y="470" font-size="10" fill="#5b2f7a">母线电压采集（第 4 口）</text>

  <!-- 重载询问：侧推器 -->
  <line x1="430" y1="168" x2="430" y2="240" stroke="#c08a24" stroke-width="3"/>
  <rect x="368" y="240" width="124" height="112" rx="8" fill="#fdf6ec" stroke="#c08a24" stroke-width="2"/>
  <text x="430" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5310">重载询问---侧推器</text>
  <text x="430" y="280" text-anchor="middle" font-size="10" fill="#8a6d3b">heavyload（默认隐藏）</text>
  <text x="430" y="298" text-anchor="middle" font-size="10" fill="#8a6d3b">直接起动 / 重载询问</text>
  <text x="430" y="316" text-anchor="middle" font-size="10" fill="#8a6d3b">起动/询问 · 停止</text>
  <text x="430" y="334" text-anchor="middle" font-size="10" fill="#8a6d3b">功率 45 kW</text>
  <path d="M 430 352 L 430 596" fill="none" stroke="#7a4a9e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="438" y="430" font-size="10" fill="#5b2f7a">heavy_a / heavy_b</text>
  <text x="438" y="446" font-size="10" fill="#5b2f7a">（询问通信）</text>

  <!-- 三相可调负载 -->
  <line x1="560" y1="168" x2="560" y2="240" stroke="#c08a24" stroke-width="3"/>
  <rect x="500" y="240" width="120" height="86" rx="8" fill="#fdf6ec" stroke="#c08a24" stroke-width="2"/>
  <text x="560" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5310">三相可调负载</text>
  <text x="560" y="284" text-anchor="middle" font-size="11" fill="#8a6d3b">load3</text>
  <text x="560" y="303" text-anchor="middle" font-size="10" fill="#8a6d3b">20 ~ 50 kW</text>

  <!-- 馈出支路：QF3 → 三盏灯 -->
  <line x1="880" y1="168" x2="880" y2="240" stroke="#2c6ea8" stroke-width="2"/>
  <rect x="830" y="240" width="100" height="58" rx="6" fill="#eaf3fb" stroke="#2c6ea8" stroke-width="2"/>
  <text x="880" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b3a5c">QF3</text>
  <text x="880" y="283" text-anchor="middle" font-size="10" fill="#46688a">acb_l</text>
  <line x1="880" y1="298" x2="880" y2="330" stroke="#2c6ea8" stroke-width="2"/>
  <line x1="850" y1="330" x2="910" y2="330" stroke="#2c6ea8" stroke-width="2"/>
  <line x1="850" y1="330" x2="850" y2="346" stroke="#c08a24" stroke-width="2"/>
  <line x1="880" y1="330" x2="880" y2="346" stroke="#c08a24" stroke-width="2"/>
  <line x1="910" y1="330" x2="910" y2="346" stroke="#c08a24" stroke-width="2"/>
  <circle cx="850" cy="360" r="13" fill="#fdf6ec" stroke="#c08a24" stroke-width="2"/>
  <circle cx="880" cy="360" r="13" fill="#fdf6ec" stroke="#c08a24" stroke-width="2"/>
  <circle cx="910" cy="360" r="13" fill="#fdf6ec" stroke="#c08a24" stroke-width="2"/>
  <text x="880" y="396" text-anchor="middle" font-size="10" fill="#8a6d3b">lamp1 / lamp2 / lamp3</text>
  <text x="880" y="412" text-anchor="middle" font-size="10" fill="#8a6d3b">（L1 / L2 / L3）</text>

  <!-- 说明 -->
  <rect x="60" y="726" width="880" height="46" rx="6" fill="#f7f9fc" stroke="#c9d6e3" stroke-width="1.5"/>
  <text x="76" y="745" font-size="10.5" fill="#46688a">DC 24 V 控制电源 dc_uv / dc_uv2（每机组一套）：储能电机、合闸/分励/失压线圈、遥控面板与自动化电站供电。</text>
  <text x="76" y="763" font-size="10.5" fill="#46688a">自动化电站经 comm1/comm2 控制两块遥控面板，实现自动起动、自动并车、自动解列与故障换机。</text>
</svg>
