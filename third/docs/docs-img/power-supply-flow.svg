  <text x="38" y="366" font-size="11.5" fill="#37474f"><tspan font-weight="bold" fill="#c62828">读图顺序</tspan>：沿电流方向逐级检查——变压器副边是否有 12 V 交流 → 整流桥输出是否为单向脉动 → 滤波电容两端是否被“填平” → 7805 输出是否稳定 5 V。</text>
  <text x="38" y="390" font-size="11.5" fill="#37474f">哪一级的波形与图中不符，故障就在那一级：整流桥有一只二极管开路 → 半波脉动；滤波电容失效 → 脉动不变；7805 输入不足 7 V → 输出跌到 5 V 以下。</text>
