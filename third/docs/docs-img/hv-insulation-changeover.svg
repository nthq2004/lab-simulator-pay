<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="980" height="400" fill="#ffffff"/>
  <text x="490" y="28" font-size="17" font-weight="bold" fill="#1a252f" text-anchor="middle">图 2　日用变压器「先合后断」转换操作时序</text>

  <!-- 阶段卡片 -->
  <g>
    <rect x="40" y="60" width="200" height="210" rx="8" fill="#f8f9f9" stroke="#95a5a6" stroke-width="1.3"/>
    <text x="140" y="84" font-size="12.5" font-weight="bold" fill="#2c3e50" text-anchor="middle">① 转换前</text>
    <rect x="70" y="100" width="140" height="26" rx="4" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.2"/>
    <text x="140" y="118" font-size="10.5" fill="#145a32" text-anchor="middle">1# 变 vcbs3 + aq1 合</text>
    <rect x="70" y="134" width="140" height="26" rx="4" fill="#f2f3f4" stroke="#95a5a6" stroke-width="1.2"/>
    <text x="140" y="152" font-size="10.5" fill="#7f8c8d" text-anchor="middle">2# 变 分</text>
    <rect x="70" y="168" width="140" height="26" rx="4" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.2"/>
    <text x="140" y="186" font-size="10.5" fill="#145a32" text-anchor="middle">低压母联 aq3 合</text>
    <text x="140" y="216" font-size="10" fill="#2c3e50" text-anchor="middle">低压 440 V 母线由 1# 变供电</text>
    <text x="140" y="236" font-size="10" fill="#7f8c8d" text-anchor="middle">白炽灯点亮</text>
    <text x="140" y="258" font-size="10" fill="#7f8c8d" text-anchor="middle">（母线不失电）</text>
  </g>

  <!-- 箭头1 -->
  <line x1="240" y1="165" x2="290" y2="165" stroke="#2471a3" stroke-width="3"/>
  <polygon points="290,165 278,159 278,171" fill="#2471a3"/>

  <g>
    <rect x="290" y="60" width="200" height="210" rx="8" fill="#fdf3e7" stroke="#b9770e" stroke-width="1.3"/>
    <text x="390" y="84" font-size="12.5" font-weight="bold" fill="#7e5109" text-anchor="middle">② 合上备用变压器</text>
    <rect x="320" y="100" width="140" height="26" rx="4" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.2"/>
    <text x="390" y="118" font-size="10.5" fill="#145a32" text-anchor="middle">1# 变 运行</text>
    <rect x="320" y="134" width="140" height="26" rx="4" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.2"/>
    <text x="390" y="152" font-size="10.5" fill="#145a32" text-anchor="middle">2# 变 vcbs4 + aq2 合</text>
    <text x="390" y="184" font-size="10" fill="#b9770e" text-anchor="middle">两台变压器短时并联</text>
    <text x="390" y="206" font-size="10" fill="#c0392b" text-anchor="middle">要求：变比/组别/短路阻抗一致</text>
    <text x="390" y="228" font-size="10" fill="#2c3e50" text-anchor="middle">此时负荷由两台变压器分担</text>
    <text x="390" y="250" font-size="10" fill="#7f8c8d" text-anchor="middle">母线始终有电</text>
  </g>

  <line x1="490" y1="165" x2="540" y2="165" stroke="#2471a3" stroke-width="3"/>
  <polygon points="540,165 528,159 528,171" fill="#2471a3"/>

  <g>
    <rect x="540" y="60" width="200" height="210" rx="8" fill="#fef5f4" stroke="#c0392b" stroke-width="1.3"/>
    <text x="640" y="84" font-size="12.5" font-weight="bold" fill="#922b21" text-anchor="middle">③ 退出 1# 变压器</text>
    <rect x="570" y="100" width="140" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
    <text x="640" y="118" font-size="10.5" fill="#922b21" text-anchor="middle">先断低压 aq1</text>
    <rect x="570" y="134" width="140" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
    <text x="640" y="152" font-size="10.5" fill="#922b21" text-anchor="middle">后断高压 vcbs3</text>
    <text x="640" y="184" font-size="10" fill="#2c3e50" text-anchor="middle">防止高压侧带负荷分闸引弧</text>
    <text x="640" y="206" font-size="10" fill="#2c3e50" text-anchor="middle">负荷由 2# 变独自承担</text>
    <text x="640" y="228" font-size="10" fill="#7f8c8d" text-anchor="middle">白炽灯保持点亮</text>
  </g>

  <line x1="740" y1="165" x2="790" y2="165" stroke="#2471a3" stroke-width="3"/>
  <polygon points="790,165 778,159 778,171" fill="#2471a3"/>

  <g>
    <rect x="790" y="60" width="150" height="210" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="1.3"/>
    <text x="865" y="84" font-size="12.5" font-weight="bold" fill="#145a32" text-anchor="middle">④ 转换完成</text>
    <rect x="812" y="104" width="106" height="26" rx="4" fill="#f2f3f4" stroke="#95a5a6" stroke-width="1.2"/>
    <text x="865" y="122" font-size="10.5" fill="#7f8c8d" text-anchor="middle">1# 变 分</text>
    <rect x="812" y="138" width="106" height="26" rx="4" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.2"/>
    <text x="865" y="156" font-size="10.5" fill="#145a32" text-anchor="middle">2# 变 运行</text>
    <text x="865" y="188" font-size="10" fill="#145a32" text-anchor="middle">2# 变单独供电</text>
    <text x="865" y="210" font-size="10" fill="#2c3e50" text-anchor="middle">1# 变停电可检修</text>
  </g>

  <!-- 底部要点 -->
  <rect x="40" y="296" width="900" height="76" rx="6" fill="#f4f8fb" stroke="#aed6f1" stroke-width="1.3"/>
  <text x="60" y="320" font-size="11.5" font-weight="bold" fill="#1a5276">操作要点</text>
  <text x="60" y="342" font-size="10.5" fill="#2c3e50">· 转换全过程低压母线不得失电：先合上备用变压器，形成短时并联后再退出运行变压器</text>
  <text x="60" y="362" font-size="10.5" fill="#2c3e50">· 退出顺序「先低压、后高压」；投入顺序「先高压、后低压」，避免带负荷拉合高压开关</text>
</svg>
