<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="d3" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4a5a66"/>
    </marker>
    <style>
      .tb { font-size:15px; font-weight:bold; fill:#1b3a4b; }
      .t  { font-size:12.5px; fill:#22303a; }
      .ts { font-size:11.5px; fill:#5b666d; }
      .grp{ fill:#f7f9fa; stroke:#a8b0b5; stroke-width:1.2; }
      .stp{ fill:#eef1f2; stroke:#8b959c; stroke-width:1.4; }
      .wrn{ fill:#fff6e0; stroke:#b08a2c; stroke-width:1.4; }
      .alm{ fill:#fdecea; stroke:#c62828; stroke-width:1.6; }
      .ar { stroke:#4a5a66; stroke-width:1.6; fill:none; marker-end:url(#d3); }
    </style>
  </defs>

  <text x="24" y="32" class="tb" font-size="18">图 3　Dead Man（轮机员安全系统）的动作逻辑与分级报警</text>

  <!-- 五步链 -->
  <rect x="44" y="70" width="176" height="100" class="stp" rx="6"/>
  <text x="132" y="96" class="tb" font-size="13" text-anchor="middle">① 旋钮打到「开」</text>
  <text x="132" y="120" class="ts" text-anchor="middle">按住右半＝开</text>
  <text x="132" y="142" class="ts" text-anchor="middle">计时清零并开始计时</text>

  <rect x="240" y="70" width="176" height="100" class="stp" rx="6"/>
  <text x="328" y="96" class="tb" font-size="13" text-anchor="middle">② 正常计时</text>
  <text x="328" y="120" class="ts" text-anchor="middle">运行灯绿色常亮</text>
  <text x="328" y="142" class="ts" text-anchor="middle">计时未超过预警时间</text>

  <rect x="436" y="70" width="176" height="100" class="wrn" rx="6"/>
  <text x="524" y="96" class="tb" font-size="13" text-anchor="middle">③ 到预警时间</text>
  <text x="524" y="120" class="ts" text-anchor="middle">机舱蜂鸣器闪烁</text>
  <text x="524" y="142" class="ts" text-anchor="middle">提醒人员按复位</text>

  <rect x="632" y="70" width="176" height="100" class="alm" rx="6"/>
  <text x="720" y="96" class="tb" font-size="13" text-anchor="middle">④ 预警 ＋ 报警时间</text>
  <text x="720" y="120" class="ts" text-anchor="middle">向 K-Chief 发 A 级报警</text>
  <text x="720" y="142" class="ts" text-anchor="middle">延伸面板显示 DEADMAN</text>

  <rect x="828" y="70" width="176" height="100" class="stp" rx="6"/>
  <text x="916" y="96" class="tb" font-size="13" text-anchor="middle">⑤ 按任意复位</text>
  <text x="916" y="120" class="ts" text-anchor="middle">计时清零、重新计时</text>
  <text x="916" y="142" class="ts" text-anchor="middle">蜂鸣与报警同时消除</text>

  <path class="ar" d="M220,120 H236"/>
  <path class="ar" d="M416,120 H432"/>
  <path class="ar" d="M612,120 H628"/>
  <path class="ar" d="M808,120 H824"/>

  <!-- 状态图例 -->
  <rect x="24" y="190" width="320" height="42" rx="4" fill="#ffffff" stroke="#8b959c" stroke-width="1.2"/>
  <rect x="34" y="200" width="22" height="22" rx="3" fill="#22d61d" stroke="#1d4f1a" stroke-width="1.2"/>
  <text x="64" y="216" class="t">绿色常亮：系统运行、正在计时</text>

  <rect x="360" y="190" width="320" height="42" rx="4" fill="#fff6e0" stroke="#b08a2c" stroke-width="1.2"/>
  <rect x="370" y="200" width="22" height="22" rx="3" fill="#f2c94c" stroke="#8a6a1f" stroke-width="1.2"/>
  <text x="400" y="216" class="t">蜂鸣器闪烁：已超过预警时间</text>

  <rect x="696" y="190" width="320" height="42" rx="4" fill="#fdecea" stroke="#c62828" stroke-width="1.2"/>
  <rect x="706" y="200" width="22" height="22" rx="3" fill="#c62828" stroke="#7a0f0f" stroke-width="1.2"/>
  <text x="736" y="216" class="t">红底 DEADMAN：超过预警＋报警时间</text>

  <!-- 三块面板说明 -->
  <rect x="24" y="252" width="320" height="130" class="grp" rx="6"/>
  <text x="40" y="278" class="tb" font-size="13">时间设置（非模态对话框）</text>
  <text x="40" y="302" class="t">预警时间：默认 27 min，最小 1 min</text>
  <text x="40" y="324" class="t">报警时间：默认 3 min，最小 0 min</text>
  <text x="40" y="346" class="t">两者步进均为 0.5 min</text>
  <text x="40" y="368" class="ts">改完点右上角 × 关闭，设置立即生效</text>

  <rect x="360" y="252" width="320" height="130" class="grp" rx="6"/>
  <text x="376" y="278" class="tb" font-size="13">复位按钮的布置</text>
  <text x="376" y="302" class="t">集控台面板：1 只</text>
  <text x="376" y="324" class="t">机舱入口甲板上层左：4 只</text>
  <text x="376" y="346" class="t">机舱入口甲板上层右：4 只</text>
  <text x="376" y="368" class="ts">按任意一只即清零，不必走到集控台</text>

  <rect x="696" y="252" width="320" height="130" class="grp" rx="6"/>
  <text x="712" y="278" class="tb" font-size="13">面板上的表现</text>
  <text x="712" y="302" class="t">DEADMAN 只在驾驶台与轮机长显示</text>
  <text x="712" y="324" class="t">报警等级为 A 级，伴蜂鸣</text>
  <text x="712" y="346" class="t">只能由安全系统复位按钮清除</text>
  <text x="712" y="368" class="ts">主站按下 ACK 只能消闪，报警仍在</text>

  <!-- 要点 -->
  <rect x="24" y="396" width="992" height="146" class="grp" rx="6"/>
  <text x="40" y="424" class="tb" font-size="13">操作要点</text>
  <text x="40" y="450" class="t">• 演示前先把时间改小：预警 1 min、报警 0.5 min；默认 27 min + 3 min 需长时间等待。</text>
  <text x="40" y="474" class="t">• 「关｜开」是自复位旋钮：松手后指针回中位，系统的运行状态与计时保持不变。</text>
  <text x="40" y="498" class="t">• 报警时间设为 0 min 时，一到预警时间就直接升级为 DEADMAN，不再有蜂鸣预警段。</text>
  <text x="40" y="522" class="ts">口诀：开→计时，到点→蜂鸣，再超时→DEADMAN，复位→清零重来。</text>
</svg>
