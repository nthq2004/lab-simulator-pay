<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="560" viewBox="0 0 1020 560" font-family="'Microsoft YaHei','Source Han Sans SC',sans-serif">
  <rect width="1020" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b7f9e"/>
    </marker>
    <marker id="ar2r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9534f"/>
    </marker>
  </defs>

  <text x="510" y="28" font-size="17" font-weight="bold" fill="#1f2d3d" text-anchor="middle">风油切断装置与火警系统、CO₂ 释放系统的关系</text>

  <!-- 火警线路 -->
  <rect x="40" y="60" width="300" height="150" rx="6" fill="#fff5f5" stroke="#d9534f" stroke-width="1.6"/>
  <text x="190" y="82" font-size="13" font-weight="bold" fill="#a13b39" text-anchor="middle">火灾自动报警系统（FAS）</text>
  <g font-size="10.5" fill="#1f2d3d">
    <text x="58" y="106">· 感烟 / 感温探测器报警</text>
    <text x="58" y="128">· 手动报警按钮动作</text>
    <text x="58" y="150">· 控制器显示火警区域、声光报警</text>
    <text x="58" y="172">· 值班人员确认火情</text>
  </g>
  <text x="58" y="196" font-size="9.5" fill="#7a4a4a">（报警本身不直接切断，需人工确认后操作）</text>

  <!-- CO2 系统 -->
  <rect x="40" y="330" width="300" height="180" rx="6" fill="#f2f7fd" stroke="#3b82c4" stroke-width="1.6"/>
  <text x="190" y="352" font-size="13" font-weight="bold" fill="#1b4f80" text-anchor="middle">CO₂ 固定灭火系统</text>
  <g font-size="10.5" fill="#1f2d3d">
    <text x="58" y="376">· 机舱 CO₂ 释放前延时（20~60 s）</text>
    <text x="58" y="398">· 延时期间必须完成风油切断</text>
    <text x="58" y="420">· 风机未停、油泵未停时禁止释放</text>
    <text x="58" y="442">· 释放后人员撤离、封闭机舱</text>
  </g>
  <text x="58" y="470" font-size="9.5" fill="#3f5c78">（风机不停会吹散 CO₂；油泵不停会持续供油助燃）</text>

  <!-- 中部：风油切断装置 -->
  <rect x="400" y="150" width="260" height="260" rx="8" fill="#f4f8f2" stroke="#5a7a5a" stroke-width="2"/>
  <text x="530" y="176" font-size="13" font-weight="bold" fill="#0b6a14" text-anchor="middle">风油切断装置</text>
  <rect x="418" y="190" width="224" height="46" rx="4" fill="#ffffff" stroke="#8aa78a"/>
  <text x="530" y="210" font-size="10.5" fill="#1a252f" text-anchor="middle">消防控制室 / 驾驶台控制屏</text>
  <text x="530" y="228" font-size="9.5" fill="#5a6a75" text-anchor="middle">4 路自锁按钮（ESS-1F / ESS-1P）</text>

  <rect x="418" y="246" width="224" height="46" rx="4" fill="#ffffff" stroke="#8aa78a"/>
  <text x="530" y="266" font-size="10.5" fill="#1a252f" text-anchor="middle">24 V 控制回路 + 中间继电器</text>
  <text x="530" y="284" font-size="9.5" fill="#5a6a75" text-anchor="middle">KA1（风机）/ KA2（油泵）</text>

  <rect x="418" y="302" width="224" height="46" rx="4" fill="#ffffff" stroke="#8aa78a"/>
  <text x="530" y="322" font-size="10.5" fill="#1a252f" text-anchor="middle">分励脱扣器 SR → 塑壳断路器</text>
  <text x="530" y="340" font-size="9.5" fill="#5a6a75" text-anchor="middle">3 路风机 + 3 路油泵同时跳闸</text>

  <rect x="418" y="358" width="224" height="40" rx="4" fill="#fff0f0" stroke="#d9534f"/>
  <text x="530" y="382" font-size="10" fill="#a13b39" text-anchor="middle">燃油泵全停 → 发电机停机 → 全船失电</text>

  <!-- 后果 -->
  <rect x="740" y="150" width="240" height="150" rx="6" fill="#f7f7f7" stroke="#7a8494" stroke-width="1.6"/>
  <text x="860" y="172" font-size="12" font-weight="bold" fill="#2c3a45" text-anchor="middle">被切断的负荷</text>
  <g font-size="10.5" fill="#1f2d3d">
    <text x="756" y="196">· 机舱风机 / 住舱风机 / 泵房风机</text>
    <text x="756" y="218">· 滑油泵 / 燃油泵 / 增压泵</text>
    <text x="756" y="240">· 火灾区域通风停止，供油停止</text>
    <text x="756" y="262">· 主配电板失电，其他负载随之停电</text>
  </g>

  <rect x="740" y="330" width="240" height="180" rx="6" fill="#f7f7f7" stroke="#7a8494" stroke-width="1.6"/>
  <text x="860" y="352" font-size="12" font-weight="bold" fill="#2c3a45" text-anchor="middle">恢复供电与复位</text>
  <g font-size="10.5" fill="#1f2d3d">
    <text x="756" y="376">① 弹出全部切断按钮</text>
    <text x="756" y="398">② 重新起动发电机组建压</text>
    <text x="756" y="420">③ 塑壳断路器复位 OFF → 合闸 ON</text>
    <text x="756" y="442">④ 按 MAN 手动起动风机 / 油泵</text>
  </g>
  <text x="756" y="470" font-size="9.5" fill="#5a6a75">切断按钮未弹出前，合闸即跳闸</text>

  <!-- 连线 -->
  <path d="M340 140 L396 210" fill="none" stroke="#d9534f" stroke-width="2.2" marker-end="url(#ar2r)"/>
  <text x="352" y="176" font-size="10" fill="#a13b39">人工确认后操作</text>

  <path d="M340 400 L396 380" fill="none" stroke="#3b82c4" stroke-width="2.2" marker-end="url(#ar2)"/>
  <text x="330" y="428" font-size="10" fill="#1b4f80">延时联动 / 联锁</text>

  <path d="M660 230 L736 220" fill="none" stroke="#5b7f9e" stroke-width="2.2" marker-end="url(#ar2)"/>
  <path d="M660 380 L736 400" fill="none" stroke="#5b7f9e" stroke-width="2.2" marker-end="url(#ar2)"/>

  <text x="510" y="534" font-size="9.5" fill="#5a6a75" text-anchor="middle">风油切断是火灾（尤其机舱火灾）处置的“前置动作”：先断风断油，再施放灭火剂，防止复燃与人员伤害</text>
</svg>
