<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470">
  <rect width="920" height="470" fill="#f7f9f8"/>
  <text x="460" y="28" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="bold" fill="#263238">二分法：用最少的测量次数锁定断点</text>

  <!-- 被测通路 -->
  <text x="60" y="70" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="bold" fill="#37474f">被测通路（以 U 相为例，KM1 已强制闭合）</text>
  <g stroke="#37474f" stroke-width="2" fill="none">
    <path d="M60 120 L120 120"/><path d="M200 120 L260 120"/><path d="M340 120 L400 120"/>
    <path d="M480 120 L540 120"/><path d="M620 120 L680 120"/>
  </g>
  <!-- 元件块 -->
  <rect x="120" y="100" width="80" height="40" rx="4" fill="#ffffff" stroke="#455a64" stroke-width="1.6"/>
  <text x="160" y="126" text-anchor="middle" font-family="Arial" font-size="11" fill="#37474f">QF</text>
  <rect x="260" y="100" width="80" height="40" rx="4" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.6"/>
  <text x="292" y="126" text-anchor="middle" font-family="Arial" font-size="11" fill="#283593">KM1</text>
  <rect x="400" y="100" width="80" height="40" rx="4" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.6"/>
  <text x="440" y="126" text-anchor="middle" font-family="Arial" font-size="11" fill="#e65100">FR</text>
  <rect x="540" y="100" width="80" height="40" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="580" y="126" text-anchor="middle" font-family="Arial" font-size="11" fill="#1b5e20">M</text>
  <text x="60" y="112" font-family="Arial" font-size="10" fill="#37474f">U</text>

  <!-- 测量点 -->
  <g fill="#0d47a1">
    <circle cx="60" cy="120" r="5"/><circle cx="680" cy="120" r="5"/>
    <circle cx="240" cy="120" r="5"/><circle cx="380" cy="120" r="5"/><circle cx="520" cy="120" r="5"/>
  </g>
  <text x="60" y="150" text-anchor="middle" font-family="Arial" font-size="10" fill="#0d47a1">①</text>
  <text x="680" y="150" text-anchor="middle" font-family="Arial" font-size="10" fill="#0d47a1">②</text>
  <text x="240" y="150" text-anchor="middle" font-family="Arial" font-size="10" fill="#0d47a1">③</text>
  <text x="380" y="150" text-anchor="middle" font-family="Arial" font-size="10" fill="#0d47a1">④</text>
  <text x="520" y="150" text-anchor="middle" font-family="Arial" font-size="10" fill="#0d47a1">⑤</text>

  <!-- 断点标记 -->
  <circle cx="300" cy="120" r="20" fill="none" stroke="#e53935" stroke-width="2.4" stroke-dasharray="5 3"/>
  <g stroke="#e53935" stroke-width="2.6"><line x1="306" y1="110" x2="318" y2="124"/><line x1="318" y1="110" x2="306" y2="124"/></g>
  <text x="300" y="86" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="bold" fill="#c62828">断点（KM1 L3-T3 断路）</text>

  <!-- 步骤 -->
  <rect x="60" y="180" width="400" height="240" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-width="1.4"/>
  <text x="76" y="204" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="bold" fill="#263238">测量顺序（每次排除一半）</text>
  <text x="76" y="230" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">第 1 次：表笔接 ①—②（首尾两端）</text>
  <text x="76" y="252" font-family="Microsoft YaHei, Arial" font-size="11" fill="#546e7a">→ 读数 O.L，说明断点在这条通路上</text>
  <text x="76" y="280" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">第 2 次：取中间元件两端 ③—④（KM1）</text>
  <text x="76" y="302" font-family="Microsoft YaHei, Arial" font-size="11" fill="#546e7a">→ 读数 O.L，断点就在 KM1 内部</text>
  <text x="76" y="330" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">第 3 次：断点已在 ③—④ 内，再分相核对</text>
  <text x="76" y="352" font-family="Microsoft YaHei, Arial" font-size="11" fill="#546e7a">→ 单独测 KM1 的 L3—T3 一对触头确认</text>
  <text x="76" y="384" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">对照：④—⑤（KM1 之后）若为 0Ω</text>
  <text x="76" y="406" font-family="Microsoft YaHei, Arial" font-size="11" fill="#546e7a">→ 说明 KM1 之后的 FR、电动机段通路良好</text>

  <!-- 右侧对照表 -->
  <rect x="480" y="180" width="380" height="240" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-width="1.4"/>
  <text x="496" y="204" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="bold" fill="#263238">为什么不"逐个拆开测"</text>
  <text x="496" y="232" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">· 元件多时，逐个测最坏要拆测 10 次以上，</text>
  <text x="508" y="252" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">还要反复拆线，费时且易造成新故障。</text>
  <text x="496" y="282" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">· 二分法每次把范围缩小一半：</text>
  <text x="508" y="304" font-family="Microsoft YaHei, Arial" font-size="11" fill="#0d47a1">n 个元件最多 ⌈log₂n⌉ 次即可定位。</text>
  <text x="496" y="334" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">· 前提：通路中间元件两端必须"可测"，</text>
  <text x="508" y="354" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">因此断电测阻前要强制闭合主触头，</text>
  <text x="508" y="374" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">使整条通路在电气上连通。</text>
  <text x="496" y="404" font-family="Microsoft YaHei, Arial" font-size="10" fill="#546e7a">带电测压法同样适用二分：测到 220V 的那一对端子即断点。</text>

  <text x="60" y="448" font-family="Microsoft YaHei, Arial" font-size="11" fill="#546e7a">测电阻前务必断电；读数 O.L（超量程）表示断路，接近 0Ω 表示导通。</text>
</svg>
