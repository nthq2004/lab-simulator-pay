<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330">
  <rect width="920" height="330" fill="#ffffff"/>
  <text x="16" y="28" font-family="Microsoft YaHei,Arial" font-size="16" font-weight="bold" fill="#1b3a4b">图 2  汽包水位双位（两段式）给水控制闭环</text>

  <!-- 汽包 -->
  <rect x="40" y="70" width="170" height="200" rx="14" fill="#eef3f6" stroke="#26323a" stroke-width="2"/>
  <text x="125" y="62" font-family="Microsoft YaHei" font-size="12" fill="#37474f" text-anchor="middle">汽包（D 型锅炉）</text>
  <rect x="52" y="142" width="146" height="116" fill="#9fd8f5" stroke="#0288d1" stroke-width="1"/>
  <text x="125" y="205" font-family="Microsoft YaHei" font-size="12" fill="#01579b" text-anchor="middle">控制带 35% ~ 70%</text>
  <line x1="52" y1="142" x2="198" y2="142" stroke="#ef4b32" stroke-width="2.5"/>
  <text x="196" y="138" font-family="Microsoft YaHei" font-size="11" fill="#c62828" text-anchor="end">水位线 56 %</text>

  <!-- 电极 -->
  <rect x="230" y="80" width="120" height="180" rx="8" fill="#f7f9fa" stroke="#455a64" stroke-width="2"/>
  <text x="290" y="72" font-family="Microsoft YaHei" font-size="12" fill="#37474f" text-anchor="middle">电极室 / 玻璃水位计</text>
  <line x1="230" y1="110" x2="350" y2="110" stroke="#68747c" stroke-width="5"/>
  <line x1="230" y1="235" x2="350" y2="235" stroke="#68747c" stroke-width="5"/>
  <line x1="248" y1="96" x2="316" y2="96" stroke="#263238" stroke-width="2.5"/>
  <text x="322" y="99" font-family="Microsoft YaHei" font-size="10" fill="#082e70">HH 85%</text>
  <line x1="262" y1="120" x2="330" y2="120" stroke="#263238" stroke-width="2.5"/>
  <text x="336" y="123" font-family="Microsoft YaHei" font-size="10" fill="#082e70">H 70%</text>
  <line x1="276" y1="176" x2="344" y2="176" stroke="#263238" stroke-width="2.5"/>
  <text x="350" y="179" font-family="Microsoft YaHei" font-size="10" fill="#082e70">L 35%</text>
  <line x1="290" y1="200" x2="344" y2="200" stroke="#263238" stroke-width="2.5"/>
  <text x="350" y="203" font-family="Microsoft YaHei" font-size="10" fill="#082e70">LL 20%</text>

  <!-- 箭头 汽包→电极 -->
  <line x1="212" y1="165" x2="228" y2="165" stroke="#455a64" stroke-width="2" marker-end="url(#a1)"/>

  <!-- PLC -->
  <rect x="410" y="70" width="210" height="200" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="515" y="62" font-family="Microsoft YaHei" font-size="12" fill="#1b5e20" text-anchor="middle">PLC（CPU SR40）</text>
  <text x="424" y="100" font-family="Microsoft YaHei" font-size="11" fill="#1b5e20">I0.4 水位双位控制</text>
  <text x="424" y="122" font-family="Microsoft YaHei" font-size="11" fill="#1b5e20">I0.5 超高水位 / I0.6 危险低水位</text>
  <text x="424" y="150" font-family="Microsoft YaHei" font-size="11" fill="#c62828">程序段 3 / 4：泵自动＋手动</text>
  <text x="424" y="172" font-family="Microsoft YaHei" font-size="11" fill="#c62828">AN Q0.2 超高水位封锁给水</text>
  <text x="424" y="200" font-family="Microsoft YaHei" font-size="11" fill="#1b5e20">Q0.0 → 1# 给水泵接触器</text>
  <text x="424" y="222" font-family="Microsoft YaHei" font-size="11" fill="#1b5e20">Q0.1 → 2# 给水泵接触器</text>
  <text x="424" y="252" font-family="Microsoft YaHei" font-size="11" fill="#c62828">Q0.2 / Q0.3 高低水位报警</text>

  <line x1="352" y1="140" x2="408" y2="140" stroke="#455a64" stroke-width="2" marker-end="url(#a1)"/>
  <text x="380" y="132" font-family="Microsoft YaHei" font-size="10" fill="#546e7a">电极信号</text>

  <!-- 泵 -->
  <circle cx="710" cy="150" r="34" fill="#ffffff" stroke="#00695c" stroke-width="2.5"/>
  <polygon points="710,128 726,158 694,158" fill="#ffffff" stroke="#00695c" stroke-width="2"/>
  <text x="710" y="205" font-family="Microsoft YaHei" font-size="12" fill="#004d40" text-anchor="middle">1# / 2# 给水泵</text>
  <line x1="622" y1="150" x2="672" y2="150" stroke="#455a64" stroke-width="2" marker-end="url(#a1)"/>

  <!-- 回水 -->
  <path d="M710 184 L710 268 L125 268 L125 272" fill="none" stroke="#0288d1" stroke-width="3" marker-end="url(#a2)"/>
  <text x="418" y="286" font-family="Microsoft YaHei" font-size="11" fill="#01579b" text-anchor="middle">给水（2.2 %/s）</text>
  <text x="650" y="304" font-family="Microsoft YaHei" font-size="11" fill="#37474f">蒸发 0.30/0.55 %/s · 排污 1.0 %/s</text>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#455a64"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0288d1"/></marker>
  </defs>
</svg>
