<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <rect width="900" height="430" fill="#f7f9f8"/>
  <text x="450" y="28" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="bold" fill="#263238">自锁回路的两个工作状态</text>

  <!-- ═══════════ ① 按住 SB2：SB2 闭合、KM1 常开断开 ═══════════ -->
  <text x="60" y="52" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="bold" fill="#c62828">① 按住 SB2：线圈得电</text>

  <!-- 带电回路（红线） -->
  <g stroke="#e53935" stroke-width="2.6" fill="none">
    <path d="M70 290 V110 H150"/>
    <line x1="150" y1="110" x2="190" y2="110"/>
    <path d="M190 110 H330 V165"/>
    <path d="M330 220 V290 H205"/>
    <line x1="205" y1="290" x2="165" y2="290"/>
    <path d="M165 290 H70"/>
  </g>

  <!-- 失电支路（KM1 常开，断开）：黑线 -->
  <g stroke="#37474f" stroke-width="2.4" fill="none">
    <path d="M200 110 V155 H215"/>
    <path d="M265 155 H280 V110"/>
    <line x1="215" y1="155" x2="256" y2="142"/>
  </g>
  <line x1="200" y1="110" x2="215" y2="110" stroke="#e53935" stroke-width="2.6"/>
  <line x1="265" y1="110" x2="280" y2="110" stroke="#e53935" stroke-width="2.6"/>

  <!-- 触点端点 -->
  <g fill="#37474f">
    <circle cx="150" cy="110" r="3"/><circle cx="190" cy="110" r="3"/>
    <circle cx="215" cy="110" r="3"/><circle cx="265" cy="110" r="3"/>
    <circle cx="215" cy="155" r="3"/><circle cx="265" cy="155" r="3"/>
    <circle cx="165" cy="290" r="3"/><circle cx="205" cy="290" r="3"/>
    <circle cx="200" cy="110" r="3"/><circle cx="280" cy="110" r="3"/>
  </g>

  <!-- 按钮推杆 -->
  <g stroke="#546e7a" stroke-width="1.4" fill="none">
    <line x1="170" y1="110" x2="170" y2="98"/><line x1="161" y1="98" x2="179" y2="98"/>
    <line x1="240" y1="110" x2="240" y2="98"/><line x1="231" y1="98" x2="249" y2="98"/>
    <line x1="185" y1="290" x2="185" y2="278"/><line x1="177" y1="278" x2="193" y2="278"/>
  </g>

  <!-- 线圈 -->
  <rect x="310" y="165" width="40" height="55" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.8"/>
  <text x="330" y="198" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#283593">KM1</text>

  <!-- 标注 -->
  <text x="170" y="88" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">SB1</text>
  <text x="240" y="88" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#c62828">SB2（按下闭合）</text>
  <text x="245" y="176" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">KM1 常开（此时断开）</text>
  <text x="358" y="198" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">线圈</text>
  <text x="78" y="205" font-family="Microsoft YaHei, Arial" font-size="11" fill="#546e7a">TC 副边</text>
  <text x="185" y="312" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">FR 常闭</text>
  <text x="70" y="356" font-family="Microsoft YaHei, Arial" font-size="12" fill="#c62828">SB2 闭合 → 回路接通 → 线圈 KM1 得电吸合。</text>

  <!-- ═══════════ ② 松开 SB2：SB2 断开、KM1 常开闭合自锁 ═══════════ -->
  <text x="500" y="52" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="bold" fill="#2e7d32">② 松开 SB2：由 KM1 常开触头自锁</text>

  <!-- 带电回路（红线，经 KM1 常开触头） -->
  <g stroke="#e53935" stroke-width="2.6" fill="none">
    <path d="M510 290 V110 H590"/>
    <line x1="590" y1="110" x2="630" y2="110"/>
    <path d="M630 110 H640 V155 H655"/>
    <line x1="655" y1="155" x2="705" y2="155"/>
    <path d="M705 155 H720 V110 H770 V165"/>
    <path d="M770 220 V290 H645"/>
    <line x1="645" y1="290" x2="605" y2="290"/>
    <path d="M605 290 H510"/>
  </g>

  <!-- 失电支路（SB2 常开，已松开）：黑线 -->
  <g stroke="#37474f" stroke-width="2.4" fill="none">
    <line x1="655" y1="110" x2="696" y2="98"/>
  </g>
  <line x1="640" y1="110" x2="655" y2="110" stroke="#e53935" stroke-width="2.6"/>
  <line x1="705" y1="110" x2="720" y2="110" stroke="#e53935" stroke-width="2.6"/>

  <!-- 触点端点 -->
  <g fill="#37474f">
    <circle cx="590" cy="110" r="3"/><circle cx="630" cy="110" r="3"/>
    <circle cx="655" cy="110" r="3"/><circle cx="705" cy="110" r="3"/>
    <circle cx="655" cy="155" r="3"/><circle cx="705" cy="155" r="3"/>
    <circle cx="605" cy="290" r="3"/><circle cx="645" cy="290" r="3"/>
    <circle cx="640" cy="110" r="3"/><circle cx="720" cy="110" r="3"/>
  </g>

  <!-- 按钮推杆 -->
  <g stroke="#546e7a" stroke-width="1.4" fill="none">
    <line x1="610" y1="110" x2="610" y2="98"/><line x1="601" y1="98" x2="619" y2="98"/>
    <line x1="680" y1="110" x2="680" y2="98"/><line x1="671" y1="98" x2="689" y2="98"/>
    <line x1="625" y1="290" x2="625" y2="278"/><line x1="617" y1="278" x2="633" y2="278"/>
  </g>

  <!-- 线圈 -->
  <rect x="750" y="165" width="40" height="55" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.8"/>
  <text x="770" y="198" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#283593">KM1</text>

  <!-- 标注 -->
  <text x="610" y="88" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">SB1</text>
  <text x="680" y="88" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#2e7d32">SB2（已松开）</text>
  <text x="685" y="176" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#2e7d32">KM1 常开（已闭合）</text>
  <text x="798" y="198" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">线圈</text>
  <text x="518" y="205" font-family="Microsoft YaHei, Arial" font-size="11" fill="#546e7a">TC 副边</text>
  <text x="625" y="312" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">FR 常闭</text>
  <text x="510" y="356" font-family="Microsoft YaHei, Arial" font-size="12" fill="#2e7d32">SB2 已断开，电流改经 KM1 常开触头供给线圈 → 连续运行。</text>

  <text x="450" y="404" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#37474f">自锁：把接触器自己的常开辅助触头与起动按钮并联，用触头代替按钮保持回路导通。</text>
</svg>
