<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1100" height="590" fill="#ffffff"/>
  <text x="550" y="30" font-size="17" font-weight="bold" fill="#1a252f" text-anchor="middle">图 1　船舶高压系统组成（6.6 kV 单线示意）</text>

  <!-- ================= 1# 高压发电机 + 中性点接地 ================= -->
  <circle cx="100" cy="240" r="36" fill="#f4f7fa" stroke="#2c3e50" stroke-width="2"/>
  <text x="100" y="236" font-size="14" fill="#2c3e50" text-anchor="middle">G</text>
  <text x="100" y="253" font-size="10" fill="#2c3e50" text-anchor="middle">6.6kV</text>
  <text x="100" y="300" font-size="11" fill="#34495e" text-anchor="middle">gen_hv　2000 kW</text>
  <line x1="100" y1="276" x2="100" y2="330" stroke="#2c3e50" stroke-width="1.6"/>
  <rect x="92" y="330" width="16" height="26" fill="#ffffff" stroke="#2c3e50" stroke-width="1.6"/>
  <text x="116" y="348" font-size="10" fill="#555">500Ω 中性点接地</text>
  <line x1="100" y1="356" x2="100" y2="372" stroke="#2c3e50" stroke-width="1.6"/>
  <line x1="86" y1="372" x2="114" y2="372" stroke="#2c3e50" stroke-width="1.6"/>
  <line x1="91" y1="377" x2="109" y2="377" stroke="#2c3e50" stroke-width="1.2"/>
  <line x1="96" y1="382" x2="104" y2="382" stroke="#2c3e50" stroke-width="1.2"/>

  <!-- 机端 CT -->
  <circle cx="168" cy="240" r="10" fill="none" stroke="#8e44ad" stroke-width="1.6"/>
  <text x="168" y="216" font-size="10" fill="#8e44ad" text-anchor="middle">CT(出口)</text>
  <line x1="136" y1="240" x2="200" y2="240" stroke="#2c3e50" stroke-width="2"/>

  <!-- ================= 真空断路器 qf1 ================= -->
  <rect x="200" y="186" width="96" height="116" rx="4" fill="#eef3f7" stroke="#2c3e50" stroke-width="1.6"/>
  <text x="248" y="179" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="middle">qf1 真空断路器</text>
  <rect x="228" y="204" width="32" height="44" rx="3" fill="#ffffff" stroke="#2c3e50" stroke-width="1.4"/>
  <line x1="244" y1="212" x2="244" y2="222" stroke="#2c3e50" stroke-width="2"/>
  <line x1="244" y1="230" x2="244" y2="240" stroke="#2c3e50" stroke-width="2"/>
  <line x1="234" y1="226" x2="254" y2="226" stroke="#c0392b" stroke-width="2.4"/>
  <text x="248" y="264" font-size="9" fill="#34495e" text-anchor="middle">储能/合闸/分闸</text>
  <text x="248" y="276" font-size="9" fill="#34495e" text-anchor="middle">工作位·接地开关·柜门</text>

  <!-- ================= 汇流排 bus1 ================= -->
  <line x1="296" y1="240" x2="356" y2="240" stroke="#2c3e50" stroke-width="2"/>
  <line x1="356" y1="90" x2="356" y2="430" stroke="#2c3e50" stroke-width="5"/>
  <text x="356" y="480" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="middle">bus1 左段汇流排</text>

  <!-- 第4口 → 接地监视仪 -->
  <line x1="356" y1="110" x2="470" y2="110" stroke="#2c3e50" stroke-width="1.8"/>
  <text x="362" y="103" font-size="9" fill="#8e44ad">第4口</text>
  <rect x="470" y="78" width="140" height="64" rx="4" fill="#ffffff" stroke="#2c3e50" stroke-width="1.6"/>
  <text x="540" y="98" font-size="10" fill="#2c3e50" text-anchor="middle">高压接地监视仪</text>
  <text x="540" y="114" font-size="9" fill="#7f8c8d" text-anchor="middle">A / B / C 相绝缘 MΩ</text>
  <text x="540" y="130" font-size="9" fill="#7f8c8d" text-anchor="middle">确认 · 复位</text>

  <!-- 第5口 → 绝缘支路 -->
  <line x1="356" y1="185" x2="470" y2="185" stroke="#2c3e50" stroke-width="1.8"/>
  <text x="362" y="178" font-size="9" fill="#8e44ad">第5口</text>
  <rect x="470" y="175" width="80" height="20" fill="#ffffff" stroke="#2c3e50" stroke-width="1.4"/>
  <text x="510" y="189" font-size="9" fill="#2c3e50" text-anchor="middle">10 MΩ</text>
  <line x1="550" y1="185" x2="600" y2="185" stroke="#2c3e50" stroke-width="1.6"/>
  <line x1="600" y1="185" x2="600" y2="198" stroke="#2c3e50" stroke-width="1.6"/>
  <line x1="586" y1="198" x2="614" y2="198" stroke="#2c3e50" stroke-width="1.6"/>
  <line x1="591" y1="203" x2="609" y2="203" stroke="#2c3e50" stroke-width="1.2"/>
  <text x="356" y="216" font-size="9" fill="#7f8c8d">模拟电网绝缘水平</text>

  <!-- ================= 母联 + 右段 ================= -->
  <line x1="356" y1="300" x2="400" y2="300" stroke="#2c3e50" stroke-width="2"/>
  <text x="362" y="293" font-size="9" fill="#8e44ad">第6口</text>
  <rect x="400" y="280" width="62" height="40" rx="3" fill="#eef3f7" stroke="#2c3e50" stroke-width="1.4"/>
  <text x="431" y="305" font-size="10" fill="#2c3e50" text-anchor="middle">vcbs2</text>
  <text x="431" y="335" font-size="9" fill="#7f8c8d" text-anchor="middle">母联</text>
  <line x1="462" y1="300" x2="520" y2="300" stroke="#2c3e50" stroke-width="2"/>

  <line x1="520" y1="150" x2="520" y2="440" stroke="#2c3e50" stroke-width="4"/>
  <text x="520" y="480" font-size="11" fill="#2c3e50" text-anchor="middle">bus_s2 右段</text>

  <!-- 2# 简化机组 -->
  <line x1="520" y1="250" x2="580" y2="250" stroke="#2c3e50" stroke-width="1.8"/>
  <rect x="580" y="232" width="52" height="36" rx="3" fill="#eef3f7" stroke="#2c3e50" stroke-width="1.4"/>
  <text x="606" y="255" font-size="9" fill="#2c3e50" text-anchor="middle">vcbs</text>
  <line x1="632" y1="250" x2="664" y2="250" stroke="#2c3e50" stroke-width="1.8"/>
  <circle cx="682" cy="250" r="18" fill="#f4f7fa" stroke="#2c3e50" stroke-width="1.6"/>
  <text x="682" y="255" font-size="10" fill="#2c3e50" text-anchor="middle">G</text>
  <text x="682" y="284" font-size="9" fill="#7f8c8d" text-anchor="middle">gen_s 2# 机组</text>

  <!-- 高压负载 -->
  <line x1="520" y1="330" x2="580" y2="330" stroke="#2c3e50" stroke-width="1.8"/>
  <rect x="580" y="314" width="64" height="30" rx="3" fill="#fdf6e3" stroke="#b7950b" stroke-width="1.3"/>
  <text x="612" y="334" font-size="9" fill="#8a6d0b" text-anchor="middle">hvload</text>

  <!-- 变压器支路 -->
  <line x1="520" y1="400" x2="580" y2="400" stroke="#2c3e50" stroke-width="1.8"/>
  <rect x="580" y="382" width="52" height="36" rx="3" fill="#eef3f7" stroke="#2c3e50" stroke-width="1.3"/>
  <text x="606" y="405" font-size="9" fill="#2c3e50" text-anchor="middle">vcbs3</text>
  <line x1="632" y1="400" x2="700" y2="400" stroke="#2c3e50" stroke-width="1.8"/>
  <circle cx="722" cy="400" r="22" fill="#ffffff" stroke="#2c3e50" stroke-width="1.6"/>
  <circle cx="722" cy="400" r="13" fill="none" stroke="#2c3e50" stroke-width="1.6"/>
  <text x="722" y="440" font-size="10" fill="#2c3e50" text-anchor="middle">tf1</text>
  <text x="722" y="454" font-size="9" fill="#7f8c8d" text-anchor="middle">6.6kV / 440V</text>
  <text x="756" y="368" font-size="9" fill="#c0392b">高温 130℃ / 3s 跳 vcbs3</text>
  <line x1="744" y1="400" x2="810" y2="400" stroke="#2c3e50" stroke-width="1.8"/>
  <rect x="810" y="386" width="46" height="28" rx="3" fill="#eef3f7" stroke="#2c3e50" stroke-width="1.3"/>
  <text x="833" y="404" font-size="9" fill="#2c3e50" text-anchor="middle">aq1</text>
  <line x1="856" y1="400" x2="900" y2="400" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="900" y1="360" x2="900" y2="440" stroke="#2c3e50" stroke-width="3.4"/>
  <text x="900" y="462" font-size="10" fill="#2c3e50" text-anchor="middle">bus_lv1 440V</text>

  <!-- 白炽灯 -->
  <line x1="900" y1="425" x2="950" y2="425" stroke="#2c3e50" stroke-width="1.6"/>
  <text x="912" y="416" font-size="9" fill="#8e44ad">aq3</text>
  <line x1="950" y1="425" x2="985" y2="425" stroke="#2c3e50" stroke-width="1.6"/>
  <circle cx="1002" cy="425" r="16" fill="#fffbe6" stroke="#b7950b" stroke-width="1.4"/>
  <text x="1002" y="430" font-size="10" fill="#8a6d0b" text-anchor="middle">灯</text>
  <text x="1002" y="455" font-size="9" fill="#7f8c8d" text-anchor="middle">馈出指示</text>

  <text x="756" y="486" font-size="9" fill="#7f8c8d">另一路：vcbs4 → tf2 → aq2 → bus_lv2（结构相同）</text>

  <!-- ================= 24V 控制回路 ================= -->
  <rect x="200" y="350" width="112" height="34" rx="3" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.3"/>
  <text x="256" y="371" font-size="10" fill="#1e6b3a" text-anchor="middle">DC 24V 控制电源</text>
  <line x1="256" y1="350" x2="256" y2="302" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="256" y="344" font-size="9" fill="#1e6b3a" text-anchor="middle">储能·合闸·分闸·失压线圈</text>

  <!-- ================= 微机综合保护 ================= -->
  <rect x="600" y="500" width="240" height="52" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
  <text x="720" y="520" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">prot1 微机综合保护</text>
  <text x="720" y="538" font-size="9" fill="#c0392b" text-anchor="middle">差动 / 短路 / 过载 / 接地 / 欠压 / 逆功率</text>
  <!-- CT/PT 采样 -->
  <line x1="168" y1="250" x2="168" y2="500" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="168" y1="500" x2="600" y2="500" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="176" y="494" font-size="9" fill="#c0392b">CT / PT 采样（出口、入口、中性点 CT + PT）</text>
  <!-- 跳闸出口 -->
  <line x1="600" y1="576" x2="330" y2="576" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="330" y1="576" x2="330" y2="302" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="340" y="570" font-size="9" fill="#c0392b">跳闸出口 → qf1 分励线圈</text>
</svg>
