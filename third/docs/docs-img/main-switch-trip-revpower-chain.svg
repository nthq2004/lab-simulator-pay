<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="a4" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#b04a4a"/>
    </marker>
    <marker id="a5" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2c6ea8"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b3a5c">图 4  一台机组逆功率跳闸引起全船失电的过程</text>

  <!-- 并联运行 -->
  <g>
    <rect x="40" y="70" width="180" height="90" rx="10" fill="#eaf3fb" stroke="#2c6ea8" stroke-width="2"/>
    <text x="130" y="98" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b3a5c">并联运行</text>
    <text x="130" y="120" text-anchor="middle" font-size="11" fill="#446">1# 机 P1 ≈ 50 kW</text>
    <text x="130" y="140" text-anchor="middle" font-size="11" fill="#446">2# 机 P2 ≈ 50 kW</text>
  </g>
  <g>
    <rect x="260" y="70" width="200" height="90" rx="10" fill="#fdf7f0" stroke="#c9861a" stroke-width="2"/>
    <text x="360" y="98" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a5a00">1# 机冷却水温高</text>
    <text x="360" y="120" text-anchor="middle" font-size="11" fill="#8a6a3a">原动机保护停机，</text>
    <text x="360" y="140" text-anchor="middle" font-size="11" fill="#8a6a3a">发电机被母线拖转（电动运行）</text>
  </g>
  <g>
    <rect x="500" y="70" width="200" height="90" rx="10" fill="#f6f2fb" stroke="#6b4fa0" stroke-width="2"/>
    <text x="600" y="98" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d2b63">逆功率保护动作</text>
    <text x="600" y="120" text-anchor="middle" font-size="11" fill="#5b4a80">吸收有功 &gt; 8 kW</text>
    <text x="600" y="140" text-anchor="middle" font-size="11" fill="#5b4a80">持续 5 s → QF1 跳闸解列</text>
  </g>
  <g>
    <rect x="740" y="70" width="180" height="90" rx="10" fill="#fdf1f1" stroke="#b04a4a" stroke-width="2"/>
    <text x="830" y="98" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7d2b2b">负荷全部转移</text>
    <text x="830" y="120" text-anchor="middle" font-size="10.5" fill="#8d4a4a">2# 独带 ≈100 kW</text>
    <text x="830" y="140" text-anchor="middle" font-size="10.5" fill="#8d4a4a">≈ 额定 125%</text>
  </g>
  <line x1="222" y1="115" x2="256" y2="115" stroke="#b04a4a" stroke-width="2.2" marker-end="url(#a4)"/>
  <line x1="462" y1="115" x2="496" y2="115" stroke="#b04a4a" stroke-width="2.2" marker-end="url(#a4)"/>
  <line x1="702" y1="115" x2="736" y2="115" stroke="#b04a4a" stroke-width="2.2" marker-end="url(#a4)"/>

  <!-- 过载链 -->
  <g>
    <rect x="740" y="200" width="180" height="90" rx="10" fill="#fdf1f1" stroke="#b04a4a" stroke-width="2"/>
    <text x="830" y="228" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7d2b2b">过载保护动作</text>
    <text x="830" y="250" text-anchor="middle" font-size="11" fill="#8d4a4a">超过 120% 额定</text>
    <text x="830" y="270" text-anchor="middle" font-size="11" fill="#8d4a4a">持续 15 s → QF2 跳闸</text>
  </g>
  <g>
    <rect x="480" y="200" width="200" height="90" rx="10" fill="#f3f3f3" stroke="#555" stroke-width="2"/>
    <text x="580" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">全船失电（黑船）</text>
    <text x="580" y="254" text-anchor="middle" font-size="11" fill="#555">两台主开关均在分位，</text>
    <text x="580" y="274" text-anchor="middle" font-size="11" fill="#555">发电机仍在空载运行</text>
  </g>
  <line x1="830" y1="162" x2="830" y2="196" stroke="#b04a4a" stroke-width="2.2" marker-end="url(#a4)"/>
  <line x1="740" y1="245" x2="684" y2="245" stroke="#b04a4a" stroke-width="2.2" marker-end="url(#a4)"/>

  <!-- 恢复 -->
  <g>
    <rect x="200" y="200" width="240" height="90" rx="10" fill="#eef7ee" stroke="#2f8a4a" stroke-width="2"/>
    <text x="320" y="228" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1d5c32">应急处置</text>
    <text x="320" y="250" text-anchor="middle" font-size="11" fill="#3a6b4a">先减载（如降到 20 kW）</text>
    <text x="320" y="270" text-anchor="middle" font-size="11" fill="#3a6b4a">再合 2# 主开关恢复供电</text>
  </g>
  <line x1="478" y1="245" x2="444" y2="245" stroke="#2f8a4a" stroke-width="2.2" marker-end="url(#a5)"/>

  <!-- 结论 -->
  <g>
    <rect x="40" y="330" width="880" height="80" rx="10" fill="#f8fafc" stroke="#c8d3de" stroke-width="1.5"/>
    <text x="60" y="358" font-size="13" font-weight="bold" fill="#1b3a5c">为什么会“一台故障、全船失电”？</text>
    <text x="60" y="382" font-size="11.5" fill="#445">并联运行时各机按调速特性分担负载。一台机退出后，它承担的有功瞬间全部加到其余机组上，</text>
    <text x="60" y="402" font-size="11.5" fill="#445">若剩余机组容量不足即过载跳闸。所以并联运行必须均衡分配负荷，并监视各机原动机状态。</text>
  </g>
</svg>
