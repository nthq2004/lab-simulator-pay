<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="'Microsoft YaHei','Source Han Sans SC',sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b7f9e"/>
    </marker>
  </defs>

  <text x="500" y="28" font-size="16" font-weight="bold" fill="#1f2d3d" text-anchor="middle">DO / HFO 换油（转换）操作时序</text>

  <path d="M40 152 L968 152" fill="none" stroke="#5b7f9e" stroke-width="2" marker-end="url(#a5)"/>

  <!-- 步骤框 -->
  <g>
    <rect x="52" y="72" width="150" height="64" rx="5" fill="#eef3f8" stroke="#5b7f9e" stroke-width="1.6"/>
    <text x="127" y="96" font-size="12" fill="#28455e" text-anchor="middle">① 按 HFO 或 DO</text>
    <text x="127" y="116" font-size="11" fill="#4a6572" text-anchor="middle">转换按钮</text>
    <path d="M127 136 L127 150" fill="none" stroke="#5b7f9e" stroke-width="1.6"/>

    <rect x="232" y="72" width="150" height="64" rx="5" fill="#eef3f8" stroke="#5b7f9e" stroke-width="1.6"/>
    <text x="307" y="94" font-size="12" fill="#28455e" text-anchor="middle">② 液晶提示</text>
    <text x="307" y="112" font-size="11" fill="#4a6572" text-anchor="middle">Change oil?  +=yes -=no</text>
    <text x="307" y="128" font-size="11" fill="#4a6572" text-anchor="middle">按「+」确认</text>
    <path d="M307 136 L307 150" fill="none" stroke="#5b7f9e" stroke-width="1.6"/>

    <rect x="412" y="72" width="150" height="64" rx="5" fill="#e8f1fb" stroke="#3b82c4" stroke-width="1.6"/>
    <text x="487" y="94" font-size="12" fill="#1b4f80" text-anchor="middle">③ 三通阀 CV 动作</text>
    <text x="487" y="112" font-size="11" fill="#1b4f80" text-anchor="middle">行程 10 s（显示开度）</text>
    <text x="487" y="128" font-size="11" fill="#1b4f80" text-anchor="middle">阀位未到位 → A 70</text>
    <path d="M487 136 L487 150" fill="none" stroke="#3b82c4" stroke-width="1.6"/>

    <rect x="592" y="72" width="150" height="64" rx="5" fill="#fff6f2" stroke="#d08a62" stroke-width="1.6"/>
    <text x="667" y="94" font-size="12" fill="#8d4a22" text-anchor="middle">④ 程序升 / 降温</text>
    <text x="667" y="112" font-size="11" fill="#8d4a22" text-anchor="middle">HFO：按 Fa30 升到</text>
    <text x="667" y="128" font-size="11" fill="#8d4a22" text-anchor="middle">Pr30 − 3 ℃</text>
    <path d="M667 136 L667 150" fill="none" stroke="#d08a62" stroke-width="1.6"/>

    <rect x="790" y="72" width="170" height="64" rx="5" fill="#e8f7ef" stroke="#3d8f66" stroke-width="1.6"/>
    <text x="875" y="94" font-size="12" fill="#1f5c40" text-anchor="middle">⑤ 进入定值控制</text>
    <text x="875" y="112" font-size="11" fill="#1f5c40" text-anchor="middle">HFO：VT 灯常亮（黏度）</text>
    <text x="875" y="128" font-size="11" fill="#1f5c40" text-anchor="middle">DO：TT 灯常亮（温度）</text>
    <path d="M875 162 L875 178" fill="none" stroke="#3d8f66" stroke-width="1.6" marker-end="url(#a5)"/>
  </g>

  <!-- 时间说明 -->
  <g font-size="11" fill="#7a8b99" text-anchor="middle">
    <text x="487" y="174">≈ 10 s</text>
    <text x="667" y="174">按温差自动，60 ℃/min（教学加速）</text>
    <text x="127" y="174">操作者动作</text>
    <text x="307" y="174">确认后立即执行</text>
  </g>

  <!-- 反向说明 -->
  <rect x="52" y="210" width="908" height="76" rx="6" fill="#f8fafc" stroke="#a9b7c2" stroke-width="1.5"/>
  <text x="72" y="234" font-size="12" font-weight="bold" fill="#28455e">反向 HFO → DO</text>
  <text x="72" y="256" font-size="11" fill="#4a6572">CV 回到 DO 位 → 按 Fa31 程序降温到 Pr35（DO 温度设定）→ 温度定值控制。换油过程中黏度控制始终有效，只是目标值随油品改变。</text>
  <text x="72" y="276" font-size="11" fill="#4a6572">转换阀从 0 → 100 % 的 10 s 内，混油筒内的油品比例逐渐由 DO 过渡为 HFO（约 1 min 置换完毕），期间黏度、温度都会缓慢变化。</text>

  <!-- 自动转换 -->
  <rect x="52" y="298" width="908" height="78" rx="6" fill="#fffafa" stroke="#d9534f" stroke-width="1.5"/>
  <text x="72" y="322" font-size="12" font-weight="bold" fill="#a13b39">控制器的自动转换功能</text>
  <text x="72" y="344" font-size="11" fill="#8f4543">· 加热器故障且油温低于 Fa14 持续 2 min → 自动转 DO（A 80），保证主机不停机</text>
  <text x="72" y="364" font-size="11" fill="#8f4543">· 燃油消耗持续高于 Fa16（相对 Fa17 主机最大油耗）2 min → 自动转回 HFO，节省成本</text>
</svg>
