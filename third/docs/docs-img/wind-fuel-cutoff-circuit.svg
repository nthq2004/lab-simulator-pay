<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="'Microsoft YaHei','Source Han Sans SC',sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9534f"/>
    </marker>
  </defs>

  <text x="500" y="28" font-size="17" font-weight="bold" fill="#1f2d3d" text-anchor="middle">风油切断控制回路原理（以风机回路为例）</text>

  <!-- 回路框 -->
  <rect x="40" y="52" width="920" height="300" rx="6" fill="#fbfcf7" stroke="#8a9a8a" stroke-width="1.6"/>
  <text x="56" y="74" font-size="12" font-weight="bold" fill="#1a252f">24 V 直流控制回路</text>

  <!-- 电源端 -->
  <circle cx="90" cy="150" r="5" fill="#ffffff" stroke="#2c3e50" stroke-width="1.6"/>
  <text x="76" y="132" font-size="16" font-weight="bold" fill="#c0392b">+</text>
  <text x="58" y="176" font-size="11" fill="#5a6a75">24V</text>

  <!-- 左竖线（并联公共端） -->
  <g fill="none" stroke="#9aa6a0" stroke-width="2">
    <path d="M90 150 L176 150"/>
    <path d="M176 132 L176 188"/>
    <path d="M176 132 L214 132"/>
    <path d="M214 188 L252 188"/>
  </g>

  <!-- 上支路：消防控制室按钮（闭合） -->
  <g fill="none" stroke="#9aa6a0" stroke-width="2">
    <path d="M176 132 L214 132"/>
    <path d="M249 132 L300 132"/>
  </g>
  <g stroke="#2c3e50" stroke-width="2.6" stroke-linecap="round">
    <path d="M214 132 L249 132"/>
  </g>
  <circle cx="214" cy="132" r="3" fill="#2c3e50"/><circle cx="249" cy="132" r="3" fill="#2c3e50"/>
  <text x="232" y="112" font-size="10.5" fill="#1a252f" text-anchor="middle">消防控制室按钮（闭合）</text>

  <!-- 下支路：驾驶台按钮（断开） -->
  <g fill="none" stroke="#9aa6a0" stroke-width="2">
    <path d="M176 188 L214 188"/>
    <path d="M249 188 L300 188"/>
  </g>
  <g stroke="#2c3e50" stroke-width="2.6" stroke-linecap="round">
    <path d="M214 188 L245 174"/>
  </g>
  <circle cx="214" cy="188" r="3" fill="#2c3e50"/><circle cx="249" cy="188" r="3" fill="#2c3e50"/>
  <text x="238" y="212" font-size="10.5" fill="#1a252f" text-anchor="middle">驾驶台按钮（未按下，断开）</text>

  <!-- 右竖线与引出 -->
  <g fill="none" stroke="#e02020" stroke-width="2">
    <path d="M300 132 L300 188"/>
    <path d="M300 160 L370 160"/>
  </g>

  <!-- KA 线圈 -->
  <rect x="370" y="138" width="72" height="46" rx="3" fill="#ffd7a8" stroke="#e02020" stroke-width="2"/>
  <text x="406" y="167" font-size="14" font-weight="bold" fill="#8a3a10" text-anchor="middle">KA1</text>
  <text x="406" y="202" font-size="10.5" fill="#5a6a75" text-anchor="middle">中间继电器</text>

  <!-- KA 回线到 0V（单独一段） -->
  <g fill="none" stroke="#e02020" stroke-width="2">
    <path d="M442 160 L500 160"/>
    <path d="M500 160 L500 236"/>
    <path d="M500 236 L90 236"/>
  </g>
  <circle cx="90" cy="236" r="5" fill="#ffffff" stroke="#2c3e50" stroke-width="1.6"/>
  <text x="72" y="240" font-size="16" font-weight="bold" fill="#2c3e50">−</text>

  <!-- 右侧：24V 母线 + 三路触头/线圈 -->
  <text x="560" y="76" font-size="10.5" font-weight="bold" fill="#c0392b">24V +</text>
  <g fill="none" stroke="#e02020" stroke-width="2">
    <path d="M540 100 L830 100"/>
  </g>
  <g stroke="#e02020" stroke-width="2" fill="none">
    <path d="M580 100 L580 118"/><path d="M580 152 L580 168"/>
    <path d="M680 100 L680 118"/><path d="M680 152 L680 168"/>
    <path d="M780 100 L780 118"/><path d="M780 152 L780 168"/>
    <path d="M580 208 L580 236"/><path d="M680 208 L680 236"/><path d="M780 208 L780 236"/>
    <path d="M540 236 L830 236"/>
  </g>
  <!-- 三副常开辅助触头（已闭合） -->
  <g stroke="#2c3e50" stroke-width="2.6" stroke-linecap="round">
    <path d="M580 118 L580 152"/><path d="M680 118 L680 152"/><path d="M780 118 L780 152"/>
  </g>
  <g fill="#2c3e50"><circle cx="580" cy="118" r="3"/><circle cx="580" cy="152" r="3"/>
    <circle cx="680" cy="118" r="3"/><circle cx="680" cy="152" r="3"/>
    <circle cx="780" cy="118" r="3"/><circle cx="780" cy="152" r="3"/></g>
  <text x="596" y="136" font-size="10" fill="#5a6a75">KA1</text>
  <text x="696" y="136" font-size="10" fill="#5a6a75">KA1</text>
  <text x="796" y="136" font-size="10" fill="#5a6a75">KA1</text>

  <!-- SR 分励脱扣器 -->
  <g fill="#ffb3b3" stroke="#e02020" stroke-width="1.8">
    <rect x="560" y="168" width="40" height="40" rx="3"/>
    <rect x="660" y="168" width="40" height="40" rx="3"/>
    <rect x="760" y="168" width="40" height="40" rx="3"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#8a3a10" text-anchor="middle">
    <text x="580" y="193">SR</text><text x="680" y="193">SR</text><text x="780" y="193">SR</text>
  </g>
  <g font-size="9.5" fill="#1a252f" text-anchor="middle">
    <text x="580" y="254">1#机舱风机</text><text x="680" y="254">2#机舱风机</text><text x="780" y="254">舵机房风机</text>
  </g>
  <g font-size="9" fill="#5a6a75" text-anchor="middle">
    <text x="580" y="268">ESS-1F</text><text x="680" y="268">ESS-1F</text><text x="780" y="268">ESS-1F</text>
  </g>
  <text x="846" y="232" font-size="10.5" font-weight="bold" fill="#2c3e50">0V −</text>

  <!-- 断路器脱扣示意 -->
  <g fill="#f0f1f4" stroke="#a0a8b8" stroke-width="1.6">
    <rect x="60" y="380" width="120" height="140" rx="4"/>
    <rect x="230" y="380" width="120" height="140" rx="4"/>
    <rect x="400" y="380" width="120" height="140" rx="4"/>
  </g>
  <g font-size="9" fill="#20a030"><text x="70" y="404">ON</text><text x="240" y="404">ON</text><text x="410" y="404">ON</text></g>
  <g font-size="9" fill="#e08020"><text x="70" y="438">TRIP</text><text x="240" y="438">TRIP</text><text x="410" y="438">TRIP</text></g>
  <g font-size="9" fill="#c03020"><text x="70" y="472">OFF</text><text x="240" y="472">OFF</text><text x="410" y="472">OFF</text></g>
  <g fill="#cfd3da" stroke="#9aa2ac" stroke-width="1">
    <rect x="110" y="392" width="24" height="116" rx="2"/><rect x="280" y="392" width="24" height="116" rx="2"/><rect x="450" y="392" width="24" height="116" rx="2"/>
  </g>
  <g fill="#2878c8" stroke="#0f3a68" stroke-width="1">
    <rect x="112" y="430" width="20" height="30" rx="2"/><rect x="282" y="430" width="20" height="30" rx="2"/><rect x="452" y="430" width="20" height="30" rx="2"/>
  </g>
  <g font-size="10" fill="#1a252f" text-anchor="middle">
    <text x="120" y="534">1#机舱风机 MCCB（TRIP）</text>
    <text x="290" y="534">2#机舱风机 MCCB（TRIP）</text>
    <text x="460" y="534">舵机房风机 MCCB（TRIP）</text>
  </g>

  <text x="500" y="326" font-size="10.5" fill="#a13b39" text-anchor="middle">按钮闭合 → KA1 得电 → 三副辅助触头闭合 → SR 得电 → 三只 MCCB 跳闸至 TRIP 位</text>
  <text x="500" y="348" font-size="9.5" fill="#7a8a7a" text-anchor="middle">注：分励回路的 0V 线与左侧中间继电器的回线分开敷设，互不连接</text>

  <text x="500" y="556" font-size="9" fill="#5a6a75" text-anchor="middle">复位：按钮弹出（脱扣回路失电）→ 手柄拉到 OFF 位 → 再合闸到 ON 位</text>
</svg>
