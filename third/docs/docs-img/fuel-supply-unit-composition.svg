<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" font-family="'Microsoft YaHei','Source Han Sans SC',sans-serif">
  <rect width="1100" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f98ad"/>
    </marker>
    <marker id="arwb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f8fd0"/>
    </marker>
  </defs>

  <text x="550" y="30" font-size="16" font-weight="bold" fill="#1f2d3d" text-anchor="middle">FCM 燃油供油单元组成（单线流程示意）</text>

  <!-- 日用柜 -->
  <rect x="40" y="90" width="110" height="100" rx="4" fill="#fdf3e3" stroke="#c8a165" stroke-width="1.6"/>
  <text x="95" y="136" font-size="13" fill="#5b4426" text-anchor="middle">HFO 日用柜</text>
  <text x="95" y="156" font-size="11" fill="#8a6c42" text-anchor="middle">（重油）</text>

  <rect x="40" y="270" width="110" height="90" rx="4" fill="#eef7ee" stroke="#7ba77b" stroke-width="1.6"/>
  <text x="95" y="310" font-size="13" fill="#2f5d2f" text-anchor="middle">DO 日用柜</text>
  <text x="95" y="330" font-size="11" fill="#4f7f4f" text-anchor="middle">（柴油）</text>

  <!-- 至 CV 管路 -->
  <path d="M150 140 L215 140 L215 204" fill="none" stroke="#7f98ad" stroke-width="2.2" marker-end="url(#arw)"/>
  <path d="M150 315 L215 315 L215 256" fill="none" stroke="#7f98ad" stroke-width="2.2" marker-end="url(#arw)"/>

  <!-- 三通转换阀 CV -->
  <circle cx="215" cy="230" r="26" fill="#e8f1fb" stroke="#3b82c4" stroke-width="2"/>
  <text x="215" y="235" font-size="13" font-weight="bold" fill="#1b4f80" text-anchor="middle">CV</text>
  <path d="M241 230 L284 230" fill="none" stroke="#7f98ad" stroke-width="2.2"/>

  <!-- 供油泵 -->
  <path d="M284 230 L284 170 L296 170" fill="none" stroke="#7f98ad" stroke-width="2.2"/>
  <path d="M284 230 L284 290 L296 290" fill="none" stroke="#7f98ad" stroke-width="2.2"/>
  <circle cx="320" cy="170" r="22" fill="#e8f1fb" stroke="#3b82c4" stroke-width="2"/>
  <text x="320" y="175" font-size="12" font-weight="bold" fill="#1b4f80" text-anchor="middle">SP1</text>
  <circle cx="320" cy="290" r="22" fill="#e8f1fb" stroke="#3b82c4" stroke-width="2"/>
  <text x="320" y="295" font-size="12" font-weight="bold" fill="#1b4f80" text-anchor="middle">SP2</text>
  <text x="320" y="335" font-size="11" fill="#1b4f80" text-anchor="middle">供油泵（1 用 1 备）</text>

  <!-- 单向阀 + 汇合 -->
  <path d="M342 170 L356 170" fill="none" stroke="#7f98ad" stroke-width="2.2"/>
  <path d="M350 162 L350 178 L362 170 z" fill="#ffffff" stroke="#7f98ad" stroke-width="1.6"/>
  <path d="M342 290 L356 290" fill="none" stroke="#7f98ad" stroke-width="2.2"/>
  <path d="M350 282 L350 298 L362 290 z" fill="#ffffff" stroke="#7f98ad" stroke-width="1.6"/>
  <path d="M362 170 L380 170 L380 230 L398 230" fill="none" stroke="#7f98ad" stroke-width="2.2" marker-end="url(#arw)"/>
  <path d="M362 290 L380 290 L380 230" fill="none" stroke="#7f98ad" stroke-width="2.2"/>

  <!-- 自动滤器 -->
  <rect x="400" y="170" width="110" height="120" rx="4" fill="#f6fbff" stroke="#3b82c4" stroke-width="1.8"/>
  <text x="455" y="218" font-size="13" fill="#1b4f80" text-anchor="middle">自动滤器</text>
  <text x="455" y="238" font-size="13" fill="#1b4f80" text-anchor="middle">AFB</text>
  <text x="455" y="262" font-size="11" fill="#4a6572" text-anchor="middle">M/F ｜ A/F</text>
  <rect x="418" y="128" width="74" height="24" rx="3" fill="#ffeaea" stroke="#d9534f" stroke-width="1.5"/>
  <text x="455" y="145" font-size="12" fill="#a13b39" text-anchor="middle">PDS</text>
  <path d="M455 152 L455 170" fill="none" stroke="#d9534f" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M510 230 L540 230" fill="none" stroke="#7f98ad" stroke-width="2.2"/>

  <!-- 仪表 -->
  <circle cx="560" cy="230" r="19" fill="#eef3f8" stroke="#5b7f9e" stroke-width="1.8"/>
  <text x="560" y="235" font-size="12" fill="#28455e" text-anchor="middle">FT</text>
  <circle cx="560" cy="176" r="19" fill="#eef3f8" stroke="#5b7f9e" stroke-width="1.8"/>
  <text x="560" y="181" font-size="11" fill="#28455e" text-anchor="middle">PT1</text>
  <path d="M560 195 L560 211" fill="none" stroke="#5b7f9e" stroke-width="1.4"/>
  <path d="M579 230 L598 230" fill="none" stroke="#7f98ad" stroke-width="2.2"/>

  <!-- 混合筒 -->
  <rect x="598" y="118" width="94" height="224" rx="6" fill="#ffffff" stroke="#3b82c4" stroke-width="1.8"/>
  <rect x="604" y="196" width="82" height="140" rx="4" fill="#ffeecb" stroke="none"/>
  <text x="645" y="146" font-size="13" fill="#1b4f80" text-anchor="middle">混合筒</text>
  <text x="645" y="166" font-size="11" fill="#4a6572" text-anchor="middle">（带脱气）</text>
  <circle cx="645" cy="292" r="8" fill="#ffffff" stroke="#d9534f" stroke-width="2"/>
  <text x="662" y="297" font-size="11" fill="#a13b39">LS</text>
  <rect x="620" y="92" width="52" height="20" rx="3" fill="#eaf3fd" stroke="#3f8fd0" stroke-width="1.5"/>
  <text x="646" y="106" font-size="11" fill="#1b4f80" text-anchor="middle">脱气阀</text>
  <path d="M646 118 L646 92" fill="none" stroke="#3f8fd0" stroke-width="1.6"/>
  <path d="M646 92 L646 62 L100 62 L100 90" fill="none" stroke="#3f8fd0" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwb)"/>
  <text x="330" y="54" font-size="11" fill="#1b4f80">脱出的气体放回 HFO 日用柜</text>

  <!-- 循环泵 -->
  <path d="M692 230 L724 230 L724 170 L738 170" fill="none" stroke="#7f98ad" stroke-width="2.2"/>
  <path d="M724 230 L724 290 L738 290" fill="none" stroke="#7f98ad" stroke-width="2.2"/>
  <circle cx="762" cy="170" r="22" fill="#e8f1fb" stroke="#3b82c4" stroke-width="2"/>
  <text x="762" y="175" font-size="12" font-weight="bold" fill="#1b4f80" text-anchor="middle">CP1</text>
  <circle cx="762" cy="290" r="22" fill="#e8f1fb" stroke="#3b82c4" stroke-width="2"/>
  <text x="762" y="295" font-size="12" font-weight="bold" fill="#1b4f80" text-anchor="middle">CP2</text>
  <text x="762" y="335" font-size="11" fill="#1b4f80" text-anchor="middle">循环泵（增压）</text>

  <path d="M784 170 L806 170 L806 230 L824 230" fill="none" stroke="#7f98ad" stroke-width="2.2" marker-end="url(#arw)"/>
  <path d="M784 290 L806 290 L806 230" fill="none" stroke="#7f98ad" stroke-width="2.2"/>

  <!-- 加热器 -->
  <rect x="826" y="158" width="92" height="144" rx="4" fill="#fff6f2" stroke="#d08a62" stroke-width="1.8"/>
  <text x="872" y="206" font-size="12" fill="#8d4a22" text-anchor="middle">蒸汽加热器</text>
  <text x="872" y="226" font-size="12" fill="#8d4a22" text-anchor="middle">SHS</text>
  <text x="872" y="252" font-size="11" fill="#a8663a" text-anchor="middle">SH1 ｜ SH2</text>
  <!-- 蒸汽 -->
  <path d="M1010 100 L1010 132 L900 132" fill="none" stroke="#3f8fd0" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="972" y="92" font-size="11" fill="#1b4f80" text-anchor="end">蒸汽</text>
  <path d="M900 132 L872 132 L872 158" fill="none" stroke="#3f8fd0" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arwb)"/>
  <path d="M872 118 L886 132 L872 146 L858 132 z" fill="#eaf3fd" stroke="#3f8fd0" stroke-width="1.6"/>
  <text x="842" y="118" font-size="11" fill="#1b4f80">SRV</text>

  <path d="M918 230 L946 230" fill="none" stroke="#7f98ad" stroke-width="2.2"/>

  <!-- 出口仪表 -->
  <circle cx="972" cy="180" r="18" fill="#eef3f8" stroke="#5b7f9e" stroke-width="1.8"/>
  <text x="972" y="185" font-size="11" fill="#28455e" text-anchor="middle">TT</text>
  <circle cx="972" cy="230" r="18" fill="#e8f7ef" stroke="#3d8f66" stroke-width="1.8"/>
  <text x="972" y="235" font-size="11" fill="#1f5c40" text-anchor="middle">VT</text>
  <circle cx="972" cy="282" r="18" fill="#eef3f8" stroke="#5b7f9e" stroke-width="1.8"/>
  <text x="972" y="287" font-size="11" fill="#28455e" text-anchor="middle">PT2</text>
  <path d="M946 230 L946 180 L954 180" fill="none" stroke="#5b7f9e" stroke-width="1.4"/>
  <path d="M946 230 L946 282 L954 282" fill="none" stroke="#5b7f9e" stroke-width="1.4"/>
  <text x="972" y="266" font-size="11" fill="#1f5c40" text-anchor="middle">EVT20</text>

  <path d="M990 230 L1016 230" fill="none" stroke="#7f98ad" stroke-width="2.2" marker-end="url(#arw)"/>

  <!-- 主机 -->
  <rect x="1018" y="180" width="72" height="100" rx="4" fill="#f2f5f8" stroke="#5b7f9e" stroke-width="1.8"/>
  <text x="1054" y="222" font-size="13" fill="#28455e" text-anchor="middle">主机</text>
  <text x="1054" y="242" font-size="11" fill="#4a6572" text-anchor="middle">柴油机</text>

  <!-- 回油 -->
  <path d="M1054 280 L1054 400 L30 400 L30 140 L40 140" fill="none" stroke="#a9b7c2" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arw)"/>
  <text x="430" y="420" font-size="11" fill="#4a6572">经压力控制阀 PCV 的多余燃油返回 HFO 日用柜（维持进机压力）</text>

  <text x="40" y="448" font-size="11" fill="#7a8b99">CV：三通转换阀（DO / HFO 选择）；SP1/SP2：供油泵（日用泵）；CP1/CP2：循环泵（增压泵）；SH1/SH2：蒸汽加热器；SRV：蒸汽调节阀；LS：浮子液位开关</text>
</svg>
