<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460">
  <rect width="980" height="460" fill="#ffffff"/>
  <text x="16" y="26" font-family="Microsoft YaHei,Arial" font-size="16" font-weight="bold" fill="#1b3a4b">图 4  自动起动时序（AUT：预扫风 36 s → 点火位置 3 s → 点火准备 5 s → 点火 3 s → 小火稳定 20 s → 负荷控制）</text>

  <!-- 时间轴：等比例，10 px / s -->
  <line x1="150" y1="352" x2="950" y2="352" stroke="#37474f" stroke-width="1.5"/>
  <g font-family="Microsoft YaHei" font-size="10.5" fill="#607d8b">
    <text x="150" y="370" text-anchor="middle">0</text>
    <text x="510" y="370" text-anchor="middle">36</text>
    <text x="540" y="370" text-anchor="middle">39</text>
    <text x="590" y="370" text-anchor="middle">44</text>
    <text x="620" y="370" text-anchor="middle">47</text>
    <text x="820" y="370" text-anchor="middle">67</text>
    <text x="948" y="370" text-anchor="end">t / s</text>
  </g>

  <!-- 阶段色带 -->
  <g>
    <rect x="150" y="44" width="360" height="26" fill="#bbdefb" stroke="#64b5f6"/>
    <text x="330" y="62" font-family="Microsoft YaHei" font-size="11.5" fill="#0d47a1" text-anchor="middle">预扫风 36 s（T101）</text>
    <rect x="510" y="44" width="30" height="26" fill="#c8e6c9" stroke="#81c784"/>
    <text x="525" y="61" font-family="Microsoft YaHei" font-size="9" fill="#1b5e20" text-anchor="middle">3s</text>
    <rect x="540" y="44" width="50" height="26" fill="#fff9c4" stroke="#fdd835"/>
    <text x="565" y="61" font-family="Microsoft YaHei" font-size="9" fill="#827717" text-anchor="middle">5s</text>
    <rect x="590" y="44" width="30" height="26" fill="#ffe0b2" stroke="#ffb74d"/>
    <text x="605" y="61" font-family="Microsoft YaHei" font-size="9" fill="#e65100" text-anchor="middle">3s</text>
    <rect x="620" y="44" width="200" height="26" fill="#d7ccc8" stroke="#a1887f"/>
    <text x="720" y="62" font-family="Microsoft YaHei" font-size="11" fill="#4e342e" text-anchor="middle">小火稳定 20 s（T103）</text>
    <rect x="820" y="44" width="130" height="26" fill="#c8e6c9" stroke="#66bb6a"/>
    <text x="885" y="62" font-family="Microsoft YaHei" font-size="11.5" fill="#1b5e20" text-anchor="middle">负荷控制</text>
  </g>

  <!-- 信号行标题 -->
  <g font-family="Microsoft YaHei" font-size="11" fill="#37474f">
    <text x="140" y="112" text-anchor="end">Q0.4 风机</text>
    <text x="140" y="152" text-anchor="end">Q1.4 风门衔铁</text>
    <text x="140" y="192" text-anchor="end">Q0.5 油泵</text>
    <text x="140" y="232" text-anchor="end">Q1.1 点火变压器</text>
    <text x="140" y="272" text-anchor="end">Q1.2 / Q1.3 进油阀</text>
    <text x="140" y="312" text-anchor="end">Q2.2 大火（2# 阀）</text>
  </g>

  <!-- 信号条 -->
  <g stroke-width="0">
    <rect x="150" y="100" width="800" height="16" fill="#4fc3f7"/>
    <rect x="510" y="140" width="310" height="16" fill="#ffb300"/>
    <rect x="510" y="180" width="440" height="16" fill="#8d6e63"/>
    <rect x="540" y="220" width="80" height="16" fill="#ff7043"/>
    <rect x="590" y="260" width="360" height="16" fill="#66bb6a"/>
    <rect x="820" y="300" width="130" height="16" fill="#43a047"/>
  </g>

  <g stroke="#b0bec5" stroke-width="1" stroke-dasharray="3,3">
    <line x1="510" y1="70" x2="510" y2="352"/>
    <line x1="590" y1="70" x2="590" y2="352"/>
    <line x1="620" y1="70" x2="620" y2="352"/>
    <line x1="820" y1="70" x2="820" y2="352"/>
  </g>

  <!-- 图例 -->
  <text x="16" y="392" font-family="Microsoft YaHei" font-size="10.5" fill="#37474f">阶段：T101 预扫风 36 s ｜ T109 点火位置 3 s ｜ T110 点火准备 5 s ｜ T102 点火 3 s ｜ T103 小火稳定 20 s</text>
  <text x="16" y="414" font-family="Microsoft YaHei" font-size="10.5" fill="#c62828">节点：M0.3 预扫风结束（36 s）｜ M3.1 点火准备结束（44 s，开始喷油）｜ M0.4 点火结束（47 s）｜ M0.5 小火稳定结束（67 s）</text>
  <text x="16" y="440" font-family="Microsoft YaHei" font-size="10.5" fill="#546e7a">说明：油泵自 36 s 预扫风结束起运行，但总燃油阀 Q1.2 未开前不喷油；风门衔铁 Q1.4 自 36 s 点火位置接通（关小风门），67 s 转入大火、2# 阀 Q1.5 打开后断开，风门全开。</text>
</svg>
