<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <defs>
    <marker id="pa" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#2471a3"/>
    </marker>
    <marker id="pb" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="pc" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#34495e"/>
    </marker>
  </defs>
  <rect width="1000" height="470" fill="#fbfcfe"/>
  <text x="24" y="34" font-size="19" font-weight="bold" fill="#1a3a5c">图 1　压力开关测试台架的组成</text>
  <text x="40" y="72" font-size="12.5" font-weight="bold" fill="#1a5276">气路（压力源 → 被试压力开关）</text>

  <!-- 气瓶 -->
  <rect x="30" y="95" width="120" height="130" rx="26" fill="#eaf4fb" stroke="#2471a3" stroke-width="2"/>
  <text x="90" y="122" font-size="12.5" font-weight="bold" fill="#1a5276" text-anchor="middle">气瓶 cab</text>
  <rect x="50" y="138" width="80" height="28" rx="3" fill="#1b2631"/>
  <text x="90" y="158" font-size="12.5" fill="#7CFC00" text-anchor="middle" font-family="monospace">2.00 MPa</text>
  <text x="90" y="200" font-size="11" fill="#21618c" text-anchor="middle">气源（出气口 o）</text>

  <!-- 截止阀 -->
  <rect x="190" y="108" width="110" height="110" rx="8" fill="#f4f6f7" stroke="#5d6d7e" stroke-width="2"/>
  <circle cx="245" cy="152" r="21" fill="#d5dbdb" stroke="#5d6d7e" stroke-width="2"/>
  <line x1="245" y1="152" x2="245" y2="131" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
  <text x="245" y="196" font-size="11.5" font-weight="bold" fill="#1a3a5c" text-anchor="middle">截止阀</text>
  <text x="245" y="210" font-size="10" fill="#34495e" text-anchor="middle">stopvalve</text>

  <!-- 调压阀 -->
  <rect x="340" y="105" width="160" height="110" rx="8" fill="#fdf2e9" stroke="#d35400" stroke-width="2"/>
  <circle cx="420" cy="146" r="19" fill="#aed6f1" stroke="#2471a3" stroke-width="2"/>
  <line x1="420" y1="146" x2="420" y2="129" stroke="#2471a3" stroke-width="6" stroke-linecap="round"/>
  <text x="420" y="182" font-size="11.5" font-weight="bold" fill="#935116" text-anchor="middle">减压 / 稳压阀</text>
  <text x="420" y="198" font-size="10" fill="#a04000" text-anchor="middle">输出 = min(输入, 设定压力)</text>

  <!-- 三通（立管 + 汇流块） -->
  <line x1="500" y1="150" x2="545" y2="150" stroke="#839192" stroke-width="9" stroke-linecap="round"/>
  <line x1="560" y1="90" x2="560" y2="210" stroke="#839192" stroke-width="9" stroke-linecap="round"/>
  <rect x="544" y="134" width="32" height="32" rx="5" fill="#c1bcbc" stroke="#6e7b7b" stroke-width="2"/>
  <text x="584" y="184" font-size="11.5" font-weight="bold" fill="#1a3a5c">三通接头 tee</text>
  <text x="584" y="199" font-size="10" fill="#566573">u → 压力表　l → 压力开关</text>

  <!-- 压力表（挂在三通上方） -->
  <line x1="560" y1="90" x2="620" y2="90" stroke="#839192" stroke-width="9"/>
  <circle cx="665" cy="88" r="40" fill="#ffffff" stroke="#333" stroke-width="3"/>
  <line x1="665" y1="88" x2="684" y2="68" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="665" cy="88" r="4" fill="#333"/>
  <text x="665" y="148" font-size="11.5" font-weight="bold" fill="#1a3a5c" text-anchor="middle">压力表 pm（0~0.4MPa）</text>

  <!-- 压力开关本体 -->
  <rect x="400" y="240" width="320" height="160" rx="10" fill="#e8f8f5" stroke="#16a085" stroke-width="2"/>
  <text x="486" y="262" font-size="12.5" font-weight="bold" fill="#0b5345" text-anchor="middle">压力开关 YT1226（yt）</text>
  <line x1="560" y1="210" x2="560" y2="240" stroke="#839192" stroke-width="9"/>
  <rect x="420" y="272" width="18" height="38" fill="#0c7b08" stroke="#1e4d1e"/>
  <text x="446" y="290" font-size="10.5" fill="#0b5345">给定值螺钉（每格 2%）</text>
  <rect x="420" y="322" width="34" height="20" fill="#077d59" stroke="#0b5345"/>
  <text x="462" y="336" font-size="10.5" fill="#0b5345">幅差螺钉（刻度 0~10 格）</text>
  <text x="446" y="368" font-size="10.5" fill="#0b5345">杠杆 / 波纹管 / 刀形触点</text>
  <!-- 触点 -->
  <circle cx="688" cy="268" r="6" fill="#08f818" stroke="#333"/>
  <circle cx="688" cy="300" r="6" fill="#a8a4a4" stroke="#333"/>
  <circle cx="688" cy="340" r="5.5" fill="#08f818" stroke="#000"/>
  <text x="676" y="262" font-size="10.5" fill="#1a5276" text-anchor="end">NC（常闭）</text>
  <text x="676" y="296" font-size="10.5" fill="#7f8c8d" text-anchor="end">NO（常开）</text>
  <text x="676" y="346" font-size="10.5" fill="#1a5276" text-anchor="end">COM</text>
  <line x1="696" y1="268" x2="730" y2="268" stroke="#333" stroke-width="3"/>
  <line x1="696" y1="340" x2="730" y2="340" stroke="#333" stroke-width="3"/>

  <!-- 万用表（右侧，表笔短接至端子） -->
  <rect x="790" y="246" width="176" height="120" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="878" y="270" font-size="12" font-weight="bold" fill="#922b21" text-anchor="middle">数字万用表 multimeter</text>
  <text x="878" y="290" font-size="11" fill="#922b21" text-anchor="middle">档位：200Ω 电阻档</text>
  <text x="802" y="314" font-size="11" fill="#c0392b">红表笔 → NC</text>
  <text x="802" y="336" font-size="11" fill="#34495e">黑表笔 → COM</text>
  <text x="802" y="358" font-size="10.5" fill="#566573">（测常闭触点的通断）</text>
  <line x1="790" y1="268" x2="734" y2="268" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#pb)"/>
  <line x1="790" y1="340" x2="734" y2="340" stroke="#34495e" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#pc)"/>

  <!-- 气路箭头 -->
  <line x1="150" y1="150" x2="190" y2="150" stroke="#2471a3" stroke-width="6" marker-end="url(#pa)"/>
  <line x1="300" y1="150" x2="340" y2="150" stroke="#2471a3" stroke-width="6" marker-end="url(#pa)"/>

  <text x="40" y="444" font-size="11" fill="#566573">触点闭合 ≈ 0.0Ω（NC—COM 导通）；触点断开显示 O.L（超量程）。万用表只做通断监视，不参与压力控制。</text>
</svg>
