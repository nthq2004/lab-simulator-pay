<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <rect width="1000" height="470" fill="#fbfcfe"/>
  <text x="24" y="30" font-size="20" font-weight="bold" fill="#1a3a5c">图 4　执行器环节：输出电流 → 阀门开度（项目 8.2.3 四点比对）</text>

  <!-- 左：阀体示意 -->
  <g>
    <text x="60" y="76" font-size="13" font-weight="bold" fill="#1a5276">电动调节阀（远程 REMOTE 模式）</text>
    <circle cx="180" cy="220" r="78" fill="none" stroke="#2c3e50" stroke-width="14"/>
    <path d="M180,220 L180,160" stroke="#7f8c8d" stroke-width="5"/>
    <circle cx="180" cy="220" r="12" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="3"/>
    <path d="M180,142 L180,120" stroke="#2471a3" stroke-width="6"/>
    <rect x="248" y="188" width="70" height="64" rx="8" fill="#34495e"/>
    <text x="283" y="216" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">M</text>
    <text x="283" y="236" font-size="10" fill="#d5dbdb" text-anchor="middle">执行电机</text>
    <rect x="120" y="96" width="60" height="22" rx="3" fill="#111"/>
    <text x="150" y="112" font-size="12" fill="#00ff00" text-anchor="middle" font-family="monospace">50%</text>
    <text x="180" y="330" font-size="11" fill="#34495e" text-anchor="middle">阀位反馈由电机驱动阀杆，</text>
    <text x="180" y="348" font-size="11" fill="#34495e" text-anchor="middle">开度与输入 4~20mA 成正比</text>

    <text x="60" y="392" font-size="11.5" fill="#7b241c">定位器：接收 4~20mA → 调节气源压力 → 推动阀杆 → 阀位反馈闭环修正</text>
    <text x="60" y="414" font-size="11.5" fill="#7b241c">气动执行器：把气压信号变成机械位移，是"执行机构"本身</text>
  </g>

  <!-- 右：对照表 -->
  <g>
    <text x="520" y="76" font-size="13" font-weight="bold" fill="#1a5276">手动输出与阀位对照（PID 在 MAN 模式）</text>
    <rect x="520" y="92" width="430" height="300" rx="10" fill="#fff" stroke="#95a5a6" stroke-width="1.5"/>

    <!-- 表头 -->
    <rect x="520" y="92" width="430" height="36" rx="10" fill="#eef3f7"/>
    <g font-size="12" font-weight="bold" fill="#1a3a5c">
      <text x="600" y="116" text-anchor="middle">PID 输出 OUT</text>
      <text x="700" y="116" text-anchor="middle">输出电流</text>
      <text x="800" y="116" text-anchor="middle">阀门开度</text>
      <text x="895" y="116" text-anchor="middle">阀位状态</text>
    </g>

    <!-- 行 -->
    <g font-size="13" fill="#34495e">
      <text x="600" y="164" text-anchor="middle">25%</text>
      <text x="700" y="164" text-anchor="middle">8.00 mA</text>
      <text x="800" y="164" text-anchor="middle">25%</text>
      <text x="895" y="164" text-anchor="middle">小开度</text>

      <text x="600" y="214" text-anchor="middle">50%</text>
      <text x="700" y="214" text-anchor="middle">12.00 mA</text>
      <text x="800" y="214" text-anchor="middle">50%</text>
      <text x="895" y="214" text-anchor="middle">半开</text>

      <text x="600" y="264" text-anchor="middle">75%</text>
      <text x="700" y="264" text-anchor="middle">16.00 mA</text>
      <text x="800" y="264" text-anchor="middle">75%</text>
      <text x="895" y="264" text-anchor="middle">大开度</text>

      <text x="600" y="314" text-anchor="middle">100%</text>
      <text x="700" y="314" text-anchor="middle">20.00 mA</text>
      <text x="800" y="314" text-anchor="middle">100%</text>
      <text x="895" y="314" text-anchor="middle">全开</text>
    </g>
    <g stroke="#e5e8e8" stroke-width="1">
      <path d="M520,176 H950"/><path d="M520,226 H950"/><path d="M520,276 H950"/>
    </g>
    <g stroke="#d5dbdb" stroke-width="1">
      <path d="M650,128 V392"/><path d="M750,128 V392"/><path d="M850,128 V392"/>
    </g>

    <text x="520" y="418" font-size="11.5" fill="#34495e">换算：I ＝ 4 ＋ 16·OUT/100（mA）；开度 ＝ (I − 4)/16 × 100%，与电流一一对应。</text>
  </g>
</svg>
