    </g>
    <g>
      <rect x="550" y="290" width="76" height="96" rx="3" fill="#f0f1f4" stroke="#a0a8b8"/>
      <rect x="578" y="298" width="20" height="44" rx="2" fill="#cfd3da" stroke="#9aa2ac"/>
      <rect x="580" y="300" width="16" height="22" rx="2" fill="#2878c8" stroke="#0f3a68"/>
