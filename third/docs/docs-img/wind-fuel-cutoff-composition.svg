  <rect x="46" y="96" width="158" height="150" rx="4" fill="#eef6ee" stroke="#7aa77a" stroke-width="1.2"/>
  <text x="125" y="114" font-size="11" font-weight="bold" fill="#0b6a14" text-anchor="middle">消防控制室控制屏</text>
  <g font-size="9.5" fill="#1a252f">
    <text x="58" y="134">机舱风机 ESS-1F</text><rect x="140" y="122" width="34" height="16" rx="2" fill="#c02020" stroke="#5a0000"/>
    <text x="58" y="158">机舱油泵 ESS-1P</text><rect x="140" y="146" width="34" height="16" rx="2" fill="#c02020" stroke="#5a0000"/>
