  <!-- 关系箭头 -->
  <path d="M370 336 L436 336" fill="none" stroke="#d9534f" stroke-width="2.2" marker-end="url(#arrR)"/>
  <text x="402" y="328" font-size="9" fill="#a13b39" text-anchor="middle">分励</text>
  <text x="402" y="352" font-size="9" fill="#a13b39" text-anchor="middle">脱扣</text>

  <path d="M730 200 L786 178" fill="none" stroke="#5b7f9e" stroke-width="2.2" marker-end="url(#arr)"/>
  <path d="M730 330 L786 344" fill="none" stroke="#5b7f9e" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="756" y="252" font-size="9" fill="#3f5c78" text-anchor="middle">供电</text>

  <text x="520" y="500" font-size="9" fill="#5a6a75" text-anchor="middle">操作屏 → 24V 控制回路 → 中间继电器 → 分励脱扣器 → 负载屏塑壳断路器跳闸 → 对应机组失电停转</text>
