<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
  <rect width="1000" height="640" fill="#f7f9f8"/>
  <text x="500" y="28" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="bold" fill="#263238">电动机连续控制线路（主电路 + 控制回路）</text>

  <!-- ══════════ 主电路 ══════════ -->
  <text x="34" y="62" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="bold" fill="#37474f">主电路</text>

  <rect x="52" y="72" width="246" height="32" rx="4" fill="#ffffff" stroke="#78909c" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="175" y="94" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#37474f">三相电源 380V 50Hz</text>

  <text x="90" y="122" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#c62828">U</text>
  <text x="150" y="122" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#2e7d32">V</text>
  <text x="210" y="122" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#1565c0">W</text>

  <!-- 三相竖线（设备框覆盖其上） -->
  <g stroke-width="2">
    <line x1="90"  y1="104" x2="90"  y2="404" stroke="#c62828"/>
    <line x1="150" y1="104" x2="150" y2="404" stroke="#2e7d32"/>
    <line x1="210" y1="104" x2="210" y2="404" stroke="#1565c0"/>
  </g>

  <!-- QF -->
  <rect x="64" y="146" width="172" height="52" rx="4" fill="#ffffff" stroke="#546e7a" stroke-width="1.6"/>
  <g stroke="#c62828" stroke-width="2">
    <line x1="90" y1="190" x2="106" y2="156"/>
  </g>
  <g stroke="#2e7d32" stroke-width="2">
    <line x1="150" y1="190" x2="166" y2="156"/>
  </g>
  <g stroke="#1565c0" stroke-width="2">
    <line x1="210" y1="190" x2="226" y2="156"/>
  </g>
  <text x="246" y="178" font-family="Microsoft YaHei, Arial" font-size="12" fill="#37474f">QF 断路器</text>
  <circle cx="90" cy="146" r="3" fill="#c62828"/><circle cx="150" cy="146" r="3" fill="#2e7d32"/><circle cx="210" cy="146" r="3" fill="#1565c0"/>
  <circle cx="90" cy="198" r="3" fill="#c62828"/><circle cx="150" cy="198" r="3" fill="#2e7d32"/><circle cx="210" cy="198" r="3" fill="#1565c0"/>

  <!-- KM1 主触头 -->
  <rect x="64" y="232" width="172" height="52" rx="4" fill="#ffffff" stroke="#546e7a" stroke-width="1.6"/>
  <g stroke="#c62828" stroke-width="2"><line x1="90" y1="276" x2="106" y2="242"/></g>
  <g stroke="#2e7d32" stroke-width="2"><line x1="150" y1="276" x2="166" y2="242"/></g>
  <g stroke="#1565c0" stroke-width="2"><line x1="210" y1="276" x2="226" y2="242"/></g>
  <text x="246" y="264" font-family="Microsoft YaHei, Arial" font-size="12" fill="#37474f">KM1 主触头</text>
  <circle cx="90" cy="232" r="3" fill="#c62828"/><circle cx="150" cy="232" r="3" fill="#2e7d32"/><circle cx="210" cy="232" r="3" fill="#1565c0"/>
  <circle cx="90" cy="284" r="3" fill="#c62828"/><circle cx="150" cy="284" r="3" fill="#2e7d32"/><circle cx="210" cy="284" r="3" fill="#1565c0"/>

  <!-- FR 热元件 -->
  <rect x="64" y="318" width="172" height="52" rx="4" fill="#ffffff" stroke="#546e7a" stroke-width="1.6"/>
  <g fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.4">
    <rect x="81" y="328" width="18" height="32" rx="2"/>
    <rect x="141" y="328" width="18" height="32" rx="2"/>
    <rect x="201" y="328" width="18" height="32" rx="2"/>
  </g>
  <text x="246" y="350" font-family="Microsoft YaHei, Arial" font-size="12" fill="#37474f">FR 发热元件</text>

  <!-- 电动机 -->
  <text x="60" y="404" text-anchor="end" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">U1</text>
  <text x="120" y="404" text-anchor="end" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">V1</text>
  <text x="180" y="404" text-anchor="end" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">W1</text>
  <circle cx="150" cy="470" r="64" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
  <text x="150" y="484" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#263238">M</text>
  <text x="150" y="452" text-anchor="middle" font-family="Arial" font-size="12" fill="#546e7a">3~</text>
  <line x1="150" y1="534" x2="150" y2="566" stroke="#455a64" stroke-width="2"/>
  <line x1="90" y1="566" x2="210" y2="566" stroke="#455a64" stroke-width="2"/>
  <g stroke="#455a64" stroke-width="2">
    <line x1="90" y1="566" x2="90" y2="586"/>
    <line x1="150" y1="566" x2="150" y2="586"/>
    <line x1="210" y1="566" x2="210" y2="586"/>
  </g>
  <text x="90" y="602" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">U2</text>
  <text x="150" y="602" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">V2</text>
  <text x="210" y="602" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">W2</text>
  <circle cx="90" cy="586" r="3" fill="#455a64"/><circle cx="150" cy="586" r="3" fill="#455a64"/><circle cx="210" cy="586" r="3" fill="#455a64"/>

  <!-- ══════════ 控制回路 ══════════ -->
  <text x="420" y="62" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="bold" fill="#37474f">控制回路</text>

  <!-- 控制电源输入 -->
  <line x1="430" y1="262" x2="470" y2="262" stroke="#546e7a" stroke-width="1.6"/>
  <line x1="430" y1="372" x2="470" y2="372" stroke="#546e7a" stroke-width="1.6"/>
  <text x="424" y="256" text-anchor="end" font-family="Microsoft YaHei, Arial" font-size="11" fill="#546e7a">来自 L3</text>
  <rect x="438" y="254" width="26" height="16" rx="2" fill="#ffffff" stroke="#546e7a" stroke-width="1.6"/>
  <line x1="438" y1="262" x2="464" y2="262" stroke="#546e7a" stroke-width="1.4"/>
  <text x="451" y="248" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="10" fill="#37474f">FU4</text>
  <text x="424" y="366" text-anchor="end" font-family="Microsoft YaHei, Arial" font-size="11" fill="#546e7a">来自 L2</text>

  <!-- 控制变压器 -->
  <rect x="470" y="230" width="120" height="160" rx="4" fill="#ffffff" stroke="#546e7a" stroke-width="1.6"/>
  <g stroke="#8d6e63" stroke-width="2" fill="none">
    <path d="M494 258 q11 8 0 16 q-11 8 0 16 q11 8 0 16 q-11 8 0 16 q11 8 0 16 q-11 8 0 16"/>
    <path d="M566 258 q-11 8 0 16 q11 8 0 16 q-11 8 0 16 q11 8 0 16 q-11 8 0 16 q11 8 0 16"/>
  </g>
  <text x="530" y="322" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="bold" fill="#37474f">TC</text>
  <text x="484" y="252" font-family="Microsoft YaHei, Arial" font-size="10" fill="#37474f">P1</text>
  <text x="484" y="392" font-family="Microsoft YaHei, Arial" font-size="10" fill="#37474f">P2</text>
  <text x="580" y="252" font-family="Microsoft YaHei, Arial" font-size="10" fill="#37474f">S1</text>
  <text x="580" y="392" font-family="Microsoft YaHei, Arial" font-size="10" fill="#37474f">S2</text>
  <circle cx="470" cy="262" r="3" fill="#546e7a"/><circle cx="470" cy="372" r="3" fill="#546e7a"/>
  <circle cx="590" cy="262" r="3" fill="#546e7a"/><circle cx="590" cy="372" r="3" fill="#546e7a"/>

  <!-- 控制回路：S2 → SB1 → (SB2 ∥ KM1 常开) → 线圈 → FR 常闭 → FU5 → S1 -->
  <g stroke="#37474f" stroke-width="1.8" fill="none">
    <line x1="590" y1="372" x2="620" y2="372"/>
    <line x1="620" y1="372" x2="674" y2="372"/>
    <line x1="674" y1="372" x2="700" y2="372"/>
    <line x1="700" y1="372" x2="700" y2="322"/>
    <line x1="700" y1="322" x2="706" y2="322"/>
    <line x1="758" y1="322" x2="800" y2="322"/>
    <line x1="800" y1="322" x2="800" y2="372"/>
    <line x1="700" y1="372" x2="700" y2="422"/>
    <line x1="700" y1="422" x2="706" y2="422"/>
    <line x1="710" y1="422" x2="756" y2="404" stroke="#37474f" stroke-width="1.8"/>
    <line x1="758" y1="422" x2="800" y2="422"/>
    <line x1="800" y1="422" x2="800" y2="372"/>
    <line x1="800" y1="372" x2="820" y2="372"/>
    <line x1="876" y1="372" x2="900" y2="372"/>
    <line x1="900" y1="372" x2="952" y2="372"/>
    <line x1="952" y1="372" x2="968" y2="372"/>
    <line x1="968" y1="372" x2="968" y2="292"/>
    <line x1="968" y1="292" x2="866" y2="292"/>
    <line x1="832" y1="292" x2="620" y2="292"/>
    <line x1="620" y1="292" x2="590" y2="292"/>
    <line x1="590" y1="292" x2="590" y2="262"/>
  </g>
  <!-- SB2 支路（常开） -->
  <g stroke="#37474f" stroke-width="1.8" fill="none">
    <line x1="688" y1="322" x2="710" y2="322"/>
    <line x1="714" y1="322" x2="762" y2="306"/>
    <line x1="766" y1="322" x2="800" y2="322"/>
  </g>

  <!-- 线圈 -->
  <rect x="820" y="346" width="56" height="46" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.8"/>
  <text x="848" y="375" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#283593">KM1</text>
  <!-- 熔断器 FU5 -->
  <rect x="832" y="284" width="34" height="16" rx="2" fill="#ffffff" stroke="#546e7a" stroke-width="1.6"/>
  <line x1="832" y1="292" x2="866" y2="292" stroke="#546e7a" stroke-width="1.4"/>

  <!-- 端点点 -->
  <g fill="#37474f">
    <circle cx="620" cy="372" r="3"/><circle cx="674" cy="372" r="3"/>
    <circle cx="700" cy="322" r="3"/><circle cx="800" cy="322" r="3"/>
    <circle cx="700" cy="422" r="3"/><circle cx="800" cy="422" r="3"/>
    <circle cx="900" cy="372" r="3"/><circle cx="952" cy="372" r="3"/>
  </g>

  <!-- 常闭触头的推杆标记（SB1 停止、FR 常闭） -->
  <g stroke="#546e7a" stroke-width="1.4" fill="none">
    <line x1="647" y1="372" x2="647" y2="360"/><line x1="639" y1="360" x2="655" y2="360"/>
    <line x1="926" y1="372" x2="926" y2="360"/><line x1="918" y1="360" x2="934" y2="360"/>
  </g>

  <!-- 标注 -->
  <text x="646" y="344" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#37474f">SB1 停止</text>
  <text x="752" y="344" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#37474f">SB2 起动</text>
  <text x="752" y="442" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#37474f">KM1 常开（自锁）</text>
  <text x="848" y="410" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#37474f">KM1 线圈</text>
  <text x="926" y="344" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#37474f">FR 常闭</text>
  <text x="849" y="278" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">FU5</text>
  <text x="430" y="500" font-family="Microsoft YaHei, Arial" font-size="12" fill="#c62828">SB2 与 KM1 常开辅助触头并联：松开 SB2 后电流经 KM1 常开触头继续供给线圈（自锁）。</text>
  <text x="430" y="522" font-family="Microsoft YaHei, Arial" font-size="12" fill="#37474f">FR 常闭触头串在回路中：电动机过载时断开 → 线圈失电 → 主触头断开，实现过载保护。</text>
</svg>
