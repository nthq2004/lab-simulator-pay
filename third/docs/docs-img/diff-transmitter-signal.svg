<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <rect width="1000" height="470" fill="#fbfcfe"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#1a3a5c">图 2　差压—电流特性与零点 / 量程调整</text>

  <!-- 坐标轴：x 120~680 对应 Δp 0~1.0MPa；y 380 对应 0mA，每 12px 为 1mA -->
  <line x1="120" y1="380" x2="690" y2="380" stroke="#34495e" stroke-width="2"/>
  <line x1="120" y1="380" x2="120" y2="92" stroke="#34495e" stroke-width="2"/>
  <text x="112" y="76" font-size="12" fill="#1a3a5c" text-anchor="middle">I / mA</text>
  <text x="690" y="424" font-size="12" fill="#1a3a5c" text-anchor="end">差压 Δp / MPa</text>

  <g font-size="11" fill="#5d6d7e">
    <line x1="120" y1="332" x2="680" y2="332" stroke="#dfe6ec"/>
    <text x="112" y="336" text-anchor="end">4</text>
    <line x1="120" y1="236" x2="680" y2="236" stroke="#dfe6ec"/>
    <text x="112" y="240" text-anchor="end">12</text>
    <line x1="120" y1="140" x2="680" y2="140" stroke="#dfe6ec"/>
    <text x="112" y="144" text-anchor="end">20</text>
    <line x1="176" y1="380" x2="176" y2="96" stroke="#eef2f6"/>
    <text x="176" y="398" text-anchor="middle">0.1</text>
    <line x1="400" y1="380" x2="400" y2="96" stroke="#eef2f6"/>
    <text x="400" y="398" text-anchor="middle">0.5</text>
    <line x1="680" y1="380" x2="680" y2="96" stroke="#eef2f6"/>
    <text x="680" y="398" text-anchor="middle">1.0</text>
  </g>

  <!-- 调整前：I = 4 + 16Δp（0.1→5.6mA，0.9→18.4mA） -->
  <line x1="120" y1="332" x2="680" y2="140" stroke="#e67e22" stroke-width="2.5" stroke-dasharray="9,5"/>
  <circle cx="176" cy="313" r="4.5" fill="#e67e22"/>
  <circle cx="624" cy="159" r="4.5" fill="#e67e22"/>

  <!-- 调整后：4mA@0.1MPa、20mA@0.9MPa -->
  <line x1="120" y1="356" x2="680" y2="116" stroke="#c0392b" stroke-width="3"/>
  <circle cx="176" cy="332" r="5.5" fill="#c0392b"/>
  <circle cx="624" cy="140" r="5.5" fill="#c0392b"/>

  <!-- 图例（含关键读数） -->
  <line x1="148" y1="104" x2="188" y2="104" stroke="#c0392b" stroke-width="3"/>
  <text x="196" y="108" font-size="11" fill="#922b21">调整后：0.1MPa → 4.00mA，0.9MPa → 20.00mA</text>
  <line x1="148" y1="126" x2="188" y2="126" stroke="#e67e22" stroke-width="2.5" stroke-dasharray="9,5"/>
  <text x="196" y="130" font-size="11" fill="#b9770e">调整前：0.1MPa → 5.60mA，0.9MPa → 16.8mA</text>

  <!-- 右侧说明 -->
  <rect x="740" y="86" width="234" height="290" rx="10" fill="#fdf6f4" stroke="#c0392b" stroke-width="1.5"/>
  <text x="756" y="112" font-size="13" font-weight="bold" fill="#922b21">调零（Z 旋钮）</text>
  <text x="756" y="134" font-size="11" fill="#5d4037">差压保持 0.1MPa 不变，</text>
  <text x="756" y="152" font-size="11" fill="#5d4037">旋转调零旋钮，把电流</text>
  <text x="756" y="170" font-size="11" fill="#5d4037">拉回 4.00mA。</text>
  <text x="756" y="198" font-size="13" font-weight="bold" fill="#922b21">调量程（S 旋钮）</text>
  <text x="756" y="220" font-size="11" fill="#5d4037">差压升到 0.9MPa，旋转</text>
  <text x="756" y="238" font-size="11" fill="#5d4037">量程旋钮，把电流拉到</text>
  <text x="756" y="256" font-size="11" fill="#5d4037">20.00mA。</text>
  <text x="756" y="284" font-size="13" font-weight="bold" fill="#922b21">为什么要来回两轮</text>
  <text x="756" y="306" font-size="11" fill="#5d4037">调量程会带动零点偏移，</text>
  <text x="756" y="324" font-size="11" fill="#5d4037">调零点又影响满度，须反</text>
  <text x="756" y="342" font-size="11" fill="#5d4037">复两轮才收敛。</text>
  <text x="756" y="366" font-size="11" fill="#922b21" font-family="monospace">4 + 16·(Δp−0.1)/0.8</text>

  <text x="120" y="446" font-size="11" fill="#5d6d7e">① 0.1MPa 处调零至 4mA　② 0.9MPa 处调量程至 20mA　③ 两线在 0.5MPa / 12mA 处相交，说明两点调校互为影响，需迭代两轮。</text>
  <text x="120" y="464" font-size="11" fill="#5d6d7e">LCD 显示的是实测差压（不随旋钮改变），旋钮只改变 4~20mA 输出电流——这就是判断调校是否到位的依据。</text>
</svg>
