<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <style>
      .tb { font-size:12.5px; font-weight:bold; fill:#1b3a4b; }
      .t  { font-size:10.5px; fill:#22303a; }
      .ts { font-size:10px; fill:#5b666d; }
      .hdr{ fill:#dfe5e8; stroke:#8b959c; stroke-width:1; }
      .grp{ fill:#f7f9fa; stroke:#a8b0b5; stroke-width:1.2; }
      .hh { fill:#fdecea; stroke:#c62828; stroke-width:1.2; }
      .hhh{ fill:#fff6e0; stroke:#b08a2c; stroke-width:1.2; }
    </style>
  </defs>

  <text x="24" y="30" class="tb" font-size="17">图 3　HH、H、L、LL 四级报警及其后果</text>

  <!-- 表头 -->
  <rect x="40" y="52" width="960" height="30" class="hdr"/>
  <text x="46" y="72" class="tb" font-size="11.5">代号</text>
  <text x="110" y="72" class="tb" font-size="11.5">名称</text>
  <text x="236" y="72" class="tb" font-size="11.5">归属</text>
  <text x="330" y="72" class="tb" font-size="11.5">含义与处理</text>
  <text x="620" y="72" class="tb" font-size="11.5">本仿真中的体现</text>

  <!-- HH -->
  <rect x="40" y="82" width="960" height="76" class="hh"/>
  <text x="52" y="126" class="tb" font-size="15" fill="#b3261e">HH</text>
  <text x="110" y="114" class="t" font-weight="bold">高高限</text>
  <text x="110" y="134" class="t">（超上限）</text>
  <text x="236" y="114" class="t" font-weight="bold" fill="#b3261e">保护</text>
  <text x="330" y="106" class="t">立即联锁动作：主机自动停车 SHD 或</text>
  <text x="330" y="124" class="t">自动减速 SLD；须人工确认、排除故障</text>
  <text x="330" y="142" class="t">后复位，不能只按确认了事</text>
  <text x="620" y="106" class="t">A 级高限测点报警 5 s 后记「主机自动减速」；</text>
  <text x="620" y="124" class="t">延时内可在 Operate 菜单 Cancel Slow Down 越控；</text>
  <text x="620" y="142" class="t">实时系统功能号后缀用 AHH（本仿真只用 AH）</text>

  <!-- H -->
  <rect x="40" y="158" width="960" height="72" class="hhh"/>
  <text x="52" y="200" class="tb" font-size="15" fill="#8a6a1f">H</text>
  <text x="110" y="190" class="t" font-weight="bold">高限</text>
  <text x="110" y="210" class="t">（越上限）</text>
  <text x="236" y="190" class="t">报警</text>
  <text x="330" y="182" class="t">声光提示，值班人员调整：开大冷却水、</text>
  <text x="330" y="200" class="t">切备用泵、降负荷；一般不停机</text>
  <text x="330" y="220" class="t">　</text>
  <text x="620" y="182" class="t">如 M/E CW OUTLET TEMP HIGH（ME-CW-T，</text>
  <text x="620" y="200" class="t">限值 88 ℃、死区 1 ℃、延时 5 s、A 级）；</text>
  <text x="620" y="220" class="t">功能号 TIAH＝温度＋I＋高限</text>

  <!-- L -->
  <rect x="40" y="230" width="960" height="72" class="hhh"/>
  <text x="52" y="272" class="tb" font-size="15" fill="#8a6a1f">L</text>
  <text x="110" y="262" class="t" font-weight="bold">低限</text>
  <text x="110" y="282" class="t">（越下限）</text>
  <text x="236" y="262" class="t">报警</text>
  <text x="330" y="254" class="t">提示参数偏低（滑油进机压力、空气瓶</text>
  <text x="330" y="272" class="t">压力等），以调整、切换为主</text>
  <text x="330" y="292" class="t">　</text>
  <text x="620" y="254" class="t">如 M/E LO INLET PRESS LOW（ME-LO-P，</text>
  <text x="620" y="272" class="t">限值 0.25 MPa、死区 0.02 MPa、延时 3 s）；</text>
  <text x="620" y="292" class="t">功能号 PIAL＝压力＋I＋低限</text>

  <!-- LL -->
  <rect x="40" y="302" width="960" height="76" class="hh"/>
  <text x="52" y="346" class="tb" font-size="15" fill="#b3261e">LL</text>
  <text x="110" y="334" class="t" font-weight="bold">低低限</text>
  <text x="110" y="354" class="t">（超下限）</text>
  <text x="236" y="334" class="t" font-weight="bold" fill="#b3261e">保护</text>
  <text x="330" y="326" class="t">已不能维持设备安全运行：直接安保</text>
  <text x="330" y="344" class="t">动作（主机自动停车）</text>
  <text x="330" y="362" class="t">　</text>
  <text x="620" y="326" class="t">A 级低限测点报警 5 s 后记「主机自动停车」；</text>
  <text x="620" y="344" class="t">可在延时内 Cancel Shut Down 越控；</text>
  <text x="620" y="362" class="t">实时系统功能号后缀用 ALL（本仿真只用 AL）</text>

  <!-- 说明块 -->
  <rect x="40" y="392" width="470" height="84" class="grp" rx="5"/>
  <text x="56" y="414" class="tb">四级共用同一套判定</text>
  <text x="56" y="436" class="t">越限并持续超过 Delay Time → 报警；</text>
  <text x="56" y="456" class="t">越过回差（Deadband）才消警，防止门限附近抖动</text>

  <rect x="530" y="392" width="470" height="84" class="grp" rx="5"/>
  <text x="546" y="414" class="tb">报警值与保护动作值要分开整定</text>
  <text x="546" y="436" class="t">H／L 只提醒人，HH／LL 参与保护联锁；</text>
  <text x="546" y="456" class="t">本仿真用优先级体现：A 级自动带 SHD／SLD，延时 5 s</text>

  <text x="40" y="504" class="ts">教学提示：先分清“报警”与“保护”——报警要求人干预，保护是设备自己动手；本仿真每点只设一档限值，四级结构用于理解真实系统的层次。</text>
  <text x="40" y="526" class="ts">功能号读法：类型字母（P 压力／Q 流量／L 液位／T 温度／X 其他）＋ I ＋ 方向（AH 高限／AL 低限），后缀再加 H／L 即表示更高或更低一档。</text>
</svg>
