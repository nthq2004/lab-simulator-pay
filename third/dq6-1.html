Cranking&&e.isCranking()&&e.getResistance()<.5):!1}},{msg:`第 6 步：测试题——在高压电网上测量绝缘电阻的安全要求`,mode:`quiz`,quizConfig:{question:`在 6600V 船舶高压电网上测量各相对地绝缘电阻时，下列做法正确的是？`,options:[`测量前不必停电，可带电直接摇测，方便实时监测绝缘`,`停电、验电、人工放电后，用 2500V 兆欧表逐相对地测量，测毕再次充分放电`,`用 500V 电压等级的摇表即可，电压等级越高反而越危险`,`测完一相对地绝缘后不必放电，可直接换接下一相继续测量`],answer:1,analysis:`高压电网测量绝缘必须严格执行：① 断开电源并验电、人工放电，必要时挂接地线；② 使用 2500V 及以上电压等级的兆欧表逐相对地测量；③ 测量过程及测毕均应对被测相充分放电，防止剩余电荷伤人。本流程中 1# 发电机分闸停机、母线断电后，才安全地用兆欧表找出左汇流排 C 相接地（0.01MΩ）。`}}]},"hv-vcb-isolation":{id:`hv-vcb-isolation`,name:`4.真空断路器隔离切换操作`,steps:[{msg:`第 1 步：自动接线，起动 1# 高压发电机，合上断路器向汇流排供电。`,mode:`check`,async act(){let e=this.sys;Xo(e),await Q(400);let t=e.comps.gen_hv,n=e.comps.qf1;n&&(n._animating=!1,n._state=`off`,n._workPos=0,n._detent=0,n._isoT=0,n._dialAngle=0,n._clickAcc=0,n._doorOpen=!1,n._doorSlide=0,n._gsSwitches=[!1,!1,!1],n._emLockUnlocked=!1,n._crankInserted=!1,n._crankTurnCount=0,n._crankRotation=0,n._crankCur=0,n._chargeProg=5,n._charged=!0),t&&(t.isOn=!1,t.freq=0,t._rmsI=0,t._rmsV=0),await Q(500),t&&(t.isOn=!0,t.freq=50,t._rmsV=3810),await Q(1500),n&&(n._chargeProg=5,n._charged=!0,n.tryClose()),await Q(1800)},check(){let e=this.sys,t=e.comps.gen_hv,n=e.comps.qf1;return!!(t&&t.isOn&&n&&n.isClosed()&&n.getWorkPos()===0)}},{msg:`第 2 步：测试题——真空断路器合闸状态插入摇柄无法转动`,mode:`quiz`,quizConfig:{question:`真空断路器处于合闸（连接位投入运行）状态时，插入摇柄试图摇动工作位转换机构，摇柄无法转动，这属于电气"五防"中的（　）。`,options:[`防止误分、误合断路器`,`防止带负荷拉合隔离开关（防止带负荷摇动隔离手车）`,`防止带接地线合闸`,`防止误入带电间隔`],answer:1,analysis:`断路器合闸即带负荷运行，此时工作位转换机构被机械闭锁，禁止摇动隔离手车——否则将造成带负荷拉、合隔离开关（隔离断口拉弧）的严重事故。这就是"五防"第二防：防止带负荷拉合隔离开关。本流程第 1 步合闸后，工作位锁定指示即为红色。`}},{msg:`第 3 步：断开真空断路器，停止发电机，将断路器由"连接位"摇至"试验位"`,mode:`check`,async act(){let e=this.sys,t=e.comps.qf1,n=e.comps.gen_hv;if(t&&t.isClosed()&&t.tryTrip&&t.tryTrip(),await Q(1400),n&&(n.isOn=!1,n.freq=0,n._rmsI=0,n._rmsV=0),await Q(500),t)for(let e=0;e<3;e++)t._dialTurn(1);await Q(500)},check(){let e=this.sys,t=e.comps.gen_hv,n=e.comps.qf1;return!!(n&&!n.isClosed()&&n.getWorkPos()===1&&t&&!t.isOn)}},{msg:`第 4 步（之一）：测试题——真空断路器合、分闸按钮的防护盖`,mode:`quiz`,quizConfig:{question:`真空断路器的合、分闸按钮均设有防护玻璃盖，需先翻开防护盖才能操作按钮，这属于电气"五防"中的（　）。`,options:[`防止带负荷拉合隔离开关`,`防止带接地线合闸`,`防止误分、误合断路器`,`防止带电合接地开关`],answer:2,analysis:`合、分闸按钮加装防护盖，防止运行/检修中误碰、误触导致断路器误合闸或误跳闸——这是"五防"第一防：防止误分、误合断路器。操作时必须先开盖再按按钮，操作后随手关盖。`}},{msg:`第 4 步（之二）：测试题——接地开关未合上时柜门无法打开`,mode:`quiz`,quizConfig:{question:`断路器柜在接地开关尚未合上（负荷侧未可靠接地）时，柜门无法打开，这属于电气"五防"中的（　）。`,options:[`防止误入带电间隔（未可靠接地前禁止开门进入柜内）`,`防止带负荷拉合隔离开关`,`防止误分、误合断路器`,`防止带接地线合闸`],answer:0,analysis:`柜门与接地开关互为联锁：接地开关未合上、负荷侧未可靠接地，柜门被机械闭锁——只有在确认无电并可靠接地后才能开门检修，防止检修人员误入带电间隔，这就是"五防"第五防：防止误入带电间隔。`}},{msg:`第 5 步：在试验位确认分闸且两侧无压后，插入摇柄，将三相接地开关闭合。`,mode:`check`,async act(){let e=this.sys.comps.qf1;e&&(e._emLockUnlocked=!0,e._crankInserted=!0,e._crankTurnCount=e._crankTargetTurns,e._crankRotation=e._crankTargetTurns*360,e._updateGroundSwitchState(),await Q(700))},check(){let e=this.sys.comps.qf1;return!!(e&&e.isGrounded())}},{msg:`第 6 步：测试题——接地开关闭合时断路器合闸被闭锁`,mode:`quiz`,quizConfig:{question:`接地开关处于闭合状态（负荷侧已接地）时，真空断路器的合闸被可靠闭锁、无法合闸，这属于电气"五防"中的（　）。`,options:[`防止带电挂接地线`,`防止误分、误合断路器`,`防止带负荷拉合隔离开关`,`防止带接地线合闸`],answer:3,analysis:`接地开关闭合说明线路已可靠接地，此时若再合闸送电将造成"带接地线（接地开关）合闸"——直接对地短路、动静触头严重烧毁。合闸回路在接地开关闭合时被机械+电气双重闭锁（合闸按钮盖也被锁死），这就是"五防"第四防：防止带接地线合闸。`}},{msg:`第 7 步：负荷侧已可靠接地，此时柜门解锁，打开柜门，进行检修`,mode:`check`,async act(){let e=this.sys.comps.qf1;e&&e.isGrounded()&&!e.isDoorOpen()&&e.toggleDoor(),await Q(800)},check(){let e=this.sys.comps.qf1;return!!(e&&e.isDoorOpen()&&e.isGrounded())}},{msg:`第 8 步：测试题——检修过程中对检修人员的要求`,mode:`quiz`,quizConfig:{question:`打开柜门对真空断路器进行检修时，对检修人员的要求是（　）。`,options:[`检修时间紧，可一人独立作业，带电操作也没关系`,`检修人员应经安全培训并持证上岗；作业前先停电、验电、放电并挂接地线，悬挂"有人工作、禁止合闸"标示牌；至少两人配合，使用合格的绝缘安全工器具`,`只需戴普通棉纱手套即可保证安全`,`检修中可随意短接闭锁装置以简化操作`],answer:1,analysis:`高压开关柜检修必须落实保证安全的组织措施和技术措施：持证上岗、工作票制度、至少两人作业；停电→验电→放电→挂接地线→悬挂警示牌、装设遮栏；使用合格绝缘工器具；严禁擅自解除闭锁，确需解锁须经批准并采取防误措施。`}},{msg:`第 9 步：检修完毕，关闭柜门；将三相接地开关断开`,mode:`check`,async act(){let e=this.sys.comps.qf1;e&&(e.isDoorOpen()&&e.toggleDoor(),await Q(600),e._emLockUnlocked=!0,e._crankInserted=!0,e._crankTurnCount=0,e._crankRotation=0,e._updateGroundSwitchState(),await Q(600))},check(){let e=this.sys.comps.qf1;return!!(e&&!e.isDoorOpen()&&!e.isGrounded())}},{msg:`第 10 步：将断路器由"试验位"摇回"连接位"，重新起动 1# 机，合闸恢复供电`,mode:`check`,async act(){let e=this.sys,t=e.comps.qf1,n=e.comps.gen_hv;if(t){for(let e=0;e<3;e++)t._dialTurn(-1);await Q(500),t._workPos===0&&t._syncMainCircuits(),n&&(n.isOn=!0,n.freq=50,n._rmsV=3810),await Q(1500),t&&(t._chargeProg=5,t._charged=!0,t.tryClose()),await Q(1800)}},check(){let e=this.sys,t=e.comps.gen_hv,n=e.comps.qf1;return!!(n&&n.getWorkPos()===0&&n.isClosed()&&t&&t.isOn)}},{msg:`第 11 步：测试题——断路器合闸状态下接地开关被闭锁`,mode:`quiz`,quizConfig:{question:`真空断路器处于合闸（带电运行）状态时，接地开关被闭锁、无法合上，这属于电气"五防"中的（　）。`,options:[`防止带接地线合闸`,`防止带电合接地开关（防止带电挂接地线）`,`防止误分、误合断路器`,`防止带负荷拉合隔离开关`],answer:1,analysis:`断路器合闸即负荷侧带电，此时接地开关（电磁锁/机械联锁）被可靠闭锁，摇柄无法插入、接地开关无法合上——防止带电挂接地线（合接地开关）导致人身与设备事故，这就是"五防"第三防的另一面：防止带电合接地开关。与本流程步骤 6 的"防带接地线合闸"构成接地开关与断路器的双向互锁。`}}]},"hv-prot-intro":{id:`hv-prot-intro`,name:`5.微机综合保护装置说明`,steps:[{msg:`第 1 步：在画面上找到并点击 1# 高压发电机的微机综合保护装置。`,mode:`find`,target:`prot1`},{msg:`第 2 步：填空题——微机保护装置采集输入信号所用的互感器`,mode:`fill`,target:`prot1`,fields:[{label:`电流`,answer:[`电流互感器`,`ct`],placeholder:`如：电流互感器 或 CT`},{label:`电压`,answer:[`电压互感器`,`pt`],placeholder:`如：电压互感器 或 PT`}]},{msg:`第 3 步：测试题——数字式综合保护装置的信号传递关系`,mode:`quiz`,quizConfig:{question:`在数字式综合保护装置（微机保护装置）中，正确的信号传递关系是（　）。`,options:[`跳闸回路 → 微机保护装置 → CT/PT → VCB`,`CT/PT → 微机保护装置 → 跳闸回路 → VCB`,`VCB → 跳闸回路 → 微机保护装置 → CT/PT`,`微机保护装置 → CT/PT → VCB → 跳闸回路`],answer:1,analysis:`电流、电压信号先经 CT（电流互感器）降压降流、PT（电压互感器）降压隔离采样，送入微机保护装置进行运算判断；故障时装置出口接通跳闸回路，驱动真空断路器（VCB）分闸切除故障。即：CT/PT → 微机保护装置 → 跳闸回路 → VCB。本装置 F1 页即显示差动/短路/过载等保护跳闸出口状态。`}},{msg:`第 4 步：测试题——相对于低压发电机，高压发电机特有的保护有`,mode:`quiz`,quizConfig:{question:`与低压船舶发电机相比，下列属于高压发电机（如 6.6kV）特有的保护是（　）。`,options:[`失压保护`,`纵联差动保护`,`逆功率保护`,`过载保护`],answer:1,analysis:`低压发电机依靠失压、过载、短路（过电流）、逆功率等保护即可满足运行要求；高压发电机额定电流小、绕组相间/匝间短路危害大，必须增设纵联差动保护（定子绕组相间短路主保护）以及定子单相接地（100% 定子接地）保护等高压发电机组特有的保护。`}},{msg:`第 5 步：测试题——高压发电机内部绕组相间短路由何种保护跳闸`,mode:`quiz`,quizConfig:{question:`某高压发电机内部绕组发生相间短路时，依靠（　）实现快速可靠跳闸？`,options:[`逆功率保护`,`过载保护（长延时）`,`差动保护`,`绝缘监测（接地显示）`],answer:2,analysis:`绕组内部相间短路主要由纵联差动保护承担：比较机端与中性点两侧 CT 电流，内部短路时两侧电流失衡、差流大增（本工程实测 A/B 相入口 745.8A、出口≈0、差流 671A，远超 0.09In 差动定值），保护瞬时出口跳闸切除故障。这正是操作流程 1「高压发电机差动电流超过阈值」所演示的内容。`}}]}},Jo=[{Class:lo,id:`qf1`,x:-100,y:160,ratedCtrlVoltage:24,label:`10kV真空断路器`,genId:``,revPowerKw:300,revTime:5,faultSimpleProtect:!0,visible:!0},{Class:ao,id:`bus1`,x:-100,y:10,portsPerBar:6,label:`汇流排`,visible:!0},{Class:so,id:`gen_hv`,x:-100,y:680,freq:50,vRms:3810,ratedPower:2e3,ratedVoltage:6600,ratedCosPhi:.8,isOn:!1,mode:`remote`,label:`船舶高压发电机`,visible:!0},{Class:Ua,id:`dc24`,x:280,y:0,voltage:24,isOn:!0,label:`24V控制电源`,visible:!0},{Class:$a,id:`gnd_dc`,x:520,y:270,label:`电源负极接地`,visible:!0},{Class:$a,id:`gnd_coil`,x:400,y:280,label:`线圈负端接地`,visible:!0},{Class:$a,id:`gnd_coil2`,x:450,y:990,label:`发电机中性点接地`,visible:!0},{Class:$a,id:`gnd_hv`,x:750,y:620,label:`高压负端接地`,visible:!0},{Class:$a,id:`gnd_prot`,x:1e3,y:880,label:`保护负端接地`,visible:!0},{Class:uo,id:`hvgp`,x:420,y:320,genId:`gen_hv`,qfId:`qf1`,protId:`prot1`,busId:`bus1`,label:`高压发电机遥控面板`,visible:!0},{Class:fo,id:`prot1`,x:500,y:660,genId:`gen_hv`,qfId:`qf1`,In:218.7,label:`微机综合保护装置`,visible:!0},{Class:Wa,id:`rn`,x:310,y:980,value:500,direction:`vertical`,label:`中性点接地电阻`,rotation:-90,visible:!0},{Class:vo,id:`hvload`,x:1560,y:150,powerKw:500,cosPhi:.8,reactive:`ind`,loaded:!1,label:`高压三相可调负载`,visible:!0},{Class:ko,id:`one_line`,x:2200,y:40,label:`电力系统单线图`,visible:!1},{Class:wo,id:`tf1`,x:1050,y:420,vPrimary:6600,vSecondary:440,label:`高压三相变压器`,protBk:`vcbs3`,hTripTemp:130,hTripDelay:3,visible:!0},{Class:wo,id:`tf2`,x:1400,y:420,vPrimary:6600,vSecondary:440,label:`高压三相变压器2`,protBk:`vcbs4`,hTripTemp:130,hTripDelay:3,visible:!0},{Class:bo,id:`vcbs3`,x:1030,y:160,initState:`off`,initIso:`on`,label:`断路器3`,visible:!0},{Class:bo,id:`vcbs4`,x:1400,y:160,initState:`off`,initIso:`on`,label:`断路器4`,visible:!0},{Class <body>

    <!-- 顶部工具栏 -->
    <div id="toolbar">
        <button id="btnUndo" title="撤销上一步">撤销</button>
        <button id="btnRedo" title="恢复上一步">恢复</button>
        <button id="btnAutoWire" title="自动完成所有接线">自动接线</button>
        <button id="btnStartSys" title="起动系统">起动系统</button>
        <button id="btnFiveStep" title="5点观察输入输出">5点步进</button>        
        <button id="faultBtn" title="选择故障进行设置">故障设置</button>
        <button id="btnReset" title="重置系统">重置系统</button>

        <select id="taskSelect">
        </select>

        <button id="btnShow">自动演示</button>
        <button id="btnStep">单步演示</button>
        <button id="btnTrain">演练</button>
        <button id="btnEval">评估</button>
        <button id="btnInstrument">选择仪表</button>
        <span style="width:1px;height:24px;background:#555;margin:0 8px;display:inline-block;"></span>

        <button id="btnGateway" title="硬件网关配置">硬件网关</button>
        <span style="width:1px;height:24px;background:#555;margin:0 8px;display:inline-block;"></span>
        <label id="oneLineLabel" title="显示/隐藏电力系统单线图" style="cursor:pointer;user-select:none;">
            <input type="checkbox" id="btnOneLine" style="width:14px;height:14px;vertical-align:middle;cursor:pointer;" />
            <span style="vertical-align:middle;">单线图</span>
        </label>
        <label id="switchPanelLabel" title="显示/隐藏高压配电柜组件图" style="cursor:pointer;user-select:none;">
            <input type="checkbox" id="btnSwitchPanel" style="width:14px;height:14px;vertical-align:middle;cursor:pointer;" />
            <span style="vertical-align:middle;">高压配电柜</span>
        </label>
    </div>

    <!-- 故障设置弹窗 -->
    <div id="faultModal">
        <div class="modal-content">

            <div class="modal-header">
                故障场景配置
            </div>

            <div id="faultForm" class="modal-body">

            </div>

            <div class="modal-footer">
                <button id="cancelBtn" class="btn-cancel">取消</button>
                <button id="applyBtn" class="btn-apply">应用设置</button>
            </div>

        </div>
    </div>

    <!-- 仪表选择菜单 -->
    <div id="instrumentModal">
        <div class="modal-content">

            <div class="modal-header">
                选择要显示的仪表
            </div>

            <div id="instrumentForm" class="modal-body">

            </div>

            <div class="modal-footer">
                <button id="instrumentCancelBtn" class="btn-cancel">关闭</button>
            </div>

        </div>
    </div>

    <!-- 硬件网关面板 -->
    <div id="gatewayPanel" class="side-panel" style="display:none;">
        <div class="side-panel-header">
            <span>硬件网关配置</span>
            <div class="side-panel-actions">
                <button id="gatewayPanelClose" class="btn-close" title="关闭">&times;</button>
            </div>
        </div>
        <div class="side-panel-body" id="gatewayPanelBody">
            <!-- 由 GatewayPanel.createPanel() 填充 -->
        </div>
    </div>

    <!-- Konva容器 -->
    <div id="container"></div>
    <!-- 主程序 -->



    <script src="../ads.js"></script>
    <!-- 广告位 -->
    <div data-ad-banner data-ad-format="auto" style="display:none;width:100%;flex-shrink:0;min-height:60px;"></div>
</body>
</html>
