<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Microsoft YaHei, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2d3d">图 2　三通电动调节阀结构与信号接口</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="a2b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2c5d94"/>
    </marker>
  </defs>

  <!-- 阀腔（三段弧示意） -->
  <g transform="translate(230,250)">
    <circle r="130" fill="none" stroke="#2c3e50" stroke-width="26" stroke-dasharray="330 420" transform="rotate(-90)"/>
    <circle r="130" fill="none" stroke="#f1c7c7" stroke-width="30" stroke-dasharray="80 735" transform="rotate(-150)"/>
    <circle r="130" fill="none" stroke="#f1c7c7" stroke-width="30" stroke-dasharray="80 735" transform="rotate(-70)"/>
    <circle r="130" fill="none" stroke="#f1c7c7" stroke-width="30" stroke-dasharray="80 735" transform="rotate(30)"/>

    <!-- 阀板 -->
    <path d="M0,0 L0,-105 A105,105 0 0 1 91,-52 Z" fill="#11ed65" stroke="#d35400" stroke-width="2"/>
    <circle r="16" fill="#7f8c8d" stroke="#000"/>
    <!-- 手轮 -->
    <circle r="46" fill="none" stroke="#95a5a6" stroke-width="8"/>
    <line x1="-34" y1="-34" x2="34" y2="34" stroke="#7f8c8d" stroke-width="5"/>
    <line x1="34" y1="-34" x2="-34" y2="34" stroke="#7f8c8d" stroke-width="5"/>
    <circle cx="34" cy="0" r="6" fill="#e74c3c"/>
  </g>

  <!-- 端口标注 -->
  <text x="235" y="88" text-anchor="middle" font-size="14" fill="#b9770e">上口 r</text>
  <text x="70" y="256" text-anchor="middle" font-size="14" fill="#b9770e">左口 u</text>
  <text x="235" y="430" text-anchor="middle" font-size="14" fill="#b9770e">下口 l</text>
  <text x="120" y="210" font-size="12" fill="#666">旁通支路</text>
  <text x="120" y="310" font-size="12" fill="#666">冷却支路</text>
  <text x="235" y="265" text-anchor="middle" font-size="12" fill="#1e8449">阀板</text>

  <!-- 电机 -->
  <rect x="420" y="190" width="120" height="120" rx="10" fill="#34495e" stroke="#000" stroke-width="2"/>
  <circle cx="480" cy="250" r="40" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2"/>
  <text x="480" y="262" text-anchor="middle" font-size="30" font-weight="bold" fill="#2c3e50">M</text>
  <text x="480" y="180" text-anchor="middle" font-size="14" fill="#1f2d3d">电动执行机构</text>

  <!-- 电气接口 l / r -->
  <line x1="540" y1="220" x2="640" y2="220" stroke="#c0392b" stroke-width="4" marker-end="url(#a2)"/>
  <line x1="540" y1="280" x2="640" y2="280" stroke="#2c5d94" stroke-width="4" marker-end="url(#a2b)"/>
  <text x="660" y="224" font-size="14" fill="#c0392b">端子 l（+）</text>
  <text x="660" y="284" font-size="14" fill="#2c5d94">端子 r（−）</text>
  <text x="640" y="150" font-size="13" fill="#333">4~20mA 输入信号</text>
  <text x="640" y="168" font-size="12" fill="#888">内部采样电阻 250Ω</text>

  <!-- 显示屏 -->
  <rect x="430" y="330" width="100" height="42" rx="4" fill="#1a1a1a" stroke="#7f8c8d"/>
  <text x="480" y="359" text-anchor="middle" font-size="18" font-family="monospace" fill="#00ff00">65%</text>
  <text x="480" y="395" text-anchor="middle" font-size="12" fill="#555">开度 LCD</text>

  <!-- 模式开关 -->
  <rect x="610" y="330" width="120" height="46" rx="23" fill="#2c3e50"/>
  <circle cx="660" cy="353" r="16" fill="#f1c40f"/>
  <text x="670" y="410" text-anchor="middle" font-size="13" fill="#555">遥控/本地 切换开关</text>
  <text x="670" y="428" text-anchor="middle" font-size="12" fill="#2c3e50">左=MANUAL 本地　右=REMOTE 遥控</text>

  <!-- 底部说明 -->
  <rect x="30" y="450" width="840" height="55" rx="10" fill="#fffbe6" stroke="#e8c547"/>
  <text x="450" y="474" text-anchor="middle" font-size="13" fill="#6b5300">遥控(REMOTE)时：开度 = (I − 4mA) / 16mA × 100%，由 PID 输出电流决定；</text>
  <text x="450" y="494" text-anchor="middle" font-size="13" fill="#6b5300">本地(MANUAL)时：开度由转动手轮设定，与输入电流无关。</text>
</svg>
