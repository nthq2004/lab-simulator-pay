<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="780" height="400" fill="#ffffff"/>
  <text x="390" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a252f">图 2　并联运行条件及不满足时的后果</text>

  <!-- 表头 -->
  <rect x="60" y="55" width="200" height="42" fill="#1565c0"/>
  <text x="160" y="82" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">条　件</text>
  <rect x="260" y="55" width="460" height="42" fill="#0d47a1"/>
  <text x="490" y="82" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">不满足时的后果</text>

  <!-- 行 1 电压 -->
  <rect x="60" y="97" width="200" height="56" fill="#eaf4ff" stroke="#90b8e0"/>
  <text x="160" y="131" text-anchor="middle" font-size="14" fill="#0d47a1" font-weight="bold">电压相等</text>
  <rect x="260" y="97" width="460" height="56" fill="#fbfdff" stroke="#90b8e0"/>
  <text x="274" y="131" font-size="13" fill="#333">电压不等 → 合闸瞬间产生无功环流，机组间无功分配不均</text>

  <!-- 行 2 频率 -->
  <rect x="60" y="153" width="200" height="56" fill="#eaf4ff" stroke="#90b8e0"/>
  <text x="160" y="187" text-anchor="middle" font-size="14" fill="#0d47a1" font-weight="bold">频率相等</text>
  <rect x="260" y="153" width="460" height="56" fill="#fbfdff" stroke="#90b8e0"/>
  <text x="274" y="187" font-size="13" fill="#333">频率不等 → 产生有功振荡（功率拍频），同步表指针持续旋转</text>

  <!-- 行 3 相位 -->
  <rect x="60" y="209" width="200" height="56" fill="#eaf4ff" stroke="#90b8e0"/>
  <text x="160" y="243" text-anchor="middle" font-size="14" fill="#0d47a1" font-weight="bold">相位一致</text>
  <rect x="260" y="209" width="460" height="56" fill="#fbfdff" stroke="#90b8e0"/>
  <text x="274" y="243" font-size="13" fill="#333">相位不一致 → 电压差最大可达 2U，冲击电流极大、转矩冲击，跳闸</text>

  <!-- 行 4 相序 -->
  <rect x="60" y="265" width="200" height="56" fill="#eaf4ff" stroke="#90b8e0"/>
  <text x="160" y="299" text-anchor="middle" font-size="14" fill="#0d47a1" font-weight="bold">相序一致</text>
  <rect x="260" y="265" width="460" height="56" fill="#fbfdff" stroke="#90b8e0"/>
  <text x="274" y="299" font-size="13" fill="#333">相序不一致 → 永远无法同期，合闸即造成严重短路冲击</text>

  <rect x="60" y="336" width="660" height="46" rx="8" fill="#e8f7e8" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="390" y="355" text-anchor="middle" font-size="13" fill="#1b5e20">工程允许偏差：电压差 ≤ 5%、频差 ≤ 0.5Hz、相位差尽量接近 0°（合闸在 12 点附近）。</text>
  <text x="390" y="374" text-anchor="middle" font-size="12" fill="#1b5e20">其中相位（同期）条件最关键，直接决定合闸冲击的大小。</text>
</svg>
