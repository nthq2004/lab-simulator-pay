  <polyline points="850,346 850,360" fill="none" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <polygon points="850,360 854,352 846,352" fill="#1565c0"/>
  <polyline points="716,364 674,380" fill="none" stroke="#6d4c41" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
