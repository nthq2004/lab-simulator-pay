  <text x="794" y="428" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="bold" fill="#6d4c41" text-anchor="middle">底盘复位 → 排渣口打开，瞬时排渣</text>
  <rect x="24" y="452" width="912" height="88" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="44" y="474" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="start">① SV16（密封及补偿水阀）通电 → 密封水进入底盘下部外缘，约 5 s 聚满，底盘两端翘起压紧密封面，排渣口关闭；</text>
  <text x="44" y="496" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="start">② SV15（开启水阀）通电 → 开启水进入底盘上部中央，约 3 s 泄掉外缘密封水，底盘复位、排渣口打开，污渣甩入排渣柜；</text>
  <text x="44" y="522" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="start">③ SV15 断电 → 上部开启水约 5 s 泄完，为下一次密封做准备；分油期间 SV16 还会按间隔脉冲补入补偿水，维持密封。</text>
