  <text x="794" y="122" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="bold" fill="#263238" text-anchor="middle">(c) SV15 通电：开启水泄掉密封水</text>
  <polyline points="718,154 718,352" fill="none" stroke="#455a64" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
