  <text x="480" y="298" font-family="Microsoft YaHei, Arial" font-size="10.5" font-weight="bold" fill="#1565c0" text-anchor="middle">密封水进入外缘（约 5 s）</text>
  <text x="480" y="428" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="bold" fill="#2e7d32" text-anchor="middle">底盘翘起压紧 → 排渣口关闭</text>
