  <text x="794" y="142" font-family="Microsoft YaHei, Arial" font-size="10.5" font-weight="bold" fill="#1565c0" text-anchor="middle">开启水进上部中央（约 3 s）</text>
  <text x="742" y="292" font-family="Microsoft YaHei, Arial" font-size="10.5" font-weight="bold" fill="#1565c0" text-anchor="start">开启水</text>
  <polyline points="738,346 738,360" fill="none" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
