<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <defs>
    <marker id="aW" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/></marker>
    <marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a085"/></marker>
  </defs>
  <rect width="980" height="600" fill="#fbfcfe"/>

  <!-- ===== 气路 ===== -->
  <g stroke="#16a085" stroke-width="3" fill="none" marker-end="url(#aP)">
    <line x1="805" y1="100" x2="775" y2="100"/>
    <line x1="650" y1="100" x2="615" y2="100"/>
    <line x1="460" y1="100" x2="425" y2="100"/>
    <path d="M360,58 L360,45 L285,45"/>
    <path d="M320,180 L320,260 L245,260"/>
  </g>
  <g fill="#e8f6f3" stroke="#16a085" stroke-width="2">
    <rect x="810" y="62" width="120" height="76" rx="9"/>
    <rect x="655" y="68" width="120" height="64" rx="9"/>
    <rect x="460" y="68" width="140" height="64" rx="9"/>
    <rect x="300" y="50" width="120" height="120" rx="9"/>
    <rect x="140" y="20" width="150" height="52" rx="9"/>
    <rect x="60" y="185" width="185" height="150" rx="9"/>
  </g>
  <g font-size="15" fill="#0b5345" text-anchor="middle">
    <text x="870" y="96">气瓶</text><text x="870" y="116" font-size="12" fill="#7f8c8d">cab</text>
    <text x="715" y="96">截止阀</text><text x="715" y="116" font-size="12" fill="#7f8c8d">stopv</text>
    <text x="530" y="96">调节阀</text><text x="530" y="116" font-size="12" fill="#7f8c8d">preg</text>
    <text x="360" y="108">三通</text><text x="360" y="128" font-size="12" fill="#7f8c8d">tconn</text>
    <text x="215" y="44">压力表</text><text x="215" y="61" font-size="11" fill="#7f8c8d">pmeter</text>
    <text x="152" y="248">压力变送器</text><text x="152" y="270" font-size="12" fill="#16a085">气压口 i</text>
  </g>

  <!-- ===== 电气回路 ===== -->
  <g stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#aW)">
    <line x1="210" y1="490" x2="275" y2="490"/>
    <path d="M415,470 L415,300 L250,300"/>
    <path d="M250,350 L250,430 L515,430 L515,468"/>
    <path d="M650,490 L730,490 L730,540 L135,540 L135,505"/>
  </g>
  <g fill="#fdedec" stroke="#c0392b" stroke-width="2">
    <rect x="60" y="450" width="150" height="80" rx="9"/>
    <rect x="280" y="460" width="135" height="60" rx="9"/>
    <rect x="515" y="460" width="135" height="60" rx="9"/>
  </g>
  <g font-size="15" fill="#7b241c" text-anchor="middle">
    <text x="135" y="486">DC 24V 电源</text><text x="135" y="508" font-size="12" fill="#c0392b">p(+) / n(−)</text>
    <text x="347" y="486">可变电阻</text><text x="347" y="506" font-size="12" fill="#c0392b">l / r</text>
    <text x="582" y="486">电流表</text><text x="582" y="506" font-size="12" fill="#c0392b">p / n</text>
  </g>
  <text x="245" y="276" font-size="12" fill="#c0392b" text-anchor="end">P(+)</text>
  <text x="245" y="326" font-size="12" fill="#c0392b" text-anchor="end">N(−)</text>
  <line x1="152" y1="185" x2="152" y2="300" stroke="#8e44ad" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="80" y="360" font-size="12" fill="#8e44ad">同一台</text>
  <text x="80" y="376" font-size="12" fill="#8e44ad">变送器</text>

  <!-- 编号 -->
  <g font-size="15" font-weight="bold">
    <circle cx="905" cy="130" r="13" fill="#16a085"/><text x="905" y="135" fill="#fff" text-anchor="middle">5</text>
    <circle cx="632" cy="130" r="13" fill="#16a085"/><text x="632" y="135" fill="#fff" text-anchor="middle">6</text>
    <circle cx="442" cy="130" r="13" fill="#16a085"/><text x="442" y="135" fill="#fff" text-anchor="middle">7</text>
    <circle cx="278" cy="45" r="13" fill="#16a085"/><text x="278" y="50" fill="#fff" text-anchor="middle">8</text>
    <circle cx="282" cy="260" r="13" fill="#16a085"/><text x="282" y="265" fill="#fff" text-anchor="middle">9</text>
    <circle cx="243" cy="490" r="13" fill="#c0392b"/><text x="243" y="495" fill="#fff" text-anchor="middle">1</text>
    <circle cx="380" cy="400" r="13" fill="#c0392b"/><text x="380" y="405" fill="#fff" text-anchor="middle">2</text>
    <circle cx="380" cy="440" r="13" fill="#c0392b"/><text x="380" y="445" fill="#fff" text-anchor="middle">3</text>
    <circle cx="690" cy="515" r="13" fill="#c0392b"/><text x="690" y="520" fill="#fff" text-anchor="middle">4</text>
  </g>

  <text x="24" y="566" font-size="14" fill="#555">①24V+→可变电阻左端　②可变电阻右端→变送器 P(+)　③变送器 N(−)→电流表 P(+)　④电流表 N(−)→24V−</text>
  <text x="24" y="586" font-size="14" fill="#555">⑤气瓶出口→截止阀右端　⑥截止阀左端→调节阀入口　⑦调节阀出口→三通右端　⑧三通上端→压力表　⑨三通左端→变送器气压口</text>
</svg>
