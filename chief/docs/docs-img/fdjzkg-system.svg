<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2471a3"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#148f77"/></marker>
  </defs>
  <rect width="1000" height="600" fill="#fbfcfe"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#1a3a5c">图 1　船舶电站组成与主回路（发电机—主开关—汇流排）</text>

  <!-- 汇流排 -->
  <line x1="500" y1="70" x2="500" y2="470" stroke="#34495e" stroke-width="10" stroke-linecap="round"/>
  <text x="516" y="90" font-size="15" font-weight="bold" fill="#34495e">汇流排 BUS</text>

  <!-- 1# 机组 -->
  <rect x="40" y="120" width="150" height="72" rx="10" fill="#eaf2fb" stroke="#2471a3" stroke-width="2"/>
  <text x="115" y="150" font-size="15" font-weight="bold" fill="#1a3a5c" text-anchor="middle">1# 同步发电机</text>
  <text x="115" y="174" font-size="12" fill="#1a3a5c" text-anchor="middle">400V / 80kW / 50Hz</text>
  <line x1="190" y1="156" x2="238" y2="156" stroke="#2471a3" stroke-width="2" marker-end="url(#a)"/>

  <rect x="240" y="120" width="110" height="72" rx="10" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="295" y="150" font-size="15" font-weight="bold" fill="#922b21" text-anchor="middle">主开关 QF1</text>
  <text x="295" y="174" font-size="12" fill="#922b21" text-anchor="middle">船用 ACB</text>
  <line x1="350" y1="156" x2="496" y2="156" stroke="#2471a3" stroke-width="2" marker-end="url(#a)"/>

  <!-- 2# 机组 -->
  <rect x="810" y="120" width="150" height="72" rx="10" fill="#eaf2fb" stroke="#2471a3" stroke-width="2"/>
  <text x="885" y="150" font-size="15" font-weight="bold" fill="#1a3a5c" text-anchor="middle">2# 同步发电机</text>
  <text x="885" y="174" font-size="12" fill="#1a3a5c" text-anchor="middle">400V / 80kW / 50Hz</text>
  <line x1="810" y1="156" x2="762" y2="156" stroke="#2471a3" stroke-width="2" marker-end="url(#a)"/>

  <rect x="650" y="120" width="110" height="72" rx="10" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="705" y="150" font-size="15" font-weight="bold" fill="#922b21" text-anchor="middle">主开关 QF2</text>
  <text x="705" y="174" font-size="12" fill="#922b21" text-anchor="middle">船用 ACB</text>
  <line x1="650" y1="156" x2="504" y2="156" stroke="#2471a3" stroke-width="2" marker-end="url(#a)"/>

  <!-- 馈出支路 -->
  <line x1="500" y1="330" x2="596" y2="330" stroke="#2471a3" stroke-width="2" marker-end="url(#a)"/>
  <rect x="598" y="294" width="90" height="72" rx="10" fill="#fef9e7" stroke="#b7950b" stroke-width="2"/>
  <text x="643" y="326" font-size="15" font-weight="bold" fill="#7d6608" text-anchor="middle">QF3</text>
  <text x="643" y="350" font-size="12" fill="#7d6608" text-anchor="middle">三相空开</text>
  <line x1="688" y1="330" x2="758" y2="330" stroke="#2471a3" stroke-width="2" marker-end="url(#a)"/>
  <rect x="760" y="290" width="190" height="80" rx="10" fill="#f4ecf7" stroke="#7d3c98" stroke-width="2"/>
  <text x="855" y="323" font-size="15" font-weight="bold" fill="#5b2c6f" text-anchor="middle">照明负载</text>
  <text x="855" y="347" font-size="12" fill="#5b2c6f" text-anchor="middle">3 × 白炽灯</text>

  <!-- 控制部分 -->
  <rect x="40" y="470" width="176" height="74" rx="10" fill="#e8f6f3" stroke="#148f77" stroke-width="2"/>
  <text x="128" y="501" font-size="15" font-weight="bold" fill="#0e6251" text-anchor="middle">控制电源 DC24V</text>
  <text x="128" y="525" font-size="12" fill="#0e6251" text-anchor="middle">为失压/储能/线圈供电</text>

  <rect x="300" y="470" width="230" height="74" rx="10" fill="#e8f6f3" stroke="#148f77" stroke-width="2"/>
  <text x="415" y="501" font-size="15" font-weight="bold" fill="#0e6251" text-anchor="middle">1# 发电机组遥控面板</text>
  <text x="415" y="525" font-size="12" fill="#0e6251" text-anchor="middle">起动/停止·合闸/分闸·调速</text>

  <line x1="216" y1="507" x2="296" y2="507" stroke="#148f77" stroke-width="2" marker-end="url(#g)"/>
  <line x1="415" y1="470" x2="415" y2="192" stroke="#148f77" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="415" y1="192" x2="299" y2="192" stroke="#148f77" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="422" y="300" font-size="12" fill="#0e6251">合闸/分闸指令</text>

  <!-- 并车 -->
  <rect x="620" y="470" width="330" height="74" rx="10" fill="#fef5e7" stroke="#ca6f1e" stroke-width="2"/>
  <text x="785" y="501" font-size="15" font-weight="bold" fill="#9c640c" text-anchor="middle">数字同步表 + 待并机选择开关</text>
  <text x="785" y="525" font-size="12" fill="#9c640c" text-anchor="middle">并车：相位差/频差合格后合闸</text>
</svg>
