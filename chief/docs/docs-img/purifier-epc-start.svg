<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700">
  <rect width="960" height="700" fill="#f7f9f8"/>
  <text x="480" y="32" font-family="Microsoft YaHei, Arial" font-size="19" font-weight="bold" fill="#263238" text-anchor="middle">通过 EPC-60 起动分油机的完整步骤</text>
  <rect x="30" y="58" width="330" height="500" rx="12" fill="#a9cadb" stroke="#5f8fa6" stroke-width="2"/>
  <rect x="42" y="70" width="306" height="336" rx="8" fill="#9a9a9a" stroke="#7f7f7f" stroke-width="1.5"/>
  <text x="195" y="92" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">EPC 60</text>
  <rect x="56" y="104" width="182" height="74" rx="3" fill="#3f3f3f" stroke="#222222" stroke-width="1.5"/>
  <rect x="61" y="109" width="172" height="64" rx="2" fill="#b7d96a" stroke="#0b0d0c" stroke-width="1"/>
  <text x="68" y="127" font-family="Microsoft YaHei, Arial" font-size="10" font-weight="normal" fill="#1b2a0a" text-anchor="start">START PROGRAM</text>
  <text x="68" y="145" font-family="Microsoft YaHei, Arial" font-size="10" font-weight="normal" fill="#1b2a0a" text-anchor="start">      YES   NO</text>
  <text x="68" y="163" font-family="Microsoft YaHei, Arial" font-size="10" font-weight="normal" fill="#1b2a0a" text-anchor="start">Ti55  Standby</text>
  <rect x="108" y="200" width="30" height="30" rx="4" fill="#efefef" stroke="#7c7c7c" stroke-width="1"/>
  <rect x="142" y="200" width="30" height="30" rx="4" fill="#efefef" stroke="#7c7c7c" stroke-width="1"/>
  <rect x="176" y="200" width="30" height="30" rx="4" fill="#efefef" stroke="#7c7c7c" stroke-width="1"/>
  <rect x="210" y="200" width="30" height="30" rx="4" fill="#efefef" stroke="#7c7c7c" stroke-width="1"/>
  <rect x="108" y="238" width="30" height="30" rx="4" fill="#efefef" stroke="#7c7c7c" stroke-width="1"/>
  <rect x="142" y="238" width="30" height="30" rx="4" fill="#efefef" stroke="#7c7c7c" stroke-width="1"/>
  <rect x="176" y="238" width="30" height="30" rx="4" fill="#efefef" stroke="#7c7c7c" stroke-width="1"/>
  <text x="174" y="194" font-family="Microsoft YaHei, Arial" font-size="9" font-weight="normal" fill="#263238" text-anchor="middle">功能键：排渣 / 报警复位 / CIP</text>
  <rect x="56" y="200" width="34" height="34" rx="5" fill="#2f6b2f" stroke="#16340f" stroke-width="1.5"/>
  <text x="73" y="224" font-family="Microsoft YaHei, Arial" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">I</text>
  <rect x="56" y="240" width="34" height="34" rx="5" fill="#7f1d1d" stroke="#3a0b0b" stroke-width="1.5"/>
  <text x="73" y="264" font-family="Microsoft YaHei, Arial" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">O</text>
  <text x="73" y="194" font-family="Microsoft YaHei, Arial" font-size="9" font-weight="normal" fill="#263238" text-anchor="middle">起动/停止</text>
  <rect x="250" y="104" width="26" height="26" rx="3" fill="#f5f5f5" stroke="#555555" stroke-width="1"/>
  <rect x="282" y="104" width="26" height="26" rx="3" fill="#f5f5f5" stroke="#555555" stroke-width="1"/>
  <rect x="314" y="104" width="26" height="26" rx="3" fill="#f5f5f5" stroke="#555555" stroke-width="1"/>
  <rect x="250" y="136" width="26" height="26" rx="3" fill="#f5f5f5" stroke="#555555" stroke-width="1"/>
  <rect x="282" y="136" width="26" height="26" rx="3" fill="#f5f5f5" stroke="#555555" stroke-width="1"/>
  <rect x="314" y="136" width="26" height="26" rx="3" fill="#f5f5f5" stroke="#555555" stroke-width="1"/>
  <rect x="250" y="168" width="26" height="26" rx="3" fill="#f5f5f5" stroke="#555555" stroke-width="1"/>
  <rect x="282" y="168" width="26" height="26" rx="3" fill="#f5f5f5" stroke="#555555" stroke-width="1"/>
  <rect x="314" y="168" width="26" height="26" rx="3" fill="#f5f5f5" stroke="#555555" stroke-width="1"/>
  <rect x="250" y="200" width="26" height="26" rx="3" fill="#f5f5f5" stroke="#555555" stroke-width="1"/>
  <text x="263" y="219" font-family="Microsoft YaHei, Arial" font-size="10" font-weight="bold" fill="#1b1b1b" text-anchor="middle">ENT</text>
  <rect x="262" y="248" width="30" height="30" rx="4" fill="#efefef" stroke="#7c7c7c" stroke-width="1"/>
  <text x="277" y="267" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="bold" fill="#1b1b1b" text-anchor="middle">←</text>
  <rect x="296" y="214" width="30" height="30" rx="4" fill="#efefef" stroke="#7c7c7c" stroke-width="1"/>
  <text x="311" y="233" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="bold" fill="#1b1b1b" text-anchor="middle">↑</text>
  <rect x="296" y="248" width="30" height="30" rx="4" fill="#efefef" stroke="#7c7c7c" stroke-width="1"/>
  <text x="311" y="267" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="bold" fill="#1b1b1b" text-anchor="middle">↓</text>
  <text x="294" y="298" font-family="Microsoft YaHei, Arial" font-size="9" font-weight="normal" fill="#263238" text-anchor="middle">导航键</text>
  <circle cx="92" cy="458" r="26" fill="#ffffff" stroke="#9aa0a0" stroke-width="1.5"/>
  <circle cx="92" cy="458" r="19" fill="#141414" stroke="#000000" stroke-width="1"/>
  <text x="92" y="500" font-family="Microsoft YaHei, Arial" font-size="10" font-weight="bold" fill="#263238" text-anchor="middle">电源开关</text>
  <circle cx="194" cy="458" r="26" fill="#c62828" stroke="#5c0d0d" stroke-width="2"/>
  <text x="194" y="500" font-family="Microsoft YaHei, Arial" font-size="10" font-weight="bold" fill="#263238" text-anchor="middle">应急停止</text>
  <rect x="242" y="430" width="96" height="58" rx="4" fill="#3a3a3a" stroke="#222222" stroke-width="1.5"/>
  <circle cx="290" cy="459" r="22" fill="#ffffff" stroke="#54606a" stroke-width="1.2"/>
  <text x="290" y="500" font-family="Microsoft YaHei, Arial" font-size="10" font-weight="bold" fill="#263238" text-anchor="middle">电流表</text>
  <rect x="400" y="62" width="520" height="68" rx="8" fill="#ffffff" stroke="#546e7a" stroke-width="1.6"/>
  <circle cx="432" cy="96" r="19" fill="#546e7a" stroke="#546e7a" stroke-width="1"/>
  <text x="432" y="102" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="462" y="90" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="bold" fill="#546e7a" text-anchor="start">准备</text>
  <text x="462" y="112" font-family="Microsoft YaHei, Arial" font-size="11.5" font-weight="normal" fill="#263238" text-anchor="start">合上机旁主电源（EPC 同步得电）→ 控制方式打到 EPC</text>
  <polyline points="432,116 432,144" fill="none" stroke="#546e7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="432,144 436.5,135 427.5,135" fill="#546e7a"/>
  <rect x="400" y="146" width="520" height="68" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="1.6"/>
  <circle cx="432" cy="180" r="19" fill="#1565c0" stroke="#1565c0" stroke-width="1"/>
  <text x="432" y="186" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="462" y="174" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="bold" fill="#1565c0" text-anchor="start">按 I</text>
  <text x="462" y="196" font-family="Microsoft YaHei, Arial" font-size="11.5" font-weight="normal" fill="#263238" text-anchor="start">屏 1 出现「START PROGRAM? YES/NO」，↑/↓ 选择，ENT 确认</text>
  <polyline points="432,200 432,228" fill="none" stroke="#1565c0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="432,228 436.5,219 427.5,219" fill="#1565c0"/>
  <rect x="400" y="230" width="520" height="68" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/>
  <circle cx="432" cy="264" r="19" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/>
  <text x="432" y="270" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="462" y="258" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="start">按 I</text>
  <text x="462" y="280" font-family="Microsoft YaHei, Arial" font-size="11.5" font-weight="normal" fill="#263238" text-anchor="start">起动供油泵，PT1 建立压力，油经 V1 回流沉淀柜</text>
  <polyline points="432,284 432,312" fill="none" stroke="#2e7d32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="432,312 436.5,303 427.5,303" fill="#2e7d32"/>
  <rect x="400" y="314" width="520" height="68" rx="8" fill="#ffffff" stroke="#ef6c00" stroke-width="1.6"/>
  <circle cx="432" cy="348" r="19" fill="#ef6c00" stroke="#ef6c00" stroke-width="1"/>
  <text x="432" y="354" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="462" y="342" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="bold" fill="#ef6c00" text-anchor="start">按 I</text>
  <text x="462" y="364" font-family="Microsoft YaHei, Arial" font-size="11.5" font-weight="normal" fill="#263238" text-anchor="start">起动加热器，TT1 升到 96 ℃ 以上（额定 98 ℃）</text>
  <polyline points="432,368 432,396" fill="none" stroke="#ef6c00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="432,396 436.5,387 427.5,387" fill="#ef6c00"/>
  <rect x="400" y="398" width="520" height="68" rx="8" fill="#ffffff" stroke="#6a1b9a" stroke-width="1.6"/>
  <circle cx="432" cy="432" r="19" fill="#6a1b9a" stroke="#6a1b9a" stroke-width="1"/>
  <text x="432" y="438" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="462" y="426" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="bold" fill="#6a1b9a" text-anchor="start">按 I</text>
  <text x="462" y="448" font-family="Microsoft YaHei, Arial" font-size="11.5" font-weight="normal" fill="#263238" text-anchor="start">起动分油机电机，ST 升到 10000 r/min 以上</text>
  <polyline points="432,452 432,480" fill="none" stroke="#6a1b9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="432,480 436.5,471 427.5,471" fill="#6a1b9a"/>
  <rect x="400" y="482" width="520" height="68" rx="8" fill="#ffffff" stroke="#c62828" stroke-width="1.6"/>
  <circle cx="432" cy="516" r="19" fill="#c62828" stroke="#c62828" stroke-width="1"/>
  <text x="432" y="522" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="462" y="510" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="bold" fill="#c62828" text-anchor="start">按 I</text>
  <text x="462" y="532" font-family="Microsoft YaHei, Arial" font-size="11.5" font-weight="normal" fill="#263238" text-anchor="start">进入分离程序：Ti56…Ti63 准备，Ti64 进油，Ti68 分油</text>
  <rect x="30" y="604" width="900" height="66" rx="6" fill="#fff8e1" stroke="#ffe082" stroke-width="1.5"/>
  <text x="50" y="626" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="bold" fill="#8d5a12" text-anchor="start">前提：工作水 2~8 bar、控制空气 5~7 bar，沉淀柜出口阀/回油阀/蒸汽截止阀已开；控制方式不在 EPC 位时面板按键无效。</text>
  <text x="50" y="648" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="normal" fill="#8d5a12" text-anchor="start">第 3~6 步若条件未满足（油温 &lt; 96 ℃ 或转速 &lt; 10000 r/min），再按 I 不会前进——这是 EPC-60 的步进联锁，属正常现象。</text>
</svg>
