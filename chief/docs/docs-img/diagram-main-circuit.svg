<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="SimHei, Microsoft YaHei, sans-serif">
  <rect width="400" height="470" fill="#ffffff"/>
  <text x="200" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">电机连续控制 — 主电路</text>

  <!-- 电源 -->
  <text x="30" y="58" font-size="12" fill="#555">3~ 380V</text>
  <text x="30" y="74" font-size="12" fill="#555">50Hz</text>
  <circle cx="100" cy="55" r="3" fill="#333"/>
  <circle cx="150" cy="55" r="3" fill="#333"/>
  <circle cx="200" cy="55" r="3" fill="#333"/>

  <!-- 三相竖线（分段） -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="100" y1="55" x2="100" y2="90"/>
    <line x1="150" y1="55" x2="150" y2="90"/>
    <line x1="200" y1="55" x2="200" y2="90"/>

    <line x1="100" y1="128" x2="100" y2="160"/>
    <line x1="150" y1="128" x2="150" y2="160"/>
    <line x1="200" y1="128" x2="200" y2="160"/>

    <line x1="100" y1="198" x2="100" y2="230"/>
    <line x1="150" y1="198" x2="150" y2="230"/>
    <line x1="200" y1="198" x2="200" y2="230"/>

    <line x1="100" y1="268" x2="100" y2="380"/>
    <line x1="150" y1="268" x2="150" y2="380"/>
    <line x1="200" y1="268" x2="200" y2="380"/>
  </g>

  <!-- QF 断路器 三极 -->
  <g stroke="#c0392b" stroke-width="2.4" fill="none">
    <line x1="100" y1="90" x2="116" y2="124"/>
    <line x1="150" y1="90" x2="166" y2="124"/>
    <line x1="200" y1="90" x2="216" y2="124"/>
  </g>
  <g fill="#c0392b">
    <circle cx="100" cy="90" r="2.6"/><circle cx="150" cy="90" r="2.6"/><circle cx="200" cy="90" r="2.6"/>
    <circle cx="100" cy="128" r="2.6"/><circle cx="150" cy="128" r="2.6"/><circle cx="200" cy="128" r="2.6"/>
  </g>
  <text x="232" y="112" font-size="13" fill="#c0392b">QF 断路器（空气开关）</text>

  <!-- KM1 主触头 -->
  <g stroke="#2471a3" stroke-width="2.4" fill="none">
    <line x1="100" y1="160" x2="116" y2="194"/>
    <line x1="150" y1="160" x2="166" y2="194"/>
    <line x1="200" y1="160" x2="216" y2="194"/>
  </g>
  <g fill="#2471a3">
    <circle cx="100" cy="160" r="2.6"/><circle cx="150" cy="160" r="2.6"/><circle cx="200" cy="160" r="2.6"/>
    <circle cx="100" cy="198" r="2.6"/><circle cx="150" cy="198" r="2.6"/><circle cx="200" cy="198" r="2.6"/>
  </g>
  <text x="232" y="182" font-size="13" fill="#2471a3">KM1 主触头（3 极）</text>

  <!-- FR1 热继电器发热元件 -->
  <g stroke="#1e8449" stroke-width="2.4" fill="none">
    <rect x="93" y="230" width="14" height="38" rx="2"/>
    <rect x="143" y="230" width="14" height="38" rx="2"/>
    <rect x="193" y="230" width="14" height="38" rx="2"/>
  </g>
  <text x="232" y="252" font-size="13" fill="#1e8449">FR1 热继电器发热元件</text>

  <!-- 电动机 -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="100" y1="380" x2="126" y2="408"/>
    <line x1="150" y1="380" x2="150" y2="398"/>
    <line x1="200" y1="380" x2="174" y2="408"/>
  </g>
  <circle cx="150" cy="420" r="30" fill="#f7f9fb" stroke="#333" stroke-width="2"/>
  <text x="150" y="416" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">M</text>
  <text x="150" y="434" text-anchor="middle" font-size="11" fill="#555">3~</text>
  <text x="196" y="420" font-size="13" fill="#2c3e50">三相异步电动机</text>

  <!-- 说明 -->
  <text x="200" y="460" text-anchor="middle" font-size="11" fill="#888">主电路：电源 → QF → KM1 主触头 → FR1 → 电动机</text>
</svg>
