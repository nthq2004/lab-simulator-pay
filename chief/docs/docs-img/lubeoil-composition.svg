<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2c3e50"/>
    </marker>
    <marker id="arwr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="1100" height="460" fill="#fbfcfd"/>
  <text x="550" y="34" font-size="21" font-weight="bold" text-anchor="middle" fill="#1a3a5c">图 1　滑油泵自动切换控制系统 — 管路组成与循环油路</text>

  <!-- 循环柜 -->
  <rect x="24" y="150" width="120" height="110" rx="8" fill="#e8edf2" stroke="#455a64" stroke-width="2"/>
  <text x="84" y="196" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a3a5c">滑油</text>
  <text x="84" y="216" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a3a5c">循环柜</text>
  <text x="84" y="240" font-size="11" text-anchor="middle" fill="#607d8b">60 %</text>

  <!-- 吸入三通 tee1 -->
  <rect x="184" y="185" width="46" height="40" rx="4" fill="#c1bcbc" stroke="#999" stroke-width="1.5"/>
  <text x="207" y="210" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">1</text>
  <text x="207" y="245" font-size="11" text-anchor="middle" fill="#555">三通①</text>

  <!-- 1# 泵支路 -->
  <rect x="270" y="70" width="150" height="86" rx="8" fill="#ecf0f1" stroke="#34495e" stroke-width="2"/>
  <text x="345" y="104" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c3e50">1# 滑油泵</text>
  <text x="345" y="126" font-size="11" text-anchor="middle" fill="#607d8b">遥控端 L / R</text>
  <text x="345" y="142" font-size="11" text-anchor="middle" fill="#607d8b">叶轮</text>
  <rect x="452" y="70" width="104" height="86" rx="8" fill="#fff" stroke="#6b7280" stroke-width="2"/>
  <text x="504" y="108" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">1# 单向阀</text>
  <text x="504" y="128" font-size="11" text-anchor="middle" fill="#27ae60">导通</text>

  <!-- 2# 泵支路 -->
  <rect x="270" y="256" width="150" height="86" rx="8" fill="#ecf0f1" stroke="#34495e" stroke-width="2"/>
  <text x="345" y="290" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c3e50">2# 滑油泵</text>
  <text x="345" y="312" font-size="11" text-anchor="middle" fill="#607d8b">遥控端 L / R</text>
  <text x="345" y="328" font-size="11" text-anchor="middle" fill="#607d8b">叶轮</text>
  <rect x="452" y="256" width="104" height="86" rx="8" fill="#fff" stroke="#6b7280" stroke-width="2"/>
  <text x="504" y="294" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">2# 单向阀</text>
  <text x="504" y="314" font-size="11" text-anchor="middle" fill="#27ae60">导通</text>

  <!-- 汇流三通 tee2 -->
  <rect x="600" y="185" width="46" height="40" rx="4" fill="#c1bcbc" stroke="#999" stroke-width="1.5"/>
  <text x="623" y="210" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">2</text>
  <text x="623" y="245" font-size="11" text-anchor="middle" fill="#555">三通②</text>

  <!-- 测压支路 -->
  <rect x="600" y="52" width="150" height="70" rx="8" fill="#fff8e1" stroke="#c9a227" stroke-width="2"/>
  <text x="675" y="82" font-size="14" font-weight="bold" text-anchor="middle" fill="#8a6d00">压力继电器 yt</text>
  <text x="675" y="104" font-size="11" text-anchor="middle" fill="#8a6d00">下限 0.2 / 上限 0.3 MPa</text>

  <!-- 冷却器/旁通 + 调节阀 -->
  <rect x="700" y="120" width="150" height="70" rx="8" fill="#f6f6f4" stroke="#91aecb" stroke-width="2"/>
  <text x="775" y="152" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">滑油冷却器</text>
  <text x="775" y="172" font-size="11" text-anchor="middle" fill="#607d8b">换热降温</text>
  <rect x="700" y="206" width="150" height="52" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.6"/>
  <text x="775" y="238" font-size="13" font-weight="bold" text-anchor="middle" fill="#a03020">旁通通道</text>
  <rect x="872" y="150" width="112" height="92" rx="8" fill="#ecf0f1" stroke="#34495e" stroke-width="2"/>
  <text x="928" y="186" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">电动</text>
  <text x="928" y="206" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">调节阀</text>
  <text x="928" y="226" font-size="11" text-anchor="middle" fill="#607d8b">三通</text>

  <!-- 滤器组 -->
  <rect x="700" y="300" width="284" height="52" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.6"/>
  <text x="842" y="332" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">手动滤器 ／ 自清洗滤器（并联）</text>

  <!-- 柴油机 -->
  <rect x="30" y="40" width="150" height="72" rx="8" fill="#95a5a6" stroke="#2c3e50" stroke-width="2"/>
  <text x="105" y="82" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a252f">柴油机</text>

  <!-- 连线 -->
  <line x1="144" y1="205" x2="184" y2="205" stroke="#2c3e50" stroke-width="3" marker-end="url(#arw)"/>
  <line x1="230" y1="185" x2="270" y2="120" stroke="#2c3e50" stroke-width="3" marker-end="url(#arw)"/>
  <line x1="230" y1="225" x2="270" y2="290" stroke="#2c3e50" stroke-width="3" marker-end="url(#arw)"/>
  <line x1="420" y1="113" x2="452" y2="113" stroke="#2c3e50" stroke-width="3" marker-end="url(#arw)"/>
  <line x1="420" y1="299" x2="452" y2="299" stroke="#2c3e50" stroke-width="3" marker-end="url(#arw)"/>
  <line x1="556" y1="113" x2="600" y2="192" stroke="#2c3e50" stroke-width="3" marker-end="url(#arw)"/>
  <line x1="556" y1="299" x2="600" y2="218" stroke="#2c3e50" stroke-width="3" marker-end="url(#arw)"/>
  <line x1="623" y1="185" x2="675" y2="122" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <line x1="646" y1="205" x2="700" y2="155" stroke="#2c3e50" stroke-width="3" marker-end="url(#arw)"/>
  <line x1="646" y1="220" x2="700" y2="232" stroke="#2c3e50" stroke-width="3" marker-end="url(#arw)"/>
  <line x1="850" y1="155" x2="872" y2="180" stroke="#2c3e50" stroke-width="3" marker-end="url(#arw)"/>
  <line x1="850" y1="232" x2="872" y2="212" stroke="#2c3e50" stroke-width="3" marker-end="url(#arw)"/>
  <line x1="928" y1="242" x2="850" y2="320" stroke="#2c3e50" stroke-width="3" marker-end="url(#arw)"/>
  <line x1="700" y1="326" x2="240" y2="326" stroke="#2c3e50" stroke-width="3"/>
  <line x1="240" y1="326" x2="170" y2="326" stroke="#2c3e50" stroke-width="3"/>
  <line x1="170" y1="326" x2="170" y2="112" stroke="#2c3e50" stroke-width="3" marker-end="url(#arw)"/>
  <line x1="170" y1="112" x2="105" y2="112" stroke="#2c3e50" stroke-width="3"/>

  <!-- 返回循环柜 -->
  <line x1="105" y1="112" x2="84" y2="150" stroke="#c0392b" stroke-width="3" marker-end="url(#arwr)"/>
  <text x="150" y="352" font-size="12" fill="#c0392b">油路方向：循环柜 → 泵 → 单向阀 → 汇流 → 冷却／旁通 → 滤器 → 柴油机 →（回）循环柜</text>
</svg>
