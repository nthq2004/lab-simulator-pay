<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a5a66"/>
    </marker>
  </defs>
  <rect width="920" height="600" fill="#f7f9fb"/>
  <text x="460" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a252f">联络开关的工作原理（正常位 / 试验位）</text>

  <!-- ===== 左：正常位 ===== -->
  <text x="235" y="66" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">正常位：主电网向应急配电板供电</text>
  <rect x="30" y="80" width="410" height="360" rx="10" fill="#eef6ff" stroke="#1565c0" stroke-width="1.4"/>
  <!-- 主电 -->
  <rect x="60" y="100" width="150" height="34" rx="6" fill="#ffe0e0" stroke="#d02020" stroke-width="1.4"/>
  <text x="135" y="122" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a1a1a">主电网（主汇流排）</text>
  <line x1="135" y1="134" x2="135" y2="170" stroke="#4a5a66" stroke-width="1.6" marker-end="url(#a2)"/>
  <!-- 联络开关（合） -->
  <rect x="70" y="172" width="130" height="42" rx="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="2"/>
  <text x="135" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">联络开关 合闸</text>
  <text x="135" y="206" text-anchor="middle" font-size="10.5" fill="#1e8449">主电 → 应急汇流排</text>
  <line x1="135" y1="214" x2="135" y2="250" stroke="#4a5a66" stroke-width="1.6" marker-end="url(#a2)"/>
  <!-- 应急汇流排 -->
  <rect x="60" y="252" width="350" height="30" rx="5" fill="#2ecc40" stroke="#178a2a" stroke-width="1.4"/>
  <text x="235" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">应急汇流排（由主电供电）</text>
  <!-- 应急主开关（分） -->
  <line x1="300" y1="282" x2="300" y2="315" stroke="#4a5a66" stroke-width="1.6"/>
  <rect x="240" y="317" width="120" height="40" rx="8" fill="#fdecea" stroke="#d02020" stroke-width="1.6"/>
  <text x="300" y="335" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a1a1a">应急主开关 分闸</text>
  <text x="300" y="350" text-anchor="middle" font-size="10.5" fill="#c0392b">被互锁，不能合闸</text>
  <line x1="300" y1="357" x2="300" y2="392" stroke="#4a5a66" stroke-width="1.6"/>
  <rect x="220" y="394" width="160" height="34" rx="6" fill="#f0f0f0" stroke="#7a8494" stroke-width="1.3"/>
  <text x="300" y="416" text-anchor="middle" font-size="12" fill="#4a5a66">应急发电机 停机（备用）</text>
  <text x="235" y="466" text-anchor="middle" font-size="12" fill="#1e8449">联络合闸灯亮 · 应急备用灯亮 · 应发不运行</text>

  <!-- ===== 右：试验位 ===== -->
  <text x="685" y="66" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a4b00">试验位：应急发电机投入供电</text>
  <rect x="480" y="80" width="410" height="360" rx="10" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.4"/>
  <!-- 主电 -->
  <rect x="510" y="100" width="150" height="34" rx="6" fill="#ffe0e0" stroke="#d02020" stroke-width="1.4"/>
  <text x="585" y="122" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a1a1a">主电网（主汇流排）</text>
  <line x1="585" y1="134" x2="585" y2="170" stroke="#4a5a66" stroke-width="1.6"/>
  <!-- 联络开关（分） -->
  <rect x="520" y="172" width="130" height="42" rx="8" fill="#fdecea" stroke="#d02020" stroke-width="2"/>
  <text x="585" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a1a1a">联络开关 分闸</text>
  <text x="585" y="206" text-anchor="middle" font-size="10.5" fill="#c0392b">强制断开（模拟主电失电）</text>
  <!-- 断开标记 -->
  <line x1="585" y1="222" x2="585" y2="250" stroke="#d02020" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="620" y="242" font-size="12" fill="#c0392b">✕</text>
  <!-- 应急汇流排 -->
  <rect x="510" y="252" width="350" height="30" rx="5" fill="#2ecc40" stroke="#178a2a" stroke-width="1.4"/>
  <text x="685" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">应急汇流排（由应急发电机供电）</text>
  <!-- 应急主开关（合） -->
  <line x1="750" y1="282" x2="750" y2="315" stroke="#4a5a66" stroke-width="1.6"/>
  <rect x="690" y="317" width="120" height="40" rx="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.6"/>
  <text x="750" y="335" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">应急主开关 合闸</text>
  <text x="750" y="350" text-anchor="middle" font-size="10.5" fill="#1e8449">应发 → 应急汇流排</text>
  <line x1="750" y1="357" x2="750" y2="392" stroke="#4a5a66" stroke-width="1.6" marker-end="url(#a2)"/>
  <rect x="670" y="394" width="160" height="34" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.4"/>
  <text x="750" y="416" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a1a12">应急发电机 运行</text>
  <text x="685" y="466" text-anchor="middle" font-size="12" fill="#c0392b">联络分闸灯亮 · 应急运行灯亮 · 应发供电</text>

  <!-- ===== 互锁说明 ===== -->
  <rect x="30" y="480" width="860" height="90" rx="10" fill="#fff8ec" stroke="#d9822b" stroke-width="1.6"/>
  <text x="460" y="506" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a4b00">互锁关系（防止主电源与应急电源非同期并列 / 反送电）</text>
  <text x="460" y="530" text-anchor="middle" font-size="12.5" fill="#1a252f">① 联络开关在合闸位时，应急主开关与其互锁、无法合闸；手动合应急主开关前必须先将联络开关置于分闸/试验位。</text>
  <text x="460" y="552" text-anchor="middle" font-size="12.5" fill="#1a252f">② 岸电开关与主/应急发电机主开关同样互锁；三相相序为负序时岸电开关也无法合闸。</text>
</svg>
