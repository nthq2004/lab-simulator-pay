<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <rect width="900" height="560" fill="#fbfcfe"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#1a3a5c">温度变送器零点 / 量程校准流程</text>

  <!-- 左列 -->
  <g>
    <rect x="50" y="60" width="360" height="62" rx="10" fill="#eaf4ff" stroke="#2c7be5" stroke-width="2"/>
    <text x="230" y="88" font-size="14" fill="#1a3a5c" text-anchor="middle" font-weight="bold">① 断电，拆下 PT100</text>
    <text x="230" y="110" font-size="12.5" fill="#445" text-anchor="middle">接入标准可调电阻（三线制 L/M/R，M-R 短接）</text>

    <rect x="50" y="150" width="360" height="62" rx="10" fill="#eaf4ff" stroke="#2c7be5" stroke-width="2"/>
    <text x="230" y="178" font-size="14" fill="#1a3a5c" text-anchor="middle" font-weight="bold">② 接通 24V 电源</text>
    <text x="230" y="200" font-size="12.5" fill="#445" text-anchor="middle">输出回路串入电流表 / 二次仪表作为标准</text>

    <rect x="50" y="240" width="360" height="72" rx="10" fill="#fdf2e9" stroke="#e67e22" stroke-width="2"/>
    <text x="230" y="268" font-size="14" fill="#7e5109" text-anchor="middle" font-weight="bold">③ 调零点 Z</text>
    <text x="230" y="290" font-size="12.5" fill="#7e5109" text-anchor="middle">电阻调 100Ω（0℃），调 Z 使输出 4mA</text>
    <text x="230" y="307" font-size="12" fill="#7e5109" text-anchor="middle">（二次仪表指示 0℃）</text>

    <rect x="50" y="340" width="360" height="72" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="230" y="368" font-size="14" fill="#922b21" text-anchor="middle" font-weight="bold">④ 调量程 S</text>
    <text x="230" y="390" font-size="12.5" fill="#922b21" text-anchor="middle">电阻调 138.51Ω（100℃），调 S 使输出 20mA</text>
    <text x="230" y="407" font-size="12" fill="#922b21" text-anchor="middle">（二次仪表指示 100℃）</text>
  </g>

  <!-- 右列 -->
  <g>
    <rect x="500" y="240" width="350" height="72" rx="10" fill="#eef7f1" stroke="#27ae60" stroke-width="2"/>
    <text x="675" y="268" font-size="14" fill="#1e8449" text-anchor="middle" font-weight="bold">⑤ 复查两个端点</text>
    <text x="675" y="290" font-size="12.5" fill="#1e8449" text-anchor="middle">回 100Ω 看是否仍为 4mA，再回 138.51Ω 看 20mA</text>

    <polygon points="675,340 790,392 675,444 560,392" fill="#fff8e1" stroke="#f39c12" stroke-width="2"/>
    <text x="675" y="388" font-size="13" fill="#7e5109" text-anchor="middle" font-weight="bold">两点都在</text>
    <text x="675" y="408" font-size="13" fill="#7e5109" text-anchor="middle">允许误差内？</text>

    <rect x="500" y="466" width="350" height="62" rx="10" fill="#eceff4" stroke="#607d8b" stroke-width="2"/>
    <text x="675" y="494" font-size="14" fill="#37474f" text-anchor="middle" font-weight="bold">⑥ 断电，拆下标准电阻，复接 PT100</text>
    <text x="675" y="516" font-size="12.5" fill="#37474f" text-anchor="middle">通电确认指示正常，校准完成</text>
  </g>

  <!-- 箭头 -->
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#555"/></marker>
  <marker id="al" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#c0392b"/></marker></defs>
  <line x1="230" y1="122" x2="230" y2="148" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="230" y1="212" x2="230" y2="238" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="230" y1="312" x2="230" y2="338" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="410" y1="376" x2="498" y2="300" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="675" y1="312" x2="675" y2="338" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="675" y1="444" x2="675" y2="464" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

  <!-- 不合格回环 -->
  <path d="M560,392 L440,392 L440,276 L408,276" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#al)"/>
  <text x="452" y="330" font-size="12" fill="#c0392b">否：重复 ③④</text>
  <text x="600" y="152" font-size="12.5" fill="#c0392b" text-anchor="middle" font-weight="bold">零点与量程会相互影响</text>
  <text x="600" y="174" font-size="12" fill="#c0392b" text-anchor="middle">需反复调整 2~3 次，直至两点都准确</text>
</svg>
