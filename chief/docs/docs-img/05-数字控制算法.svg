<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="940" height="600" fill="#f7fafc"/>
  <text x="470" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a365d">数字控制算法：双位控制与 PID 控制</text>
  <text x="470" y="50" text-anchor="middle" font-size="11" fill="#718096">控制算法是“运算环节”的核心，把偏差 e(k) 变成输出 u(k)；工程上最常用双位控制与 PID 控制</text>

  <!-- 左：双位控制 -->
  <rect x="20" y="70" width="440" height="300" rx="6" fill="#fff" stroke="#cbd5e0"/>
  <text x="240" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6cb0">① 双位（开关）控制 · 本仿真液位控制</text>
  <line x1="56" y1="116" x2="56" y2="310" stroke="#718096" stroke-width="1.5"/>
  <line x1="56" y1="310" x2="440" y2="310" stroke="#718096" stroke-width="1.5"/>
  <text x="40" y="124" font-size="10" fill="#718096">液位</text>
  <text x="428" y="328" font-size="10" fill="#718096">时间</text>
  <!-- H / L 线 -->
  <line x1="56" y1="170" x2="440" y2="170" stroke="#e53e3e" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="384" y="164" font-size="11" fill="#e53e3e">H 上限 setH</text>
  <line x1="56" y1="250" x2="440" y2="250" stroke="#e53e3e" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="384" y="266" font-size="11" fill="#e53e3e">L 下限 setL</text>
  <!-- 三角波 -->
  <polyline points="60,250 130,170 220,250 310,170 400,250 440,193"
            fill="none" stroke="#3182ce" stroke-width="2.5"/>
  <text x="150" y="145" font-size="10" fill="#2b6cb0">泵 ON ↑</text>
  <text x="250" y="285" font-size="10" fill="#c05621">泵 OFF ↓（排水）</text>
  <!-- 死区 -->
  <line x1="430" y1="170" x2="430" y2="250" stroke="#c53030" stroke-width="2"/>
  <text x="360" y="214" font-size="10" fill="#c53030">死区 (H−L)</text>
  <text x="240" y="352" text-anchor="middle" font-size="11" fill="#4a5568">规则：液位 ≤ setL → 进水 ON；液位 ≥ setH → 进水 OFF</text>

  <!-- 右：PID -->
  <rect x="480" y="70" width="442" height="300" rx="6" fill="#fff" stroke="#cbd5e0"/>
  <text x="701" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#553c9a">② PID 控制 · 本仿真温度控制</text>

  <rect x="496" y="130" width="60" height="34" rx="4" fill="#e2e8f0" stroke="#4a5568"/>
  <text x="526" y="152" text-anchor="middle" font-size="11" fill="#2d3748">SV</text>
  <circle cx="590" cy="147" r="13" fill="#fff" stroke="#2d3748" stroke-width="2"/>
  <text x="590" y="152" text-anchor="middle" font-size="12" fill="#2d3748">−</text>
  <line x1="556" y1="147" x2="577" y2="147" stroke="#2d3748" stroke-width="2"/>
  <text x="590" y="126" text-anchor="middle" font-size="10" fill="#c53030">e(k)</text>

  <!-- P I D 三个分支 -->
  <rect x="636" y="104" width="70" height="26" rx="4" fill="#bee3f8" stroke="#3182ce"/>
  <text x="671" y="122" text-anchor="middle" font-size="11" fill="#2b6cb0">P 比例</text>
  <rect x="636" y="137" width="70" height="26" rx="4" fill="#c6f6d5" stroke="#2f855a"/>
  <text x="671" y="155" text-anchor="middle" font-size="11" fill="#22543d">I 积分</text>
  <rect x="636" y="170" width="70" height="26" rx="4" fill="#fbd38d" stroke="#dd6b20"/>
  <text x="671" y="188" text-anchor="middle" font-size="11" fill="#c05621">D 微分</text>
  <line x1="603" y1="147" x2="622" y2="147" stroke="#2d3748" stroke-width="2"/>
  <line x1="622" y1="117" x2="622" y2="183" stroke="#2d3748" stroke-width="2"/>
  <line x1="622" y1="117" x2="636" y2="117" stroke="#2d3748" stroke-width="2"/>
  <line x1="622" y1="183" x2="636" y2="183" stroke="#2d3748" stroke-width="2"/>

  <!-- 求和 + 输出 -->
  <circle cx="756" cy="150" r="13" fill="#fff" stroke="#2d3748" stroke-width="2"/>
  <text x="756" y="155" text-anchor="middle" font-size="12" fill="#2d3748">＋</text>
  <line x1="706" y1="117" x2="744" y2="142" stroke="#2d3748" stroke-width="2"/>
  <line x1="706" y1="150" x2="743" y2="150" stroke="#2d3748" stroke-width="2"/>
  <line x1="706" y1="183" x2="744" y2="158" stroke="#2d3748" stroke-width="2"/>

  <rect x="794" y="133" width="66" height="34" rx="4" fill="#805ad5" stroke="#553c9a"/>
  <text x="827" y="155" text-anchor="middle" font-size="11" fill="#fff">输出 u(k)</text>
  <line x1="769" y1="150" x2="794" y2="150" stroke="#2d3748" stroke-width="2"/>

  <rect x="794" y="220" width="100" height="34" rx="4" fill="#2f855a" stroke="#22543d"/>
  <text x="844" y="242" text-anchor="middle" font-size="11" fill="#fff">被控对象</text>
  <line x1="827" y1="167" x2="827" y2="237" stroke="#2d3748" stroke-width="2"/>
  <line x1="827" y1="237" x2="794" y2="237" stroke="#2d3748" stroke-width="2"/>
  <text x="866" y="282" text-anchor="middle" font-size="10" fill="#2d3748">PV</text>
  <line x1="844" y1="254" x2="844" y2="290" stroke="#2d3748" stroke-width="2"/>
  <line x1="844" y1="290" x2="590" y2="290" stroke="#2d3748" stroke-width="2"/>
  <line x1="590" y1="290" x2="590" y2="160" stroke="#2d3748" stroke-width="2"/>

  <text x="701" y="332" text-anchor="middle" font-size="11" fill="#4a5568">u = 50% + Kp·e + Ki·∫e·dt + Kd·de/dt，限幅 0~100%</text>
  <text x="701" y="352" text-anchor="middle" font-size="10" fill="#c53030">P 快、I 消差、D 抑超调；本仿真以 50% 为中位基准输出</text>

  <!-- 底部：数字实现要点 -->
  <rect x="20" y="386" width="902" height="190" rx="6" fill="#fff5f5" stroke="#fc8181"/>
  <text x="470" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#c53030">数字控制器实现的四个关键</text>
  <g font-size="11" fill="#4a5568">
    <text x="36" y="436">① 采样周期 T：必须远小于被控对象的时间常数，否则离散化误差大、控制品质差（本仿真液位/温度按 10Hz 更新）；</text>
    <text x="36" y="458">② 输出限幅：把 u(k) 限制在 0~100%（对应 4~20mA），防止执行器超出物理行程；</text>
    <text x="36" y="480">③ 抗积分饱和：输出已饱和时暂停积分累积（回卷），避免超调与“积分风阻”；</text>
    <text x="36" y="502">④ 手动/自动无扰切换：HAND 时由人工给定阀位，AUTO 时由算法输出，切换瞬间不应产生跳变。</text>
    <text x="36" y="524" fill="#2d3748">本仿真温度回路：PV 取自 AI CH3 的实测温度，SV 为设定温度，输出经 CAN 下发 AO CH1，控制蒸汽调节阀开度。</text>
    <text x="36" y="546" fill="#2d3748">本仿真液位回路：PV 取自 AI CH1，双位算法输出经 CAN 下发 DO CH1，控制进水泵的启停。</text>
    <text x="36" y="568" fill="#c53030">关键：算法是“数字”的，但被控对象是“连续”的，两者之间靠 ADC / DAC 桥接——这正是本工程 AI/AO 模块的意义。</text>
  </g>
</svg>
