<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#34495e"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#f7f9fb"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#2c3e50">图 3　常用湿度传感器的类型与工作原理</text>

  <!-- 卡片 1：电容式 -->
  <rect x="24" y="50" width="220" height="288" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="134" y="74" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d47a1">电容式（高分子薄膜）</text>
  <text x="38" y="100" font-size="12" font-weight="bold" fill="#0d47a1">敏感元件</text>
  <text x="38" y="118" font-size="11.5" fill="#263238">高分子感湿薄膜 + 多孔金电极</text>
  <text x="38" y="146" font-size="12" font-weight="bold" fill="#0d47a1">原理</text>
  <text x="38" y="164" font-size="11.5" fill="#263238">薄膜吸 / 脱水汽 → 介电常数 ε</text>
  <text x="38" y="182" font-size="11.5" fill="#263238">改变 → 电容量 C = ε·S / d 改变</text>
  <text x="38" y="210" font-size="12" font-weight="bold" fill="#0d47a1">输出</text>
  <text x="38" y="228" font-size="11.5" fill="#263238">C → 振荡频率 / 电压 → 变送</text>
  <text x="38" y="256" font-size="12" font-weight="bold" fill="#0d47a1">特点</text>
  <text x="38" y="274" font-size="11.5" fill="#263238">线性好、精度 ±2~3%RH</text>
  <text x="38" y="292" font-size="11.5" fill="#263238">响应较快、长期稳定</text>
  <text x="38" y="316" font-size="12" font-weight="bold" fill="#c62828">→ 本仿真采用</text>

  <!-- 卡片 2：电阻式 -->
  <rect x="252" y="50" width="220" height="288" rx="8" fill="#eceff1" stroke="#546e7a"/>
  <text x="362" y="74" font-size="14" font-weight="bold" text-anchor="middle" fill="#263238">电阻式（氯化锂 / 高分子）</text>
  <text x="266" y="100" font-size="12" font-weight="bold" fill="#37474f">敏感元件</text>
  <text x="266" y="118" font-size="11.5" fill="#263238">吸湿盐涂层或高分子电阻膜</text>
  <text x="266" y="146" font-size="12" font-weight="bold" fill="#37474f">原理</text>
  <text x="266" y="164" font-size="11.5" fill="#263238">吸湿 → 离子导电能力改变</text>
  <text x="266" y="182" font-size="11.5" fill="#263238">→ 元件电阻 R 随湿度下降</text>
  <text x="266" y="210" font-size="12" font-weight="bold" fill="#37474f">输出</text>
  <text x="266" y="228" font-size="11.5" fill="#263238">R → 分压 / 电桥 → 电压</text>
  <text x="266" y="256" font-size="12" font-weight="bold" fill="#37474f">特点</text>
  <text x="266" y="274" font-size="11.5" fill="#263238">灵敏度高、价格低</text>
  <text x="266" y="292" font-size="11.5" fill="#263238">须交流供电防极化</text>
  <text x="266" y="310" font-size="11.5" fill="#263238">易漂移、怕污染</text>

  <!-- 卡片 3：毛发式 -->
  <rect x="480" y="50" width="220" height="288" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="590" y="74" font-size="14" font-weight="bold" text-anchor="middle" fill="#795548">毛发 / 尼龙式（机械）</text>
  <text x="494" y="100" font-size="12" font-weight="bold" fill="#795548">敏感元件</text>
  <text x="494" y="118" font-size="11.5" fill="#263238">脱脂毛发束或尼龙丝</text>
  <text x="494" y="146" font-size="12" font-weight="bold" fill="#795548">原理</text>
  <text x="494" y="164" font-size="11.5" fill="#263238">吸湿后纤维伸长 → 带动</text>
  <text x="494" y="182" font-size="11.5" fill="#263238">指针 / 连杆产生位移</text>
  <text x="494" y="210" font-size="12" font-weight="bold" fill="#795548">输出</text>
  <text x="494" y="228" font-size="11.5" fill="#263238">位移 → 指针指示</text>
  <text x="494" y="246" font-size="11.5" fill="#263238">或驱动微动开关触点</text>
  <text x="494" y="274" font-size="12" font-weight="bold" fill="#795548">特点</text>
  <text x="494" y="292" font-size="11.5" fill="#263238">无需电源、结构简单</text>
  <text x="494" y="310" font-size="11.5" fill="#263238">精度低（±5%）、响应慢</text>

  <!-- 卡片 4：干湿球 -->
  <rect x="708" y="50" width="228" height="288" rx="8" fill="#e8eaf6" stroke="#3949ab"/>
  <text x="822" y="74" font-size="14" font-weight="bold" text-anchor="middle" fill="#283593">干湿球式</text>
  <text x="722" y="100" font-size="12" font-weight="bold" fill="#283593">敏感元件</text>
  <text x="722" y="118" font-size="11.5" fill="#263238">两支温度计（湿球包湿纱布）</text>
  <text x="722" y="146" font-size="12" font-weight="bold" fill="#283593">原理</text>
  <text x="722" y="164" font-size="11.5" fill="#263238">湿球水分蒸发吸热 → 湿球温度</text>
  <text x="722" y="182" font-size="11.5" fill="#263238">低于干球 → 温差反映蒸发能力</text>
  <text x="722" y="210" font-size="12" font-weight="bold" fill="#283593">输出</text>
  <text x="722" y="228" font-size="11.5" fill="#263238">干湿球温差 → 查表 / 计算</text>
  <text x="722" y="246" font-size="11.5" fill="#263238">得相对湿度</text>
  <text x="722" y="274" font-size="12" font-weight="bold" fill="#283593">特点</text>
  <text x="722" y="292" font-size="11.5" fill="#263238">可靠、可作标准比对</text>
  <text x="722" y="310" font-size="11.5" fill="#263238">需强制通风与补水维护</text>

  <!-- 电容式原理示意 -->
  <text x="24" y="378" font-size="14" font-weight="bold" fill="#0d47a1">电容式湿度传感器的工作原理（工程最常用）</text>

  <rect x="40" y="396" width="300" height="30" rx="3" fill="#b0bec5" stroke="#546e7a"/>
  <text x="190" y="416" font-size="12" text-anchor="middle" fill="#263238">① 基板（玻璃 / 陶瓷）</text>
  <rect x="40" y="426" width="300" height="24" rx="3" fill="#ffcc80" stroke="#e65100"/>
  <text x="190" y="443" font-size="12" text-anchor="middle" fill="#5d4037">② 下电极（金属膜）</text>
  <rect x="40" y="450" width="300" height="30" rx="3" fill="#90caf9" stroke="#1565c0"/>
  <text x="190" y="470" font-size="12" text-anchor="middle" fill="#0d47a1">③ 高分子感湿薄膜（介电层）</text>
  <rect x="40" y="480" width="300" height="24" rx="3" fill="#ffe082" stroke="#f9a825"/>
  <text x="190" y="497" font-size="12" text-anchor="middle" fill="#795548">④ 多孔金电极（上电极，透水汽）</text>

  <path d="M360,462 L470,462" fill="none" stroke="#34495e" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="415" y="454" font-size="11" text-anchor="middle" fill="#546e7a">水汽</text>

  <rect x="480" y="410" width="200" height="90" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="580" y="434" font-size="12.5" text-anchor="middle" fill="#1b5e20">感湿膜吸湿 → ε 增大</text>
  <text x="580" y="456" font-size="12.5" text-anchor="middle" fill="#1b5e20">→ C = ε·S / d 增大</text>
  <text x="580" y="478" font-size="12.5" text-anchor="middle" fill="#1b5e20">→ 与环境湿度近线性</text>

  <path d="M680,455 L740,455" fill="none" stroke="#34495e" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="750" y="410" width="186" height="90" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="843" y="432" font-size="12" text-anchor="middle" fill="#0d47a1">C → 振荡电路 / 交流电桥</text>
  <text x="843" y="452" font-size="12" text-anchor="middle" fill="#0d47a1">→ 频率或电压</text>
  <text x="843" y="472" font-size="12" text-anchor="middle" fill="#0d47a1">→ 线性化、温度补偿</text>
  <text x="843" y="492" font-size="12" text-anchor="middle" fill="#0d47a1">→ 0~10V / 4~20mA 输出</text>

  <rect x="40" y="520" width="896" height="62" rx="8" fill="#fffde7" stroke="#f9a825"/>
  <text x="56" y="543" font-size="12" font-weight="bold" fill="#795548">使用要点</text>
  <text x="56" y="564" font-size="12" fill="#5d4037">• 感湿膜怕油雾、盐雾与化学污染 → 船舶空调的测点应加装过滤保护罩，定期清洗；</text>
  <text x="56" y="578" font-size="12" fill="#5d4037">• 湿度与温度强相关 → 变送器必须带温度补偿，测点要装在有代表性的回风或舱室中部，避免紧贴蒸发器出风口（近饱和、易凝露）。</text>
</svg>
