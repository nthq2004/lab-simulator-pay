<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 620" font-family="SimHei, Microsoft YaHei, sans-serif">
  <rect width="460" height="620" fill="#ffffff"/>
  <text x="230" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">电机起动控制箱 — 器件布局（实物识别）</text>

  <!-- 柜体 -->
  <rect x="30" y="50" width="400" height="540" rx="6" fill="#e8eaec" stroke="#5a6a75" stroke-width="2"/>
  <rect x="36" y="56" width="388" height="528" rx="4" fill="#f0f2f4" stroke="#b0b4b8"/>
  <rect x="36" y="56" width="388" height="28" rx="4" fill="#3a4a55"/>
  <text x="230" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">电机起动控制箱</text>

  <!-- 线槽（灰色条） -->
  <rect x="42" y="90" width="16" height="488" fill="#c8ccd0" stroke="#8a949c"/>
  <rect x="66" y="278" width="352" height="14" fill="#c8ccd0" stroke="#8a949c"/>
  <rect x="66" y="432" width="352" height="14" fill="#c8ccd0" stroke="#8a949c"/>

  <!-- 3×3 格子 -->
  <g stroke="#8a949c" stroke-width="1.4">
    <rect x="70" y="96"  width="108" height="176" fill="#ffffff"/>
    <rect x="186" y="96"  width="108" height="176" fill="#ffffff"/>
    <rect x="302" y="96"  width="108" height="176" fill="#ffffff"/>
    <rect x="70" y="296" width="108" height="130" fill="#ffffff"/>
    <rect x="186" y="296" width="108" height="130" fill="#eef0f2"/>
    <rect x="302" y="296" width="108" height="130" fill="#ffffff"/>
    <rect x="70" y="450" width="108" height="124" fill="#ffffff"/>
    <rect x="186" y="450" width="108" height="124" fill="#ffffff"/>
    <rect x="302" y="450" width="108" height="124" fill="#ffffff"/>
  </g>

  <!-- 格子文字 + 序号 -->
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">
    <text x="124" y="175">断路器</text><text x="124" y="196" font-size="11" fill="#c0392b">QF</text>
    <text x="240" y="175">熔断器</text><text x="240" y="196" font-size="11" fill="#c0392b">FU</text>
    <text x="356" y="175">接触器</text><text x="356" y="196" font-size="11" fill="#2471a3">KM</text>

    <text x="124" y="352">触头组</text><text x="124" y="373" font-size="11" fill="#2471a3">主/辅触头</text>
    <text x="240" y="366" font-size="12" fill="#aaa">（空位）</text>
    <text x="356" y="352">起动按钮</text><text x="356" y="373" font-size="11" fill="#2471a3">SB2</text>

    <text x="124" y="505">热继电器</text><text x="124" y="526" font-size="11" fill="#1e8449">FR</text>
    <text x="240" y="505">时间继电器</text><text x="240" y="526" font-size="11" fill="#1e8449">KT</text>
    <text x="356" y="505">停止按钮</text><text x="356" y="526" font-size="11" fill="#c0392b">SB1</text>
  </g>

  <!-- 序号角标 -->
  <g font-size="11" fill="#888">
    <text x="74" y="110">1</text><text x="190" y="110">2</text><text x="306" y="110">3</text>
    <text x="74" y="310">4</text><text x="190" y="310">5</text><text x="306" y="310">6</text>
    <text x="74" y="464">7</text><text x="190" y="464">8</text><text x="306" y="464">9</text>
  </g>

  <text x="230" y="610" text-anchor="middle" font-size="11" fill="#888">共 9 格：识别其中的断路器、接触器、热继电器、按钮、熔断器、时间继电器等</text>
</svg>
