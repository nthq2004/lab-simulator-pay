<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 540" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="660" height="540" fill="#ffffff"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a252f">图 1  JSZ3 系列时间继电器结构与端子排列</text>

  <!-- 外壳 -->
  <rect x="44" y="50" width="572" height="470" rx="12" fill="#f4f0e8" stroke="#b8a898" stroke-width="2"/>
  <line x1="300" y1="64" x2="300" y2="506" stroke="#b0a898" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- ============ 左侧：延时刻度盘 ============ -->
  <text x="172" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a4030">延时设定</text>
  <text x="172" y="100" text-anchor="middle" font-size="12" fill="#706050">0 ~ 30 s（步进 0.5 s）</text>

  <circle cx="172" cy="270" r="92" fill="#ece8e0" stroke="#a09080" stroke-width="1.5"/>
  <!-- 刻度 -->
  <g stroke="#504030" stroke-width="1.4">
    <line x1="172" y1="186" x2="172" y2="198"/>
    <line x1="238" y1="214" x2="228" y2="222"/>
    <line x1="256" y1="270" x2="244" y2="270"/>
    <line x1="238" y1="326" x2="228" y2="318"/>
    <line x1="172" y1="354" x2="172" y2="342"/>
    <line x1="106" y1="326" x2="116" y2="318"/>
    <line x1="88" y1="270" x2="100" y2="270"/>
    <line x1="106" y1="214" x2="116" y2="222"/>
  </g>
  <text x="172" y="176" text-anchor="middle" font-size="12" fill="#403020">0</text>
  <text x="272" y="274" text-anchor="middle" font-size="12" fill="#403020">15</text>
  <text x="172" y="376" text-anchor="middle" font-size="12" fill="#403020">30</text>
  <!-- 指针 -->
  <line x1="172" y1="270" x2="172" y2="196" stroke="#d63031" stroke-width="3" stroke-linecap="round"/>
  <circle cx="172" cy="270" r="7" fill="#302818"/>
  <text x="172" y="400" text-anchor="middle" font-size="12" fill="#706050">刻度盘旋钮（可点击/滚轮调整）</text>

  <!-- ============ 右侧：端子圆环 ============ -->
  <circle cx="480" cy="270" r="118" fill="#ece8e0" stroke="#a09080" stroke-width="1.5"/>
  <text x="480" y="266" text-anchor="middle" font-size="12" fill="#605040">接线端子</text>
  <text x="480" y="284" text-anchor="middle" font-size="11" fill="#908070">（8 个）</text>

  <!-- 端子：编号 / 坐标（与组件角度定义一致）-->
  <!-- 1 com_b 112.5 -->
  <circle cx="435" cy="379" r="14" fill="#d0c8b8" stroke="#605040" stroke-width="2"/>
  <text x="435" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#202020">1</text>
  <!-- 2 l 157.5 -->
  <circle cx="371" cy="315" r="14" fill="#d0c8b8" stroke="#605040" stroke-width="2"/>
  <text x="371" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#202020">2</text>
  <!-- 3 no_b 202.5 -->
  <circle cx="371" cy="225" r="14" fill="#f0c0b8" stroke="#d04020" stroke-width="2"/>
  <text x="371" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#d03020">3</text>
  <!-- 4 nc_b 247.5 -->
  <circle cx="435" cy="161" r="14" fill="#d0c8b8" stroke="#605040" stroke-width="2"/>
  <text x="435" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#202020">4</text>
  <!-- 5 nc_a 292.5 -->
  <circle cx="525" cy="161" r="14" fill="#d0c8b8" stroke="#605040" stroke-width="2"/>
  <text x="525" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#202020">5</text>
  <!-- 6 no_a 337.5 -->
  <circle cx="589" cy="225" r="14" fill="#f0c0b8" stroke="#d04020" stroke-width="2"/>
  <text x="589" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#d03020">6</text>
  <!-- 7 r 22.5 -->
  <circle cx="589" cy="315" r="14" fill="#d0c8b8" stroke="#605040" stroke-width="2"/>
  <text x="589" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#202020">7</text>
  <!-- 8 com_a 67.5 -->
  <circle cx="525" cy="379" r="14" fill="#d0c8b8" stroke="#605040" stroke-width="2"/>
  <text x="525" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#202020">8</text>

  <!-- 线圈连线 2-7（底部） -->
  <path d="M371 329 L371 420 L470 420" fill="none" stroke="#605040" stroke-width="2"/>
  <path d="M589 329 L589 420 L490 420" fill="none" stroke="#605040" stroke-width="2"/>
  <rect x="455" y="410" width="50" height="20" rx="4" fill="#f8f4ec" stroke="#605040" stroke-width="2"/>
  <path d="M458 420 q8 -7 16 0 q8 7 16 0" fill="none" stroke="#202020" stroke-width="1.8"/>
  <text x="480" y="447" text-anchor="middle" font-size="12" font-weight="bold" fill="#b02020">线圈 2-7（220V~）</text>
  <text x="480" y="465" text-anchor="middle" font-size="11" fill="#b02020">接控制电源，线圈得电继电器工作</text>

  <!-- 触头标注 -->
  <rect x="322" y="480" width="294" height="36" rx="6" fill="#fafafa" stroke="#ccc"/>
  <text x="334" y="496" font-size="12.5" fill="#2d3436">NO：1-3、6-8</text>
  <text x="452" y="496" font-size="12.5" fill="#2d3436">NC：1-4、5-8</text>
  <text x="334" y="512" font-size="11.5" fill="#888">公共端：1、8；红底端子为常开 NO</text>

  <!-- 指示灯 -->
  <circle cx="90" cy="462" r="8" fill="#c0392b"/>
  <text x="106" y="467" font-size="12" fill="#2d3436">电源/计时指示（闪烁）</text>
  <circle cx="90" cy="490" r="8" fill="#27ae60"/>
  <text x="106" y="495" font-size="12" fill="#2d3436">输出 OUTPUT 指示（常亮）</text>

  <text x="330" y="534" text-anchor="middle" font-size="11.5" fill="#888">面板左侧为延时刻度盘，右侧为 8 个接线端子；2、7 是线圈端，触头分两组、公共端为 1 或 8</text>
</svg>
