<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="820" height="560" fill="#ffffff"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2a33">图 2　钳形电流表的工作原理与外观操作</text>

  <!-- ============ 左：工作原理 ============ -->
  <rect x="22" y="56" width="452" height="470" rx="12" fill="#fbfaf7" stroke="#e0a458" stroke-width="1.6"/>
  <text x="248" y="82" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a86a1a">工作原理：电流互感器（CT）</text>

  <!-- 铁芯（环形，可开合） -->
  <rect x="70" y="150" width="200" height="210" rx="14" fill="#98a4b0"/>
  <rect x="104" y="184" width="132" height="142" rx="8" fill="#ffffff"/>
  <!-- 被测导线（一次侧） -->
  <line x1="170" y1="106" x2="170" y2="406" stroke="#d94f4f" stroke-width="4"/>
  <polygon points="170,120 165,132 175,132" fill="#d94f4f"/>
  <text x="170" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b23b3b">I₁ 被测电流</text>
  <text x="170" y="436" text-anchor="middle" font-size="12" fill="#b23b3b">一次绕组 N₁ = 1（即被测导线本身）</text>

  <!-- 二次绕组（绕在铁芯上） -->
  <g stroke="#1d5185" stroke-width="2.6" fill="#eef4fb">
    <circle cx="253" cy="210" r="8"/><circle cx="253" cy="232" r="8"/>
    <circle cx="253" cy="254" r="8"/><circle cx="253" cy="276" r="8"/>
    <circle cx="253" cy="298" r="8"/>
  </g>
  <text x="253" y="330" text-anchor="middle" font-size="12" fill="#1d5185">二次绕组 N₂（多匝）</text>

  <!-- 二次引线到表头 -->
  <g stroke="#1d5185" stroke-width="2" fill="none">
    <polyline points="261,204 300,204 300,236 332,244"/>
    <polyline points="261,306 300,306 300,274 332,266"/>
  </g>
  <circle cx="360" cy="255" r="28" fill="#ffffff" stroke="#1d5185" stroke-width="2.4"/>
  <text x="360" y="262" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d5185">A</text>
  <text x="360" y="300" text-anchor="middle" font-size="11.5" fill="#1d5185">表头</text>

  <!-- 公式 -->
  <text x="248" y="420" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#33414d">I₁ · N₁ = I₂ · N₂　→　I₂ = I₁ / N₂</text>
  <text x="248" y="446" text-anchor="middle" font-size="12" fill="#5b6b7a">被测大电流在二次侧感应出成比例的小电流，经整流后推动表头指针</text>
  <text x="248" y="470" text-anchor="middle" font-size="12" fill="#5b6b7a">无需断开被测电路，即可实现不停电测量交流电流</text>
  <text x="248" y="500" text-anchor="middle" font-size="12" fill="#b23b3b">要点：钳口内只钳入一根导线；钳入多相会使磁场抵消、读数偏小</text>

  <!-- ============ 右：外观与操作 ============ -->
  <rect x="494" y="56" width="304" height="470" rx="12" fill="#f7f9fb" stroke="#8a97a3" stroke-width="1.6"/>
  <text x="646" y="82" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#33414d">外观与操作部件</text>

  <!-- 机体 -->
  <rect x="566" y="98" width="160" height="372" rx="18" fill="#f2f4f7" stroke="#b8c2cc" stroke-width="2"/>

  <!-- 钳口 -->
  <circle cx="646" cy="150" r="42" fill="none" stroke="#e0b23a" stroke-width="13"/>
  <text x="646" y="156" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a86a1a">钳口</text>

  <!-- 扳机 -->
  <rect x="524" y="180" width="46" height="66" rx="9" fill="#5a6470"/>
  <text x="547" y="219" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff" transform="rotate(-90 547 219)">扳机</text>
  <line x1="570" y1="200" x2="560" y2="200" stroke="#8a97a3" stroke-width="1.5"/>

  <!-- 量程旋钮 -->
  <circle cx="646" cy="290" r="34" fill="#dfe6ee" stroke="#8a97a3" stroke-width="2"/>
  <line x1="646" y1="290" x2="646" y2="262" stroke="#33414d" stroke-width="3"/>
  <text x="646" y="344" text-anchor="middle" font-size="12" fill="#33414d">量程旋钮（5/50/100/250 A）</text>

  <!-- 表盘 -->
  <rect x="588" y="366" width="116" height="66" rx="8" fill="#ffffff" stroke="#8a97a3" stroke-width="1.8"/>
  <path d="M600 424 A46 46 0 0 1 692 424" fill="none" stroke="#c3ccd6" stroke-width="1.6"/>
  <line x1="646" y1="424" x2="678" y2="386" stroke="#d94f4f" stroke-width="2.6"/>
  <circle cx="646" cy="424" r="4" fill="#33414d"/>
  <text x="596" y="384" text-anchor="start" font-size="10.5" fill="#5b6b7a">指针表盘</text>

  <!-- 插孔 -->
  <circle cx="616" cy="452" r="7" fill="#2b2f33"/><text x="616" y="470" text-anchor="middle" font-size="10" fill="#33414d">COM</text>
  <circle cx="676" cy="452" r="7" fill="#c0392b"/><text x="676" y="470" text-anchor="middle" font-size="10" fill="#33414d">V/Ω</text>

  <!-- 说明 -->
  <text x="646" y="502" text-anchor="middle" font-size="11.5" fill="#5b6b7a">按住扳机张开钳口 → 套入导线 → 松手合上钳口测量</text>
</svg>
