<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2c3e50"/>
    </marker>
  </defs>
  <rect width="1080" height="560" fill="#fbfcfd"/>
  <text x="540" y="30" font-size="21" font-weight="bold" text-anchor="middle" fill="#1a3a5c">图 6　自动切换流程（压力低 3s ／ 故障 5s）</text>

  <!-- 起点 -->
  <rect x="420" y="50" width="240" height="44" rx="22" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="540" y="78" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d47a1">自动模式：1# 为主用泵运行</text>
  <line x1="540" y1="94" x2="540" y2="124" stroke="#2c3e50" stroke-width="2" marker-end="url(#a2)"/>

  <!-- 判断1 -->
  <polygon points="540,126 700,166 540,206 380,166" fill="#fff8e1" stroke="#e67e22" stroke-width="2"/>
  <text x="540" y="164" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#8a6d00">系统油压 &lt; 0.2 MPa ?</text>
  <text x="540" y="182" font-size="11" text-anchor="middle" fill="#8a6d00">（压力开关 NC 闭合）</text>

  <text x="708" y="160" font-size="12" fill="#2e7d32">否</text>
  <line x1="700" y1="166" x2="860" y2="166" stroke="#2e7d32" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="860" y="140" width="180" height="52" rx="8" fill="#eef7ee" stroke="#43a047" stroke-width="1.6"/>
  <text x="950" y="162" font-size="12" text-anchor="middle" fill="#2e7d32">保持：主用泵运行</text>
  <text x="950" y="180" font-size="12" text-anchor="middle" fill="#2e7d32">备用泵不投入</text>

  <text x="372" y="200" font-size="12" fill="#c0392b">是</text>
  <line x1="540" y1="206" x2="540" y2="240" stroke="#2c3e50" stroke-width="2" marker-end="url(#a2)"/>

  <!-- 延时3s -->
  <rect x="410" y="242" width="260" height="46" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
  <text x="540" y="263" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#a03020">运行泵无故障：压力低持续 3 s</text>
  <text x="540" y="281" font-size="11.5" text-anchor="middle" fill="#a03020">（T37 计时到，M1.2 = 1）</text>
  <line x1="540" y1="288" x2="540" y2="320" stroke="#2c3e50" stroke-width="2" marker-end="url(#a2)"/>

  <!-- 故障支路 -->
  <rect x="760" y="242" width="260" height="46" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
  <text x="890" y="263" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#a03020">运行泵过载故障：延时 5 s</text>
  <text x="890" y="281" font-size="11.5" text-anchor="middle" fill="#a03020">（T38 / T39 计时到，M1.2 = 1）</text>
  <line x1="760" y1="265" x2="670" y2="265" stroke="#c0392b" stroke-width="2.4" marker-end="url(#a2)"/>
  <text x="700" y="256" font-size="12" fill="#c0392b">或</text>

  <!-- 投入备用 -->
  <rect x="380" y="322" width="320" height="50" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="540" y="344" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b5e20">投入备用泵（2#）：Q0.1 = 1 → KM2 吸合</text>
  <text x="540" y="363" font-size="11.5" text-anchor="middle" fill="#1b5e20">主用泵仍在运行，系统压力回升</text>
  <line x1="540" y1="372" x2="540" y2="404" stroke="#2c3e50" stroke-width="2" marker-end="url(#a2)"/>

  <!-- 判断2 -->
  <polygon points="540,406 760,446 540,486 320,446" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="540" y="444" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1b5e20">系统油压恢复 &gt; 0.3 MPa ?</text>
  <text x="540" y="462" font-size="11" text-anchor="middle" fill="#1b5e20">（压力开关 NC 断开）</text>
  <line x1="540" y1="486" x2="540" y2="516" stroke="#2c3e50" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="340" y="516" width="400" height="40" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="540" y="542" font-size="13" font-weight="bold" text-anchor="middle" fill="#0d47a1">主/备互换：切除原运行泵（1#），备用泵（2#）成为运行泵</text>
</svg>
