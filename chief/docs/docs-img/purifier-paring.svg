<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <rect width="900" height="480" fill="#f7f9f8"/>
  <text x="450" y="32" font-family="Microsoft YaHei, Arial" font-size="19" font-weight="bold" fill="#263238" text-anchor="middle">向心泵（向心管）与重力环（比重环）</text>
  <rect x="28" y="54" width="400" height="356" rx="8" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="228" y="84" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="bold" fill="#b71c1c" text-anchor="middle">传统 P 型：重力环（比重环）</text>
  <polygon points="132,176 324,176 268,360 188,360" fill="#f3f5f6" stroke="#455a64" stroke-width="2.5"/>
  <polygon points="142,186 314,186 260,350 196,350" fill="#ffffff" stroke="#b0bec5" stroke-width="1"/>
  <polygon points="144,202 170,202 198,350 174,350" fill="#4fc3f7" stroke="none" stroke-width="0" opacity="0.65"/>
  <polygon points="312,202 286,202 258,350 282,350" fill="#4fc3f7" stroke="none" stroke-width="0" opacity="0.65"/>
  <polygon points="170,202 286,202 258,350 198,350" fill="#e8a33d" stroke="none" stroke-width="0" opacity="0.35"/>
  <polyline points="158,202 298,202" fill="none" stroke="#1565c0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <polyline points="172,206 118,228" fill="none" stroke="#1565c0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="112" y="222" font-family="Microsoft YaHei, Arial" font-size="10.5" font-weight="bold" fill="#1565c0" text-anchor="end">油水界面由</text>
  <text x="112" y="236" font-family="Microsoft YaHei, Arial" font-size="10.5" font-weight="bold" fill="#1565c0" text-anchor="end">比重环内径决定</text>
  <rect x="154" y="162" width="16" height="26" rx="0" fill="#cfd8dc" stroke="#37474f" stroke-width="1.6"/>
  <rect x="286" y="162" width="16" height="26" rx="0" fill="#cfd8dc" stroke="#37474f" stroke-width="1.6"/>
  <text x="128" y="180" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="bold" fill="#263238" text-anchor="end">比重环</text>
  <text x="328" y="180" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="bold" fill="#263238" text-anchor="start">比重环</text>
  <polyline points="162,160 162,124" fill="none" stroke="#c05600" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="162,124 157,134 167,134" fill="#c05600"/>
  <polyline points="294,160 294,124" fill="none" stroke="#c05600" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="294,124 289,134 299,134" fill="#c05600"/>
  <text x="228" y="114" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="bold" fill="#c05600" text-anchor="middle">净油溢流（无压头，靠重力流出）</text>
  <text x="228" y="386" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="bold" fill="#b71c1c" text-anchor="middle">换油品、密度变化 → 界面偏移 → 必须更换比重环</text>
  <rect x="468" y="54" width="404" height="356" rx="8" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="670" y="84" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">S 型：向心泵（向心管）</text>
  <polygon points="574,176 766,176 710,360 630,360" fill="#f3f5f6" stroke="#455a64" stroke-width="2.5"/>
  <polygon points="584,186 756,186 702,350 638,350" fill="#ffffff" stroke="#b0bec5" stroke-width="1"/>
  <polygon points="586,206 616,206 640,350 616,350" fill="#4fc3f7" stroke="none" stroke-width="0" opacity="0.65"/>
  <polygon points="754,206 724,206 700,350 724,350" fill="#4fc3f7" stroke="none" stroke-width="0" opacity="0.65"/>
  <polygon points="616,206 724,206 700,350 640,350" fill="#e8a33d" stroke="none" stroke-width="0" opacity="0.32"/>
  <circle cx="670" cy="212" r="26" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <polyline points="670,206 670,189" fill="none" stroke="#1565c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="676,212 693,212" fill="none" stroke="#1565c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="670,218 670,235" fill="none" stroke="#1565c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="664,212 647,212" fill="none" stroke="#1565c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="776" y="200" font-family="Microsoft YaHei, Arial" font-size="10.5" font-weight="bold" fill="#1565c0" text-anchor="start">向心泵盘</text>
  <text x="776" y="214" font-family="Microsoft YaHei, Arial" font-size="10.5" font-weight="bold" fill="#1565c0" text-anchor="start">（随筒旋转）</text>
  <polyline points="774,206 698,212" fill="none" stroke="#1565c0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="670,212 670,126" fill="none" stroke="#2e7d32" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="670,126 663,140 677,140" fill="#2e7d32"/>
  <text x="670" y="116" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="bold" fill="#2e7d32" text-anchor="middle">净油 → V4 → 净油柜（0.2～0.3 MPa）</text>
  <text x="670" y="386" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="bold" fill="#2e7d32" text-anchor="middle">出口压力由泵盘半径决定，界面自动适应油品密度</text>
  <rect x="28" y="424" width="844" height="44" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="48" y="444" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="start">向心泵把筒内旋转油液的动能转换为压力能：p = ½ρω²(R² − r²)。出口靠背压而不是堰板高度建立液位，</text>
  <text x="48" y="461" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="start">油品密度变化时泵盘出口自动落在正确半径上，因此 S 型取消比重环，停机置换时还能把筒内的油顶出去。</text>
</svg>
