<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <rect width="920" height="500" fill="#fbfcfe"/>
  <text x="460" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a3a5c">图 2　数字式 PID 调节器面板布局</text>

  <!-- 调节器机身 -->
  <rect x="60" y="58" width="500" height="400" rx="10" fill="#1a1a1a" stroke="#333" stroke-width="4"/>
  <!-- 主显示区 -->
  <rect x="78" y="76" width="464" height="86" rx="4" fill="#050505" stroke="#444"/>
  <text x="96" y="100" font-size="12" fill="#e74c3c">PV 测量值</text>
  <text x="96" y="140" font-size="40" font-family="Courier New" font-weight="bold" fill="#ff3333">82.5</text>
  <text x="330" y="100" font-size="12" fill="#2ecc71">SV 设定值</text>
  <text x="330" y="140" font-size="40" font-family="Courier New" font-weight="bold" fill="#33ff33">80.0</text>

  <!-- 参数框 -->
  <g>
    <rect x="78" y="186" width="92" height="50" fill="#000" stroke="#444"/><text x="86" y="202" font-size="11" fill="#fff">P</text><text x="150" y="228" font-size="17" font-family="Courier New" fill="#33ff33" text-anchor="end">4.0</text>
    <rect x="180" y="186" width="92" height="50" fill="#000" stroke="#444"/><text x="188" y="202" font-size="11" fill="#fff">I</text><text x="252" y="228" font-size="17" font-family="Courier New" fill="#33ff33" text-anchor="end">30</text>
    <rect x="282" y="186" width="92" height="50" fill="#000" stroke="#444"/><text x="290" y="202" font-size="11" fill="#fff">D</text><text x="354" y="228" font-size="17" font-family="Courier New" fill="#33ff33" text-anchor="end">0.0</text>
    <rect x="384" y="186" width="94" height="50" fill="#000" stroke="#444"/><text x="392" y="202" font-size="11" fill="#fff">AL</text><text x="460" y="228" font-size="17" font-family="Courier New" fill="#ff3333" text-anchor="end">----</text>
  </g>
  <g>
    <rect x="78" y="246" width="92" height="50" fill="#000" stroke="#444"/><text x="86" y="262" font-size="11" fill="#fff">OL</text><text x="150" y="288" font-size="17" font-family="Courier New" fill="#33ff33" text-anchor="end">0%</text>
    <rect x="180" y="246" width="92" height="50" fill="#000" stroke="#444"/><text x="188" y="262" font-size="11" fill="#fff">OH</text><text x="252" y="288" font-size="17" font-family="Courier New" fill="#33ff33" text-anchor="end">100%</text>
    <rect x="282" y="246" width="92" height="50" fill="#000" stroke="#444"/><text x="290" y="262" font-size="11" fill="#fff">URV</text><text x="354" y="288" font-size="17" font-family="Courier New" fill="#33ff33" text-anchor="end">100</text>
    <rect x="384" y="246" width="94" height="50" fill="#000" stroke="#444"/><text x="392" y="262" font-size="11" fill="#fff">OUT</text><text x="460" y="288" font-size="17" font-family="Courier New" fill="#ffcc00" text-anchor="end">52.3</text>
  </g>

  <!-- 指示灯 -->
  <g font-size="10" fill="#ddd">
    <circle cx="92" cy="318" r="5" fill="#00ff00"/><text x="102" y="322">AUTO</text>
    <circle cx="162" cy="318" r="5" fill="#222" stroke="#000"/><text x="172" y="322">MAN</text>
    <circle cx="232" cy="318" r="5" fill="#222" stroke="#000"/><text x="242" y="322">AT</text>
    <circle cx="292" cy="318" r="5" fill="#222" stroke="#000"/><text x="302" y="322">AL</text>
    <circle cx="352" cy="318" r="5" fill="#222" stroke="#000"/><text x="362" y="322">DIR</text>
    <circle cx="422" cy="318" r="5" fill="#00ffff"/><text x="432" y="322">REV</text>
  </g>

  <!-- 按键 -->
  <g font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">
    <rect x="78" y="342" width="78" height="56" rx="5" fill="#444" stroke="#000"/><text x="117" y="376">AT</text>
    <rect x="172" y="342" width="78" height="56" rx="5" fill="#0f7e4a" stroke="#000"/><text x="211" y="376">A/M</text>
    <rect x="266" y="342" width="78" height="56" rx="5" fill="#444" stroke="#000"/><text x="305" y="376">SET</text>
    <rect x="360" y="342" width="78" height="56" rx="5" fill="#444" stroke="#000"/><text x="399" y="376">▲</text>
    <rect x="454" y="342" width="78" height="56" rx="5" fill="#444" stroke="#000"/><text x="493" y="376">▼</text>
  </g>
  <text x="305" y="430" font-size="11" fill="#aaa" text-anchor="middle">A/M 切换自动↔手动；SET 进入/保存；▲▼ 增减参数</text>

  <!-- 右侧端子说明 -->
  <rect x="600" y="80" width="296" height="356" rx="10" fill="#fff8f0" stroke="#e8a87c" stroke-width="2"/>
  <text x="748" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#a0522d">接线端子与信号</text>
  <g font-size="13" fill="#5b3a1a">
    <text x="622" y="146">输入 4~20mA：pi1(+) / ni1(−)　← 变送器</text>
    <text x="622" y="180">电源 DC24V：vcc(+) / gnd(−)</text>
    <text x="622" y="214">RS485：a1 / b1　→ 监控主机</text>
    <text x="622" y="248">输出 CH1：po1(+) / no1(−)　→ 三通阀</text>
    <text x="622" y="282">输出 CH2：po2(+) / no2(−)</text>
  </g>
  <line x1="622" y1="304" x2="874" y2="304" stroke="#e8a87c"/>
  <text x="748" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#a0522d">运行模式</text>
  <text x="622" y="360" font-size="12.5" fill="#333">AUTO 自动：按 PV 与 SV 偏差自动运算输出</text>
  <text x="622" y="386" font-size="12.5" fill="#333">MAN 手动：由 ▲▼ 直接给定输出值</text>
  <text x="622" y="412" font-size="12.5" fill="#333">DIR/REV：正/反作用方向</text>
</svg>
