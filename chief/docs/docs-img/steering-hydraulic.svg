<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="620" fill="#fbfbf8"/>
  <text x="490" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#263238">图 2  液压舵机油路原理（单台液压动力单元，右舵为例）</text>

  <defs>
    <marker id="oa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#f39c12"/>
    </marker>
    <marker id="ba" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1e88e5"/>
    </marker>
    <marker id="ga" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#8d6e63"/>
    </marker>
  </defs>

  <!-- 说明框 -->
  <rect x="36" y="52" width="300" height="186" rx="8" fill="#ffffff" stroke="#b0bec5" stroke-width="1.2"/>
  <text x="52" y="74" font-size="12" font-weight="bold" fill="#263238">油路走向（右舵为例）</text>
  <text x="52" y="96" font-size="10.5" fill="#37474f">① 变量泵 → 液控四通阀（右位工作位）</text>
  <text x="52" y="116" font-size="10.5" fill="#37474f">② 右管路升压 → 右串联阀 → 高压母管</text>
  <text x="52" y="136" font-size="10.5" fill="#37474f">③ 高压母管 → 动力管路 → 左腔推舵</text>
  <text x="52" y="156" font-size="10.5" fill="#37474f">④ 四缸推/拉舵柄 → 舵柱带动舵叶转舵</text>
  <text x="52" y="176" font-size="10.5" fill="#37474f">⑤ 右腔回油 → 回油母管 → 左串联阀 → 泵</text>
  <text x="52" y="200" font-size="10.5" fill="#b71c1c">隔离阀动作：两串联阀截止、并联阀导通</text>
  <text x="52" y="220" font-size="10.5" fill="#b71c1c">油位 &lt; 20%：延时 3 s 停机 + 联动对方隔离阀</text>

  <!-- 隔离阀 -->
  <rect x="556" y="56" width="118" height="38" rx="4" fill="#eef0ed" stroke="#3f4b4f" stroke-width="2"/>
  <line x1="590" y1="56" x2="590" y2="94" stroke="#3f4b4f" stroke-width="1.3"/>
  <line x1="640" y1="56" x2="640" y2="94" stroke="#3f4b4f" stroke-width="1.3"/>
  <text x="615" y="80" font-size="11" font-weight="bold" text-anchor="middle" fill="#37474f">隔离阀</text>
  <text x="688" y="70" font-size="9.5" fill="#546e7a">手动 / 电磁双控</text>
  <text x="688" y="86" font-size="9.5" fill="#546e7a">两位四通，控制下方三阀</text>

  <!-- 隔离阀联动虚线 -->
  <path d="M615,94 L615,190 L370,190 L370,368" fill="none" stroke="#8d6e63" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ga)"/>

  <!-- 并联阀 -->
  <rect x="348" y="376" width="44" height="28" fill="#eef0ed" stroke="#3f4b4f" stroke-width="1.8"/>
  <line x1="370" y1="376" x2="370" y2="404" stroke="#3f4b4f" stroke-width="1.3"/>
  <line x1="330" y1="390" x2="348" y2="390" stroke="#1e88e5" stroke-width="3"/>
  <line x1="392" y1="390" x2="410" y2="390" stroke="#f39c12" stroke-width="3"/>
  <text x="440" y="384" font-size="10" fill="#37474f">并联阀（平时截止，隔离时导通）</text>

  <!-- 两串联阀 -->
  <rect x="308" y="430" width="44" height="28" fill="#eef0ed" stroke="#3f4b4f" stroke-width="1.8"/>
  <line x1="330" y1="430" x2="330" y2="458" stroke="#3f4b4f" stroke-width="1.3"/>
  <text x="248" y="424" font-size="10" fill="#37474f">左串联阀</text>
  <rect x="388" y="430" width="44" height="28" fill="#eef0ed" stroke="#3f4b4f" stroke-width="1.8"/>
  <line x1="410" y1="430" x2="410" y2="458" stroke="#3f4b4f" stroke-width="1.3"/>
  <text x="446" y="452" font-size="10" fill="#37474f">右串联阀</text>

  <!-- 竖管 -->
  <line x1="330" y1="458" x2="330" y2="330" stroke="#1e88e5" stroke-width="3"/>
  <line x1="410" y1="458" x2="410" y2="300" stroke="#f39c12" stroke-width="3"/>

  <!-- 高压母管 -->
  <line x1="410" y1="300" x2="780" y2="300" stroke="#f39c12" stroke-width="3"/>
  <text x="470" y="294" font-size="9.5" fill="#6d4c41">高压母管（并联至对方机组）</text>

  <!-- 回油母管 -->
  <line x1="330" y1="330" x2="960" y2="330" stroke="#1e88e5" stroke-width="3"/>
  <text x="470" y="346" font-size="9.5" fill="#1565c0">回油母管（并联至对方机组）</text>

  <!-- 溢流阀 -->
  <rect x="734" y="252" width="54" height="34" fill="#eef0ed" stroke="#3f4b4f" stroke-width="1.8"/>
  <line x1="734" y1="269" x2="760" y2="262" stroke="#3f4b4f" stroke-width="1.3"/>
  <rect x="747" y="286" width="28" height="14" fill="#e0b52a" stroke="#3f4b4f" stroke-width="1.2"/>
  <text x="800" y="266" font-size="10" fill="#37474f">溢流阀</text>
  <text x="800" y="280" font-size="9" fill="#546e7a">限压 / 回油箱</text>

  <!-- 四缸 -->
  <g>
    <rect x="690" y="406" width="86" height="24" fill="#eef0ed" stroke="#3f4b4f" stroke-width="1.5"/>
    <rect x="690" y="406" width="20" height="24" fill="#e0b52a"/>
    <line x1="713" y1="406" x2="713" y2="430" stroke="#e53935" stroke-width="4"/>
    <line x1="712" y1="418" x2="782" y2="418" stroke="#9e9e9e" stroke-width="5"/>

    <rect x="846" y="406" width="86" height="24" fill="#eef0ed" stroke="#3f4b4f" stroke-width="1.5"/>
    <rect x="912" y="406" width="20" height="24" fill="#e0b52a"/>
    <line x1="909" y1="406" x2="909" y2="430" stroke="#e53935" stroke-width="4"/>
    <line x1="846" y1="418" x2="840" y2="418" stroke="#9e9e9e" stroke-width="5"/>

    <rect x="690" y="478" width="86" height="24" fill="#eef0ed" stroke="#3f4b4f" stroke-width="1.5"/>
    <rect x="690" y="478" width="20" height="24" fill="#e0b52a"/>
    <line x1="713" y1="478" x2="713" y2="502" stroke="#e53935" stroke-width="4"/>
    <line x1="712" y1="490" x2="782" y2="490" stroke="#9e9e9e" stroke-width="5"/>

    <rect x="846" y="478" width="86" height="24" fill="#eef0ed" stroke="#3f4b4f" stroke-width="1.5"/>
    <rect x="912" y="478" width="20" height="24" fill="#e0b52a"/>
    <line x1="909" y1="478" x2="909" y2="502" stroke="#e53935" stroke-width="4"/>
    <line x1="846" y1="490" x2="840" y2="490" stroke="#9e9e9e" stroke-width="5"/>

    <line x1="782" y1="418" x2="812" y2="446" stroke="#9e9e9e" stroke-width="4"/>
    <line x1="840" y1="418" x2="812" y2="446" stroke="#9e9e9e" stroke-width="4"/>
    <line x1="782" y1="490" x2="812" y2="462" stroke="#9e9e9e" stroke-width="4"/>
    <line x1="840" y1="490" x2="812" y2="462" stroke="#9e9e9e" stroke-width="4"/>

    <circle cx="812" cy="454" r="13" fill="rgba(120,150,120,0.95)" stroke="#2f3437" stroke-width="1.8"/>
    <circle cx="812" cy="454" r="5" fill="#414741"/>
    <text x="812" y="522" font-size="10" font-weight="bold" text-anchor="middle" fill="#33691e">舵柄 / 舵柱</text>
    <text x="812" y="576" font-size="9.5" text-anchor="middle" fill="#546e7a">四缸两推两拉 → 舵柱带动舵叶偏转</text>
  </g>

  <!-- 动力管路 -->
  <line x1="620" y1="300" x2="620" y2="418" stroke="#f39c12" stroke-width="3"/>
  <line x1="620" y1="418" x2="690" y2="418" stroke="#f39c12" stroke-width="3" marker-end="url(#oa)"/>
  <line x1="620" y1="418" x2="620" y2="490" stroke="#f39c12" stroke-width="3"/>
  <line x1="620" y1="490" x2="690" y2="490" stroke="#f39c12" stroke-width="3" marker-end="url(#oa)"/>
  <text x="628" y="404" font-size="9.5" fill="#6d4c41">动力管路（高压进左腔）</text>

  <line x1="932" y1="418" x2="960" y2="418" stroke="#1e88e5" stroke-width="3"/>
  <line x1="932" y1="490" x2="960" y2="490" stroke="#1e88e5" stroke-width="3"/>
  <line x1="960" y1="418" x2="960" y2="490" stroke="#1e88e5" stroke-width="3"/>
  <line x1="960" y1="330" x2="960" y2="418" stroke="#1e88e5" stroke-width="3"/>

  <!-- 油箱 -->
  <rect x="36" y="460" width="104" height="96" rx="5" fill="#efe9d6" stroke="#7d6b53" stroke-width="2"/>
  <rect x="42" y="508" width="92" height="42" fill="#e0b52a"/>
  <text x="88" y="482" font-size="11" font-weight="bold" text-anchor="middle" fill="#5d4037">油箱</text>
  <text x="88" y="572" font-size="9.5" text-anchor="middle" fill="#5d4037">L 油位 / T 油温</text>

  <!-- 泵与电机 -->
  <circle cx="200" cy="505" r="38" fill="#dff0e0" stroke="#3f4b4f" stroke-width="2"/>
  <path d="M185,492 L215,492 L210,508 L190,508 z" fill="#f5b041" stroke="#b9770e" stroke-width="1.2"/>
  <text x="200" y="452" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1b5e20">变量泵</text>
  <circle cx="200" cy="566" r="17" fill="#d7d9d6" stroke="#4d4f4d" stroke-width="2"/>
  <text x="200" y="571" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#263238">M</text>

  <!-- 油箱到泵、泵到四通阀 -->
  <line x1="140" y1="505" x2="160" y2="505" stroke="#f39c12" stroke-width="3"/>
  <path d="M238,505 L268,505 L268,556 L370,556 L370,524" fill="none" stroke="#f39c12" stroke-width="3" marker-end="url(#oa)"/>

  <!-- 液控四通阀 -->
  <rect x="300" y="480" width="140" height="44" fill="#eef0ed" stroke="#3f4b4f" stroke-width="2"/>
  <line x1="346" y1="480" x2="346" y2="524" stroke="#3f4b4f" stroke-width="1.3"/>
  <line x1="400" y1="480" x2="400" y2="524" stroke="#3f4b4f" stroke-width="1.3"/>
  <rect x="346" y="480" width="54" height="44" fill="rgba(46,155,75,0.22)"/>
  <text x="370" y="576" font-size="10" text-anchor="middle" fill="#37474f">液控四通阀（左位=卸荷 / 右位=工作）</text>

  <!-- 端口标注 -->
  <text x="316" y="474" font-size="9" fill="#546e7a">B</text>
  <text x="404" y="474" font-size="9" fill="#546e7a">A</text>
  <text x="376" y="540" font-size="9" fill="#546e7a">P</text>
</svg>
