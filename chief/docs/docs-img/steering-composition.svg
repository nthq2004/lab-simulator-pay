<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="470" fill="#fbfbf8"/>
  <text x="460" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#263238">图 1  液压舵机系统组成框图</text>

  <!-- 操作层 -->
  <rect x="40" y="60" width="230" height="70" rx="8" fill="#e8f1fb" stroke="#1565c0" stroke-width="2"/>
  <text x="155" y="88" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d47a1">驾驶台遥控操作面板</text>
  <text x="155" y="110" font-size="11" text-anchor="middle" fill="#1565c0">随动手轮 / NFU 开关 / 航向设定</text>

  <rect x="345" y="60" width="230" height="70" rx="8" fill="#fdf1e3" stroke="#ef6c00" stroke-width="2"/>
  <text x="460" y="88" font-size="14" font-weight="bold" text-anchor="middle" fill="#e65100">1# / 2# 舵机起动控制箱</text>
  <text x="460" y="110" font-size="11" text-anchor="middle" fill="#ef6c00">电源·备用·机旁/遥控·应急操舵</text>

  <rect x="650" y="60" width="230" height="70" rx="8" fill="#eaf6ec" stroke="#2e7d32" stroke-width="2"/>
  <text x="765" y="88" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b5e20">舵机控制遥控面板</text>
  <text x="765" y="110" font-size="11" text-anchor="middle" fill="#2e7d32">泵起停·故障/低油位·隔离阀指示</text>

  <!-- 控制层 -->
  <rect x="250" y="160" width="420" height="60" rx="8" fill="#eef0ed" stroke="#455a64" stroke-width="2"/>
  <text x="460" y="183" font-size="14" font-weight="bold" text-anchor="middle" fill="#263238">操舵控制器 / 自动舵（PID · 灵敏度 · 天气调节）</text>
  <text x="460" y="204" font-size="11" text-anchor="middle" fill="#546e7a">舵令计算、舵机选择、备用自起动、故障联锁</text>

  <!-- 液压层 -->
  <rect x="40" y="250" width="270" height="80" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="175" y="276" font-size="13" font-weight="bold" text-anchor="middle" fill="#6d4c41">液压动力单元 1# / 2#</text>
  <text x="175" y="298" font-size="11" text-anchor="middle" fill="#8d6e63">变量泵 · 伺服泵 · 电机 · 油箱</text>
  <text x="175" y="316" font-size="11" text-anchor="middle" fill="#8d6e63">油位/油温/压力检测</text>

  <rect x="330" y="250" width="270" height="80" rx="8" fill="#e8f1fb" stroke="#1565c0" stroke-width="2"/>
  <text x="465" y="276" font-size="13" font-weight="bold" text-anchor="middle" fill="#0d47a1">控制阀组</text>
  <text x="465" y="298" font-size="11" text-anchor="middle" fill="#1565c0">液控四通阀 · 卸荷阀 · 隔离阀</text>
  <text x="465" y="316" font-size="11" text-anchor="middle" fill="#1565c0">串联阀 ×2 · 并联阀 · 溢流阀</text>

  <rect x="620" y="250" width="260" height="80" rx="8" fill="#eaf6ec" stroke="#2e7d32" stroke-width="2"/>
  <text x="750" y="276" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b5e20">执行机构</text>
  <text x="750" y="298" font-size="11" text-anchor="middle" fill="#2e7d32">四只液压缸 · 舵柄 · 舵柱</text>
  <text x="750" y="316" font-size="11" text-anchor="middle" fill="#2e7d32">舵叶（力矩输出）</text>

  <!-- 反馈层 -->
  <rect x="600" y="370" width="270" height="60" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="735" y="394" font-size="13" font-weight="bold" text-anchor="middle" fill="#4a148c">反馈与显示</text>
  <text x="735" y="414" font-size="11" text-anchor="middle" fill="#6a1b9a">舵角反馈装置 · 舵角指示器 · 首向（罗经）</text>

  <!-- 箭头 -->
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#455a64"/>
    </marker>
  </defs>
  <line x1="155" y1="130" x2="330" y2="158" stroke="#455a64" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="460" y1="130" x2="460" y2="158" stroke="#455a64" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="765" y1="130" x2="590" y2="158" stroke="#455a64" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="400" y1="220" x2="230" y2="248" stroke="#455a64" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="465" y1="220" x2="465" y2="248" stroke="#455a64" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="580" y1="290" x2="618" y2="290" stroke="#455a64" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="240" y1="330" x2="240" y2="368" stroke="#455a64" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="240" y1="368" x2="200" y2="368" stroke="#455a64" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="200" y1="368" x2="200" y2="332" stroke="#455a64" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a1)"/>
  <line x1="735" y1="330" x2="735" y2="368" stroke="#6a1b9a" stroke-width="2" marker-end="url(#a1)"/>
  <text x="250" y="360" font-size="10" fill="#455a64">压力油</text>
  <path d="M870,400 L898,400 L898,192 L676,192" fill="none" stroke="#6a1b9a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a1)"/>
  <text x="820" y="188" font-size="10" text-anchor="end" fill="#6a1b9a">舵角 / 首向反馈</text>
</svg>
