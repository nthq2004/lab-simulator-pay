<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect width="780" height="470" fill="#ffffff"/>
  <text x="390" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5a">图 2  PLC 调节阀控制系统接线（ST20 + AI04/AQ04）</text>

  <!-- PLC 框 -->
  <rect x="70" y="70" width="150" height="230" fill="#f4f6f8" stroke="#2c3e50" stroke-width="2"/>
  <text x="145" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">ST20 CPU</text>
  <text x="145" y="112" text-anchor="middle" font-size="11" fill="#666">12DI / 8DO</text>

  <!-- 左侧 DI 端子 -->
  <circle cx="70" cy="150" r="4" fill="#c0392b"/><text x="48" y="154" font-size="11" fill="#333">I0.0</text>
  <circle cx="70" cy="180" r="4" fill="#c0392b"/><text x="48" y="184" font-size="11" fill="#333">I0.1</text>
  <circle cx="70" cy="210" r="4" fill="#333"/><text x="52" y="214" font-size="11" fill="#333">1M</text>
  <circle cx="70" cy="240" r="4" fill="#c0392b"/><text x="52" y="244" font-size="11" fill="#333">24V</text>
  <circle cx="70" cy="270" r="4" fill="#333"/><text x="56" y="274" font-size="11" fill="#333">0V</text>

  <!-- 右侧输出/通信 -->
  <circle cx="220" cy="150" r="4" fill="#c0392b"/><text x="228" y="154" font-size="11" fill="#333">1L+</text>
  <circle cx="220" cy="210" r="4" fill="#2c3e50"/><text x="228" y="214" font-size="11" fill="#333">LAN</text>

  <!-- 扩展模块 -->
  <rect x="280" y="110" width="90" height="140" fill="#eef2f5" stroke="#2c3e50" stroke-width="2"/>
  <text x="325" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">AI04</text>
  <text x="325" y="160" text-anchor="middle" font-size="11" fill="#666">ch0+ / ch0-</text>
  <text x="325" y="178" text-anchor="middle" font-size="11" fill="#555">AIW0</text>
  <circle cx="280" cy="200" r="4" fill="#c0392b"/>

  <rect x="390" y="110" width="90" height="140" fill="#eef2f5" stroke="#2c3e50" stroke-width="2"/>
  <text x="435" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">AQ04</text>
  <text x="435" y="160" text-anchor="middle" font-size="11" fill="#666">ch0V / ch0M</text>
  <text x="435" y="178" text-anchor="middle" font-size="11" fill="#555">AQW0</text>

  <!-- 按钮 -->
  <rect x="20" y="120" width="30" height="24" fill="#fff" stroke="#20a030" stroke-width="2"/>
  <text x="35" y="136" text-anchor="middle" font-size="10" fill="#20a030">SB1</text>
  <rect x="20" y="186" width="30" height="24" fill="#fff" stroke="#e03030" stroke-width="2"/>
  <text x="35" y="202" text-anchor="middle" font-size="10" fill="#e03030">SB2</text>

  <!-- 阀 -->
  <circle cx="640" cy="180" r="52" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
  <path d="M640 128 A52 52 0 0 1 692 180" fill="none" stroke="#2c3e50" stroke-width="10"/>
  <path d="M692 180 A52 52 0 0 1 640 232" fill="none" stroke="#2c3e50" stroke-width="10"/>
  <path d="M640 232 A52 52 0 0 1 588 180" fill="none" stroke="#2c3e50" stroke-width="10"/>
  <path d="M640 160 L640 200 L672 180 Z" fill="#11ed65" stroke="#d35400"/>
  <text x="640" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">FV 三通调节阀</text>
  <text x="640" y="288" text-anchor="middle" font-size="11" fill="#555">AQ04 ch0 4~20mA 驱动</text>

  <!-- 变送器 -->
  <rect x="560" y="330" width="160" height="90" fill="#2b3138" stroke="#12161a" stroke-width="2" rx="5"/>
  <text x="640" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#9fe0b8">阀位变送器</text>
  <text x="640" y="378" text-anchor="middle" font-size="11" fill="#4df08a">P / N 两线制</text>
  <text x="640" y="398" text-anchor="middle" font-size="11" fill="#ccc">4~20mA → AI04 ch0</text>

  <!-- 连线 -->
  <line x1="50" y1="132" x2="70" y2="150" stroke="#20a030" stroke-width="2"/>
  <line x1="50" y1="198" x2="70" y2="180" stroke="#e03030" stroke-width="2"/>
  <line x1="220" y1="150" x2="280" y2="150" stroke="#c0392b" stroke-width="2"/>
  <line x1="220" y1="210" x2="270" y2="210" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="245" y="200" text-anchor="middle" font-size="10" fill="#666">以太网</text>
  <line x1="370" y1="150" x2="390" y2="150" stroke="#2c3e50" stroke-width="2"/>
  <line x1="480" y1="160" x2="588" y2="160" stroke="#c0392b" stroke-width="2"/>
  <text x="500" y="152" font-size="11" fill="#c0392b">ch0V→l</text>
  <line x1="480" y1="200" x2="588" y2="200" stroke="#c0392b" stroke-width="2"/>
  <text x="500" y="216" font-size="11" fill="#c0392b">ch0M→r</text>
  <line x1="640" y1="232" x2="640" y2="330" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="648" y="300" font-size="11" fill="#555">阀位反馈</text>
  <line x1="560" y1="360" x2="370" y2="360" stroke="#2c3e50" stroke-width="2"/>
  <line x1="370" y1="360" x2="370" y2="200" stroke="#2c3e50" stroke-width="2"/>
  <text x="440" y="354" font-size="11" fill="#555">N → AI04 ch0+</text>

  <!-- 说明 -->
  <rect x="20" y="400" width="740" height="58" fill="#f8f9fa" stroke="#ccc"/>
  <text x="34" y="422" font-size="12" fill="#333">SB1→I0.0（增开度）  SB2→I0.1（减开度）；1M→0V（源型输入）；1L+→24V</text>
  <text x="34" y="444" font-size="12" fill="#333">AQ04 ch0（4~20mA）→ 阀 l/r；阀位变送器（4~20mA）→ AI04 ch0（AIW0，仅测量）</text>
</svg>
