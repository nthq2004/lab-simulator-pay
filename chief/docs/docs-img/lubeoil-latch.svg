<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2c3e50"/>
    </marker>
  </defs>
  <rect width="1080" height="420" fill="#fbfcfd"/>
  <text x="540" y="30" font-size="21" font-weight="bold" text-anchor="middle" fill="#1a3a5c">图 5　过载故障锁存与复位（PLC 程序实现）</text>

  <!-- 机旁面板故障信号 -->
  <rect x="40" y="80" width="200" height="70" rx="8" fill="#ecf0f1" stroke="#34495e" stroke-width="2"/>
  <text x="140" y="108" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">机旁面板「过载」触头</text>
  <text x="140" y="130" font-size="12" text-anchor="middle" fill="#607d8b">I2.0 / I2.1</text>

  <line x1="240" y1="115" x2="330" y2="115" stroke="#2c3e50" stroke-width="2.4" marker-end="url(#a3)"/>

  <!-- 置位 S -->
  <rect x="330" y="80" width="230" height="70" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="445" y="108" font-size="13" font-weight="bold" text-anchor="middle" fill="#a03020">S M10.0, 1（置位锁存）</text>
  <text x="445" y="130" font-size="12" text-anchor="middle" fill="#a03020">故障锁存 = 1</text>

  <line x1="560" y1="115" x2="650" y2="115" stroke="#2c3e50" stroke-width="2.4" marker-end="url(#a3)"/>

  <!-- 锁存结果 -->
  <rect x="650" y="70" width="390" height="90" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="845" y="98" font-size="13" font-weight="bold" text-anchor="middle" fill="#0d47a1">故障锁存 M10.0 = 1 期间</text>
  <text x="845" y="120" font-size="12.5" text-anchor="middle" fill="#0d47a1">· 遥控面板故障灯 Q0.2 常亮</text>
  <text x="845" y="140" font-size="12.5" text-anchor="middle" fill="#0d47a1">· 禁止遥控手动起动与自动起动</text>

  <!-- 复位 -->
  <rect x="40" y="250" width="260" height="80" rx="8" fill="#ecf0f1" stroke="#34495e" stroke-width="2"/>
  <text x="170" y="278" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">遥控面板「停/复位」按钮</text>
  <text x="170" y="300" font-size="12" text-anchor="middle" fill="#6078a8">I0.2 / I0.5</text>
  <text x="170" y="320" font-size="11.5" text-anchor="middle" fill="#607d8b">（对应泵的遥控面板）</text>

  <line x1="300" y1="278" x2="380" y2="278" stroke="#2c3e50" stroke-width="2.4" marker-end="url(#a3)"/>

  <rect x="380" y="240" width="250" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="505" y="268" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b5e20">R M10.0, 1（复位条件）</text>
  <text x="505" y="292" font-size="12" text-anchor="middle" fill="#1b5e20">① 按下「停/复位」</text>
  <text x="505" y="312" font-size="12" text-anchor="middle" fill="#1b5e20">② 且机旁过载信号已消失（I2.0 = 0）</text>
  <text x="505" y="332" font-size="12" text-anchor="middle" fill="#1b5e20">缺一不可</text>

  <line x1="630" y1="290" x2="720" y2="290" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#a3)"/>
  <rect x="720" y="258" width="320" height="64" rx="8" fill="#eef7ee" stroke="#43a047" stroke-width="1.6"/>
  <text x="880" y="284" font-size="13" text-anchor="middle" fill="#2e7d32">M10.0 = 0：故障灯熄灭，允许重新起动</text>
  <text x="880" y="306" font-size="12" text-anchor="middle" fill="#607d8b">（信号未消失时按停/复位无效——保持锁存）</text>

  <text x="540" y="398" font-size="12.5" text-anchor="middle" fill="#546e7a">要点：故障锁存由 PLC 程序完成，机旁信号消失后仍保持，必须人工在对应遥控面板复位。</text>
</svg>
