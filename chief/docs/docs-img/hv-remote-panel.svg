<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="820" height="420" fill="#ffffff"/>
  <text x="410" y="28" font-size="19" font-weight="bold" text-anchor="middle" fill="#1a252f">高压发电机遥控面板（监控/遥控 1# 高压发电机与真空断路器）</text>

  <rect x="60" y="55" width="700" height="320" rx="8" fill="#e3e9f0" stroke="#1a252f" stroke-width="1.5"/>

  <!-- 第一排：7 个指示灯 -->
  <g font-size="10" text-anchor="middle">
    <rect x="84" y="80" width="26" height="26" rx="3" fill="#ffffff" stroke="#333"/>
    <text x="97" y="122" fill="#333">电源</text>
    <rect x="156" y="80" width="26" height="26" rx="3" fill="#ffffff" stroke="#333"/>
    <text x="169" y="122" fill="#333">自动</text>
    <rect x="228" y="80" width="26" height="26" rx="3" fill="#7dffb0" stroke="#333"/>
    <text x="241" y="122" fill="#333">就绪</text>
    <rect x="300" y="80" width="26" height="26" rx="3" fill="#ffffff" stroke="#333"/>
    <text x="313" y="122" fill="#333">运行</text>
    <rect x="372" y="80" width="26" height="26" rx="3" fill="#2eff3e" stroke="#333"/>
    <text x="385" y="122" fill="#333">接地合</text>
    <rect x="444" y="80" width="26" height="26" rx="3" fill="#ff2d2d" stroke="#333"/>
    <text x="457" y="122" fill="#333">接地开</text>
    <rect x="516" y="80" width="26" height="26" rx="3" fill="#e03030" stroke="#333"/>
    <text x="529" y="122" fill="#333">故障</text>
  </g>

  <!-- 第二排：转换开关 + 复位 + 同步表开关 + 同步表 -->
  <g>
    <circle cx="127" cy="175" r="20" fill="#cdd8e0" stroke="#5a6a75"/>
    <line x1="127" y1="175" x2="113" y2="161" stroke="#2c3a45" stroke-width="4" stroke-linecap="round"/>
    <text x="127" y="212" font-size="11" text-anchor="middle" fill="#333">手动 · 自动</text>

    <circle cx="217" cy="175" r="20" fill="#cdd8e0" stroke="#5a6a75"/>
    <line x1="217" y1="175" x2="217" y2="158" stroke="#2c3a45" stroke-width="4" stroke-linecap="round"/>
    <text x="217" y="212" font-size="11" text-anchor="middle" fill="#333">起 · 停</text>

    <circle cx="307" cy="175" r="20" fill="#cdd8e0" stroke="#5a6a75"/>
    <line x1="307" y1="175" x2="307" y2="158" stroke="#2c3a45" stroke-width="4" stroke-linecap="round"/>
    <text x="307" y="212" font-size="11" text-anchor="middle" fill="#333">合 · 分</text>

    <circle cx="397" cy="175" r="16" fill="#cdd8e0" stroke="#5a6a75"/>
    <text x="397" y="180" font-size="10" text-anchor="middle" fill="#333">复位</text>

    <circle cx="487" cy="178" r="15" fill="#cdd8e0" stroke="#5a6a75"/>
    <line x1="487" y1="178" x2="487" y2="166" stroke="#2c3a45" stroke-width="3.5" stroke-linecap="round"/>
    <text x="487" y="212" font-size="11" text-anchor="middle" fill="#333">同步表开关</text>

    <!-- 同步表 -->
    <circle cx="650" cy="175" r="42" fill="#0d1420" stroke="#5a6a75" stroke-width="2"/>
    <path d="M 650 133 A 42 42 0 0 1 665 141" fill="none" stroke="#20a030" stroke-width="6"/>
    <line x1="650" y1="175" x2="650" y2="143" stroke="#e03030" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="650" cy="175" r="3" fill="#e03030"/>
    <text x="650" y="236" font-size="11" text-anchor="middle" fill="#333">同步表</text>
  </g>

  <!-- 第三排：带电显示器 + 自检 + 试灯 -->
  <g>
    <rect x="80" y="262" width="300" height="52" rx="5" fill="#d5dde5" stroke="#5a6a75"/>
    <text x="98" y="285" font-size="11" font-weight="bold" fill="#333">带电显示</text>
    <circle cx="180" cy="288" r="11" fill="#ffe000" stroke="#333"/>
    <text x="180" y="325" font-size="10" text-anchor="middle" fill="#333">A 黄</text>
    <circle cx="225" cy="288" r="11" fill="#2eff3e" stroke="#333"/>
    <text x="225" y="325" font-size="10" text-anchor="middle" fill="#333">B 绿</text>
    <circle cx="270" cy="288" r="11" fill="#ff2d2d" stroke="#333"/>
    <text x="270" y="325" font-size="10" text-anchor="middle" fill="#333">C 红</text>
    <circle cx="350" cy="288" r="14" fill="#2e7d32" stroke="#1a252f"/>
    <text x="350" y="292" font-size="10" text-anchor="middle" fill="#fff">自检</text>

    <!-- 试灯按钮 -->
    <circle cx="432" cy="288" r="17" fill="#cdd8e0" stroke="#5a6a75"/>
    <circle cx="432" cy="288" r="13" fill="#e03030" stroke="#8a1a1a"/>
    <text x="432" y="325" font-size="11" text-anchor="middle" fill="#333">试灯（按住全亮）</text>

    <text x="520" y="282" font-size="12" fill="#333">· 带电显示三灯：三相带电时分别点亮</text>
    <text x="520" y="304" font-size="12" fill="#333">· 自检按钮：按住点亮三灯 3 秒</text>
    <text x="520" y="326" font-size="12" fill="#333">· 试灯按钮：按住点亮全部 7 个指示灯</text>
  </g>
</svg>
