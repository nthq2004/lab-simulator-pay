<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2471a3"/></marker>
  </defs>
  <rect width="1000" height="650" fill="#fbfcfe"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#1a3a5c">图 3　主开关合不上闸的判断流程（先看储能，再查失压）</text>

  <!-- 起点 -->
  <rect x="320" y="60" width="360" height="54" rx="10" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
  <text x="500" y="93" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">主开关合不上闸（按合闸按钮不动作）</text>
  <line x1="500" y1="114" x2="500" y2="132" stroke="#2471a3" stroke-width="2"/>
  <line x1="210" y1="132" x2="790" y2="132" stroke="#2471a3" stroke-width="2"/>
  <line x1="210" y1="132" x2="210" y2="146" stroke="#2471a3" stroke-width="2" marker-end="url(#a)"/>
  <line x1="790" y1="132" x2="790" y2="146" stroke="#2471a3" stroke-width="2" marker-end="url(#a)"/>

  <!-- 左侧：流程2 -->
  <rect x="60" y="150" width="300" height="36" rx="8" fill="#eaf2fb" stroke="#2471a3" stroke-width="2"/>
  <text x="210" y="174" font-size="14" font-weight="bold" fill="#1a3a5c" text-anchor="middle">流程 2　储能电机回路不得电</text>

  <rect x="60" y="198" width="300" height="56" rx="8" fill="#ffffff" stroke="#9aa3ad"/>
  <text x="210" y="232" font-size="14" fill="#2c3e50" text-anchor="middle">① 看储能指示牌：未储能</text>

  <rect x="60" y="272" width="300" height="72" rx="8" fill="#ffffff" stroke="#9aa3ad"/>
  <text x="210" y="300" font-size="14" fill="#2c3e50" text-anchor="middle">② 查储能电机回路：</text>
  <text x="210" y="324" font-size="13" fill="#2c3e50" text-anchor="middle">控制电源 → 接线 → 电机线圈</text>

  <rect x="60" y="362" width="300" height="88" rx="8" fill="#fef9e7" stroke="#b7950b"/>
  <text x="210" y="390" font-size="13" fill="#7d6608" text-anchor="middle">③ 万用表测储能电机线圈电阻</text>
  <text x="210" y="412" font-size="12" fill="#7d6608" text-anchor="middle">先断控制电源，再断开与 24V 正极的接线</text>
  <text x="210" y="434" font-size="12" fill="#7d6608" text-anchor="middle">（隔离并联回路）</text>

  <rect x="60" y="468" width="300" height="72" rx="8" fill="#fdedec" stroke="#c0392b"/>
  <text x="210" y="496" font-size="13" fill="#922b21" text-anchor="middle">④ 约 10kΩ / O.L（正常 0.2kΩ）</text>
  <text x="210" y="520" font-size="13" fill="#922b21" text-anchor="middle">→ 线圈接触不良 / 断线</text>

  <rect x="60" y="558" width="300" height="56" rx="8" fill="#eafaf1" stroke="#148f77"/>
  <text x="210" y="592" font-size="14" font-weight="bold" fill="#0e6251" text-anchor="middle">⑤ 修复 → 储能到位 → 合闸成功</text>

  <line x1="210" y1="254" x2="210" y2="270" stroke="#2471a3" stroke-width="2" marker-end="url(#a)"/>
  <line x1="210" y1="344" x2="210" y2="360" stroke="#2471a3" stroke-width="2" marker-end="url(#a)"/>
  <line x1="210" y1="450" x2="210" y2="466" stroke="#2471a3" stroke-width="2" marker-end="url(#a)"/>
  <line x1="210" y1="540" x2="210" y2="556" stroke="#2471a3" stroke-width="2" marker-end="url(#a)"/>

  <!-- 右侧：流程3 -->
  <rect x="640" y="150" width="300" height="36" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="790" y="174" font-size="14" font-weight="bold" fill="#922b21" text-anchor="middle">流程 3　失压线圈断线</text>

  <rect x="640" y="198" width="300" height="56" rx="8" fill="#ffffff" stroke="#9aa3ad"/>
  <text x="790" y="232" font-size="14" fill="#2c3e50" text-anchor="middle">① 看储能指示牌：已储能</text>

  <rect x="640" y="272" width="300" height="72" rx="8" fill="#ffffff" stroke="#9aa3ad"/>
  <text x="790" y="300" font-size="13" fill="#2c3e50" text-anchor="middle">② 按合闸：储能释放却不合闸</text>
  <text x="790" y="324" font-size="13" fill="#2c3e50" text-anchor="middle">失压脱扣器不吸合</text>

  <rect x="640" y="362" width="300" height="88" rx="8" fill="#fef9e7" stroke="#b7950b"/>
  <text x="790" y="392" font-size="13" fill="#7d6608" text-anchor="middle">③ 万用表测失压线圈电阻</text>
  <text x="790" y="414" font-size="12" fill="#7d6608" text-anchor="middle">先断控制电源</text>
  <text x="790" y="434" font-size="12" fill="#7d6608" text-anchor="middle">并断开储能电机接线（排除并联）</text>

  <rect x="640" y="468" width="300" height="72" rx="8" fill="#fdedec" stroke="#c0392b"/>
  <text x="790" y="496" font-size="13" fill="#922b21" text-anchor="middle">④ O.L（正常约 2kΩ）</text>
  <text x="790" y="520" font-size="13" fill="#922b21" text-anchor="middle">→ 失压线圈断线</text>

  <rect x="640" y="558" width="300" height="56" rx="8" fill="#eafaf1" stroke="#148f77"/>
  <text x="790" y="592" font-size="14" font-weight="bold" fill="#0e6251" text-anchor="middle">⑤ 修复 → 失压吸合 → 合闸成功</text>

  <line x1="790" y1="254" x2="790" y2="270" stroke="#2471a3" stroke-width="2" marker-end="url(#a)"/>
  <line x1="790" y1="344" x2="790" y2="360" stroke="#2471a3" stroke-width="2" marker-end="url(#a)"/>
  <line x1="790" y1="450" x2="790" y2="466" stroke="#2471a3" stroke-width="2" marker-end="url(#a)"/>
  <line x1="790" y1="540" x2="790" y2="556" stroke="#2471a3" stroke-width="2" marker-end="url(#a)"/>
</svg>
