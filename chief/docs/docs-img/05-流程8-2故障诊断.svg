<svg xmlns="http://www.w3.org/2000/svg" width="920" height="700" viewBox="0 0 920 700" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="m5" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker>
  </defs>
  <rect width="920" height="700" fill="#f7fafc"/>
  <text x="460" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a365d">流程 8.2　监测系统模块、通道故障判定和处理</text>
  <text x="460" y="48" text-anchor="middle" font-size="11" fill="#718096">教学目标：定位"通道级"故障 —— 不停机、在线切换到备用通道</text>

  <!-- 1 / 2 -->
  <rect x="60" y="66" width="380" height="56" rx="7" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="76" y="88" font-size="12.5" font-weight="bold" fill="#2b6cb0">第 1 步　识别部件</text>
  <text x="76" y="108" font-size="11" fill="#2c5282">AI 输入模块 · 液位系统 · 中央监控计算机</text>

  <rect x="480" y="66" width="380" height="56" rx="7" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="496" y="88" font-size="12.5" font-weight="bold" fill="#22543d">第 2 步　一键起动系统</text>
  <text x="496" y="108" font-size="11" fill="#276749">接线 → 上电 → 遥控 → 自动，无报警基线</text>
  <line x1="440" y1="94" x2="480" y2="94" stroke="#4a5568" stroke-width="2" marker-end="url(#m5)"/>

  <!-- 3 -->
  <rect x="60" y="146" width="800" height="56" rx="7" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
  <text x="76" y="168" font-size="12.5" font-weight="bold" fill="#c53030">第 3 步　注入故障：「故障设置」→「DPU 输入通道故障」→ 应用设置</text>
  <text x="76" y="188" font-size="11" fill="#742a2a">故障本质：AI 模块某一路输入回路开路（对应通道显示 OPEN），模块与总线通信仍正常</text>
  <line x1="440" y1="122" x2="440" y2="146" stroke="#4a5568" stroke-width="2" marker-end="url(#m5)"/>

  <!-- 4 -->
  <rect x="60" y="226" width="800" height="52" rx="7" fill="#fffaf0" stroke="#c05621" stroke-width="2"/>
  <text x="76" y="248" font-size="12.5" font-weight="bold" fill="#7b341e">第 4 步　查看报警，消音、确认</text>
  <text x="76" y="268" font-size="11" fill="#975a16">与 8.1 的区别：此时节点仍在线，报警来自<b>通道级</b>异常而非通信中断</text>
  <line x1="440" y1="202" x2="440" y2="226" stroke="#4a5568" stroke-width="2" marker-end="url(#m5)"/>

  <!-- 5 -->
  <rect x="60" y="302" width="800" height="70" rx="7" fill="#e9d8fd" stroke="#805ad5" stroke-width="2.5"/>
  <text x="76" y="326" font-size="13" font-weight="bold" fill="#553c9a">第 5 步　进入「AI 设置」页确认故障通道</text>
  <text x="76" y="350" font-size="11.5" fill="#44337a">CH1 状态显示 <b>OPEN</b>（开路）　·　工程量显示 <b>---</b>（无法换算）</text>
  <text x="76" y="366" font-size="11" fill="#553c9a">确认故障被限制在单个通道，模块本体、总线链路完好</text>
  <line x1="440" y1="278" x2="440" y2="302" stroke="#805ad5" stroke-width="2.5" marker-end="url(#m5)"/>

  <!-- 6 核心 -->
  <rect x="60" y="396" width="800" height="126" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2.5"/>
  <text x="76" y="420" font-size="13" font-weight="bold" fill="#553c9a">第 6 步（核心）　禁用故障通道，启用备用通道，并改接信号</text>
  <text x="76" y="444" font-size="11.5" fill="#44337a">① 点击 CH1 的 Mode 旋钮 → 切到 <b>disable</b>（隔离故障通道）</text>
  <text x="76" y="466" font-size="11.5" fill="#44337a">② 改接线：液位变送器 P(+) → AI CH2(+)　·　液位变送器 N(−) → AI CH2(−)</text>
  <text x="76" y="488" font-size="11.5" fill="#44337a">③ 点击备用通道 CH2 的 Mode 旋钮 → 切到 <b>normal</b>（启用备用）</text>
  <text x="76" y="510" font-size="11" fill="#553c9a">关键：全程不停机，只在通道粒度上做隔离与切换</text>
  <line x1="440" y1="372" x2="440" y2="396" stroke="#805ad5" stroke-width="2.5" marker-end="url(#m5)"/>

  <!-- 7 -->
  <rect x="60" y="546" width="800" height="54" rx="7" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="76" y="568" font-size="12.5" font-weight="bold" fill="#2b6cb0">第 7 步　液位控制页：输入通道切换</text>
  <text x="76" y="588" font-size="11" fill="#2c5282">点击低电平（LT）输入通道的 CH2 按钮，由 CH1 切换到 CH2</text>
  <line x1="440" y1="522" x2="440" y2="546" stroke="#4a5568" stroke-width="2" marker-end="url(#m5)"/>

  <!-- 8 -->
  <rect x="60" y="614" width="800" height="54" rx="7" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="76" y="636" font-size="12.5" font-weight="bold" fill="#22543d">第 8 步　回「监测报警」页清除报警，系统由备用通道维持正常运行</text>
  <text x="76" y="656" font-size="11" fill="#276749">验证：液位测量恢复、报警消除、CAN BUS ONLINE 保持</text>
  <line x1="440" y1="600" x2="440" y2="614" stroke="#4a5568" stroke-width="2" marker-end="url(#m5)"/>
</svg>
