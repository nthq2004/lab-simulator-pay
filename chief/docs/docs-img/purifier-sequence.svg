  <text x="164" y="236" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="normal" fill="#78909c" text-anchor="start">START_SEQ：先排掉上次残留的渣与水 → 用密封水关闭分离筒 → 建立水封，为进油做准备</text>
