  <text x="164" y="636" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="normal" fill="#78909c" text-anchor="start">STOPPING → STANDSTILL：转速降到 0、程序结束，才能复位报警或重新起动</text>
  <rect x="24" y="664" width="952" height="26" rx="5" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.2"/>
  <text x="44" y="682" font-family="Microsoft YaHei, Arial" font-size="11.5" font-weight="bold" fill="#1b5e20" text-anchor="start">时序名称、各段时长（Ti 参数）均可在 EPC-60 参数菜单中修改；仿真 1× 实时运行时，Ti68 默认 5 min 排渣一次。</text>
