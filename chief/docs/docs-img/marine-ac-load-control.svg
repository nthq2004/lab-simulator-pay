<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect width="960" height="660" fill="#f7f9fb"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#2c3e50">图 4　自动负荷控制原理与两路膨胀阀投切</text>

  <!-- 公式条 -->
  <rect x="24" y="44" width="912" height="82" rx="8" fill="#fffde7" stroke="#f9a825"/>
  <text x="40" y="68" font-size="13" font-weight="bold" fill="#795548">自动负荷率（由舱温偏差自动决定）</text>
  <text x="40" y="93" font-size="14" fill="#1b5e20">负荷率 = 35% +（舱温 − 启动温度）/ 切换区宽 × 60%　　（限幅 20% ~ 100%）</text>
  <text x="40" y="115" font-size="12" fill="#5d4037">切换区宽 = max(2, 启动温度 − 停止温度 + 4)：偏差越大 → 负荷率越高 → 投入的制冷能力越强</text>

  <!-- 曲线图 -->
  <line x1="140" y1="400" x2="580" y2="400" stroke="#546e7a" stroke-width="1.6"/>
  <line x1="140" y1="400" x2="140" y2="160" stroke="#546e7a" stroke-width="1.6"/>
  <text x="52" y="300" font-size="12" fill="#37474f" transform="rotate(-90 52 300)">负荷率 (%)</text>
  <text x="580" y="424" font-size="12" text-anchor="end" fill="#37474f">舱温 − 启动温度 (℃)</text>

  <g stroke="#cfd8dc" stroke-width="1">
    <line x1="140" y1="352" x2="580" y2="352"/>
    <line x1="140" y1="304" x2="580" y2="304"/>
    <line x1="140" y1="256" x2="580" y2="256"/>
    <line x1="140" y1="208" x2="580" y2="208"/>
    <line x1="140" y1="160" x2="580" y2="160"/>
  </g>
  <g font-size="11" fill="#607d8b">
    <text x="132" y="404" text-anchor="end">0</text>
    <text x="132" y="356" text-anchor="end">20</text>
    <text x="132" y="308" text-anchor="end">40</text>
    <text x="132" y="260" text-anchor="end">60</text>
    <text x="132" y="212" text-anchor="end">80</text>
    <text x="132" y="164" text-anchor="end">100</text>
    <text x="140" y="416" text-anchor="middle">0</text>
    <text x="224" y="416" text-anchor="middle">2</text>
    <text x="308" y="416" text-anchor="middle">4</text>
    <text x="392" y="416" text-anchor="middle">6</text>
    <text x="476" y="416" text-anchor="middle">8</text>
    <text x="560" y="416" text-anchor="middle">10</text>
  </g>

  <path d="M140,316 L413,160 L560,160" fill="none" stroke="#c62828" stroke-width="2.4"/>
  <circle cx="140" cy="316" r="3.5" fill="#c62828"/>
  <circle cx="413" cy="160" r="3.5" fill="#c62828"/>

  <line x1="140" y1="280" x2="580" y2="280" stroke="#2e7d32" stroke-width="1.8" stroke-dasharray="7 5"/>

  <rect x="146" y="138" width="52" height="20" rx="4" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="172" y="152" font-size="11" text-anchor="middle" fill="#0d47a1">仅 A</text>
  <rect x="208" y="138" width="68" height="20" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="242" y="152" font-size="11" text-anchor="middle" fill="#1b5e20">A + B</text>
  <text x="428" y="152" font-size="11.5" fill="#c62828">满负荷 100%（限幅）</text>
  <text x="588" y="276" font-size="12" fill="#1b5e20">50% 负荷门槛</text>
  <text x="588" y="294" font-size="12" fill="#1b5e20">→ 加投膨胀阀 B</text>
  <text x="588" y="330" font-size="11.5" fill="#607d8b">舱温偏差越大</text>
  <text x="588" y="348" font-size="11.5" fill="#607d8b">负荷率越高</text>

  <!-- 两路膨胀阀投切 -->
  <rect x="24" y="440" width="440" height="196" rx="8" fill="#ffffff" stroke="#b0bec5"/>
  <text x="40" y="466" font-size="13.5" font-weight="bold" fill="#0d47a1">两路膨胀阀按负荷投切</text>
  <text x="40" y="492" font-size="12" fill="#263238">• 轻载（负荷率 &lt; 50%）：只投小容量膨胀阀 A</text>
  <text x="52" y="510" font-size="11.5" fill="#607d8b">供液量小，与蒸发器换热能力匹配、过热度稳定</text>
  <text x="40" y="536" font-size="12" fill="#263238">• 负荷升高（负荷率 ≥ 50%）：加投大容量膨胀阀 B</text>
  <text x="52" y="554" font-size="11.5" fill="#607d8b">两路并联供液，避免蒸发器供液不足、过热度偏大</text>
  <text x="40" y="580" font-size="12" fill="#263238">• 投入前提：控制器工作 + 有制冷需求 + 进 / 出口截止阀开启</text>
  <text x="40" y="600" font-size="12" fill="#263238">• 总回路电磁阀：任一膨胀阀投入即接通（A 故障时 B 仍可供液）</text>
  <text x="40" y="624" font-size="12" font-weight="bold" fill="#c62828">故障判别：A 阀堵塞 → 轻载流量极小 → 舱温不降反升</text>

  <!-- 与双位控制、压力继电器的配合 -->
  <rect x="484" y="440" width="452" height="196" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="500" y="466" font-size="13.5" font-weight="bold" fill="#1b5e20">与舱温双位控制、压力继电器的配合</text>
  <text x="500" y="492" font-size="12" fill="#263238">① 舱温 ≥ 启动温度 → 制冷需求 = 1（投入供液）</text>
  <text x="512" y="510" font-size="11.5" fill="#607d8b">舱温 ≤ 停止温度 → 需求 = 0（停止）；两值之间保持原状态</text>
  <text x="500" y="536" font-size="12" fill="#263238">② 需求为 1 时，负荷率决定制冷能力与膨胀阀投切</text>
  <text x="500" y="562" font-size="12" fill="#263238">③ 压缩机自动：吸入压力 &gt; 启动压力 → 延时约 4s 起动</text>
  <text x="512" y="580" font-size="11.5" fill="#607d8b">吸入压力 &lt;（启动压力 − 切换差）→ 延时约 5s 停机</text>
  <text x="500" y="606" font-size="12" fill="#263238">④ 舱温在「启动温度 ~ 停止温度」之间往复波动，</text>
  <text x="500" y="624" font-size="12" font-weight="bold" fill="#1b5e20">回差使压缩机不会在阈值附近反复动作</text>
</svg>
