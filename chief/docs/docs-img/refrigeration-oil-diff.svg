<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="bold" fill="#102a43">油压差保护原理（滑油压力低保护）</text>

  <!-- 左：油系统示意 -->
  <rect x="40" y="60" width="470" height="330" fill="#fbfdff" stroke="#b3d4f0" stroke-width="1.5" rx="8"/>
  <text x="275" y="86" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#0d47a1">油路与压力取点</text>

  <!-- 曲轴箱 -->
  <rect x="70" y="200" width="150" height="120" fill="#c2c8ce" stroke="#6d747a" stroke-width="2" rx="8"/>
  <text x="145" y="240" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#263238">曲轴箱</text>
  <rect x="86" y="256" width="42" height="52" fill="#20262b" stroke="#111" stroke-width="1.5"/>
  <rect x="86" y="278" width="42" height="30" fill="#f2a30f"/>
  <text x="150" y="300" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#37474f">滑油</text>

  <!-- 油泵 -->
  <circle cx="330" cy="260" r="42" fill="#d7dbe0" stroke="#6d747a" stroke-width="2"/>
  <text x="330" y="256" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#263238">滑油</text>
  <text x="330" y="274" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#263238">泵</text>

  <!-- 管路 -->
  <line x1="220" y1="260" x2="288" y2="260" stroke="#f2a30f" stroke-width="6"/>
  <line x1="372" y1="260" x2="480" y2="260" stroke="#f2a30f" stroke-width="6"/>
  <text x="424" y="248" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#b8860b">p油(油压)</text>

  <!-- 取压点 -->
  <line x1="145" y1="200" x2="145" y2="150" stroke="#8e3fb5" stroke-width="4"/>
  <text x="152" y="146" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#6a1b9a">p吸(吸入压力)</text>

  <!-- 压差继电器 -->
  <rect x="240" y="96" width="190" height="72" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="8"/>
  <text x="335" y="122" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#1b5e20">油压差继电器</text>
  <text x="335" y="146" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1b5e20">Δp = p油 − p吸</text>
  <line x1="145" y1="150" x2="240" y2="128" stroke="#8e3fb5" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="470" y1="260" x2="470" y2="132" stroke="#f2a30f" stroke-width="3"/>
  <line x1="470" y1="132" x2="430" y2="132" stroke="#f2a30f" stroke-width="3"/>

  <!-- 报警/停机输出 -->
  <line x1="335" y1="96" x2="335" y2="72" stroke="#e53935" stroke-width="3"/>
  <text x="345" y="68" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#c62828">报警 / 保护停机</text>

  <!-- 右：判据 -->
  <rect x="530" y="60" width="330" height="330" fill="#fffdf7" stroke="#f0c37a" stroke-width="1.5" rx="8"/>
  <text x="695" y="88" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#8a5a00">动作判据与现象</text>

  <rect x="552" y="106" width="286" height="66" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="6"/>
  <text x="564" y="130" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#1b5e20">正常：Δp ≥ 0.8 bar</text>
  <text x="564" y="152" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#37474f">油泵供油正常，各摩擦面得到润滑与冷却</text>

  <rect x="552" y="182" width="286" height="66" fill="#ffebee" stroke="#c62828" stroke-width="1.5" rx="6"/>
  <text x="564" y="206" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#b71c1c">异常：Δp &lt; 0.8 bar</text>
  <text x="564" y="228" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#37474f">「压缩机滑油压力低」报警 → 保护停机（锁存）</text>

  <rect x="552" y="258" width="286" height="112" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5" rx="6"/>
  <text x="564" y="282" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#37474f">常见诱因</text>
  <text x="564" y="304" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#37474f">· 曲轴箱滑油量不足（油位过低、漏油）</text>
  <text x="564" y="326" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#37474f">· 油泵故障、油过滤器堵塞、油管漏气</text>
  <text x="564" y="348" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#37474f">· 油液分离器回油不畅（油位低、回油电磁阀故障）</text>

  <!-- 流程条 -->
  <rect x="40" y="406" width="820" height="98" fill="#f7fbff" stroke="#b3d4f0" stroke-width="1.5" rx="6"/>
  <text x="54" y="430" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#102a43"><tspan font-weight="bold">动作链：</tspan>滑油量不足/油泵失效 → 油压 p油下降 → 油压差 Δp = p油 − p吸 减小 → 低于整定值（0.8 bar）</text>
  <text x="54" y="454" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#102a43">→ 「压缩机滑油压力低」报警灯亮 → 保护继电器动作，压缩机强制停机并锁存（需按「复位」清除）</text>
  <text x="54" y="480" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#607d8b">本仿真操作：开启滑油出口截止阀放油（压缩机滑油液位 −1.5%/s）或关闭回油电磁阀，使液位 &lt; 15% 即触发该保护。</text>
</svg>
