<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="940" height="520" fill="#f7fafc"/>
  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a365d">船舶甲板机械电气拖动系统组成</text>
  <text x="470" y="54" text-anchor="middle" font-size="11.5" fill="#718096">电源 → 控制 → 执行 → 传动 → 负载，另配制动与保护环节；断续、重载、频繁起制动是甲板机械的共同特点</text>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a5568"/>
    </marker>
  </defs>

  <!-- 主链 -->
  <rect x="30" y="90" width="150" height="96" rx="8" fill="#e6f0f5" stroke="#2c5a7a" stroke-width="2"/>
  <text x="105" y="120" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a365d">电源</text>
  <text x="105" y="142" text-anchor="middle" font-size="10" fill="#555">主电路 AC380V/50Hz</text>
  <text x="105" y="160" text-anchor="middle" font-size="10" fill="#555">控制电源（降压整流）</text>

  <rect x="220" y="90" width="170" height="96" rx="8" fill="#f2f0ea" stroke="#8a8578" stroke-width="2"/>
  <text x="305" y="120" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#444">控制环节</text>
  <text x="305" y="142" text-anchor="middle" font-size="10" fill="#555">主令控制器发出方向/速度指令</text>
  <text x="305" y="160" text-anchor="middle" font-size="10" fill="#555">接触器-继电器逻辑、联锁</text>

  <rect x="430" y="90" width="150" height="96" rx="8" fill="#eef2f7" stroke="#4a6a8a" stroke-width="2"/>
  <text x="505" y="120" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#27496d">执行电动机</text>
  <text x="505" y="142" text-anchor="middle" font-size="10" fill="#555">变极 / 变频 / 绕线转子</text>
  <text x="505" y="160" text-anchor="middle" font-size="10" fill="#555">三相异步电动机</text>

  <rect x="620" y="90" width="130" height="96" rx="8" fill="#e8f0f7" stroke="#5a7a9a" stroke-width="2"/>
  <text x="685" y="120" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#27496d">传动机构</text>
  <text x="685" y="142" text-anchor="middle" font-size="10" fill="#555">减速箱、卷筒、</text>
  <text x="685" y="160" text-anchor="middle" font-size="10" fill="#555">锚链轮、滚筒</text>

  <rect x="790" y="90" width="120" height="96" rx="8" fill="#eaf5ec" stroke="#3a7a4a" stroke-width="2"/>
  <text x="850" y="120" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#205a30">负载</text>
  <text x="850" y="142" text-anchor="middle" font-size="10" fill="#555">锚与锚链、缆绳</text>
  <text x="850" y="160" text-anchor="middle" font-size="10" fill="#555">货物、舵叶</text>

  <line x1="180" y1="138" x2="218" y2="138" stroke="#4a5568" stroke-width="2.4" marker-end="url(#a1)"/>
  <line x1="390" y1="138" x2="428" y2="138" stroke="#4a5568" stroke-width="2.4" marker-end="url(#a1)"/>
  <line x1="580" y1="138" x2="618" y2="138" stroke="#4a5568" stroke-width="2.4" marker-end="url(#a1)"/>
  <line x1="750" y1="138" x2="788" y2="138" stroke="#4a5568" stroke-width="2.4" marker-end="url(#a1)"/>

  <!-- 制动环节 -->
  <rect x="430" y="230" width="300" height="86" rx="8" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
  <text x="580" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#922b21">电磁制动器（失电制动）</text>
  <text x="580" y="280" text-anchor="middle" font-size="10" fill="#7b241c">断电弹簧抱闸 → 安全；得电电磁松闸 → 运行</text>
  <text x="580" y="300" text-anchor="middle" font-size="10" fill="#7b241c">装于电机轴或卷筒轴，ZDQ 线圈受 ZDC 接触器控制</text>
  <line x1="505" y1="186" x2="505" y2="228" stroke="#c0392b" stroke-width="2.2" marker-end="url(#a1)"/>
  <line x1="685" y1="228" x2="685" y2="190" stroke="#c0392b" stroke-width="2.2" marker-end="url(#a1)"/>
  <text x="700" y="212" font-size="10" fill="#c0392b">制动/抱闸</text>

  <!-- 保护环节 -->
  <rect x="30" y="230" width="360" height="200" rx="8" fill="#ebf8ff" stroke="#63b3ed" stroke-width="1.5"/>
  <text x="52" y="256" font-size="12.5" font-weight="bold" fill="#2c5282">电气保护环节（缺一不可）</text>
  <text x="52" y="282" font-size="11" fill="#2c5282">① 零压（失压）保护：LYJ 零压继电器，失压即释放，全机停机；</text>
  <text x="52" y="306" font-size="11" fill="#2c5282">② 零位保护：手柄不在零位无法启动，LYJ 不得电；</text>
  <text x="52" y="330" font-size="11" fill="#2c5282">③ 过载保护：热继电器 1KR / 2KR，长时过载脱扣；</text>
  <text x="52" y="354" font-size="11" fill="#2c5282">④ 过流保护：GLJ 过流继电器 + 2SJ 延时 + DJ 跳闸闭锁；</text>
  <text x="52" y="378" font-size="11" fill="#2c5282">⑤ 互锁与限位：正反转互锁、速度互锁、行程限位。</text>
  <text x="52" y="408" font-size="10.5" fill="#3178a8">保护动作 → 切断控制回路 → 电机断电 → 制动器失电抱闸。</text>

  <rect x="760" y="230" width="150" height="200" rx="8" fill="#f7f3e8" stroke="#b08a3a" stroke-width="1.5"/>
  <text x="835" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a1a">负载特点</text>
  <text x="775" y="282" font-size="10.5" fill="#6a5a2a">· 断续、重载工作制</text>
  <text x="775" y="304" font-size="10.5" fill="#6a5a2a">· 起制动频繁</text>
  <text x="775" y="326" font-size="10.5" fill="#6a5a2a">· 位能负载（下放）</text>
  <text x="775" y="348" font-size="10.5" fill="#6a5a2a">· 常有堵转工况</text>
  <text x="775" y="370" font-size="10.5" fill="#6a5a2a">· 环境潮湿、盐雾、</text>
  <text x="775" y="390" font-size="10.5" fill="#6a5a2a">  摇摆振动</text>
  <text x="775" y="416" font-size="10.5" fill="#6a5a2a">→ 高防护、高可靠</text>
</svg>
