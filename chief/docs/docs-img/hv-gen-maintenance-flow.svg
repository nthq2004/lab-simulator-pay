<svg xmlns="http://www.w3.org/2000/svg" width="940" height="590" viewBox="0 0 940 590" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="940" height="590" fill="#ffffff"/>
  <text x="470" y="28" font-size="19" font-weight="bold" text-anchor="middle" fill="#1a252f">高压发电机检修流程</text>

  <!-- 左侧流程 -->
  <text x="250" y="58" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">检修（由运行转检修）</text>

  <g font-size="12.5" fill="#1a252f">
    <rect x="70" y="72"  width="360" height="32" rx="5" fill="#fdeaea" stroke="#c0392b"/>
    <text x="86" y="93">① 遥控分断发电机主开关（机组与电网解列）</text>

    <rect x="70" y="118" width="360" height="32" rx="5" fill="#fdeaea" stroke="#c0392b"/>
    <text x="86" y="139">② 遥控停止发电机组（原动机停机）</text>

    <rect x="70" y="164" width="360" height="32" rx="5" fill="#fdeaea" stroke="#c0392b"/>
    <text x="86" y="185">③ 切断励磁、灭磁；控制方式由遥控转"本地"</text>

    <rect x="70" y="210" width="360" height="32" rx="5" fill="#eef2f5" stroke="#5a6a75"/>
    <text x="86" y="231">④ 用高压验电器对发电机出线 U/V/W 逐相验电</text>

    <rect x="70" y="256" width="360" height="32" rx="5" fill="#eef2f5" stroke="#5a6a75"/>
    <text x="86" y="277">⑤ 用放电棒对出线放电，泄放残余电荷</text>

    <rect x="70" y="302" width="360" height="32" rx="5" fill="#eef2f5" stroke="#5a6a75"/>
    <text x="86" y="323">⑥ 将真空断路器手车摇到试验位（一次隔离断开）</text>

    <rect x="70" y="348" width="360" height="32" rx="5" fill="#eef2f5" stroke="#5a6a75"/>
    <text x="86" y="369">⑦ 打开接地开关电磁锁，摇 5 圈合上接地开关</text>

    <rect x="70" y="394" width="360" height="32" rx="5" fill="#eef2f5" stroke="#5a6a75"/>
    <text x="86" y="415">⑧ 打开柜门（接地后方可开门），进行检修</text>

    <rect x="70" y="440" width="360" height="32" rx="5" fill="#eaf3ea" stroke="#20a030"/>
    <text x="86" y="461">⑨ 必要时测量绝缘电阻（兆欧表 L→出线、E→地）</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#7a8494" stroke-width="2" fill="#7a8494">
    <line x1="250" y1="104" x2="250" y2="118"/><polygon points="250,120 245,110 255,110"/>
    <line x1="250" y1="150" x2="250" y2="164"/><polygon points="250,166 245,156 255,156"/>
    <line x1="250" y1="196" x2="250" y2="210"/><polygon points="250,212 245,202 255,202"/>
    <line x1="250" y1="242" x2="250" y2="256"/><polygon points="250,258 245,248 255,248"/>
    <line x1="250" y1="288" x2="250" y2="302"/><polygon points="250,304 245,294 255,294"/>
    <line x1="250" y1="334" x2="250" y2="348"/><polygon points="250,350 245,340 255,340"/>
    <line x1="250" y1="380" x2="250" y2="394"/><polygon points="250,396 245,386 255,386"/>
    <line x1="250" y1="426" x2="250" y2="440"/><polygon points="250,442 245,432 255,432"/>
  </g>

  <!-- 右侧：要点 + 复役 -->
  <g>
    <rect x="460" y="72" width="450" height="246" rx="6" fill="#f7f9fb" stroke="#b0bcc4"/>
    <text x="480" y="98" font-size="14" font-weight="bold" fill="#1a252f">发电机检修安全要点</text>
    <g font-size="12.5" fill="#333">
      <text x="480" y="126">· 停机后必须先灭磁，定子才会无电压输出</text>
      <text x="480" y="152">· 验电应逐相进行（U、V、W），可用高压验电器声光报警判断</text>
      <text x="480" y="178">· 验电前先用有电设备验证验电器良好；戴绝缘手套、验电器接地</text>
      <text x="480" y="204">· 放电棒先接地、再触碰带电体，泄放残余电荷</text>
      <text x="480" y="230">· 必须在发电机出线可靠接地（合接地开关）后方可作业</text>
      <text x="480" y="256">· 测量绝缘时，L 端接发电机出线、E 端接地，摇表读数记录后再恢复</text>
      <text x="480" y="282" fill="#c0392b">· 检修期间断路器禁止合闸，手车禁止摇回工作位（五防④）</text>
      <text x="480" y="308" fill="#c0392b">· 设专人监护，悬挂标示牌、装设遮栏</text>
    </g>

    <rect x="460" y="330" width="450" height="142" rx="6" fill="#eef7ee" stroke="#20a030"/>
    <text x="480" y="354" font-size="13.5" font-weight="bold" fill="#1b7a1b">复役（由检修转运行，逆顺序）</text>
    <g font-size="12" fill="#333">
      <text x="480" y="380">① 逆时针摇 5 圈断开接地开关、拆除接地，关闭柜门</text>
      <text x="480" y="402">② 将手车摇到试验位 → 再摇到工作位（一次接通）</text>
      <text x="480" y="424">③ 投入励磁、控制方式转"遥控"</text>
      <text x="480" y="446">④ 遥控起动机组 → 建压正常 → 合闸并网（必要时准同步）</text>
    </g>
  </g>
</svg>
