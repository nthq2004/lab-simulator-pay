<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2471a3"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/></marker>
  </defs>
  <rect width="1000" height="620" fill="#fbfcfe"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#1a3a5c">图 2　船用框架式主开关（ACB）的结构与控制线圈功能</text>

  <!-- 中央本体 -->
  <rect x="380" y="110" width="240" height="320" rx="12" fill="#eef1f8" stroke="#5a6470" stroke-width="2"/>
  <text x="500" y="142" font-size="16" font-weight="bold" fill="#2c3e50" text-anchor="middle">船用框架式空气断路器</text>
  <line x1="400" y1="154" x2="600" y2="154" stroke="#8898b0" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="405" y="172" width="190" height="34" rx="6" fill="#ffffff" stroke="#9aa3ad"/>
  <text x="500" y="194" font-size="14" fill="#2c3e50" text-anchor="middle">主触头（3 对 L—T）</text>
  <rect x="405" y="216" width="190" height="34" rx="6" fill="#ffffff" stroke="#9aa3ad"/>
  <text x="500" y="238" font-size="14" fill="#2c3e50" text-anchor="middle">主轴</text>
  <rect x="405" y="260" width="190" height="34" rx="6" fill="#ffffff" stroke="#9aa3ad"/>
  <text x="500" y="282" font-size="14" fill="#2c3e50" text-anchor="middle">储能弹簧 / 合闸弹簧</text>
  <rect x="405" y="304" width="190" height="34" rx="6" fill="#ffffff" stroke="#9aa3ad"/>
  <text x="500" y="326" font-size="14" fill="#2c3e50" text-anchor="middle">脱扣轴</text>
  <rect x="405" y="348" width="190" height="34" rx="6" fill="#ffffff" stroke="#9aa3ad"/>
  <text x="500" y="370" font-size="14" fill="#2c3e50" text-anchor="middle">分闸弹簧</text>
  <text x="500" y="414" font-size="12" fill="#7a7f8a" text-anchor="middle">储能手柄（手动储能）</text>

  <!-- 左侧：储能电机、合闸线圈 -->
  <rect x="50" y="120" width="240" height="96" rx="10" fill="#e8f6f3" stroke="#148f77" stroke-width="2"/>
  <text x="170" y="150" font-size="15" font-weight="bold" fill="#0e6251" text-anchor="middle">储能电机  m1 / m2</text>
  <text x="170" y="174" font-size="13" fill="#0e6251" text-anchor="middle">得电 → 压缩储能弹簧储能</text>
  <text x="170" y="196" font-size="12" fill="#0e6251" text-anchor="middle">回路不得电 → 不能自动储能</text>
  <line x1="290" y1="168" x2="376" y2="168" stroke="#148f77" stroke-width="2" marker-end="url(#a)"/>
  <text x="333" y="160" font-size="12" fill="#148f77" text-anchor="middle">储能</text>

  <rect x="50" y="300" width="240" height="96" rx="10" fill="#e8f6f3" stroke="#148f77" stroke-width="2"/>
  <text x="170" y="330" font-size="15" font-weight="bold" fill="#0e6251" text-anchor="middle">合闸线圈  c1 / c2</text>
  <text x="170" y="354" font-size="13" fill="#0e6251" text-anchor="middle">得电 → 释放储能弹簧锁扣</text>
  <text x="170" y="376" font-size="12" fill="#0e6251" text-anchor="middle">由储能弹簧能量合闸</text>
  <line x1="290" y1="348" x2="376" y2="348" stroke="#148f77" stroke-width="2" marker-end="url(#a)"/>
  <text x="333" y="340" font-size="12" fill="#148f77" text-anchor="middle">合闸</text>

  <!-- 右侧：失压脱扣、分励脱扣 -->
  <rect x="710" y="120" width="240" height="96" rx="10" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="830" y="150" font-size="15" font-weight="bold" fill="#922b21" text-anchor="middle">失压脱扣器  uv1 / uv2</text>
  <text x="830" y="174" font-size="13" fill="#922b21" text-anchor="middle">通电吸合 → 脱扣轴复位（可合闸）</text>
  <text x="830" y="196" font-size="12" fill="#922b21" text-anchor="middle">失电 / 断线 → 停在脱扣位、合不上闸</text>
  <line x1="710" y1="168" x2="624" y2="168" stroke="#c0392b" stroke-width="2" marker-end="url(#r)"/>
  <text x="667" y="160" font-size="12" fill="#c0392b" text-anchor="middle">保持</text>

  <rect x="710" y="300" width="240" height="96" rx="10" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="830" y="330" font-size="15" font-weight="bold" fill="#922b21" text-anchor="middle">分励脱扣器  fla / flb</text>
  <text x="830" y="354" font-size="13" fill="#922b21" text-anchor="middle">得电 → 拉动脱扣轴</text>
  <text x="830" y="376" font-size="12" fill="#922b21" text-anchor="middle">实现遥控/保护电动分闸</text>
  <line x1="710" y1="348" x2="624" y2="348" stroke="#c0392b" stroke-width="2" marker-end="url(#r)"/>
  <text x="667" y="340" font-size="12" fill="#c0392b" text-anchor="middle">跳闸</text>

  <!-- 底部控制电源 -->
  <rect x="360" y="500" width="280" height="70" rx="10" fill="#fef9e7" stroke="#b7950b" stroke-width="2"/>
  <text x="500" y="530" font-size="15" font-weight="bold" fill="#7d6608" text-anchor="middle">控制电源 DC 24V</text>
  <text x="500" y="554" font-size="12" fill="#7d6608" text-anchor="middle">经遥控面板/按钮为各线圈供电（线圈另一端接公共地）</text>

  <!-- 合闸条件提示 -->
  <rect x="40" y="500" width="280" height="70" rx="10" fill="#eaf2fb" stroke="#2471a3" stroke-width="2"/>
  <text x="180" y="530" font-size="14" font-weight="bold" fill="#1a3a5c" text-anchor="middle">合闸两个必备条件</text>
  <text x="180" y="554" font-size="12" fill="#1a3a5c" text-anchor="middle">① 储能到位  ② 失压脱扣器吸合（脱扣轴复位）</text>
</svg>
