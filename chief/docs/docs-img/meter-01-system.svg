<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="600" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2a33">图 1　三种常用仪表与被测对象</text>

  <!-- 三种仪表卡片 -->
  <g>
    <rect x="26" y="62" width="222" height="150" rx="10" fill="#fdf6ec" stroke="#e0a458" stroke-width="2"/>
    <text x="137" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#a86a1a">钳形电流表</text>
    <text x="137" y="114" text-anchor="middle" font-size="12" fill="#8a6a3a">不断开电路即可测交流电流</text>
    <text x="137" y="135" text-anchor="middle" font-size="12" fill="#8a6a3a">量程：5 / 50 / 100 / 250 A</text>
    <text x="137" y="156" text-anchor="middle" font-size="12" fill="#8a6a3a">被测导线穿过钳口内孔</text>
    <text x="137" y="186" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a86a1a">测线路电流</text>
    <text x="137" y="203" text-anchor="middle" font-size="11.5" fill="#8a6a3a">（U / V 相 ≈ 76 A）</text>
  </g>
  <g>
    <rect x="269" y="62" width="222" height="150" rx="10" fill="#eef7f0" stroke="#5aa96f" stroke-width="2"/>
    <text x="380" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d46">手摇式兆欧表</text>
    <text x="380" y="114" text-anchor="middle" font-size="12" fill="#4a6b54">内置手摇发电机，测绝缘电阻</text>
    <text x="380" y="135" text-anchor="middle" font-size="12" fill="#4a6b54">输出高压：500 / 1000 / 2500 V</text>
    <text x="380" y="156" text-anchor="middle" font-size="12" fill="#4a6b54">L / E（/ G）三端接线</text>
    <text x="380" y="186" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e7d46">测绝缘电阻</text>
    <text x="380" y="203" text-anchor="middle" font-size="11.5" fill="#4a6b54">（线路 80 MΩ／电机 50 MΩ）</text>
  </g>
  <g>
    <rect x="512" y="62" width="222" height="150" rx="10" fill="#eef4fb" stroke="#3f7fbf" stroke-width="2"/>
    <text x="623" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d5185">数字万用表</text>
    <text x="623" y="114" text-anchor="middle" font-size="12" fill="#3c5b7a">交直流电压 / 电流 / 电阻 / 二极管</text>
    <text x="623" y="135" text-anchor="middle" font-size="12" fill="#3c5b7a">COM / V(Ω) / mA 三个插孔</text>
    <text x="623" y="156" text-anchor="middle" font-size="12" fill="#3c5b7a">挡位：200Ω～500V 等多挡</text>
    <text x="623" y="186" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d5185">测电压 / 电流 / 电阻</text>
    <text x="623" y="203" text-anchor="middle" font-size="11.5" fill="#3c5b7a">（380 V／72 A／5.78 Ω）</text>
  </g>

  <!-- 被测对象 -->
  <text x="380" y="256" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#33414d">被测对象：电动机控制电路</text>
  <rect x="70" y="274" width="270" height="120" rx="10" fill="#ffffff" stroke="#c98a3a" stroke-width="2"/>
  <text x="205" y="308" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a4a10">电机控制箱</text>
  <text x="205" y="332" text-anchor="middle" font-size="12" fill="#7a4a10">塑壳断路器 QF／空气开关 ACB</text>
  <text x="205" y="352" text-anchor="middle" font-size="12" fill="#7a4a10">接触器 / 起动·停止按钮</text>
  <text x="205" y="376" text-anchor="middle" font-size="12" fill="#7a4a10">进线 in1~in3，出线 out1~out3，PE</text>

  <rect x="420" y="274" width="280" height="120" rx="10" fill="#eef4fb" stroke="#3f7fbf" stroke-width="2"/>
  <text x="560" y="322" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d5185">M1　三相异步电动机</text>
  <text x="560" y="348" text-anchor="middle" font-size="12" fill="#4a5b6b">50 kW　380V　1440 r/min</text>
  <text x="560" y="370" text-anchor="middle" font-size="12" fill="#4a5b6b">接线：U / V / W / PE</text>

  <!-- 接线 -->
  <g stroke="#c98a3a" stroke-width="3" fill="none">
    <line x1="340" y1="334" x2="420" y2="334"/>
  </g>
  <text x="380" y="326" text-anchor="middle" font-size="11.5" fill="#a86a1a">out1~3</text>

  <!-- 仪表到被测对象的指示箭头 -->
  <g stroke="#c98a3a" stroke-width="2" fill="none" stroke-dasharray="5 4">
    <line x1="137" y1="212" x2="137" y2="272"/>
  </g>
  <g stroke="#2e7d46" stroke-width="2" fill="none" stroke-dasharray="5 4">
    <line x1="380" y1="212" x2="380" y2="240"/>
  </g>
  <g stroke="#1d5185" stroke-width="2" fill="none" stroke-dasharray="5 4">
    <line x1="623" y1="212" x2="623" y2="240"/>
  </g>

  <text x="380" y="446" text-anchor="middle" font-size="12.5" fill="#5b6b7a">测量时先断电、后接线、再上电；先断开电源并放电后再测绝缘，</text>
  <text x="380" y="470" text-anchor="middle" font-size="12.5" fill="#5b6b7a">钳形表不断线穿心测电流，万用表测电压并联、测电流串联。</text>
  <text x="380" y="500" text-anchor="middle" font-size="12" fill="#8a97a3">三种仪表各司其职：钳形表"看电流"、兆欧表"查绝缘"、万用表"量电压电流电阻"。</text>
</svg>
