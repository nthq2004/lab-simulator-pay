<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="940" height="560" fill="#f7fafc"/>
  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a365d">ZDQ 电磁制动器控制回路（强励吸合 + 经济电阻维持 + 放电续流）</text>
  <text x="470" y="54" text-anchor="middle" font-size="11.5" fill="#718096">制动接触器 ZDC 得电后其常开触点接通制动回路；3SJ 起动瞬间短接经济电阻实现强励松闸</text>

  <defs>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- DC 母线 -->
  <line x1="70" y1="110" x2="860" y2="110" stroke="#c0392b" stroke-width="3"/>
  <text x="72" y="100" font-size="12" font-weight="bold" fill="#c0392b">DC+（KZ 整流器正端）</text>
  <line x1="70" y1="470" x2="860" y2="470" stroke="#2a4a8a" stroke-width="3"/>
  <text x="72" y="492" font-size="12" font-weight="bold" fill="#2a4a8a">DC−（整流器负端 / 回线）</text>

  <!-- 主回路：DC+ → ZDC NO → Rdc(50) → ZDQ → DC- -->
  <line x1="200" y1="110" x2="200" y2="150" stroke="#333" stroke-width="2.2"/>
  <!-- ZDC 常开 -->
  <line x1="175" y1="150" x2="225" y2="150" stroke="#333" stroke-width="2"/>
  <line x1="175" y1="174" x2="225" y2="174" stroke="#333" stroke-width="2"/>
  <line x1="178" y1="170" x2="222" y2="154" stroke="#333" stroke-width="2.2"/>
  <text x="245" y="158" font-size="11" font-weight="bold" fill="#333">ZDC 常开</text>
  <text x="245" y="176" font-size="9.5" fill="#888">（制动接触器触点）</text>
  <line x1="200" y1="174" x2="200" y2="230" stroke="#333" stroke-width="2.2"/>

  <!-- 经济电阻 Rdc -->
  <rect x="175" y="230" width="50" height="46" fill="#fafaf5" stroke="#333" stroke-width="1.8"/>
  <text x="200" y="258" text-anchor="middle" font-size="11" fill="#333">Rdc</text>
  <text x="238" y="256" font-size="10" fill="#666">50Ω 经济电阻</text>
  <line x1="200" y1="276" x2="200" y2="330" stroke="#333" stroke-width="2.2"/>

  <!-- ZDQ 线圈 -->
  <rect x="160" y="330" width="80" height="60" rx="5" fill="#ffdede" stroke="#e03030" stroke-width="3"/>
  <text x="200" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#922b21">ZDQ</text>
  <text x="200" y="376" text-anchor="middle" font-size="9.5" fill="#922b21">制动器线圈</text>
  <text x="256" y="352" font-size="10" fill="#666">得电 → 松闸</text>
  <text x="256" y="370" font-size="10" fill="#666">失电 → 抱闸</text>
  <line x1="200" y1="390" x2="200" y2="470" stroke="#333" stroke-width="2.2"/>

  <!-- 3SJ 常开并联在 Rdc 两端 -->
  <line x1="200" y1="230" x2="420" y2="230" stroke="#8a6a1a" stroke-width="2"/>
  <line x1="200" y1="276" x2="420" y2="276" stroke="#8a6a1a" stroke-width="2"/>
  <line x1="400" y1="248" x2="440" y2="248" stroke="#8a6a1a" stroke-width="2"/>
  <line x1="400" y1="266" x2="440" y2="266" stroke="#8a6a1a" stroke-width="2"/>
  <line x1="405" y1="234" x2="435" y2="262" stroke="#8a6a1a" stroke-width="2.2"/>
  <line x1="420" y1="230" x2="420" y2="248" stroke="#8a6a1a" stroke-width="2"/>
  <line x1="420" y1="266" x2="420" y2="276" stroke="#8a6a1a" stroke-width="2"/>
  <text x="450" y="250" font-size="11" font-weight="bold" fill="#8a6a1a">3SJ 常开</text>
  <text x="450" y="268" font-size="9.5" fill="#8a6a1a">起动瞬时短接 Rdc → 强励快速吸合</text>
  <text x="450" y="286" font-size="9.5" fill="#8a6a1a">延时后断开 → 串入 Rdc 减少发热</text>

  <!-- 放电回路 R3 + 二极管 并接线圈两端 -->
  <line x1="200" y1="330" x2="656" y2="330" stroke="#2a6a8a" stroke-width="2"/>
  <line x1="200" y1="390" x2="800" y2="390" stroke="#2a6a8a" stroke-width="2"/>
  <line x1="800" y1="330" x2="800" y2="390" stroke="#2a6a8a" stroke-width="2"/>
  <rect x="656" y="314" width="46" height="32" fill="#fafaf5" stroke="#2a6a8a" stroke-width="1.6"/>
  <text x="679" y="334" text-anchor="middle" font-size="10" fill="#2a6a8a">R3 300Ω</text>
  <line x1="702" y1="330" x2="740" y2="330" stroke="#2a6a8a" stroke-width="2"/>
  <polygon points="740,320 740,340 760,330" fill="none" stroke="#2a6a8a" stroke-width="1.8"/>
  <line x1="760" y1="320" x2="760" y2="340" stroke="#2a6a8a" stroke-width="2.4"/>
  <line x1="760" y1="330" x2="800" y2="330" stroke="#2a6a8a" stroke-width="2"/>
  <text x="700" y="362" font-size="10" fill="#2a6a8a">二极管 ZL</text>
  <text x="480" y="290" font-size="10" fill="#2a6a8a">放电回路（反向截止，断电续流）</text>

  <!-- ZDC 线圈控制回路（简） -->
  <rect x="30" y="410" width="250" height="130" rx="8" fill="#f2f0ea" stroke="#8a8578" stroke-width="1.6"/>
  <text x="48" y="434" font-size="11.5" font-weight="bold" fill="#444">ZDC 线圈得电条件</text>
  <text x="48" y="458" font-size="10" fill="#555">LK7（手柄离零）→</text>
  <text x="48" y="478" font-size="10" fill="#555">(ZC 常开 ∥ FC 常开) →</text>
  <text x="48" y="498" font-size="10" fill="#555">ZDC 线圈 → 回线</text>
  <text x="48" y="522" font-size="10" fill="#888">→ 手柄离零且方向接触器吸合，ZDC 才得电</text>

  <!-- 说明 -->
  <rect x="300" y="410" width="610" height="130" rx="8" fill="#ebf8ff" stroke="#63b3ed" stroke-width="1.5"/>
  <text x="320" y="436" font-size="11.5" font-weight="bold" fill="#2c5282">三段式设计的作用</text>
  <text x="320" y="460" font-size="10.5" fill="#2c5282">① 强励吸合：3SJ 常开短接 Rdc，ZDQ 线圈得全电压，电磁力大、松闸快、不"拖闸"；</text>
  <text x="320" y="482" font-size="10.5" fill="#2c5282">② 经济电阻维持：吸合后串入 50Ω，电流下降，长期运行不发热、不烧线圈；</text>
  <text x="320" y="504" font-size="10.5" fill="#2c5282">③ 放电续流：R3 + 二极管构成释放回路，吸收线圈断电时的磁场能量，防止过压。</text>
  <text x="320" y="526" font-size="10" fill="#3178a8">任一部分故障（3SJ 触点粘连、二极管击穿、线圈断线）都会引起制动异常。</text>
</svg>
