<svg xmlns="http://www.w3.org/2000/svg" width="920" height="740" viewBox="0 0 920 740" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#7a8494"/>
    </marker>
  </defs>
  <rect width="920" height="740" fill="#f7f9fb"/>
  <text x="460" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a252f">应急发电机功能试验流程</text>

  <!-- ===== 左列：准备 + 自动模式试验 ===== -->
  <text x="235" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#0a2a5a">一、准备 + 二、自动模式试验</text>

  <rect x="40" y="80" width="400" height="62" rx="8" fill="#eef6ff" stroke="#1565c0" stroke-width="1.4"/>
  <text x="240" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a252f">① 手动起动 1# 发电机组、合闸供电</text>
  <text x="240" y="126" text-anchor="middle" font-size="11.5" fill="#1565c0">建立主电网（主电网有电灯亮），为应急配电板提供电源</text>

  <rect x="40" y="158" width="400" height="62" rx="8" fill="#eef6ff" stroke="#1565c0" stroke-width="1.4"/>
  <text x="240" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a252f">② 调出“其它配电装置”面板</text>
  <text x="240" y="204" text-anchor="middle" font-size="11.5" fill="#1565c0">显示应急发电机机旁控制箱、应急配电板</text>

  <rect x="40" y="236" width="400" height="96" rx="8" fill="#fff8ec" stroke="#d9822b" stroke-width="1.4"/>
  <text x="240" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a252f">③ 联络开关打到“试验”位（自动模式）</text>
  <text x="240" y="282" text-anchor="middle" font-size="11.5" fill="#8a4b00">观察一：联络开关自动分闸（联络分闸灯亮）</text>
  <text x="240" y="302" text-anchor="middle" font-size="11.5" fill="#8a4b00">观察二：应急发电机自动起动（约 3s）、约 5s 建压</text>
  <text x="240" y="322" text-anchor="middle" font-size="11.5" fill="#8a4b00">观察三：延时约 10s 应急主开关自动合闸，应发供电</text>

  <rect x="40" y="348" width="400" height="96" rx="8" fill="#fff8ec" stroke="#d9822b" stroke-width="1.4"/>
  <text x="240" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a252f">④ 联络开关转回“正常”位</text>
  <text x="240" y="394" text-anchor="middle" font-size="11.5" fill="#8a4b00">观察一：应急主开关自动分闸</text>
  <text x="240" y="414" text-anchor="middle" font-size="11.5" fill="#8a4b00">观察二：延时约 3s 联络开关自动合闸，恢复主电</text>
  <text x="240" y="434" text-anchor="middle" font-size="11.5" fill="#8a4b00">观察三：延时约 10s 应急发电机自动停机、回到待机</text>

  <line x1="240" y1="142" x2="240" y2="158" stroke="#7a8494" stroke-width="1.5" marker-end="url(#a4)"/>
  <line x1="240" y1="220" x2="240" y2="236" stroke="#7a8494" stroke-width="1.5" marker-end="url(#a4)"/>
  <line x1="240" y1="332" x2="240" y2="348" stroke="#7a8494" stroke-width="1.5" marker-end="url(#a4)"/>

  <!-- ===== 右列：手动模式试验 + 恢复 ===== -->
  <text x="685" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a4b00">三、手动模式试验 + 四、恢复</text>

  <rect x="480" y="80" width="400" height="62" rx="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.4"/>
  <text x="680" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a252f">⑤ 应急配电板转“手动”、联络转“试验”</text>
  <text x="680" y="126" text-anchor="middle" font-size="11.5" fill="#14532d">ATS 自动功能退出，进入人工操作</text>

  <rect x="480" y="158" width="400" height="62" rx="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.4"/>
  <text x="680" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a252f">⑥ 应发转“手动”，机旁手动起动</text>
  <text x="680" y="204" text-anchor="middle" font-size="11.5" fill="#14532d">机旁控制箱「起动」按钮，约 5s 建压</text>

  <rect x="480" y="236" width="400" height="62" rx="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.4"/>
  <text x="680" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a252f">⑦ 应急配电板上手动合应急主开关</text>
  <text x="680" y="282" text-anchor="middle" font-size="11.5" fill="#14532d">建压完成后合闸，向应急配电板供电</text>

  <rect x="480" y="314" width="400" height="62" rx="8" fill="#fff8ec" stroke="#d9822b" stroke-width="1.4"/>
  <text x="680" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a252f">⑧ 应急主开关分闸、应发停机</text>
  <text x="680" y="360" text-anchor="middle" font-size="11.5" fill="#8a4b00">应发「控制方式」转回“自动”</text>

  <rect x="480" y="392" width="400" height="62" rx="8" fill="#eef6ff" stroke="#1565c0" stroke-width="1.4"/>
  <text x="680" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a252f">⑨ 联络转“正常”、应急配电板转“自动”</text>
  <text x="680" y="438" text-anchor="middle" font-size="11.5" fill="#1565c0">联络自动合闸恢复主电，装置恢复自动备用</text>

  <line x1="680" y1="142" x2="680" y2="158" stroke="#7a8494" stroke-width="1.5" marker-end="url(#a4)"/>
  <line x1="680" y1="220" x2="680" y2="236" stroke="#7a8494" stroke-width="1.5" marker-end="url(#a4)"/>
  <line x1="680" y1="298" x2="680" y2="314" stroke="#7a8494" stroke-width="1.5" marker-end="url(#a4)"/>
  <line x1="680" y1="376" x2="680" y2="392" stroke="#7a8494" stroke-width="1.5" marker-end="url(#a4)"/>

  <!-- 中部提示 -->
  <rect x="40" y="470" width="840" height="86" rx="10" fill="#fdecea" stroke="#d02020" stroke-width="1.6"/>
  <text x="460" y="496" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a1a1a">试验要点</text>
  <text x="460" y="520" text-anchor="middle" font-size="12.5" fill="#1a252f">① 自动模式试验：应急配电板控制模式须在“自动”；② 手动起动应发：机旁控制方式须在“手动”（“自动”位禁止手动起停）。</text>
  <text x="460" y="542" text-anchor="middle" font-size="12.5" fill="#1a252f">③ 手动合应急主开关前必须确认联络开关已分闸（互锁）；④ 试验完毕必须恢复“自动 / 正常”，保证装置随时能自动投入。</text>

  <text x="460" y="590" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a252f">观察要点速查</text>
  <rect x="40" y="606" width="840" height="112" rx="10" fill="#eef6ff" stroke="#1565c0" stroke-width="1.4"/>
  <text x="460" y="630" text-anchor="middle" font-size="12.5" fill="#0a2a5a">主电失电 / 打试验：联络分闸 → 应发起动（应急运行灯）→ 建压 → 应急主开关合闸（应发供电）</text>
  <text x="460" y="654" text-anchor="middle" font-size="12.5" fill="#0a2a5a">主电恢复 / 转正常：应急主开关分闸 → 联络合闸（恢复主电）→ 应发延时停机（回到待机）</text>
  <text x="460" y="678" text-anchor="middle" font-size="12.5" fill="#0a2a5a">状态灯：主电网有电＝绿；应急备用＝黄（应发在自动、无故障、停机）；应急运行＝绿（应发运行）</text>
  <text x="460" y="702" text-anchor="middle" font-size="12.5" fill="#0a2a5a">控制模式：应急配电板 自动→ATS 自动；手动→人工。应发控制方式：自动→禁止手动起停；手动→机旁起停</text>
</svg>
