<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="bold" fill="#102a43">冷库温度双位控制原理（温度继电器 + 供液电磁阀）</text>

  <!-- 坐标轴 -->
  <line x1="90" y1="60" x2="90" y2="300" stroke="#37474f" stroke-width="2"/>
  <line x1="90" y1="300" x2="830" y2="300" stroke="#37474f" stroke-width="2"/>
  <text x="30" y="70" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#37474f">库温</text>
  <text x="30" y="90" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#37474f">-4℃</text>
  <text x="30" y="160" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#37474f">-5℃</text>
  <text x="30" y="250" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#37474f">-7℃</text>
  <text x="828" y="322" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#37474f">时间</text>

  <!-- 启动值 / 停止值 参考线 -->
  <line x1="90" y1="150" x2="830" y2="150" stroke="#e53935" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="836" y="146" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#e53935" text-anchor="end" dx="-4">启动值 -5℃</text>
  <line x1="90" y1="250" x2="830" y2="250" stroke="#1565c0" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="836" y="246" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#1565c0" text-anchor="end" dx="-4">停止值 -7℃</text>

  <!-- 库温锯齿波：上升到 -5 停机（继续上升到顶点后回落）→ 下降到 -7 开机 -->
  <polyline points="90,250 200,180 250,150 300,150 360,210 400,250 470,190 520,150 570,150 630,215 670,250 740,190 790,150 830,150"
            fill="none" stroke="#e600e6" stroke-width="3.5"/>
  <text x="140" y="140" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#e600e6">库温回升</text>
  <text x="300" y="120" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#2e7d32">制冷中（降温）</text>

  <!-- 状态带 -->
  <text x="20" y="360" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#37474f">电磁阀</text>
  <text x="20" y="378" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#37474f">(触点)</text>
  <rect x="250" y="340" width="150" height="46" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="325" y="369" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">接通（供液）</text>
  <rect x="400" y="340" width="120" height="46" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
  <text x="460" y="369" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#607d8b">断开</text>
  <rect x="520" y="340" width="150" height="46" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="595" y="369" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">接通（供液）</text>
  <rect x="670" y="340" width="160" height="46" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>

  <!-- 说明 -->
  <rect x="90" y="408" width="740" height="74" fill="#f7fbff" stroke="#b3d4f0" stroke-width="1.5" rx="6"/>
  <text x="104" y="432" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#102a43">① 库温 <tspan fill="#e53935" font-weight="bold">升到启动值 -5℃ 以上</tspan> → 温度开关接通 → 控制器令供液电磁阀通电、蒸发器供液制冷；</text>
  <text x="104" y="456" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#102a43">② 库温 <tspan fill="#1565c0" font-weight="bold">降到停止值 -7℃ 以下</tspan> → 温度开关断开 → 电磁阀断电停止供液 → 库温回升后重复。</text>
  <text x="104" y="477" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#607d8b">③ 两值之间为滞环死区，开关保持原状态，避免温度小幅波动引起电磁阀频繁动作。</text>
</svg>
