<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <defs>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a085"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2471a3"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="#fbfcfe"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#1a3a5c">数字式温控器最小系统 组成与原理</text>

  <!-- ① 检测回路 -->
  <text x="24" y="72" font-size="17" font-weight="bold" fill="#0e6655">① 检测回路（温度 → 4~20mA）</text>
  <g fill="#e8f6f3" stroke="#16a085" stroke-width="2">
    <rect x="40" y="88" width="150" height="70" rx="10"/>
    <rect x="250" y="88" width="170" height="70" rx="10"/>
    <rect x="480" y="88" width="140" height="70" rx="10"/>
  </g>
  <g stroke="#16a085" stroke-width="3" fill="none" marker-end="url(#arrG)">
    <line x1="190" y1="123" x2="248" y2="123"/>
    <line x1="420" y1="123" x2="478" y2="123"/>
  </g>
  <g font-size="16" fill="#0b5345" text-anchor="middle">
    <text x="115" y="118">烘箱 PT100</text>
    <text x="115" y="140" font-size="12" fill="#16a085">oven</text>
    <text x="335" y="118">温度变送器</text>
    <text x="335" y="140" font-size="12" fill="#16a085">ttrans（三线制）</text>
    <text x="550" y="118">电流表</text>
    <text x="550" y="140" font-size="12" fill="#16a085">ampmeter</text>
  </g>

  <!-- ② PID -->
  <g fill="#eaf2fb" stroke="#2471a3" stroke-width="2.5">
    <rect x="380" y="250" width="240" height="120" rx="12"/>
  </g>
  <text x="500" y="290" font-size="18" font-weight="bold" fill="#154360" text-anchor="middle">数字式 PID 调节器</text>
  <text x="500" y="314" font-size="13" fill="#2471a3" text-anchor="middle">pid：PV / SV 比较 → PID 运算</text>
  <text x="500" y="336" font-size="13" fill="#2471a3" text-anchor="middle">PWM 分程输出 CH1 加热 / CH2 冷却</text>

  <!-- 检测 → PID -->
  <path d="M620,123 L680,123 L680,290 L622,290" stroke="#16a085" stroke-width="3" fill="none" marker-end="url(#arrG)"/>
  <text x="700" y="112" font-size="13" fill="#0e6655" text-anchor="middle">4~20mA 输入（电流表串联）</text>

  <!-- ③ 执行回路 -->
  <text x="24" y="440" font-size="17" font-weight="bold" fill="#922b21">③ 执行回路（PWM 输出 → 继电器 → 加热 / 散热）</text>
  <path d="M440,370 L440,410 L105,410 L105,470" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#arrR)"/>
  <path d="M560,370 L560,410 L675,410 L675,470" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#arrR)"/>
  <text x="300" y="404" font-size="13" fill="#922b21" text-anchor="middle">CH1（PWM）加热</text>
  <text x="700" y="404" font-size="13" fill="#2471a3" text-anchor="middle">CH2（PWM）冷却</text>

  <g fill="#fdedec" stroke="#c0392b" stroke-width="2">
    <rect x="40" y="470" width="130" height="70" rx="10"/>
    <rect x="220" y="470" width="150" height="70" rx="10"/>
    <rect x="610" y="470" width="130" height="70" rx="10"/>
    <rect x="790" y="470" width="150" height="70" rx="10"/>
  </g>
  <g stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#arrR)">
    <line x1="170" y1="505" x2="218" y2="505"/>
    <line x1="740" y1="505" x2="788" y2="505"/>
  </g>
  <g font-size="15" fill="#7b241c" text-anchor="middle">
    <text x="105" y="500">加继电器</text>
    <text x="105" y="522" font-size="11" fill="#c0392b">rplus（COM-NO）</text>
    <text x="295" y="500">烘箱加热器</text>
    <text x="295" y="522" font-size="11" fill="#c0392b">oven heater</text>
    <text x="675" y="500">减继电器</text>
    <text x="675" y="522" font-size="11" fill="#c0392b">rminus（COM-NO）</text>
    <text x="865" y="500">散热风扇</text>
    <text x="865" y="522" font-size="11" fill="#c0392b">oven fan</text>
  </g>

  <!-- ④ 监控与电源 -->
  <g fill="#f4ecf7" stroke="#8e44ad" stroke-width="2">
    <rect x="800" y="250" width="170" height="80" rx="10"/>
  </g>
  <text x="885" y="284" font-size="15" fill="#6c3483" text-anchor="middle">监控主机</text>
  <text x="885" y="306" font-size="12" fill="#8e44ad" text-anchor="middle">monitor：曲线 + 报警</text>
  <path d="M620,320 L798,300" stroke="#8e44ad" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrB)"/>
  <text x="710" y="342" font-size="12" fill="#6c3483" text-anchor="middle">RS485</text>

  <g fill="#fef9e7" stroke="#b7950b" stroke-width="2">
    <rect x="40" y="250" width="180" height="80" rx="10"/>
  </g>
  <text x="130" y="284" font-size="15" fill="#7d6608" text-anchor="middle">DC 24V 电源</text>
  <text x="130" y="306" font-size="12" fill="#b7950b" text-anchor="middle">dcpower（含共地 gnd）</text>
  <path d="M220,290 L378,305" stroke="#b7950b" stroke-width="2.5" fill="none" marker-end="url(#arrB)"/>

  <text x="24" y="580" font-size="13" fill="#555">温度 t 经变送器线性转换为回路电流 I = 4 + 16×(t/量程) mA；PID 按 PV 与 SV 偏差做 PWM 分程调节，加热/散热双向控制。</text>
</svg>
