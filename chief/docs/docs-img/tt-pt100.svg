<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <rect width="860" height="520" fill="#fbfcfe"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#1a3a5c">PT100 的电阻—温度特性与量程对应</text>

  <!-- 网格 -->
  <g stroke="#e3e8ef" stroke-width="1">
    <line x1="120" y1="90" x2="780" y2="90"/>
    <line x1="120" y1="156" x2="780" y2="156"/>
    <line x1="120" y1="222" x2="780" y2="222"/>
    <line x1="120" y1="288" x2="780" y2="288"/>
    <line x1="120" y1="354" x2="780" y2="354"/>
    <line x1="120" y1="420" x2="780" y2="420"/>
    <line x1="285" y1="60" x2="285" y2="420"/>
    <line x1="450" y1="60" x2="450" y2="420"/>
    <line x1="615" y1="60" x2="615" y2="420"/>
    <line x1="780" y1="60" x2="780" y2="420"/>
  </g>

  <!-- 坐标轴 -->
  <g stroke="#333" stroke-width="2">
    <line x1="120" y1="420" x2="800" y2="420"/>
    <line x1="120" y1="420" x2="120" y2="60"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="end">
    <text x="112" y="425">100</text>
    <text x="112" y="359">107.7</text>
    <text x="112" y="293">115.4</text>
    <text x="112" y="227">123.1</text>
    <text x="112" y="161">130.8</text>
    <text x="112" y="95">138.5</text>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="120" y="442">0</text>
    <text x="285" y="442">25</text>
    <text x="450" y="442">50</text>
    <text x="615" y="442">75</text>
    <text x="780" y="442">100</text>
  </g>
  <text x="450" y="478" font-size="15" fill="#333" text-anchor="middle">被测温度 T (℃)</text>
  <text x="34" y="240" font-size="15" fill="#333" text-anchor="middle" transform="rotate(-90 34,240)">PT100 电阻 R (Ω)</text>

  <!-- 特性线 -->
  <line x1="120" y1="420" x2="780" y2="90" stroke="#c0392b" stroke-width="3.5"/>
  <g fill="#fff" stroke="#c0392b" stroke-width="3">
    <circle cx="120" cy="420" r="7"/>
    <circle cx="285" cy="339" r="7"/>
    <circle cx="450" cy="255" r="7"/>
    <circle cx="615" cy="174" r="7"/>
    <circle cx="780" cy="90" r="7"/>
  </g>

  <!-- 点标注 -->
  <g font-size="13" font-weight="bold" fill="#922b21">
    <text x="180" y="412">0℃ → 100.00Ω（量程下限 / 零点）</text>
    <text x="300" y="390">25℃ → 109.63Ω</text>
    <text x="465" y="280">50℃ → 119.26Ω</text>
    <text x="645" y="200">75℃ → 128.88Ω</text>
    <text x="772" y="82" text-anchor="end">100℃ → 138.51Ω（量程上限 / 满度）</text>
  </g>

  <!-- 斜率说明 -->
  <rect x="470" y="300" width="350" height="104" rx="10" fill="#fdf2e9" stroke="#e67e22"/>
  <text x="488" y="328" font-size="14" fill="#7e5109">线性关系：R = 100 + 0.3851·T  (Ω)</text>
  <text x="488" y="354" font-size="14" fill="#7e5109">温度每升高 10℃，电阻增加约 3.85Ω</text>
  <text x="488" y="380" font-size="13" fill="#7e5109">量程跨度 100℃ ↔ 电阻跨度 38.51Ω</text>
  <text x="488" y="400" font-size="13" fill="#7e5109">校准即用标准电阻模拟这两个端点</text>

  <!-- 下限上限竖线 -->
  <line x1="120" y1="420" x2="120" y2="88" stroke="#2c7be5" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="780" y1="90" x2="780" y2="420" stroke="#2c7be5" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="104" y="414" font-size="12" fill="#2c7be5" text-anchor="end">4mA</text>
  <text x="790" y="118" font-size="12" fill="#2c7be5" text-anchor="start">20mA</text>
</svg>
