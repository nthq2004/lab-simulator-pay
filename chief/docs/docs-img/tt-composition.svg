<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <rect width="920" height="460" fill="#fbfcfe"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#1a3a5c">温度变送器系统组成与信号链</text>

  <!-- PT100 / 标准电阻 -->
  <rect x="30" y="150" width="150" height="120" rx="10" fill="#eaf4ff" stroke="#2c7be5" stroke-width="2"/>
  <text x="105" y="184" font-size="15" font-weight="bold" fill="#1a3a5c" text-anchor="middle">PT100</text>
  <text x="105" y="208" font-size="12" fill="#445" text-anchor="middle">（或标准电阻）</text>
  <text x="105" y="234" font-size="12" fill="#445" text-anchor="middle">R = 100 + 0.3851·T</text>
  <text x="105" y="254" font-size="12" fill="#c0392b" text-anchor="middle">0.3851 Ω/℃</text>

  <line x1="180" y1="210" x2="248" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="214" y="200" font-size="11" fill="#333" text-anchor="middle">三线制</text>

  <!-- 变送器本体 -->
  <rect x="250" y="70" width="330" height="280" rx="14" fill="#f2fbf5" stroke="#27ae60" stroke-width="2"/>
  <text x="415" y="98" font-size="16" font-weight="bold" fill="#1a3a5c" text-anchor="middle">温度变送器（两线制）</text>

  <rect x="276" y="116" width="130" height="46" rx="8" fill="#fff" stroke="#9bb7a8"/>
  <text x="341" y="145" font-size="13" fill="#234" text-anchor="middle">测量电桥 / 放大</text>

  <rect x="276" y="176" width="130" height="46" rx="8" fill="#fff" stroke="#9bb7a8"/>
  <text x="341" y="205" font-size="13" fill="#234" text-anchor="middle">A/D 转换为温度</text>

  <rect x="276" y="236" width="130" height="46" rx="8" fill="#fff" stroke="#9bb7a8"/>
  <text x="341" y="265" font-size="13" fill="#234" text-anchor="middle">V/I 转换 → 4~20mA</text>

  <rect x="276" y="292" width="130" height="40" rx="8" fill="#e8fff0" stroke="#27ae60"/>
  <text x="341" y="317" font-size="12" fill="#1e8449" text-anchor="middle">就地 LCD：显示温度</text>

  <!-- Z / S 电位器 -->
  <rect x="428" y="140" width="126" height="90" rx="8" fill="#fdf2e9" stroke="#e67e22"/>
  <text x="491" y="166" font-size="13" font-weight="bold" fill="#7e5109" text-anchor="middle">调校电位器</text>
  <text x="491" y="190" font-size="13" fill="#7e5109" text-anchor="middle">Z 零点电位器</text>
  <text x="491" y="212" font-size="13" fill="#7e5109" text-anchor="middle">S 量程电位器</text>
  <line x1="406" y1="185" x2="426" y2="185" stroke="#e67e22" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- 输出到回路 -->
  <line x1="580" y1="160" x2="648" y2="160" stroke="#c0392b" stroke-width="3" marker-end="url(#arrR)"/>
  <text x="614" y="150" font-size="11" fill="#c0392b" text-anchor="middle">P(+)</text>
  <line x1="580" y1="260" x2="648" y2="300" stroke="#333" stroke-width="3" marker-end="url(#arr)"/>
  <text x="620" y="292" font-size="11" fill="#333" text-anchor="middle">N(−)</text>

  <!-- 电流表 -->
  <circle cx="700" cy="205" r="42" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
  <text x="700" y="200" font-size="14" font-weight="bold" fill="#2c3e50" text-anchor="middle">mA</text>
  <text x="700" y="222" font-size="11" fill="#2c3e50" text-anchor="middle">输出电流表</text>

  <line x1="742" y1="205" x2="812" y2="205" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="812" y="170" width="86" height="70" rx="10" fill="#eceff4" stroke="#607d8b"/>
  <text x="855" y="200" font-size="13" fill="#37474f" text-anchor="middle">PID /</text>
  <text x="855" y="220" font-size="13" fill="#37474f" text-anchor="middle">监控主机</text>

  <!-- 24V 电源 -->
  <rect x="640" y="360" width="150" height="60" rx="10" fill="#fff4e5" stroke="#e67e22"/>
  <text x="715" y="386" font-size="14" font-weight="bold" fill="#7e5109" text-anchor="middle">DC 24V 电源</text>
  <text x="715" y="406" font-size="11" fill="#7e5109" text-anchor="middle">供电与信号共用两根线</text>
  <line x1="700" y1="360" x2="700" y2="249" stroke="#e67e22" stroke-width="1.6" stroke-dasharray="5 4"/>

  <!-- 公式说明 -->
  <rect x="30" y="352" width="560" height="92" rx="10" fill="#fdf2e9" stroke="#e67e22"/>
  <text x="48" y="378" font-size="14" fill="#7e5109">变送关系：I = 4mA + 16mA × (T − 下限) / (上限 − 下限)</text>
  <text x="48" y="402" font-size="14" fill="#7e5109">本工程量程 0~100℃：I = 4 + 16 × (T / 100)  mA</text>
  <text x="48" y="426" font-size="13" fill="#7e5109">就地 LCD 反映传感器温度；4~20mA 经 Z/S 电位器整定后送往控制室</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#333"/></marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#e67e22"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#c0392b"/></marker>
  </defs>
</svg>
