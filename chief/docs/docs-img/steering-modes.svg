<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="520" fill="#fbfbf8"/>
  <text x="470" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#263238">图 3  四种操舵方式的信号流程</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#455a64"/>
    </marker>
  </defs>

  <!-- 随动 -->
  <rect x="30" y="56" width="205" height="200" rx="8" fill="#e8f1fb" stroke="#1565c0" stroke-width="2"/>
  <text x="132" y="80" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d47a1">① 随动操舵（FU）</text>
  <rect x="52" y="96" width="160" height="34" rx="4" fill="#fff" stroke="#1565c0"/>
  <text x="132" y="118" font-size="11" text-anchor="middle" fill="#0d47a1">转动手轮（发舵令）</text>
  <rect x="52" y="148" width="160" height="34" rx="4" fill="#fff" stroke="#1565c0"/>
  <text x="132" y="170" font-size="11" text-anchor="middle" fill="#0d47a1">伺服放大器 / 比较器</text>
  <rect x="52" y="200" width="160" height="34" rx="4" fill="#fff" stroke="#1565c0"/>
  <text x="132" y="222" font-size="11" text-anchor="middle" fill="#0d47a1">舵角反馈装置（闭环）</text>
  <line x1="132" y1="130" x2="132" y2="146" stroke="#455a64" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="132" y1="182" x2="132" y2="198" stroke="#455a64" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="212" y1="217" x2="228" y2="217" stroke="#1565c0" stroke-width="2" marker-end="url(#a2)"/>
  <text x="132" y="250" font-size="10" text-anchor="middle" fill="#1565c0">手轮角度 ↔ 舵角，随动跟随</text>

  <!-- NFU -->
  <rect x="255" y="56" width="205" height="200" rx="8" fill="#fdf1e3" stroke="#ef6c00" stroke-width="2"/>
  <text x="357" y="80" font-size="14" font-weight="bold" text-anchor="middle" fill="#e65100">② 非随动操舵（NFU）</text>
  <rect x="277" y="96" width="160" height="34" rx="4" fill="#fff" stroke="#ef6c00"/>
  <text x="357" y="118" font-size="11" text-anchor="middle" fill="#e65100">扳动开关 左 / 中 / 右</text>
  <rect x="277" y="148" width="160" height="34" rx="4" fill="#fff" stroke="#ef6c00"/>
  <text x="357" y="170" font-size="11" text-anchor="middle" fill="#e65100">直接驱动力矩马达</text>
  <rect x="277" y="200" width="160" height="34" rx="4" fill="#fff" stroke="#ef6c00"/>
  <text x="357" y="222" font-size="11" text-anchor="middle" fill="#e65100">先导阀 → 伺服活塞</text>
  <line x1="357" y1="130" x2="357" y2="146" stroke="#455a64" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="357" y1="182" x2="357" y2="198" stroke="#455a64" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="437" y1="217" x2="453" y2="217" stroke="#ef6c00" stroke-width="2" marker-end="url(#a2)"/>
  <text x="357" y="250" font-size="10" text-anchor="middle" fill="#ef6c00">无舵角反馈，松手舵角保持</text>

  <!-- 自动 -->
  <rect x="480" y="56" width="205" height="200" rx="8" fill="#eaf6ec" stroke="#2e7d32" stroke-width="2"/>
  <text x="582" y="80" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b5e20">③ 自动舵（AUTO）</text>
  <rect x="502" y="96" width="160" height="34" rx="4" fill="#fff" stroke="#2e7d32"/>
  <text x="582" y="118" font-size="11" text-anchor="middle" fill="#1b5e20">设定航向 vs 罗经首向</text>
  <rect x="502" y="148" width="160" height="34" rx="4" fill="#fff" stroke="#2e7d32"/>
  <text x="582" y="170" font-size="11" text-anchor="middle" fill="#1b5e20">PID + 灵敏度 + 天气</text>
  <rect x="502" y="200" width="160" height="34" rx="4" fill="#fff" stroke="#2e7d32"/>
  <text x="582" y="222" font-size="11" text-anchor="middle" fill="#1b5e20">输出舵令 → 随动闭环</text>
  <line x1="582" y1="130" x2="582" y2="146" stroke="#455a64" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="582" y1="182" x2="582" y2="198" stroke="#455a64" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="662" y1="217" x2="678" y2="217" stroke="#2e7d32" stroke-width="2" marker-end="url(#a2)"/>
  <text x="582" y="250" font-size="10" text-anchor="middle" fill="#2e7d32">航向偏差 → 舵令</text>

  <!-- 机旁应急 -->
  <rect x="705" y="56" width="205" height="200" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="807" y="80" font-size="14" font-weight="bold" text-anchor="middle" fill="#4a148c">④ 机旁应急操舵</text>
  <rect x="727" y="96" width="160" height="34" rx="4" fill="#fff" stroke="#6a1b9a"/>
  <text x="807" y="118" font-size="11" text-anchor="middle" fill="#4a148c">机旁遥控开关 → 机旁</text>
  <rect x="727" y="148" width="160" height="34" rx="4" fill="#fff" stroke="#6a1b9a"/>
  <text x="807" y="170" font-size="11" text-anchor="middle" fill="#4a148c">机旁手动按下卸荷阀</text>
  <rect x="727" y="200" width="160" height="34" rx="4" fill="#fff" stroke="#6a1b9a"/>
  <text x="807" y="222" font-size="11" text-anchor="middle" fill="#4a148c">应急开关 左 / 右 直接操舵</text>
  <line x1="807" y1="130" x2="807" y2="146" stroke="#455a64" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="807" y1="182" x2="807" y2="198" stroke="#455a64" stroke-width="2" marker-end="url(#a2)"/>
  <text x="807" y="250" font-size="10" text-anchor="middle" fill="#6a1b9a">本机独立，遥控指令被屏蔽</text>

  <!-- 共同执行机构 -->
  <rect x="180" y="330" width="580" height="70" rx="8" fill="#eef0ed" stroke="#455a64" stroke-width="2"/>
  <text x="470" y="356" font-size="14" font-weight="bold" text-anchor="middle" fill="#263238">液控四通阀 → 串联阀 → 动力管路 → 四只液压缸 → 舵柄 → 舵柱 → 舵叶</text>
  <text x="470" y="380" font-size="11" text-anchor="middle" fill="#546e7a">力矩马达 / 先导阀 / 伺服活塞构成“电—液”放大环节；舵角反馈闭环保证跟随精度</text>

  <line x1="228" y1="258" x2="330" y2="328" stroke="#1565c0" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="453" y1="258" x2="430" y2="328" stroke="#ef6c00" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="678" y1="258" x2="530" y2="328" stroke="#2e7d32" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="807" y1="258" x2="640" y2="328" stroke="#6a1b9a" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="180" y="430" width="580" height="64" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.6"/>
  <text x="470" y="454" font-size="12" font-weight="bold" text-anchor="middle" fill="#6d4c41">驾驶台遥控无效的常见原因</text>
  <text x="470" y="476" font-size="11" text-anchor="middle" fill="#8d6e63">该机机旁遥控开关仍在“机旁”位 / 该机泵未运行 / 卸荷阀未动作 / 隔离阀把本机隔断</text>
</svg>
