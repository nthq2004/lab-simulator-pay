<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect width="1080" height="470" fill="#fbfcfd"/>
  <text x="540" y="32" font-size="21" font-weight="bold" text-anchor="middle" fill="#1a3a5c">图 4　PLC（S7-200 SMART ST20 + EM DI08）输入 / 输出分配</text>

  <!-- PLC 主体 -->
  <rect x="360" y="70" width="360" height="360" rx="12" fill="#e8eef2" stroke="#34495e" stroke-width="2"/>
  <text x="540" y="104" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a252f">S7-200 SMART ST20（SR20 用法）</text>
  <rect x="380" y="120" width="320" height="150" rx="8" fill="#fff" stroke="#90a4ae" stroke-width="1.4"/>
  <text x="540" y="146" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">输入过程映像 I</text>
  <rect x="380" y="286" width="320" height="120" rx="8" fill="#fff" stroke="#90a4ae" stroke-width="1.4"/>
  <text x="540" y="312" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">输出过程映像 Q</text>

  <!-- 输入项 -->
  <text x="150" y="118" font-size="12.5" fill="#1a252f" text-anchor="middle">1# 遥控面板</text>
  <text x="150" y="140" font-size="12" fill="#334" text-anchor="middle">I0.0 自动</text>
  <text x="150" y="160" font-size="12" fill="#334" text-anchor="middle">I0.1 启动</text>
  <text x="150" y="180" font-size="12" fill="#334" text-anchor="middle">I0.2 停/复位</text>
  <text x="150" y="212" font-size="12.5" fill="#1a252f" text-anchor="middle">2# 遥控面板</text>
  <text x="150" y="234" font-size="12" fill="#334" text-anchor="middle">I0.3 自动</text>
  <text x="150" y="254" font-size="12" fill="#334" text-anchor="middle">I0.4 启动</text>
  <text x="150" y="274" font-size="12" fill="#334" text-anchor="middle">I0.5 停/复位</text>
  <text x="150" y="306" font-size="12" fill="#334" text-anchor="middle">I0.6 1# 机旁遥控</text>
  <text x="150" y="326" font-size="12" fill="#334" text-anchor="middle">I0.7 2# 机旁遥控</text>
  <text x="150" y="358" font-size="12" fill="#334" text-anchor="middle">I1.0 滑油压力低</text>
  <text x="150" y="390" font-size="12.5" fill="#1a252f" text-anchor="middle">EM DI08</text>
  <text x="150" y="410" font-size="12" fill="#334" text-anchor="middle">I2.0 1# 机旁过载</text>
  <text x="150" y="430" font-size="12" fill="#334" text-anchor="middle">I2.1 2# 机旁过载</text>
  <line x1="320" y1="110" x2="380" y2="130" stroke="#2c3e50" stroke-width="2"/>
  <line x1="320" y1="200" x2="380" y2="160" stroke="#2c3e50" stroke-width="2"/>
  <line x1="320" y1="300" x2="380" y2="205" stroke="#2c3e50" stroke-width="2"/>
  <line x1="320" y1="400" x2="380" y2="255" stroke="#2c3e50" stroke-width="2"/>

  <!-- 输出项 -->
  <text x="930" y="326" font-size="12" fill="#334" text-anchor="middle">Q0.0 → KM1 接触器线圈</text>
  <text x="930" y="350" font-size="12" fill="#334" text-anchor="middle">Q0.1 → KM2 接触器线圈</text>
  <text x="930" y="374" font-size="12" fill="#334" text-anchor="middle">Q0.2 → 1# 遥控面板故障灯</text>
  <text x="930" y="398" font-size="12" fill="#334" text-anchor="middle">Q0.3 → 2# 遥控面板故障灯</text>
  <line x1="700" y1="330" x2="800" y2="326" stroke="#c0392b" stroke-width="2"/>
  <line x1="700" y1="350" x2="800" y2="350" stroke="#c0392b" stroke-width="2"/>
  <line x1="700" y1="370" x2="800" y2="374" stroke="#c0392b" stroke-width="2"/>
  <line x1="700" y1="390" x2="800" y2="398" stroke="#c0392b" stroke-width="2"/>
  <text x="930" y="296" font-size="12.5" font-weight="bold" fill="#1a252f" text-anchor="middle">输出去向</text>

  <!-- 说明 -->
  <rect x="360" y="442" width="360" height="20" fill="#fff8e1" stroke="#c9a227" stroke-width="1"/>
  <text x="540" y="457" font-size="12" text-anchor="middle" fill="#8a6d00">24V 直流供电；1M/1L+ 接 0V/24V；网口接上位机</text>
</svg>
