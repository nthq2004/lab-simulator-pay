<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="660" height="500" fill="#ffffff"/>
  <text x="330" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a252f">图 3  时间继电器实验接线示意（线圈 + 万用表）</text>

  <!-- ===== 单相交流电源 ===== -->
  <rect x="24" y="120" width="128" height="150" rx="8" fill="#e3e9ef" stroke="#1a252f" stroke-width="2"/>
  <text x="88" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a252f">单相交流电源</text>
  <text x="88" y="166" text-anchor="middle" font-size="10.5" fill="#556">220 V · 50 Hz</text>
  <!-- 电源按钮 -->
  <circle cx="70" cy="212" r="18" fill="#f4f7fa" stroke="#1a252f" stroke-width="1.6"/>
  <circle cx="70" cy="212" r="8" fill="#c0392b"/>
  <text x="98" y="216" font-size="10.5" fill="#1a252f">电源按钮</text>
  <!-- 输出端 N/P -->
  <circle cx="146" cy="172" r="7" fill="#c0392b" stroke="#7a1a12" stroke-width="1.2"/>
  <text x="136" y="164" text-anchor="end" font-size="11" font-weight="bold" fill="#c0392b">P</text>
  <circle cx="146" cy="232" r="7" fill="#2050e0" stroke="#103aa0" stroke-width="1.2"/>
  <text x="136" y="224" text-anchor="end" font-size="11" font-weight="bold" fill="#2050e0">N</text>

  <!-- ===== 时间继电器 ===== -->
  <rect x="250" y="70" width="182" height="286" rx="8" fill="#f2efe8" stroke="#c8b8a0" stroke-width="2"/>
  <text x="341" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a2a">时间继电器 JSZ3</text>
  <!-- 刻度盘 -->
  <circle cx="322" cy="180" r="32" fill="#ece8e0" stroke="#a09080" stroke-width="2"/>
  <line x1="322" y1="180" x2="322" y2="156" stroke="#d63031" stroke-width="2.4" stroke-linecap="round"/>
  <text x="322" y="222" text-anchor="middle" font-size="10" fill="#7a5a2a">延时设定 15 s</text>

  <!-- 线圈端子 2 / 7（左） -->
  <circle cx="250" cy="130" r="7" fill="#d0c8b8" stroke="#605040" stroke-width="1.4"/>
  <text x="240" y="134" text-anchor="end" font-size="11" font-weight="bold" fill="#202020">7</text>
  <circle cx="250" cy="190" r="7" fill="#d0c8b8" stroke="#605040" stroke-width="1.4"/>
  <text x="240" y="194" text-anchor="end" font-size="11" font-weight="bold" fill="#202020">2</text>
  <text x="262" y="112" font-size="10" fill="#b02020">线圈</text>

  <!-- 触头端子 5 / 8 / 6（右） -->
  <circle cx="432" cy="150" r="7" fill="#d0c8b8" stroke="#605040" stroke-width="1.4"/>
  <text x="444" y="154" font-size="11" font-weight="bold" fill="#202020">5</text>
  <text x="456" y="154" font-size="10" fill="#c0392b">NC</text>
  <circle cx="432" cy="210" r="7" fill="#d0c8b8" stroke="#605040" stroke-width="1.4"/>
  <text x="444" y="214" font-size="11" font-weight="bold" fill="#202020">8</text>
  <text x="456" y="214" font-size="10" fill="#605040">COM</text>
  <circle cx="432" cy="270" r="7" fill="#f0c0b8" stroke="#d04020" stroke-width="1.4"/>
  <text x="444" y="274" font-size="11" font-weight="bold" fill="#d03020">6</text>
  <text x="456" y="274" font-size="10" fill="#2f6f3f">NO</text>
  <text x="432" y="300" text-anchor="middle" font-size="10" fill="#7a5a2a">触头</text>

  <!-- ===== 线圈接线 P→7 / N→2 ===== -->
  <g fill="none" stroke-width="2.4">
    <polyline points="153,172 205,172 205,130 243,130" stroke="#c0392b"/>
    <polyline points="153,232 190,232 190,190 243,190" stroke="#2050e0"/>
  </g>
  <text x="205" y="166" text-anchor="middle" font-size="10" fill="#c0392b">P→7</text>
  <text x="185" y="246" text-anchor="middle" font-size="10" fill="#2050e0">N→2</text>

  <!-- ===== 万用表（虚线，流程②） ===== -->
  <rect x="510" y="120" width="132" height="150" rx="8" fill="#eef7ee" stroke="#2f6f3f" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="576" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f6f3f">数字万用表</text>
  <text x="576" y="164" text-anchor="middle" font-size="10.5" fill="#2f6f3f">档位：200Ω 电阻档</text>
  <text x="576" y="184" text-anchor="middle" font-size="10.5" fill="#888">红表笔 V · 黑表笔 COM</text>
  <!-- 表笔引出 -->
  <g fill="none" stroke-width="1.8" stroke-dasharray="5 4">
    <path d="M510 150 Q472 150 439 150" stroke="#c0392b"/>
    <path d="M510 176 Q468 176 439 200 L439 210" stroke="#333"/>
  </g>
  <!-- 第二次测量：红表笔移到 6（灰虚线） -->
  <path d="M510 162 Q470 230 439 262" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="3 4"/>
  <text x="492" y="250" font-size="10" fill="#777">红笔移到 6 测 NO</text>

  <!-- ===== 说明 ===== -->
  <rect x="24" y="330" width="600" height="140" rx="6" fill="#fafafa" stroke="#ddd"/>
  <text x="40" y="352" font-size="13" font-weight="bold" fill="#2d3436">接线一览</text>
  <text x="40" y="376" font-size="12" fill="#2d3436">① 交流电源正端 P → 端子 7，负端 N → 端子 2（线圈 220V）</text>
  <text x="40" y="398" font-size="12" fill="#2d3436">② 万用表红表笔 V → 端子 5（NC）/ 端子 6（NO），黑表笔 COM → 端子 8（公共端）</text>
  <text x="40" y="422" font-size="11.5" fill="#c0392b">通电量电阻会受回路影响，测触头电阻应在断电状态下进行；接线前请先断开电源。</text>
  <text x="40" y="446" font-size="11.5" fill="#888">自动演示中接线采用逐根动画（约 3 s/根）：先闪烁箭头圈出目标端子，再逐根接好并停留观察。</text>
</svg>
