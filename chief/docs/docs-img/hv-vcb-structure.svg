<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="940" height="470" fill="#ffffff"/>
  <text x="470" y="26" font-size="19" font-weight="bold" text-anchor="middle" fill="#1a252f">真空断路器手车的三个位置与主要操作部件</text>

  <!-- ── 三个位置 ── -->
  <!-- 连接位（工作位） -->
  <g>
    <rect x="40" y="50" width="250" height="250" rx="6" fill="#f7f9fb" stroke="#b0bcc4"/>
    <text x="165" y="72" font-size="14" font-weight="bold" text-anchor="middle" fill="#006400">连接位（工作位）</text>
    <!-- 母线静触头 -->
    <line x1="100" y1="95" x2="230" y2="95" stroke="#2c3a45" stroke-width="6" stroke-linecap="round"/>
    <text x="165" y="88" font-size="10" text-anchor="middle" fill="#333">母线（静触头）</text>
    <!-- 手车 -->
    <rect x="110" y="120" width="110" height="120" rx="4" fill="#dfe3e7" stroke="#2c3a45"/>
    <text x="165" y="150" font-size="11" text-anchor="middle" fill="#333">断路器手车</text>
    <!-- 一次触头（接通） -->
    <line x1="165" y1="95" x2="165" y2="120" stroke="#1b8a1b" stroke-width="4"/>
    <circle cx="165" cy="120" r="5" fill="#2eff3e" stroke="#1a252f"/>
    <text x="165" y="200" font-size="10" text-anchor="middle" fill="#1b8a1b">一次插头：接通</text>
    <!-- 二次插头 -->
    <text x="165" y="222" font-size="10" text-anchor="middle" fill="#1b8a1b">二次插头：接通</text>
    <text x="165" y="252" font-size="11" text-anchor="middle" fill="#c0392b">可合闸、可带负荷运行</text>
    <text x="165" y="274" font-size="10.5" text-anchor="middle" fill="#666">带负荷时禁止摇动手车（五防②）</text>
  </g>

  <!-- 试验位 -->
  <g>
    <rect x="345" y="50" width="250" height="250" rx="6" fill="#f7f9fb" stroke="#b0bcc4"/>
    <text x="470" y="72" font-size="14" font-weight="bold" text-anchor="middle" fill="#d09000">试验位</text>
    <line x1="405" y1="95" x2="535" y2="95" stroke="#2c3a45" stroke-width="6" stroke-linecap="round"/>
    <text x="470" y="88" font-size="10" text-anchor="middle" fill="#333">母线（静触头）</text>
    <!-- 手车下移 -->
    <rect x="415" y="135" width="110" height="110" rx="4" fill="#dfe3e7" stroke="#2c3a45"/>
    <text x="470" y="165" font-size="11" text-anchor="middle" fill="#333">断路器手车</text>
    <!-- 一次断开（留间隙） -->
    <line x1="470" y1="95" x2="470" y2="112" stroke="#8a9aa5" stroke-width="3" stroke-dasharray="4 3"/>
    <text x="470" y="200" font-size="10" text-anchor="middle" fill="#c0392b">一次插头：断开</text>
    <text x="470" y="222" font-size="10" text-anchor="middle" fill="#1b8a1b">二次插头：接通</text>
    <text x="470" y="252" font-size="11" text-anchor="middle" fill="#333">可进行分合闸与保护试验</text>
    <text x="470" y="274" font-size="10.5" text-anchor="middle" fill="#666">试验/检修前必先分闸、验电</text>
  </g>

  <!-- 检修位（脱开位） -->
  <g>
    <rect x="650" y="50" width="250" height="250" rx="6" fill="#f7f9fb" stroke="#b0bcc4"/>
    <text x="775" y="72" font-size="14" font-weight="bold" text-anchor="middle" fill="#8b0000">检修位（脱开位）</text>
    <line x1="710" y1="95" x2="840" y2="95" stroke="#2c3a45" stroke-width="6" stroke-linecap="round"/>
    <text x="775" y="88" font-size="10" text-anchor="middle" fill="#333">母线（静触头）</text>
    <rect x="720" y="150" width="110" height="95" rx="4" fill="#dfe3e7" stroke="#2c3a45"/>
    <text x="775" y="180" font-size="11" text-anchor="middle" fill="#333">断路器手车</text>
    <text x="775" y="212" font-size="10" text-anchor="middle" fill="#c0392b">一次插头：断开</text>
    <text x="775" y="232" font-size="10" text-anchor="middle" fill="#c0392b">二次插头：断开</text>
    <text x="775" y="262" font-size="11" text-anchor="middle" fill="#333">一、二次全断，可拉出小车</text>
    <text x="775" y="284" font-size="10.5" text-anchor="middle" fill="#666">检修完成后按逆顺序恢复</text>
  </g>

  <!-- ── 下部：接地开关 / 电磁锁 / 摇柄 ── -->
  <g>
    <rect x="40" y="320" width="860" height="130" rx="6" fill="#fdf7f0" stroke="#c8a24a"/>
    <text x="60" y="344" font-size="13.5" font-weight="bold" fill="#8b4513">接地开关操作相关部件</text>

    <!-- 接地开关示意 -->
    <line x1="80" y1="380" x2="80" y2="410" stroke="#1a252f" stroke-width="2"/>
    <line x1="72" y1="380" x2="88" y2="380" stroke="#8b0000" stroke-width="3.2"/>
    <line x1="80" y1="410" x2="60" y2="392" stroke="#1a252f" stroke-width="3"/>
    <line x1="60" y1="410" x2="100" y2="410" stroke="#5a6a75" stroke-width="2"/>
    <line x1="66" y1="416" x2="94" y2="416" stroke="#5a6a75" stroke-width="2"/>
    <line x1="72" y1="422" x2="88" y2="422" stroke="#5a6a75" stroke-width="2"/>
    <text x="80" y="440" font-size="10.5" text-anchor="middle" fill="#333">接地开关 + 接地符号</text>

    <!-- 电磁锁 -->
    <rect x="180" y="378" width="46" height="34" rx="3" fill="#1d3a2a" stroke="#3fbf6f" stroke-width="1.5"/>
    <text x="203" y="399" font-size="11" text-anchor="middle" fill="#8ff0b0">锁</text>
    <text x="203" y="440" font-size="10.5" text-anchor="middle" fill="#333">接地开关电磁锁</text>

    <!-- 摇柄孔 -->
    <circle cx="290" cy="394" r="9" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="1.5"/>
    <circle cx="290" cy="394" r="3" fill="#5a5a5a"/>
    <text x="290" y="440" font-size="10.5" text-anchor="middle" fill="#333">摇柄插入孔</text>

    <!-- 二次插头 -->
    <rect x="360" y="380" width="30" height="16" rx="2" fill="#cdd8e0" stroke="#2c3a45"/>
    <rect x="392" y="382" width="18" height="12" rx="2" fill="#9aa1a8" stroke="#2c3a45"/>
    <text x="390" y="440" font-size="10.5" text-anchor="middle" fill="#333">二次插头（航空插头）</text>

    <!-- 操作说明 -->
    <text x="470" y="372" font-size="12" fill="#333">接地开关操作步骤（五防③④）：</text>
    <text x="470" y="392" font-size="11.5" fill="#333">① 分闸并摇到试验位 → ② 若线路无电，打开电磁锁（解锁）</text>
    <text x="470" y="410" font-size="11.5" fill="#333">③ 插入手柄，顺时针摇 5 圈 → ④ 接地开关三相同步合上、出线接地</text>
    <text x="470" y="430" font-size="11.5" fill="#c0392b">接地开关合上后：禁止合断路器、禁止摇回工作位；此时方可打开柜门（五防⑤）</text>
  </g>
</svg>
