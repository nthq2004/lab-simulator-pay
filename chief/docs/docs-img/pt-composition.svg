<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <defs>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a085"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="540" fill="#fbfcfe"/>

  <!-- 气路 -->
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#0e6655">一、气路（压力的产生与传递）</text>
  <g stroke="#16a085" stroke-width="3" fill="none" marker-end="url(#arrT)">
    <line x1="165" y1="110" x2="215" y2="110"/>
    <line x1="335" y1="110" x2="385" y2="110"/>
    <line x1="505" y1="110" x2="555" y2="110"/>
    <polyline points="665,105 665,60 700,60"/>
    <line x1="665" y1="120" x2="700" y2="150"/>
  </g>
  <g fill="#e8f6f3" stroke="#16a085" stroke-width="2">
    <rect x="45" y="75" width="120" height="70" rx="10"/>
    <rect x="215" y="75" width="120" height="70" rx="10"/>
    <rect x="385" y="75" width="120" height="70" rx="10"/>
    <rect x="555" y="75" width="110" height="70" rx="10"/>
    <rect x="700" y="30" width="150" height="60" rx="10"/>
    <rect x="700" y="120" width="170" height="90" rx="10"/>
  </g>
  <g font-size="16" fill="#0b5345" text-anchor="middle">
    <text x="105" y="118">气瓶</text>
    <text x="275" y="118">截止阀</text>
    <text x="445" y="118">调节阀</text>
    <text x="610" y="118">三通</text>
    <text x="775" y="65">压力表</text>
    <text x="785" y="160">压力变送器</text>
    <text x="785" y="182" font-size="13" fill="#16a085">（气压输入口 i）</text>
  </g>
  <text x="105" y="140" font-size="12" fill="#7f8c8d" text-anchor="middle">cab</text>
  <text x="275" y="140" font-size="12" fill="#7f8c8d" text-anchor="middle">stopv</text>
  <text x="445" y="140" font-size="12" fill="#7f8c8d" text-anchor="middle">preg</text>
  <text x="610" y="140" font-size="12" fill="#7f8c8d" text-anchor="middle">tconn</text>
  <text x="775" y="65" font-size="11" fill="#7f8c8d" dy="14" text-anchor="middle">pmeter</text>

  <!-- 电气回路 -->
  <text x="24" y="300" font-size="20" font-weight="bold" fill="#922b21">二、电气回路（4~20mA 电流信号的回路）</text>
  <g stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#arrR)">
    <line x1="185" y1="380" x2="235" y2="380"/>
    <line x1="360" y1="380" x2="410" y2="380"/>
    <line x1="565" y1="380" x2="615" y2="380"/>
  </g>
  <path d="M725,415 L725,470 L105,470 L105,425" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#arrR)"/>
  <g fill="#fdedec" stroke="#c0392b" stroke-width="2">
    <rect x="45" y="340" width="140" height="80" rx="10"/>
    <rect x="235" y="350" width="125" height="60" rx="10"/>
    <rect x="410" y="340" width="155" height="80" rx="10"/>
    <rect x="615" y="350" width="110" height="60" rx="10"/>
  </g>
  <g font-size="16" fill="#7b241c" text-anchor="middle">
    <text x="115" y="378">DC 24V 电源</text>
    <text x="115" y="400" font-size="12" fill="#c0392b">(+) p / (-) n</text>
    <text x="297" y="378">可变电阻</text>
    <text x="297" y="398" font-size="12" fill="#c0392b">限流负载</text>
    <text x="487" y="378">压力变送器</text>
    <text x="487" y="400" font-size="12" fill="#c0392b">P(+) / N(−) 两端</text>
    <text x="670" y="388">电流表</text>
  </g>

  <!-- 同一台变送器 -->
  <line x1="785" y1="210" x2="785" y2="300" stroke="#8e44ad" stroke-width="2" stroke-dasharray="7 5"/>
  <line x1="785" y1="300" x2="565" y2="380" stroke="#8e44ad" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="800" y="262" font-size="14" fill="#8e44ad">同一台</text>
  <text x="800" y="282" font-size="14" fill="#8e44ad">两线制变送器</text>

  <text x="24" y="514" font-size="14" fill="#555">压力 p 经变送器线性转换为回路电流 I：I = 4mA + 16mA × (p / 量程)。测得电流即可反推压力。</text>
</svg>
