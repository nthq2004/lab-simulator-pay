<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 740" width="820" height="740" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="820" height="740" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="410" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#276749">控制回路</text>

  <!-- 控制变压器 -->
  <rect x="320" y="36" width="180" height="84" rx="10" fill="#eafaf1" stroke="#276749" stroke-width="2"/>
  <text x="410" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">控制变压器 TC</text>
  <text x="410" y="90" text-anchor="middle" font-size="13" fill="#4a5568">380 V / 220 V</text>

  <!-- 一次侧 -->
  <line x1="320" y1="56" x2="270" y2="56" stroke="#276749" stroke-width="2"/>
  <rect x="200" y="42" width="70" height="28" rx="6" fill="#ffffff" stroke="#276749" stroke-width="2"/>
  <text x="235" y="61" text-anchor="middle" font-size="12" fill="#276749">FU4</text>
  <line x1="200" y1="56" x2="90" y2="56" stroke="#276749" stroke-width="2"/>
  <text x="82" y="60" text-anchor="end" font-size="12" fill="#276749">L3</text>

  <line x1="320" y1="100" x2="90" y2="100" stroke="#276749" stroke-width="2"/>
  <text x="82" y="104" text-anchor="end" font-size="12" fill="#276749">L2</text>

  <!-- 副边 s2 引出（控制回路供电） -->
  <line x1="500" y1="100" x2="600" y2="100" stroke="#276749" stroke-width="2"/>
  <line x1="600" y1="100" x2="600" y2="170" stroke="#276749" stroke-width="2"/>
  <text x="508" y="94" text-anchor="start" font-size="11" fill="#276749">s2</text>

  <!-- 副边 s1 回零线（虚线） -->
  <line x1="500" y1="56" x2="780" y2="56" stroke="#276749" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="780" y1="56" x2="780" y2="700" stroke="#276749" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="508" y="50" text-anchor="start" font-size="11" fill="#276749">s1</text>

  <!-- SB1 停止按钮 -->
  <rect x="490" y="170" width="220" height="46" rx="8" fill="#eafaf1" stroke="#276749" stroke-width="2"/>
  <text x="600" y="199" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">SB1 停止按钮（常闭）</text>

  <!-- 分支 -->
  <line x1="600" y1="216" x2="600" y2="250" stroke="#276749" stroke-width="2"/>
  <line x1="250" y1="250" x2="600" y2="250" stroke="#276749" stroke-width="2"/>
  <line x1="250" y1="250" x2="250" y2="280" stroke="#276749" stroke-width="2"/>
  <line x1="570" y1="250" x2="570" y2="280" stroke="#276749" stroke-width="2"/>
  <circle cx="250" cy="250" r="3" fill="#276749"/>
  <circle cx="570" cy="250" r="3" fill="#276749"/>

  <!-- 正转支路 -->
  <rect x="120" y="280" width="260" height="170" rx="10" fill="#eafaf1" stroke="#276749" stroke-width="2"/>
  <text x="250" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">正转支路（KM1）</text>
  <text x="250" y="338" text-anchor="middle" font-size="12" fill="#276749">SB2 常开起动 ∥ KM1-NO 自锁</text>
  <text x="250" y="364" text-anchor="middle" font-size="12" fill="#c05621">→ KM2-NC 互锁</text>
  <text x="250" y="390" text-anchor="middle" font-size="12" fill="#276749">→ KM1 线圈</text>
  <text x="250" y="420" text-anchor="middle" font-size="11" fill="#4a5568">得电吸合 → 主触头闭合 → 正转</text>

  <!-- 反转支路 -->
  <rect x="440" y="280" width="260" height="170" rx="10" fill="#eafaf1" stroke="#276749" stroke-width="2"/>
  <text x="570" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">反转支路（KM2）</text>
  <text x="570" y="338" text-anchor="middle" font-size="12" fill="#276749">SB3 常开起动 ∥ KM2-NO 自锁</text>
  <text x="570" y="364" text-anchor="middle" font-size="12" fill="#c05621">→ KM1-NC 互锁</text>
  <text x="570" y="390" text-anchor="middle" font-size="12" fill="#276749">→ KM2 线圈</text>
  <text x="570" y="420" text-anchor="middle" font-size="11" fill="#4a5568">得电吸合 → 主触头换相 → 反转</text>

  <!-- 汇合 -->
  <line x1="250" y1="450" x2="250" y2="490" stroke="#276749" stroke-width="2"/>
  <line x1="570" y1="450" x2="570" y2="490" stroke="#276749" stroke-width="2"/>
  <line x1="250" y1="490" x2="570" y2="490" stroke="#276749" stroke-width="2"/>
  <circle cx="410" cy="490" r="3" fill="#276749"/>
  <line x1="410" y1="490" x2="410" y2="520" stroke="#276749" stroke-width="2"/>

  <!-- FR-NC -->
  <rect x="310" y="520" width="200" height="46" rx="8" fill="#eafaf1" stroke="#276749" stroke-width="2"/>
  <text x="410" y="549" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">FR-NC 热继电器常闭</text>

  <line x1="410" y1="566" x2="410" y2="600" stroke="#276749" stroke-width="2"/>

  <!-- FU5 -->
  <rect x="350" y="600" width="120" height="44" rx="8" fill="#ffffff" stroke="#276749" stroke-width="2"/>
  <text x="410" y="628" text-anchor="middle" font-size="13" fill="#276749">FU5 熔断器</text>

  <line x1="410" y1="644" x2="410" y2="700" stroke="#276749" stroke-width="2"/>
  <line x1="410" y1="700" x2="780" y2="700" stroke="#276749" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- 指示灯支路说明 -->
  <rect x="60" y="600" width="250" height="80" rx="8" fill="#fffaf0" stroke="#c05621" stroke-width="2"/>
  <text x="185" y="622" text-anchor="middle" font-size="12" font-weight="bold" fill="#c05621">指示灯支路</text>
  <text x="185" y="642" text-anchor="middle" font-size="11" fill="#4a5568">KM1-NO → 正转绿灯</text>
  <text x="185" y="658" text-anchor="middle" font-size="11" fill="#4a5568">KM2-NO → 反转红灯</text>
  <text x="185" y="674" text-anchor="middle" font-size="11" fill="#4a5568">s2 → 黄灯（电源指示）</text>
</svg>
