<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5a">图 4  长按连加时序（I0.0 按住 → VW0 变化）</text>

  <!-- 时间轴 -->
  <line x1="90" y1="380" x2="720" y2="380" stroke="#333" stroke-width="1.5"/>
  <text x="720" y="400" text-anchor="end" font-size="12" fill="#333">时间 t</text>

  <!-- I0.0 波形 -->
  <text x="30" y="90" font-size="13" font-weight="bold" fill="#c0392b">I0.0</text>
  <line x1="90" y1="100" x2="190" y2="100" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="190" y1="100" x2="190" y2="60" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="190" y1="60" x2="660" y2="60" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="660" y1="60" x2="660" y2="100" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="660" y1="100" x2="720" y2="100" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="90" y1="100" x2="90" y2="60" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="196" y="52" font-size="11" fill="#c0392b">按下</text>
  <text x="640" y="52" font-size="11" fill="#c0392b">松开</text>

  <!-- M0.1 上升沿脉冲 -->
  <text x="30" y="170" font-size="13" font-weight="bold" fill="#d4ac0d">M0.1</text>
  <text x="30" y="185" font-size="10" fill="#888">上升沿</text>
  <line x1="90" y1="200" x2="720" y2="200" stroke="#d4ac0d" stroke-width="1.5"/>
  <rect x="188" y="176" width="8" height="24" fill="#d4ac0d"/>
  <text x="176" y="220" font-size="10" fill="#7d6608">1 次</text>

  <!-- T32 2s -->
  <text x="30" y="260" font-size="13" font-weight="bold" fill="#8e44ad">T32</text>
  <text x="30" y="275" font-size="10" fill="#888">2s 延时</text>
  <line x1="90" y1="290" x2="720" y2="290" stroke="#8e44ad" stroke-width="1.5"/>
  <line x1="190" y1="290" x2="360" y2="290" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="360" y1="290" x2="360" y2="262" stroke="#8e44ad" stroke-width="2"/>
  <line x1="360" y1="262" x2="660" y2="262" stroke="#8e44ad" stroke-width="2"/>
  <text x="300" y="284" font-size="10" fill="#6c3483">2s</text>
  <text x="360" y="256" font-size="10" fill="#6c3483">T32 动作</text>

  <!-- M0.4 连加脉冲 -->
  <text x="30" y="340" font-size="13" font-weight="bold" fill="#1e8449">M0.4</text>
  <text x="30" y="355" font-size="10" fill="#888">0.2s 脉冲</text>
  <line x1="90" y1="360" x2="720" y2="360" stroke="#1e8449" stroke-width="1.5"/>
  <g fill="#1e8449">
    <rect x="364" y="336" width="6" height="24"/>
    <rect x="400" y="336" width="6" height="24"/>
    <rect x="436" y="336" width="6" height="24"/>
    <rect x="472" y="336" width="6" height="24"/>
    <rect x="508" y="336" width="6" height="24"/>
    <rect x="544" y="336" width="6" height="24"/>
    <rect x="580" y="336" width="6" height="24"/>
    <rect x="616" y="336" width="6" height="24"/>
  </g>
  <text x="490" y="332" font-size="10" fill="#145a32">每 0.2s 一个脉冲（自复位 T33）</text>

  <!-- VW0 递增 -->
  <line x1="90" y1="405" x2="720" y2="405" stroke="#e67e22" stroke-width="1.5"/>
  <g fill="#e67e22" font-size="10">
    <text x="192" y="418">+1</text>
    <text x="366" y="418">+1</text>
    <text x="402" y="418">+1</text>
    <text x="438" y="418">+1</text>
    <text x="474" y="418">+1</text>
    <text x="510" y="418">+1</text>
  </g>
  <text x="600" y="418" font-size="11" fill="#935116">VW0 步进累加 →</text>
</svg>
