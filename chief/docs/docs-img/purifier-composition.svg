<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <rect width="1000" height="500" fill="#f7f9f8"/>
  <text x="500" y="30" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="bold" fill="#263238">S 型分油机系统组成</text>
  <text x="640" y="58" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#546e7a">S 型分油机 S 936（分离筒 / 分离盘组 / 向心泵 / 自动排渣）</text>

  <!-- tanks -->
  <rect x="30" y="70" width="120" height="150" rx="6" fill="#f3e2c7" stroke="#8d6e63" stroke-width="2"/>
  <rect x="36" y="110" width="108" height="104" fill="#c48b2c" opacity="0.75"/>
  <text x="90" y="243" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#37474f">沉淀柜</text>

  <rect x="770" y="60" width="120" height="150" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <rect x="776" y="126" width="108" height="78" fill="#2e7d32" opacity="0.65"/>
  <text x="830" y="232" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#37474f">净油日用柜</text>

  <rect x="580" y="380" width="120" height="90" rx="6" fill="#efebe9" stroke="#6d4c41" stroke-width="2"/>
  <rect x="586" y="428" width="108" height="36" fill="#6d4c41" opacity="0.6"/>
  <text x="640" y="488" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#37474f">排渣柜</text>

  <!-- pump / filter / heater / valve -->
  <rect x="190" y="120" width="70" height="60" rx="6" fill="#cfd8dc" stroke="#546e7a" stroke-width="2"/>
  <circle cx="225" cy="150" r="18" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="225" y="200" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">进油泵</text>

  <rect x="300" y="132" width="44" height="44" rx="4" fill="#b0bec5" stroke="#455a64" stroke-width="2"/>
  <text x="322" y="200" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">滤器</text>

  <rect x="380" y="112" width="80" height="80" rx="6" fill="#cfd8dc" stroke="#546e7a" stroke-width="2"/>
  <rect x="392" y="124" width="56" height="56" rx="3" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1"/>
  <text x="420" y="210" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">加热器</text>

  <rect x="500" y="130" width="54" height="48" rx="4" fill="#dfe4e2" stroke="#546e7a" stroke-width="2"/>
  <circle cx="527" cy="154" r="10" fill="#90a4ae" stroke="#455a64"/>
  <text x="527" y="200" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#37474f">转换阀 V1</text>

  <!-- separator -->
  <circle cx="640" cy="155" r="80" fill="#cfd8dc" stroke="#546e7a" stroke-width="3"/>
  <circle cx="640" cy="155" r="66" fill="#eceff1" stroke="#78909c" stroke-width="2"/>
  <g stroke="#90a4ae" stroke-width="2">
    <line x1="596" y1="140" x2="684" y2="140"/><line x1="596" y1="150" x2="684" y2="150"/>
    <line x1="596" y1="160" x2="684" y2="160"/><line x1="596" y1="170" x2="684" y2="170"/>
  </g>
  <line x1="640" y1="95" x2="640" y2="225" stroke="#607d8b" stroke-width="3"/>
  <rect x="698" y="104" width="14" height="20" fill="#ffb74d" stroke="#ef6c00" stroke-width="1.5"/>

  <!-- EPC -->
  <rect x="720" y="250" width="180" height="112" rx="6" fill="#37474f" stroke="#1b1e1f" stroke-width="2"/>
  <rect x="732" y="262" width="156" height="42" rx="2" fill="#07160f" stroke="#0b0d0c" stroke-width="1"/>
  <text x="810" y="288" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#6dff9a">SEPARATION</text>
  <g font-family="Microsoft YaHei, Arial" font-size="9" fill="#eceff1">
    <rect x="732" y="310" width="46" height="18" rx="2" fill="#1b5e20"/><text x="755" y="323" text-anchor="middle">SEP</text>
    <rect x="782" y="310" width="46" height="18" rx="2" fill="#b71c1c"/><text x="805" y="323" text-anchor="middle">STOP</text>
    <rect x="832" y="310" width="56" height="18" rx="2" fill="#f9a825"/><text x="860" y="323" text-anchor="middle" fill="#3e2723">DISCH</text>
    <rect x="732" y="333" width="46" height="18" rx="2" fill="#455a64"/><text x="755" y="346" text-anchor="middle">INFO</text>
    <rect x="782" y="333" width="46" height="18" rx="2" fill="#455a64"/><text x="805" y="346" text-anchor="middle">ENTER</text>
    <rect x="832" y="333" width="56" height="18" rx="2" fill="#37474f"/><text x="860" y="346" text-anchor="middle">+ / −</text>
  </g>
  <text x="810" y="380" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="bold" fill="#263238">EPC-60 控制器</text>

  <!-- utility blocks -->
  <rect x="170" y="300" width="300" height="96" rx="6" fill="#e3f2fd" stroke="#4fc3f7" stroke-width="2"/>
  <text x="320" y="326" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="10.5" font-weight="bold" fill="#0277bd">工作水：SV10 水封 · SV15 开启 · SV16 关闭</text>
  <text x="320" y="348" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="10" fill="#0277bd">工作水 2～8 bar</text>
  <rect x="60" y="258" width="130" height="38" rx="4" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2"/>
  <text x="125" y="282" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="10" fill="#2e7d32">控制空气 5～7 bar</text>

  <!-- pipes -->
  <g stroke="#8d6e63" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M150 190 H190"/><path d="M260 150 H300"/><path d="M344 154 H380"/><path d="M460 152 H500"/><path d="M554 154 H580"/>
  </g>
  <g stroke="#c48b2c" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M712 113 H770"/>
  </g>
  <g stroke="#4fc3f7" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M470 348 H600 V228"/>
  </g>
  <g stroke="#795548" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M640 228 V380"/>
  </g>

  <g font-family="Microsoft YaHei, Arial" font-size="9" fill="#78909c">
    <text x="164" y="112">含渣燃油</text>
    <text x="722" y="100">净油</text>
    <text x="652" y="300">排渣</text>
    <text x="480" y="340">工作水</text>
  </g>
</svg>
