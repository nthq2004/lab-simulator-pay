<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect width="900" height="520" fill="#f7f9fa"/>
  <text x="450" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f3b4d">火灾报警系统组成框图</text>

  <!-- 控制器 -->
  <rect x="60" y="70" width="240" height="150" rx="10" fill="#4a4f55" stroke="#33383d" stroke-width="2"/>
  <text x="180" y="110" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">火灾报警控制器</text>
  <text x="180" y="134" font-size="12" fill="#cfd8dc" text-anchor="middle">Fire Detection System (FAS)</text>
  <text x="180" y="158" font-size="12" fill="#cfd8dc" text-anchor="middle">STATUS / MENU / 隔离</text>
  <text x="180" y="182" font-size="12" fill="#ffd54f" text-anchor="middle">两路 CAN 接口</text>
  <circle cx="90" cy="205" r="6" fill="#25d425"/><text x="104" y="210" font-size="11" fill="#cfd8dc">Power</text>

  <!-- 声光报警器 -->
  <rect x="60" y="300" width="120" height="70" rx="8" fill="#c62828" stroke="#7f1d1d" stroke-width="2"/>
  <text x="120" y="330" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">声光报警器</text>
  <text x="120" y="350" font-size="10" fill="#ffd54f" text-anchor="middle">由控制器驱动</text>
  <line x1="180" y1="220" x2="120" y2="300" stroke="#888" stroke-width="2"/>

  <!-- 回路1 -->
  <rect x="380" y="70" width="470" height="150" rx="10" fill="#fff" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="400" y="94" font-size="14" font-weight="bold" fill="#263238">LOOP1（CAN1 回路）</text>
  <line x1="300" y1="145" x2="380" y2="145" stroke="#e74c3c" stroke-width="2"/>
  <text x="340" y="138" font-size="10" fill="#e74c3c" text-anchor="middle">CAN1</text>

  <g font-size="12" fill="#263238">
    <rect x="400" y="110" width="100" height="46" rx="6" fill="#e8f0f6" stroke="#607d8b"/><text x="450" y="130" text-anchor="middle">感烟 #1</text><text x="450" y="147" font-size="10" fill="#546e7a" text-anchor="middle">ZONE1</text>
    <rect x="510" y="110" width="100" height="46" rx="6" fill="#e8f0f6" stroke="#607d8b"/><text x="560" y="130" text-anchor="middle">感光 #2</text><text x="560" y="147" font-size="10" fill="#546e7a" text-anchor="middle">ZONE1</text>
    <rect x="620" y="110" width="100" height="46" rx="6" fill="#e8f0f6" stroke="#607d8b"/><text x="670" y="130" text-anchor="middle">感烟 #3</text><text x="670" y="147" font-size="10" fill="#546e7a" text-anchor="middle">ZONE2</text>
    <rect x="730" y="110" width="105" height="46" rx="6" fill="#e8f0f6" stroke="#607d8b"/><text x="782" y="130" text-anchor="middle">手报 #4</text><text x="782" y="147" font-size="10" fill="#546e7a" text-anchor="middle">ZONE2</text>
  </g>
  <text x="640" y="200" font-size="12" fill="#546e7a" text-anchor="middle">ZONE1 = 发电机　ZONE2 = 主机</text>

  <!-- 回路2 -->
  <rect x="380" y="250" width="470" height="150" rx="10" fill="#fff" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="400" y="274" font-size="14" font-weight="bold" fill="#263238">LOOP2（CAN2 回路）</text>
  <line x1="300" y1="235" x2="380" y2="325" stroke="#e74c3c" stroke-width="2"/>
  <text x="340" y="300" font-size="10" fill="#e74c3c" text-anchor="middle">CAN2</text>

  <g font-size="12" fill="#263238">
    <rect x="400" y="290" width="100" height="46" rx="6" fill="#e8f0f6" stroke="#607d8b"/><text x="450" y="310" text-anchor="middle">感烟 #5</text><text x="450" y="327" font-size="10" fill="#546e7a" text-anchor="middle">ZONE3</text>
    <rect x="510" y="290" width="100" height="46" rx="6" fill="#e8f0f6" stroke="#607d8b"/><text x="560" y="310" text-anchor="middle">感温 #6</text><text x="560" y="327" font-size="10" fill="#546e7a" text-anchor="middle">ZONE3</text>
    <rect x="620" y="290" width="100" height="46" rx="6" fill="#e8f0f6" stroke="#607d8b"/><text x="670" y="310" text-anchor="middle">感烟 #7</text><text x="670" y="327" font-size="10" fill="#546e7a" text-anchor="middle">ZONE4</text>
    <rect x="730" y="290" width="105" height="46" rx="6" fill="#e8f0f6" stroke="#607d8b"/><text x="782" y="310" text-anchor="middle">手报 #8</text><text x="782" y="327" font-size="10" fill="#546e7a" text-anchor="middle">ZONE4</text>
  </g>
  <text x="640" y="380" font-size="12" fill="#546e7a" text-anchor="middle">ZONE3 = 锅炉　ZONE4 = 分油机</text>

  <!-- 消防控制面板 -->
  <rect x="380" y="430" width="240" height="66" rx="8" fill="#3f8f86" stroke="#2c6b63" stroke-width="2"/>
  <text x="500" y="458" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">消防控制面板</text>
  <text x="500" y="480" font-size="11" fill="#eafaf7" text-anchor="middle">主机 / 发电机 / 分油机 / 锅炉</text>
  <line x1="300" y1="180" x2="380" y2="463" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="318" y="330" font-size="10" fill="#2e7d32">ZONE 联动</text>

  <rect x="660" y="430" width="190" height="66" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="755" y="458" font-size="13" font-weight="bold" fill="#0d47a1" text-anchor="middle">喷淋系统</text>
  <text x="755" y="480" font-size="11" fill="#1565c0" text-anchor="middle">泵 → 阀 → 喷头</text>
  <line x1="620" y1="463" x2="660" y2="463" stroke="#2e7d32" stroke-width="1.5"/>
</svg>
