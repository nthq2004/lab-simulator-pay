<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="940" height="500" fill="#f7fafc"/>
  <text x="470" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a365d">流程 9.2　监测系统内存、死机等系统故障判定和处理</text>
  <text x="470" y="50" text-anchor="middle" font-size="11" fill="#718096">典型故障：DPU（总线节点）系统死机 —— 供电与接线均正常，但模块停止运行、数据不再刷新</text>

  <defs>
    <marker id="ar4" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#4a5568"/>
    </marker>
  </defs>

  <!-- 第一行 4 步 -->
  <g font-size="11">
    <rect x="20" y="80" width="200" height="96" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/>
    <text x="120" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6cb0">① 识别部件</text>
    <text x="120" y="126" text-anchor="middle" fill="#2d3748">DPU 模块 AI/AO/DI/DO</text>
    <text x="120" y="144" text-anchor="middle" fill="#2d3748">CAN 总线连接器</text>
    <text x="120" y="164" text-anchor="middle" fill="#718096">中央监控计算机</text>

    <rect x="252" y="80" width="200" height="96" rx="6" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.5"/>
    <text x="352" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d3748">② 起动系统</text>
    <text x="352" y="126" text-anchor="middle" fill="#4a5568">自动接线 → 上电 → 遥控</text>
    <text x="352" y="144" text-anchor="middle" fill="#4a5568">→ 控制器自动</text>
    <text x="352" y="164" text-anchor="middle" fill="#718096">建立无报警基线</text>

    <rect x="484" y="80" width="200" height="96" rx="6" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5"/>
    <text x="584" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#c53030">③ 设置死机故障</text>
    <text x="584" y="126" text-anchor="middle" fill="#4a5568">故障界面勾选</text>
    <text x="584" y="144" text-anchor="middle" fill="#4a5568">「总线节点 系统死机」</text>
    <text x="584" y="164" text-anchor="middle" fill="#718096">应用设置</text>

    <rect x="716" y="80" width="204" height="96" rx="6" fill="#fffaf0" stroke="#f6ad55" stroke-width="1.5"/>
    <text x="818" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#c05621">④ 查看报警</text>
    <text x="818" y="126" text-anchor="middle" fill="#4a5568">CC 报「节点1 通信异常报警」</text>
    <text x="818" y="144" text-anchor="middle" fill="#4a5568">消音 → 确认</text>
    <text x="818" y="164" text-anchor="middle" fill="#718096">记录故障信息</text>
  </g>
  <g stroke="#4a5568" stroke-width="2" marker-end="url(#ar4)">
    <line x1="220" y1="128" x2="250" y2="128"/>
    <line x1="452" y1="128" x2="482" y2="128"/>
    <line x1="684" y1="128" x2="714" y2="128"/>
  </g>
  <line x1="818" y1="176" x2="818" y2="210" stroke="#4a5568" stroke-width="2"/>
  <line x1="818" y1="210" x2="120" y2="210" stroke="#4a5568" stroke-width="2"/>
  <line x1="120" y1="210" x2="120" y2="230" stroke="#4a5568" stroke-width="2" marker-end="url(#ar4)"/>

  <!-- 第二行 4 步 -->
  <g font-size="11">
    <rect x="20" y="232" width="200" height="100" rx="6" fill="#fff" stroke="#3182ce" stroke-width="1.5"/>
    <text x="120" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6cb0">⑤ 定位死机节点</text>
    <text x="120" y="278" text-anchor="middle" fill="#4a5568">观察 AI 模块面板灯：</text>
    <text x="120" y="296" text-anchor="middle" fill="#c53030">RUN 灭 · FLT 亮 · COM 灭</text>
    <text x="120" y="316" text-anchor="middle" fill="#4a5568">网络诊断页该节点离线</text>

    <rect x="252" y="232" width="200" height="100" rx="6" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5"/>
    <text x="352" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#c53030">⑥ 对比排除</text>
    <text x="352" y="278" text-anchor="middle" fill="#4a5568">供电 PWR 灯仍亮</text>
    <text x="352" y="296" text-anchor="middle" fill="#4a5568">供电与接线均正常</text>
    <text x="352" y="316" text-anchor="middle" fill="#718096">→ 排除断线，锁定模块死机</text>

    <rect x="484" y="232" width="200" height="100" rx="6" fill="#f0fff4" stroke="#2f855a" stroke-width="1.5"/>
    <text x="584" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#22543d">⑦ 重启 / 复位模块</text>
    <text x="584" y="278" text-anchor="middle" fill="#4a5568">故障界面取消勾选</text>
    <text x="584" y="296" text-anchor="middle" fill="#4a5568">应用设置 = 断电重启 / 复位</text>
    <text x="584" y="316" text-anchor="middle" fill="#718096">模块重新初始化并接入总线</text>

    <rect x="716" y="232" width="204" height="100" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/>
    <text x="818" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6cb0">⑧ 恢复 + 测验</text>
    <text x="818" y="278" text-anchor="middle" fill="#4a5568">清除报警记录</text>
    <text x="818" y="296" text-anchor="middle" fill="#4a5568">RUN/COM 灯恢复、数据刷新</text>
    <text x="818" y="316" text-anchor="middle" fill="#718096">系统死机故障诊断测验</text>
  </g>
  <g stroke="#4a5568" stroke-width="2" marker-end="url(#ar4)">
    <line x1="220" y1="282" x2="250" y2="282"/>
    <line x1="452" y1="282" x2="482" y2="282"/>
    <line x1="684" y1="282" x2="714" y2="282"/>
  </g>

  <!-- 仪表板 -->
  <rect x="20" y="356" width="900" height="128" rx="6" fill="#fff" stroke="#cbd5e0"/>
  <text x="470" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#c53030">诊断要点</text>
  <text x="36" y="404" font-size="11" fill="#2d3748">· 现象：CC 报「节点1 通信异常报警」，AI 节点数据停止刷新；供电正常（PWR 亮）。</text>
  <text x="36" y="426" font-size="11" fill="#2d3748">· 判据：RUN 灯熄灭 + FLT 灯点亮 + COM 灯熄灭，且网络诊断页该节点离线 —— 属系统级死机。</text>
  <text x="36" y="448" font-size="11" fill="#2d3748">· 处理：断电重启 / 复位模块，待其重新初始化、数据恢复刷新后，清除报警记录。</text>
  <text x="36" y="470" font-size="11" fill="#c53030">· 与 9.1 的区别：9.1 是控制单元“输出侧”触头故障；9.2 是 DPU 模块“本体”系统死机，处理手段不同。</text>
</svg>
