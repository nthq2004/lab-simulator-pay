<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#6a1b9a"/>
    </marker>
  </defs>
  <rect width="920" height="470" fill="#f7f9fb"/>
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#2c3e50">图 4　空压机安保（保护）功能链</text>

  <!-- protections -->
  <rect x="24" y="60" width="170" height="54" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="109" y="83" font-size="14" text-anchor="middle" fill="#7b241c">过电流保护</text>
  <text x="109" y="102" font-size="12" text-anchor="middle" fill="#7b241c">触头闭合（I2.0 / I2.3）</text>

  <rect x="24" y="140" width="170" height="54" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="109" y="163" font-size="14" text-anchor="middle" fill="#7b241c">排气温度高</text>
  <text x="109" y="182" font-size="12" text-anchor="middle" fill="#7b241c">触头闭合（I2.1 / I2.4）</text>

  <rect x="24" y="220" width="170" height="54" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="109" y="243" font-size="14" text-anchor="middle" fill="#7b241c">润滑油压低</text>
  <text x="109" y="262" font-size="12" text-anchor="middle" fill="#7b241c">触头闭合（I2.2 / I2.5）</text>

  <rect x="24" y="300" width="170" height="54" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="109" y="323" font-size="14" text-anchor="middle" fill="#7b241c">（2#）同类保护</text>
  <text x="109" y="342" font-size="12" text-anchor="middle" fill="#7b241c">I2.4 / I2.5 / I2.6</text>

  <!-- EM DI08 -->
  <rect x="280" y="150" width="160" height="120" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="360" y="188" font-size="15" text-anchor="middle" fill="#0d47a1">EM DI08</text>
  <text x="360" y="212" font-size="12" text-anchor="middle" fill="#0d47a1">扩展输入模块</text>
  <text x="360" y="234" font-size="12" text-anchor="middle" fill="#0d47a1">槽0 · I2.0~I2.7</text>

  <!-- PLC -->
  <rect x="520" y="120" width="170" height="180" rx="8" fill="#cfd8dc" stroke="#37474f" stroke-width="2"/>
  <text x="605" y="158" font-size="15" font-weight="bold" text-anchor="middle" fill="#263238">SR20 PLC</text>
  <text x="605" y="188" font-size="12" text-anchor="middle" fill="#37474f">综合故障</text>
  <text x="605" y="208" font-size="12" text-anchor="middle" fill="#7b241c">M1.0（1#） / M1.1（2#）</text>
  <text x="605" y="240" font-size="12" text-anchor="middle" fill="#37474f">跳闸 + 报警 逻辑</text>
  <text x="605" y="266" font-size="12" text-anchor="middle" fill="#37474f">（AN M1.x 串入输出）</text>

  <!-- outputs -->
  <rect x="740" y="80" width="160" height="70" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="820" y="106" font-size="13" text-anchor="middle" fill="#7b241c">切断 Q0.0 / Q0.1</text>
  <text x="820" y="126" font-size="12" text-anchor="middle" fill="#7b241c">接触器释放 → 机组停机</text>

  <rect x="740" y="220" width="160" height="86" rx="6" fill="#fff8e1" stroke="#f9a825"/>
  <text x="820" y="246" font-size="13" text-anchor="middle" fill="#7f6000">点亮报警灯</text>
  <text x="820" y="267" font-size="12" text-anchor="middle" fill="#7f6000">Q0.2~Q0.7</text>
  <text x="820" y="287" font-size="12" text-anchor="middle" fill="#7f6000">机旁过电流/温度/油压灯</text>

  <!-- arrows -->
  <line x1="194" y1="87" x2="278" y2="165" stroke="#6a1b9a" stroke-width="2" marker-end="url(#ap)"/>
  <line x1="194" y1="167" x2="278" y2="195" stroke="#6a1b9a" stroke-width="2" marker-end="url(#ap)"/>
  <line x1="194" y1="247" x2="278" y2="225" stroke="#6a1b9a" stroke-width="2" marker-end="url(#ap)"/>
  <line x1="194" y1="327" x2="278" y2="255" stroke="#6a1b9a" stroke-width="2" marker-end="url(#ap)"/>
  <line x1="440" y1="210" x2="518" y2="210" stroke="#6a1b9a" stroke-width="2" marker-end="url(#ap)"/>
  <line x1="690" y1="170" x2="738" y2="120" stroke="#c0392b" stroke-width="2" marker-end="url(#ap)"/>
  <line x1="690" y1="250" x2="738" y2="258" stroke="#f9a825" stroke-width="2" marker-end="url(#ap)"/>

  <text x="24" y="420" font-size="13" fill="#263238">任一保护触头闭合 → 对应 DI 置 1 → PLC 置“综合故障”位并立即切断该机输出（跳闸停机），同时点亮对应报警灯。</text>
  <text x="24" y="444" font-size="13" fill="#263238">故障消失后保护触头断开、报警灯熄灭，机组方可恢复运行；保护动作优先于自动/手动起停指令。</text>
</svg>
