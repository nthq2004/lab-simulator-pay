<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <rect width="920" height="520" fill="#fbfcfe"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#1a3a5c">校准接线：用标准电阻替代 PT100，串入输出电流表</text>

  <!-- 变送器 -->
  <rect x="350" y="70" width="240" height="200" rx="14" fill="#eef7f1" stroke="#27ae60" stroke-width="2.5"/>
  <text x="470" y="102" font-size="15" font-weight="bold" fill="#1a3a5c" text-anchor="middle">温度变送器</text>
  <circle cx="470" cy="170" r="46" fill="#000"/>
  <text x="470" y="178" font-size="22" font-family="Consolas,monospace" font-weight="bold" fill="#00ff66" text-anchor="middle">100.0</text>
  <text x="470" y="200" font-size="11" fill="#00ff66" text-anchor="middle">°C</text>
  <text x="400" y="250" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">P(+)</text>
  <text x="540" y="250" font-size="12" fill="#2c3e50" text-anchor="middle" font-weight="bold">N(−)</text>
  <text x="374" y="288" font-size="11" fill="#2c7be5" text-anchor="middle" font-weight="bold">L</text>
  <text x="470" y="290" font-size="11" fill="#b7950b" text-anchor="middle" font-weight="bold">M</text>
  <text x="548" y="290" font-size="11" fill="#2c7be5" text-anchor="middle" font-weight="bold">R</text>

  <!-- 24V 电源 -->
  <rect x="60" y="88" width="170" height="92" rx="10" fill="#fff4e5" stroke="#e67e22" stroke-width="2"/>
  <text x="145" y="120" font-size="14" font-weight="bold" fill="#7e5109" text-anchor="middle">DC 24V 电源</text>
  <text x="145" y="144" font-size="12" fill="#7e5109" text-anchor="middle">P(+) / N(−)</text>
  <text x="145" y="166" font-size="11" fill="#7e5109" text-anchor="middle">先断电后接线</text>

  <!-- 输出电流表 -->
  <circle cx="760" cy="150" r="46" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
  <text x="760" y="146" font-size="16" font-weight="bold" fill="#2c3e50" text-anchor="middle">mA</text>
  <text x="760" y="170" font-size="11" fill="#2c3e50" text-anchor="middle">输出电流表</text>

  <!-- PID / 监控 -->
  <rect x="700" y="300" width="180" height="80" rx="10" fill="#eceff4" stroke="#607d8b" stroke-width="2"/>
  <text x="790" y="332" font-size="13" fill="#37474f" text-anchor="middle">PID / 二次仪表</text>
  <text x="790" y="356" font-size="12" fill="#37474f" text-anchor="middle">指示 0~100℃</text>

  <!-- 标准电阻 -->
  <rect x="350" y="380" width="240" height="100" rx="10" fill="#eaf4ff" stroke="#2c7be5" stroke-width="2"/>
  <text x="470" y="410" font-size="14" font-weight="bold" fill="#1a3a5c" text-anchor="middle">标准可调电阻（电阻箱）</text>
  <text x="470" y="436" font-size="12" fill="#445" text-anchor="middle">100Ω ↔ 0℃　138.51Ω ↔ 100℃</text>
  <text x="470" y="458" font-size="12" fill="#c0392b" text-anchor="middle">每 1Ω ≈ 2.597℃　每 3.85Ω ≈ 10℃</text>

  <!-- 连线：电源 P → 变送器 P -->
  <path d="M230,110 L300,110 L300,140 L392,140 L392,240" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="300" y="130" font-size="11" fill="#c0392b">电源 +</text>
  <!-- 变送器 N → 电流表 → 电源 N -->
  <path d="M540,240 L540,150 L714,150" fill="none" stroke="#2c3e50" stroke-width="2.5"/>
  <path d="M806,150 L860,150 L860,60 L145,60 L145,88" fill="none" stroke="#2c3e50" stroke-width="2.5"/>
  <text x="600" y="142" font-size="11" fill="#2c3e50">N(−) → 电流表</text>

  <!-- 标准电阻三线制 -->
  <path d="M390,380 L390,270" fill="none" stroke="#2c7be5" stroke-width="2"/>
  <path d="M470,380 L470,270" fill="none" stroke="#2c7be5" stroke-width="2"/>
  <path d="M550,380 L550,270" fill="none" stroke="#2c7be5" stroke-width="2"/>
  <text x="292" y="336" font-size="11" fill="#2c7be5">L</text>
  <text x="556" y="336" font-size="11" fill="#2c7be5">R</text>
  <text x="478" y="336" font-size="10" fill="#b7950b">M</text>
  <text x="430" y="352" font-size="11" fill="#b7950b" text-anchor="middle">M 与 R 短接</text>

  <!-- 电流表 → PID -->
  <path d="M760,196 L760,300" fill="none" stroke="#607d8b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="806" y="250" font-size="11" fill="#607d8b">4~20mA</text>

  <!-- 说明 -->
  <rect x="40" y="220" width="270" height="130" rx="10" fill="#fdf2e9" stroke="#e67e22"/>
  <text x="58" y="248" font-size="13" font-weight="bold" fill="#7e5109">接线要点</text>
  <text x="58" y="272" font-size="12" fill="#7e5109">① 断开 24V 电源后接线</text>
  <text x="58" y="294" font-size="12" fill="#7e5109">② 标准电阻按三线制接入 L、M、R</text>
  <text x="58" y="316" font-size="12" fill="#7e5109">③ 输出回路串入电流表（或二次仪表）</text>
  <text x="58" y="338" font-size="12" fill="#7e5109">④ 校好后再拆电阻、复接 PT100</text>
</svg>
