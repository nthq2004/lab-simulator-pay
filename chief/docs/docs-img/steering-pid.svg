<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="480" fill="#fbfbf8"/>
  <text x="470" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#263238">图 4  自动舵 PID 调节与三个辅助旋钮</text>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#455a64"/>
    </marker>
  </defs>

  <!-- 输入 -->
  <circle cx="60" cy="150" r="6" fill="#263238"/>
  <text x="34" y="130" font-size="11" fill="#263238">航向设定</text>
  <line x1="66" y1="150" x2="120" y2="150" stroke="#455a64" stroke-width="2" marker-end="url(#a3)"/>

  <!-- 求和 -->
  <circle cx="140" cy="150" r="20" fill="#eef0ed" stroke="#455a64" stroke-width="2"/>
  <text x="140" y="156" font-size="14" text-anchor="middle" fill="#263238">+</text>
  <text x="118" y="176" font-size="11" fill="#b71c1c">−</text>
  <text x="160" y="128" font-size="10" fill="#546e7a">偏差 e</text>

  <!-- 灵敏度死区 -->
  <rect x="180" y="128" width="120" height="44" rx="6" fill="#e8f1fb" stroke="#1565c0" stroke-width="1.8"/>
  <text x="240" y="146" font-size="11" font-weight="bold" text-anchor="middle" fill="#0d47a1">灵敏度</text>
  <text x="240" y="164" font-size="10" text-anchor="middle" fill="#1565c0">航向死区 δψ</text>
  <line x1="160" y1="150" x2="178" y2="150" stroke="#455a64" stroke-width="2" marker-end="url(#a3)"/>

  <!-- 天气调节 -->
  <rect x="320" y="128" width="120" height="44" rx="6" fill="#fdf1e3" stroke="#ef6c00" stroke-width="1.8"/>
  <text x="380" y="146" font-size="11" font-weight="bold" text-anchor="middle" fill="#e65100">天气调节</text>
  <text x="380" y="164" font-size="10" text-anchor="middle" fill="#ef6c00">按海况放大死区/削弱增益</text>
  <line x1="300" y1="150" x2="318" y2="150" stroke="#455a64" stroke-width="2" marker-end="url(#a3)"/>

  <!-- PID -->
  <rect x="460" y="96" width="280" height="110" rx="8" fill="#eaf6ec" stroke="#2e7d32" stroke-width="2"/>
  <text x="600" y="118" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b5e20">PID 运算</text>
  <text x="478" y="142" font-size="11" fill="#1b5e20">P（比例/舵效）：Kp · e</text>
  <text x="478" y="164" font-size="11" fill="#1b5e20">I（积分/自动压舵）：Ki · ∫e dt</text>
  <text x="478" y="186" font-size="11" fill="#1b5e20">D（微分/反舵）：− Kd · dψ/dt</text>
  <line x1="440" y1="150" x2="458" y2="150" stroke="#455a64" stroke-width="2" marker-end="url(#a3)"/>

  <!-- 压舵 -->
  <rect x="460" y="230" width="280" height="46" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.8"/>
  <text x="600" y="250" font-size="11" font-weight="bold" text-anchor="middle" fill="#4a148c">压舵（配平/恒定舵角）</text>
  <text x="600" y="268" font-size="10" text-anchor="middle" fill="#6a1b9a">抵消恒定风流造成的单侧偏航 ±5°</text>

  <!-- 限幅 -->
  <rect x="770" y="120" width="110" height="60" rx="6" fill="#eef0ed" stroke="#455a64" stroke-width="1.8"/>
  <text x="825" y="144" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">舵角限幅</text>
  <text x="825" y="164" font-size="10" text-anchor="middle" fill="#546e7a">±35°</text>
  <line x1="740" y1="150" x2="768" y2="150" stroke="#455a64" stroke-width="2" marker-end="url(#a3)"/>

  <!-- 舵机 -->
  <rect x="770" y="220" width="140" height="60" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.8"/>
  <text x="840" y="244" font-size="11" font-weight="bold" text-anchor="middle" fill="#6d4c41">舵机执行</text>
  <text x="840" y="264" font-size="10" text-anchor="middle" fill="#8d6e63">舵速 ≤ 0.87 °/s</text>
  <line x1="825" y1="180" x2="825" y2="218" stroke="#455a64" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="740" y1="252" x2="768" y2="250" stroke="#6a1b9a" stroke-width="2" marker-end="url(#a3)"/>

  <!-- 反馈 -->
  <path d="M770,270 L740,270 L740,300 L120,300 L120,170" fill="none" stroke="#455a64" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a3)"/>
  <text x="430" y="320" font-size="11" fill="#546e7a">舵角反馈（实际舵角）+ 首向反馈（罗经）</text>

  <!-- 说明 -->
  <rect x="40" y="340" width="540" height="110" rx="8" fill="#ffffff" stroke="#b0bec5" stroke-width="1.2"/>
  <text x="56" y="362" font-size="12" font-weight="bold" fill="#263238">整定要点（本仿真推荐值）</text>
  <text x="56" y="384" font-size="11" fill="#37474f">Kp≈1.2（过大→摆头振荡，过小→回舵无力）</text>
  <text x="56" y="404" font-size="11" fill="#37474f">Kd≈8（须大于 τ·Kp，抑制首摇）</text>
  <text x="56" y="424" font-size="11" fill="#37474f">Ki 宜小或为 0，避免慢周期摆动</text>
  <text x="56" y="444" font-size="11" fill="#37474f">灵敏度 1.5°、天气 3 档、压舵按风流方向小量修正</text>
</svg>
