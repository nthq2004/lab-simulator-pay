<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="940" height="430" fill="#ffffff"/>
  <text x="470" y="26" font-size="19" font-weight="bold" text-anchor="middle" fill="#1a252f">高压电力系统单线图（6600V / 400V 两级母线）</text>

  <!-- ── 发电机 DG1~DG4 ── -->
  <g fill="#006400" font-size="12" text-anchor="middle">
    <circle cx="140" cy="55" r="17" fill="#8a8f96" stroke="#2c3a45" stroke-width="2"/>
    <text x="140" y="59" font-size="11" fill="#fff" font-weight="bold">G</text>
    <text x="140" y="34" fill="#006400" font-weight="bold">DG1</text>

    <circle cx="330" cy="55" r="17" fill="#8a8f96" stroke="#2c3a45" stroke-width="2"/>
    <text x="330" y="59" font-size="11" fill="#fff" font-weight="bold">G</text>
    <text x="330" y="34" fill="#006400" font-weight="bold">DG2</text>

    <circle cx="610" cy="55" r="17" fill="#8a8f96" stroke="#2c3a45" stroke-width="2"/>
    <text x="610" y="59" font-size="11" fill="#fff" font-weight="bold">G</text>
    <text x="610" y="34" fill="#006400" font-weight="bold">DG3</text>

    <circle cx="800" cy="55" r="17" fill="#8a8f96" stroke="#2c3a45" stroke-width="2"/>
    <text x="800" y="59" font-size="11" fill="#fff" font-weight="bold">G</text>
    <text x="800" y="34" fill="#006400" font-weight="bold">DG4</text>
  </g>

  <!-- 发电机出口：DG → HACB → 隔离开关 0x → 母线 -->
  <g stroke="#2c3a45" stroke-width="2">
    <line x1="140" y1="72" x2="140" y2="120"/>
    <line x1="330" y1="72" x2="330" y2="120"/>
    <line x1="610" y1="72" x2="610" y2="120"/>
    <line x1="800" y1="72" x2="800" y2="120"/>
  </g>
  <!-- 断路器 × 与隔离刀闸符号 -->
  <g stroke="#006400" stroke-width="2.4">
    <line x1="135" y1="84" x2="145" y2="94"/><line x1="145" y1="84" x2="135" y2="94"/>
    <line x1="325" y1="84" x2="335" y2="94"/><line x1="335" y1="84" x2="325" y2="94"/>
    <line x1="605" y1="84" x2="615" y2="94"/><line x1="615" y1="84" x2="605" y2="94"/>
    <line x1="795" y1="84" x2="805" y2="94"/><line x1="805" y1="84" x2="795" y2="94"/>
  </g>
  <g stroke="#8b0000" stroke-width="3.2">
    <line x1="133" y1="104" x2="147" y2="104"/>
    <line x1="323" y1="104" x2="337" y2="104"/>
    <line x1="603" y1="104" x2="617" y2="104"/>
    <line x1="793" y1="104" x2="807" y2="104"/>
  </g>
  <g font-size="10" fill="#00008b" text-anchor="middle">
    <text x="118" y="92">HACB1</text><text x="118" y="108">01</text>
    <text x="308" y="92">HACB2</text><text x="308" y="108">02</text>
    <text x="588" y="92">HACB3</text><text x="588" y="108">03</text>
    <text x="778" y="92">HACB4</text><text x="778" y="108">04</text>
  </g>

  <!-- ── 高压母线 ── -->
  <line x1="70" y1="128" x2="430" y2="128" stroke="#2c3a45" stroke-width="6" stroke-linecap="round"/>
  <line x1="510" y1="128" x2="870" y2="128" stroke="#2c3a45" stroke-width="6" stroke-linecap="round"/>
  <text x="250" y="150" font-size="13" font-weight="bold" fill="#006400" text-anchor="middle">HBBA 6600V</text>
  <text x="690" y="150" font-size="13" font-weight="bold" fill="#006400" text-anchor="middle">HBBB 6600V</text>

  <!-- 母联：07 - HBUSTIE - 08 -->
  <line x1="430" y1="128" x2="470" y2="128" stroke="#7a8494" stroke-width="1.8"/>
  <line x1="550" y1="128" x2="510" y2="128" stroke="#7a8494" stroke-width="1.8"/>
  <g stroke="#8b0000" stroke-width="3.2">
    <line x1="468" y1="122" x2="468" y2="134"/>
    <line x1="552" y1="122" x2="552" y2="134"/>
  </g>
  <line x1="478" y1="128" x2="542" y2="128" stroke="#1a252f" stroke-width="2.4"/>
  <text x="470" y="116" font-size="10" fill="#00008b" text-anchor="middle">07</text>
  <text x="550" y="116" font-size="10" fill="#00008b" text-anchor="middle">08</text>
  <text x="510" y="148" font-size="10" fill="#00008b" text-anchor="middle">HBUSTIE</text>

  <!-- ── 变压器回路：母线 → VCB → TR → ACB → 低压母线 ── -->
  <g stroke="#2c3a45" stroke-width="2">
    <line x1="250" y1="128" x2="250" y2="205"/>
    <line x1="700" y1="128" x2="700" y2="205"/>
    <line x1="250" y1="260" x2="250" y2="300"/>
    <line x1="700" y1="260" x2="700" y2="300"/>
  </g>
  <g stroke="#006400" stroke-width="2.4">
    <line x1="245" y1="158" x2="255" y2="168"/><line x1="255" y1="158" x2="245" y2="168"/>
    <line x1="695" y1="158" x2="705" y2="168"/><line x1="705" y1="158" x2="695" y2="168"/>
  </g>
  <text x="263" y="168" font-size="10" fill="#00008b">VCB_TR1</text>
  <text x="713" y="168" font-size="10" fill="#00008b">VCB_TR2</text>
  <!-- 变压器双圆 -->
  <circle cx="250" cy="215" r="15" fill="rgba(200,205,210,0.6)" stroke="#2c3a45" stroke-width="1.5"/>
  <circle cx="250" cy="245" r="15" fill="rgba(200,205,210,0.6)" stroke="#2c3a45" stroke-width="1.5"/>
  <text x="290" y="235" font-size="12" font-weight="bold" fill="#006400">TR1</text>
  <circle cx="700" cy="215" r="15" fill="rgba(200,205,210,0.6)" stroke="#2c3a45" stroke-width="1.5"/>
  <circle cx="700" cy="245" r="15" fill="rgba(200,205,210,0.6)" stroke="#2c3a45" stroke-width="1.5"/>
  <text x="740" y="235" font-size="12" font-weight="bold" fill="#006400">TR2</text>
  <!-- 低压出口空气开关 -->
  <g stroke="#006400" stroke-width="2.4">
    <line x1="245" y1="278" x2="255" y2="288"/><line x1="255" y1="278" x2="245" y2="288"/>
    <line x1="695" y1="278" x2="705" y2="288"/><line x1="705" y1="278" x2="695" y2="288"/>
  </g>
  <text x="263" y="288" font-size="10" fill="#00008b">ACB_TR1</text>
  <text x="713" y="288" font-size="10" fill="#00008b">ACB_TR2</text>

  <!-- ── 低压母线 ── -->
  <line x1="70" y1="308" x2="430" y2="308" stroke="#2c3a45" stroke-width="6" stroke-linecap="round"/>
  <line x1="510" y1="308" x2="870" y2="308" stroke="#2c3a45" stroke-width="6" stroke-linecap="round"/>
  <text x="250" y="330" font-size="13" font-weight="bold" fill="#006400" text-anchor="middle">MBBA 400V</text>
  <text x="690" y="330" font-size="13" font-weight="bold" fill="#006400" text-anchor="middle">MBBB 400V</text>
  <!-- 低压母联 MBUSTIE -->
  <line x1="430" y1="308" x2="490" y2="308" stroke="#7a8494" stroke-width="1.8"/>
  <line x1="550" y1="308" x2="510" y2="308" stroke="#7a8494" stroke-width="1.8"/>
  <line x1="490" y1="308" x2="550" y2="308" stroke="#1a252f" stroke-width="2.4"/>
  <text x="520" y="300" font-size="10" fill="#00008b" text-anchor="middle">MBUSTIE</text>

  <!-- ── DG5 → ACB1 → MBBB ── -->
  <circle cx="820" cy="270" r="13" fill="#8a8f96" stroke="#2c3a45" stroke-width="2"/>
  <text x="820" y="274" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle">G</text>
  <text x="820" y="253" font-size="11" fill="#006400" font-weight="bold" text-anchor="middle">DG5 400V</text>
  <line x1="820" y1="283" x2="820" y2="308" stroke="#2c3a45" stroke-width="2"/>
  <g stroke="#006400" stroke-width="2.2">
    <line x1="815" y1="290" x2="825" y2="298"/><line x1="825" y1="290" x2="815" y2="298"/>
  </g>
  <text x="843" y="292" font-size="9" fill="#00008b">ACB1</text>

  <!-- ── 负载 ── -->
  <line x1="140" y1="308" x2="140" y2="360" stroke="#2c3a45" stroke-width="2"/>
  <rect x="120" y="360" width="40" height="18" fill="#cdd8e0" stroke="#2c3a45"/>
  <text x="140" y="393" font-size="10" fill="#333" text-anchor="middle">负载 01~06</text>
  <line x1="610" y1="308" x2="610" y2="360" stroke="#2c3a45" stroke-width="2"/>
  <rect x="590" y="360" width="40" height="18" fill="#cdd8e0" stroke="#2c3a45"/>
  <text x="610" y="393" font-size="10" fill="#333" text-anchor="middle">负载 07~12</text>

  <!-- 图例 -->
  <g font-size="11" fill="#333">
    <line x1="70" y1="412" x2="100" y2="412" stroke="#2c3a45" stroke-width="5"/>
    <text x="108" y="416">母线</text>
    <line x1="160" y1="412" x2="190" y2="412" stroke="#7a8494" stroke-width="1.8"/>
    <text x="198" y="416">连接导线</text>
    <g stroke="#006400" stroke-width="2.2"><line x1="280" y1="408" x2="290" y2="416"/><line x1="290" y1="408" x2="280" y2="416"/></g>
    <text x="298" y="416">真空断路器</text>
    <g stroke="#8b0000" stroke-width="3.2"><line x1="390" y1="412" x2="404" y2="412"/></g>
    <text x="412" y="416">隔离开关（短粗深红段）</text>
  </g>
</svg>
