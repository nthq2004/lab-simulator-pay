<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="360" viewBox="0 0 1060 360">
  <rect width="1060" height="360" fill="#ffffff"/>
  <text x="16" y="28" font-family="Microsoft YaHei,Arial" font-size="16" font-weight="bold" fill="#1b3a4b">图 2  蒸汽压力分档设定与动作区（单位 MPa）</text>

  <!-- 标尺 -->
  <line x1="90" y1="330" x2="90" y2="52" stroke="#37474f" stroke-width="2"/>
  <g font-family="Microsoft YaHei" font-size="11" fill="#37474f">
    <text x="70" y="334" text-anchor="end">0.40</text>
    <text x="70" y="274" text-anchor="end">0.50</text>
    <text x="70" y="214" text-anchor="end">0.60</text>
    <text x="70" y="154" text-anchor="end">0.70</text>
    <text x="70" y="94" text-anchor="end">0.80</text>
  </g>

  <!-- 工作区（0.56–0.70） -->
  <rect x="90" y="154" width="790" height="84" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="110" y="228" font-family="Microsoft YaHei" font-size="12" fill="#2e7d32">自动起停工作区：0.56 ~ 0.70（压力在此区间自动维持）</text>

  <!-- 各设定线 -->
  <g stroke-width="2">
    <line x1="90" y1="274" x2="880" y2="274" stroke="#0288d1"/>
    <line x1="90" y1="238" x2="880" y2="238" stroke="#0288d1" stroke-dasharray="6,4"/>
    <line x1="90" y1="202" x2="880" y2="202" stroke="#2e7d32"/>
    <line x1="90" y1="154" x2="880" y2="154" stroke="#ef6c00"/>
    <line x1="90" y1="106" x2="880" y2="106" stroke="#c62828"/>
    <line x1="90" y1="64" x2="880" y2="64" stroke="#6a1b9a"/>
  </g>

  <g font-family="Microsoft YaHei" font-size="11.5" font-weight="bold">
    <text x="890" y="278" fill="#0288d1" font-size="10.5">0.50 双位下限（转回大火）</text>
    <text x="890" y="242" fill="#0288d1" font-size="10.5">0.56 自动恢复（重新起动）</text>
    <text x="890" y="206" fill="#2e7d32" font-size="10.5">0.62 双位上限（转小火）</text>
    <text x="890" y="158" fill="#ef6c00" font-size="10.5">0.70 自动停炉</text>
    <text x="890" y="110" fill="#c62828" font-size="10.5">0.78 蒸汽超压保护（I2.6）</text>
    <text x="890" y="60" fill="#6a1b9a" font-size="10.5">0.85 安全阀起座</text>
    <text x="890" y="74" fill="#6a1b9a" font-size="10.5">0.765 回座（10% 回差）</text>
  </g>
  <g font-family="Microsoft YaHei" font-size="11" fill="#546e7a">
    <text x="120" y="292">◀ 压力下降</text>
    <text x="880" y="44" text-anchor="end">压力上升 ▲</text>
  </g>

  <!-- 回差标注 -->
  <line x1="760" y1="202" x2="760" y2="64" stroke="#b0bec5" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="752" y="148" font-family="Microsoft YaHei" font-size="10" fill="#78909c" text-anchor="end">I2.3 / I2.5 / I2.6 / 安全阀 各自回差</text>
</svg>
