<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <defs>
    <marker id="w" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#e67e22"/></marker>
    <marker id="bk" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#222"/></marker>
  </defs>
  <rect width="1000" height="580" fill="#fbfcfe"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#1a3a5c">图 4　PT100 三线制接线与万用表测量判断</text>

  <!-- 左：三线制接线 -->
  <text x="40" y="72" font-size="16" font-weight="bold" fill="#0e6655">① 三线制接线（消除引线电阻）</text>
  <g fill="#e8f6f3" stroke="#16a085" stroke-width="2"><rect x="60" y="100" width="150" height="150" rx="10"/></g>
  <text x="135" y="132" font-size="15" font-weight="bold" fill="#0b5345" text-anchor="middle">冷却水测点</text>
  <text x="135" y="156" font-size="13" fill="#16a085" text-anchor="middle">PT100（pt）</text>
  <g font-size="13" fill="#0b5345" text-anchor="middle">
    <text x="185" y="185">l</text><text x="185" y="220">r</text>
  </g>

  <g fill="#eaf2fb" stroke="#2471a3" stroke-width="2"><rect x="330" y="90" width="180" height="190" rx="10"/></g>
  <text x="420" y="122" font-size="15" font-weight="bold" fill="#154360" text-anchor="middle">温度变送器</text>
  <text x="420" y="146" font-size="13" fill="#2471a3" text-anchor="middle">ttrans</text>
  <g font-size="13" fill="#154360">
    <text x="340" y="185">l</text><text x="340" y="215">m</text><text x="340" y="245">r</text>
    <text x="500" y="185" text-anchor="end">p (+)</text><text x="500" y="245" text-anchor="end">n (−)</text>
  </g>

  <!-- 接线 -->
  <path d="M185,180 L330,180" stroke="#e67e22" stroke-width="3" fill="none" marker-end="url(#w)"/>
  <path d="M185,215 L300,215 L300,240 L330,240" stroke="#e67e22" stroke-width="3" fill="none" marker-end="url(#w)"/>
  <path d="M185,215 L300,210 L330,210" stroke="#e67e22" stroke-width="3" fill="none" marker-end="url(#w)"/>
  <text x="255" y="170" font-size="12" fill="#c0392b" text-anchor="middle">l → l</text>
  <text x="255" y="262" font-size="12" fill="#c0392b" text-anchor="middle">r → m、r（M、R 短接）</text>

  <!-- 右：万用表测量 -->
  <text x="540" y="72" font-size="16" font-weight="bold" fill="#7d6608">② 万用表电阻档测量 PT100（正接、反接均可）</text>
  <g fill="#e8f6f3" stroke="#16a085" stroke-width="2"><rect x="560" y="100" width="120" height="120" rx="10"/></g>
  <text x="620" y="150" font-size="14" fill="#0b5345" text-anchor="middle">PT100</text>
  <text x="620" y="172" font-size="12" fill="#16a085" text-anchor="middle">l / r 两端</text>

  <g fill="#f4ecf7" stroke="#8e44ad" stroke-width="2"><rect x="770" y="96" width="200" height="128" rx="10"/></g>
  <text x="870" y="126" font-size="15" fill="#6c3483" text-anchor="middle">数字万用表</text>
  <text x="870" y="152" font-size="12" fill="#8e44ad" text-anchor="middle">200Ω / 2kΩ / 200kΩ</text>
  <text x="870" y="176" font-size="12" fill="#8e44ad" text-anchor="middle">红表笔 v ・ 黑表笔 com</text>
  <text x="870" y="200" font-size="12" fill="#c0392b" text-anchor="middle">↔ 可正接 或 反接</text>
  <path d="M680,150 L768,140" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#w)"/>
  <path d="M680,168 L768,182" stroke="#222" stroke-width="3" fill="none" marker-end="url(#bk)"/>

  <!-- 判断表 -->
  <g font-size="14">
    <rect x="40" y="330" width="920" height="200" rx="10" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.5"/>
    <text x="70" y="366" font-size="15" font-weight="bold" fill="#1a3a5c">测量结果判读</text>
    <rect x="70" y="380" width="860" height="30" fill="#eaf2f8"/>
    <text x="90" y="401" font-size="14" font-weight="bold" fill="#154360">被测状态</text>
    <text x="360" y="401" font-size="14" font-weight="bold" fill="#154360">万用表显示</text>
    <text x="640" y="401" font-size="14" font-weight="bold" fill="#154360">结论 / 报警</text>

    <line x1="70" y1="410" x2="930" y2="410" stroke="#ecf0f1"/>
    <text x="90" y="432" fill="#1e8449">正常 PT100（随温度升高而增大）</text>
    <text x="360" y="432" fill="#1e8449">约 100 ~ 138.5Ω（0~100℃）</text>
    <text x="640" y="432" fill="#1e8449">回路正常，4~20mA</text>

    <line x1="70" y1="442" x2="930" y2="442" stroke="#ecf0f1"/>
    <text x="90" y="464" fill="#e67e22">PT100 短路（元件失效）</text>
    <text x="360" y="464" fill="#e67e22">≈ 0Ω</text>
    <text x="640" y="464" fill="#e67e22">变送器输出 3.6mA →「PT100 传感器短路」</text>

    <line x1="70" y1="474" x2="930" y2="474" stroke="#ecf0f1"/>
    <text x="90" y="496" fill="#8e44ad">PT100 断路（元件/引线断）</text>
    <text x="360" y="496" fill="#8e44ad">O.L（溢出，阻值 ∞）</text>
    <text x="640" y="496" fill="#8e44ad">变送器上冲 21.6mA →「PT100 传感器断路」</text>

    <line x1="70" y1="506" x2="930" y2="506" stroke="#ecf0f1"/>
    <text x="90" y="526" fill="#c0392b">表笔悬空（未接入）</text>
    <text x="360" y="526" fill="#c0392b">O.L</text>
    <text x="640" y="526" fill="#c0392b">电路未闭合，属正常显示</text>
  </g>
</svg>
