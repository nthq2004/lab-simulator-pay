<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 500" font-family="SimHei, Microsoft YaHei, sans-serif">
  <rect width="470" height="500" fill="#ffffff"/>
  <text x="235" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">电机连续控制 — 控制回路（含自锁）</text>

  <!-- 电源进线标识 -->
  <text x="24" y="76" font-size="12" fill="#555">S1（FU5）</text>
  <text x="24" y="486" font-size="12" fill="#555">S2</text>

  <!-- 上下母线 -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="90" y1="80" x2="340" y2="80"/>
    <line x1="90" y1="470" x2="340" y2="470"/>
    <!-- 左竖线：母线 → SB1 → 节点A -->
    <line x1="90" y1="80" x2="90" y2="120"/>
    <line x1="90" y1="165" x2="90" y2="210"/>
    <!-- 节点A 横线 -->
    <line x1="90" y1="210" x2="340" y2="210"/>
    <!-- 并联支路1（SB2） -->
    <line x1="155" y1="210" x2="155" y2="248"/>
    <line x1="155" y1="292" x2="155" y2="330"/>
    <!-- 并联支路2（KM1 常开 自锁） -->
    <line x1="290" y1="210" x2="290" y2="248"/>
    <line x1="290" y1="292" x2="290" y2="330"/>
    <!-- 汇合横线 -->
    <line x1="155" y1="330" x2="290" y2="330"/>
    <!-- 汇合后：线圈、热继电器常闭 -->
    <line x1="215" y1="330" x2="215" y2="345"/>
    <line x1="215" y1="395" x2="215" y2="410"/>
    <line x1="215" y1="455" x2="215" y2="470"/>
  </g>
  <!-- 节点圆点 -->
  <g fill="#333">
    <circle cx="90" cy="210" r="3.2"/>
    <circle cx="155" cy="210" r="3.2"/><circle cx="290" cy="210" r="3.2"/>
    <circle cx="155" cy="330" r="3.2"/><circle cx="290" cy="330" r="3.2"/>
    <circle cx="215" cy="330" r="3.2"/>
  </g>

  <!-- SB1 停止按钮（常闭） -->
  <rect x="64" y="120" width="52" height="45" rx="5" fill="#fdf2f0" stroke="#c0392b" stroke-width="2"/>
  <text x="90" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">SB1</text>
  <text x="90" y="156" text-anchor="middle" font-size="10" fill="#c0392b">停止 常闭</text>
  <text x="128" y="147" font-size="11" fill="#888">按压断开</text>

  <!-- SB2 起动按钮（常开） -->
  <rect x="127" y="248" width="56" height="44" rx="5" fill="#eef4fb" stroke="#2471a3" stroke-width="2"/>
  <text x="155" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2471a3">SB2</text>
  <text x="155" y="282" text-anchor="middle" font-size="10" fill="#2471a3">起动 常开</text>

  <!-- KM1 常开辅助触头（自锁） -->
  <rect x="258" y="248" width="64" height="44" rx="5" fill="#eef4fb" stroke="#2471a3" stroke-width="2"/>
  <text x="290" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2471a3">KM1</text>
  <text x="290" y="282" text-anchor="middle" font-size="10" fill="#2471a3">常开（自锁）</text>

  <!-- KM1 线圈 -->
  <rect x="183" y="345" width="64" height="50" rx="5" fill="#fdf2f0" stroke="#c0392b" stroke-width="2"/>
  <text x="215" y="367" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">KM1</text>
  <text x="215" y="383" text-anchor="middle" font-size="10" fill="#c0392b">接触器线圈</text>

  <!-- FR1 常闭触头 -->
  <rect x="183" y="410" width="64" height="45" rx="5" fill="#eefaf1" stroke="#1e8449" stroke-width="2"/>
  <text x="215" y="429" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e8449">FR1</text>
  <text x="215" y="445" text-anchor="middle" font-size="10" fill="#1e8449">常闭触头</text>

  <!-- 说明 -->
  <text x="235" y="492" text-anchor="middle" font-size="11" fill="#888">起动：SB2 闭合 → KM1 得电自锁；停止：SB1 断开 → 线圈失电</text>
</svg>
