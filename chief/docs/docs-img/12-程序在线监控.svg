<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="940" height="600" fill="#f7fafc"/>
  <text x="470" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a365d">PLC 程序在线监控的使用</text>
  <text x="470" y="50" text-anchor="middle" font-size="11" fill="#718096">上传程序 → 转 RUN → 点击"监控"，梯形图按实时通/断着色，配合状态表读取 I/Q/M</text>

  <!-- 窗口 -->
  <rect x="40" y="66" width="860" height="514" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-width="1.5"/>
  <rect x="40" y="66" width="860" height="34" rx="8" fill="#2d3748"/>
  <rect x="40" y="92" width="860" height="8" fill="#2d3748"/>
  <text x="58" y="88" font-size="12" fill="#e2e8f0">STEP7-Micro/WIN SMART —— 在线监控</text>

  <!-- 工具栏按钮 -->
  <g font-size="11" text-anchor="middle">
    <rect x="58" y="112" width="70" height="26" rx="4" fill="#3182ce"/><text x="93" y="130" fill="#fff">连接</text>
    <rect x="138" y="112" width="70" height="26" rx="4" fill="#38a169"/><text x="173" y="130" fill="#fff">上传</text>
    <rect x="218" y="112" width="70" height="26" rx="4" fill="#dd6b20"/><text x="253" y="130" fill="#fff">下载</text>
    <rect x="298" y="112" width="70" height="26" rx="4" fill="#805ad5"/><text x="333" y="130" fill="#fff">监控</text>
    <rect x="378" y="112" width="80" height="26" rx="4" fill="#718096"/><text x="418" y="130" fill="#fff">状态表</text>
  </g>
  <text x="480" y="130" font-size="10.5" fill="#e53e3e">● 已连接 192.168.0.1    PLC: RUN</text>

  <!-- 梯形图 -->
  <text x="60" y="166" font-size="11.5" font-weight="bold" fill="#2d3748">程序段（梯形图在线监控，绿色=通）</text>
  <line x1="60" y1="176" x2="560" y2="176" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 网络1 -->
  <text x="60" y="202" font-size="10" fill="#718096">网络1 起保停</text>
  <line x1="120" y1="196" x2="150" y2="196" stroke="#2f855a" stroke-width="2.4"/>
  <line x1="150" y1="188" x2="150" y2="204" stroke="#2f855a" stroke-width="2"/>
  <line x1="156" y1="188" x2="156" y2="204" stroke="#2f855a" stroke-width="2"/>
  <line x1="156" y1="196" x2="186" y2="196" stroke="#2f855a" stroke-width="2.4"/>
  <text x="146" y="220" font-size="9.5" fill="#2f855a">I0.0 起动</text>
  <!-- 并联 I0.1 / I0.2 示意 -->
  <line x1="186" y1="196" x2="186" y2="216" stroke="#2f855a" stroke-width="2"/>
  <line x1="186" y1="216" x2="300" y2="216" stroke="#2f855a" stroke-width="2"/>
  <line x1="186" y1="196" x2="300" y2="196" stroke="#2f855a" stroke-width="2"/>
  <line x1="216" y1="208" x2="216" y2="224" stroke="#2f855a" stroke-width="2"/>
  <line x1="222" y1="208" x2="222" y2="224" stroke="#2f855a" stroke-width="2"/>
  <line x1="216" y1="216" x2="222" y2="216" stroke="#2f855a" stroke-width="2"/>
  <text x="204" y="238" font-size="9.5" fill="#2f855a">I0.1 常闭</text>
  <line x1="252" y1="208" x2="252" y2="224" stroke="#2f855a" stroke-width="2"/>
  <line x1="258" y1="208" x2="258" y2="224" stroke="#2f855a" stroke-width="2"/>
  <line x1="252" y1="216" x2="258" y2="216" stroke="#2f855a" stroke-width="2"/>
  <text x="256" y="240" font-size="9.5" fill="#2f855a">I0.2 常闭</text>
  <line x1="300" y1="196" x2="440" y2="196" stroke="#2f855a" stroke-width="2.4"/>
  <text x="300" y="186" font-size="9.5" fill="#2f855a">M0.0 自锁</text>
  <!-- 线圈 -->
  <path d="M440 186 A12 12 0 0 1 440 206" fill="none" stroke="#c53030" stroke-width="2.4"/>
  <path d="M464 186 A12 12 0 0 0 464 206" fill="none" stroke="#c53030" stroke-width="2.4"/>
  <line x1="452" y1="196" x2="470" y2="196" stroke="#c53030" stroke-width="2.4"/>
  <line x1="470" y1="196" x2="520" y2="196" stroke="#c53030" stroke-width="2.4"/>
  <text x="470" y="220" font-size="9.5" fill="#c53030">( M0.0 )</text>

  <!-- 网络2 -->
  <text x="60" y="266" font-size="10" fill="#718096">网络2 定时</text>
  <line x1="120" y1="260" x2="150" y2="260" stroke="#2f855a" stroke-width="2.4"/>
  <line x1="150" y1="252" x2="150" y2="268" stroke="#2f855a" stroke-width="2"/>
  <line x1="156" y1="252" x2="156" y2="268" stroke="#2f855a" stroke-width="2"/>
  <line x1="156" y1="260" x2="230" y2="260" stroke="#2f855a" stroke-width="2.4"/>
  <rect x="230" y="246" width="86" height="28" rx="4" fill="#edf2f7" stroke="#2f855a" stroke-width="1.6"/>
  <text x="273" y="264" text-anchor="middle" font-size="10.5" fill="#22543d">TON T37 5000</text>
  <text x="150" y="284" font-size="9.5" fill="#2f855a">M0.0</text>

  <!-- 网络3 -->
  <text x="60" y="322" font-size="10" fill="#718096">网络3 星形输出</text>
  <line x1="120" y1="316" x2="150" y2="316" stroke="#2f855a" stroke-width="2.4"/>
  <line x1="150" y1="308" x2="150" y2="324" stroke="#2f855a" stroke-width="2"/>
  <line x1="156" y1="308" x2="156" y2="324" stroke="#2f855a" stroke-width="2"/>
  <line x1="156" y1="316" x2="260" y2="316" stroke="#2f855a" stroke-width="2.4"/>
  <line x1="260" y1="308" x2="260" y2="324" stroke="#2f855a" stroke-width="2"/>
  <line x1="266" y1="308" x2="266" y2="324" stroke="#2f855a" stroke-width="2"/>
  <line x1="260" y1="320" x2="266" y2="312" stroke="#2f855a" stroke-width="1.6"/>
  <text x="255" y="340" font-size="9.5" fill="#2f855a">AN T37</text>
  <line x1="266" y1="316" x2="440" y2="316" stroke="#2f855a" stroke-width="2.4"/>
  <path d="M440 306 A12 12 0 0 1 440 326" fill="none" stroke="#c53030" stroke-width="2.4"/>
  <path d="M464 306 A12 12 0 0 0 464 326" fill="none" stroke="#c53030" stroke-width="2.4"/>
  <line x1="452" y1="316" x2="470" y2="316" stroke="#c53030" stroke-width="2.4"/>
  <line x1="470" y1="316" x2="520" y2="316" stroke="#c53030" stroke-width="2.4"/>
  <text x="468" y="340" font-size="9.5" fill="#c53030">( Q0.1 星 KM2 )</text>

  <!-- 网络4 -->
  <text x="60" y="382" font-size="10" fill="#718096">网络4 角形输出</text>
  <line x1="120" y1="376" x2="150" y2="376" stroke="#2f855a" stroke-width="2.4"/>
  <line x1="150" y1="368" x2="150" y2="384" stroke="#2f855a" stroke-width="2"/>
  <line x1="156" y1="368" x2="156" y2="384" stroke="#2f855a" stroke-width="2"/>
  <line x1="156" y1="376" x2="260" y2="376" stroke="#2f855a" stroke-width="2.4"/>
  <line x1="260" y1="368" x2="260" y2="384" stroke="#2f855a" stroke-width="2"/>
  <line x1="266" y1="368" x2="266" y2="384" stroke="#2f855a" stroke-width="2"/>
  <text x="255" y="400" font-size="9.5" fill="#2f855a">A T37</text>
  <line x1="266" y1="376" x2="440" y2="376" stroke="#2f855a" stroke-width="2.4"/>
  <path d="M440 366 A12 12 0 0 1 440 386" fill="none" stroke="#718096" stroke-width="2.4"/>
  <path d="M464 366 A12 12 0 0 0 464 386" fill="none" stroke="#718096" stroke-width="2.4"/>
  <line x1="452" y1="376" x2="470" y2="376" stroke="#718096" stroke-width="2.4"/>
  <line x1="470" y1="376" x2="520" y2="376" stroke="#718096" stroke-width="2.4"/>
  <text x="468" y="400" font-size="9.5" fill="#718096">( Q0.2 角 KM3 )</text>

  <!-- 状态表 -->
  <rect x="590" y="176" width="290" height="330" rx="6" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.2"/>
  <rect x="590" y="176" width="290" height="28" rx="6" fill="#2d3748"/>
  <text x="735" y="195" text-anchor="middle" font-size="11.5" fill="#e2e8f0">状态表（监控值）</text>
  <g font-size="11" fill="#2d3748">
    <text x="606" y="228">地址</text><text x="760" y="228">当前值</text>
    <line x1="600" y1="236" x2="870" y2="236" stroke="#cbd5e0"/>
    <text x="606" y="256">I0.0 起动</text><text x="772" y="256" fill="#2f855a">1</text>
    <text x="606" y="278">I0.1 停止(常闭)</text><text x="772" y="278" fill="#2f855a">1</text>
    <text x="606" y="300">I0.2 FR(常闭)</text><text x="772" y="300" fill="#2f855a">1</text>
    <text x="606" y="322">Q0.0 KM1 主</text><text x="772" y="322" fill="#2f855a">1</text>
    <text x="606" y="344">Q0.1 KM2 星</text><text x="772" y="344" fill="#2f855a">1</text>
    <text x="606" y="366">Q0.2 KM3 角</text><text x="772" y="366" fill="#c53030">0</text>
    <text x="606" y="388">M0.0 运行位</text><text x="772" y="388" fill="#2f855a">1</text>
    <text x="606" y="410">T37 当前值</text><text x="772" y="410" fill="#2d3748">3200</text>
    <text x="606" y="432">AIW0 转速</text><text x="772" y="432" fill="#2d3748">14848</text>
    <text x="606" y="454">AQW0 输出</text><text x="772" y="454" fill="#2d3748">14848</text>
  </g>
  <line x1="600" y1="464" x2="870" y2="464" stroke="#cbd5e0"/>
  <text x="606" y="486" font-size="10" fill="#718096">绿色触点/线圈=当前通电；灰色=断电</text>

  <!-- 底部说明 -->
  <rect x="60" y="524" width="820" height="46" rx="8" fill="#ebf8ff" stroke="#63b3ed" stroke-width="1.5"/>
  <text x="78" y="546" font-size="11" fill="#2c5282">用法：① 上传程序核对逻辑；② 转 RUN 后点"监控"，观察各触点/线圈颜色与状态表数值；</text>
  <text x="88" y="564" font-size="11" fill="#2c5282">③ 由"输入是否为 1 / 输出是否置 1"判断故障在输入回路、程序还是输出回路；④ 必要时用强制功能模拟输入验证。</text>
</svg>
