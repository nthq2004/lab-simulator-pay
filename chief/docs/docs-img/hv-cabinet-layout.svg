<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="940" height="560" fill="#ffffff"/>
  <text x="470" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a252f">高压配电板（配电柜）总体结构与柜内三段布置</text>

  <!-- 8 个柜体 -->
  <g>
    <!-- 柜体几何：x0=30,y0=70,w=104,h=300 -->
    <!-- 1 母线接地柜 -->
    <rect x="30" y="70" width="104" height="300" fill="#e8ecef" stroke="#4a5a66" stroke-width="1.5"/>
    <rect x="34" y="74" width="96" height="120" fill="#dfe7ee" stroke="#8a9aa5"/>
    <rect x="34" y="198" width="96" height="60" fill="#dfe3e7" stroke="#8a9aa5"/>
    <rect x="34" y="262" width="96" height="104" fill="#eef2f5" stroke="#8a9aa5"/>
    <text x="82" y="100" font-size="10" text-anchor="middle" fill="#333">V/A 表</text>
    <text x="82" y="130" font-size="10" text-anchor="middle" fill="#333">带电显示 A/B/C</text>
    <text x="82" y="150" font-size="10" text-anchor="middle" fill="#333">测试 接地合/开</text>
    <text x="82" y="232" font-size="10" text-anchor="middle" fill="#666">无真空断路器</text>
    <text x="82" y="320" font-size="10" text-anchor="middle" fill="#333">接地刀闸</text>
    <text x="82" y="88" font-size="11" font-weight="bold" text-anchor="middle" fill="#006400">母线接地柜</text>

    <!-- 2 变压器馈电柜 -->
    <rect x="140" y="70" width="104" height="300" fill="#e8ecef" stroke="#4a5a66" stroke-width="1.5"/>
    <rect x="144" y="74" width="96" height="120" fill="#dfe7ee" stroke="#8a9aa5"/>
    <rect x="144" y="198" width="96" height="60" fill="#dfe3e7" stroke="#8a9aa5"/>
    <rect x="144" y="262" width="96" height="104" fill="#eef2f5" stroke="#8a9aa5"/>
    <text x="192" y="100" font-size="10" text-anchor="middle" fill="#333">V/A 表</text>
    <text x="192" y="130" font-size="10" text-anchor="middle" fill="#333">合/分 指示灯</text>
    <text x="192" y="150" font-size="10" text-anchor="middle" fill="#333">合闸/分闸按钮</text>
    <text x="192" y="232" font-size="10" text-anchor="middle" fill="#666">断路器手车</text>
    <text x="192" y="320" font-size="10" text-anchor="middle" fill="#333">VCB + TR</text>
    <text x="192" y="88" font-size="11" font-weight="bold" text-anchor="middle" fill="#006400">变压器馈电柜</text>

    <!-- 3 推进馈电柜 -->
    <rect x="250" y="70" width="104" height="300" fill="#e8ecef" stroke="#4a5a66" stroke-width="1.5"/>
    <rect x="254" y="74" width="96" height="120" fill="#dfe7ee" stroke="#8a9aa5"/>
    <rect x="254" y="198" width="96" height="60" fill="#dfe3e7" stroke="#8a9aa5"/>
    <rect x="254" y="262" width="96" height="104" fill="#eef2f5" stroke="#8a9aa5"/>
    <text x="302" y="100" font-size="10" text-anchor="middle" fill="#333">V/A 表</text>
    <text x="302" y="130" font-size="10" text-anchor="middle" fill="#333">合/分 指示灯</text>
    <text x="302" y="150" font-size="10" text-anchor="middle" fill="#333">合闸/分闸按钮</text>
    <text x="302" y="232" font-size="10" text-anchor="middle" fill="#666">断路器手车</text>
    <text x="302" y="320" font-size="10" text-anchor="middle" fill="#333">VCB + M</text>
    <text x="302" y="88" font-size="11" font-weight="bold" text-anchor="middle" fill="#006400">推进馈电柜</text>

    <!-- 4 1#发电机控制柜 -->
    <rect x="360" y="70" width="104" height="300" fill="#fdf4e8" stroke="#c0392b" stroke-width="2"/>
    <rect x="364" y="74" width="96" height="120" fill="#f6e6d0" stroke="#8a9aa5"/>
    <rect x="364" y="198" width="96" height="60" fill="#efe0cf" stroke="#8a9aa5"/>
    <rect x="364" y="262" width="96" height="104" fill="#f5efe6" stroke="#8a9aa5"/>
    <text x="412" y="100" font-size="10" text-anchor="middle" fill="#333">V/A/Hz 表</text>
    <text x="412" y="128" font-size="10" text-anchor="middle" fill="#333">运行/合闸/分闸</text>
    <text x="412" y="150" font-size="10" text-anchor="middle" fill="#333">起动 停止 合 分</text>
    <text x="412" y="232" font-size="10" text-anchor="middle" fill="#666">断路器手车</text>
    <text x="412" y="320" font-size="10" text-anchor="middle" fill="#333">VCB + G</text>
    <text x="412" y="88" font-size="11" font-weight="bold" text-anchor="middle" fill="#8b0000">1#发电机控制柜</text>

    <!-- 5 2#发电机控制柜 -->
    <rect x="470" y="70" width="104" height="300" fill="#fdf4e8" stroke="#c0392b" stroke-width="2"/>
    <rect x="474" y="74" width="96" height="120" fill="#f6e6d0" stroke="#8a9aa5"/>
    <rect x="474" y="198" width="96" height="60" fill="#efe0cf" stroke="#8a9aa5"/>
    <rect x="474" y="262" width="96" height="104" fill="#f5efe6" stroke="#8a9aa5"/>
    <text x="522" y="100" font-size="10" text-anchor="middle" fill="#333">V/A/Hz 表</text>
    <text x="522" y="128" font-size="10" text-anchor="middle" fill="#333">运行/合闸/分闸</text>
    <text x="522" y="150" font-size="10" text-anchor="middle" fill="#333">起动 停止 合 分</text>
    <text x="522" y="232" font-size="10" text-anchor="middle" fill="#666">断路器手车</text>
    <text x="522" y="320" font-size="10" text-anchor="middle" fill="#333">VCB + G</text>
    <text x="522" y="88" font-size="11" font-weight="bold" text-anchor="middle" fill="#8b0000">2#发电机控制柜</text>

    <!-- 6 并车柜 -->
    <rect x="580" y="70" width="104" height="300" fill="#e8ecef" stroke="#4a5a66" stroke-width="1.5"/>
    <rect x="584" y="74" width="96" height="120" fill="#dfe7ee" stroke="#8a9aa5"/>
    <rect x="584" y="198" width="96" height="60" fill="#dfe3e7" stroke="#8a9aa5"/>
    <rect x="584" y="262" width="96" height="104" fill="#eef2f5" stroke="#8a9aa5"/>
    <text x="632" y="100" font-size="10" text-anchor="middle" fill="#333">同步表选择</text>
    <text x="632" y="128" font-size="10" text-anchor="middle" fill="#333">模式/备用顺序</text>
    <text x="632" y="150" font-size="10" text-anchor="middle" fill="#333">半自动/手动/自动</text>
    <text x="632" y="232" font-size="10" text-anchor="middle" fill="#666">无真空断路器</text>
    <text x="632" y="320" font-size="10" text-anchor="middle" fill="#333">同步表表盘</text>
    <text x="632" y="88" font-size="11" font-weight="bold" text-anchor="middle" fill="#006400">并车柜</text>

    <!-- 7 母联开关柜 -->
    <rect x="690" y="70" width="104" height="300" fill="#e8ecef" stroke="#4a5a66" stroke-width="1.5"/>
    <rect x="694" y="74" width="96" height="120" fill="#dfe7ee" stroke="#8a9aa5"/>
    <rect x="694" y="198" width="96" height="60" fill="#dfe3e7" stroke="#8a9aa5"/>
    <rect x="694" y="262" width="96" height="104" fill="#eef2f5" stroke="#8a9aa5"/>
    <text x="742" y="100" font-size="10" text-anchor="middle" fill="#333">合/分 指示灯</text>
    <text x="742" y="128" font-size="10" text-anchor="middle" fill="#333">合闸/分闸按钮</text>
    <text x="742" y="150" font-size="10" text-anchor="middle" fill="#333">母联断路器</text>
    <text x="742" y="232" font-size="10" text-anchor="middle" fill="#666">手车（母联）</text>
    <text x="742" y="320" font-size="10" text-anchor="middle" fill="#333">左母线–断路器–右母线</text>
    <text x="742" y="88" font-size="11" font-weight="bold" text-anchor="middle" fill="#006400">母联开关柜</text>

    <!-- 8 省略号柜 -->
    <rect x="800" y="70" width="104" height="300" fill="#eef1f3" stroke="#8a9aa5" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="852" y="215" font-size="13" text-anchor="middle" fill="#888">省略号柜</text>
    <text x="852" y="235" font-size="10" text-anchor="middle" fill="#999">（3#发电机控制柜起对称）</text>
    <text x="852" y="88" font-size="11" text-anchor="middle" fill="#888">…</text>
  </g>

  <!-- 三段式说明 -->
  <g>
    <rect x="30" y="400" width="874" height="135" rx="6" fill="#f7f9fb" stroke="#b0bcc4"/>
    <text x="50" y="424" font-size="14" font-weight="bold" fill="#1a252f">每个柜体分上、中、下三段</text>
    <rect x="50" y="436" width="150" height="34" fill="#dfe7ee" stroke="#5a6a75"/>
    <text x="125" y="458" font-size="12" text-anchor="middle" fill="#1a252f">上部：仪表 / 指示灯 / 按钮</text>
    <rect x="50" y="476" width="150" height="30" fill="#dfe3e7" stroke="#5a6a75"/>
    <text x="125" y="496" font-size="12" text-anchor="middle" fill="#1a252f">中部：断路器手车（摇柄孔）</text>
    <rect x="50" y="512" width="150" height="20" fill="#eef2f5" stroke="#5a6a75"/>
    <text x="125" y="527" font-size="11" text-anchor="middle" fill="#1a252f">下部：该柜单线示意</text>

    <text x="240" y="452" font-size="12" fill="#333">· 上方横粗线 = 母线；× 号 = 真空断路器静触头；短粗深红段 = 隔离开关静触头</text>
    <text x="240" y="474" font-size="12" fill="#333">· 中部手车可在 连接位（工作位）↔ 试验位 ↔ 检修位 之间摇动</text>
    <text x="240" y="496" font-size="12" fill="#333">· 下部引线接地开关（水平刀闸）+ 接地符号，各柜独立、可点击合/断</text>
    <text x="240" y="518" font-size="12" fill="#333">· 右上角“接口孔”为就地/遥控操作孔；发电机柜、并车柜另设专用操作按钮</text>
  </g>
</svg>
