<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="940" height="520" fill="#f7fafc"/>
  <text x="470" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a365d">三种典型故障的现象与定位</text>
  <text x="470" y="52" text-anchor="middle" font-size="11" fill="#718096">同一台设备、不同故障点，现象各异——用"输入/输出状态 + 程序监控"逐一定位</text>

  <!-- 面板1 -->
  <rect x="30" y="72" width="280" height="418" rx="10" fill="#fff" stroke="#fc8181" stroke-width="1.6"/>
  <rect x="30" y="72" width="280" height="40" rx="10" fill="#c53030"/>
  <rect x="30" y="102" width="280" height="10" fill="#c53030"/>
  <text x="170" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">故障① FR 常闭触点接触不良</text>

  <!-- 输入示意 -->
  <line x1="60" y1="150" x2="90" y2="150" stroke="#2d3748" stroke-width="2"/>
  <text x="60" y="140" font-size="9.5" fill="#c53030">+24V</text>
  <rect x="90" y="132" width="90" height="36" rx="4" fill="#fff5f5" stroke="#c53030" stroke-width="1.4"/>
  <text x="135" y="154" text-anchor="middle" font-size="10" fill="#9b2c2c">FR 常闭</text>
  <circle cx="190" cy="150" r="6" fill="#e53e3e" stroke="#742a2a" stroke-width="1.2"/>
  <text x="196" y="140" font-size="9" fill="#c53030">接触不良</text>
  <line x1="196" y1="150" x2="250" y2="150" stroke="#2d3748" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="252" y="154" font-size="10" fill="#2d3748">I0.2</text>
  <text x="220" y="182" text-anchor="middle" font-size="10" fill="#c53030">反馈回路断开 → I0.2 = 0</text>

  <line x1="50" y1="204" x2="290" y2="204" stroke="#e2e8f0"/>
  <text x="50" y="228" font-size="11" font-weight="bold" fill="#2d3748">现象</text>
  <text x="50" y="250" font-size="10.5" fill="#4a5568">按下起动按钮电机毫无反应，</text>
  <text x="50" y="270" font-size="10.5" fill="#4a5568">KM1、KM2 均不吸合。</text>
  <text x="50" y="300" font-size="11" font-weight="bold" fill="#2d3748">判断</text>
  <text x="50" y="322" font-size="10.5" fill="#4a5568">① PLC 输入指示灯 I0.2 不亮；</text>
  <text x="50" y="342" font-size="10.5" fill="#4a5568">② 测 FR 触点两端无电压降；</text>
  <text x="50" y="362" font-size="10.5" fill="#4a5568">③ 短接 FR 触点后正常起动。</text>
  <text x="50" y="396" font-size="11" font-weight="bold" fill="#2d3748">处理</text>
  <text x="50" y="418" font-size="10.5" fill="#2f855a">紧固/更换 FR 触点或接线。</text>

  <!-- 面板2 -->
  <rect x="330" y="72" width="280" height="418" rx="10" fill="#fff" stroke="#f6ad55" stroke-width="1.6"/>
  <rect x="330" y="72" width="280" height="40" rx="10" fill="#dd6b20"/>
  <rect x="330" y="102" width="280" height="10" fill="#dd6b20"/>
  <text x="470" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">故障② KM3 线圈断线</text>

  <line x1="360" y1="150" x2="390" y2="150" stroke="#2d3748" stroke-width="2"/>
  <text x="356" y="140" font-size="9.5" fill="#dd6b20">Q0.2</text>
  <rect x="390" y="132" width="120" height="36" rx="4" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.4"/>
  <text x="450" y="148" text-anchor="middle" font-size="10" fill="#9c4221">KM3 线圈</text>
  <text x="450" y="162" text-anchor="middle" font-size="9" fill="#c53030">× 断线</text>
  <line x1="510" y1="150" x2="560" y2="150" stroke="#2d3748" stroke-width="2"/>
  <text x="562" y="154" font-size="10" fill="#2d3748">0V</text>
  <text x="470" y="182" text-anchor="middle" font-size="10" fill="#dd6b20">Q0.2=1 但 KM3 不吸合</text>

  <line x1="350" y1="204" x2="590" y2="204" stroke="#e2e8f0"/>
  <text x="350" y="228" font-size="11" font-weight="bold" fill="#2d3748">现象</text>
  <text x="350" y="250" font-size="10.5" fill="#4a5568">星形起动正常；5s 后 KM2 释放、</text>
  <text x="350" y="270" font-size="10.5" fill="#4a5568">KM3 不吸合，电机失去角形回路。</text>
  <text x="350" y="300" font-size="11" font-weight="bold" fill="#2d3748">判断</text>
  <text x="350" y="322" font-size="10.5" fill="#4a5568">① 程序监控：Q0.2 已为 1；</text>
  <text x="350" y="342" font-size="10.5" fill="#4a5568">② 测线圈 A1-A2 无电压/电阻无穷大；</text>
  <text x="350" y="362" font-size="10.5" fill="#4a5568">③ 手按接触器可吸合 → 线圈断。</text>
  <text x="350" y="396" font-size="11" font-weight="bold" fill="#2d3748">处理</text>
  <text x="350" y="418" font-size="10.5" fill="#2f855a">更换 KM3 线圈或接触器。</text>

  <!-- 面板3 -->
  <rect x="630" y="72" width="280" height="418" rx="10" fill="#fff" stroke="#9f7aea" stroke-width="1.6"/>
  <rect x="630" y="72" width="280" height="40" rx="10" fill="#805ad5"/>
  <rect x="630" y="102" width="280" height="10" fill="#805ad5"/>
  <text x="770" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">故障③ 程序 T37 触点写反</text>

  <rect x="660" y="126" width="220" height="70" rx="6" fill="#faf5ff" stroke="#805ad5" stroke-width="1.3"/>
  <text x="674" y="146" font-size="10" fill="#553c9a">正确：Q0.1 ← AN T37（先星）</text>
  <text x="674" y="164" font-size="10" fill="#553c9a">　　　Q0.2 ← A　T37（5s后角）</text>
  <text x="674" y="184" font-size="10" fill="#c53030">错误：两处写反 → 先角后星</text>
  <text x="770" y="210" text-anchor="middle" font-size="10" fill="#805ad5">一起动即 KM3 吸合（全压起动）</text>

  <line x1="650" y1="222" x2="890" y2="222" stroke="#e2e8f0"/>
  <text x="650" y="246" font-size="11" font-weight="bold" fill="#2d3748">现象</text>
  <text x="650" y="268" font-size="10.5" fill="#4a5568">起动瞬间 KM1、KM3 得电，直接</text>
  <text x="650" y="288" font-size="10.5" fill="#4a5568">三角形全压起动，5s 后才切星形。</text>
  <text x="650" y="318" font-size="11" font-weight="bold" fill="#2d3748">判断</text>
  <text x="650" y="340" font-size="10.5" fill="#4a5568">① 监控：上电即 Q0.2=1、Q0.1=0；</text>
  <text x="650" y="360" font-size="10.5" fill="#4a5568">② 上传程序核对两处触点；</text>
  <text x="650" y="380" font-size="10.5" fill="#4a5568">③ 对照 T37 定时值确认时序。</text>
  <text x="650" y="414" font-size="11" font-weight="bold" fill="#2d3748">处理</text>
  <text x="650" y="436" font-size="10.5" fill="#2f855a">改正程序并重新下载。</text>
</svg>
