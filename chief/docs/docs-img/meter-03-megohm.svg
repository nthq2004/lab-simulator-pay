<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="820" height="540" fill="#ffffff"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2a33">图 3　手摇式兆欧表的原理、接线端与刻度</text>

  <!-- ============ 左：原理与接线 ============ -->
  <rect x="22" y="56" width="452" height="456" rx="12" fill="#f7fbf8" stroke="#5aa96f" stroke-width="1.6"/>
  <text x="248" y="82" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2e7d46">原理：手摇高压发电机 + 比率型测量机构</text>

  <!-- 手摇发电机 -->
  <circle cx="96" cy="140" r="15" fill="none" stroke="#2e7d46" stroke-width="2.4"/>
  <line x1="96" y1="140" x2="118" y2="126" stroke="#2e7d46" stroke-width="2.4"/>
  <circle cx="120" cy="125" r="5" fill="#2e7d46"/>
  <text x="96" y="172" text-anchor="middle" font-size="11.5" fill="#2e7d46">摇柄</text>
  <rect x="60" y="186" width="150" height="80" rx="10" fill="#eef7f0" stroke="#5aa96f" stroke-width="2"/>
  <text x="135" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d46">手摇直流发电机</text>
  <text x="135" y="238" text-anchor="middle" font-size="12" fill="#4a6b54">输出高压直流</text>
  <text x="135" y="256" text-anchor="middle" font-size="12" fill="#4a6b54">500 / 1000 / 2500 V</text>

  <!-- 测量机构 -->
  <rect x="72" y="300" width="130" height="70" rx="10" fill="#ffffff" stroke="#2e7d46" stroke-width="2"/>
  <text x="137" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e7d46">比率型测量机构</text>
  <text x="137" y="352" text-anchor="middle" font-size="11.5" fill="#4a6b54">（流过绝缘体的微弱电流）</text>
  <line x1="135" y1="266" x2="135" y2="300" stroke="#2e7d46" stroke-width="2"/>

  <!-- 由测量机构到 L -->
  <line x1="202" y1="335" x2="300" y2="335" stroke="#2e7d46" stroke-width="2"/>
  <circle cx="300" cy="335" r="4" fill="#2e7d46"/>
  <text x="300" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b23b3b">L</text>

  <!-- 被测绝缘（L 到地） -->
  <line x1="300" y1="335" x2="300" y2="392" stroke="#2e7d46" stroke-width="2"/>
  <rect x="288" y="392" width="24" height="52" fill="#ffffff" stroke="#2e7d46" stroke-width="2"/>
  <text x="326" y="424" text-anchor="start" font-size="11.5" fill="#4a6b54">被测绝缘电阻 R</text>
  <line x1="300" y1="444" x2="300" y2="470" stroke="#2e7d46" stroke-width="2"/>
  <!-- 接地符号 -->
  <g stroke="#2e7d46" stroke-width="2.6" fill="none">
    <line x1="282" y1="470" x2="318" y2="470"/>
    <line x1="288" y1="478" x2="312" y2="478"/>
    <line x1="294" y1="486" x2="306" y2="486"/>
  </g>

  <!-- E 端接线 -->
  <line x1="135" y1="370" x2="135" y2="430" stroke="#2e7d46" stroke-width="2"/>
  <line x1="135" y1="430" x2="300" y2="430" stroke="#2e7d46" stroke-width="2"/>
  <text x="135" y="448" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b23b3b">E</text>
  <text x="160" y="418" font-size="11" fill="#4a6b54">接设备外壳 / 地</text>

  <!-- 三端说明 -->
  <text x="248" y="502" text-anchor="middle" font-size="11.5" fill="#4a6b54">L 接导体、E 接外壳/地；G（屏蔽端）用于消除表面漏电，提高测量精度</text>

  <!-- ============ 右：表盘与三端 ============ -->
  <rect x="494" y="56" width="304" height="456" rx="12" fill="#f7f9fb" stroke="#8a97a3" stroke-width="1.6"/>
  <text x="646" y="82" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#33414d">外观：表盘、摇柄与接线柱</text>

  <!-- 表盘（反向刻度：左 ∞，右 0） -->
  <path d="M556 300 A90 90 0 0 1 736 300" fill="#ffffff" stroke="#8a97a3" stroke-width="2"/>
  <g stroke="#8a97a3" stroke-width="1.4">
    <line x1="572" y1="268" x2="566" y2="286"/>
    <line x1="600" y1="232" x2="589" y2="246"/>
    <line x1="646" y1="212" x2="646" y2="228"/>
    <line x1="692" y1="232" x2="703" y2="246"/>
    <line x1="720" y1="268" x2="726" y2="286"/>
  </g>
  <text x="560" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#33414d">∞</text>
  <text x="732" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#33414d">0</text>
  <text x="646" y="250" text-anchor="middle" font-size="11" fill="#5b6b7a">（逆向刻度：绝缘越好越靠左）</text>
  <line x1="646" y1="300" x2="600" y2="242" stroke="#d94f4f" stroke-width="2.6"/>
  <circle cx="646" cy="300" r="5" fill="#33414d"/>
  <text x="646" y="322" text-anchor="middle" font-size="11" fill="#5b6b7a">MΩ</text>

  <!-- 摇柄 -->
  <circle cx="618" cy="380" r="18" fill="#eef7f0" stroke="#2e7d46" stroke-width="2.4"/>
  <line x1="618" y1="380" x2="600" y2="360" stroke="#2e7d46" stroke-width="2.6"/>
  <text x="646" y="386" text-anchor="start" font-size="11.5" fill="#2e7d46">摇柄（约 120 r/min）</text>

  <!-- 接线柱 -->
  <rect x="560" y="430" width="172" height="64" rx="8" fill="#ffffff" stroke="#8a97a3" stroke-width="1.6"/>
  <circle cx="592" cy="462" r="8" fill="#c0392b"/><text x="592" y="488" text-anchor="middle" font-size="11" fill="#33414d">L（线）</text>
  <circle cx="646" cy="462" r="8" fill="#2b2f33"/><text x="646" y="488" text-anchor="middle" font-size="11" fill="#33414d">E（地）</text>
  <circle cx="700" cy="462" r="8" fill="#8a97a3"/><text x="700" y="488" text-anchor="middle" font-size="11" fill="#33414d">G（屏蔽）</text>

  <text x="646" y="524" text-anchor="middle" font-size="11.5" fill="#b23b3b">测绝缘前必须断电、放电，严禁带电测量</text>
</svg>
