<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="980" height="440" fill="#f7f9fb"/>
  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a252f">图 2　发电机主开关跳闸的常见原因与对应保护</text>

  <!-- 根 -->
  <rect x="380" y="58" width="220" height="48" rx="8" fill="#2c3e50"/>
  <text x="490" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">主开关（ACB）跳闸</text>

  <!-- 左侧：原动机侧 -->
  <line x1="490" y1="106" x2="490" y2="130" stroke="#7a8494" stroke-width="2"/>
  <line x1="240" y1="130" x2="740" y2="130" stroke="#7a8494" stroke-width="2"/>
  <line x1="240" y1="130" x2="240" y2="160" stroke="#7a8494" stroke-width="2"/>
  <line x1="740" y1="130" x2="740" y2="160" stroke="#7a8494" stroke-width="2"/>

  <!-- 原动机保护 -->
  <rect x="90" y="160" width="300" height="150" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text x="240" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#a5281b">原动机（柴油机）保护</text>
  <text x="110" y="214" font-size="13" fill="#333">· 冷却水温高</text>
  <text x="110" y="240" font-size="13" fill="#333">· 滑油压力低</text>
  <text x="110" y="266" font-size="13" fill="#333">· 超速</text>
  <text x="110" y="292" font-size="12" fill="#a5281b">→ 机组立即停机，主开关失压跳闸</text>

  <!-- 电气保护 -->
  <rect x="590" y="160" width="300" height="150" rx="8" fill="#eaf1fb" stroke="#1565c0"/>
  <text x="740" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">发电机电气保护</text>
  <text x="610" y="214" font-size="13" fill="#333">· 失压 / 短路（瞬时或短延时）</text>
  <text x="610" y="240" font-size="13" fill="#333">· 过载（分级卸载后跳闸）</text>
  <text x="610" y="266" font-size="13" fill="#333">· 逆功率（并联机组失去原动力）</text>
  <text x="610" y="292" font-size="12" fill="#0d47a1">→ 保护动作，主开关跳闸并锁存</text>

  <!-- 底部处理原则 -->
  <rect x="90" y="340" width="800" height="76" rx="8" fill="#f1f8e9" stroke="#558b2f"/>
  <text x="490" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#33691e">应急处理总原则：判断跳闸性质 → 先保供电（卸载 / 起动备用机组） → 再排障复位</text>
  <text x="490" y="394" text-anchor="middle" font-size="12" fill="#555">故障未排除前不得盲目强合主开关；并联机组失去原动力应重点防止逆功率与电网过载连锁跳闸</text>
</svg>
