<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="bold" fill="#102a43">常见故障判别流程（现象 → 检查 → 判断 → 处理）</text>

  <!-- 起点 -->
  <rect x="330" y="52" width="240" height="52" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="10"/>
  <text x="450" y="76" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#0d47a1">现象：库温不降 / 反而升高</text>
  <text x="450" y="96" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1565c0">（该库已处于制冷需求状态）</text>

  <line x1="450" y1="104" x2="450" y2="132" stroke="#37474f" stroke-width="2.5" marker-end="url(#a1)"/>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#37474f"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1565c0"/></marker>
  </defs>

  <!-- 检查1 -->
  <rect x="290" y="134" width="320" height="52" fill="#fff8e1" stroke="#f9a825" stroke-width="2" rx="8"/>
  <text x="450" y="158" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#8d6e00">① 看该库温度开关与供液电磁阀</text>
  <text x="450" y="178" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#8d6e00">（开关是否亮、电磁阀线圈是否红框/阀体亮绿）</text>

  <!-- 分支 A -->
  <line x1="330" y1="186" x2="180" y2="186" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="180" y1="186" x2="180" y2="216" stroke="#1565c0" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="240" y="180" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1565c0">开关灭 / 阀断电</text>
  <rect x="60" y="218" width="250" height="70" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="8"/>
  <text x="185" y="242" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#1b5e20">控制回路问题</text>
  <text x="185" y="264" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#37474f">① 控制器是否投入</text>
  <text x="185" y="282" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#37474f">② 出口截止阀/管路是否导通</text>

  <!-- 分支 B -->
  <line x1="570" y1="186" x2="720" y2="186" stroke="#c62828" stroke-width="2.5"/>
  <line x1="720" y1="186" x2="720" y2="216" stroke="#c62828" stroke-width="2.5"/>
  <text x="600" y="180" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#c62828">开关亮 / 阀通电</text>
  <rect x="595" y="218" width="250" height="70" fill="#ffebee" stroke="#c62828" stroke-width="2" rx="8"/>
  <text x="720" y="242" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#b71c1c">制冷剂侧问题</text>
  <text x="720" y="264" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#37474f">阀通电但库温不降 → 供液不足</text>
  <text x="720" y="282" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#37474f">（膨胀阀故障、滤网堵塞、缺氟）</text>

  <!-- 汇合 -->
  <line x1="185" y1="288" x2="185" y2="330" stroke="#37474f" stroke-width="2.5"/>
  <line x1="720" y1="288" x2="720" y2="330" stroke="#37474f" stroke-width="2.5"/>
  <line x1="185" y1="330" x2="720" y2="330" stroke="#37474f" stroke-width="2.5"/>
  <line x1="450" y1="330" x2="450" y2="356" stroke="#37474f" stroke-width="2.5" marker-end="url(#a1)"/>

  <!-- 两类典型故障 -->
  <rect x="60" y="360" width="360" height="96" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="8"/>
  <text x="240" y="384" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#e65100">典型：菜库膨胀阀故障</text>
  <text x="76" y="408" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#37474f">现象：温度开关接通、电磁阀通电，库温持续上升</text>
  <text x="76" y="430" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#37474f">判断：制冷剂流量极小（阀口堵塞/卡死）</text>
  <text x="76" y="450" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#37474f">处理：停机 → 检修/更换膨胀阀 → 复位重起</text>

  <rect x="480" y="360" width="360" height="96" fill="#e8eaf6" stroke="#3949ab" stroke-width="2" rx="8"/>
  <text x="660" y="384" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#283593">典型：蒸发器化霜电路故障</text>
  <text x="496" y="408" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#37474f">现象：仍在制冷，但降温极慢（不足正常 5%）</text>
  <text x="496" y="430" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#37474f">判断：蒸发器结霜、换热恶化</text>
  <text x="496" y="450" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#37474f">处理：检修化霜电路/加热器 → 除霜后恢复</text>

  <!-- 底部其它报警 -->
  <rect x="60" y="474" width="780" height="74" fill="#f7fbff" stroke="#b3d4f0" stroke-width="1.5" rx="6"/>
  <text x="74" y="498" font-family="Microsoft YaHei, sans-serif" font-size="13.5" fill="#102a43"><tspan font-weight="bold">其它常见报警与判别：</tspan></text>
  <text x="74" y="520" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#37474f">· 排出压力过高 → 冷却水中断/冷凝器结垢/系统不凝性气体 → 检查冷却水阀、清洗、放空气</text>
  <text x="74" y="540" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#37474f">· 滑油压力低 / 分离器液位高 / 低 → 缺油、油泵或回油电磁阀故障 → 补油、检修回油回路</text>
</svg>
